<script>
(function(){
"use strict";

/* ---------------- Adapt source QUIZ_DATA (groups/questions/answer)
   into the shared {meta, questions[]} shape used by this tool's shell.
   The source ships 71 course-chapter groups, which is far too fragmented
   for a top-level directory -- CLUSTER_MAP (built offline from the same
   71 names) rolls them up into 7 topic clusters, which is what actually
   renders as the sidebar's first-level directories. Each question keeps
   its original chapter name too (origGroup), shown as light context on
   the question card, so that finer structure isn't lost, just demoted
   out of the top-level nav.

   Each question's answer was pre-split offline (parse_answers.py) out of
   the source's already-formatted HTML into the same {oral, keyPoints, ...}
   shape the sibling Java tool uses, plus a "code" array (this dataset is
   Python/API-heavy, so extracted <pre><code> blocks get their own section
   instead of being flattened into prose) -- that split is what lets this
   tool render answers with the exact same 口语化答案/核心要点 look. ---------------- */
var GROUPS = (typeof QUIZ_DATA !== "undefined" && QUIZ_DATA.groups) ? QUIZ_DATA.groups : [];
var QUESTIONS = [];
GROUPS.forEach(function(g, gi){
  (g.questions||[]).forEach(function(q, qi){
    QUESTIONS.push({
      id: q.id || ("g"+gi+"_q"+q.qnum),
      question: q.qtext,
      category: (typeof CLUSTER_MAP !== "undefined" && CLUSTER_MAP[g.name]) || g.name,
      origGroup: g.name,
      answer: q.answer || {oral:"", keyPoints:[], code:[]}
    });
  });
});
var META = {
  title: "大模型应用开发面试题",
  catalogTitle: "大模型应用开发面试题库"
};

var STORE_PREFIX = "llmquiz_v1_";
function lsGet(key, fallback){
  try{
    var v = localStorage.getItem(STORE_PREFIX+key);
    if(v===null || v===undefined) return fallback;
    return JSON.parse(v);
  }catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(STORE_PREFIX+key, JSON.stringify(value)); }catch(e){}
}

/* ---------------- State ---------------- */
var state = {
  search: "",
  freqFilter: "all",
  filtered: [],
  currentId: null,
  sidebarOpen: false,
  desktopSidebarCollapsed: false,
  answerOpen: false
};

var favorites = lsGet("favorites", {});
var status = lsGet("status", {});
var catCollapsed = lsGet("catCollapsed", {});
var theme = lsGet("theme", null);

var byId = {};
QUESTIONS.forEach(function(q){ byId[q.id] = q; });

var catCounts = {};
QUESTIONS.forEach(function(q){ catCounts[q.category] = (catCounts[q.category]||0)+1; });

/* categories are the 7 rolled-up topic clusters (CLUSTER_ORDER), not the
   71 raw course chapters -- that's the actual fix for "太散了". */
var categories = (typeof CLUSTER_ORDER !== "undefined" && CLUSTER_ORDER.length) ? CLUSTER_ORDER.slice() : GROUPS.map(function(g){ return g.name; });

/* group a list of questions by category, then flatten back in the fixed
   category order above -- this is both the sidebar's rendering order and
   the actual prev/next navigation order, so the two always agree. */
function groupByCategory(list){
  var byCat = {};
  list.forEach(function(q){ (byCat[q.category] = byCat[q.category] || []).push(q); });
  var ordered = [];
  categories.forEach(function(cat){
    if(byCat[cat]) ordered = ordered.concat(byCat[cat]);
  });
  return { byCat: byCat, ordered: ordered };
}

/* ---------------- DOM refs ---------------- */
var $ = function(id){ return document.getElementById(id); };
var el = {
  app: $("app"),
  overlay: $("overlay"),
  sidebar: $("sidebar"),
  sidebarTitleText: $("sidebarTitleText"),
  closeSidebarBtn: $("closeSidebarBtn"),
  searchInput: $("searchInput"),
  freqFilterRow: $("freqFilterRow"),
  sidebarStats: $("sidebarStats"),
  sidebarListWrap: $("sidebarListWrap"),
  openSidebarBtn: $("openSidebarBtn"),
  toolTitle: $("toolTitle"),
  toolProgress: $("toolProgress"),
  randomBtn: $("randomBtn"),
  jumpBtnTop: $("jumpBtnTop"),
  darkModeBtn: $("darkModeBtn"),
  content: $("content"),
  questionCard: $("questionCard"),
  catBadge: $("catBadge"),
  favBtn: $("favBtn"),
  qTitle: $("qTitle"),
  qSubGroup: $("qSubGroup"),
  masteryBtn: $("masteryBtn"),
  toggleAnswerBtnBottom: $("toggleAnswerBtnBottom"),
  answerPanel: $("answerPanel"),
  oralSection: $("oralSection"),
  oralText: $("oralText"),
  codeSection: $("codeSection"),
  codeBlocks: $("codeBlocks"),
  keypointsSection: $("keypointsSection"),
  keypointsList: $("keypointsList"),
  followupSection: $("followupSection"),
  followupList: $("followupList"),
  pitfallSection: $("pitfallSection"),
  pitfallList: $("pitfallList"),
  backTopBtn: $("backTopBtn"),
  bottomBar: $("bottomBar"),
  prevBtn: $("prevBtn"),
  nextBtn: $("nextBtn"),
  jumpOverlay: $("jumpOverlay"),
  jumpModal: $("jumpModal"),
  jumpInput: $("jumpInput"),
  jumpConfirm: $("jumpConfirm"),
  toast: $("toast")
};

/* ---------------- Utilities ---------------- */
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function mdLite(s){
  var t = escapeHtml(s);
  // Pull code spans out first so any literal ** inside code (e.g. Python's
  // f(**kwargs)) can never be mistaken for a bold marker by the next pass.
  var codeStash = [];
  t = t.replace(/`([^`]+)`/g, function(m, code){
    codeStash.push(code);
    return "\u0000" + (codeStash.length - 1) + "\u0000";
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\u0000(\d+)\u0000/g, function(m, i){
    return "<code>" + codeStash[Number(i)] + "</code>";
  });
  return t;
}
function isDesktop(){ return window.innerWidth >= 900; }
function showToast(msg){
  el.toast.textContent = msg;
  el.toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ el.toast.classList.remove("show"); }, 2200);
}

/* ---------------- Theme ---------------- */
function applyTheme(){
  if(theme==="dark"){ document.documentElement.setAttribute("data-theme","dark"); el.darkModeBtn.textContent="☀️"; }
  else if(theme==="light"){ document.documentElement.setAttribute("data-theme","light"); el.darkModeBtn.textContent="🌙"; }
  else { document.documentElement.removeAttribute("data-theme"); el.darkModeBtn.textContent="🌗"; }
}
el.darkModeBtn.addEventListener("click", function(){
  if(theme==="dark") theme="light";
  else if(theme==="light") theme=null;
  else theme="dark";
  lsSet("theme", theme);
  applyTheme();
});

/* ---------------- Layout mode ---------------- */
function updateLayoutMode(){
  document.body.classList.toggle("desktop", isDesktop());
  if(isDesktop()){
    el.sidebar.classList.remove("open");
    el.overlay.classList.remove("show");
  }
}
window.addEventListener("resize", updateLayoutMode);

/* ---------------- Sidebar open/close ---------------- */
function openSidebar(){
  if(isDesktop()){
    state.desktopSidebarCollapsed = false;
    el.sidebar.classList.remove("collapsed");
    return;
  }
  state.sidebarOpen = true;
  el.sidebar.classList.add("open");
  el.overlay.classList.add("show");
  scrollCurrentIntoView();
}
function closeSidebar(){
  if(isDesktop()){
    return;
  }
  state.sidebarOpen = false;
  el.sidebar.classList.remove("open");
  el.overlay.classList.remove("show");
}
el.openSidebarBtn.addEventListener("click", function(){
  if(isDesktop()){
    el.sidebar.classList.toggle("collapsed");
  } else {
    openSidebar();
  }
});
el.closeSidebarBtn.addEventListener("click", closeSidebar);
el.overlay.addEventListener("click", closeSidebar);

/* swipe-to-close sidebar on mobile */
(function(){
  var sx=0, sy=0, tracking=false;
  el.sidebar.addEventListener("touchstart", function(e){
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
  }, {passive:true});
  el.sidebar.addEventListener("touchmove", function(e){
    if(!tracking) return;
    var t=e.touches[0];
    var dx=t.clientX-sx, dy=t.clientY-sy;
    if(dx<-40 && Math.abs(dx)>Math.abs(dy)){ closeSidebar(); tracking=false; }
  }, {passive:true});
  el.sidebar.addEventListener("touchend", function(){ tracking=false; });
})();

/* ---------------- Sidebar title (static, content-derived) ---------------- */
function initSidebarTitle(){
  el.sidebarTitleText.textContent = META.catalogTitle;
}

/* ---------------- Category group collapse state ----------------
   catCollapsed[cat] is only ever written by an explicit user click on a
   group header (see toggleCatCollapsed) and, once set, always wins -- that
   is what lets a group that was auto-opened (because it holds the current
   question, or because a filter is active) still be collapsed by tapping
   it, and what lets a group the user explicitly collapsed stay collapsed
   even after filtering by 收藏/已掌握 etc. Only while nothing has been
   explicitly chosen for this category do we fall back to "auto-open while
   a filter is active, otherwise auto-open the current question's group,
   otherwise start collapsed". */
function isCatCollapsed(cat){
  if(catCollapsed[cat] === true) return true;
  if(catCollapsed[cat] === false) return false;
  if(activeFilterOn()) return false;
  var cur = byId[state.currentId];
  if(cur && cur.category===cat) return false;
  return true;
}
function toggleCatCollapsed(cat){
  var collapsedNow = isCatCollapsed(cat);
  catCollapsed[cat] = collapsedNow ? false : true;
  lsSet("catCollapsed", catCollapsed);
  renderList();
}
function activeFilterOn(){
  return !!state.search || state.freqFilter!=="all";
}

/* ---------------- Search & filter ---------------- */
var searchDebounce;
el.searchInput.addEventListener("input", function(){
  clearTimeout(searchDebounce);
  var v = el.searchInput.value;
  searchDebounce = setTimeout(function(){
    state.search = v.trim().toLowerCase();
    applyFilters(true);
  }, 150);
});
el.searchInput.addEventListener("keydown", function(e){
  if(e.key==="Enter"){
    el.searchInput.blur();
    if(!isDesktop()) closeSidebar();
  }
});

el.freqFilterRow.addEventListener("click", function(e){
  var btn = e.target.closest(".chip");
  if(!btn) return;
  state.freqFilter = btn.getAttribute("data-freq");
  Array.prototype.forEach.call(el.freqFilterRow.querySelectorAll(".chip"), function(c){
    c.classList.toggle("active", c===btn);
  });
  applyFilters(true);
  if(!isDesktop()) closeSidebar();
});

function matchesFilters(q){
  if(state.customIds){ return !!state.customIds[q.id]; }
  if(state.freqFilter==="star"){
    if(!favorites[q.id]) return false;
  } else if(state.freqFilter==="mastered"){
    if(status[q.id]!=="mastered") return false;
  } else if(state.freqFilter==="unmastered"){
    if(status[q.id]==="mastered") return false;
  }
  if(state.search){
    var hay = (q.question+" "+q.category+" "+(q.origGroup||"")).toLowerCase();
    if(hay.indexOf(state.search)===-1) return false;
  }
  return true;
}

function applyFilters(resetSelection){
  var grouped = groupByCategory(QUESTIONS.filter(matchesFilters));
  state.filtered = grouped.ordered;
  state.filteredByCat = grouped.byCat;
  if(state.filtered.length===0){
    renderList();
    renderStats();
    renderEmptyMain();
    return;
  }
  hideEmptyMain();
  if(resetSelection){
    var stillIn = state.filtered.some(function(q){ return q.id===state.currentId; });
    if(!stillIn){
      goToQuestion(state.filtered[0].id, {skipHistory:true});
      return;
    }
  }
  renderList();
  renderStats();
}

function renderEmptyMain(){
  /* NOTE: previously this replaced questionCard's innerHTML, which permanently
     destroyed #qTitle/#catBadge/#favBtn/etc. (they're all children of
     questionCard) -- once any filter (search, 收藏, 已掌握 with nothing marked
     yet, etc.) produced zero results, those elements were gone from the DOM
     for good and el.* kept stale references, so question selection silently
     stopped updating anything even after the filter was cleared. Hiding the
     card instead of gutting it keeps every element alive. */
  el.questionCard.style.display = "none";
  if(!el.emptyHintAuto){
    el.emptyHintAuto = document.createElement("div");
    el.emptyHintAuto.className = "empty-hint";
    el.emptyHintAuto.style.padding = "60px 10px";
    el.emptyHintAuto.textContent = "没有找到匹配的题目，换个关键词或筛选条件试试～";
    el.content.appendChild(el.emptyHintAuto);
  }
  el.emptyHintAuto.style.display = "";
  el.toolProgress.textContent = "共 0 题";
}
function hideEmptyMain(){
  el.questionCard.style.display = "";
  if(el.emptyHintAuto) el.emptyHintAuto.style.display = "none";
}

/* ---------------- Sidebar list render ---------------- */
function renderQItemsHtml(list){
  var htmlParts = [];
  for(var i=0;i<list.length;i++){
    var q = list[i];
    var cur = q.id===state.currentId ? " current" : "";
    var star = favorites[q.id] ? '<span class="mini-badge star">★</span>' : "";
    var done = status[q.id]==="mastered" ? '<span class="mini-badge done">✓ 已掌握</span>' : "";
    htmlParts.push(
      '<li class="q-item'+cur+'" data-id="'+q.id+'">'+
        '<span class="q-item-num">'+(i+1)+'</span>'+
        '<span class="q-item-body">'+
          '<div class="q-item-text">'+escapeHtml(q.question)+'</div>'+
          '<div class="q-item-tags">'+star+done+'</div>'+
        '</span>'+
      '</li>'
    );
  }
  return htmlParts.join("");
}

function renderList(){
  var byCat = state.filteredByCat || {};
  if(state.filtered.length===0){
    el.sidebarListWrap.innerHTML = '<div class="empty-hint">没有匹配的题目</div>';
    return;
  }
  var groupParts = [];
  categories.forEach(function(cat){
    var list = byCat[cat];
    if(!list || !list.length) return;
    var collapsed = isCatCollapsed(cat);
    groupParts.push(
      '<div class="cat-group" data-cat="'+escapeHtml(cat)+'">'+
        '<div class="cat-group-title'+(collapsed?" collapsed":"")+'" data-cat="'+escapeHtml(cat)+'">'+
          '<span class="chevron">▾</span>'+
          '<span class="cat-group-name">'+escapeHtml(cat)+'</span>'+
          '<span class="cat-group-count">'+list.length+'</span>'+
        '</div>'+
        '<ul class="question-list'+(collapsed?" collapsed":"")+'">'+(collapsed ? "" : renderQItemsHtml(list))+'</ul>'+
      '</div>'
    );
  });
  el.sidebarListWrap.innerHTML = groupParts.join("");
}
el.sidebarListWrap.addEventListener("click", function(e){
  var groupTitle = e.target.closest(".cat-group-title");
  if(groupTitle){
    toggleCatCollapsed(groupTitle.getAttribute("data-cat"));
    return;
  }
  var li = e.target.closest(".q-item");
  if(!li) return;
  goToQuestion(li.getAttribute("data-id"));
  if(!isDesktop()) closeSidebar();
});

function scrollCurrentIntoView(){
  /* 手机端侧边栏关闭时不滚动：避免对不可见的长列表强制排版（打开侧边栏时再滚动） */
  if(!isDesktop() && !state.sidebarOpen) return;
  var li = el.sidebarListWrap.querySelector('.q-item[data-id="'+state.currentId+'"]');
  if(li) li.scrollIntoView({block:"center"});
}

function renderStats(){
  var total = state.filtered.length;
  var idx = state.filtered.findIndex(function(q){ return q.id===state.currentId; });
  el.sidebarStats.textContent = "共 "+total+" 题，当前第 "+(idx>=0?idx+1:0)+" 题";
  el.toolProgress.textContent = "第 "+(idx>=0?idx+1:0)+" / "+total+" 题";
}

/* ---------------- Main question render ---------------- */
function renderQuestion(q){
  el.catBadge.textContent = q.category;
  el.qTitle.textContent = q.question;
  el.qSubGroup.textContent = q.origGroup && q.origGroup !== q.category ? ("分组：" + q.origGroup) : "";

  el.favBtn.textContent = favorites[q.id] ? "★" : "☆";
  el.favBtn.classList.toggle("active", !!favorites[q.id]);

  var mastered = status[q.id]==="mastered";
  el.masteryBtn.classList.toggle("active", mastered);
  el.masteryBtn.setAttribute("aria-label", mastered ? "取消已掌握" : "标记为已掌握");

  var answer = q.answer || {};
  var oral = answer.oral || "";
  if(oral){
    el.oralSection.hidden = false;
    el.oralText.innerHTML = mdLite(oral);
  } else {
    el.oralSection.hidden = true;
  }

  var code = answer.code || [];
  if(code.length){
    el.codeSection.hidden = false;
    el.codeBlocks.innerHTML = code.map(function(c){
      var langLabel = c.lang ? '<div class="code-block-lang">'+escapeHtml(c.lang)+'</div>' : "";
      var stepsHtml = (c.steps && c.steps.length)
        ? '<ol class="code-steps">'+c.steps.map(function(s){ return "<li>"+mdLite(s)+"</li>"; }).join("")+'</ol>'
        : "";
      var codeHtml = c.keepCode
        ? langLabel+'<pre><code>'+escapeHtml(c.keepCode)+'</code></pre>'
        : "";
      return '<div class="code-block-wrap">'+stepsHtml+codeHtml+'</div>';
    }).join("");
  } else {
    el.codeSection.hidden = true;
    el.codeBlocks.innerHTML = "";
  }

  var keyPoints = answer.keyPoints || [];
  if(keyPoints.length){
    el.keypointsSection.hidden = false;
    el.keypointsList.innerHTML = keyPoints.map(function(k){
      return "<li>"+mdLite(k)+"</li>";
    }).join("");
  } else {
    el.keypointsSection.hidden = true;
    el.keypointsList.innerHTML = "";
  }

  if(answer.followUp && answer.followUp.length){
    el.followupSection.hidden = false;
    el.followupList.innerHTML = answer.followUp.map(function(f){ return "<li>"+mdLite(f)+"</li>"; }).join("");
  } else {
    el.followupSection.hidden = true;
  }

  if(answer.pitfalls && answer.pitfalls.length){
    el.pitfallSection.hidden = false;
    el.pitfallList.innerHTML = answer.pitfalls.map(function(p){ return "<li>"+mdLite(p)+"</li>"; }).join("");
  } else {
    el.pitfallSection.hidden = true;
  }

  setAnswerOpen(false);

  var idx = state.filtered.findIndex(function(x){ return x.id===q.id; });
  el.prevBtn.disabled = idx<=0;
  el.nextBtn.disabled = idx>=state.filtered.length-1 || idx===-1;
}

function setAnswerOpen(open){
  state.answerOpen = open;
  el.answerPanel.hidden = !open;
  el.toggleAnswerBtnBottom.textContent = open ? "收起答案" : "查看答案";
}
function toggleAnswer(){ setAnswerOpen(!state.answerOpen); }
el.toggleAnswerBtnBottom.addEventListener("click", toggleAnswer);

el.favBtn.addEventListener("click", function(){
  var id = state.currentId;
  if(favorites[id]) delete favorites[id]; else favorites[id]=true;
  lsSet("favorites", favorites);
  el.favBtn.textContent = favorites[id] ? "★" : "☆";
  el.favBtn.classList.toggle("active", !!favorites[id]);
  renderList();
  showToast(favorites[id] ? "已收藏" : "已取消收藏");
  if(state.freqFilter==="star") applyFilters(true);
});

el.masteryBtn.addEventListener("click", function(){
  var id = state.currentId;
  if(status[id]==="mastered"){ delete status[id]; } else { status[id]="mastered"; }
  lsSet("status", status);
  var mastered = status[id]==="mastered";
  el.masteryBtn.classList.toggle("active", mastered);
  el.masteryBtn.setAttribute("aria-label", mastered ? "取消已掌握" : "标记为已掌握");
  showToast(mastered ? "已标记为已掌握" : "已标记为未掌握");
  renderList();
  if(state.freqFilter==="mastered" || state.freqFilter==="unmastered") applyFilters(true);
});

el.catBadge.addEventListener("click", function(){
  var q = byId[state.currentId];
  if(!q) return;
  if(catCollapsed[q.category]===true){ catCollapsed[q.category]=false; lsSet("catCollapsed", catCollapsed); }
  openSidebar();
  renderList();
  scrollCurrentIntoView();
});

/* ---------------- Navigation ---------------- */
function goToQuestion(id, opts){
  opts = opts || {};
  if(!byId[id]) return;
  state.currentId = id;
  lsSet("lastId", id);
  if(!state.filtered.some(function(q){return q.id===id;})){
    var grouped = groupByCategory(QUESTIONS.filter(matchesFilters));
    state.filtered = grouped.ordered;
    state.filteredByCat = grouped.byCat;
    if(!state.filtered.some(function(q){return q.id===id;})){
      var all = groupByCategory(QUESTIONS.slice());
      state.filtered = all.ordered;
      state.filteredByCat = all.byCat;
    }
  }
  renderQuestion(byId[id]);
  renderList();
  renderStats();
  scrollCurrentIntoView();
  el.content.scrollTop = 0;
}
function stepQuestion(delta){
  var idx = state.filtered.findIndex(function(q){ return q.id===state.currentId; });
  if(idx===-1) return;
  var next = idx+delta;
  if(next<0 || next>=state.filtered.length) return;
  goToQuestion(state.filtered[next].id);
}
el.prevBtn.addEventListener("click", function(){ stepQuestion(-1); });
el.nextBtn.addEventListener("click", function(){ stepQuestion(1); });

el.randomBtn.addEventListener("click", function(){
  if(state.filtered.length===0) return;
  var r = Math.floor(Math.random()*state.filtered.length);
  goToQuestion(state.filtered[r].id);
  showToast("已随机跳转");
});

function openJumpModal(){
  el.jumpOverlay.hidden = false;
  el.jumpModal.hidden = false;
  el.jumpInput.value = "";
  el.jumpInput.focus();
}
function closeJumpModal(){ el.jumpOverlay.hidden = true; el.jumpModal.hidden = true; }
el.jumpBtnTop.addEventListener("click", openJumpModal);
el.jumpOverlay.addEventListener("click", closeJumpModal);
el.jumpConfirm.addEventListener("click", function(){
  var n = parseInt(el.jumpInput.value,10);
  if(!n || n<1 || n>state.filtered.length){
    showToast("请输入 1 - "+state.filtered.length+" 之间的题号");
    return;
  }
  goToQuestion(state.filtered[n-1].id);
  closeJumpModal();
});

/* ---------------- Keyboard shortcuts ---------------- */
document.addEventListener("keydown", function(e){
  var tag = (document.activeElement && document.activeElement.tagName) || "";
  var typing = tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT";
  if(typing){
    if(e.key==="Enter" && document.activeElement===el.jumpInput){ el.jumpConfirm.click(); }
    return;
  }
  if(e.key==="ArrowLeft"){ e.preventDefault(); stepQuestion(-1); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); stepQuestion(1); }
  else if(e.key===" "){ e.preventDefault(); toggleAnswer(); }
  else if(e.key==="Escape"){ closeJumpModal(); closeSidebar(); }
});

/* ---------------- Swipe on content ---------------- */
(function(){
  var sx=0, sy=0, tracking=false;
  el.content.addEventListener("touchstart", function(e){
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
  },{passive:true});
  el.content.addEventListener("touchend", function(e){
    if(!tracking) return; tracking=false;
    var t=e.changedTouches[0];
    var dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6){
      if(dx<0) stepQuestion(1); else stepQuestion(-1);
    }
  },{passive:true});
})();

/* ---------------- Back to top ---------------- */
el.content.addEventListener("scroll", function(){
  el.backTopBtn.hidden = el.content.scrollTop < 300;
});
el.backTopBtn.addEventListener("click", function(){
  el.content.scrollTo({top:0, behavior:"smooth"});
});

/* ---------------- Init ---------------- */
function init(){
  updateLayoutMode();
  applyTheme();
  initSidebarTitle();
  el.toolTitle.textContent = META.title;

  var grouped = groupByCategory(QUESTIONS.slice());
  state.filtered = grouped.ordered;
  state.filteredByCat = grouped.byCat;

  var lastId = lsGet("lastId", null);
  var startId = (lastId && byId[lastId]) ? lastId : (QUESTIONS[0] && QUESTIONS[0].id);
  if(startId){
    state.currentId = startId;
    renderQuestion(byId[startId]);
  }
  renderList();
  renderStats();
  scrollCurrentIntoView();
}

init();

/* ================= 知识图谱联动（自动注入，单向：图谱 -> 题库） ================= */
function updateKgBanner(){
  if(!el.kgFilterBanner) return;
  if(state.customIds){
    var n = 0; for(var k in state.customIds) n++;
    el.kgFilterBanner.style.display = "flex";
    var t = el.kgFilterBanner.querySelector(".kg-banner-text");
    if(t) t.textContent = "🕸 来自知识图谱的关联题目 · 共 " + n + " 道";
  } else {
    el.kgFilterBanner.style.display = "none";
  }
}
function applyKgFilter(ids, focusId){
  var map = {};
  (ids||[]).forEach(function(id){ map[id]=true; });
  state.customIds = map;
  state.search = "";
  if(el.searchInput) el.searchInput.value = "";
  updateKgBanner();
  applyFilters(true);
  if(focusId && byId[focusId]) goToQuestion(focusId);
  openSidebar();
}
function clearKgFilter(){
  state.customIds = null;
  updateKgBanner();
  applyFilters(true);
}
el.kgFilterBanner = document.getElementById("kgFilterBanner");
if(el.kgFilterBanner){
  el.kgFilterBanner.addEventListener("click", function(){ clearKgFilter(); });
}
el.searchInput.addEventListener("input", function(){
  if(state.customIds){ state.customIds = null; updateKgBanner(); applyFilters(true); }
});
var __kgFreqRow = document.getElementById("freqFilterRow");
if(__kgFreqRow){
  __kgFreqRow.addEventListener("click", function(){
    if(state.customIds){ state.customIds = null; updateKgBanner(); applyFilters(true); }
  });
}
window.addEventListener("message", function(e){
  var d = e.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "kg-filter"){
    applyKgFilter(d.ids, d.focusId);
  } else if(d.type === "kg-clear"){
    clearKgFilter();
  }
});

})();
</script>
