<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>大模型应用开发面试题库｜面试刷题工具</title>
<style>
:root{
  --bg:#f4f5f8;
  --bg-elevated:#ffffff;
  --bg-card:#ffffff;
  --text:#1a1d29;
  --text-secondary:#5b6072;
  --text-muted:#8a8fa3;
  --border:#e6e8f0;
  --border-strong:#d7dae6;
  --primary:#4f46e5;
  --primary-dark:#4338ca;
  --primary-soft:#eef0ff;
  --success:#12a150;
  --success-soft:#e6f7ee;
  --danger:#e0403a;
  --shadow:0 2px 12px rgba(20,22,40,.06);
  --shadow-lg:0 12px 32px rgba(20,22,40,.16);
  --radius:14px;
  --radius-sm:9px;
  --sidebar-w:300px;
  --topbar-h:56px;
  --bottombar-h:50px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="dark"]{
  --bg:#14151d;
  --bg-elevated:#1b1d28;
  --bg-card:#20222f;
  --text:#eceef5;
  --text-secondary:#a8acc0;
  --text-muted:#767b90;
  --border:#2c2f3f;
  --border-strong:#3a3d50;
  --primary:#818cf8;
  --primary-dark:#6366f1;
  --primary-soft:#26263d;
  --success:#3ecb7e;
  --success-soft:#183726;
  --danger:#f26a63;
  --shadow:0 2px 12px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#14151d;
    --bg-elevated:#1b1d28;
    --bg-card:#20222f;
    --text:#eceef5;
    --text-secondary:#a8acc0;
    --text-muted:#767b90;
    --border:#2c2f3f;
    --border-strong:#3a3d50;
    --primary:#818cf8;
    --primary-dark:#6366f1;
    --primary-soft:#26263d;
    --success:#3ecb7e;
    --success-soft:#183726;
    --danger:#f26a63;
    --shadow:0 2px 12px rgba(0,0,0,.35);
    --shadow-lg:0 12px 32px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI","Microsoft YaHei",sans-serif;
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
ul{margin:0;padding:0;list-style:none;}
input,select,button{font-size:16px;}

#app{
  display:flex;
  height:100dvh;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);
  max-width:86vw;
  background:var(--bg-elevated);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  height:100%;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:60;
  transform:translateX(-100%);
  transition:transform .25s ease;
  padding-top:var(--safe-t);
}
.sidebar.open{transform:translateX(0);}
body.desktop .sidebar{
  position:relative;
  transform:none;
  transition:width .2s ease;
  flex-shrink:0;
}
body.desktop .sidebar.collapsed{width:0;border-right:none;overflow:hidden;}

.overlay{
  position:fixed;inset:0;background:rgba(10,10,20,.45);
  z-index:55;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}
body.desktop .overlay{display:none;}

.sidebar-header{
  display:flex;align-items:center;gap:8px;
  padding:14px 14px 10px;
  border-bottom:1px solid var(--border);
}
.sidebar-title-text{
  flex:1;min-width:0;font-weight:700;font-size:15.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-width:44px;min-height:44px;
  border:none;background:transparent;color:var(--text);
  border-radius:10px;cursor:pointer;
  font-size:15px;
}
.icon-btn:active{background:var(--primary-soft);}

.sidebar-search{padding:10px 14px 0;}
.sidebar-search input{
  width:100%;height:44px;
  border:1px solid var(--border-strong);
  background:var(--bg);color:var(--text);
  border-radius:var(--radius-sm);
  padding:0 14px;
}
.sidebar-search input:focus{outline:2px solid var(--primary);outline-offset:1px;}

.sidebar-filters{padding:10px 14px 0;}
.filter-row{
  display:flex;gap:6px;flex-wrap:nowrap;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;
  margin:0 -2px;padding:2px;
}
.filter-row::-webkit-scrollbar{display:none;}
.filter-row .chip{flex:none;}
.chip{
  min-height:36px;padding:0 12px;
  border-radius:999px;border:1px solid var(--border-strong);
  background:var(--bg);color:var(--text-secondary);
  font-size:13px;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

.sidebar-stats{
  padding:10px 14px;font-size:12.5px;color:var(--text-muted);
  border-bottom:1px solid var(--border);
}

.sidebar-list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px;}
.cat-group{border-bottom:1px solid var(--border);}
.cat-group-title{
  display:flex;align-items:center;gap:6px;
  padding:12px 14px;
  font-weight:700;font-size:14px;color:var(--text-secondary);
  cursor:pointer;user-select:none;
  min-height:44px;
}
.cat-group-title:active{background:var(--primary-soft);}
.cat-group-title .chevron{transition:transform .15s ease;display:inline-block;flex-shrink:0;}
.cat-group-title.collapsed .chevron{transform:rotate(-90deg);}
.cat-group-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-group-count{font-size:12px;color:var(--text-muted);font-weight:600;}

.question-list{padding:0 8px 8px;}
.question-list.collapsed{display:none;}
.q-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:10px 8px;border-radius:10px;cursor:pointer;
  min-height:44px;
}
.q-item:active{background:var(--primary-soft);}
.q-item.current{background:var(--primary-soft);}
.q-item.current .q-item-text{color:var(--primary-dark);font-weight:600;}
.q-item-num{
  flex-shrink:0;width:26px;height:26px;border-radius:8px;
  background:var(--bg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--text-muted);margin-top:1px;
}
.q-item.current .q-item-num{background:var(--primary);border-color:var(--primary);color:#fff;}
.q-item-body{flex:1;min-width:0;}
.q-item-text{
  font-size:13.5px;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.q-item-tags{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;}
.mini-badge{
  font-size:10.5px;padding:1px 6px;border-radius:6px;font-weight:600;
}
.mini-badge.star{background:var(--success-soft);color:var(--success);}
.mini-badge.done{background:var(--primary-soft);color:var(--primary-dark);}
.empty-hint{padding:24px 14px;color:var(--text-muted);font-size:13.5px;text-align:center;}

/* ---------- Main ---------- */
.main{
  flex:1;min-width:0;height:100%;
  display:flex;flex-direction:column;
  overflow:hidden;
}
.topbar{
  height:var(--topbar-h);
  padding-top:var(--safe-t);
  display:flex;align-items:center;gap:8px;
  padding-left:10px;padding-right:10px;
  border-bottom:1px solid var(--border);
  background:var(--bg-elevated);
  flex-shrink:0;
}
.topbar-title{flex:1;min-width:0;}
.tool-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tool-progress{font-size:12px;color:var(--text-muted);}
.topbar-actions{display:flex;gap:2px;}

.content{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(var(--bottombar-h) + var(--safe-b) + 24px);
}
body.desktop .content{padding-bottom:24px;}

.question-card{
  max-width:760px;margin:0 auto;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 18px 20px;
  box-shadow:var(--shadow);
}
.q-meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;
  border:none;cursor:pointer;min-height:30px;
}
.badge.cat{background:var(--primary-soft);color:var(--primary-dark);cursor:pointer;}
.meta-actions{margin-left:auto;display:flex;align-items:center;gap:2px;}
.icon-toggle-btn{
  min-width:44px;min-height:36px;border:none;background:transparent;
  font-size:20px;cursor:pointer;color:var(--text-muted);
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-toggle-btn.star.active{color:#f5b400;}
.icon-toggle-btn.mastered.active{color:var(--success);}

.q-title{font-size:19px;line-height:1.5;margin:6px 0 4px;font-weight:700;}
.q-subgroup{font-size:12px;color:var(--text-muted);margin:0 0 14px;}

.answer-panel{margin-top:16px;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.answer-section{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 14px 12px;margin-bottom:12px;
}
.answer-section h3{margin:0 0 8px;font-size:14.5px;font-weight:700;color:var(--text);}
.oral-text{white-space:pre-wrap;font-size:15px;color:var(--text-secondary);line-height:1.85;}
.keypoints-list li{
  position:relative;padding-left:18px;margin-bottom:8px;font-size:14.5px;color:var(--text);line-height:1.6;
}
.keypoints-list li:before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--primary);}
.answer-section.optional ul li{
  padding-left:16px;position:relative;margin-bottom:7px;font-size:13.5px;color:var(--text-secondary);line-height:1.6;
}
.answer-section.optional ul li:before{
  content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;
  border-radius:50%;background:var(--text-muted);
}
.code-steps{margin:0 0 8px;}
.code-steps li{
  position:relative;padding-left:18px;margin-bottom:7px;font-size:14px;color:var(--text);line-height:1.6;
}
.code-steps li:before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--primary);}
.code-steps:last-child{margin-bottom:0;}
code{
  background:var(--primary-soft);color:var(--primary-dark);
  padding:1px 5px;border-radius:5px;font-size:.92em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  word-break:break-word;
}
strong{color:var(--text);}

/* ---------- Code example section ---------- */
.code-block-wrap{margin-bottom:10px;}
.code-block-wrap:last-child{margin-bottom:0;}
.code-block-lang{
  font-size:10.5px;color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;
}
.code-block-wrap pre{
  background:var(--bg-card);border:1px solid var(--border);
  color:var(--text);padding:14px 16px;border-radius:10px;
  overflow-x:auto;margin:0;font-size:13px;line-height:1.6;
  -webkit-overflow-scrolling:touch;
}
.code-block-wrap pre code{background:none;color:inherit;padding:0;font-size:inherit;word-break:normal;}

.back-top-btn{
  position:fixed;right:16px;
  bottom:calc(var(--bottombar-h) + var(--safe-b) + 16px);
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--bg-card);color:var(--text);box-shadow:var(--shadow-lg);
  font-size:18px;cursor:pointer;z-index:40;
}
body.desktop .back-top-btn{bottom:24px;}

/* ---------- Bottom bar ---------- */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;width:100%;box-sizing:border-box;
  height:calc(var(--bottombar-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:var(--bg-elevated);border-top:1px solid var(--border);
  display:flex;gap:6px;padding-left:8px;padding-right:8px;align-items:center;
  z-index:50;
}
body.desktop .bottom-bar{
  position:sticky;
}
.bottom-btn{
  flex:1;min-height:36px;border-radius:9px;border:none;white-space:nowrap;
  background:var(--bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
}
.bottom-btn.primary{background:var(--primary);color:#fff;flex:1.3;margin:0 8px;}
.bottom-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Jump modal ---------- */
.sheet-overlay{
  position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:80;
}
.jump-modal{
  position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--bg-elevated);border-radius:16px;padding:20px;
  width:min(320px,86vw);box-shadow:var(--shadow-lg);
}
.jump-modal .sheet-title{font-weight:700;font-size:15.5px;margin-bottom:12px;}
.jump-modal input{
  width:100%;height:46px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--bg);color:var(--text);padding:0 12px;margin-bottom:12px;text-align:center;font-size:18px;
}
.jump-modal button{
  width:100%;min-height:46px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-weight:700;
}
.toast{
  position:fixed;left:50%;bottom:calc(var(--bottombar-h) + var(--safe-b) + 24px);
  transform:translateX(-50%);
  background:rgba(20,20,30,.9);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13.5px;z-index:95;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.toast.show{opacity:1;}

/* Desktop layout tweaks */
@media (min-width:900px){
  .content{padding:22px 24px 24px;}
  .bottom-bar{
    width:100%;max-width:760px;margin:0 auto 16px;position:sticky;
    border-radius:12px;border:none;box-shadow:var(--shadow-lg);
    height:var(--bottombar-h);padding-bottom:0;
  }
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}

@media (max-width: 380px){
  .q-title{font-size:17.5px;}
  .badge{font-size:12px;padding:4px 9px;}
}
</style>
</head>
<body>

<div id="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar" aria-label="题目目录">
    <div class="sidebar-header">
      <div class="sidebar-title-text" id="sidebarTitleText"></div>
      <button class="icon-btn" id="closeSidebarBtn" aria-label="关闭目录">✕</button>
    </div>
    <div class="sidebar-search">
      <input id="searchInput" type="search" placeholder="搜索题干或分组关键词…" aria-label="搜索题目">
    </div>
    <div class="sidebar-filters">
      <div class="filter-row" id="freqFilterRow">
        <button class="chip active" data-freq="all">全部</button>
        <button class="chip" data-freq="star">★ 收藏</button>
        <button class="chip" data-freq="mastered">✅ 已掌握</button>
        <button class="chip" data-freq="unmastered">📝 未掌握</button>
      </div>
    </div>
    <div class="sidebar-stats" id="sidebarStats"></div>
    <div class="kg-filter-banner" id="kgFilterBanner" style="display:none;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;margin:0 12px 8px;border-radius:10px;background:var(--primary-soft);color:var(--primary-dark);font-size:12.5px;cursor:pointer;">
      <span class="kg-banner-text">🕸 来自知识图谱的关联题目</span>
      <span style="opacity:.7;">✕ 清除</span>
    </div>
    <div class="sidebar-list-wrap" id="sidebarListWrap"></div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" id="openSidebarBtn" aria-label="打开目录">☰ 目录</button>
      <div class="topbar-title">
        <div class="tool-title" id="toolTitle"></div>
        <div class="tool-progress" id="toolProgress"></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="randomBtn" title="随机一题" aria-label="随机一题">🎲</button>
        <button class="icon-btn" id="jumpBtnTop" title="跳转题号" aria-label="跳转题号">#</button>
        <button class="icon-btn" id="darkModeBtn" title="切换深色模式" aria-label="切换深色模式">🌙</button>
      </div>
    </header>

    <div class="content" id="content">
      <div class="question-card" id="questionCard">
        <div class="q-meta-row">
          <span class="badge cat" id="catBadge"></span>
          <div class="meta-actions">
            <button class="icon-toggle-btn star" id="favBtn" aria-label="收藏此题">☆</button>
            <button class="icon-toggle-btn mastered" id="masteryBtn" aria-label="切换掌握状态">✋</button>
          </div>
        </div>
        <h2 class="q-title" id="qTitle"></h2>
        <div class="q-subgroup" id="qSubGroup"></div>

        <div class="answer-panel" id="answerPanel" hidden>
          <section class="answer-section" id="oralSection">
            <h3>🗣️ 面试口语化答案</h3>
            <div class="oral-text" id="oralText"></div>
          </section>
          <section class="answer-section" id="codeSection" hidden>
            <h3>💻 代码示例</h3>
            <div id="codeBlocks"></div>
          </section>
          <section class="answer-section" id="keypointsSection" hidden>
            <h3>📌 核心要点（速记）</h3>
            <ul class="keypoints-list" id="keypointsList"></ul>
          </section>
          <section class="answer-section optional" id="followupSection">
            <h3>🔁 可能的追问</h3>
            <ul id="followupList"></ul>
          </section>
          <section class="answer-section optional pitfall" id="pitfallSection">
            <h3>⚠️ 常见陷阱</h3>
            <ul id="pitfallList"></ul>
          </section>
        </div>
      </div>
    </div>

    <button class="back-top-btn" id="backTopBtn" hidden aria-label="回到顶部">↑</button>

    <nav class="bottom-bar" id="bottomBar">
      <button class="bottom-btn" id="prevBtn">‹ 上一题</button>
      <button class="bottom-btn primary" id="toggleAnswerBtnBottom">查看答案</button>
      <button class="bottom-btn" id="nextBtn">下一题 ›</button>
    </nav>
  </main>
</div>

<div class="sheet-overlay" id="jumpOverlay" hidden></div>
<div class="jump-modal" id="jumpModal" hidden>
  <div class="sheet-title">跳转到第几题</div>
  <input id="jumpInput" type="number" min="1" placeholder="输入题号">
  <button id="jumpConfirm">跳转</button>
</div>

<div class="toast" id="toast"></div>

<script type="application/json" id="__data_json">{"groups":[{"name":"大模型基础与训练","questions":[{"id":"g0_q1","qnum":1,"qtext":"什么是大语言模型（LLM）？它和传统 NLP 模型的核心区别是什么？","answer":{"oral":"LLM 是基于 Transformer 架构、在海量文本上预训练得到的语言模型，通过\"预测下一个 Token\"学习语言规律和世界知识。与传统 NLP 模型的核心区别：传统 NLP 模型通常只做单一任务（分类、翻译、NER 各自训练一个模型），训练数据是万到百万级的标注数据，必须针对具体任务微调才能使用，交互方式也是固定的输入输出格式。大语言模型则完全不同：一个模型就能覆盖多种任务，训练用的是无标注的海量文本（TB 级），零样本或少样本即可完成从未专门训练过的任务，交互方式也变成了自然语言对话（Prompt）。 规模（参数量数十亿到万亿）带来了\"涌现能力\"——不做任何训练，仅靠 Prompt 就能完成没见过的任务。","keyPoints":["**定义**：基于 Transformer 架构、在海量文本上预训练，通过\"预测下一个 Token\"学习语言规律和世界知识","**传统 NLP 模型**：单一任务、需要万到百万级标注数据、必须微调才能用、交互是固定输入输出格式","**大语言模型**：一个模型覆盖多任务、用无标注海量文本训练、零/少样本即可完成新任务、交互变成自然语言对话","**涌现能力**：参数量达数十亿到万亿规模后，不训练、仅靠 Prompt 就能完成没见过的任务"],"code":[],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g0_q2","qnum":2,"qtext":"Transformer 的核心机制是什么？为什么它比 RNN 更适合训练大模型？","answer":{"oral":"核心是**自注意力机制（Self-Attention）**：序列中每个 Token 都能同时\"看到\"所有其他 Token，并根据相关性分配注意力权重，从而捕捉长距离依赖（如段落开头的主语和结尾的代词）。","keyPoints":["**可并行**：RNN 必须逐词顺序计算，Transformer 所有 Token 同时计算，训练效率高几个数量级","**无梯度消失**：RNN 长序列梯度传着传着就消失了，Transformer 任意两个位置直接相连","**可扩展**：堆更多层、更多参数，效果持续提升，这正是\"大\"模型的前提"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g0_q3","qnum":3,"qtext":"大模型训练分为哪三个阶段？每个阶段的数据、目标、产物分别是什么？","answer":{"oral":"预训练（Pre-training）阶段用的是海量无标注文本（网页、书籍、代码），目标是学习语言规律和世界知识，产物是 Base Model（只会续写）。监督微调（SFT）阶段用的是高质量的指令-回复对，目标是学会遵循指令、进行对话，产物是 Chat Model（能对话）。人类反馈强化学习（RLHF）阶段用的是人类对多个回复的排序数据，目标是让输出更安全、更符合人类偏好，产物是对齐后的最终模型。 一句话总结：预训练让模型\"有知识\"，SFT 让模型\"听话\"，RLHF 让模型\"讨人喜欢\"。","keyPoints":["**预训练**：海量无标注文本（网页/书籍/代码），学习语言规律和世界知识，产物是 Base Model（只会续写）","**SFT**：高质量指令-回复对，学会遵循指令、进行对话，产物是 Chat Model","**RLHF**：人类对多回复的排序数据，让输出更安全更符合偏好，产物是对齐后的最终模型","一句话总结：预训练让模型\"有知识\"，SFT 让模型\"听话\"，RLHF 让模型\"讨人喜欢\""],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g0_q4","qnum":4,"qtext":"\"预测下一个 Token\"这么简单的任务，为什么能学到知识甚至推理能力？","answer":{"oral":"因为要在这个任务上表现好，模型必须内化文本背后的规律：语法、事实关联、逻辑关系、代码结构等。例如预测\"法国的首都是___\"的正确答案，就必须\"知道\"这个事实；预测代码的下一个 token，就必须理解语法结构。 海量数据 × 足够大的模型 = 简单目标逼出复杂能力。这也解释了 LLM 的一个本质特征：**它是概率性的语言建模，不是确定性的数据库查询**——所以会有幻觉、会不确定。","keyPoints":["**本质**：要在\"预测下一个 Token\"上表现好，模型必须内化语法、事实关联、逻辑关系、代码结构等规律","**例子**：预测\"法国的首都是___\"必须\"知道\"事实，预测代码的下一个 token 必须理解语法结构","**公式**：海量数据 × 足够大的模型 = 简单目标逼出复杂能力","**本质特征**：LLM 是概率性的语言建模，不是确定性的数据库查询——所以会有幻觉、会不确定"],"code":[],"followUp":["能不能用一句话，给完全不懂大模型的人解释清楚这个概念？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g0_q5","qnum":5,"qtext":"Base Model 和 Chat Model 有什么区别？应用开发中应该用哪种？","answer":{"oral":"Base Model 只经过预训练，本质是\"续写文本\"——你问它\"你好\"，它很可能续写出一堆类似的问题而不是回答你；它不支持 system/user/assistant 这样的消息结构，用途主要是文本补全、研究，或者作为继续微调的起点。Chat Model（Instruct）则在预训练基础上又做了 SFT（甚至 RLHF），学会了理解指令并作答，支持 messages 多轮结构，因此才能用于对话和应用开发。 应用开发必须用 Chat Model。用 API 时通过 `deepseek-chat`、`gpt-4o` 这类名称区分，带 `-instruct`/`-chat` 的是对话模型。","keyPoints":["**Base Model**：只经过预训练，本质是续写文本，不支持 system/user/assistant 消息结构，用于文本补全、研究或继续微调的起点","**Chat Model（Instruct）**：预训练基础上又做了 SFT（甚至 RLHF），学会理解指令并作答，支持 messages 多轮结构","**应用开发必须用 Chat Model**：API 中带 -instruct/-chat 的名称即为对话模型"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g0_q6","qnum":6,"qtext":"Temperature 参数的作用是什么？0、0.7、1.5 分别适合什么场景？","answer":{"oral":"Temperature 控制采样随机性：值越低，概率分布越\"尖锐\"，越倾向于选最高概率的词；值越高，分布越\"平坦\"，低概率词也有机会被选中。具体看几个典型取值：设为 0 时，输出几乎是确定性的（相当于贪心解码），适合信息抽取、分类、结构化输出这类要求稳定可复现的场景；设为 0.7 时，输出适度多样，适合日常对话、客服这类场景；设到 1.5 时，输出会高度随机，甚至可能语无伦次，只适合创意写作、头脑风暴这类场景，而且要慎用。 工程口诀：**要稳定就调低，要创意就调高**。","keyPoints":["**原理**：值越低概率分布越尖锐，越倾向选最高概率的词；值越高分布越平坦，低概率词也可能被选中","**Temperature=0**：输出几乎确定性（相当于贪心解码），适合信息抽取、分类、结构化输出","**Temperature=0.7**：输出适度多样，适合日常对话、客服","**Temperature=1.5**：输出高度随机甚至语无伦次，只适合创意写作、头脑风暴，需慎用"],"code":[],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g0_q7","qnum":7,"qtext":"Top-P（核采样）是什么？它和 Temperature 有什么关系？","answer":{"oral":"Top-P 从概率最高的词开始累积，只在累积概率达到 P 的候选集合内采样，之外的直接排除。例如 Top-P=0.9：把候选词按概率降序累加到 0.9 为止，只在这批词里随机选。 与 Temperature 的关系：两者都控制随机性，通常**调一个就够**。区别在于 Top-P 是\"砍尾部\"（动态候选集大小），Temperature 是\"调分布形状\"（整体变尖锐/平坦）。实践中一般保持默认 Top-P=1，只调 Temperature。","keyPoints":["**原理**：从概率最高的词开始累积，只在累积概率达到 P 的候选集合内采样，之外的直接排除","**例子**：Top-P=0.9 即把候选词按概率降序累加到 0.9 为止，只在这批词里随机选","**与 Temperature 关系**：两者都控制随机性，通常调一个就够；Top-P 是\"砍尾部\"（动态候选集大小），Temperature 是\"调分布形状\"","**实践**：一般保持默认 Top-P=1，只调 Temperature"],"code":[],"followUp":["能不能用一句话，给完全不懂大模型的人解释清楚这个概念？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g0_q8","qnum":8,"qtext":"temperature=0 就能保证每次输出完全一样吗？","answer":{"oral":"不能完全保证。Temperature=0 等价于贪心解码（总选最高概率 token），在**数学上**是确定的，但工程上有额外变量： 所以对稳定性要求高的任务（抽取/分类），正确做法是 **temperature=0 + 输出校验 + 必要时重试**，而不是假设输出绝对一致。","keyPoints":["服务端 batching、浮点并行计算的非确定性，可能导致概率相近的 token 排序抖动","模型版本更新、底层硬件差异","流式场景下的微小差异"],"code":[],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g0_q9","qnum":9,"qtext":"大模型有哪些典型局限性？各有什么应对思路？","answer":{"oral":"典型局限大概有六类，每一类都有对应的工程手段来补。第一是幻觉，模型会一本正经地编造事实，应对思路是用 RAG 提供真实依据，并要求模型给出引用来源。第二是知识截止，模型不知道训练截止日期之后发生的事，这个要靠 RAG 接入实时或私有数据来解决。第三是数学与精确计算能力差，容易算错数、数错字符，这种场景应该用 Tool Calling 去调用计算器或者代码执行，而不是让模型自己硬算。第四是上下文有限，长文档一次性放不进去，应对方式是先切分再检索，也就是 RAG 那一套。第五是输出不稳定，同样的输入可能给出不同的输出，可以通过把 temperature 设成 0，再加上校验和重试机制来缓解。第六是对 prompt 很敏感，换个说法效果就可能差很多，这就需要做好 Prompt 版本管理，并且用测试集持续评估效果。 核心认知：LLM 是\"概率性语言引擎\"，工程手段（检索/工具/校验）负责把它变成可靠系统。","keyPoints":["**幻觉/知识截止**：一本正经编造事实→用 RAG 提供真实依据并要求引用来源；不知道训练截止后的事→靠 RAG 接入实时/私有数据","**数学能力差/上下文有限**：容易算错数、数错字符→用 Tool Calling 调用计算器或代码执行；长文档一次放不进去→先切分再检索（RAG）","**输出不稳定/对 Prompt 敏感**：同输入不同输出→Temperature 设为 0 加校验重试；换说法效果差很多→做好 Prompt 版本管理并用测试集持续评估","**核心认知**：LLM 是\"概率性语言引擎\"，工程手段（检索/工具/校验）负责把它变成可靠系统"],"code":[],"followUp":["能不能用一句话，给完全不懂大模型的人解释清楚这个概念？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g0_q10","qnum":10,"qtext":"什么是幻觉（Hallucination）？为什么会产生？应用层如何缓解？","answer":{"oral":"幻觉指模型输出流畅自信但与事实不符的内容。成因：模型本质是\"预测最可能的下一个词\"而不是\"检索事实\"，当训练数据中没有相关事实时，它会生成统计上合理但实际错误的文本；RLHF 还会让模型倾向于\"给出答案\"而不是承认不知道。","keyPoints":["RAG：先检索真实资料，约束模型\"只根据资料回答\"","Prompt 明确允许拒答：\"如果资料中没有答案，请回答'未找到'\"","要求引用来源，便于事后校验","对关键事实做规则/二次校验，不直接信任"],"code":[],"followUp":["能不能用一句话，给完全不懂大模型的人解释清楚这个概念？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g0_q11","qnum":11,"qtext":"什么是知识截止（Knowledge Cutoff）？为什么 RAG 是它的标准解法？","answer":{"oral":"知识截止指模型只知道训练数据截止日期之前的世界。之后的新事件、企业内部文档、个人笔记，模型统统不知道——问它只会幻觉。 RAG（检索增强生成）的解法思路：**知识不进模型，进上下文**。问答时先从外部知识库检索相关片段，把片段塞进 Prompt 再让模型作答。这样知识可以随时更新（换文档即可），无需重新训练模型，天然解决时效性和私有数据两个问题。","keyPoints":["**知识截止**：模型只知道训练数据截止日期之前的世界，之后的新事件、内部文档、个人笔记都不知道，问了会幻觉","**RAG 解法**：知识不进模型，进上下文——问答时先从外部知识库检索相关片段，塞进 Prompt 再让模型作答","**优势**：知识可随时更新（换文档即可），无需重新训练模型，天然解决时效性和私有数据两个问题"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g0_q12","qnum":12,"qtext":"应用开发者为什么通常不需要自己训练/微调模型？什么时候才需要？","answer":{"oral":"不需要训练的原因：预训练成本上亿美元；Prompt 工程 + RAG + Tool Calling 已能覆盖绝大多数应用需求——这是当前应用开发的主流范式：\"**模型能力靠 API，业务知识靠上下文**\"。 需要微调的典型信号：对特定任务有大量高质量标注数据、对输出风格有强一致要求、需要极低延迟（小模型蒸馏）、或 Prompt 无论怎么调都达不到效果。即便如此，通常也只做 SFT/LoRA 轻量微调，而不是预训练。","keyPoints":["**不需要训练的原因**：预训练成本上亿美元；Prompt 工程 + RAG + Tool Calling 已能覆盖绝大多数应用需求","**主流范式**：模型能力靠 API，业务知识靠上下文","**需要微调的信号**：有大量高质量标注数据、对输出风格有强一致要求、需要极低延迟（小模型蒸馏）、或 Prompt 怎么调都达不到效果","**即便需要**：通常也只做 SFT/LoRA 轻量微调，而不是预训练"],"code":[],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g0_q13","qnum":13,"qtext":"闭源 API 和开源模型本地部署，如何选型？","answer":{"oral":"闭源 API（GPT/Claude/DeepSeek）能力上限更高，旗舰模型持续领先，注册即可用、几分钟就能跑通，但按 Token 计费，量大之后成本相当可观，而且数据要出域，定制性也只能靠 Prompt 和参数调整。开源自部署（Qwen/Llama）能力略逊一筹但在快速逼近闭源模型，成本是一次性的 GPU 投入加上运维成本，数据完全留在内网，代价是需要具备部署和推理优化能力才能上手，好处是可以微调、量化，定制性更强。 决策顺序：先问数据是否允许出域（不允许→自部署）；再问量级（量小→API 更省）；最后问是否有特殊定制需求。","keyPoints":["**闭源 API**：能力上限更高、注册即可用几分钟跑通，但按 Token 计费量大成本可观，数据要出域，定制性只能靠 Prompt 和参数调整","**开源自部署**：能力略逊但快速逼近，成本是一次性 GPU 投入加运维，数据留在内网，需要部署和推理优化能力，可微调、量化，定制性更强","**决策顺序**：先问数据是否允许出域（不允许→自部署）；再问量级（量小→API 更省）；最后问是否有特殊定制需求"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g0_q14","qnum":14,"qtext":"选一个具体模型时，应该评估哪些维度？","answer":{"oral":"实践中，DeepSeek 兼容 OpenAI SDK、价格低、有 JSON mode，适合作为原型验证和中小项目的默认选择。","keyPoints":["**能力**：在你目标任务上的实测效果（别只看排行榜，用自己的测试集跑）","**上下文窗口**：是否放得下你的文档/历史","**成本**：输入/输出单价 × 预估调用量","**速度/延迟**：首 token 延迟、生成速度，对交互场景关键","**结构化输出支持**：是否支持 JSON mode、Tool Calling（做抽取/工具调用的前提）","**合规与稳定性**：服务区域、SLA、限流策略"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g0_q15","qnum":15,"qtext":"Zero-shot、Few-shot、In-context Learning 分别是什么？","answer":{"oral":"工程意义：示例是控制输出格式和风格的最强手段，比啰嗦的规则描述更有效；代价是示例也消耗 Token。","keyPoints":["**Zero-shot**：不给示例，直接下指令（\"把下面句子翻译成英文\"）","**Few-shot**：在 Prompt 里给几个输入输出示例，模型照着做","**In-context Learning（上下文学习）**：不更新参数，仅凭上下文中的示例就学会新任务——这是 LLM 最重要的涌现能力，Few-shot 是它最常见的用法"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g8_q2","qnum":16,"qtext":"Temperature 在数学上是怎么影响输出的？","answer":{"oral":"模型对每个候选 Token 输出一个 logits 分数，除以 Temperature 后做 softmax 得到采样概率： 理解要点：Temperature 不改变模型\"认为\"什么好（logits 不变），只改变\"照着做的确定程度\"——这也解释了为什么调高温度不会让模型变聪明，只会更随机。","keyPoints":["**T → 0**：分数差距被放大，最高分 Token 概率趋近 1 → 近似贪心，输出确定","**T = 1**：使用模型原始分布","**T > 1**：分数差距被压平，低概率 Token 也有机会 → 输出发散、有创意、甚至混乱"],"code":[{"lang":null,"steps":["模型给每个候选 Token 打出一个原始分数 logits_i","先把这个分数除以 Temperature 参数 T","再对除完的结果做 softmax 运算，归一化成概率分布","T 越接近 0，分数差距被放大，最高分 Token 的概率趋近于 1，输出趋于确定","T 越大于 1，分数差距被压平，原本低概率的 Token 也获得更多机会，输出更发散"],"keepCode":"P(token_i) = softmax(logits_i / T)"}],"followUp":["这里面你认为最关键的设计点是什么？能展开讲讲吗？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g8_q6","qnum":17,"qtext":"给一个任务，temperature 怎么选？给出决策思路。","answer":{"oral":"两条底层判断：**结果的容错空间有多大**（错了代价大 → 调低）、**多样性是不是价值本身**（要的就是不一样 → 调高）。不确定时从低往高试：随机性问题（跑偏、不稳定）永远比呆板问题（表达僵硬）更难排查。","keyPoints":["先判断任务输出是不是要交给程序直接消费，比如 JSON、分类标签、抽取结果","如果是，就把 temperature 设为 0，让稳定性压倒一切","如果不是，再判断输出是不是给用户看的内容","如果要求忠实、专业，比如摘要、改写、客服场景，就选 0.2~0.3 这个偏低区间","如果是日常对话或陪伴聊天，就选 0.7 左右","如果是文案创作或头脑风暴这类创意生成任务，就选 0.9~1.2 这个偏高区间"],"code":[],"followUp":["如果让你重新设计这部分，你会做哪些不一样的取舍？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g68_q2","qnum":18,"qtext":"私有化部署、模型微调、多模态这些方向，对 LLM 应用开发岗来说什么时候才该考虑投入？","answer":{"oral":"对纯应用开发岗来说：\"这些方向的优先级低于把 RAG / Agent 做深做稳。多数业务问题应先用'更好的 Prompt + RAG + 工具'解决，微调是最后手段。\" **关键判断点**：是否有明确的业务场景需要私有化部署/微调（数据隐私要求、成本必须大幅降低、需要行业专有能力）——如果没有这类明确需求，且 Prompt+RAG+工具的空间还没用尽，第四阶段不该是下一步的默认选项。","keyPoints":["如果 A/C/B 三条路线都已经做到能给别人演示、有数据支撑的程度，可以按需进入第四阶段","如果某条路线明显还是短板，应该继续在这条路线上加深，而不是急着往第四阶段扩展"],"code":[],"followUp":["这里面你认为最关键的设计点是什么？能展开讲讲吗？"],"pitfalls":["容易只描述做了什么，说不出设计取舍和可以改进的地方。"]}},{"id":"g71_q4","qnum":19,"qtext":"多模态模型在业务里能做什么？有什么成本和风险？","answer":{"oral":"多模态模型能同时理解图片、文档、音频甚至视频，常见的落地场景有：票据、合同、身份证这类文档的信息抽取，传统 OCR 加规则很难处理版式多变的情况，多模态模型可以直接理解版面和表格结构；商品图片的审核和打标签；客服场景里用户上传截图描述问题，模型能看懂报错截图；图表和数据可视化的理解，比如分析一张报表截图；GUI 自动化，Computer Use 这类 Agent 通过截图理解界面、定位按钮再执行点击；语音方面，实时语音对话、会议转写和纪要生成。成本方面，图片会按分辨率换算成 Token，一张高清图可能就要上千个 Token，比同等信息量的文字贵很多，所以要根据任务需要压缩分辨率、裁剪出关键区域，能先用传统 OCR 提取文字的就不要整张图喂给模型；音频和视频的成本更高，延迟也更大。风险方面：一是幻觉，模型可能会“看错”，比如把模糊的数字认错、把表格的行列对应关系搞错，在金额、证件号这类关键字段上必须做二次校验或人工复核；二是图片里可能藏着提示词注入，比如图片上写着一段“忽略之前的指令”，模型读到了就可能照做，所以图片内容同样要作为不可信的外部输入对待；三是隐私合规，图片里常常包含人脸、证件、手机号这些敏感信息，传给第三方模型之前要考虑脱敏和数据合规。","keyPoints":["场景：版式多变的文档/票据抽取、图片审核打标、截图理解、图表分析、GUI 自动化、语音对话与转写","成本：图片按分辨率换算 Token，压缩、裁剪关键区域，能 OCR 先 OCR","幻觉：关键字段（金额、证件号）需校验或人工复核","图片中可能藏提示词注入，视为不可信输入","隐私合规：人脸、证件等敏感信息需脱敏"],"code":[],"followUp":["多模态模型做文档解析和传统 OCR + 版面分析相比，怎么取舍？"],"pitfalls":["对关键金额字段不做任何校验，直接信任模型识别结果。"]}}]},{"name":"Token、上下文窗口与成本","questions":[{"id":"g1_q1","qnum":1,"qtext":"什么是 Token？中英文大概怎么换算？","answer":{"oral":"Token 是模型处理文本的最小单位，不等于\"字\"或\"词\"：常见词是一个 Token，生僻词会被拆成多个，中文一个汉字通常是 1~2 个 Token。 计费、上下文限制、max_tokens 全部以 Token 计，所以开发任何 LLM 应用都必须建立 Token 直觉。","keyPoints":["1 个英文单词 ≈ 1.3 个 Token","1 个汉字 ≈ 0.6~1 个 Token（约 1.5 个汉字/Token）","1000 个 Token ≈ 750 个英文单词 ≈ 500~700 个汉字"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g1_q2","qnum":2,"qtext":"API 为什么按 Token 计费？输入和输出为什么价格不同？","answer":{"oral":"按 Token 计费是因为计算成本与 Token 数成正比：输入要经过预填充（prefill）计算，输出要逐 Token 自回归生成。 输出更贵的原因：生成阶段（decode）是串行的——每生成一个 Token 都要把前面所有 Token 重新算一遍注意力（有 KV Cache 也仍是逐个生成），计算量远大于一次性处理输入。典型价差 2~5 倍，例如输入 ¥1/百万、输出 ¥2/百万。 对 Prompt 设计的启发：**长输入短输出**的任务（摘要）优化重点在压缩输入；**短输入长输出**的任务（扩写）要控制输出长度。","keyPoints":["**计费依据**：计算成本与 Token 数成正比，输入经预填充（prefill）计算，输出逐 Token 自回归生成","**输出更贵的原因**：生成阶段（decode）是串行的，每生成一个 Token 都要把前面所有 Token 重新算一遍注意力，计算量远大于一次性处理输入，典型价差 2~5 倍","**设计启发**：长输入短输出的任务（摘要）优化重点在压缩输入；短输入长输出的任务（扩写）要控制输出长度"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g1_q3","qnum":3,"qtext":"一次 API 调用的\"输入 Token\"由哪几部分构成？","answer":{"oral":"多轮对话中，输入不只是\"用户这次说的话\"，而是整个 messages 数组全部内容： 这是多轮对话成本高的根源：第 N 轮的输入包含前 N-1 轮的全部内容。做成本估算时必须按\"全量历史\"算，不能只算当前问题。","keyPoints":["把一次请求的输入 Token 拆成四部分来看","第一部分是 system 消息，即系统提示词","第二部分是历史对话中全部的 user 和 assistant 消息","第三部分是本轮用户刚发送的输入","第四部分是角色标记等结构带来的格式开销","四者相加就是这次调用实际计费的输入 Token 总量"],"code":[],"followUp":["能不能用一句话，给完全不懂大模型的人解释清楚这个概念？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g1_q4","qnum":4,"qtext":"为什么说多轮对话的 Token 消耗是\"平方级增长\"？","answer":{"oral":"设每轮新增约 t 个 Token。第 N 轮的输入 = 前面所有轮次累积的内容 ≈ N×t，而 N 轮总输入消耗 = t + 2t + … + Nt = t×N(N+1)/2，即 **O(N²)**。 10 轮对话的累计输入远超 10 倍单轮。这就是为什么要做历史截断、历史压缩——不只是为了不超上下文窗口，更是为了成本。","keyPoints":["**公式**：设每轮新增约 t 个 Token，N 轮总输入消耗 = t + 2t + … + Nt = t×N(N+1)/2，即 O(N²)","**结论**：10 轮对话的累计输入远超 10 倍单轮","**应对**：要做历史截断、历史压缩，不只是为了不超上下文窗口，更是为了控制成本"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g1_q5","qnum":5,"qtext":"上下文窗口是什么？它和模型训练有什么关系？","answer":{"oral":"上下文窗口是模型单次调用能处理的最大 Token 数（输入 + 输出）。例如 128K 窗口意味着 system + 历史 + 当前输入 + 生成的输出加起来不能超过约 12.8 万 Token。 它由训练方式决定：模型在训练时只见过一定长度的序列，推理时超过训练长度的位置编码没有学过，效果会急剧退化，因此硬性限制。超过窗口 API 会直接报错，应用必须自己管理历史长度。","keyPoints":["**定义**：模型单次调用能处理的最大 Token 数（输入+输出），如 128K 窗口意味着 system+历史+当前输入+输出总和不能超过约 12.8 万 Token","**由训练决定**：模型训练时只见过一定长度的序列，推理时超过训练长度的位置编码没学过，效果会急剧退化","**工程影响**：超过窗口 API 会直接报错，应用必须自己管理历史长度"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g1_q6","qnum":6,"qtext":"对话历史超出上下文窗口，有哪些处理策略？","answer":{"oral":"截断是最简单的做法——只保留最近 N 轮，优点是简单快，缺点是会丢失早期信息。滑动窗口本质相同，固定窗口大小、旧轮不断滚出，成本可控，但同样存在信息丢失的问题。历史压缩则用模型把旧历史摘要成一段塞回去，好处是保留了语义，代价是多了一次调用的成本。重写关键信息的做法是把用户姓名、目标等持续放入 system，关键信息永远不会丢，但需要先识别出\"什么才算关键\"。 实践中通常组合使用：**system 永远保留 + 最近 K 轮原文 + 更早历史压缩成摘要**。","keyPoints":["**截断**：只保留最近 N 轮，简单快，缺点是会丢失早期信息","**滑动窗口**：固定窗口大小、旧轮不断滚出，成本可控，同样存在信息丢失问题","**历史压缩**：用模型把旧历史摘要成一段塞回去，保留了语义，代价是多了一次调用成本","**重写关键信息**：把用户姓名、目标等持续放入 system 永不丢失；实践通常组合：system 永远保留+最近 K 轮原文+更早历史压缩成摘要"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g1_q7","qnum":7,"qtext":"API 响应里的 usage 字段包含什么？如何用它做成本统计？","answer":{"oral":"成本 = prompt_tokens × 输入单价 + completion_tokens × 输出单价。 工程做法：封装客户端时统一读取 usage，累计写入日志或数据库，即可得到每个功能/每个用户的真实成本——比事后看账单细得多。","keyPoints":["调用 client.chat.completions.create() 发起一次请求，拿到响应对象 resp","从 resp 里取出 usage 字段，赋值给 usage 变量","usage.prompt_tokens 记录本次请求消耗的输入 Token 数","usage.completion_tokens 记录模型生成的输出 Token 数","usage.total_tokens 是两者相加得到的合计值","把这三个数字打印出来，方便统一记录到日志或数据库做成本统计"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g1_q8","qnum":8,"qtext":"不看账单，如何快速估算一次调用的成本？","answer":{"oral":"公式：**成本 = 输入 Token × 输入单价 + 输出 Token × 输出单价** 例：输入 3000 Token + 输出 300 Token ≈ 3000×0.0000005 + 300×0.000002 ≈ ¥0.0021。养成\"调用前先心算\"的习惯，是成本意识的核心。","keyPoints":["输入：len(system) + len(全部历史) + len(当前问题)，中文按 1 字 ≈ 1 Token 保守估","输出：按任务的典型输出长度估（摘要 200、对话 300）","套单价（如 DeepSeek 输入 ¥0.5/百万、输出 ¥2/百万——以官网实时价格为准）"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g1_q9","qnum":9,"qtext":"max_tokens 参数限制的是什么？设得太小会怎样？","answer":{"oral":"它限制**本次生成的输出**最多多少 Token（不含输入）。设太小会导致回答被硬生生截断——表现为话说一半突然结束，且 `finish_reason` 为 `length` 而不是 `stop`。","keyPoints":["它是\"上限\"不是\"目标\"：设 2000 不代表输出 2000，模型说完了就停","它是控制成本/延迟的最后防线，和 Prompt 里的软约束（\"不超过 100 字\"）配合使用"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g1_q10","qnum":10,"qtext":"Token 优化的常见手段有哪些？","answer":{"oral":"优化原则：先测量（usage 统计），再优化最大的那项。","keyPoints":["**Prompt 层**：删除废话和冗余示例，指令精炼；system 不要重复每次都传的大段说明","**历史层**：截断旧轮次、压缩成摘要、及时清理无关上下文","**输出层**：明确要求简洁（\"只输出 JSON，不要解释\"）、控制 max_tokens","**模型层**：简单任务换更便宜的小模型，贵模型只用于难任务","**结构层**：能用 enum/短代码就不要让模型输出长文本描述"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g13_q1","qnum":11,"qtext":"长输入短输出和短输入长输出两类任务，成本优化的着力点分别是什么？","answer":{"oral":"判断依据是拆开看 `usage.prompt_tokens` 和 `usage.completion_tokens` 谁占大头，而不是只看 `total_tokens`。 长输入 + 短输出的场景，比如文档问答、长文摘要，成本主要由输入 Token 决定，优化方向是减少输入：更精细的文档切分、只喂检索到的相关片段、精简历史。短输入 + 长输出的场景，比如代码生成、长文写作，成本主要由输出 Token（单价通常更高）决定，优化方向是约束输出长度、拆分任务分步生成、避免模型\"自由发挥\"。长输入 + 长输出的场景，比如带大量历史的多轮技术讨论，输入和输出两者的成本都重要，需要两头同时控制，是成本最容易失控的场景。 两种场景优化方向完全不同：给\"长输入短输出\"任务加 `max_tokens` 限制收效有限（成本大头在输入），给\"短输入长输出\"任务优化历史截断也收效有限（本来就没有多轮历史）——先定位大头，再对症优化。","keyPoints":["**判断依据**：拆开看 usage.prompt_tokens 和 usage.completion_tokens 谁占大头，而不是只看 total_tokens","**长输入+短输出**（文档问答、长文摘要）：成本主要由输入 Token 决定，优化方向是减少输入（更精细切分、只喂检索到的相关片段、精简历史）","**短输入+长输出**（代码生成、长文写作）：成本主要由输出 Token（单价通常更高）决定，优化方向是约束输出长度、拆分任务分步生成","**长输入+长输出**（多轮技术讨论）：输入输出成本都重要，需两头同时控制，是最容易失控的场景"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g13_q2","qnum":12,"qtext":"如何从零设计一个用于统计和记录大模型调用成本的工具？","answer":{"oral":"核心思路：**每次调用后立即从 `response.usage` 取真实计费数字，用结构化对象记录，而不是事后凭印象估算**。","keyPoints":["**永远以 `usage` 字段为准**，不用字符数或 `tiktoken` 本地估算替代真实计费（本地估算只适合\"下单前\"的粗略预判）","用 `dataclass` 把\"一次调用的成本\"变成结构化记录，而不是散落的变量，方便后续批量汇总、写入 CSV 或接入监控看板","价格表（`PRICING`）单独维护，模型换代或平台调价时只改一处","汇总时按\"请求类型\"分组统计，能直接回答\"哪类功能最烧钱\"这种业务问题，而不是只有一个笼统的总花费数字","用字典 PRICING 单独维护每个模型的输入/输出单价（每百万 Token）","定义 CostRecord dataclass，记录 label、model、input_tokens、output_tokens，cost 字段设为 init=False，不在构造时直接传入","在 __post_init__ 里根据 model 从 PRICING 查出单价，按 input_tokens 和 output_tokens 分别乘以对应单价再除以一百万，相加算出 cost","call_and_record 函数调用 client.chat.completions.create 发起真实请求","从返回结果的 usage 字段中取出 prompt_tokens 和 completion_tokens","用这两个数字连同 label、model 构造一个 CostRecord 对象并返回，得到结构化的成本记录"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g13_q3","qnum":13,"qtext":"如何量化评估一次 Prompt 优化在\"效果提升\"和\"成本增加\"之间是否划算？","answer":{"oral":"核心思路：把\"额外付出的 Token\"和\"换来的效果提升\"做比值，而不是只看效果单方面变好了就认为优化成功。 以一组 V1→V2→V3 的 Prompt 迭代实验为例：V1→V2 增加 80 Token 换来 40 个百分点准确率提升（2.0 Token/pp），V2→V3 增加 100 Token 只换来 20 个百分点提升（5.0 Token/pp）——V1→V2 这一步性价比明显更高。 **关键判断标准不是\"哪个版本准确率最高\"，而是\"这个任务出错的业务代价有多大\"**： 这也是\"效果优化\"和\"成本优化\"两条主线的交汇点：只回答\"哪个 Prompt 更准\"还不够，还要回答\"为了更准，多花的钱划不划算\"，两者合起来才是完整的工程决策。","keyPoints":["如果是成本敏感、容错率较高的场景（如粗筛工单优先级），可能停在性价比更高的 V2 就够了","如果是错误代价很高的场景（如涉及资金损失的紧急程度判断），V3 那部分性价比更低的额外提升仍然值得付出","定义函数 cost_per_accuracy_point，接收额外消耗的 Token 数和准确率提升的百分点数","用 extra_tokens 除以 accuracy_gain_pp，得到平均每提升 1 个百分点准确率需要多花多少 Token","如果 accuracy_gain_pp 不大于 0（没有提升甚至下降），返回无穷大，表示这次改动性价比无限差"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g8_q5","qnum":14,"qtext":"“这个月 API 账单突然翻倍”，你会怎么排查？","answer":{"oral":"按 Token 公式拆解：**成本 = 调用次数 × (输入 Token × 输入价 + 输出 Token × 输出价)**，三个因子逐一排查： 预防措施：封装层统一记录 usage、按功能统计成本、给单次调用设 Token 预算。","keyPoints":["**调用次数变多？** 查日志/usage 统计——是否新功能上线、重试风暴（429 未退避）、测试跑疯了","**输入 Token 变多？** 最常见元凶：多轮对话历史无限增长（没做截断，平方级增长）；Prompt 越改越长；把整个文档塞进上下文而没用检索","**输出 Token 变多？** Prompt 没限制长度、max_tokens 放太大、要求输出解释性文字","**单价变了？** 换了更贵的模型、模型涨价"],"code":[],"followUp":["这些知识点之间是怎么串联起来、构成一条完整链路的？"],"pitfalls":["容易只描述做了什么，说不出设计取舍和可以改进的地方。"]}},{"id":"g71_q3","qnum":15,"qtext":"上下文窗口越大越好吗？长上下文有哪些成本和能力上的问题？工具定义会占用多少上下文？","answer":{"oral":"不是越大越好。窗口大意味着能放更多内容，但会带来几方面问题。成本上，输入 Token 是按量计费的，每次请求都要把整个上下文重新发一遍，多轮对话里历史越积越多，成本会快速上升；延迟上，首个 Token 的生成时间随输入长度增长，长上下文明显变慢。能力上，模型对长上下文的利用并不均匀，有著名的 Lost in the Middle 现象，放在开头和结尾的信息利用得好，放在中间的信息容易被忽略；上下文里无关的、干扰性的内容越多，模型越容易被带偏，答案质量反而下降，这叫上下文腐化。工具定义也是一个常被忽视的开销：每个工具的名字、描述、参数的 JSON Schema 都会作为上下文的一部分在每次请求时发送，一个描述详细的工具可能就要几百个 Token，接了几十个工具或者一个 MCP Server 暴露了大量工具，光工具定义就能占掉上万 Token，而且工具太多还会导致模型选错工具。应对策略：只放当前任务需要的信息，做好检索和筛选，而不是把所有东西都塞进去；关键信息放在开头或结尾；对历史对话做裁剪和摘要；工具按需动态加载，先用路由或者检索选出相关的少数工具再提供给模型；利用提示词缓存，把固定不变的系统提示和工具定义放在前面，命中缓存后成本和延迟都能大幅降低。","keyPoints":["成本：每次重发全部上下文，多轮下成本快速增长","延迟：首 Token 时间随输入长度增加","能力：Lost in the Middle、无关内容干扰导致上下文腐化","工具定义每次请求都占 Token，工具多时可达上万且易选错","策略：精选信息、关键信息放首尾、历史裁剪摘要、工具动态加载、提示词缓存"],"code":[],"followUp":["提示词缓存（Prompt Caching）的原理和使用条件是什么？"],"pitfalls":["认为窗口够大就可以不做任何检索和裁剪，把所有文档全塞进去。"]}}]},{"name":"核心概念：Embedding / RAG / Tool Calling","questions":[{"id":"g2_q1","qnum":1,"qtext":"什么是 Embedding？它是怎么表示\"语义\"的？","answer":{"oral":"Embedding 是把文本映射成一个高维向量（如 1536 维的浮点数列表），语义相近的文本在向量空间中距离也近。 关键在于：这个映射是由专门的 Embedding 模型在大规模语料上训练出来的，它学到了\"什么和什么意思接近\"。语义检索、聚类、去重、推荐都建立在它之上。","keyPoints":["把“猫在垫子上”这句话经过 Embedding 模型映射成一串浮点数向量，如 [0.12, -0.45, 0.78, ...]","把语义相近的“小猫趴在垫子上”也映射成向量，得到 [0.11, -0.43, 0.80, ...]","对比两个向量，发现数值非常接近，说明在向量空间里距离很近","再把语义无关的“今天股价大涨”映射成向量 [-0.62, 0.31, -0.15, ...]","这个向量和前两者数值差异很大，说明距离很远","由此说明 Embedding 向量之间的距离能反映文本语义的相近程度"],"code":[],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g2_q2","qnum":2,"qtext":"Embedding 语义检索和关键词检索的本质区别是什么？","answer":{"oral":"关键词检索（BM25/like）匹配依据是字面是否出现，比如用户说\"退货不想要了\"，系统搜\"退款\"就匹配不上，因为词面不同；多语言场景下中英文词不同也会直接失配；优点是可解释性高，能清楚看到命中了哪个词，而且不依赖任何模型。向量检索匹配依据是语义是否相近，\"退款\"和\"退货不想要了\"意思接近就能匹配上，跨语言语义也依然能对上；缺点是可解释性低，只能看到一个相似度分数，而且必须依赖 Embedding 模型才能工作。 本质区别：关键词比较**符号**，向量比较**意思**。生产系统常两者混合（混合检索）取长补短。","keyPoints":["**关键词检索**：依据字面是否出现匹配，词面不同（如\"退货不想要了\"搜不到\"退款\"）或跨语言就会失配；优点是可解释性高、不依赖模型","**向量检索**：依据语义是否相近匹配，近义词、跨语言语义都能对上；缺点是可解释性低（只有相似度分数）、必须依赖 Embedding 模型","**本质区别**：关键词比较符号，向量比较意思；生产系统常两者混合检索取长补短"],"code":[],"followUp":["能不能用一句话，给完全不懂大模型的人解释清楚这个概念？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g2_q3","qnum":3,"qtext":"向量之间的相似度怎么计算？为什么常用余弦相似度？","answer":{"oral":"RAG 通常用余弦相似度，因为 Embedding 模型训练时优化的就是方向上的语义一致性；文本长短不同带来的向量模长差异不应影响\"语义是否相近\"的判断。","keyPoints":["**余弦相似度**：比较两个向量夹角，只看方向不看长度，取值 [-1, 1]","**内积（点积）**：既看方向也看模长，向量归一化后与余弦等价","**L2 距离（欧氏距离）**：空间中直线距离，越小越相似"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g2_q4","qnum":4,"qtext":"RAG 是什么？它解决了大模型的哪些问题？","answer":{"oral":"RAG（Retrieval-Augmented Generation，检索增强生成）= 先检索、后生成：用户提问 → 从知识库检索相关片段 → 把片段和问题一起交给模型 → 模型基于片段作答。 一句话：**模型负责理解和表达，知识库负责事实**。","keyPoints":["**知识截止**：接入最新数据，无需重训模型","**私有数据**：企业文档、个人笔记不在训练集里，靠检索注入","**幻觉**：约束模型\"只根据资料回答\"，有据可依","**可溯源**：答案能标注来自哪篇文档"],"code":[],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g2_q5","qnum":5,"qtext":"RAG 的离线构建和在线问答两个阶段分别做什么？为什么要分开？","answer":{"oral":"**离线阶段**（一次性/定期）：加载文档 → 清洗 → 切分成 Chunk → 每个 Chunk 生成 Embedding → 存入向量库。 **在线阶段**（每次提问）：问题 → Embedding → 向量库检索 Top-K 相似 Chunk → 拼进 Prompt → 模型生成答案。 分开的原因：文档向量化是重操作（耗时、花钱），但结果可复用；问答是轻操作，要求低延迟。如果每次问答都重新向量化全部文档，成本和延迟都不可接受。两者通过\"向量库\"这个中间产物解耦。","keyPoints":["**离线阶段**（一次性/定期）：加载文档→清洗→切分成 Chunk→每个 Chunk 生成 Embedding→存入向量库","**在线阶段**（每次提问）：问题→Embedding→向量库检索 Top-K 相似 Chunk→拼进 Prompt→模型生成答案","**为何分开**：文档向量化是重操作（耗时耗钱）但结果可复用，问答是轻操作要求低延迟；两者通过\"向量库\"这个中间产物解耦"],"code":[],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g2_q6","qnum":6,"qtext":"为什么不把整个知识库直接塞进上下文，而要走 RAG 检索？","answer":{"oral":"RAG 用\"检索最相关的几百 Token\"替代\"全量塞入\"，同时解决容量、成本、质量、速度四个问题。","keyPoints":["**放不下**：知识库动辄几十万字，再大的窗口也有极限","**太贵**：每次问答都按全量输入计费，100 万 Token 的库问 100 次就是 1 亿 Token 输入","**效果差**：Lost in the Middle——大量无关内容稀释注意力，准确率反而下降","**太慢**：输入越长延迟越高"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g2_q7","qnum":7,"qtext":"RAG 和微调（Fine-tuning）分别适合什么场景？","answer":{"oral":"RAG 改变的是模型看到的上下文，而不是模型参数本身，它擅长注入事实知识并且可以溯源；知识更新只需要换文档就立即生效，成本也低，只需要做向量化；而且可解释性好，能明确引用信息来源。微调改变的是模型参数，擅长的是改变风格、格式这类行为习惯；知识更新则需要重新训练，成本高（要准备数据、要训练），并且是黑盒，可解释性差。 经验法则：**知识问题用 RAG，行为问题用微调**；两者还能组合（微调让模型更擅长利用检索结果）。绝大多数应用从 RAG 起步。","keyPoints":["**RAG**：改变模型看到的上下文而非参数本身，擅长注入事实知识并可溯源，知识更新只需换文档即时生效、成本低、可解释性好","**微调**：改变模型参数，擅长改变风格/格式等行为习惯，知识更新需重新训练、成本高，且是黑盒、可解释性差","**经验法则**：知识问题用 RAG，行为问题用微调；两者可组合，绝大多数应用从 RAG 起步"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g2_q8","qnum":8,"qtext":"Tool Calling 是什么？模型是如何\"调用\"工具的？","answer":{"oral":"Tool Calling 让模型在需要时输出一个结构化的\"工具调用请求\"（函数名 + JSON 参数），由应用代码执行该函数，再把结果回传给模型继续生成。 关键认知：**模型自己不执行任何代码**，它只是根据工具的名称和参数描述，决定\"要不要调、怎么调\"，产出的是一段结构化意图： 真正的执行者是你的 Python 程序。模型扮演\"决策者\"，应用扮演\"执行者\"。","keyPoints":["模型判断需要查天气后，不直接给出回答，而是输出一个结构化对象","对象里的 name 字段给出要调用的函数名 get_weather","arguments 字段是一段 JSON 字符串，里面装着调用该函数需要的参数，比如 city 为“北京”","这个结构化对象本身不是执行结果，只是模型发出的调用请求，交给应用代码去解析和执行"],"code":[],"followUp":["能不能用一句话，给完全不懂大模型的人解释清楚这个概念？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g2_q9","qnum":9,"qtext":"既然模型不能执行函数，为什么还说它\"会调用工具\"？","answer":{"oral":"因为模型完成了调用中最难的部分——**理解与决策**：从自然语言里识别意图、选择正确的工具、把口语化需求转成符合参数 Schema 的结构化数据。 \"会调用\"指的是会发起和利用调用，而不是亲自执行。","keyPoints":["用户提问“北京今天多少度？”","模型不直接回答，而是输出一个 tool_call，内容是 get_weather({\"city\": \"北京\"})，这一步是模型在做决策","应用代码接到这个调用请求，真正执行 get_weather 函数，得到结果 {\"temp\": 32}","应用把这个真实结果重新塞回给模型，这一步是代码在回填数据","模型基于回填的结果生成最终自然语言回复“北京今天32度。”，这一步才是模型在表达"],"code":[],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g2_q10","qnum":10,"qtext":"Tool Calling 和 Agent 是什么关系？","answer":{"oral":"Tool Calling 是**基础能力**：单次或多次地决定并发起工具调用。Agent 是**系统形态**：以 LLM 为大脑，围绕目标自主规划——决定下一步做什么、调用哪个工具、根据结果继续或结束，循环往复直到完成任务。 Agent 的每一次具体动作几乎都依赖 Tool Calling，但只有 Tool Calling 没有规划循环，还构不成 Agent。","keyPoints":["把 Tool Calling 类比成“手”的一次动作——拿起某个工具，把参数传给它","把 Agent 类比成“大脑+手+循环”——先自主判断该用哪只手，再决定什么时候停下来","由此说明 Tool Calling 只是一次具体的调用动作，而 Agent 是围绕目标反复决策、反复调用的完整系统"],"code":[],"followUp":["能不能用一句话，给完全不懂大模型的人解释清楚这个概念？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g2_q11","qnum":11,"qtext":"怎么让大模型回答公司内部文档的问题？请给出一个完整的基础方案。","answer":{"oral":"标准答案就是 RAG，按两阶段展开： **离线构建**：收集公司文档 → 清洗切分成 Chunk → 调 Embedding API 生成向量 → 存入向量库（前期用 JSON/NumPy 本地向量库即可）。 **在线问答**：用户提问 → 问题向量化 → 余弦相似度检索 Top-K（如 3 个）Chunk → 拼装 Prompt（\"只根据以下资料回答，资料中没有就说不知道\"）→ 调 Chat 模型生成答案 → （加分项）附上引用来源。 再补充权衡：数据敏感不能出域时换本地开源模型；并说明为什么不微调——知识更新频繁、需要溯源、成本高。","keyPoints":["**离线构建**：收集公司文档→清洗切分成 Chunk→调 Embedding API 生成向量→存入向量库（前期用 JSON/NumPy 本地向量库即可）","**在线问答**：用户提问→问题向量化→余弦相似度检索 Top-K（如 3 个）Chunk→拼装 Prompt（只根据资料回答，没有就说不知道）→调 Chat 模型生成答案→（加分项）附引用来源","**权衡**：数据敏感不能出域时换本地开源模型；不微调的理由是知识更新频繁、需要溯源、成本高"],"code":[],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}}]},{"name":"Python 工程基础","questions":[{"id":"g3_q1","qnum":1,"qtext":"为什么大模型开发项目必须使用虚拟环境？","answer":{"oral":"虚拟环境为每个项目创建独立的 Python 包目录，实现**依赖隔离**： LLM 应用依赖迭代很快（SDK 版本频繁变更），没有虚拟环境的项目迟早陷入\"在我机器上能跑\"的困境。标准做法：每个项目一个 `.venv`，且 `.venv/` 加入 `.gitignore` 不提交。","keyPoints":["项目 A 需要 `openai==1.30`、项目 B 需要 `openai==1.50`，全局安装必然冲突","全局装一堆包后，`pip` 升级互相牵连，坏了不知道谁弄坏的","虚拟环境可以完整删除重建，环境永远可复现"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g3_q2","qnum":2,"qtext":"venv 怎么创建和激活？不同操作系统有什么差异？","answer":{"oral":"激活后命令行前缀出现 `(.venv)`，此时 `pip install` 只装进本环境。差异点：Windows 的脚本在 `Scripts/` 目录，类 Unix 在 `bin/` 目录；PowerShell 首次执行可能被执行策略拦（`Set-ExecutionPolicy -Scope CurrentUser RemoteSigned`）。退出用 `deactivate`。","keyPoints":["**激活标志**：激活后命令行前缀出现 `(.venv)`，此时 `pip install` 只装进本环境","**系统差异**：Windows 脚本在 `Scripts/` 目录，类 Unix 在 `bin/` 目录","**PowerShell**：首次执行可能被执行策略拦（需 `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned`）","**退出**：用 `deactivate` 退出虚拟环境"],"code":[{"lang":"bash","steps":["先用 python -m venv .venv 在当前目录创建一个独立的虚拟环境，这一步在各操作系统上命令相同","激活环境时，Windows PowerShell 下执行 .venv\\Scripts\\Activate.ps1","Windows CMD 下执行 .venv\\Scripts\\activate.bat","macOS / Linux 下执行 source .venv/bin/activate","激活后命令行前缀会出现 (.venv) 标记，后续 pip install 只会装进这个独立环境","退出虚拟环境时统一执行 deactivate"],"keepCode":"python -m venv .venv\n# Windows PowerShell: .venv\\Scripts\\Activate.ps1\n# macOS/Linux: source .venv/bin/activate"}],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g3_q3","qnum":3,"qtext":"requirements.txt 的作用是什么？如何生成和使用？","answer":{"oral":"作用：声明项目依赖清单，让任何人在任何机器上用一条命令还原环境。 实践建议：手工维护顶层依赖并锁定版本（如 `openai==1.30.0`），比 `pip freeze` 全量导出更可读；配合 `.venv` 不提交，只提交 requirements.txt。","keyPoints":["**作用**：声明项目依赖清单，让任何人在任何机器上用一条命令还原环境","**生成**：`pip freeze > requirements.txt` 导出当前环境全量快照，含手动安装的包和间接依赖","**使用**：新机器执行 `pip install -r requirements.txt`，按包名和版本号逐个安装还原一致环境","**实践建议**：手工维护顶层依赖并锁定版本（如 `openai==1.30.0`）比全量导出更可读；`.venv` 不提交，只提交 requirements.txt"],"code":[{"lang":"bash","steps":["执行 pip freeze > requirements.txt，把当前环境里所有已装的包连同版本号导出成一个文件","这个命令导出的是全量快照，包含手动安装的包和它们间接依赖的包","在新机器或新环境里执行 pip install -r requirements.txt","pip 按文件里列出的包名和版本号逐个安装，还原出一致的依赖环境"],"keepCode":"pip freeze > requirements.txt\npip install -r requirements.txt"}],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g3_q4","qnum":4,"qtext":"列表和字典在大模型应用开发中分别有哪些典型用法？","answer":{"oral":"高频组合就是\"列表套字典\"：messages 是列表，每个元素是字典。","keyPoints":["`messages` 消息历史：`[{\"role\": \"system\", ...}, ...]`，逐轮 append","抽取结果中的数组字段：`\"skills\": [\"Python\", \"Django\"]`","检索返回的 Chunk 列表、批量任务的输入队列","单条消息本身、API 响应解析后的 JSON 对象","抽取任务的字段定义：`{\"name\": \"姓名\", \"email\": \"邮箱\"}`","配置管理：`config = {\"model\": \"deepseek-chat\", \"temperature\": 0.3}`"],"code":[],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g3_q5","qnum":5,"qtext":"拼接 Prompt 为什么推荐用 f-string？相比 % 或 format 有什么优势？","answer":{"oral":"Prompt 是需要反复调试打磨的核心资产，可读性直接决定迭代速度。多行长 Prompt 用三引号 f-string，变量插值让\"模板\"和\"数据\"分离，也便于做成函数参数。","keyPoints":["**可读性最好**：变量直接嵌在文本里，Prompt 长什么样一目了然","**不易出错**：不用数 `%s` 占位符个数，改文案不会错位","**支持表达式**：`f\"摘要不超过{max_len}字\"`、`f\"{'、'.join(items)}\"` 都行"],"code":[{"lang":"python","steps":["用三重引号加 f 前缀写一个多行 Prompt 模板","在字符串中间直接嵌入 {user_input} 变量，把用户输入插值进模板里","f-string 在运行时自动把变量替换成实际内容，拼出完整的 Prompt 文本"],"keepCode":"prompt = f\"请把以下用户留言分类为投诉/咨询/建议：\\n{user_input}\\n只输出类别名。\""}],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g3_q6","qnum":6,"qtext":"用 with open 读文件时，为什么要显式指定 encoding？","answer":{"oral":"不指定时 Python 用系统默认编码——Windows 上是 GBK，Linux/macOS 是 UTF-8。同一个脚本读同一个文件，在 Windows 上可能直接 `UnicodeDecodeError`，或者中文读出来是乱码。 LLM 应用的文本几乎全是 UTF-8（API、JSON、Markdown），所以**读写文件永远显式写 `encoding=\"utf-8\"`**，这是跨平台正确性的最低成本保险。","keyPoints":["**默认编码问题**：不指定 encoding 时用系统默认编码，Windows 是 GBK，Linux/macOS 是 UTF-8","**风险**：同一脚本读同一文件在 Windows 上可能直接 `UnicodeDecodeError`，或中文读出来是乱码","**最佳实践**：LLM 应用的文本几乎全是 UTF-8（API/JSON/Markdown），读写文件永远显式写 `encoding=\"utf-8\"`"],"code":[{"lang":"python","steps":["调用 open() 打开文件时，在参数里显式传入 encoding=\"utf-8\"","用 with 语句包裹，确保文件用完后自动关闭","调用 f.read() 把文件内容按 UTF-8 编码解码成字符串，赋值给 text"],"keepCode":"with open(\"data.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()"}],"followUp":["如果面试官继续追问底层原理，你还能再往下讲多深？"],"pitfalls":["容易把\"记住了结论\"当成\"理解了原理\"，一被追问为什么就说不下去。"]}},{"id":"g3_q7","qnum":7,"qtext":"try / except / finally 的执行顺序和各自用途？","answer":{"oral":"顺序：try 出错 → 跳到第一个匹配的 except → 最后必执行 finally。 LLM 应用要点：**except 要捕获具体异常类型**（限流、超时、JSON 解析错误分别处理），避免裸 `except:` 把 bug 也吞掉；重试逻辑放在对应的 except 分支里。","keyPoints":["**执行顺序**：try 出错→跳到第一个匹配的 except→最后必执行 finally","**异常处理要点**：except 要捕获具体异常类型（限流、超时、JSON 解析错误分别处理），避免裸 `except:` 把 bug 也吞掉","**重试逻辑**：放在对应的 except 分支里"],"code":[{"lang":"python","steps":["把可能出错的代码放进 try 块，比如调用 call_api(prompt)","如果抛出 RateLimitError，就进入对应的 except 分支，执行 sleep 后重试","如果抛出的是其他类型的异常，则落入兜底的 except Exception 分支，先记录日志再重新抛出","无论上面哪个分支被触发，还是完全没出错，最后都会执行 finally 块里的 cleanup()"],"keepCode":"try:\n    result = call_api(prompt)\nexcept RateLimitError as e:\n    time.sleep(2); retry()\nexcept Exception as e:\n    log(e); raise\nfinally:\n    cleanup()"}],"followUp":["如果换成一个开源模型（比如 Llama、Qwen），这个结论还成立吗？"],"pitfalls":["容易把模型的能力和工程实现混为一谈，理论和代码是两回事。"]}},{"id":"g3_q8","qnum":8,"qtext":"调用大模型 API 时，应该区分处理哪些异常？","answer":{"oral":"需要区分处理的异常大概有五类。第一类是 AuthenticationError，含义是 Key 无效或过期，处理策略是立即失败、提示检查配置，**不重试**；第二类是 RateLimitError（429），含义是请求过快或超配额，处理策略是 sleep 后重试，用指数退避；第三类是 APITimeoutError，含义是请求超时，处理策略是可重试 1~2 次，同时检查网络；第四类是 BadRequestError，含义是参数错误（比如超出上下文长度），处理策略是修正参数，**不盲目重试**；第五类是 json.JSONDecodeError，含义是模型输出不是合法 JSON，处理策略是加格式约束后重新请求。 分类原则：**环境问题（Key/参数）快速失败，瞬时问题（限流/超时）重试，模型输出问题改约束**。","keyPoints":["**环境问题（不重试）**：AuthenticationError（Key 无效或过期）立即失败，提示检查配置","**瞬时问题（重试）**：RateLimitError（429，请求过快/超配额）sleep 后指数退避重试；APITimeoutError（超时）可重试 1~2 次并检查网络","**输出问题（改约束）**：BadRequestError（参数错误，比如超上下文长度）需修正参数不盲目重试；json.JSONDecodeError（输出非法 JSON）需加格式约束后重新请求","**分类原则**：环境问题快速失败，瞬时问题重试，模型输出问题改约束"],"code":[],"followUp":["这个知识点在工程落地时具体会用在哪个环节？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}},{"id":"g3_q9","qnum":9,"qtext":"pathlib 相比 os.path 好在哪里？在 LLM 项目里怎么用？","answer":{"oral":"优势：面向对象（方法链 `f.parent / \"x.txt\"`）、跨平台分隔符自动处理、`read_text`/`write_text` 一步完成读写、glob 遍历优雅。 LLM 项目典型场景：批量读取知识库文档（`glob(\"*.pdf\")`）、管理输出目录（`mkdir(exist_ok=True)`）、拼接数据路径——RAG 的文档加载器几乎都靠它。","keyPoints":["用 from pathlib import Path 导入 Path 类","用 Path(\"data/docs\") 构造出一个路径对象 docs，而不是普通字符串","调用 docs.glob(\"*.txt\") 遍历该目录下所有 txt 文件","对每个文件对象 f，直接调用 f.read_text(encoding=\"utf-8\") 一步读出文本内容","用 Path(\"output\") 构造输出目录对象，再调用 out.mkdir(exist_ok=True) 创建目录，目录已存在时不会报错"],"code":[],"followUp":["能不能用一句话，给完全不懂大模型的人解释清楚这个概念？"],"pitfalls":["容易只会打比方，说不出准确定义，一问细节就露怯。"]}}]},{"name":"LLM API 调用与客户端封装","questions":[{"id":"g4_q1","qnum":1,"qtext":"一次 HTTP 请求的基本结构是什么？LLM API 调用里各部分对应什么？","answer":{"oral":"四要素：方法（LLM API 都是 POST，因为要传大请求体且是\"动作\"不是\"取资源\"）、URL（端点路径）、请求头（认证 + 内容类型）、请求体（JSON 参数）。 用 SDK 时这些被封装了，但排错时（抓包、curl 复现、看报错）必须看得懂原始结构。","keyPoints":["请求行给出方法 POST 和目标 URL https://api.deepseek.com/chat/completions","请求头里的 Authorization: Bearer sk-xxxx 用于身份鉴权","请求头里的 Content-Type: application/json 声明请求体的数据格式","请求体是一段 JSON，包含 model 和 messages 等具体参数"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g4_q2","qnum":2,"qtext":"API Key 为什么不能硬编码在代码里？正确的管理方式是什么？","answer":{"oral":"硬编码的风险：提交到 Git 就永久进入历史（删掉也能翻出来）、分享代码即泄漏 Key、换 Key 要改代码。Key 泄漏轻则被盗刷账单，重则数据泄露。 标准方案：**`.env` 文件 + `python-dotenv` + `.gitignore`**： `.gitignore` 写入 `.env`；仓库里放一份 `.env.example`（只有字段名没有值）供他人参照配置。","keyPoints":["把密钥单独写在 .env 文件里，格式是 DEEPSEEK_API_KEY=sk-xxxx，这个文件不提交到 Git","在代码里从 dotenv 库导入 load_dotenv","调用 load_dotenv() 把 .env 文件的内容读入当前进程的环境变量","调用 os.getenv(\"DEEPSEEK_API_KEY\") 从环境变量里取出密钥，赋值给 api_key，供后续初始化客户端使用"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g4_q3","qnum":3,"qtext":"HTTP 状态码 401、404、429、500 分别代表什么？LLM 调用中如何应对？","answer":{"oral":"具体到几个常见状态码：401 表示未授权，通常是 Key 错误或失效，应对办法是检查 .env，而且不可重试；404 表示资源不存在，一般是 URL 或模型名写错了，要检查 base_url 和 model 配置；429 表示请求过多，也就是触发了限流，应对办法是等待后重试，用指数退避；500 表示服务器错误，属于服务端瞬时故障，可以重试，但如果持续出现就要去看官方状态页了。 记忆框架：4xx 是**你的问题**（改请求），5xx 是**服务的问题**（可重试）。其中 429 特殊——你的请求没错，只是太快了。","keyPoints":["**401**：未授权，通常是 Key 错误或失效，检查 .env，不可重试","**404**：资源不存在，一般是 URL 或模型名写错，检查 base_url 和 model 配置","**429**：请求过多触发限流，等待后重试，用指数退避","**500**：服务器错误，属于服务端瞬时故障，可重试，持续出现就要看官方状态页"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g4_q4","qnum":4,"qtext":"遇到 429 限流，什么是指数退避重试？为什么比固定间隔好？","answer":{"oral":"指数退避 = 每次失败后等待时间翻倍。 批量任务（几百条数据抽取）必备：加上最大重试次数上限，超过后记录失败继续下一条，别让一条卡死整批。","keyPoints":["轻微超限时第一次重试大概率就成功，不必白等","严重超限/服务过载时，固定间隔会持续撞墙，指数退避自动\"让路\"","避免大量客户端同步重试形成\"重试风暴\"","用 for attempt in range(5) 最多尝试 5 次","在 try 块里调用 call_api()，如果成功就直接 return 结果","如果捕获到 RateLimitError，就按 2 的 attempt 次方计算等待秒数，即 1、2、4、8……依次翻倍","调用 time.sleep(wait) 等待相应时间后，进入下一次循环重试"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g4_q5","qnum":5,"qtext":"用官方 SDK 和直接 requests.post 调 API，各有什么优劣？","answer":{"oral":"SDK（如 openai 库）上手简单，对象化调用，内置了异常类型、自动重试也可以配置，流式输出直接给了现成的迭代器，缺点是需要额外引入一个包，而且屏蔽了协议细节，不利于理解底层原理。裸 HTTP（requests）则要自己拼 JSON、处理序列化，错误处理需要手写所有分支，流式输出也要自己解析 SSE 数据流，好处是基础库已经自带、不需要额外依赖，而且每个字段都看得见，能彻底搞懂协议细节。 结论：正式项目一律 SDK；但**值得用 requests 手写一次**，把请求结构、鉴权、响应格式彻底搞懂，之后再用 SDK 就不懵了。","keyPoints":["**SDK（如 openai 库）**：上手简单、对象化调用，内置异常类型和可配置自动重试，流式输出有现成迭代器；缺点是需额外引入依赖、屏蔽协议细节","**裸 HTTP（requests）**：要自己拼 JSON、处理序列化，错误处理需手写所有分支，流式输出要自己解析 SSE；优点是基础库自带不需额外依赖，每个字段都看得见","**结论**：正式项目一律用 SDK，但值得用 requests 手写一次，把请求结构、鉴权、响应格式彻底搞懂"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g4_q6","qnum":6,"qtext":"base_url 参数是干什么的？为什么换一行配置就能从 OpenAI 切到 DeepSeek？","answer":{"oral":"`base_url` 指定 SDK 请求的服务器地址。因为 DeepSeek 等国内厂商**兼容 OpenAI 的接口协议**（路径、请求格式、响应结构、SDK 都通用），SDK 只是把请求发往不同的 base_url 而已。 这就是\"OpenAI 兼容生态\"：一套代码，改 base_url + api_key + model 三个字符串即可切换厂商——也是封装统一 client 的价值所在（换模型只改配置）。","keyPoints":["从 openai 包导入 OpenAI 类","实例化 OpenAI 客户端时，api_key 参数从环境变量 DEEPSEEK_API_KEY 里读取","base_url 参数指定为 https://api.deepseek.com，把请求目标换成 DeepSeek 的服务器地址","因为 DeepSeek 接口兼容 OpenAI 协议，所以只改这一个地址参数，其余调用代码完全不用变"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g4_q7","qnum":7,"qtext":"chat.completions.create 的核心参数有哪些？各自管什么？","answer":{"oral":"最核心的是 model + messages（决定\"说什么\"）；temperature 和 max_tokens 控制输出行为；response_format 和 stream 是结构化输出与交互体验的开关。","keyPoints":["调用 client.chat.completions.create()，传入 model 参数指定用哪个模型","传入 messages 参数，给出包含 system 在内的完整对话历史","传入 temperature 参数控制输出的随机性","传入 max_tokens 参数限制输出的最大长度","传入 response_format={\"type\": \"json_object\"} 强制模型输出合法 JSON","传入 stream 参数决定是否用流式方式返回结果"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g4_q8","qnum":8,"qtext":"API 响应结构长什么样？为什么取内容要写 choices[0].message.content？","answer":{"oral":"`choices` 是列表，因为历史原因协议支持一次生成 n 个候选（`n` 参数，默认 1），所以取第一个 `choices[0]`；`message` 里除 `content` 外还有 `role`，做多轮对话时要**整个 message 对象**追加回历史，而不是只存文本。","keyPoints":["通过 resp.choices[0].message.content 取出第一个候选结果里的回复文本","通过 resp.choices[0].finish_reason 判断结束原因，stop 表示正常结束，length 表示被截断","通过 resp.usage.prompt_tokens 和 resp.usage.completion_tokens 分别取出输入和输出的 Token 数","通过 resp.model 查看这次请求实际使用的模型名称"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g4_q9","qnum":9,"qtext":"为什么要封装统一的 client 模块？好的封装应该包含什么？","answer":{"oral":"要点：Key/base_url 只在这一处读取环境变量；统一记录 usage 和耗时；异常类型在此翻译成业务可懂的错误；其他模块 `from client import chat` 即用。换模型、加日志、改重试策略，全项目零改动。","keyPoints":["在 client.py 里定义一个 chat 函数，接收 messages、temperature、json_mode 等参数","函数内部调用 _client.chat.completions.create()，把 model 和这些参数传进去","根据 json_mode 是否为真，决定要不要传 response_format={\"type\": \"json_object\"}","拿到响应后调用 log_usage(resp.usage) 统一记录本次的 Token 消耗","最后 return resp.choices[0].message.content，把纯文本回复返回给调用方","其他模块只需要 from client import chat 就能直接调用，不用关心底层怎么连接 API"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g4_q10","qnum":10,"qtext":"finish_reason 有哪些取值？分别意味着什么？为什么要检查它？","answer":{"oral":"取值一共有四种。第一种是 `stop`，含义是模型正常说完了、碰到了停止条件，这种情况下直接使用输出就行；第二种是 `length`，含义是达到 max_tokens 被截断了，这意味着输出不完整，得提高上限或者让模型精简回答；第三种是 `tool_calls`，含义是模型要调用工具，这时候要解析 tool_calls 并执行；第四种是 `content_filter`，含义是触发了内容过滤，需要调整输入或者提示用户。 不检查的后果：截断的 JSON 去解析必然报错、截断的回答直接给用户造成事故。批量任务里尤其要检查——`length` 意味着这条结果**可能不能用**。","keyPoints":["**stop**：模型正常说完、碰到了停止条件，直接使用输出即可","**length**：达到 max_tokens 被截断，输出不完整，需提高上限或让模型精简回答","**tool_calls**：模型要调用工具，需解析 tool_calls 并执行","**content_filter**：触发了内容过滤，需调整输入或提示用户"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g4_q11","qnum":11,"qtext":"流式输出（Streaming）的原理是什么？和普通调用有什么区别？","answer":{"oral":"普通调用：等模型生成完所有 Token，一次性返回（用户盯着转圈）。流式：服务端边生成边推送，每个数据块（chunk）携带一小段增量文本，客户端逐块拼接展示——用户几乎立即看到第一个字，体验完全不同。 本质是 SSE（Server-Sent Events）协议。注意：**拼完完整回复才能存入历史**，历史里存的是完整 assistant 消息，不是碎片。","keyPoints":["调用 create 时传入 stream=True，拿到一个可迭代的 stream 对象，而不是一次性的完整响应","用一个 full 变量做初始容器，准备拼接完整回复","用 for chunk in stream 循环，逐块接收服务端推送的数据","从每个 chunk 里取出 chunk.choices[0].delta.content，得到这一小块的增量文本","如果 delta 不为空，就立即打印出来，同时累加进 full 变量","循环结束后，full 里存的就是拼接完整的回复文本"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g4_q12","qnum":12,"qtext":"写好一个可复用的 LLM 客户端封装，从零到生产要补哪些细节？","answer":{"oral":"检验标准：业务模块里**不出现任何 SDK 类型**，只出现 `chat(prompt) -> str` 这样的纯业务调用。","keyPoints":["**超时**：显式设置 timeout，避免网络问题挂死程序","**重试**：429/超时指数退避，带上限，区分可重试异常","**usage 统计**：每次调用记录 token 与耗时，落日志","**json_mode 开关**：抽取场景一键启用","**流式接口**：`chat_stream()` 与 `chat()` 并存","**配置集中**：model、base_url、单价常量统一管理，换模型改一处"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}}]},{"name":"多轮对话与消息历史","questions":[{"id":"g5_q1","qnum":1,"qtext":"system、user、assistant 三种消息角色分别怎么用？","answer":{"oral":"三种角色里，system 是由开发者产生的，作用是设定身份、规则和输出约束，而且全程不变，比如\"你是客服助手，只回答售后问题，语气专业\"；user 是由用户产生的，就是用户的输入或指令，比如\"我的订单还没到\"；assistant 是由模型产生的，是模型的历史回复，要回传回去以保持记忆，比如\"请问您的订单号是？\"。 关键理解：assistant 消息是**应用替模型\"背书\"回传**的——模型没有记忆，是应用把上一轮回复以 assistant 角色塞回 messages，模型才\"记得\"自己说过什么。","keyPoints":["**system**：开发者产生，设定身份、规则和输出约束，全程不变","**user**：用户产生的输入或指令","**assistant**：模型产生的历史回复，要回传回去以保持记忆","**关键理解**：模型本身没有记忆，是应用把上一轮回复以 assistant 角色塞回 messages，模型才\"记得\"自己说过什么"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g5_q2","qnum":2,"qtext":"为什么每次调用 API 都要传完整历史？API 为什么设计成无状态？","answer":{"oral":"因为大模型 API **无状态**：服务端不保存任何对话，\"记忆\"完全由客户端每次传入的 messages 数组提供。第 N 轮请求必须包含前 N-1 轮的全部内容，模型才接得上话。 代价转嫁给应用：历史管理、截断、成本控制都是客户端的活。","keyPoints":["**可扩展**：任意服务器都能处理任意请求，水平扩容无需同步会话","**免存储**：亿级用户的对话历史存储成本巨大","**隐私**：对话数据留在客户端，服务商不留底","**灵活**：想\"修改记忆\"（删某轮、换 system）客户端说了算"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g5_q3","qnum":3,"qtext":"多轮对话中消息历史的维护规则是什么？","answer":{"oral":"维护消息历史的核心规则一共三条：第一是只追加、不修改，每轮对话结束后按顺序把 user 消息和 assistant 消息 append 进去，历史是单向增长的日志；第二是成对追加，user 和 assistant 消息要按时序排列，不能打乱顺序；第三是 system 消息永远放在最前面，它不参与\"轮次\"计数，每次调用都要原样带上。","keyPoints":["**只追加，不修改**：每轮对话后，按顺序 append user 消息和 assistant 消息，历史是单向增长的日志","**成对追加**：user 和 assistant 消息按对话时序排列，别打乱顺序","**system 永远在最前**：设定不参与\"轮次\"，每次调用都原样带上","初始化 messages 列表，只放一条 system 消息作为开场","用 while True 进入一个不会自动停止的对话循环","每轮先用 input() 读取用户输入 q","把 {\"role\": \"user\", \"content\": q} 追加进 messages","调用 chat(messages) 拿到模型回复 reply","把 {\"role\": \"assistant\", \"content\": reply} 也追加进 messages，进入下一轮循环"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g5_q4","qnum":4,"qtext":"assistant 的回复应该什么时候加入历史？直接在调用前加行不行？","answer":{"oral":"**必须在拿到完整回复之后** append。 如果在调用前就把（空的/猜测的）assistant 消息塞进去，历史结构就错了：模型会看到\"自己说过\"没说过的话。流式输出的对应规则：边收边打印给用户，但**收完完整文本才 append**。","keyPoints":["先把用户消息 append 进历史","再拿这份包含新用户消息的历史去调用 API","等 API 返回完整回复之后，才把 assistant 消息 append 进历史","append 完成后才进入下一轮，顺序不能颠倒"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g5_q5","qnum":5,"qtext":"历史截断有哪些策略？为什么 system 消息必须保留？","answer":{"oral":"按轮数截断只留最近 K 轮，做法最简单，是首选方案；按 Token 截断则是累计 Token 一旦超过预算就丢弃最旧的消息，能更精确地控制成本；摘要压缩是用模型把旧历史压缩成一段再塞回去，能保留语义，但会多产生一次调用的额外成本。 无论哪种，system 永远保留在最前：身份、规则、输出约束是每轮都必须生效的全局设定，丢了它模型立刻\"人设崩塌\"。更精细的做法是把\"用户姓名、核心目标\"这类关键信息提取后固化进 system，截断多少轮都不丢。","keyPoints":["**按轮数截断**：只留最近 K 轮，做法最简单，是首选方案","**按 Token 截断**：累计 Token 一旦超过预算就丢弃最旧的消息，能更精确地控制成本","**摘要压缩**：用模型把旧历史压缩成一段再塞回去，能保留语义，但多一次调用的额外成本","**system 必须保留**：身份、规则、输出约束每轮都必须生效，丢了模型立刻\"人设崩塌\"；更精细的做法是把关键信息固化进 system"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g5_q6","qnum":6,"qtext":"按轮数截断和按 Token 截断，各有什么优劣？","answer":{"oral":"按轮数（留最近 10 轮）：实现一行代码，心智简单；缺点是每轮长短差异大，10 轮可能 500 Token 也可能 5000，成本不可控。 按 Token（超过 4000 就从最旧开始丢）：成本上限确定，充分利用预算；缺点是要估算每条消息的 Token 数（粗略 `len(text)` 即可），实现稍复杂。 实践建议：原型期用轮数截断；上线前改按 Token，并预留 system + 当前问题 + 预期输出的空间（总预算 = 上下文窗口 × 80%）。","keyPoints":["**按轮数（留最近 10 轮）**：实现一行代码、心智简单，但每轮长短差异大，成本不可控","**按 Token（超过 4000 就从最旧开始丢）**：成本上限确定、充分利用预算，但要估算每条消息的 Token 数，实现稍复杂","**实践建议**：原型期用轮数截断，上线前改按 Token，并预留空间（总预算=上下文窗口×80%）"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g5_q7","qnum":7,"qtext":"多轮对话里\"上下文连贯\"和\"成本/窗口\"是天然矛盾的，怎么权衡？","answer":{"oral":"矛盾：记得越全（历史越长）→ 回答越连贯，但 Token 成本平方级增长且逼近窗口上限；截得越狠 → 便宜，但模型\"失忆\"。 没有标准答案，但\"system 固化关键信息 + 最近轮次原文\"是性价比最高的组合。","keyPoints":["先问业务**依赖多长的记忆**：闲聊类 5~8 轮足够；任务型对话把任务目标固化进 system","分层记忆：最近 K 轮原文 + 更早内容摘要成一段 + 关键事实进 system","监控指标：用户重复提问率（截太狠的信号）+ 平均每轮 Token 成本"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g5_q8","qnum":8,"qtext":"从零写一个命令行聊天程序，核心要包含哪些模块？","answer":{"oral":"四个要点：初始化（system + 空历史）、输入循环（含退出命令）、历史维护（成对 append）、输出展示。这个 20 行骨架就是所有多轮应用的雏形——网页聊天、客服系统只是把 input/print 换成界面组件。","keyPoints":["先定义 SYSTEM 常量，并用它初始化只含一条 system 消息的 messages 列表","打印提示语后进入 while True 循环，持续读取用户输入","每次用 input() 读取内容后调用 .strip() 去掉首尾空白，赋值给 q","如果 q 是 exit 或 quit（忽略大小写），就打印告别语并 break 跳出循环","否则把 user 消息追加进 messages，调用封装好的 client.chat(messages) 得到 reply","把 assistant 消息也追加进 messages，再打印 reply 给用户看，然后回到循环开头"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g5_q9","qnum":9,"qtext":"CLI 聊天里用户输入空内容或 exit 命令，应该怎么处理？","answer":{"oral":"处理原则：**在调用 API 之前拦截无效输入**。空字符串发给 API 是浪费一次调用；exit/quit 这类命令是给程序的信号，不是给模型的话。这也是\"输入校验放在系统边界\"的最小案例——所有用户输入的 LLM 应用都应先做这类前置检查。","keyPoints":["先用 input() 读取用户输入，并调用 .strip() 去掉首尾空白","如果 q 是空字符串，就用 continue 直接跳过本轮，不发起任何 API 调用","把 q 转成小写后，判断是否属于 exit、quit、退出这几个退出命令","如果是，就打印告别语并用 break 结束整个循环"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g5_q10","qnum":10,"qtext":"如果回复是流式打印的，对话历史应该怎么记？","answer":{"oral":"规则：**展示可以流式，存储必须完整**。历史里的 assistant 消息是下一轮的输入依据，必须是拼装完成的整段文本；把碎片或空字符串存进去，下一轮模型看到的对话就是坏的。用户中断（Ctrl+C）时要决定：丢弃半截回复，还是照样入史。","keyPoints":["先把用户消息追加进 messages","调用 chat_stream(messages) 拿到一个流式返回的迭代对象 stream","用一个空字符串 full 做容器，准备拼接完整回复","for chunk in stream 循环里，每收到一块就立即打印展示给用户，同时把它累加进 full","循环结束后，full 里已经是拼接完整的回复文本","只有这时才把 {\"role\": \"assistant\", \"content\": full} 追加进 messages，而不是在流式过程中就写入历史"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g5_q11","qnum":11,"qtext":"综合应用：给客服场景设计一个多轮对话模块，说明消息历史管理的完整方案。","answer":{"oral":"设计要点： **消息结构**：`system`（客服人设 + 业务规则 + 输出约束）固定在最前；每轮成对 append user/assistant。 **边界处理**：空输入跳过；用户输入\"转人工\"等命令不进 messages 直接走业务分支；流式回复拼完再入史；每次调用记录 usage 观察成本。 这个方案在\"记得住关键信息\"和\"成本可控\"之间取得平衡，且全部逻辑在客户端完成，不依赖任何服务端状态。","keyPoints":["最近 8 轮原文保留","超出部分每轮检查：累计 Token（`sum(len(m[\"content\"]) for m in messages)` 粗估）超过预算（如 3000）就从最旧的非 system 消息开始丢弃","开场收集的关键信息（订单号、问题类型）提取后写入 system 尾部——永不因截断丢失"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}}]},{"name":"Prompt 工程与优化","questions":[{"id":"g6_q1","qnum":1,"qtext":"为什么\"总结一下这篇文章\"是一个糟糕的 Prompt？","answer":{"oral":"Prompt 工程的第一原则：**你不说清的每一件事，模型都会替你随机决定**。应用开发要的是可预期的稳定输出，这与聊天随意试试完全不同。","keyPoints":["长度不可控：可能 100 字也可能 1000 字","形式不可控：可能是段落、列表、甚至带标题的框架","重点不可控：模型自己决定关注什么，不一定是业务要的","风格不可控：口语、书面、营销腔随机出现"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g6_q2","qnum":2,"qtext":"Prompt 约束的四个维度是什么？各举一个摘要场景的例子。","answer":{"oral":"四个维度分别是：第一是内容范围，约束的是写什么、不写什么，摘要场景里可以说\"聚焦产品功能，忽略公司历史\"；第二是输出格式，约束的是结构长什么样，比如\"输出 3 个要点，每点一行，以 - 开头\"；第三是长度限制，约束的是多长，比如\"总共不超过 80 字\"；第四是语气风格，约束的是什么口吻，比如\"面向管理者的正式书面语\"。 四维度齐全的 Prompt，输出才能稳定可预期；缺哪个维度，哪个维度就随机。这是评估任何任务型 Prompt 是否合格的检查清单。","keyPoints":["**内容范围**：约束写什么、不写什么，如“聚焦产品功能，忽略公司历史”","**输出格式**：约束结构长什么样，如“输出 3 个要点，每点一行，以 - 开头”","**长度限制**：约束多长，如“总共不超过 80 字”","**语气风格**：约束什么口吻，如“面向管理者的正式书面语”"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g6_q3","qnum":3,"qtext":"一个规范的摘要 Prompt 结构长什么样？","answer":{"oral":"结构公式：**角色 + 任务 + 约束 + 输入**。角色决定\"以什么视角取舍\"，任务是目标，约束四维度框定输出，输入放最后并用变量注入——模板固定、数据变化，才便于版本管理和批量处理。","keyPoints":["Prompt 第一行设定角色，“你是一名科技资讯编辑”，定义视角和专业度","第二行给出任务，“请对下面的文章写一份执行摘要”","接下来用编号列表给出三条约束，分别限定内容取舍、输出结构和语言风格","最后把 {article} 变量插入到文章位置，把待处理的具体数据放在模板末尾","整个 Prompt 用三重引号包裹成多行字符串，赋值给 prompt 变量"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g6_q4","qnum":4,"qtext":"Prompt 里的软长度约束和 max_tokens 硬约束有什么区别？怎么配合？","answer":{"oral":"软约束（Prompt 里写\"不超过 80 字\"）作用在请求模型遵守这个层面，效果是大概率遵守、偶尔会超，好处是没有副作用；硬约束（如 max_tokens=200）则是代码强制截断，效果是绝对不会超，但副作用是一旦触到上限就会硬生生截断，话说到一半就被砍掉。 正确用法是**双层防线**：软约束引导模型主动控制篇幅（绝大多数情况生效），max_tokens 设为略高于软约束对应的 Token 数（如 80 字 ≈ 120 Token，设 160）作为保险丝——就算模型不听话，也不会让一次输出把预算打爆。","keyPoints":["**软约束**：Prompt 文字要求（如“不超过 80 字”），大概率遵守、偶尔会超，好处是没有副作用","**硬约束**：max_tokens 代码强制截断，绝对不会超，但一旦触顶会把话硬生生砍掉","**双层防线**：软约束引导模型主动控制篇幅，max_tokens 设为略高于软约束对应 Token 数（如 80 字≈120 Token，设 160）作保险丝"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g6_q5","qnum":5,"qtext":"为什么\"不超过 100 字\"这种约束经常失效？","answer":{"oral":"工程对策：给参照物（\"不超过 3 个要点，每点不超过 30 字\"比\"不超过 100 字\"可控得多）；结构化拆分（限制条数和每条长度）；max_tokens 兜底；对精确字数有硬需求的场景，生成后用代码截断或二次压缩。","keyPoints":["**模型对字数没有精确感知**：它是逐 Token 生成的，生成时\"不知道\"已经写了多少字，只能靠对长度的模糊语感","**中文字数 ≠ Token**：约束的是 100 字，模型按 Token 空间估计，换算有偏差","**内容压力**：要求覆盖的要点太多时，模型在\"完整\"和\"简短\"之间会牺牲简短"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g6_q6","qnum":6,"qtext":"摘要任务的 temperature 应该设多少？为什么？","answer":{"oral":"设 **0.2~0.3**。 对比参照：信息抽取/分类用 0（要绝对稳定），对话用 0.7（要多样），创意写作用 1.0+。判断口诀：**任务越客观，温度越低；任务越主观，温度越高**。","keyPoints":["摘要要求**忠实原文**，不需要创造性，随机性是负资产","但完全 0 有时会导致措辞生硬、逐句缩写式摘要；留一点随机性让表达更自然"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g6_q7","qnum":7,"qtext":"多风格摘要器怎么设计？核心是什么？","answer":{"oral":"核心是**模板参数化**：一个函数、N 套约束。 要点：风格差异全部收敛到字典里的约束文本，调用逻辑完全复用；新增风格只加一行配置。这个\"配置驱动\"思路是 Prompt 工程化的起点——把可变部分从代码里分离出来管理。","keyPoints":["定义 STYLES 字典，键是风格名称（一句话、要点、正式），值是对应的约束文本","定义 summarize 函数，接收 text 和 style 两个参数，style 默认为“要点”","函数内部用 f-string 拼出 Prompt，通过 STYLES[style] 取出对应约束文本拼进去","调用 chat(prompt, temperature=0.3) 发起请求，返回摘要结果","新增一种摘要风格时，只需要在 STYLES 字典里加一行配置，不用改 summarize 函数本身"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g6_q8","qnum":8,"qtext":"Prompt 版本对比实验应该怎么做？","answer":{"oral":"常见错误：只测一条输入就下结论；同时改 Prompt 和参数（分不清谁起作用）；用训练时看过的例子做评估。","keyPoints":["**固定变量**：同一批测试输入、同一 model/temperature/max_tokens，只换 Prompt","**准备测试集**：挑 5~10 条有代表性的输入（长短、题材、难度都覆盖）","**成对运行**：V1 和 V2 分别跑全部测试输入，记录输出","**盲评**：打乱顺序看输出（避免先入为主），按预设标准打分（忠实度/长度合规/可读性）","**下结论**：V2 在多数样本上更好才切换，个别样本回退要记录"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g6_q9","qnum":9,"qtext":"为什么 Prompt 优化需要固定的测试输入集？","answer":{"oral":"因为 LLM 输出有随机性、对不同输入表现差异大，**没有固定输入就没有可比较的基线**： 实践：从第一天起就建 `test_inputs/` 目录，把遇到的边界案例（超长文本、空段落、外语文本）持续加进去，它就是 Prompt 的\"单元测试\"。","keyPoints":["今天用 A 文章测、明天用 B 文章测，效果好差说不清是 Prompt 变了还是文章变了","固定输入集让每次改动都和上一次在同样条件下对比，改进是否真实一目了然","测试集还能沉淀\"失败案例\"——那些曾经翻车的输入是最好的回归测试"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g6_q10","qnum":10,"qtext":"Few-shot 示例在摘要/风格控制任务中起什么作用？设计示例有什么讲究？","answer":{"oral":"Few-shot 用\"输入→期望输出\"的实例直接示范目标行为，比抽象规则描述更有效——模型最擅长模仿示例。","keyPoints":["**示例即标准**：示例的长度、结构、语气就是模型模仿的对象，必须精心制作","**覆盖差异**：给 2~3 个示例时，输入题材应有变化，避免模型只学到题材而非方法","**展示边界**：包含一个\"信息很少的输入 → 极简输出\"的示例，教会模型弹性","**成本意识**：示例常驻 Prompt，每次调用都花 Token，够用就好"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g6_q11","qnum":11,"qtext":"综合应用：如何系统评估并迭代一个摘要 Prompt？给出完整工作流。","answer":{"oral":"关键认知：Prompt 是需要**测试驱动、版本管理**的代码资产，不是一段随手改的字符串。","keyPoints":["**建基线**：V1 按四维度写好约束，跑固定测试集（8~10 条），记录输出","**定标准**：三个量化维度——忠实度（要点来自原文，无编造）、合规度（字数/条数/格式符合约束）、可读性（目标读者能否 10 秒抓住重点）","**找短板**：逐条检查失败模式——超长？漏关键数据？夹带评论？对应修 Prompt（加约束、给示例、改结构）","**对照实验**：V2 与 V1 同条件跑同测试集，盲评打分，多数样本更好才合入","**沉淀回归集**：把 V1 失败的输入永久留在测试集，防止下次改动复发","**版本管理**：`prompts/v3_summarize.txt` 存档，代码按版本引用，可随时回滚"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g12_q1","qnum":12,"qtext":"Prompt 优化的四类手段分别解决什么问题？","answer":{"oral":"Prompt 优化的四类手段分别解决不同层面的歧义问题。第一类是角色设定，也就是 Role Setting，解决的是\"用什么标准或视角判断\"这个歧义，适用场景是主观性强、依赖领域经验的任务，比如让\"资深客服主管\"来判断工单优先级。第二类是目标声明，即 Explicit Objective，解决的是\"要做什么\"这个歧义，适用场景是任务本身容易有多种理解方式，需要明确排除\"顺便做别的\"。第三类是 Few-shot 示例，解决的是\"边界案例怎么判断\"这个歧义，适用场景是判断规则难以用文字穷举、靠类比而非规则更准确的场景。第四类是输出限制，即 Output Constraints，解决的是\"结果长什么样\"这个歧义，适用场景是所有需要程序解析输出的场景，比如格式、长度、取值范围的约束。 四者不互斥，一个成熟的生产级 Prompt 通常同时用到全部四种；先写清楚的文字规则覆盖大多数情况，再用 Few-shot 补充规则难以描述的边界案例，是效果和成本的较优平衡点。","keyPoints":["**角色设定（Role Setting）**：解决“用什么标准或视角判断”，适用主观性强、依赖领域经验的任务","**目标声明（Explicit Objective）**：解决“要做什么”，适用任务容易有多种理解、需排除“顺便做别的”的场景","**Few-shot 示例**：解决“边界案例怎么判断”，适用判断规则难以文字穷举、靠类比更准确的场景","**输出限制（Output Constraints）**：解决“结果长什么样”，适用所有需要程序解析输出的场景"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g12_q2","qnum":13,"qtext":"为什么说 Prompt 优化的本质是\"消除歧义\"而不是\"讨好模型\"？","answer":{"oral":"很多人优化 Prompt 的第一反应是堆砌形容词（\"你是全宇宙最专业的专家，请务必认真思考\"），但这类\"魔法词\"效果有限——模型没有\"偷懒\"这个状态，堆砌形容词不会让它更努力思考。 四类优化手段（角色设定、目标声明、Few-shot、输出限制）本质上都是把原本模糊、依赖常识和经验的判断标准，用文字显式表达出来，让模型有明确依据可以对齐——这是\"消除歧义\"，而不是\"讨好\"或\"激励\"模型。","keyPoints":["拿一句模糊的表述作对比，“请务必认真仔细地分析这条反馈”，这类形容词堆砌并不会让模型更努力","换成清晰的判断标准，“涉及资金损失或安全问题记为5分，影响使用但有替代方案记为3分，纯咨询记为1分”","对比说明真正提升效果的是把模糊的常识判断标准用文字显式表达出来，让模型有明确依据，而不是靠语气词去“讨好”模型"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g12_q3","qnum":14,"qtext":"准确率和稳定性是一回事吗？如何分别量化这两个指标？","answer":{"oral":"不是一回事，两者是独立的评估维度：准确率（Accuracy）指的是模型输出和人工标注正确答案的一致程度，衡量方式是\"多数投票结果 == expected\"的比例；稳定性（Stability）指的是同一条输入多次调用，结果是否一致，衡量方式是多次运行结果完全相同的比例。 一个 Prompt 可能\"稳定地错\"（每次调用结果一样，但都是错的，说明判断标准本身有偏差）；也可能\"偶尔蒙对\"（多次结果不一致，但多数投票恰好正确，说明单次调用不可靠）。 两者按\"稳定性 × 准确率\"划成四象限：高稳定+高准确是理想状态可直接上线；高稳定+低准确说明判断标准本身有偏差需要重新设计规则；低稳定则无论准确率高低都不可靠，需要提高约束强度。","keyPoints":["定义 evaluate_prompt 函数，接收待评估的 prompt_fn、测试集 test_set 和重复运行次数 n_runs","对测试集里的每一条 item，用列表推导式调用 n_runs 次 call_llm(prompt_fn(item[\"text\"]))，把每次结果收集进 runs 列表","用 max(set(runs), key=runs.count) 找出 runs 里出现次数最多的结果，作为多数投票结果 most_common","用 len(set(runs)) == 1 判断是否所有运行结果完全一致，得到 is_stable，这是稳定性指标","用 most_common == item[\"expected\"] 判断多数投票结果是否等于人工标注的期望值，得到 is_correct，这是准确率指标"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g12_q4","qnum":15,"qtext":"如何判断一次 Prompt \"优化\"是真的提升了效果，还是恰好在测试集上蒙对了？","answer":{"oral":"陷阱场景：用几条固定的测试数据反复调整 Prompt，直到这几条全部命中就认为优化成功——但这些数据的措辞、边界情况很可能被\"针对性\"覆盖了，换一批新数据准确率可能骤降，这叫**对测试集过拟合**。","keyPoints":["测试集要有一定规模（至少 15-20 条）且覆盖不同难度","把数据划分为**开发集**（迭代 Prompt 时反复使用）和**留出集**（从不参与调优，只在 Prompt 定稿后跑一次）","对比开发集和留出集的表现：如果留出集准确率明显低于开发集（比如开发集 90%、留出集 60%），说明前面的\"优化\"很可能只是针对开发集几条数据的措辞做了过度适配，而不是抓住了任务的通用判断标准","取 TEST_SET 的前 5 条作为开发集 DEV_SET，迭代阶段反复使用","取 TEST_SET 第 5 条之后的部分作为留出集 HOLDOUT_SET，只在 Prompt 定稿后跑一次，代表真实预期表现"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g12_q5","qnum":16,"qtext":"如何从零设计一套可复现的 Prompt 版本对比实验？","answer":{"oral":"核心设计原则：**递进式版本设计（便于归因）+ 双维度量化（准确率、稳定性）+ 开发集/留出集分离（防止过拟合）**。","keyPoints":["V1→V2→V3 递进式设计，每次只新增一类优化手段，能精确归因\"这一提升是哪类手段带来的\"","每条数据跑 `n_runs` 次，同时计算准确率（vs 人工标注）和稳定性（结果一致性），而不是只看\"看起来对不对\"","开发集和留出集严格分离，留出集只在版本定稿后跑一次，避免\"优化\"实际上是过拟合了测试数据","实验结论可复现——换一批新的测试数据、换一个人跑这套代码，得到的对比结论应该是一致的","定义 prompt_v1/v2/v3 三个递进版本：v1 只有目标声明和输出限制，v2 在此基础上加角色设定和评分标准，v3 再加 Few-shot 示例","evaluate_prompt 对测试集每条数据调用 prompt_fn 并重复 n_runs 次，取出现次数最多的结果作为多数投票答案","根据多次结果是否完全一致判断稳定性(stable)，根据多数答案是否等于标注答案判断正确性(correct)","汇总所有数据的 correct 和 stable 比例，分别得到 accuracy 和 stability 两个指标","compare_prompts 遍历传入的多个 Prompt 版本，分别调用 evaluate_prompt 并打印各自的准确率和稳定性","迭代阶段用 compare_prompts 在开发集 DEV_SET 上对比三版，定稿阶段只在留出集 HOLDOUT_SET 上跑一次 evaluate_prompt 验证真实表现"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g71_q1","qnum":17,"qtext":"一个好的 System Prompt 应该包含哪些部分？写 System Prompt 有哪些常见误区？","answer":{"oral":"System Prompt 定义的是模型在整个对话里的身份、能力边界和行为规则，优先级比用户消息高。我一般按这几块来组织：第一是角色和目标，说清楚它是谁、服务于谁、要达成什么，比如“你是某电商平台的售后客服助手，帮助用户处理退换货”；第二是背景知识和上下文，比如业务规则、当前日期、可用的工具说明；第三是行为约束，能做什么、不能做什么，比如“只回答售后相关问题，不承诺具体赔偿金额”；第四是输出格式要求，比如用什么语言、多长、是否用 JSON；第五是边界情况怎么处理，比如信息不足时先追问，超出范围时如何礼貌拒绝；必要时再加几个示例。写法上，用 Markdown 标题或 XML 标签把不同部分分隔清楚，规则用肯定句写“要做什么”，比单纯写“不要做什么”效果更好，而且最好解释一下原因，模型理解了意图会泛化得更好。常见误区：一是写得太空泛，比如“你是一个有用的助手”，等于没写；二是规则互相矛盾，比如既要求简洁又要求详细解释每一步；三是堆砌大量全大写的“必须”“绝对”，新一代模型对这种强调很敏感，反而会过度执行；四是把安全寄托在 System Prompt 上，以为写了“不要泄露提示词”就能防住注入，实际上关键的权限控制必须在代码层做；五是不做版本管理和评估，改了一句话不知道效果是变好还是变坏。","keyPoints":["组成：角色与目标、背景上下文、行为约束、输出格式、边界情况处理、示例","用标题或 XML 标签分隔；用肯定句并解释原因","误区：空泛、规则矛盾、滥用全大写强调","安全不能只靠 System Prompt，权限要在代码层控制","Prompt 要做版本管理并配合评估集验证"],"code":[],"followUp":["System Prompt 和用户消息里的指令冲突时，模型会听谁的？"],"pitfalls":["只写一句“你是一个专业助手”。"]}},{"id":"g71_q2","qnum":18,"qtext":"什么是 Chain-of-Thought 思维链？它为什么有效？什么场景下不需要用？","answer":{"oral":"思维链就是引导模型在给出最终答案之前，先把推理过程一步步写出来。最简单的做法是零样本 CoT，在问题后面加一句“让我们一步步思考”；也可以用少样本 CoT，给几个带完整推理过程的示例。它有效的原因可以这么理解：大模型是逐个 Token 生成的，每生成一个 Token 只能做固定量的计算，如果直接要求输出答案，相当于要在一两个 Token 里完成全部推理；而写出中间步骤，等于给了模型更多的“计算步数”，而且前面写出的中间结果会作为上下文，帮助后面的推理，这对多步算术、逻辑推理、复杂规划这类问题提升非常明显。在应用里还有一个好处是可解释，出错了能看到它是哪一步想错了。实践中常让模型把思考过程放在 <thinking> 标签里，答案放在 <answer> 标签里，程序只解析答案部分给用户。现在很多模型本身就是推理模型，内置了扩展思考能力，用它们时就不需要再手动写“一步步思考”了，甚至规定死推理步骤反而会限制它。不需要 CoT 的场景：简单的事实问答、分类、信息抽取、格式转换这类任务，加了 CoT 只会增加 Token 成本和延迟，没有收益；对延迟要求极高的实时交互也要慎用。还要注意，写出来的推理过程不一定就是模型真实的“思考”，不能完全依赖它来做审计。","keyPoints":["CoT：先输出推理步骤再给答案；零样本（“一步步思考”）与少样本","原理：中间 Token 提供额外计算步数，中间结果作为后续上下文","适合多步算术、逻辑推理、复杂规划；增强可解释性","实践：<thinking> 与 <answer> 分离，程序只解析答案","推理模型已内置思考，无需手动引导；简单任务用 CoT 只增加成本和延迟"],"code":[],"followUp":["Self-Consistency 是什么？它和 CoT 怎么配合？"],"pitfalls":["对简单分类任务也强制加 CoT，浪费 Token。"]}},{"id":"g8_q3","qnum":19,"qtext":"聊天、摘要、信息抽取三类 LLM 应用在设计上有哪些关键差异？","answer":{"oral":"先说聊天这个场景，它是多轮交互，得靠 messages 数组不断累积才有状态；Prompt 部分是固定的 system 加上每次变化的用户输入；temperature 调到 0.7，图的是回答有点多样性，不死板；输出是直接展示给人看的对话，所以这里最难的是历史管理，怎么把上下文管好。再看摘要，它是单次的长文本输入，一次调用完就结束，没有状态；Prompt 用的是固定模板加变量注入的方式；temperature 降到 0.3，追求的是忠实原文，不能自己发挥；输出同样是给人看的，但难点变成了约束设计，怎么让模型老老实实按原文总结。最后信息抽取，同样是单次输入、无状态，但 Prompt 里的字段定义是动态生成的，要跟着不同的抽取需求变化；temperature 直接压到 0，追求绝对稳定，一点随机都不要；而且输出不是给人看的，是交给程序去解析成 JSON，所以这里的核心难点就是格式稳定性，模型必须每次都吐出结构一致的结果。 三个 Demo 是一条演进线：**状态从无到有 → 约束从松到紧 → 输出从\"给人\"到\"给程序\"**，难度依次上升，恰好覆盖 LLM 应用的三种基本形态。","keyPoints":["**聊天**：多轮有状态（靠 messages 累积），temperature=0.7 求多样性，难点是历史管理","**摘要**：单次无状态，固定模板+变量注入，temperature=0.3 求忠实原文，难点是约束设计","**信息抽取**：单次无状态，字段定义动态生成，temperature=0 求绝对稳定，输出给程序解析而非给人看，难点是格式稳定性","**演进线**：状态从无到有→约束从松到紧→输出从“给人”到“给程序”，难度依次上升"],"code":[],"followUp":["这里面你认为最关键的设计点是什么？能展开讲讲吗？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}},{"id":"g15_q2","qnum":20,"qtext":"什么样的 Prompt 才算\"稳定\"？如何量化评估稳定性？","answer":{"oral":"技术定义：同一条输入多次调用（通常 3 次），结果完全一致的比例高。稳定性 < 70% 的 Prompt 不应上生产。 不稳定通常可以归结为四类根因，每一类都有对应的修复方式。第一类是任务目标模糊，表现为每次返回的格式或维度都不一样，修复方式是在 Prompt 里明确说清楚\"只输出 JSON，字段为 X\"。第二类是值域未锁定，表现为标签值随机变化，修复方式是用 enum 类型加上 Pydantic 强制校验。第三类是边界案例未覆盖，表现为特殊输入的结果飘忽不定，修复方式是用 Few-shot 展示边界案例该怎么处理。第四类是 Temperature 过高，表现为结构化任务依然存在随机性，修复方式是结构化任务一律把 temperature 设成 0。 **稳定性和准确率的关系**：两者独立，必须分开评估。一个 Prompt 可以\"稳定地错\"（每次输出相同的错误结果），也可以\"偶尔蒙对\"（结果不一致但多数投票正确）——两者都不是好 Prompt。理想状态是稳定性 ≥ 80% 且准确率达到业务要求。","keyPoints":["定义 stability_score 函数，接收 prompt_fn、测试集 test_set 和重复次数 n_runs","对测试集里的每一条文本，调用 n_runs 次 call_llm(prompt_fn(text))，收集所有结果","用 set(runs) 判断这几次结果是否完全一致，如果只有一种结果就记为稳定","统计稳定的数据条数占测试集总数的比例，作为稳定性分数返回"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}}]},{"name":"结构化输出与信息抽取","questions":[{"id":"g7_q1","qnum":1,"qtext":"什么是信息抽取？有哪些典型应用场景？","answer":{"oral":"信息抽取（Information Extraction）是从非结构化文本中识别并提取**预定义字段**，输出结构化数据的任务： 典型场景：简历解析（姓名/技能/年限）、客服工单（问题类型/情绪/订单号）、商品描述（品牌/型号/价格）、合同要素（甲乙方/金额/日期）、新闻事件（时间/地点/人物）。共同点：**输入是自然语言，输出要进数据库或被程序消费**。","keyPoints":["输入一段非结构化的中文简历文本，里面混杂着姓名、年龄、工作经历、邮箱等信息","把这段文本连同抽取要求一起交给 LLM，并附加格式约束（要求输出 JSON）","模型识别出预定义字段对应的内容，把姓名、年龄、公司、技能、邮箱分别提取出来","最终输出一个结构化的 JSON 对象，可以直接被程序解析、存入数据库"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g7_q2","qnum":2,"qtext":"信息抽取和文章摘要的本质区别是什么？","answer":{"oral":"摘要的输出是自然语言文本，抽取的输出则是结构化数据（JSON）；对待原文的方式上，摘要会压缩、改写、整合内容，抽取则要求忠实复制原文中的特定信息；在发挥空间上，摘要允许做语义整合，抽取**不允许推断**，字段值必须来自原文；评估标准上，摘要看的是语义准确性（偏主观），抽取看的是字段是否完整、类型是否正确（客观可校验）；遇到原文没提到的信息时，摘要会尽量概括着写，抽取则必须返回 null，绝不能猜。 一句话：摘要是\"创作\"，抽取是\"查抄\"。所以抽取 Prompt 必须强调两条铁律：**只提取原文信息；找不到返回 null**。","keyPoints":["**输出形式**：摘要输出自然语言文本，抽取输出结构化数据（JSON）","**处理原文方式**：摘要允许压缩、改写、整合，抽取要求忠实复制、不允许推断","**评估标准**：摘要看语义准确性（偏主观），抽取看字段是否完整、类型是否正确（客观可校验）","**遇到缺失信息**：摘要会概括着写，抽取必须返回 null，绝不能猜——“摘要是创作，抽取是查抄”"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g7_q3","qnum":3,"qtext":"为什么抽取任务要求模型输出 JSON 而不是自然语言？","answer":{"oral":"格式即接口：JSON 输出的稳定性直接决定这个功能能不能用。","keyPoints":["`json.loads()` 一步解析，无需脆弱的正则去抠文本","字段名和类型可以预先约定（Schema），程序知道一定有哪些键","可做二次校验：类型检查、必填检查、枚举值检查","天然支持嵌套和数组（`skills: [...]`）","便于入库、传 API、拼表格——结构化数据是程序间协作的通用货币"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g7_q4","qnum":4,"qtext":"抽取 Prompt 里的字段定义应该包含哪些要素？","answer":{"oral":"三要素：**字段名**（与下游 Schema 一致）、**类型**（字符串/整数/数组/布尔）、**说明与兜底**（取值规则、找不到怎么办）。要点：字段名用英文（模型输出英文键名更稳，避免中英文混排出错）；类型写进说明，模型会照做；兜底规则统一为 null。字段定义的质量直接决定抽取准确率。","keyPoints":["用一个 fields 字典描述每个抽取字段，键是英文字段名如 name、age、skills","字典的值是一句中文说明，里面同时写清楚了字段含义、数据类型和兜底规则，比如“没有返回 null”","用一个生成器表达式加 join，把字典遍历成“- 字段名: 说明”格式的多行文本 field_lines","这段 field_lines 后续会拼进抽取 Prompt，告诉模型每个字段该怎么填"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g7_q5","qnum":5,"qtext":"字段在原文中找不到时，为什么必须让模型返回 null 而不是\"合理猜测
