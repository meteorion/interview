\"？","answer":{"oral":"因为抽取结果要被程序当作**事实**使用：入库、触发流程、参与计算。模型猜测的值（如按上下文\"推断\"一个邮箱格式）在统计上合理、在事实上一无是处，且**猜测值和真实值在输出里长得一模一样，程序无法区分**。 null 的价值：把\"不知道\"变成显式信号，下游可以决定跳过、告警还是人工补录——错误被控制在可处理范围内。对应 Prompt 铁律：\"只提取原文信息，找不到返回 null，不允许推断\"，temperature 也应设 0 消除\"脑补\"空间。","keyPoints":["**事实性用途**：抽取结果会被程序当事实使用（入库、触发流程、参与计算），猜测值统计上合理但事实上无用","**不可区分**：猜测值和真实值在输出里长得一模一样，程序无法分辨对错","**null 的价值**：把“不知道”变成显式信号，下游可决定跳过、告警还是人工补录","**对应措施**：Prompt 要求“找不到返回 null，不允许推断”，temperature 设为 0 消除“脑补”空间"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g7_q6","qnum":6,"qtext":"让模型\"只输出 JSON\"有哪些手段？各有多可靠？","answer":{"oral":"手段大概有五种，可靠性依次递增。第一是 Prompt 声明，做法是直接写\"只输出 JSON，不要任何其他文字\"，属于基础手段，偶尔还是会违规；第二是给示例，用 Few-shot 示范纯 JSON 输出，可靠性有明显提升；第三是结构引导，用 ```json 代码块把输出包裹起来，这样便于提取，但仍可能夹带说明文字；第四是 response_format，设置 `{\"type\": \"json_object\"}`，这是**API 层强制**的，最可靠；第五是代码容错，解析失败就自动重试或修复，是最后一道防线。 生产做法是组合拳：response_format（强制）+ Prompt 约束（双保险）+ 解析容错（兜底）。","keyPoints":["**Prompt 声明 + Few-shot**：直接要求“只输出 JSON”是基础手段、偶尔违规，配合示例可靠性明显提升","**结构引导**：用 ```json 代码块包裹输出，便于提取，但仍可能夹带说明文字","**response_format**：设置 `{\"type\": \"json_object\"}`，API 层强制，是最可靠的手段","**代码容错**：解析失败就自动重试或修复，是最后一道防线；生产做法是三者组合拳"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g7_q7","qnum":7,"qtext":"response_format={\"type\": \"json_object\"} 用过吗？使用时要注意什么？","answer":{"oral":"它是 API 层的 JSON 模式开关，开启后模型**保证**输出可被 `json.loads()` 解析的合法 JSON，从根上消灭\"JSON 前后带解释文字\"的问题。 所以 JSON mode 解决\"能不能解析\"，字段校验（如 Pydantic）解决\"解析出来对不对\"，两者缺一不可。","keyPoints":["**Prompt 里必须出现 \"json\" 字样**（并最好给出字段示例），否则 API 直接报错——这是官方的使用前提","它只保证**语法合法**，不保证字段名对、类型对、值不编造——`{\"nmae\": \"张伟\"}`、`{\"age\": \"25\"}` 都是合法 JSON 但都是错的"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g7_q8","qnum":8,"qtext":"json.loads() 解析模型输出失败，常见原因有哪些？怎么处理？","answer":{"oral":"再配合：JSON mode 从源头减少失败、finish_reason 检查截断、失败自动重试一次。","keyPoints":["输出带前后缀：JSON 前后带说明文字，如「以下是抽取结果：{\"name\": ...}」","Markdown 代码块包裹：输出被 ```json 代码块标记包裹，解析前需剥离","单引号/尾逗号等非法语法（模型手滑）","被 max_tokens 截断，JSON 不完整","输出中混入了转义不当的引号","定义 parse_json_safe 函数，先对传入的 text 调用 .strip() 去掉首尾空白","如果文本以三个反引号开头，说明被 Markdown 代码块包裹，就按反引号切分并去掉开头的 json 标记，剥离出纯 JSON 部分","用 try 包裹 json.loads(text)，能直接解析就直接返回结果","如果抛出 JSONDecodeError，就用 text.find(\"{\") 和 text.rfind(\"}\") 找到第一个左花括号和最后一个右花括号的位置","如果两个位置都合法，就截取这段子串再尝试一次 json.loads","如果还是解析不了，就用 raise 把异常继续抛出去，交给上层做换约束重试"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g7_q9","qnum":9,"qtext":"信息抽取任务的常见失败模式有哪些？各自怎么解决？","answer":{"oral":"常见的失败模式大概有六种。第一是格式违规，表现是 JSON 外面还带着说明文字，解决办法是 JSON mode 加上容错解析；第二是字段编造，表现是输出了原文里没有的值，解决办法是在 Prompt 里要求\"找不到返回 null\"，并把 temperature 设为 0；第三是类型错误，表现是比如 age 输出成了字符串 \"25\"，解决办法是在字段定义里写明类型，再在代码层做类型转换和校验；第四是字段遗漏，表现是漏掉了某个字段没输出，解决办法是代码里补默认值，用 `setdefault(k, None)`；第五是幻觉字段名，表现是出现 nmae、Name 这类拼写变体，解决办法是用 Few-shot 示例，并在校验不通过后重试；第六是内容截断，表现是 JSON 没写完，解决办法是检查 finish_reason，并调大 max_tokens。 核心思想：**Prompt 负责预防，代码负责兜底**——任何失败模式都要有对应的程序化处理，而不是指望模型永远听话。","keyPoints":["**格式与内容类**：格式违规（JSON 外带说明文字）靠 JSON mode+容错解析；字段编造（输出原文没有的值）靠“找不到返回 null”+temperature=0","**类型与结构类**：类型错误（如 age 输出成字符串）靠字段类型定义+代码校验转换；字段遗漏靠 `setdefault(k, None)` 补默认值","**命名与截断类**：幻觉字段名（如 nmae 拼写变体）靠 Few-shot+校验失败重试；内容截断（JSON 未写完）靠检查 finish_reason+调大 max_tokens","**核心思想**：Prompt 负责预防，代码负责兜底——任何失败模式都要有对应的程序化处理"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g7_q10","qnum":10,"qtext":"Few-shot 示例如何提升抽取稳定性？示例应该覆盖哪些情况？","answer":{"oral":"在 Prompt 中给 1~2 个\"文本 → JSON\"完整示例，模型会严格模仿输出格式，字段名变体、格式漂移等问题大幅减少。 注意示例也消耗 Token，1~2 个精心设计的（尤其含 null 的）通常就够。","keyPoints":["**标准情况**：字段齐全，示范理想输出","**缺失情况**：原文没有某字段 → 输出 null（这条最关键，教会模型\"不猜\"）","**类型示范**：数组怎么写、数字不带引号","给出一个示例输入，“李娜，邮箱 lina@x.com”，这段文本里没有提到年龄","给出对应的示例输出 JSON，其中 name 和 email 字段正常填值，而 age 字段被显式写成 null","把这一组输入输出示例放进 Prompt，让模型模仿这种格式，尤其学会“缺失字段该输出 null 而不是瞎猜”"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g7_q11","qnum":11,"qtext":"拿到模型的 JSON 后，结果校验和兜底应该怎么做？","answer":{"oral":"校验三件事：**字段齐不齐**（补 null）、**类型对不对**（转换或置 null）、**值合不合法**（枚举、范围）。修复不了的重试一次（把校验错误信息回传给模型\"你上次输出 age 应为整数，请重新输出\"）。兜底原则：让每条结果要么是可信数据、要么是显式 null，绝不把\"看起来对\"的数据往下游传。","keyPoints":["先调用 parse_json_safe(raw) 把模型输出解析成字典 data","遍历 fields 里定义的每个字段名，调用 data.setdefault(key, None) 把缺失的字段补成 None","检查 data[\"age\"] 是不是整数类型，如果不是，就判断它转成字符串后是否全是数字，是则转成 int，否则置为 None","检查 data[\"type\"] 是否在预先定义的 ALLOWED 枚举列表里，不在的话就把它置为 None"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g7_q12","qnum":12,"qtext":"综合应用：设计一个可复用的通用信息抽取器，说明核心设计决策。","answer":{"oral":"这里的核心设计决策有四点：第一是字段外置，fields 由调用方传入，抽取器本身对场景无感知，简历、工单、合同都能用同一个类处理；第二是稳定性三件套，也就是 temperature=0、JSON mode，再加上\"找不到就返回 null\"这条硬性规则；第三是防御式收尾，解析容错加上缺失字段补 null，保证返回结构永远可预测；第四是可演进，后面需要更强稳定性时可以加 Few-shot、加类型校验、加重试，但接口不用变。","keyPoints":["**字段外置**：fields 由调用方传入，抽取器对场景无感知——简历、工单、合同一个类通吃","**稳定性三件套**：temperature=0 + JSON mode + \"找不到返回 null\" 铁律","**防御式收尾**：解析容错 + 缺失补 null，保证返回结构永远可预测","**可演进**：需要更强稳定性时加 Few-shot、加类型校验、加重试，接口不变","定义 InfoExtractor 类，里面有一个 extract 方法，接收 text 和 fields 两个参数","方法内部先把 fields 字典拼成多行说明文本 field_lines","用 field_lines 拼出完整 Prompt，并写死规则：只提取原文信息，找不到返回 null，只输出 JSON","调用 chat(prompt, temperature=0.0, json_mode=True) 发起请求，拿到原始输出 raw","调用 parse_json_safe(raw) 解析成字典，再遍历 fields 给缺失字段补 None","同一个 extractor 实例可以直接传入不同的 fields 字典，分别处理简历、工单等不同场景，extract 方法本身不用改"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g9_q1","qnum":13,"qtext":"\"能被 json.loads() 解析\"和\"结构化输出可靠\"是一回事吗？三层约束分别解决什么问题？","answer":{"oral":"不是一回事。`json.loads()` 只能保证这是一段**合法的 JSON 文本**，不能保证字段名对、类型对、必填字段没漏——例如 `{\"nmae\": \"张伟\"}` 拼错字段名、`{\"age\": \"28\"}` 类型是字符串而非整数，这些都能被 `json.loads()` 正常解析，但对下游代码来说都是\"错的\"。 真正可靠的结构化输出要靠三层约束叠加：第一层是 Prompt 层，靠文字描述或者拼接 JSON Schema，解决的问题是让模型\"知道\"应该输出什么结构；第二层是 API 参数层，用 `response_format={\"type\": \"json_object\"}`，解决的问题是保证输出是合法 JSON、减少多余文字；第三层是应用层，靠 JSON Schema 或者 Pydantic 校验，解决的问题是保证字段类型正确、必填项齐全、没有多余字段。 三层需要叠加使用：API 层只能兜底\"合法 JSON\"这一个维度，字段级别的正确性必须靠应用层校验才能保证。","keyPoints":["**json.loads() 的局限**：只能保证是合法 JSON 文本，不能保证字段名对、类型对、必填字段没漏（如拼错的 nmae、字符串类型的 age 都能被正常解析）","**Prompt 层**：靠文字描述或 JSON Schema，让模型“知道”应该输出什么结构","**API 参数层**：`response_format={\"type\": \"json_object\"}`，保证输出是合法 JSON、减少多余文字","**应用层**：靠 JSON Schema 或 Pydantic 校验，保证字段类型正确、必填项齐全——三层需叠加，API 层管不到字段级正确性"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g9_q2","qnum":14,"qtext":"JSON Schema 中 required 和 additionalProperties 分别解决什么问题？","answer":{"oral":"两者共同保证\"字段既不多也不少\"，这是结构化输出能被下游系统安全消费的前提。","keyPoints":["**`required`**：声明哪些字段是必填的。模型如果漏输出这些字段，应用层校验（如 Pydantic）会直接报错，而不是让程序在后续使用 `data[\"field\"]` 时抛 `KeyError`。","**`additionalProperties: False`**：禁止模型输出 Schema 之外的多余字段。没有这个约束时，模型有时会\"自作主张\"多加字段（如把抽取理由也写进 JSON），污染下游数据结构。"],"code":[{"lang":"python","steps":["在 JSON Schema 里定义 schema 字典，type 为 object，properties 里列出 name 和 age 两个字段各自的类型","required 数组里写入 [\"name\", \"age\"]，声明这两个字段必须出现，少任何一个都算校验失败","additionalProperties 设为 False，禁止模型在这两个字段之外再输出别的多余字段，多一个也算校验失败"],"keepCode":"\"required\": [\"name\", \"age\"],\n\"additionalProperties\": False"}],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g9_q3","qnum":15,"qtext":"为什么推荐用 Pydantic 而不是手写 JSON Schema + 校验代码？","answer":{"oral":"手写方案需要单独维护一份 JSON Schema（给 Prompt 用）和一份校验逻辑（给代码用），两者容易\"两处维护、逐渐失步\"。Pydantic 用一个 `class` 同时承担三个职责： 第一是数据结构定义，class 的字段本身就是 Schema；第二是类型校验与转换，用 `Model(**data)`，失败会自动抛出 `ValidationError`，而且能把像 `\"28\"` 这样的字符串自动转成整数 `28`；第三是 Prompt 约束来源，通过 `Model.model_json_schema()` 一键导出，不需要再手写第二份描述。 一份定义，三处复用，比\"手写 Schema + 手写 if/else 校验\"更不容易出现字段定义不一致的问题。","keyPoints":["从 pydantic 导入 BaseModel 和 Field，再从 typing 导入 Optional","定义 ResumeInfo 类继承 BaseModel，name 字段类型为 str 并用 Field 附上中文描述","age 字段类型为 Optional[int]，默认值为 None，同样用 Field 附上描述","调用 ResumeInfo.model_json_schema() 就能自动生成一份 JSON Schema，直接喂给 Prompt 用","调用 ResumeInfo(**json.loads(raw)) 一步完成把原始 JSON 解析、类型校验和转换，失败会自动抛出 ValidationError"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g9_q4","qnum":16,"qtext":"抽取任务中枚举字段的值容易跑偏，如何在 Prompt 和代码层面双重兜底？","answer":{"oral":"**Prompt 层**：在 JSON Schema 里用 `enum` 显式列出所有合法取值，并在提示词中强调\"必须是以下枚举值之一，不要输出其他表述\"： **代码层**：即使加了 `enum`，模型仍可能偶发输出近似但不完全匹配的值（如\"投诉建议\"），需要在校验失败时做一次兜底归一化，而不是直接判定整条记录失败： 两层兜底的关系：Prompt 层的 `enum` 降低跑偏概率，代码层的归一化处理\"降低概率之后仍然存在的长尾情况\"，两者配合才能把枚举命中率提升到生产可用水平。","keyPoints":["定义 normalize_enum 函数，接收模型实际输出的 value 和允许取值列表 allowed","如果 value 本身就在 allowed 列表里，直接原样返回","否则遍历 allowed 里的每个选项，判断该选项是不是被包含在 value 字符串里，是的话就返回这个标准选项，相当于退化为包含关系匹配","如果遍历完还是找不到匹配，就返回 None，交给人工复核，而不是强行归一化成一个可能错误的类别"],"code":[{"lang":"python","steps":["在 JSON Schema 里给 category 字段声明 type 为 string","同时用 enum 数组显式列出所有合法取值：咨询、投诉、建议、故障","配合 Prompt 里强调必须从这几个枚举值里选一个，不要输出其他表述，从源头降低模型跑偏的概率"],"keepCode":"{\"category\": {\"type\": \"string\", \"enum\": [\"咨询\", \"投诉\", \"建议\", \"故障\"]}}"}],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g9_q5","qnum":17,"qtext":"如何从零设计一个支持\"批量抽取 + 类型安全 + 失败重试\"的结构化抽取器？","answer":{"oral":"核心设计原则：**Schema 与 Prompt 自动同步 + 校验失败可重试 + 失败记录不阻塞整体流程**。","keyPoints":["`schemas.py` 新增一个业务场景只需定义一个 Pydantic 模型，`extractor.py` 零改动即可复用","Prompt 约束始终和代码里的类型定义保持一致，不存在\"文档描述和代码不符\"的问题","`batch_extract` 把\"部分记录失败\"和\"整体任务失败\"解耦，失败记录可以离线人工复核或二次重试","client.py 负责初始化并对外暴露共享的 OpenAI client","schemas.py 集中存放各业务场景对应的 Pydantic 模型，比如 ResumeInfo、FeedbackInfo","extractor.py 里放通用的 build_prompt、extract_structured、batch_extract 三个函数，不针对具体业务场景","main.py 作为演示入口，调用前面几个模块跑一遍完整流程","build_prompt 函数接收文本和一个 Pydantic 模型类，调用 model_cls.model_json_schema() 拿到该模型对应的 JSON Schema，再用 json.dumps 转成字符串拼进 Prompt","extract_structured 函数先调用 build_prompt 生成 Prompt，再用 for 循环最多重试 max_retries 次","每次循环里调用 call_llm(prompt) 拿到原始输出 raw，再尝试用 model_cls(**json.loads(raw)) 一步完成解析和校验","如果解析或校验抛出 JSONDecodeError 或 ValidationError，就记录这次的 last_error，进入下一次循环重试；重试次数耗尽后 raise RuntimeError 并带上最后一次的错误信息","batch_extract 函数遍历传入的文本列表，对每条文本调用 extract_structured","成功的结果放进 results 列表，捕获到 RuntimeError 的记录连同下标放进 failures 列表，最后把两个列表打包成 {\"success\":..., \"failed\":...} 返回，单条失败不会影响其他记录继续处理"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g8_q9","qnum":18,"qtext":"综合应用：只用 Prompt 约束、结构化抽取和客户端封装这些基础能力，从零搭一个“论文快读助手”，怎么设计？","answer":{"oral":"**需求**：输入一篇论文/长文，输出中文速读卡片（一句话结论、三个要点、关键词、元信息抽取）。 **工程细节**：Key 走 .env；client 封装复用；批处理时加 429 指数退避；留 5 篇固定测试论文做 Prompt 回归。 这个方案证明：**摘要约束 + 结构化抽取 + 客户端封装**这套基础组合拳，已能做出实用的小工具。","keyPoints":["**输入处理**：读文件（`Path.read_text(encoding=\"utf-8\")`），超长文本先做段落级粗筛——按标题/摘要/结论优先截取，控制输入 Token","**多任务单次调用**：用抽取任务承载全部输出——定义字段 schema（`{\"one_line\": \"...\", \"points\": \"...\", \"keywords\": [...], \"venue\": \"...\"}`），temperature=0.3、JSON mode、字段定义 + 兜底规则进 Prompt","**校验与展示**：`parse_json_safe` 解析 → `setdefault` 补全 → 类型检查 → 格式化打印卡片；记录 usage 并按单价估算单篇成本"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易只描述做了什么，说不出设计取舍和可以改进的地方。"]}}]},{"name":"输出校验与异常处理","questions":[{"id":"g10_q1","qnum":1,"qtext":"大模型调用链路中常见的异常有哪些？如何区分可重试与不可重试？","answer":{"oral":"一次抽取请求要经过\"网络 → HTTP 状态码 → JSON 解析 → 字段校验\"多个环节，每个环节都有特有的失败方式： 先看网络层，`ConnectionError` 或者 `Timeout` 是可以重试的；再看 HTTP 层，429 限流是可以重试的，但需要退避，500/502/503 这类服务端错误也是可以重试的，而 401/403 这种 Key 无效或无权限的问题，本质是配置错误，**不可重试**，因为重试无法自愈，应该立即终止并告警，404 模型名写错了同样**不可重试**，也属于配置问题；再看解析层，`json.JSONDecodeError` 是可以重试的，换一次生成大概率能拿到合法 JSON；最后是校验层，`pydantic.ValidationError` 要视情况重试 1-2 次，仍然失败就转入业务兜底。 判断标准：**这次失败是偶发的（网络抖动、模型这次没输出好）还是确定性的（配置错了、权限不对）**。偶发性错误值得重试，确定性错误重试只会浪费时间和 Token，还会掩盖真正的问题。","keyPoints":["**网络层**：ConnectionError、Timeout 可以重试","**HTTP 层**：429（需退避）、500/502/503 可重试；401/403（Key 无效/无权限）、404（模型名写错）属于配置错误，不可重试，应立即终止并告警","**解析/校验层**：json.JSONDecodeError 可重试；pydantic.ValidationError 要视情况重试 1-2 次","**判断标准**：失败是偶发的（网络抖动、模型这次没输出好）就值得重试，是确定性的（配置错、权限不对）重试只会浪费时间、掩盖问题"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g10_q2","qnum":2,"qtext":"json.JSONDecodeError 和 pydantic.ValidationError 分别代表什么层面的失败？处理策略有何不同？","answer":{"oral":"`json.JSONDecodeError` 是格式层面的失败，典型场景是模型输出被截断、掺杂了非 JSON 字符，处理策略是值得重试——重新生成一次大概率能拿到完整合法的 JSON；`pydantic.ValidationError` 则是语义层面的失败，典型场景是字段名拼错、类型不匹配、必填项缺失，处理策略要看具体错误类型：`missing`（缺字段）和类型不匹配值得重试 1-2 次，仍失败则不再无脑重试，转入业务兜底（标记待复核或丢弃）。 关键区别：前者是\"这段文本根本不是合法 JSON\"，后者是\"JSON 合法，但内容不符合预期结构\"。两者都应该被统一包装成结构化的返回值（而不是让异常直接向上抛），调用方只需要判断 `ok` 字段，不需要关心具体抛了哪种异常。","keyPoints":["**json.JSONDecodeError**：格式层面失败（输出被截断、掺杂非 JSON 字符），值得重试，重新生成大概率能拿到合法 JSON","**pydantic.ValidationError**：语义层面失败（字段名拼错、类型不匹配、必填项缺失），missing 和类型不匹配值得重试 1-2 次，仍失败则转业务兜底","**关键区别**：前者是“这段文本根本不是合法 JSON”，后者是“JSON 合法但内容不符合预期结构”","**统一处理**：两者都应包装成结构化返回值，调用方只判断 ok 字段，不需要关心具体抛了哪种异常"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g10_q3","qnum":3,"qtext":"抽取结果字段缺失时，如何设计兜底策略而不是简单地\"报错\"或\"忽略\"？","answer":{"oral":"核心原则：**不是所有缺失都一样严重，应该按字段重要性分级处理**，而不是用同一种策略应对所有缺失字段。 具体分三种策略：第一种是默认值填充，做法是给缺失字段填 `null`、空字符串或者 `0`，适用场景是该字段本来就允许为空；第二种是标记待人工复核，做法是记录到 `needs_review`，并附带缺失原因，适用场景是缺失的是重要字段，需要人工确认；第三种是直接丢弃记录，做法是把该条数据完全跳过，适用场景是缺失的是必填字段，记录已经不可用了。 按字段等级（`REQUIRED` / `IMPORTANT` / `OPTIONAL`）判断记录最终该归入 `success`、`needs_review` 还是 `failed` 三态之一： 这样批量任务的\"成功率\"不再是非黑即白，能清楚回答\"有多少可以直接用、多少需要人工看一眼、多少彻底失败\"。","keyPoints":["定义 assess_completeness 函数，接收抽取结果 data 和每个字段对应的重要性等级 field_levels","先用列表推导式找出所有等级为 REQUIRED 且在 data 里缺失的字段，存入 missing_required","再用同样的方式找出所有等级为 IMPORTANT 且缺失的字段，存入 missing_important","如果 missing_required 不为空，直接返回 \"failed\"，因为必填字段缺了这条记录就不可用","如果没有必填字段缺失但 missing_important 不为空，返回 \"needs_review\"，标记为待人工复核","如果两者都没缺，返回 \"success\"，说明这条记录可以直接使用"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g10_q4","qnum":4,"qtext":"如何从零设计一个不会因单条脏数据崩溃的健壮批量抽取器？","answer":{"oral":"核心设计原则：**分层捕获异常 + 按错误类型决定重试策略 + 结果三态化，让单条数据的失败不影响整批任务**。","keyPoints":["`call_llm_with_backoff` 只负责网络层重试，遇到 401/403/404 这类不可恢复错误立刻抛出，不浪费重试次数","`parse_and_validate` 把 JSON 解析和 Pydantic 校验两类异常收敛为统一的 `(obj, error)` 返回值，避免多层嵌套 `try/except`","`assess_completeness` 把\"数据本身不完整\"和\"程序出错\"分开处理，避免把正常的业务缺失当成异常上报","`batch_extract_robust` 用 `try/except` 包住每条数据的处理，配合三态分桶，保证 1000 条里有几条脏数据也不会拖垮整个批次","call_llm_with_backoff 函数用 for 循环最多重试 max_retries 次，每次在 try 里调用真实的 API","捕获到异常后先取出 status_code，如果是 401/403/404 这类不可恢复错误，直接抛出 NonRetryableError，不再浪费重试次数","其他类型的异常则按指数退避公式 base_delay * (2 ** attempt) 再加一点随机抖动来 sleep，然后进入下一次重试，重试次数耗尽仍失败就直接 raise","parse_and_validate 函数先用 try 包裹 json.loads(raw)，解析失败就返回 (None, \"json_error...\")","解析成功后再用 try 包裹 model_cls(**data) 做 Pydantic 校验，校验失败则返回 (None, \"validation_error...\")，校验成功则返回 (对象, None)","extract_robust 函数把上面两步串起来：先调用 call_llm_with_backoff 拿原始文本，遇到不可恢复错误就直接返回 status=\"failed\" 的记录；拿到文本后调用 parse_and_validate，成功则再调用 assess_completeness 判断三态，失败则进入下一次重试循环，循环耗尽后返回 failed 记录；batch_extract_robust 则准备好 success/needs_review/failed 三个桶，遍历所有文本分别塞进对应的桶，单条数据的异常被 try/except 兜住，不会中断整个循环"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g29_q1","qnum":5,"qtext":"LLM 项目中异常处理的\"分层设计\"是什么？各层应该如何处理各自的异常？","answer":{"oral":"分层设计指不同代码层只处理自己能解决的异常，不能处理的向上抛或降级，具体分三层。第一层是工具层，位于 `tools/*.py`，处理策略是 `return {\"error\": True, \"message\": \"...\"}`，错误表现为工具返回错误 dict，让模型基于这个 dict 生成友好回复。第二层是工作流层，位于 `core/workflow.py`，处理策略是捕获 API 异常（超时、限流、认证），能重试的就重试，错误表现是返回错误文案，并把 `terminated_by` 标记为 \"error\"。第三层是 UI 层，位于 `app.py`，处理策略是用 `try/except Exception` 兜底，错误表现是用户只看到友好文案，不会看到 traceback。 **工具层不抛异常的原因**：工作流用 for 循环驱动，工具抛异常会中断整个循环；返回 error dict 让模型能基于错误信息生成自然语言提示（\"这个城市暂不支持，您是想查哪里？\"）。","keyPoints":["**三层分工**：工具层（tools/*.py）返回 error dict；工作流层（core/workflow.py）捕获 API 异常并重试、标记 terminated_by 为 error；UI 层（app.py）用 try/except 兜底给友好文案","**工具层不抛异常**：工作流用 for 循环驱动，抛异常会中断整个循环；返回 error dict 能让模型基于错误信息生成自然语言提示","**分层原则**：每层只处理自己能解决的异常，处理不了的向上抛或降级"],"code":[{"lang":"python","steps":["捕获 RateLimitError 异常时，用 time.sleep 按尝试次数做指数退避等待，然后 continue 重试当前循环","捕获 AuthenticationError 异常时，认为认证错误没有重试的意义，直接返回一个标记 terminated_by 为 auth_error 的 WorkflowResult"],"keepCode":"except RateLimitError:\n    time.sleep(5 * (attempt + 1))\n    continue\nexcept AuthenticationError:\n    return WorkflowResult(final_answer=\"...\", terminated_by=\"auth_error\")"}],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g29_q2","qnum":6,"qtext":"给 LLM 项目加日志时，应该记录哪三类关键信息？各自的内容是什么？","answer":{"oral":"这三类日志分别是启动日志、请求日志和错误日志。第一类是启动日志，在程序启动时记录，内容包括模型名称、API Base URL、Key 的前几位（脱敏处理）、以及最大迭代次数，用途是确认配置正确、便于定位环境问题。第二类是请求日志，在每次 API 调用后记录，内容包括耗时（秒）、input_tokens、output_tokens、total_tokens，用途是做性能分析、成本监控，及时发现异常高消耗的情况。第三类是错误日志，在异常发生时记录，内容包括工具名称、参数、异常类型，并配合 `logger.exception()` 自动附加完整的 traceback，用途是不需要重现问题就能排查原因。","keyPoints":["API Key **绝对不能完整打印**到日志，只打印前 8 位作为验证标识","使用 `logger.exception()` 而不是 `logger.error()`，前者自动附加完整异常链（traceback）","`logging.basicConfig` 只在主入口调用**一次**；子模块用 `logging.getLogger(__name__)` 继承"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g29_q3","qnum":7,"qtext":"什么是\"fail-fast\"？配置验证为什么要在启动时而不是请求时做？","answer":{"oral":"**Fail-fast**：系统在检测到错误配置时立即停止执行，而不是等到运行时才暴露错误。 这两种做法可以从几个角度来对比。先看错误发现的时机：不做验证的话，往往要等用户发第一条消息触发调用才会崩溃，而做了启动时验证，程序启动几秒内配置有问题就直接报错退出了，根本不用等有人来用。再看错误定位，不做验证时抛出来的是很深层的异常，光看报错很难判断是配置问题还是代码问题；做了 fail-fast 之后，会直接给出类似\"DEEPSEEK_API_KEY 未设置\"这种明确到位的提示。然后是成本风险，不做验证如果是跑了好几次请求才报错，Token 可能已经白白消耗掉了，而 fail-fast 是在真正调用模型之前就拦住了，成本是零。最后是用户体验，不做验证用户看到的是一堆 Python 的 traceback，很唬人；做了 fail-fast 用户看到的是\"请检查 .env 文件\"这种友好提示，体验完全不一样。","keyPoints":["_load 函数先建一个空的 errors 列表","用 os.getenv 读取 DEEPSEEK_API_KEY 并去除空白，如果为空就把错误信息追加进 errors","如果 errors 不为空，打印所有错误信息并调用 sys.exit(1) 立即终止程序，不再继续往下走","校验通过才会构造并返回 Config 对象","在模块级别直接执行 CFG = _load()，这样只要 import 这个模块，配置校验就会在程序刚启动、最早的时机被触发"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g29_q4","qnum":8,"qtext":"工具调用的输出校验（output validation）应该验证什么？如何实现？","answer":{"oral":"输出校验防止\"脏数据\"（格式错误的数据）传入下一层。应在三处做校验：","keyPoints":["使用 `response_format={\"type\": \"json_object\"}` 约束格式","用 Pydantic `model_validate_json()` 验证字段","校验失败时降级返回默认值，不崩溃","validate_tool_result 函数先检查 result 是不是 dict 类型，不是就直接返回一个格式错误的错误 dict","如果 result 里已经带 error 字段，说明是合法的错误 dict，直接原样透传返回","根据工具名去 REQUIRED_FIELDS 里查这个工具应该有哪些必填字段，找出 result 里缺失的字段","如果有缺失字段，用 logger.warning 记录警告日志，但不阻断流程，仍然返回 result","检查 wf.final_answer 去除空白后是否为空","如果为空，说明工作流没能生成有效回答，就把它替换成一句友好的兜底提示文字"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g29_q5","qnum":9,"qtext":"如何从零给一个 LLM 项目补全\"异常处理 + 日志 + 配置验证 + 输出校验\"四件套？","answer":{"oral":"按以下顺序改造，优先做影响最大的： **Step 1：配置验证（改 `core/config.py`）** **Step 2：日志初始化（改 `app.py` 主入口）** **Step 3：API 异常处理（改 `core/workflow.py`）** **Step 4：工具层（改 `tools/*.py`）** **Step 5：UI 兜底（改 `app.py` 的 respond 函数）** **验证顺序**：先删 API Key 测 fail-fast → 再 mock RateLimitError 测重试 → 再传错工具参数测工具兜底 → 最后整体跑 5 次对话验日志输出。","keyPoints":["把 `Config` 加载逻辑包在 `_load()` 函数里","收集所有配置错误（不要发现一个就退出，收集全部后一次性报错）","`if errors: sys.exit(1)`，模块级调用 `CFG = _load()`","在 `if __name__ == \"__main__\":` 前调用 `setup_logging()`","`httpx`/`httpcore` 降级为 WARNING 避免刷屏","各子模块添加 `logger = logging.getLogger(__name__)`","把 API 调用包在 `_call_api()` 函数里","`RateLimitError` → 重试 3 次（指数退避）","`AuthenticationError` → 立即返回错误，不重试","`APITimeoutError/APIConnectionError` → 抛 `ConnectionError`，上层捕获","所有工具用 `try/except` 包裹，返回 `{\"error\": True, \"message\": \"...\"}` 而非抛异常","在 `dispatch()` 里加 `TypeError` 捕获（参数不匹配）和兜底 `Exception`","`try/except Exception` 包裹整个业务调用","把技术错误转成用户友好文案"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g15_q3","qnum":10,"qtext":"为什么说输出校验比\"提示模型要小心\"更可靠？这体现了什么工程原则？","answer":{"oral":"\"提示模型小心\"是依赖 LLM 的输出自律，\"校验\"是在代码层建立检查点——两种方式的本质差距类似于\"提醒开发者别提交密钥\"和\"用 `.gitignore` 阻止提交\"：前者依赖人的记忆，后者用机制保障。 从四个维度对比就能看出差距：失败时的行为上，依赖提示是随机、不可预测的，代码层校验则是确定性地抛出异常；失败的可发现性上，依赖提示可能悄悄带着错误数据继续运行，代码层校验会立即捕获、不让错误流入下游；补救手段上，依赖提示没有补救手段（已经继续运行了），代码层校验则有重试 → 兜底 → 三态结果这一整套机制；随时间的稳定性上，依赖提示会随模型版本更新而波动，代码层校验只要代码逻辑不变，行为就是稳定的。 **体现的工程原则**：\"能用机制保证的事情，不依赖人（或模型）的自律\"。校验层的意义不是\"LLM 会出错所以不信任它\"，而是\"任何外部输入（包括 LLM 输出）都应该在进入业务逻辑前经过验证\"——这和验证用户输入、验证第三方 API 响应是完全相同的工程理念。","keyPoints":["**本质类比**：“提示模型小心”像“提醒开发者别提交密钥”，依赖人的记忆；“校验”像用 .gitignore 阻止提交，靠机制保障","**四维度对比**：失败行为上前者随机不可预测、后者确定性抛异常；可发现性上前者可能带错误数据继续运行、后者立即捕获；补救手段上前者没有、后者有重试→兜底→三态结果；稳定性上前者随模型版本波动、后者代码不变行为就稳定","**工程原则**：能用机制保证的事情，不依赖人（或模型）的自律；任何外部输入（包括 LLM 输出）都应在进入业务逻辑前经过验证"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}}]},{"name":"文本分类","questions":[{"id":"g11_q1","qnum":1,"qtext":"分类任务和信息抽取任务在 Prompt 设计上有什么本质区别？","answer":{"oral":"核心区别在于**答案空间**：抽取任务的答案来自原文、半开放（找不到就是 null）；分类任务的答案空间**有限且预先确定**，模型必须从一个固定的标签集合里选一个，没有\"部分正确\"的中间状态。 具体展开来看几个维度的差异：在答案空间上，抽取任务是半开放的，答案来自原文中的值；分类任务的答案空间则有限且预定义。在 Prompt 核心内容上，抽取任务要描述\"字段\"（字段名、类型、示例），分类任务要描述\"标签集合\"（每个标签的定义 + 边界示例）。在核心约束手段上，抽取任务依赖 JSON Schema + Pydantic，分类任务则用 `enum`。在评估方式上，抽取任务只能看字段级别对错，分类任务则可以用准确率、混淆矩阵这类客观可量化的指标。 因此分类任务的 Prompt 不需要像抽取那样描述字段类型，而要把精力放在**把每个标签的定义写清楚**——标签名对人类含义明确，但对模型来说只是一个字符串，必须靠清晰定义 + 边界案例示例才能让模型判断标准和人工标注对齐。","keyPoints":["**答案空间**：抽取任务答案来自原文、半开放（找不到是 null）；分类任务答案空间有限且预先确定，必须从固定标签集合里选一个","**Prompt 核心内容**：抽取要描述“字段”（字段名、类型、示例），分类要描述“标签集合”（每个标签的定义+边界示例）","**约束手段与评估**：抽取依赖 JSON Schema+Pydantic、只能看字段级对错；分类用 enum、可用准确率、混淆矩阵这类客观指标","**设计重点**：分类 Prompt 要把精力放在把每个标签的定义写清楚，标签名对模型只是字符串，需清晰定义+边界案例才能对齐人工标注"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g11_q2","qnum":2,"qtext":"一个好的标签集合应该满足哪些设计原则？","answer":{"oral":"设计原则大概有四条。第一是互斥，也就是 Mutually Exclusive，每条数据理想情况下只应该明确属于一个类别，类别定义之间不应该相互重叠；第二是完备，也就是 Collectively Exhaustive，标签集合要覆盖绝大多数真实数据，还要预留一个\"其他\"兜底类别，不强迫模型硬选；第三是定义清晰，每个标签要配一句话的定义，再加上 1-2 个边界示例，而不是只给一个词；第四是数量适中，通常控制在 3-15 类，类别太多的话模型在长列表里选择的准确率会明显下降，这种情况可以考虑先分大类再细分，也就是两级分类。 其中\"完备性\"最容易被忽视：如果标签集合里没有\"其他\"这样的兜底选项，模型遇到模糊或不相关的数据时会被迫\"矬子里拔将军\"，硬选一个不合适的标签，污染统计结果。","keyPoints":["**互斥**（Mutually Exclusive）：每条数据理想情况下只应明确属于一个类别，类别定义不应相互重叠","**完备**（Collectively Exhaustive）：覆盖绝大多数真实数据，还要预留“其他”兜底类别，不强迫模型硬选","**定义清晰**：每个标签配一句话定义+1-2 个边界示例，而不是只给一个词","**数量适中**：通常控制在 3-15 类，类别太多模型选择准确率会下降，可先分大类再细分（两级分类）"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}},{"id":"g11_q3","qnum":3,"qtext":"为什么用 enum 而不是普通字符串字段约束分类标签？单标签和多标签分类的实现有什么不同？","answer":{"oral":"用 Python 原生 `Enum` 类型（配合 Pydantic）而不是普通字符串 + 手写 `if value not in [...]` 校验，好处是**类型系统本身就是校验规则**： `model_json_schema()` 会自动把 `Enum` 转成 JSON Schema 的 `enum` 约束，Schema 定义和校验逻辑共用同一份代码，不会出现\"文档写了 5 个类别、代码只校验了 4 个\"的不一致。 Prompt 措辞也要相应调整（\"选择最符合的一个类别\" vs \"选择所有符合的类别，可以是多个\"），如果 Prompt 里没写清楚是单选还是多选，模型的输出形态（单个字符串 vs 列表）会不稳定。","keyPoints":["**类型系统即校验**：用 Python 原生 Enum（配合 Pydantic）而非字符串+手写 if 校验，model_json_schema() 会自动把 Enum 转成 JSON Schema 的 enum 约束，避免文档和代码校验不一致","**单标签**：category 字段类型直接标注为枚举类型，表示一条数据只能属于一个类别","**多标签**：改用 categories 字段，类型为 list[枚举]，表示可以同时属于多个类别","**Prompt 措辞需配合**：要写清是单选还是多选，否则模型输出形态（字符串 vs 列表）会不稳定"],"code":[{"lang":"python","steps":["定义 FeedbackCategory 类，同时继承 str 和 Enum，枚举出咨询、投诉、其他这几个具体取值","定义 ClassificationResult 类继承 BaseModel，category 字段的类型直接写成 FeedbackCategory 这个枚举类型","如果模型输出的值不在枚举范围内，Pydantic 在构造对象时会直接抛出 ValidationError，类型系统本身就承担了校验职责"],"keepCode":"class FeedbackCategory(str, Enum):\n    CONSULT = \"咨询\"\n    COMPLAINT = \"投诉\"\n    OTHER = \"其他\"\n\nclass ClassificationResult(BaseModel):\n    category: FeedbackCategory"},{"lang":"python","steps":["单标签场景下，SingleLabelResult 类的 category 字段直接标注为 FeedbackCategory 类型，表示一条数据只能属于一个类别","多标签场景下，MultiLabelResult 类改用 categories 字段，类型标注为 list[FeedbackCategory]，表示可以同时属于多个类别","两者的区别完全体现在字段类型是单个枚举还是枚举列表上，Prompt 措辞也要相应写清楚是单选还是多选"],"keepCode":"class SingleLabelResult(BaseModel):\n    category: FeedbackCategory\n\nclass MultiLabelResult(BaseModel):\n    categories: list[FeedbackCategory]"}],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g11_q4","qnum":4,"qtext":"为什么不能盲目相信 LLM 单次调用给出的分类结果？如何用 Self-Consistency 估计置信度？","answer":{"oral":"传统机器学习分类器的 `predict_proba()` 天然带置信度（如\"投诉 0.55，故障 0.40\"），但 LLM 单次调用只返回一个确定的字符串 `{\"category\": \"投诉\"}`——即使这条数据本身很模糊，模型也会给出一个看起来\"言之凿凿\"的答案，看不出模型内部其实\"很纠结\"。 **Self-Consistency** 思路：对同一条数据用较高的 `temperature`（引入随机性）多次调用，统计结果的一致程度作为置信度的近似： 置信度低（如 < 0.6）的记录应标记为\"待人工复核\"而不是直接采信。代价是调用次数乘以 `n_samples`，通常只对少量关键数据或抽样质检使用，不建议全量跑。","keyPoints":["定义 classify_with_confidence 函数，接收文本 text 和采样次数 n_samples，默认 5 次","用 for 循环调用 n_samples 次 chat.completions.create，每次都用较高的 temperature=0.7 引入随机性，让模型有机会给出不同答案","每次调用后从返回结果里解析出 category 字段，追加进 votes 列表","用 Counter(votes) 统计每个类别出现的次数，取出现次数最多的类别 top_category 及其次数 top_count","用 top_count 除以 n_samples 算出置信度，一起返回 category 和 confidence","置信度较低的记录（比如小于 0.6）应该标记为待人工复核，而不是直接采信这一次多数投票的结果"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g11_q5","qnum":5,"qtext":"如何从零设计一个可评估准确率、支持批量运行的文本分类器？从零描述你的思路。","answer":{"oral":"核心设计原则：**enum 锁定标签集合 + 强类型校验兜底 + 分布统计 + 人工基准评估准确率**。","keyPoints":["`Enum` + Pydantic 让\"标签值是否合法\"这件事由类型系统保证，不需要额外写归一化逻辑","`classify_structured` 复用“解析失败就重试”的思路，重试耗尽后兜底为\"其他\"而不是让程序崩溃","`batch_classify` 的类别分布统计是分类任务特有的产出，能直接回答\"这批数据里投诉占比多少\"这类业务问题","`evaluate_accuracy` 用小样本人工标注做基准，混淆矩阵能定位\"哪两个类别定义不够清晰\"，指导下一轮 Prompt 优化","定义 FeedbackCategory 枚举类，列出咨询、投诉、建议、故障、其他五个类别；ClassificationResult 模型的 category 字段类型就是这个枚举","classify_structured 函数先调用 build_classify_prompt 生成含每个类别定义的 Prompt，再用 for 循环最多重试 max_retries 次","每次循环里以 temperature=0.0 调用 call_llm 并要求 JSON 输出，尝试用 ClassificationResult(**json.loads(raw)) 解析，失败就 continue 进入下一次重试","重试次数耗尽仍失败，就直接返回 category 为 OTHER 的兜底结果，而不是让程序崩溃","batch_classify 函数对文本列表逐条调用 classify_structured，再用 Counter 统计所有结果里各类别出现的次数，得到分布字典","evaluate_accuracy 函数把预测结果和人工标注的 ground_truth 逐一比较，计算相等比例作为 accuracy，再用 Counter(zip(...)) 统计每一对（真实类别，预测类别）出现的次数，构成混淆矩阵，帮助定位哪两个类别容易混淆"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只考虑调用成功的情况，没有设计失败重试和降级逻辑。"]}}]},{"name":"配置管理与日志","questions":[{"id":"g14_q1","qnum":1,"qtext":"为什么 API Key 不能硬编码在代码中？`.env` + `.gitignore` 方案是如何配合使用的？","answer":{"oral":"硬编码密钥的风险链条是：代码提交到 Git → 仓库成员可见（哪怕是私有仓库）→ 一旦 push 到公开仓库，GitHub 等平台秒级扫描发现密钥 → Key 被吊销或盗用。这不是\"只要小心就能避免\"的问题——依赖人的自律不如用机制来保障。 `.env` + `.gitignore` 方案的分工很清晰：`.env` 文件保存真实的 Key 和本地配置值，属于**不提交**的文件（在 `.gitignore` 中排除）；`.env.example` 文件只保存变量名和占位符说明，属于**需要提交**的文件（供团队参考应该设哪些变量）。 `load_dotenv()` 的关键行为：环境变量已存在时默认不覆盖，CI/CD 注入的密钥优先级自然高于 `.env` 文件——这正是\"命令行/环境变量 > .env 文件\"优先级的机制实现。","keyPoints":["在 .env 文件里写入真实的 DEEPSEEK_API_KEY 具体值，这个文件不提交到 Git","在 .env.example 文件里用占位符写出同名变量，作为提交到仓库的示例，供团队参考需要配置哪些变量","调用 load_dotenv() 把 .env 文件中的变量加载进程序的环境变量，如果环境变量已存在则默认不覆盖","用 os.getenv(\"DEEPSEEK_API_KEY\") 读取该环境变量的值","如果没有取到值（api_key 为空），抛出 ValueError 提示需要在 .env 中配置"],"code":[],"followUp":["如果这个方案要支持高并发调用，你会怎么优化？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g14_q2","qnum":2,"qtext":"配置的三种来源（命令行参数、环境变量、.env 文件）优先级如何排序？为什么这样设计？","answer":{"oral":"优先级从高到低：**命令行参数 > 环境变量 > .env 文件 > 代码默认值**。命令行参数优先级最高，典型用途是临时覆盖——调试时一次性切换模型；环境变量优先级次之，典型用途是 CI/CD 注入密钥，不同机器/环境设不同值；`.env` 文件优先级居中，典型用途是本地开发默认配置，每人一份不互相干扰；代码默认值优先级最低，典型用途是非必填项的合理兜底，方便快速启动。 **设计原因**：越\"临时\"的来源优先级越高——命令行参数是单次运行时的临时覆盖，不应该被持久化的 `.env` 文件覆盖；环境变量是运维/CI 在部署时注入的\"正式值\"，同样不应被开发者的本地 `.env` 覆盖；代码默认值只是\"写了比没写好\"的最低保障，任何外部配置都应该覆盖它。这种设计让同一份代码在开发、测试、生产三个环境中，只需改配置来源而无需改代码。","keyPoints":["**优先级**：命令行参数 > 环境变量 > .env 文件 > 代码默认值","**各自用途**：命令行参数用于临时覆盖（调试切换模型）；环境变量用于 CI/CD 注入密钥；.env 用于本地开发默认配置；代码默认值用于非必填项兜底","**设计原因**：越“临时”的来源优先级越高——命令行不应被持久化的 .env 覆盖，运维/CI 注入的环境变量不应被开发者本地 .env 覆盖","**好处**：同一份代码在开发、测试、生产三个环境中，只需改配置来源而无需改代码"],"code":[],"followUp":["这个设计放到很长的多轮对话里，还站得住脚吗？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g14_q3","qnum":3,"qtext":"Python `logging` 的五个级别分别适合哪些场景？为什么建议用 `logging` 而不是 `print`？","answer":{"oral":"Python logging 一共有五个级别，级别从低到高分别对应不同的使用场景。第一个是 DEBUG，数值是 10，在 LLM 项目里典型用途是打印完整的 messages 列表、原始 API 响应，这个一般开发时用，生产环境要关掉。第二个是 INFO，数值 20，典型用途是记录程序启动信息、每次 API 调用完成时的耗时和 Token 数。第三个是 WARNING，数值 30，典型用途是触发重试、输出被 max_tokens 截断、请求临近限速这类情况。第四个是 ERROR，数值 40，典型用途是 JSON 解析失败、API 调用失败但程序还能继续运行的场景。最后是 CRITICAL，数值 50，典型用途是 API Key 无效这种程序完全无法继续的灾难性错误。 **为什么不用 `print`**：其实从几个能力点上一比就很清楚。第一，区分严重程度这件事上，`print` 根本没有这个概念，而 `logging` 有五个级别可以用。第二，运行时过滤上，`print` 想关掉日志只能去注释代码，`logging` 用 `setLevel()` 一行代码就能切换。第三，自动时间戳，`print` 没有，`logging` 是自带的。第四，写入文件，`print` 得自己手动重定向，`logging` 只要加一个 `FileHandler` 就行。最后是性能这块，尤其是日志被过滤掉的时候差别很大：`print` 用的 `f-string` 不管有没有用到，都会先把字符串拼接计算出来；而 `logging` 用 `%s` 这种占位符格式化，只要这条日志被过滤掉，根本不会去执行字符串拼接。 实践细节：`logger.debug(\"msg: %s\", obj)` 而不是 `logger.debug(f\"msg: {obj}\")`——后者无论日志级别是否过滤都会先执行字符串拼接，前者在 DEBUG 被过滤时完全不计算，大对象场景下性能差异明显。","keyPoints":["**五个级别（低到高）**：DEBUG（打印完整 messages/原始响应，生产关闭）、INFO（启动信息、调用耗时和 Token 数）、WARNING（触发重试、输出被截断、临近限速）、ERROR（解析/调用失败但程序能继续）、CRITICAL（API Key 无效等灾难性错误）","**为何不用 print**：logging 可分级过滤（setLevel 一行切换）、自带时间戳、加 FileHandler 就能写文件，print 都做不到","**性能差异**：print 的 f-string 无论用没用到都会先拼接字符串；logging 用 %s 占位符，日志被过滤时根本不执行拼接","**实践细节**：应写 `logger.debug(\"msg: %s\", obj)` 而非 f-string 形式，大对象场景下性能差异明显"],"code":[],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易把 Prompt 写死在代码里，没有做模板化和版本管理。"]}},{"id":"g14_q4","qnum":4,"qtext":"给 LLM 项目的 API 调用加日志，应该记录哪些关键信息？","answer":{"oral":"最小有效日志集合：**请求标识 + 耗时 + Token 消耗**——这三个数字回答了排查时最常见的三个问题（这是哪个请求？为什么慢？钱花在哪了？ **启动日志单独处理**：程序启动时打印一次当前生效的配置（模型名、API Key 前 8 位、超时等），让运维在日志文件里就能确认\"这次跑的是哪个配置\"，而不需要登录机器查看 `.env` 文件： **打印 API Key 前 8 位而非完整值**：能区分\"用的是哪个 Key\"但不泄露完整密钥，是\"可调试性\"和\"安全性\"之间的标准折中。","keyPoints":["call_with_logging 函数开始时用 time.monotonic() 记录起始时间","在 try 块里调用 client.chat.completions.create 发起请求","请求成功后计算耗时 elapsed，并从 response.usage 取出 prompt_tokens 和 completion_tokens","用 logger.info 把标签、耗时、输入输出 Token 数一并记录下来","如果请求过程中抛出异常，在 except 块里同样计算耗时，用 logger.error 记录标签、耗时和错误信息，再重新抛出异常"],"code":[{"lang":"python","steps":["用 logger.info 记录当前生效的配置：模型名、超时时间","对 api_key 做切片 api_key[:8]，只打印密钥的前 8 位而非完整值，兼顾可调试性与安全性"],"keepCode":"logger.info(\"模型：%s | Key：%s... | 超时：%ds\", model, api_key[:8], timeout)"}],"followUp":["如果输出格式校验失败了，你的兜底策略是什么？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g14_q5","qnum":5,"qtext":"如何从零设计一个\"配置 + 日志 + 重试\"三合一的可维护 LLM 客户端？","answer":{"oral":"核心设计原则：**配置对象化（可测试） + 日志结构化（可追溯） + 重试分级（可重试 vs 不可重试）**。","keyPoints":["**配置层**：`AppConfig.from_env()` 集中读取和校验，测试时可直接 `AppConfig(api_key=\"test\", ...)` 构造，不依赖真实环境变量","**日志层**：INFO 记录正常里程碑（耗时/Token），WARNING 记录临时性问题（重试），ERROR 记录不可恢复错误——级别清晰，生产环境用 `LOG_LEVEL=WARNING` 屏蔽噪音","**重试层**：区分\"可重试\"（限速/网络/5xx）和\"不可重试\"（401/400）——不区分地无脑重试会浪费时间，直接 raise 让调用方知道是不可恢复的错误","定义 AppConfig dataclass 保存 api_key、model_name、base_url、max_retries、request_timeout 等配置项","from_env 类方法从环境变量读取这些配置，如果 API Key 未设置就抛出 ValueError，其余项用 os.getenv 提供默认值","用 logging.basicConfig 设置日志格式并输出到标准输出，得到统一的 logger","LLMClient 初始化时用 config 创建 OpenAI 客户端，并打印初始化日志（含模型名和 Key 前几位）","chat 方法在 for 循环里最多重试 max_retries 次：每次调用 create 发起请求并记录耗时和 Token 日志，成功则直接返回结果","根据异常类型分级处理：RateLimitError 和 APIConnectionError 属于可重试错误，记 WARNING 并等待后继续循环；APIStatusError 里 400/401/403 视为不可重试直接 raise，其它状态码按可重试处理；循环耗尽仍未成功则抛出 RuntimeError"],"code":[],"followUp":["换一个模型厂商的 API，这里的实现思路需要跟着改吗？"],"pitfalls":["容易只关注功能实现，忽略了 Token 成本和调用开销。"]}},{"id":"g15_q4","qnum":6,"qtext":"为什么日志和配置管理要在 Demo 阶段就引入，而不是等项目变大再补？","answer":{"oral":"**配置管理的债务是复利**：从第 1 个硬编码密钥到第 10 个，改造成本是线性增长的；但一旦发生泄露，代价是非线性的。更重要的是，改造时机越晚，\"顺便用原来的方式就好了\"的惯性越强，技术债越难偿还。 **日志的价值在出问题时才体现**：用 `print()` 的项目出了问题必须在本地复现，而 `logging` 的项目看日志文件就能定位。问题总是在最不方便的时候（线上、压力下）发生，此时才意识到没有日志为时已晚。 **最佳实践**：把 `setup_logging()` 和 `AppConfig.from_env()` 写进项目模板，新建任何 LLM 脚本时第一件事就是复制这两行——让好习惯的执行成本趋近于零。","keyPoints":["最佳引入时机是第一次写下 client = OpenAI(api_key=\"...\") 的那一刻","此时的改造成本很低：创建 .env 文件，写好 AppConfig.from_env()，大约只需 10 分钟","但带来的收益是长期的：所有脚本共享同一份配置，改一处就能全部生效，也不会再意外把密钥提交到仓库","用 print() 调试时，线上出问题后只能凭记忆复现现场——不知道当时的输入、输出和耗时，复现往往还不稳定，排查耗时很长","用 logging 记录后，排查时直接查日志文件，就能看到时间戳、输入摘要、错误类型和 Token 消耗","有了这些结构化信息，通常几分钟内就能定位问题，而不是花大量时间去复现"],"code":[],"followUp":["这些知识点之间是怎么串联起来、构成一条完整链路的？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}},{"id":"g28_q3","qnum":7,"qtext":".env.example 和 .gitignore 应该怎么写？为什么不能提交 .env 文件？","answer":{"oral":"**.env 不能提交的原因**：`.env` 里包含真实的 API Key，一旦推送到 GitHub（即使删掉也可能在历史记录里），Key 可能被爬虫扫描到并滥用，导致账单被盗刷或账号被封禁。","keyPoints":["先提交 `.env.example` 到 git（让别人知道要配置什么）","创建 `.gitignore` 排除 `.env`","用户克隆后：`cp .env.example .env`，填入真实 key"],"code":[{"lang":"bash","steps":[".env.example 文件只放模板变量名，不包含真实的 API Key 值","声明 DEEPSEEK_API_KEY=your_api_key_here 作为占位符","用注释说明可选的 MODEL 变量，默认值是 deepseek-chat"],"keepCode":"DEEPSEEK_API_KEY=your_api_key_here\n# MODEL=deepseek-chat  # 可选，默认 deepseek-chat"},{"lang":null,"steps":[".gitignore 里第一条排除 .env，防止真实密钥被提交","排除 __pycache__/ 和 *.pyc、*.pyo 等 Python 编译缓存文件","排除 .DS_Store、.idea/、.vscode/ 等编辑器和系统生成的文件","排除 venv/、.venv/ 等虚拟环境目录，因为依赖应该用 requirements.txt 重新安装"],"keepCode":".env\n__pycache__/\n*.pyc\nvenv/\n.venv/"}],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}}]},{"name":"RAG 原理与问答生成","questions":[{"id":"g16_q1","qnum":1,"qtext":"文档切分（Chunking）中 Chunk Size 和 Chunk Overlap 各自的作用是什么？如何选取合适的值？","answer":{"oral":"**Chunk Size 的作用**：决定每块的语义粒度。太小则语义不完整，太大则检索精度下降且输入成本高。 **Chunk Overlap 的作用**：防止关键信息被切断到相邻块的边界处。 参数选取上有一些经验值可以参考。通用文档问答作为默认场景，Chunk Size 一般设 300 Token，Overlap 设 50 Token，大约占 15%。法律或合同这种长句、逻辑严格的文档，Chunk Size 要放大到 500 Token，Overlap 也要提到 100 Token，大约占 20%。FAQ 条目因为每条本来就短，Chunk Size 只需要 100 到 150 Token，Overlap 给 20 Token 就够了。 **不要过度调参**：先用默认值（300/50）跑通，根据实际回答质量再调整——问答质量低通常是 Embedding 或检索的问题，不一定是切分参数的问题。","keyPoints":["没有 Overlap 时，一句完整的话可能恰好被切在两个 Chunk 之间，比如\"购买后 30 天内\"在 Chunk 1，\"提交申请\"却被分到 Chunk 2，导致关键信息跨块断裂","加上 50 Token 的 Overlap 后，Chunk 2 会重复包含 Chunk 1 末尾的一部分内容，使\"购买后 30 天内提交申请\"这句完整信息能出现在同一个 Chunk 里"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g16_q2","qnum":2,"qtext":"如何从零实现一个最小可用的 RAG 问答系统？请描述关键代码的设计思路。","answer":{"oral":"核心思路：**离线构建向量索引 + 在线\"检索-生成\"两步流程**，最小实现只需 `sentence-transformers`、`numpy`、`openai` 三个库。","keyPoints":["**`build_index` 与 `answer` 分离**：索引只建一次，问答每次调用；不要在问答函数里重建索引","**同一个 `model` 实例**：`build_index` 和 `retrieve` 用同一个 `SentenceTransformer` 对象，保证向量空间一致","**`temperature=0.1`**：事实问答用低温度减少随机性，但不用 0 是因为自然语言回答需要一点流畅度","**\"只根据资料回答\"约束**：这条 system 指令让模型在找不到答案时拒答，而不是编造——这是 RAG 减少幻觉的关键机制之一","先用 SentenceTransformer 加载一个多语言向量模型 model，供离线构建索引和在线检索共用","chunk_text 函数按词数把长文本切成固定大小的块，并用 overlap 控制相邻块之间重叠的词数，过滤掉空块","build_index 函数把多篇文档统一切块，再用 model.encode 把所有 Chunk 编码成向量，返回 chunks 和 vectors 组成的索引","retrieve 函数把用户问题编码成向量，和索引里每个 Chunk 向量计算余弦相似度，取相似度最高的 top_k 个 Chunk","answer 函数把检索到的 Chunk 拼接成带编号的参考资料文本，构造 system+user 两条消息，其中 system 指令要求模型只根据资料回答","调用 client.chat.completions.create 用较低的 temperature=0.1 生成最终回答并返回"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g20_q1","qnum":3,"qtext":"RAG 场景下上下文拼接的\"Lost in the Middle\"效应是什么？如何缓解？","answer":{"oral":"\"Lost in the Middle\" 是斯坦福 2023 年研究提出的现象：当 Prompt 中有多段检索文本时，模型对开头和结尾部分的注意力显著高于中间部分，中间的内容容易被忽视。 **缓解策略**：针对这个问题有几种缓解策略。第一种是相关度降序排列，也是默认做法，把最相关的 Chunk 排在第一位，利用开头的注意力优势，这个方法在 Top-K 不超过 3 的时候简单有效。第二种是\"三明治\"排列，把最相关的 Chunk 放在末尾，其余的按相关度降序排在前面，适合已经明确知道哪个是最佳命中 Chunk 的情况。第三种是控制 Chunk 数量，比如用 Top-K=3 而不是 10，减少落在中间位置、容易被忽视的内容，这是比较通用的推荐做法。第四种是精准切分，让每个 Chunk 的语义保持纯粹、不混入多个话题，这是治本的方法，而不只是治标。","keyPoints":["示意图显示模型对 Context 中不同位置的关注程度：开头关注度高，中间明显偏低，末尾关注度较高但略低于开头","实验结论是同样的关键信息放在开头或末尾，被模型引用的概率比放在中间高出大约 20%"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g20_q2","qnum":4,"qtext":"为什么 RAG 需要\"只根据资料回答\"约束？不加约束会出现什么问题？","answer":{"oral":"大模型有\"不愿说不知道\"的倾向——当知识不确定时，宁愿生成\"听起来合理\"的内容，而不是承认局限。RAG 场景中如果没有约束，模型会把检索到的资料和训练数据中的\"已有知识\"混合使用，产生**RAG 幻觉**： 约束的核心价值：**让系统的可信度可预测**——用户知道这个系统只说它\"知道\"的事，不会冒充专家随意发挥。","keyPoints":["场景是知识库里只有产品 A 的退款政策（30 天），但用户问的是产品 B 能不能退款","检索出来的最相关内容其实是产品 A 的退款条款，跟产品 B 并不相关","没有约束时，模型会把 A 的规则直接套用到 B 身上，给出一个听起来权威但其实是编造的答案","加上\"只根据资料回答\"的约束后，模型会如实说明资料中只包含产品 A 的政策、没有涉及产品 B，并建议联系客服确认"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g20_q3","qnum":5,"qtext":"RAG 中拒答逻辑应该在检索层还是生成层实现？两者有何区别？","answer":{"oral":"这两层拒答解决的问题不一样，应该同时实现，不能只做一层。先说触发条件，检索层拒答靠的是 `min_score` 这个阈值，向量相似度低于阈值、压根没有足够相关的 Chunk 时就触发；生成层拒答不一样，是 Chunk 已经检索到了，但模型自己判断这些内容跟问题其实不相关，这时候触发。实现方式上也不同，检索层就是一句 `if not results: return \"拒答文案\"` 这样的代码逻辑，生成层则是写在 System Prompt 里的约束指令，靠模型自己遵守。优点上，检索层确定性强，而且能省下一次 LLM 调用的成本；生成层的优势是能处理\"检索到了但内容其实不相关\"这种边界情况。缺点也很明显，检索层对阈值特别敏感，阈值设高了会误拒，设低了又会漏放垃圾内容；生成层则完全依赖模型愿不愿意遵守指令，稳定性比不上代码逻辑。所以适用场景也分得很清楚：完全不相关的问题交给检索层去拦，省 API 费用；检索到了但内容不够的边界情况，就交给生成层去处理。 两层协同：检索层是\"硬拒绝\"（快速、节省成本），生成层是\"软拒绝\"（处理检索层漏网的边界情况）。","keyPoints":["先调用 store.search 用 min_score=0.6 的阈值做检索，这一步是检索层的判断","如果检索结果为空，直接返回拒答文案，完全不再调用 LLM，这是检索层的\"硬拒绝\"","如果检索到了内容，则调用 llm_generate 把结果交给模型生成回答，模型在生成过程中还可能自行判断资料是否真的相关，这是生成层的\"软拒绝\""],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g20_q4","qnum":6,"qtext":"RAG 的 temperature 应该设多少？和普通对话有何不同？","answer":{"oral":"RAG 场景的核心目标是忠实地从资料中提取和整理信息，这需要的是确定性而不是创造性，因此 temperature 通常要比普通对话低得多。具体来说，RAG 问答这种需要精确的场景，推荐 temperature 设在 0.0 到 0.1 之间，原因是同一个问题多次调用结果要保持一致，方便测试和验证。普通对话场景推荐 0.7，因为需要一定的多样性和自然感。创意写作场景推荐 1.0 到 1.5，因为需要比较高的随机性。代码生成场景推荐 0.0，因为语法和逻辑不能有随机性。 **为什么 RAG 不用 0.0 而用 0.1**：temperature=0.0 会导致完全确定性的输出，但不同版本的模型对同一个 `temperature=0.0` 的处理方式可能有细微差异；0.1 保留了极少量随机性，让回答在语言流畅性上稍微自然一些，同时对事实准确性几乎没有影响。 **关键判断**：如果 RAG 系统用于生产，回答需要可测试（同一问题每次答案要基本一致），就使用低 temperature。如果只是演示，可以适当提高到 0.3 让语言更自然。","keyPoints":["**RAG 推荐 0.0-0.1**：目标是忠实提取整理信息而非创造性，同一问题多次调用结果需保持一致","**对比其他场景**：普通对话推荐 0.7（多样性自然感）、创意写作 1.0-1.5（高随机性）、代码生成 0.0（语法逻辑不能随机）","**为何不用 0.0 而用 0.1**：不同版本模型对 temperature=0.0 处理可能有细微差异；0.1 保留极少随机性让语言更自然，对事实准确性几乎无影响","**关键判断**：生产环境需可测试（答案基本一致）用低 temperature；仅作演示可提高到 0.3 让语言更自然"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g20_q5","qnum":7,"qtext":"如何从零设计一个端到端的 RAG 问答系统？描述各模块的职责和接口。","answer":{"oral":"端到端 RAG 分成离线构建和在线问答两个阶段：离线阶段是文档加载器把文件解析成 Document，切分器把文本切成 Chunk 列表，Embedding 模型把 Chunk 编码成向量，再由向量库存下来并持久化到磁盘；在线阶段是把用户 query 编码成向量去向量库检索，检索结果为空就直接返回拒答文案、不调用 LLM，有结果的话才组装 Prompt 交给模型生成最终回答。接口设计上每个模块都做成可替换的，上层用一个 RAGPipeline 把它们串起来，只暴露 build() 和 ask() 两个入口方法。三个工程关键点是：每层只暴露最小接口，ask(query) 直接返回字符串，调用方不需要感知内部细节；拒答判断必须放在调用 LLM 之前，省下不必要的 API 费用；模块替换不影响上层，换 Embedding 模型或者向量库只改 RAGPipeline 的初始化部分，ask() 的逻辑完全不用动。","keyPoints":["**每层只暴露最小接口**：`ask(query)` 返回字符串，调用方不需要感知检索/生成的内部细节","**拒答必须在 LLM 之前**：`if not results: return` 放在生成调用之前，节省 API 费用","**模块替换不影响上层**：换 Embedding 模型或向量库只改 `RAGPipeline.__init__`，`ask()` 的逻辑完全不动","离线构建阶段：DocumentLoader.load 读取文件生成 Document 对象，再用 TextSplitter.split 把文本切成 Chunk 列表","接着用 EmbeddingModel.embed 把所有 Chunk 编码成向量，调用 VectorStore.add 存入向量库，再用 save 持久化到磁盘","在线问答阶段：把用户输入的 query 用同一个 EmbeddingModel 编码成向量","调用 VectorStore.search 按 top_k 和 min_score 检索，如果结果为空就直接返回拒答文案，不再调用模型","如果有结果，就用 build_prompt 组装 system+user 消息，调用 LLM.generate 在低 temperature 下生成回答","最终把模型生成的回答返回给用户","定义 Document dataclass 统一文档格式，让加载器可以自由替换实现","定义 BaseSplitter 抽象类，规定 split() 接口，让切分器（固定字符/递归/句子）可以互相替换","定义 EmbeddingModel 抽象出 embed() 接口，让 API 和本地两种 Embedding 来源可以互相替换","定义 VectorStore 抽象出 add/search/save/load 接口，让底层向量库（numpy/FAISS/Chroma）可以互相替换","顶层 RAGPipeline 组合以上所有模块，对外只暴露 build(docs_dir) 和 ask(query) 两个方法"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g22_q2","qnum":8,"qtext":"RAG 准确率主要受哪些环节影响？每个环节出问题时典型表现是什么？","answer":{"oral":"RAG 准确率有两层：检索准确率（找到答案）和生成准确率（忠实表达答案），两者是串联关系——检索准确率是生成准确率的上界。 具体拆到每个环节看。文档读取环节，典型的表现是答案明明就在文档里，却硬是没被召回，根本原因往往是噪音把 Chunk 的向量稀释了，诊断的时候打印一下原始读取的文本，看看有没有页眉页脚这些乱码混进去。文本切分环节，典型表现是模型说\"资料不足\"，但其实答案内容是跨在两个相邻 Chunk 之间的，根本原因是语义边界被硬生生切断了，诊断方法是打印 Top-K 的 Chunks，看答案是不是被切成两半。Embedding 环节，典型表现是中文问题匹配不到中文文档，根本原因往往是用了纯英文的 Embedding 模型，这时候换成多语言模型，比如 paraphrase-multilingual-MiniLM，就能解决。相似度阈值这一块，典型表现是明明有答案的问题却被拒答了，根本原因通常是 `min_score` 设得太高，诊断的时候可以临时把阈值降到 0.0，看看是不是能召回，这样就能定位到底是不是阈值的问题。最后是 Prompt 约束环节，典型表现是模型混入了自己训练时学到的知识来回答，来源没法追溯，根本原因是约束指令写得不够明确，诊断方法就是在 System Prompt 里把\"没在资料里的内容必须拒答\"这句话说清楚。 **诊断优先级**：先打印检索结果（`top_k=5, min_score=0.0`），确认答案在不在检索结果里；在的话改 Prompt，不在的话往上游（切分/读取）查。大多数\"答案不准\"问题出在检索层，不是生成层。","keyPoints":["**两层准确率**：检索准确率（找到答案）和生成准确率（忠实表达答案）串联，检索准确率是生成准确率的上界","**上游环节问题**：文档读取有噪音（页眉页脚等）会稀释 Chunk 向量导致答案没被召回；文本切分把语义边界切断会导致答案跨在两个 Chunk 间、模型说“资料不足”；Embedding 用纯英文模型会导致中文问题匹配不到中文文档","**下游环节问题**：min_score 阈值设太高会导致有答案也被拒答；Prompt 约束指令不明确会导致模型混入训练知识、来源无法追溯","**诊断优先级**：先打印检索结果（top_k=5, min_score=0.0）确认答案在不在检索结果里，在则改 Prompt，不在则往上游（切分/读取）查——大多数“答案不准”问题出在检索层"],"code":[],"followUp":["这里面你认为最关键的设计点是什么？能展开讲讲吗？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}},{"id":"g22_q3","qnum":9,"qtext":"Chunk 切分策略为什么会直接影响 RAG 最终回答的质量？影响路径是什么？","answer":{"oral":"切分影响质量有三条独立的传导路径： **路径一：语义截断 → 向量失真 → 检索遗漏** **路径二：Chunk 过小 → 上下文碎片化 → 生成质量差** Chunk 过小时，一个完整意思散落在 5 个 Chunk 里，拼接后语义跳跃，LLM 无法整合出完整答案。 **路径三：Chunk 过大 → 向量被稀释 → 相似度虚低** 单个 Chunk 包含退款+发货+会员多话题时，与\"退款问题\"的相似度被非退款内容拉低，可能排名靠后而错过召回。 **实用参数选择**：通用文档用 300 Token / 50 Token Overlap，先跑通再根据召回效果调整。Overlap 的作用是保证\"关键句子必然完整出现在至少一个 Chunk 里\"，不是越大越好（浪费存储和 API 成本）。","keyPoints":["原文\"退款需在 30 天内提交。提交后 3-5 天退回\"在\"提交\"后面被切断","Chunk A 只包含\"退款需在 30 天内提交\"，缺少处理时长信息；Chunk B 只包含\"提交后 3-5 天退回\"，缺少前置条件","当用户问\"退款处理多久\"时，A、B 两个 Chunk 分别独立被检索到都不完整，导致最终回答残缺"],"code":[],"followUp":["如果让你重新设计这部分，你会做哪些不一样的取舍？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g22_q4","qnum":10,"qtext":"为什么引用来源在业务场景中比单纯的答案准确率更重要？","answer":{"oral":"引用解决的不是\"答案对不对\"，而是\"用户能否验证答案\"——这是两个不同层次的问题。 **信任度不等于准确率**：一个系统准确率 95% 意味着每 20 个问题有 1 个错误。如果没有引用，用户不知道哪 1 个是错的，只能选择全信或全不信。有了引用，用户可以在\"重要决策\"时验证，在\"日常查询\"时直接接受，建立有边界的信任。 **业务必要性按场景**：企业客服和法律/医疗场景中，错误答案可能导致法律纠纷（如错误承诺退款时间），引用使企业能追溯答案来源，证明\"我们的答案来自这份政策文档\"；内部工作助手中，员工向上级说明依据时需要引用原始政策文件，而不是\"AI 说的\"。","keyPoints":["没有引用的系统给出错误答案\"退款需要 3 天\"，用户直接相信并告诉朋友，导致多人产生错误预期，企业往往要等到大量投诉才发现问题","有引用的系统给出同样错误的答案\"退款需要 3 天 [1]\"，但引用 [1] 原文写的是\"5 天\"，用户查看原文发现矛盾，及时反馈给企业，企业能快速修复知识库"],"code":[],"followUp":["这里面你认为最关键的设计点是什么？能展开讲讲吗？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}}]},{"name":"文档加载与解析","questions":[{"id":"g17_q1","qnum":1,"qtext":"RAG 系统中文档读取阶段的质量为什么至关重要？常见的文档噪音有哪些？","answer":{"oral":"文档读取是 RAG 流程的入口，\"垃圾进，垃圾出\"——读取阶段引入的噪音会污染切分、向量化和最终回答的每一个环节。 **常见噪音类型**：常见的噪音类型大概有六种。第一种是连续多余空行，来源是 PDF 排版还原或者段落分隔，影响是 Chunk 大量空间被浪费在空白上。第二种是行内多余空格，来源是 PDF 坐标还原误差，影响是词被拆成多个 Token。第三种是页眉页脚，来源是 PDF 固定区域的内容，影响是每一页相同的文字都会混入多个 Chunk。第四种是页码，比如\"- 1 -\"这种格式，来源是 PDF 页脚，本身没有语义，会污染向量表示。第五种是图注，比如\"图 3-1：……\"这种图片下方的说明文字，因为没有对应的图片内容，图注单独出现时语义完整度很低。第六种是编码乱码字符，来源是字体映射不完整，切分时会把乱码当成\"词\"处理，向量化后造成语义偏差。","keyPoints":["页眉文字\"第 3 章\"混入了正文内容里","这块 Chunk 向量化之后，其向量会带上\"关于第 3 章\"这种无关语义","当用户问一个完全无关的问题时，这个被污染的 Chunk 也可能被错误地检索召回","模型看到这段噪音内容作为参考资料，就会基于它生成不准确的回答"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g17_q2","qnum":2,"qtext":"读取中文文本文件时编码问题如何处理？UTF-8、GBK、UTF-8-BOM 有什么区别？","answer":{"oral":"UTF-8（Unicode Transform Format 8-bit）是国际通用编码，中文占 3 字节/字，常见于 macOS/Linux 创建的文件。GBK（国家标准汉字编码）中文占 2 字节/字，向下兼容 GB2312，常见于 Windows 下创建的中文文件。UTF-8-BOM 即 UTF-8 + Byte Order Mark，文件开头会多出 3 字节的 BOM 标记（`\\xEF\\xBB\\xBF`），常见于 Windows 记事本\"另存为 UTF-8\"生成的文件。 **`utf-8-sig` 的作用**：自动去除 UTF-8-BOM 开头的 3 字节标记——如果用 `utf-8` 读取含 BOM 的文件，文本开头会有一个看不见的 `﻿` 字符，混入文档内容影响后续处理。","keyPoints":["如果已经知道文件的编码来源，就直接在 open() 里指定对应的 encoding，比如 \"utf-8\"","如果是中文文件但来源不确定，就用一个编码列表依次尝试，先试 utf-8，再试 utf-8-sig，再试 gbk，用 try/except 捕获 UnicodeDecodeError，失败就换下一个编码","如果编码完全未知，就用 chardet 读取文件前一万字节做自动检测，取出它猜测的编码名称，检测不到就兜底用 utf-8"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g17_q3","qnum":3,"qtext":"为什么 PDF 文本提取比读取 TXT 文件难得多？有哪些常见坑？","answer":{"oral":"**根本原因**：PDF 是\"页面描述语言\"，存储的是\"在坐标 (x, y) 处绘制字形 X\"的指令，而不是有序的文本流。文本提取是逆向工程——把视觉坐标系上的字形还原成有逻辑顺序的文字。 **四大常见坑**：PDF 提取常见的坑大概有四个。第一个是多栏布局乱序，表现为左右两栏文字交错出现，也就是左1行、右1行、左2行、右2行这样穿插着来，解决方案是用 pdfplumber.crop() 分区域提取再拼接。第二个是页眉页脚混入，表现为每一页相同的内容会重复出现在多个 Chunk 里，解决方案是用 crop() 把顶部和底部的固定高度裁掉。第三个是乱码字符，表现为中文显示成方块或者奇怪符号，解决方案是换用字体处理能力更强的 pymupdf。第四个是扫描件没有文本层，表现为 extract_text() 返回 None 或者空字符串，解决方案是上 OCR，比如 pytesseract，或者使用支持 OCR 的文档解析工具。 推荐处理顺序：先用 `pdfplumber` 试跑，质量差再考虑 pymupdf；扫描件问题放到有 OCR 需求时再解决，不要一开始就引入复杂依赖。","keyPoints":["TXT 文件的字节序列本身就对应字符的先后顺序，用 open() 直接读取就能得到正确的文字顺序","PDF 文件里字符是按坐标位置绘制的，比如坐标(100,700)处的字和坐标(500,700)处的字，虽然视觉上在同一行，但它们的先后顺序需要靠程序推断，并不是天然有序的"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g17_q4","qnum":4,"qtext":"读取文档后为什么需要文本清洗？哪些清洗操作是安全的，哪些会破坏 RAG 效果？","answer":{"oral":"**为什么需要清洗**：不同来源的文档读取后格式差异大，噪音直接影响切分质量和向量语义准确性。清洗的目标是\"去除视觉格式噪音，保留语义信息\"。 **危险的清洗操作**（会破坏 RAG 效果）：有几类清洗操作是危险的，会破坏 RAG 效果，做的时候要特别小心。第一种是去停用词，比如把\"的\"\"了\"\"是\"这些字去掉，问题在于 Embedding 模型依赖完整句子的上下文，去掉停用词会破坏语法结构。第二种是词干化或者词形还原，中文分词本身就不适用这一套，英文文档做了也会破坏 Embedding 的语义。第三种是去标点符号，标点其实是句子边界的重要标志，去掉之后切分和 Embedding 都会出问题。第四种是强制截断到固定的 N 字符，这种操作应该放在切分阶段去做，而不是在加载阶段就直接截断。 **判断原则**：如果一个清洗操作会改变文本的语义或信息完整性，就不应该在文档加载阶段做——这类操作要么不做，要么放到切分策略里按需处理。","keyPoints":["把 \\r\\n 统一替换成 \\n，消除 Windows 和 Unix 换行符不一致的问题","用正则 re.sub 把连续 3 个及以上的换行压缩成两个，去掉多余的空行","用正则把连续 2 个以上的空格或制表符压缩成一个空格，去掉多余的行内空格","最后用 strip() 去掉文本首尾的空白字符"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g17_q5","qnum":5,"qtext":"如何设计一个支持多格式的统一文档加载器？请描述接口设计和关键实现思路。","answer":{"oral":"核心设计原则：**统一输出格式（`Document` dataclass）+ 格式路由表 + 各格式独立加载函数**。","keyPoints":["**为什么用 `Document` 而不是直接返回字符串**：`source` 字段是后续生成答案时标注引用来源的基础；`page_count` 和 `metadata` 为后续扩展预留空间；统一格式让调用方代码稳定，换格式只改加载器内部实现","**为什么用路由表 `{\".txt\": _load_txt, ...}`**：比 `if/elif` 更易扩展——新增格式只在路由表加一行，不改 `load_document` 主体逻辑","**`load_directory` 为什么用 try/except 跳过失败文件**：知识库可能包含部分损坏或不支持的文件，单个失败不应中断整批加载——记录日志后跳过，保证能加载其他正常文件","定义 Document dataclass，统一保存 text、source、file_type、page_count、metadata 等字段，作为所有格式加载后的统一输出","load_document 函数根据文件后缀，从一个路由字典 {\".txt\": _load_txt, ...} 里找到对应的加载函数，找不到就抛出 ValueError","调用找到的加载函数处理这个文件，返回统一格式的 Document 对象","load_directory 函数遍历目录下指定后缀的所有文件，对每个文件调用 load_document","用 try/except 包裹每次加载，出错时打印跳过信息而不中断整个批量加载过程","把所有成功加载的 Document 对象收集到列表里返回"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g66_q1","qnum":6,"qtext":"为什么说 pdfplumber 这类基于坐标提取的工具，处理复杂真实文档时\"很脏\"？","answer":{"oral":"pdfplumber 本质上是按 PDF 内部记录的文字物理坐标顺序提取字符，不理解文档的**逻辑结构**（这段文字属于哪个标题、这几个数字属于哪张表格的哪一行哪一列）。 这一步是 RAG 流程的最上游，如果这里丢失或扭曲了信息，后续的切分、检索、生成、评估优化都是建立在残缺数据上。","keyPoints":["排版混乱：多栏排版按坐标顺序提取会把左右栏内容交替拼接在一起，导致语义错乱","表格错位：表格被拍平成纯文本后丢失了原本的行列对齐关系","扫描件没有文字层：本质是图片，没有可提取的文字字符，直接返回空字符串"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g66_q2","qnum":7,"qtext":"表格转文本后为什么容易出现\"错位\"问题？应该怎么解决？","answer":{"oral":"原始表格是行列对齐的结构，按坐标顺序拍平成纯文本后失去了这种对齐关系： 模型完全无法从这段文字还原\"蓝牙耳机对应199元、库存50\"的对应关系。**解决方式**：用能识别表格行列边界的解析工具（Docling/marker），把每个单元格作为独立结构化数据保留，输出成 Markdown 表格语法而不是拍平的纯文本——模型训练时见过大量 Markdown 表格，能正确理解这种格式里的行列对应关系。","keyPoints":["原始表格是产品名、单价、库存三列行列对齐的结构","按坐标顺序拍平成纯文本后，单元格之间的分隔和对齐关系全部丢失","变成产品名单价库存蓝牙耳机199元50这样一整串文字，模型完全无法还原对应关系","解决办法是换用能识别表格行列边界的解析工具，把每个单元格保留成结构化数据，输出成 Markdown 表格语法"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g66_q3","qnum":8,"qtext":"扫描件为什么无法用 pdfplumber 提取出文字？处理扫描件需要什么额外流程？","answer":{"oral":"扫描件本质是一张图片，PDF 文件里没有任何可提取的文字字符层，pdfplumber 这类基于文本层提取的工具直接返回空字符串。 **关键认知**：OCR 只解决\"能不能提取出文字\"，识别质量高度依赖扫描件清晰度，模糊/倾斜/手写体的扫描件即使用最好的 OCR 也可能出错，往往需要人工校对兜底。","keyPoints":["扫描件先经过图像预处理：去噪、矫正倾斜、二值化","再交给 OCR 引擎识别文字区域和具体内容，比如 Tesseract、PaddleOCR 或云端 API","OCR 输出识别出的文字以及每个文字的位置坐标","最后按版面重新组织，拼成一段可读的文本"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g66_q4","qnum":9,"qtext":"Docling/marker 这类工具相比 pdfplumber，核心优势是什么？","answer":{"oral":"pdfplumber 的提取方式是按坐标顺序拼接字符，遇到表格时直接拍平成没有结构的纯文本，标题和正文之间的层级关系也完全无法区分；Docling/marker 则会先做版面分析，识别出文档的逻辑结构，表格能输出成保留行列对齐关系的 Markdown 表格语法，标题层级也能被识别并保留下来。 **核心优势**：这些工具内部集成了版面分析（Layout Analysis）能力，能识别出文档里的标题、段落、表格等不同区域，分别按各自的语义结构输出结构化 Markdown，而不是简单按坐标顺序拼接字符——2025 年后 Docling 已成为生产级文档解析的主流选择，尤其在含表格、复杂排版的真实业务文档场景。","keyPoints":["**pdfplumber 的局限**：按坐标顺序拼接字符，表格直接拍平成无结构纯文本，标题和正文层级无法区分","**Docling/marker 的能力**：先做版面分析识别文档逻辑结构，表格能输出保留行列对齐关系的 Markdown，标题层级也能被识别保留","**核心优势**：内部集成版面分析（Layout Analysis）能力，能识别标题、段落、表格等不同区域并分别按语义结构输出","**行业地位**：2025 年后 Docling 已成为生产级文档解析的主流选择，尤其在含表格、复杂排版的真实业务文档场景"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g66_q5","qnum":10,"qtext":"Docling 这类新一代工具是不是能解决所有文档解析问题？它处理不了哪些边界情况？","answer":{"oral":"不是。 **关键认知**：不是所有文档质量问题都能靠\"换一个更好的解析工具\"解决——有些是工具能力边界内的问题（可以预处理或换工具），有些是数据本身质量问题（模糊扫描件、手写内容），后者往往需要人工校对兜底，而不是无限投入在解析工具选型上。","keyPoints":["排版极度复杂，比如多层嵌套表格、密集图文混排，版面分析模型可能判断出错","纯图片型 PDF 扫描件，仍然需要先过 OCR 引擎提取文字，Docling 本身不能单独解决","加密文档无法直接打开解析，需要先解密","手写内容的识别准确率本身受限于 OCR，Docling 会继承这部分错误","低分辨率扫描件因为图像模糊导致 OCR 识别错误率高，Docling 无法修复上游 OCR 的错误"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g66_q6","qnum":11,"qtext":"面对\"简单单栏文本 PDF\"\"含表格复杂排版的真实业务文档\"\"扫描件\"这三类不同文档，分别应该选择什么解析方案？","answer":{"oral":"面对这三类文档，应该按复杂度分层选型。第一，简单单栏文本 PDF、没有表格的场景，推荐用 pdfplumber，够轻量。第二，含表格、复杂排版的真实业务文档，推荐用 Docling 或者 marker，靠版面分析能力，输出结构化的 Markdown。第三，扫描件这种没有文字层的文档，得先过 OCR 引擎，比如 Tesseract 或 PaddleOCR，再交给 Docling 做结构化整理。 **判断依据**：不是\"越新越好的工具就该全面替换旧工具\"，而是按文档的复杂度分层选型——简单场景优先用更轻量、依赖更少的 pdfplumber；真正复杂（表格、多栏）的业务文档才值得引入 Docling/marker 这类更重的版面分析工具；扫描件是图片，任何文本层提取工具都无能为力，必须先过 OCR。","keyPoints":["**简单单栏文本 PDF**：推荐用 pdfplumber，够轻量","**含表格复杂排版的真实业务文档**：推荐用 Docling 或 marker，靠版面分析能力输出结构化 Markdown","**扫描件**：得先过 OCR 引擎（如 Tesseract 或 PaddleOCR），再交给 Docling 做结构化整理","**判断依据**：不是越新的工具就该全面替换旧工具，而是按文档复杂度分层选型，扫描件是图片，必须先过 OCR"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g66_q7","qnum":12,"qtext":"Docling 相比 pdfplumber 在处理速度上有什么代价？这对工具选型意味着什么？","answer":{"oral":"对比处理耗时，pdfplumber 很快，Docling 则明显更慢——多了一层版面分析模型的推理开销。 **代价**：Docling 内部要跑版面分析模型对文档做结构识别，推理开销明显高于 pdfplumber 单纯按坐标提取字符串。**对选型的意义**：Docling 在表格和复杂排版场景下抽取质量明显更好，但代价是处理更慢、依赖更重（需要下载和运行版面分析模型）——对于简单的纯文本 PDF（无表格、单栏排版），pdfplumber 依然是更轻量的选择，不应该无差别地把所有文档都扔给 Docling 处理，而要按文档复杂度权衡准确率和速度/资源成本。","keyPoints":["**速度代价**：pdfplumber 很快，Docling 明显更慢，多了一层版面分析模型的推理开销","**依赖更重**：Docling 需要下载和运行版面分析模型","**选型意义**：Docling 在表格和复杂排版场景抽取质量明显更好，但对简单纯文本 PDF，pdfplumber 依然更轻量，应按复杂度权衡准确率和速度/资源成本"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}}]},{"name":"文本切分","questions":[{"id":"g18_q1","qnum":1,"qtext":"固定大小切分和按语义边界切分有什么本质区别？各自的适用场景？","answer":{"oral":"从五个维度对比：切分依据上，固定大小切分按字符数/Token 数来切，与内容无关，按语义边界切分则依据段落、句子等自然语言边界；Chunk 大小上，固定大小切分均匀可控，按语义边界切分差异较大（受原文结构影响）；语义完整性上，固定大小切分可能在句子中间截断，按语义边界切分能保证每块是完整的语义单元；实现复杂度上，固定大小切分极简，按语义边界切分需要语言检测（段落符、句号等）；适用场景上，固定大小切分适合快速原型和结构无规律的纯流文本，按语义边界切分适合有清晰段落结构的正式文档、法律合同、FAQ。 **核心区别**：固定大小切分以\"字符均匀\"为目标，与文本语义完全解耦；语义边界切分以\"语义完整\"为目标，接受大小不均换来的内容完整性。 **实际影响**：固定切分可能把一句\"退款需在 30 天内 | 提交申请\"从中截断，导致两个 Chunk 各只包含半句话，向量化后语义都不完整，检索时容易召回错误内容。","keyPoints":["**切分依据**：固定大小按字符数/Token 数切、与内容无关；语义边界依据段落、句子等自然语言边界","**语义完整性**：固定大小可能在句子中间截断；语义边界能保证每块是完整语义单元，但大小不均","**适用场景**：固定大小适合快速原型和结构无规律的纯流文本；语义边界适合有清晰段落结构的正式文档、法律合同、FAQ","**核心区别**：固定切分以“字符均匀”为目标，语义边界以“语义完整”为目标，接受大小不均换取内容完整"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g18_q2","qnum":2,"qtext":"Chunk Size 和 Chunk Overlap 各自的作用是什么？选取不当会带来什么后果？","answer":{"oral":"Chunk Size 决定的是每一块向量所代表的\"语义粒度\"：切得太小，每块可能只有几个词，语义不完整，没法独立回答问题，向量化后语义也会很混乱；切得太大，一块里混进多个话题，向量变成多话题的平均，检索时既不精准又会带入大量无关内容，经验值一般是中文 300–500 字符、英文 300–600 Token。Chunk Overlap 解决的则是语义跨块边界的问题——一个事实可能恰好跨在两个 Chunk 的切断处，通过让相邻两块共享一段文本来保证边界处的语义至少在一块里是完整的，经验值一般是 Chunk Size 的 15%–25%。","keyPoints":["决定每块向量代表的\"语义粒度\"","过小：每块只有几个词，语义不完整，无法独立回答问题；向量化后语义混乱","过大：一块里混入多个话题，向量是多话题的平均，检索时既不精准又带入大量无关内容","经验值：中文场景 300–500 字符（约 200–400 字），英文场景 300–600 Token","解决语义跨块边界的问题——一个事实可能恰好跨在两个 Chunk 的切断处","通过让相邻两块共享一段文本（前块尾部 = 后块头部），确保边界处的语义在至少一块中是完整的","过小（< 5%）：边界信息丢失，检索时跨块关键信息无法被召回","过大（> 40%）：大量冗余存储，索引体积膨胀，相似块互相干扰检索结果","经验值：Chunk Size 的 15–25%（如 Chunk Size=400，Overlap=60–100）"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g18_q3","qnum":3,"qtext":"递归字符切分（Recursive Character Splitter）的核心思路是什么？为什么推荐作为默认策略？","answer":{"oral":"**核心思路**：给定一组按优先级排列的分隔符（如 `[\"\\n\\n\", \"\\n\", \"。\", \".\", \" \", \"\"]`），先尝试最高优先级的分隔符切分；如果某块仍然超过 `chunk_size`，则用下一个分隔符继续切分这块，直到满足大小约束或用尽所有分隔符（最后用字符强制切分兜底）。","keyPoints":["**语义完整性好**：优先段落边界，退而求其次用句子，最差情况才截字符——比固定字符切分语义损失小得多","**大小可控**：通过 `chunk_size` 硬性约束，不会出现纯段落切分时 Chunk 大小差异几十倍的情况","**通用性强**：同一组分隔符对中英文混合文档都适用，无需针对语言调整","**LangChain 默认实现验证**：社区大规模使用证明它是最实用的折中方案","分隔符按优先级从高到低排列：先按段落切，再按行，再按句号，再按词，最后才按字符强制切","结果是尽量在最自然的语义边界处切分文本，只有在实在没办法的情况下才去截断更小的单元"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g18_q4","qnum":4,"qtext":"切分策略对 RAG 检索质量的影响路径是什么？如何设计切分策略对比实验？","answer":{"oral":"**关键观察点**：相同 `chunk_size` 下，语义边界切分通常检索相似度更高；过粗的切分（大段落）相似度反而低，因为向量是多话题平均，与问题向量距离更远。","keyPoints":["切分策略首先决定每个 Chunk 的语义纯度，也就是一块内容是不是只包含一个话题","语义纯度进一步影响向量化质量，纯度越高向量越能精确代表这块内容的语义","向量化质量影响检索召回质量，也就是问题向量和答案向量之间的余弦相似度高不高","检索召回质量最终决定回答质量——模型拿到的上下文里是不是真的包含了答案","用固定字符切分、递归切分、句子切分三种策略，对同一份文档分别切出 Chunk 列表","对每种策略调用 analyze_chunks 统计块数、大小的均值、标准差和最值","构建向量索引后，用一组测试问题分别检索，记录每种策略下的最高相似度分数","对比各策略在测试问题上的最高相似度，相似度越高说明检索到的最相关块语义越纯粹"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g18_q5","qnum":5,"qtext":"如何从零实现一个支持多策略、可对比的文本切分工具？请描述核心设计决策。","answer":{"oral":"**设计目标**：支持四种策略，统一输出格式，能输出统计报告，易于扩展新策略。","keyPoints":["**抽象基类 `BaseSplitter`**：统一接口，`compare_all` 不关心策略内部实现；新增策略只加一个子类，不改比较框架","**`analyze()` 放在基类**：统计逻辑复用，各策略天然支持统计报告，无需重复实现","**`ChunkStats` dataclass**：结构化输出，比返回 dict 更类型安全，方便后续扩展（如画分布直方图）","定义 ChunkStats dataclass，结构化保存策略名、块数、均值、标准差、最小值、最大值","定义抽象基类 BaseSplitter，声明抽象方法 split()，具体切分逻辑由各子类实现","在基类里实现 analyze() 方法，调用 split() 拿到 Chunk 列表，用 statistics 模块计算这些块大小的均值和标准差等统计量，返回 ChunkStats","FixedCharSplitter 继承 BaseSplitter，用固定的 chunk_size 和 overlap 在字符层面循环切分文本","RecursiveCharacterSplitter、SentenceSplitter 等其他策略同样继承 BaseSplitter，各自实现自己的 split() 逻辑","compare_all 函数遍历传入的多个 Splitter 实例，调用各自的 analyze()，把结果整理成一张对比表格打印出来"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}}]},{"name":"Embedding 与向量检索","questions":[{"id":"g19_q1","qnum":1,"qtext":"Embedding 模型的\"一致性约束\"是什么？违反后会出现什么问题？","answer":{"oral":"一致性约束是指：RAG 流程中，对文档 Chunk 进行向量化（离线构建）和对用户问题进行向量化（在线检索）**必须使用同一个 Embedding 模型**。 **违反后的后果**：不同 Embedding 模型产生的向量处于不同的语义空间——即使两个向量的维度相同，它们的坐标系也完全不同，余弦相似度计算结果毫无意义。 **实践影响**：一旦上线后更换 Embedding 模型，必须**重新向量化全部文档**并重建索引——这是一个有运维成本的操作，因此模型选型要尽早确定。","keyPoints":["用厘米尺量文档建索引、用英寸尺量问题做检索作比喻——两个数字看起来都是 12，实际单位完全不同，放在一起比较毫无意义","对应到 Embedding 上，模型 A 把\"退款\"编码成一个向量，模型 B 把\"退款\"编码成另一个不同的向量","如果建库用模型 A、查询用模型 B，两个向量各自在自己的语义空间里都合理，但放在一起算余弦相似度的结果是随机的，没有意义"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g19_q2","qnum":2,"qtext":"余弦相似度、内积、L2 距离三种度量方式有什么区别？RAG 场景为什么通常选余弦相似度？","answer":{"oral":"三种度量方式各不相同：余弦相似度的公式是 `(A·B)/(‖A‖·‖B‖)`，取值范围 [-1, 1]，不受向量长度影响（只看方向），是 RAG 场景的**首选**；内积（点积）的公式是 `A·B`，取值无限制，会受向量长度影响（长度会影响结果），只有在向量归一化之后才等价于余弦相似度；L2 距离的公式是 `√Σ(aᵢ-bᵢ)²`，取值范围 [0, ∞)，同样受向量长度影响，更常用于图像/数值特征，文本场景很少用它。 **为什么 RAG 选余弦相似度**： 文本的 Embedding 向量长度会随文本长度变化——短问题（5 个字）的向量模通常比长段落（200 个字）小。如果用内积，\"语义完全相同但文字更多\"的段落会因为向量模更大而得到更高分，这不是我们想要的排序逻辑。余弦相似度只看两个向量的**方向夹角**，消除了长度带来的偏差，让语义相近程度直接决定排序结果。","keyPoints":["相似度大于等于 0.85，说明语义非常相近，属于高度相关","相似度在 0.7 到 0.85 之间，说明相关，通常可以作为参考资料使用","相似度在 0.5 到 0.7 之间，说明只是弱相关，需要结合其他条件再判断","相似度低于 0.5，说明关联很小，通常会被过滤掉"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g19_q3","qnum":3,"qtext":"API-based Embedding 和本地 Embedding 模型如何选择？各自的适用场景？","answer":{"oral":"这两条路子可以从几个方面来比。先看代表方案，API-based 这边有 DeepSeek Embedding、OpenAI 的 text-embedding-3-small 这些，本地模型这边主要是 sentence-transformers 系列，像 MiniLM、BGE。向量维度上，API-based 通常在 1024 到 1536 之间，本地模型会小一些，384 到 1024。效果上，API-based 普遍更强，毕竟有商用级的优化，本地模型稍弱一点，不过中文场景下 BGE 系列表现其实很不错。成本上，API-based 是按 Token 计费的，本地模型没有 API 费用，但你得自己承担硬件成本。数据隐私是个关键区别：API-based 得把数据传到云端，本地模型数据完全留在本地，不出门。延迟上也差得远，API-based 大概 100 到 300 毫秒，主要耗在网络 I/O 上，本地模型用 CPU 推理只要 5 到 50 毫秒。最后看适用阶段，对效果要求高的生产环境更适合用 API-based，而原型验证，或者数据比较敏感的场景，就更适合用本地模型。 入门阶段统一推荐 `paraphrase-multilingual-MiniLM-L12-v2`：约 120MB，免费，支持中英文，CPU 可运行，足以验证 RAG 完整流程。","keyPoints":["先判断数据能不能出境、预算是否充足：如果可以，就选 API-based 方案（DeepSeek 或 OpenAI）","如果数据不能出境或者比较敏感，就选本地模型","本地模型里，原型验证用轻量的 MiniLM-L12-v2，兼顾中英文","生产环境的中文知识库用效果更强的 BAAI/bge-large-zh-v1.5","如果需要中英文均衡覆盖，就用多语言版本的 BAAI/bge-m3"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g19_q4","qnum":4,"qtext":"向量检索中的 Top-K 和相似度阈值分别解决什么问题？应该如何配合使用？","answer":{"oral":"**相似度阈值（min_score）** 解决\"什么都没检索到时如何拒绝\"的问题： 阈值不是越高越好——过高会导致\"宁愿拒答也不回答\"的体验；过低则相当于没有阈值。建议先用 0.5–0.6 起步，根据实际拒答率调整。","keyPoints":["K 过小（K=1）：上下文信息量不足，模型可能因为缺少关键细节而回答不完整","K 过大（K=10）：引入太多低相关内容，占用过多 Context Token 且容易干扰模型判断","经验值：`top_k=3` 是大多数场景的合理起点","举例：用户问\"明天天气怎么样\"，但知识库里全是产品文档","没有阈值时，即使 top-1 结果的相似度只有 0.38，也会被当作参考资料强行返回，模型可能基于这段无关内容生成幻觉或牵强附会的回答","设置阈值 min_score=0.6 后，0.38 低于阈值会被过滤掉，检索结果变成空列表","RAG 层因此可以判断\"没有相关文档\"，让模型诚实地回答不知道，而不是硬凑答案","调用 index.search 先按向量相似度取出 top_k=3 个候选结果","对结果列表做一次过滤，只保留 score 大于等于 0.6 的结果，把相似度不够的候选剔除","如果过滤后结果为空，就直接返回一句提示，说明知识库里没有找到相关信息"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g19_q5","qnum":5,"qtext":"如何从零构建一个支持持久化、批量向量化、带阈值过滤的 RAG 检索组件？请描述核心设计决策。","answer":{"oral":"核心设计原则：**Embedding 模型可替换 + 向量存储与检索逻辑分离 + 批量 API 调用降成本**。","keyPoints":["**`EmbeddingModel` 隔离 API/本地差异**：调用方（`RAGRetriever`）只调用 `embedder.embed(texts)`，切换 API/本地只改构造函数参数，不改检索逻辑","**矩阵运算代替循环**：`matrix_normed @ q_norm` 一次算出全部相似度，比 for 循环逐一计算快 10–100 倍","**`min_score` 过滤在 `VectorStore.search` 内完成**：不在上层判断，保证\"空结果\"和\"有结果\"两个分支都被统一处理，调用方不需要额外过滤逻辑","定义 EmbeddingModel 类统一封装 API 和本地两种 Embedding 来源，外部只需要调用 embed(texts)，内部按 mode 参数分发到 sentence-transformers 或 OpenAI SDK","定义 VectorStore dataclass，保存所有文本、对应的向量和元数据，并支持 save/load 做 JSON 持久化","VectorStore.search 方法先对向量矩阵和查询向量做归一化，再用一次矩阵乘法算出所有 Chunk 与查询的余弦相似度，比逐条用 for 循环计算快很多","在 search 内部直接用 min_score 过滤掉相似度不够的结果，只返回 top_k 个满足阈值的结果","RAGRetriever 作为上层门面，build_from_texts 调用 embedder 批量编码 Chunk 后存入 store","retrieve 方法把查询编码成向量，再调用 store.search 完成检索并返回结果"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}}]},{"name":"RAG 引用与可解释性","questions":[{"id":"g21_q1","qnum":1,"qtext":"为什么 RAG 系统需要引用机制？引用解决了什么问题？","answer":{"oral":"引用机制让用户能追溯答案的来源，是 RAG 系统可解释性（Explainability）的核心保障。它解决了\"只根据资料回答\"约束遗留的一个关键问题——用户无法区分答案来自知识库还是模型\"脑补\"。 引用可以分三个层次逐步升级：L1 标记引用，只在回答中标注来源编号，做法最简单，成本最低，只是让用户知道\"这句话是有出处的\"；L2 展示来源，在回答后附上引用原文片段，用户不需要另外去查找资料，就能直接核实；L3 可验证，程序校验引用编号是否真实、内容是否匹配，价值在于防止模型\"虚构引用\"，从而保证引用真正可信。 引用与拒答机制的关系：拒答保证\"不知道时不说\"，引用保证\"知道时给出依据\"，两者共同构成 RAG 的可解释性。","keyPoints":["没有引用的回答直接给出结论\"购买后 30 天内可申请全额退款\"，用户没法判断这个规定是不是模型编的","有引用的回答在句末标注编号 [1]，并在下方附上对应的资料原文，用户可以直接核实来源，从而对系统产生信任"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g21_q2","qnum":2,"qtext":"自然语言引用和结构化 JSON 引用有什么本质区别？为什么推荐结构化输出？","answer":{"oral":"自然语言引用就是让模型在回答里直接写\"根据[资料1]\"这种话，结构化引用则是让模型输出一个 JSON，比如 `{\"answer\": \"...\", \"sources\": [1]}`。这两种方式差别主要在三点。格式稳定性上，自然语言引用很不靠谱，模型可能这次写\"[1]\"，下次写\"资料1\"，再下次写\"根据资料1\"，格式完全不统一；结构化 JSON 引用的字段是固定死的，格式很稳定。可解析性上，自然语言引用要提取编号，还得用正则表达式，或者干脆再调一次模型才能拿到，而结构化引用直接 `json.loads()` 一下就把 `sources` 取出来了。可校验性上差得更明显，自然语言引用没法可靠地把文字里的编号对应到具体哪条资料去做验证，而结构化引用里 `sources` 是个整数列表，可以直接跟检索结果的索引做匹配校验。 结构化输出的设计要点：`answer` 字段保持纯文本不含引用标记（展示时由程序决定标注方式），`sources` 字段用整数列表（可直接做索引匹配），`sources` 只放实际存在的编号（防止越界）。","keyPoints":["模型如果用自然语言表达引用，比如\"根据[资料1]和[资料3]\"，要从这句话里提取出\"1\"和\"3\"需要额外写解析逻辑，而且不一定可靠","如果让模型直接输出结构化 JSON，比如 {\"answer\": ..., \"sources\": [1, 3]}，可以直接取出 sources 字段，跟检索结果按索引做匹配，不需要额外解析"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g21_q3","qnum":3,"qtext":"什么是\"虚构引用\"？有哪些类型？如何检测？","answer":{"oral":"虚构引用是指模型在结构化输出中声称引用了某条资料，但实际上该资料中并没有相关内容——这比不引用更危险，因为用户以为有出处，实际是幻觉。 三种虚构引用类型：编号越界，表现为 sources=[5] 但实际只有 3 条资料，检测难度最低，只需检查编号是否落在 1–N 范围内；编号有效但内容不匹配，表现为 sources=[3]，但第 3 条资料里根本没有 answer 提到的内容，检测难度最高，需要用语义匹配去检查 answer 和引用资料之间有没有共享关键词；遗漏引用，表现为 answer 非空但 sources 为空，检测难度中等，只需检查 answer 非空时 sources 是否也非空。 类型 2（内容不匹配）最难检测——粗粒度关键词匹配可以拦截明显的不匹配，但更精确的校验需要语义相似度或额外模型调用，成本较高。生产环境中先用关键词匹配做粗筛，高价值场景再引入语义校验。","keyPoints":["遍历 rag_answer.sources 里的每个编号，检查是否落在 1 到资料总数之间，越界的记入 issues，合法的存入 valid_sources，这是防线 1（编号有效性）","判断 answer 里是否包含\"无法回答\"这类拒答用语，如果是拒答但 valid_sources 里还有内容，就记入\"拒答但仍有引用\"的矛盾问题，这是防线 2（拒答一致性）","对每个合法引用编号，取出对应资料的文本，调用 extract_shared_keywords 检查它和 answer 之间有没有共享关键词，没有的话记入\"引用与回答内容不匹配\"，这是防线 3（内容匹配性）","最后返回一个字典，包含是否有效（issues 是否为空）、合法引用列表和所有发现的问题"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g21_q4","qnum":4,"qtext":"引用校验的\"三道防线\"分别解决什么问题？为什么缺一不可？","answer":{"oral":"第一道是编号有效性，检查的是 `sources` 里的编号有没有落在 1 到 N 的范围内，拦截的是越界引用。它之所以少不了，是因为一旦有不存在的资料编号混进来，展示的时候索引就会越界报错。第二道是拒答一致性，检查的是当 `answer` 写着\"无法回答\"的时候，`sources` 是不是应该为空，拦截的是逻辑矛盾——少了这一道，就可能出现\"嘴上说不知道，却又引用了资料\"这种自相矛盾的输出。第三道是内容匹配性，检查引用的资料跟 `answer` 之间有没有共享关键词，拦截的是内容虚构，这也是三道防线里最关键的一道，因为它拦住的是\"编号本身合法，但内容其实无关\"这种最危险的幻觉引用。 防线 3 是粗粒度关键词匹配而非精确语义校验，原因：关键词匹配成本极低（纯 Python 字符串操作），能拦截最明显的内容不匹配；精确语义校验需要额外 Embedding 或模型调用，成本高，留到高价值场景按需引入。","keyPoints":["防线 1 是格式层，过滤越界编号，保证 sources 指向真实存在的资料","防线 2 是逻辑层，检查拒答和引用是否自相矛盾，保证输出逻辑一致","防线 3 是语义层，检查引用内容和回答是否匹配，拦截编号合法但内容对不上的虚构引用","只有防线 1 时，编号合法但内容虚构的幻觉会漏网；加上防线 2 后逻辑矛盾解决了，但内容无关的问题依然存在；三道防线都有才能从格式到逻辑再到语义层层递进、覆盖最全"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g21_q5","qnum":5,"qtext":"如何从零设计一个带引用溯源和校验的 RAG 问答系统？描述核心设计决策。","answer":{"oral":"核心设计原则：**结构化输出保证可解析 + 三道防线保证可信 + 引用展示保证可追溯**。","keyPoints":["**answer 与 sources 分离**：`answer` 保持纯文本不含 `[1]` 标记，引用信息独立放在 `sources` 列表。展示时由程序决定标注方式（方括号、上标、超链接），而非让模型在自然语言中混入标记。好处是格式稳定、可程序化处理、展示灵活。","**三道防线分层校验**：编号有效性（格式层）→ 拒答一致性（逻辑层）→ 内容匹配性（语义层），从简单到复杂递进。每层解决不同类型的虚构引用，防线 1 和 2 成本极低（纯逻辑判断），防线 3 用粗粒度关键词匹配保证零额外 API 成本。校验结果通过 `issues` 列表反馈给展示层，用户可以看到\"⚠ 引用 [3] 与回答内容不匹配\"的警告。","**校验结果不影响主流程**：即使引用校验发现问题，系统仍然返回回答（附带警告），而不是直接拦截。原因：虚构引用的检测是\"概率性\"的（尤其防线 3 的关键词匹配可能有误报），直接拦截会导致误拒；让用户看到回答 + 警告，由用户自行判断更合理。生产环境可以根据 `issues` 数量设置分级策略（如 1 个 issue 只警告，3 个以上 issue 标记\"低可信度\"）。","用 Pydantic 定义 RAGAnswer 模型，包含 answer 纯文本字段和 sources 整数列表字段，作为带引用回答的结构化格式","CitedRAGPipeline.ask 先调用 store.search 做检索，如果结果为空就直接返回检索层的拒答文案","有结果时用 build_citation_prompt 构造带引用要求的 Prompt，调用 LLM 并强制以 JSON 格式返回","把返回的 JSON 解析成 RAGAnswer 对象","调用 validate_citation 对这个回答做三道防线校验","最后用 format_cited_answer 把回答、引用资料和校验警告一起格式化展示给用户"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}}]},{"name":"混合检索与重排序","questions":[{"id":"g59_q1","qnum":1,"qtext":"向量检索和 BM25 检索分别擅长什么？为什么说两者互补？","answer":{"oral":"两者在匹配方式、擅长领域、弱点三方面正好形成互补。匹配方式上，向量检索（稠密）靠语义相似度，BM25（稀疏）靠关键词精确匹配。擅长领域上，向量检索擅长同义改写、跨表达方式的语义关联，BM25 擅长专有名词、编号、精确术语。弱点上，向量检索对生僻词/专有名词的向量表示不够精确，BM25 则无法理解\"离职\"和\"解除劳动合同\"是同一件事。 **互补的原因**：向量检索负责\"意思一样但说法不同\"，BM25 负责\"必须原文精确出现\"。真实业务场景里这两类查询同时存在（比如既有\"员工离职流程是什么\"这种语义类问题，也有\"产品型号 XJ-2024 保修期\"这种精确术语类问题），只用一种检索方式必然在另一类查询上表现差。","keyPoints":["**向量检索（稠密）**：靠语义相似度，擅长同义改写、跨表达方式的语义关联，但对生僻词/专有名词表示不够精确","**BM25（稀疏）**：靠关键词精确匹配，擅长专有名词、编号、精确术语，但无法理解\"离职\"和\"解除劳动合同\"是同一件事","**互补原因**：向量检索负责\"意思一样但说法不同\"，BM25 负责\"必须原文精确出现\"，真实业务场景两类查询同时存在，只用一种方式必然在另一类上表现差"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g59_q2","qnum":2,"qtext":"BM25 相比 TF-IDF 做了哪两个关键改进？","answer":{"oral":"`k1` 控制词频饱和速度，`b` 控制文档长度归一化强度。","keyPoints":["**词频饱和**：TF-IDF 里词频的重要性是无上限线性增长的，一个词出现 100 次不该被认为比出现 10 次重要 10 倍；BM25 让词频对得分的贡献存在上限","**文档长度归一化**：长文档天然包含更多词，容易\"意外命中\"更多查询词；BM25 用 `|D|/avgdl`（文档长度相对平均长度的比例）做归一化，避免长文档 unfair 地占优"],"code":[{"lang":null,"steps":["公式里的 IDF(qi) 衡量查询词在语料库里的稀有程度，出现越少权重越高","分子的 f(qi, D) × (k1 + 1) 和分母里的 f(qi, D) + k1 × (...) 共同作用，让词频的贡献随出现次数增加而趋于饱和，不再无限线性增长","分母里的 (1 - b + b × |D|/avgdl) 项用文档长度相对平均长度的比例做归一化，抑制长文档意外命中更多查询词带来的优势","k1 控制词频饱和的速度，b 控制文档长度归一化的强度，两者共同构成 BM25 相对 TF-IDF 的两个关键改进"],"keepCode":"score(D, Q) = Σ IDF(qi) × [f(qi, D) × (k1 + 1)] / [f(qi, D) + k1 × (1 - b + b × |D|/avgdl)]"}],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g59_q3","qnum":3,"qtext":"把向量检索和 BM25 的分数直接加权相加融合，会有什么问题？","answer":{"oral":"直接加权相加（如 `0.5 × vector_score + 0.5 × bm25_score`）会导致数值范围大的一路系统性地主导融合结果，而不是真正意义上的\"各占一半权重\"。要让加权融合生效，必须先对两路分数做归一化，且需要额外调权重比例——增加了不必要的调参复杂度。","keyPoints":["向量相似度分数天然落在 0 到 1 之间，比如 0.82、0.79、0.75","BM25 分数的数值范围完全不同，比如 12.3、8.7、5.2，而且会随语料库规模变化","如果直接按 0.5 比 0.5 加权相加，数值范围大的 BM25 分数会系统性地主导融合结果","想让加权相加真正生效，必须先把两路分数归一化，还要额外调权重比例，增加了不必要的调参复杂度"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g59_q4","qnum":4,"qtext":"RRF（Reciprocal Rank Fusion）是怎么工作的？为什么它能避开分数量纲不同的问题？","answer":{"oral":"RRF 的核心思路是**抛弃原始分数，只用排名**——不管两路检索的分数量纲差多远，只看\"这篇文档在各自结果里排第几名\"，用 `1/(k+rank)` 累加。`k` 是平滑常数（通常取 60），避免排名靠前的文档分数过度陡峭。 **避开量纲问题的原因**：排名是天然可比的（第 1 名就是第 1 名，不管背后的原始分数是 0.82 还是 12.3），完全不需要归一化或调权重，这是它比加权分数融合更鲁棒的根本原因。","keyPoints":["reciprocal_rank_fusion 函数接收多路检索结果列表 result_lists 和平滑常数 k（默认 60）","用一个 scores 字典累计每篇文档的融合分数","遍历每一路结果，用 enumerate 从 1 开始给每篇文档标出排名 rank","对每篇文档累加 1/(k+rank) 这个分数，排名越靠前累加值越大","最后按累加后的分数从高到低排序并返回"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g59_q5","qnum":5,"qtext":"混合检索在什么类型的查询上提升最明显？在什么类型的查询上提升不明显？","answer":{"oral":"混合检索在精确术语类的查询上提升最明显，比如产品型号、错误代码、专有名词、编号这类查询，因为 BM25 那一路能精确命中包含准确字符串的文档，而向量检索对这类稀有 token 的语义表示往往不够精确。相反，在纯语义类查询上，也就是措辞不同但语义相关的自然语言问题，提升就不明显了——向量检索本身已经能较好覆盖这类查询，混合检索甚至可能因为 BM25 那一路引入噪音，反而轻微拉低融合排名。 **结论**：是否需要上混合检索，取决于业务场景里\"精确匹配类查询\"的比例——纯闲聊或纯语义问答场景收益有限，涉及产品型号/错误代码/专业术语的知识库场景收益明显。","keyPoints":["**精确术语类查询提升明显**：产品型号、错误代码等，BM25 能精确命中，而向量检索对这类稀有 token 语义表示不够精确","**纯语义类查询提升不明显**：向量检索本身已较好覆盖，混合检索甚至可能因 BM25 引入噪音而轻微拉低融合排名","**结论**：是否需要混合检索取决于业务场景里精确匹配类查询的比例，纯闲聊/语义问答收益有限，涉及型号/错误代码的知识库场景收益明显"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g59_q6","qnum":6,"qtext":"中文场景下用 BM25 做检索，为什么必须先用 jieba 分词，直接对原始字符串跑 BM25 会有什么问题？","answer":{"oral":"BM25 的打分公式建立在词元级别的词频统计上，它得知道某个词在文档里出现了几次、在整个语料库里的逆文档频率是多少。英文天生用空格分隔单词，直接按空格切就能拿到词元；但中文没有这种天然的分隔符，如果不分词，直接把整句话当一个词元，或者按单字符切开，那像\"产品型号\"\"XJ-2024\"这种多字词的词频根本统计不对，查询词和文档词在词元层面也对不齐，BM25 打出来的分就完全失真了。所以中文场景必须先用 `jieba.cut` 这类分词工具把文本切成词元序列，再交给 `BM25Okapi` 去处理。","keyPoints":["tokenize 函数接收一段中文文本","调用 jieba.cut(text) 对文本做分词","用 list() 把分词结果转成词元列表返回，供后续 BM25Okapi 处理"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g59_q7","qnum":7,"qtext":"混合检索里，为什么向量索引和 BM25 索引必须基于同一批 chunk 构建，而不能各自独立选择切分策略？","answer":{"oral":"**关键点**：两路检索基于**同一批 chunk** 建索引，保证融合时引用的是同一个文档集合，不会出现\"向量库有但 BM25 库没有\"的不一致。如果两路检索各自用不同的切分策略建索引，RRF 融合时同一篇原文可能在两路里对应的是内容不完全相同的两个 chunk，\"这篇文档在两路里的排名\"这个前提就不成立了，融合结果会失去意义。","keyPoints":["HybridRetriever 的构造函数接收一批 chunks 和一个已经建好的 vector_store","把传入的 vector_store 保存为向量检索器","用同一批 chunks 构建 BM25Retriever 作为关键词检索器","两路检索器基于完全相同的 chunk 集合建索引，保证后续融合时引用的是同一批文档"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g59_q8","qnum":8,"qtext":"混合检索中，向量检索和 BM25 检索为什么可以并行执行？如果向量库是远程服务应该怎么做？","answer":{"oral":"两路检索互相独立，谁也不依赖谁的结果（不像 Reranker 依赖粗召回的输出），因此可以并行执行。如果向量库是远程服务（如托管的 Chroma/Pinecone），可以用 `asyncio.gather` 并发发起向量检索请求和 BM25 检索（BM25 通常本地内存计算），复用批处理的并发思路，把两路检索的总耗时从\"串行相加\"降到\"取两者较慢的一路\"。","keyPoints":["dual_search 方法接收查询 query 和返回数量 top_k","调用 self.vector_store.search() 得到稠密检索（向量检索）结果","调用 self.bm25_retriever.search() 得到稀疏检索（BM25）结果","把两路结果作为一个元组 (vector_results, bm25_results) 一起返回，供后续融合使用"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g60_q1","qnum":9,"qtext":"Bi-Encoder 和 Cross-Encoder 的本质区别是什么？为什么 Cross-Encoder 更准但更贵？","answer":{"oral":"两者在编码方式、交互粒度、doc 是否可预计算三方面都不同。编码方式上，Bi-Encoder（向量检索）让 query 和 doc 独立编码，Cross-Encoder（Reranker）把 query 和 doc 拼接后一起编码。交互粒度上，Bi-Encoder 只在最后比较两个向量的相似度，Cross-Encoder 在模型内部注意力层就能直接捕捉词级交互。doc 是否可预计算上，Bi-Encoder 可以在检索前批量算好存库，Cross-Encoder 不行，每次都要重新计算。 **更准的原因**：Cross-Encoder 把 query 和 doc 放在一起端到端地算了一遍，能捕捉到 Bi-Encoder 压缩进两个独立向量后丢失的交互信息。**更贵的原因**：正是因为不能预计算，每一次打分都要对这一对 query-doc 重新跑一遍完整的模型前向传播，无法像 Bi-Encoder 一样批量离线建索引。","keyPoints":["**编码方式**：Bi-Encoder（向量检索）让 query 和 doc 独立编码，Cross-Encoder（Reranker）把两者拼接后一起编码","**交互粒度**：Bi-Encoder 只在最后比较两个向量的相似度，Cross-Encoder 在注意力层就能捕捉词级交互","**更准的原因**：端到端一起计算，能捕捉 Bi-Encoder 压缩进两个独立向量后丢失的交互信息","**更贵的原因**：doc 无法像 Bi-Encoder 一样预计算存库，每次打分都要对这对 query-doc 重新跑一遍完整前向传播"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g60_q2","qnum":10,"qtext":"为什么不能对全量文档直接用 Cross-Encoder 做检索？两阶段检索是怎么设计的？","answer":{"oral":"假设知识库有 10 万条 chunk，对每个查询都用 Cross-Encoder 给全部 10 万条打分，意味着每次查询要跑 10 万次模型前向传播，延迟和算力成本都不可接受。 粗召回牺牲一部分精度换取速度，尽量覆盖候选范围；精排在小范围候选内牺牲一部分速度换取精度——这和模型分级路由\"用最贵的资源做最关键的判断\"是同一种工程思路。","keyPoints":["粗召回阶段用混合检索，速度快、成本低，目标是尽量覆盖候选范围，返回 Top-N（比如 50 条）","精排阶段用 Reranker 只处理粗召回返回的这几十条候选，速度慢但更准确，最终只保留 Top-K（比如 5 条）","粗召回牺牲一部分精度换速度，精排在小范围候选内牺牲一部分速度换精度，两者配合避免对全量文档跑昂贵的 Cross-Encoder"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g60_q3","qnum":11,"qtext":"Reranker 精排阶段处理的是多少条候选？为什么不是全量文档？","answer":{"oral":"只处理粗召回返回的 Top-N 候选（如 N=50），不涉及全量文档： 把候选数量从全量（如 10 万条）降到 50 条，Cross-Encoder 的计算量就变得完全可接受——这正是两阶段设计把 Reranker 的高成本控制在可承受范围的关键。","keyPoints":["two_stage_retrieve 函数接收 query、混合检索器、Reranker，以及粗召回数量 coarse_n（默认 50）和最终数量 final_k（默认 5）","先调用 hybrid_retriever.dual_search() 拿到向量检索和 BM25 检索各自的候选","用 reciprocal_rank_fusion 把两路候选融合排序，截取前 coarse_n 条","最后调用 reranker.rerank()，只对这 coarse_n 条候选做精排打分，返回 top_k 条最终结果"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g60_q4","qnum":12,"qtext":"加 Reranker 后 Hit Rate 提升了，这个提升的本质是什么？","answer":{"oral":"粗召回阶段（向量+BM25+RRF）本身已经能把正确文档\"捞进\"Top-N 候选，但受限于 Bi-Encoder 的向量压缩和 RRF 融合的排名规则，正确文档未必排进最终返回的 Top-K。Reranker 用更精细的交互式打分重新排序这批候选，能把\"排名靠后但其实相关\"的正确文档重新拉到前面。 **本质**：Reranker 提升的是\"排序准不准\"，不是\"能不能找到\"——它只是把已经在候选池里的正确文档排到更靠前的位置，而不是从候选池之外把文档\"变出来\"。","keyPoints":["**粗召回的局限**：向量+BM25+RRF 能把正确文档\"捞进\"Top-N，但受限于 Bi-Encoder 向量压缩和 RRF 融合规则，正确文档未必排进最终 Top-K","**Reranker 的作用**：用更精细的交互式打分重新排序候选，把排名靠后但相关的正确文档重新拉到前面","**本质**：提升的是\"排序准不准\"而不是\"能不能找到\"，只是把已在候选池里的正确文档排到更靠前的位置"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g60_q5","qnum":13,"qtext":"如果正确文档没有出现在最终 Top-K 结果里，应该先怀疑粗召回还是精排出了问题？","answer":{"oral":"应该先怀疑**粗召回**。因为 Reranker 只能对粗召回返回的 Top-N 候选重新排序，如果正确文档在粗召回阶段就没有进入这 N 条候选，Reranker 根本没有机会看到它，自然无法把它排进最终结果。 **排查顺序**：先检查正确文档是否在粗召回的 Top-N 里（如果 N=50 都没进去，说明混合检索/RRF 融合环节有问题，可能需要调整 Chunk 切分或检索策略）；如果确认正确文档在 Top-N 里但被排到了 Top-K 之外，才需要检查 Reranker 模型本身的打分是否合理。**粗召回决定\"能不能找到\"，精排只决定\"排序准不准\"**，这也是为什么粗召回阶段的 Top-N 要设置得足够大，覆盖率优先于速度。","keyPoints":["**应先怀疑粗召回**：Reranker 只能对粗召回返回的 Top-N 候选重新排序，若正确文档没进入 Top-N，Reranker 根本没机会看到它","**排查顺序**：先检查正确文档是否在粗召回 Top-N 里（没进去说明混合检索/RRF 融合环节有问题），确认在 Top-N 但被排到 Top-K 之外，才检查 Reranker 打分","**结论**：粗召回决定\"能不能找到\"，精排只决定\"排序准不准\"，所以粗召回 Top-N 要设置得足够大，覆盖率优先于速度"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g60_q6","qnum":14,"qtext":"常见的开源 Reranker 模型有哪些？分别适合什么场景，应该怎么选型？","answer":{"oral":"常见的开源 Reranker 模型大概有三种。第一种是 BAAI 的 `bge-reranker-base` 和 `bge-reranker-large`，中英双语效果好，开源可以本地部署，`base` 版本速度快，`large` 版本精度更高。第二种是 `cross-encoder/ms-marco-MiniLM-L-6-v2`，英文场景比较常用，模型轻量，由 sentence-transformers 官方维护。第三种是 Cohere Rerank API，属于商业 API，不需要自己部署，多语言效果稳定，按调用量计费。 **选型建议**：中文场景优先 `bge-reranker`（本地部署，无额外 API 成本）；不想自己维护模型、预算允许的场景可以直接用 Cohere Rerank 这类托管服务。","keyPoints":["**bge-reranker-base/large**：BAAI 出品，中英双语效果好，可本地部署，base 版本速度快，large 版本精度更高","**cross-encoder/ms-marco-MiniLM-L-6-v2**：英文场景常用，模型轻量，由 sentence-transformers 官方维护","**Cohere Rerank API**：商业 API，无需自己部署，多语言效果稳定，按调用量计费","**选型建议**：中文场景优先本地部署的 bge-reranker（无额外 API 成本），不想维护模型且预算允许可用 Cohere 这类托管服务"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g60_q7","qnum":15,"qtext":"Hit Rate@K 这个评估指标是怎么定义的？对比\"加 Reranker 前后\"效果的评估脚本是怎么设计的？","answer":{"oral":"评估脚本需要一份标注好\"正确文档 ID\"的测试集，分别用两个检索函数跑同一批查询：一个是\"粗召回直接截断 Top-K\"（`coarse_only`），一个是\"粗召回 + Reranker 精排后取 Top-K\"（`with_reranker`），再对比两者的 `evaluate_hit_rate()` 结果： **记忆点**：Hit Rate 只关心\"正确文档在不在 Top-K 里\"，不关心排在第几名，这也是为什么它能干净地量化 Reranker 带来的排序质量提升。","keyPoints":["Hit Rate@K 的计算方式是命中的查询数除以总查询数","命中的定义是：正确文档出现在了返回的 Top-K 结果列表里","这个指标只关心正确文档在不在 Top-K 里，不关心它具体排第几名","分别用两种检索方式跑同一批评估查询：coarse_only 是粗召回直接截断 Top-K，with_reranker 是粗召回后再经过 Reranker 精排","调用 evaluate_hit_rate() 分别计算这两种方式在 EVAL_SET 上、top_k=5 时的 Hit Rate","对比 hit_rate_before 和 hit_rate_after 两个结果，量化加 Reranker 前后的排序质量提升"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}}]},{"name":"HyDE 与查询改写","questions":[{"id":"g61_q1","qnum":1,"qtext":"什么是 query-document mismatch？为什么直接用问题检索有时候效果不好？","answer":{"oral":"用户问题通常是口语化的疑问句，知识库文档通常是陈述句、说明文，两者在语言风格、句式结构、用词习惯上天然存在差异： 即使讨论的是同一件事，问题的向量表示更像\"疑问句的语义\"，文档的向量表示更像\"说明文的语义\"，两者在向量空间里的距离可能没有想象中近——这种\"问题和答案文体不同导致检索不准\"的现象就是 query-document mismatch，是纯向量检索甚至加上 BM25 都难以彻底解决的结构性问题。","keyPoints":["用户问题是口语化疑问句，比如东西坏了怎么办能退吗","知识库文档是正式陈述句，比如产品质量问题处理流程","即使讨论的是同一件事，两者在语言风格、句式结构、用词习惯上天然存在差异","这导致问题和文档在向量空间里的语义表示距离没有想象中近，纯向量检索甚至加上 BM25 都难以彻底解决这种结构性问题"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g61_q2","qnum":2,"qtext":"HyDE 的核心思路是什么？为什么生成的假设答案不需要保证内容准确？","answer":{"oral":"核心思路：不直接用问题去检索，而是先让模型针对问题生成一段\"假设性答案\"，再用这段假设答案的 Embedding 去检索。 **不需要准确的原因**：假设答案从来不会返回给用户，只是一个\"用来检索的中间媒介\"，它的价值在于**文体和措辞风格更接近真实文档**，而不在于内容本身是否准确——即使假设答案里有编造的细节（幻觉），只要文体贴近知识库文档，检索效果依然能提升。","keyPoints":["传统检索流程是：用户问题先做 Embedding，再直接检索知识库","HyDE 检索流程是：用户问题先交给 LLM 生成一段假设性答案，再对这段假设答案做 Embedding，最后用这个向量去检索知识库","假设答案本身不需要保证内容准确，因为它从不会返回给用户，只是用来检索的中间媒介","它的价值在于文体和措辞风格更接近真实文档，即使内容有编造细节，检索效果依然能提升"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g61_q3","qnum":3,"qtext":"HyDE 检索流程的三个步骤是什么？关键区别在哪一步？","answer":{"oral":"**关键区别在 Step 2**：检索用的向量来自\"假设答案\"而不是\"原始问题\"——这正是 HyDE 名字里 \"Hypothetical Document\" 的含义，把检索的锚点从问题的语义空间搬到了文档的语义空间。","keyPoints":["Step 1：让 LLM 针对用户问题生成一段假设性答案，要求文体正式陈述、贴近文档风格，不要求内容准确","Step 2：对这段假设答案做 Embedding，而不是对原始问题做 Embedding","Step 3：用假设答案的向量去检索知识库，返回检索结果","关键区别就在 Step 2，检索用的向量来自假设答案而不是原始问题，把检索锚点从问题的语义空间搬到了文档的语义空间"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g61_q4","qnum":4,"qtext":"把 HyDE 和混合检索结合时，向量检索路和 BM25 路分别应该用假设文档还是原始问题？为什么？","answer":{"oral":"**原因**：BM25 依赖关键词精确匹配，假设文档里的编造内容可能引入无关关键词，反而污染 BM25 的匹配结果，所以 BM25 这一路仍用原始问题。同理，最终 Reranker 判断\"这篇文档是否真的回答了用户的问题\"，也应该基于原始问题而不是假设答案——只有向量检索这一路因为要利用\"文体贴近\"这个优势，才用假设文档做 Embedding。","keyPoints":["向量检索这一路调用 hybrid_retriever.vector_store.search()，传入的是假设文档 hypothetical_doc","BM25 检索这一路调用 hybrid_retriever.bm25_retriever.search()，传入的仍然是原始问题 question","两路都设置 top_k=50，用于后续融合时提供候选","之所以这样分工，是因为 BM25 依赖关键词精确匹配，假设文档里编造的内容可能引入无关关键词污染匹配结果"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g61_q5","qnum":5,"qtext":"HyDE 有哪些局限性？什么场景下不适合用 HyDE？","answer":{"oral":"**不适合的场景**：对延迟/成本极度敏感的场景；问题本身已经很规范清晰的场景；检索效果差的根因其实是 Chunk 切分不合理或 Embedding 模型选型问题（这类问题 HyDE 解决不了，需要针对性排查切分和 Embedding 环节）。","keyPoints":["额外成本方面，每次检索都要多一次 LLM 调用，增加延迟和 Token 成本","幻觉风险方面，假设答案如果生成方向完全跑偏，可能让检索走向错误方向，反而不如直接用原始问题准确","收益有限的场景，比如用户问题本身已经是清晰的陈述式表达（如直接输入产品型号），这时 HyDE 转换步骤的价值不大"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g61_q6","qnum":6,"qtext":"HyDE 生成假设答案的 Prompt 设计里，为什么要求\"正式陈述文体\"而不是直接说\"请回答这个问题\"？","answer":{"oral":"**设计要点**：明确要求\"正式陈述文体\"而不是\"回答用户问题\"，这是让生成结果贴近知识库文风的关键——如果 Prompt 写成\"请回答这个问题\"，模型可能生成的是口语化的助手式回复，反而和知识库文档的文体差异依然很大，达不到 HyDE 缩小 query-document mismatch 的目的。","keyPoints":["**设计要点**：要求\"正式陈述文体\"而非\"回答用户问题\"，是让生成结果贴近知识库文风的关键","**原因**：写成\"请回答这个问题\"，模型容易生成口语化助手式回复，和知识库文档文体差异依然很大","**目的**：贴近文风才能缩小 query-document mismatch，这是 HyDE 设计的核心目的","**辅助约束**：限定生成长度在 80-150 字，不要求内容绝对准确，重点是文体贴近正式说明文档"],"code":[{"lang":"python","steps":["提示词开头设定角色，让模型扮演专业知识库的内容撰写助手","要求针对问题写一段可能出现在正式文档里的回答，而不是说请回答这个问题","明确要求语言风格正式、陈述式，避免口语化表达","限定长度在 80-150 字，并且强调不需要保证内容绝对准确，重点是文体贴近正式说明文档"],"keepCode":"请针对下面的问题，写一段可能出现在正式文档里的回答。\n要求：\n1. 语言风格要正式、陈述式，避免口语化表达\n3. 不需要保证内容绝对准确，重点是文体贴近正式说明文档"}],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g61_q7","qnum":7,"qtext":"从对比实验的具体 case 看，HyDE 在哪类问题上提升明显，哪类问题上没有差异？","answer":{"oral":"具体看几个 case：问\"东西坏了怎么办，能退吗\"，直接检索命中的是\"产品使用说明\"（相关性较弱），HyDE 检索命中的是\"产品质量问题处理流程\"（更准确）；问\"多久能到账\"，直接检索命中\"物流配送时效\"（跑偏，答非所问），HyDE 检索命中\"退款到账时间说明\"（更准确）；问\"换个尺码麻烦吗\"，直接检索和 HyDE 检索都命中\"换货政策\"，结果一致，没有明显差异。 **结论**：HyDE 在\"问题信息量少、口语化程度高\"的 case 上（如缺乏明确主语的\"多久能到账\"）提升明显；在问题本身已经比较清晰、和文档措辞差异不大的 case 上（如\"换个尺码麻烦吗\"），两种方式的检索结果基本一致，HyDE 的额外成本没有换来明显收益。","keyPoints":["**信息量少的口语化问题提升明显**：如\"多久能到账\"直接检索命中\"物流配送时效\"（跑偏），HyDE 命中\"退款到账时间说明\"（更准确）","**问题已清晰时无明显差异**：如\"换个尺码麻烦吗\"表述清晰、和文档措辞差异不大，直接检索与 HyDE 都命中\"换货政策\"，结果一致","**结论**：HyDE 在问题信息量少、口语化程度高的 case 上提升明显，在问题本身已清晰的 case 上收益有限"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g62_q1","qnum":8,"qtext":"Query Rewriting 和 Multi-query Fusion 分别解决模糊问题的哪类症状？","answer":{"oral":"Query Rewriting 针对的是\"指代不明 / 信息不全\"这类症状，比如\"那个东西怎么用\"这种脱离上下文无法理解的问题，需要结合对话历史改写成\"蓝牙耳机没声音时应该如何排查和使用\"；Multi-query Fusion 针对的是\"单一查询覆盖角度有限\"这类症状，即一句话里隐含了多个子意图，比如\"退货流程和运费谁承担\"会被拆成\"退货申请流程是什么\"和\"退货运费由谁承担\"两个变体分别检索。 Query Rewriting 是**一对一**改写（模糊问题 → 清晰问题），Multi-query Fusion 是**一对多**扩展（一个清晰问题 → 多个角度变体）。","keyPoints":["**Query Rewriting**：针对\"指代不明/信息不全\"，结合对话历史把模糊问题改写成清晰问题，如\"那个东西怎么用\"→具体化表述","**Multi-query Fusion**：针对\"单一查询覆盖角度有限\"，把一句话隐含的多个子意图拆成多个变体分别检索","**区别**：Query Rewriting 是一对一改写（模糊问题→清晰问题），Multi-query Fusion 是一对多扩展（一个清晰问题→多个角度变体）"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g62_q2","qnum":9,"qtext":"Query Rewriting 为什么必须结合对话历史？如果原问题本身已经清晰，应该怎么处理？","answer":{"oral":"指代消解（\"那个东西\"具体指什么）必须依赖之前的对话内容才能确定，脱离对话历史无法判断\"那个东西\"是蓝牙耳机还是别的产品： **原问题已经清晰时**：Prompt 里应明确要求\"如果原问题已经清晰完整，直接返回原问题，不要画蛇添足\"——因为改写本身有引入语义偏移的风险，只有确实模糊的问题才值得承担这个风险，不应该对所有问题都无差别改写。","keyPoints":["rewrite_query 函数接收对话历史 history 和最后一句用户消息 last_message","把历史列表拼接成一段文本 history_text，每条记录格式化为角色: 内容","用 REWRITE_PROMPT 模板把历史文本和最后一条消息填进去，组装出完整提示词","调用 call_llm，并设置 temperature=0，得到确定性的改写结果"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g62_q3","qnum":10,"qtext":"Multi-query Fusion 生成的多个查询变体，最后怎么合并成一个排名？","answer":{"oral":"用 RRF（Reciprocal Rank Fusion）： 每路查询各自检索出一批候选，RRF 只依据\"文档在各路结果里的排名\"累加分数，不需要处理不同查询检索分数的量纲问题——这和混合检索融合向量检索与 BM25 结果时使用的是同一套融合机制，只是这里融合的是\"多个查询变体各自的检索结果\"而不是\"多种检索方式的结果\"。","keyPoints":["multi_query_retrieve 函数先调用 generate_query_variants 生成 n 个查询变体","把原始问题和这些变体合并成 all_queries 列表","对 all_queries 里的每一个查询分别调用 hybrid_retriever.vector_store.search()，各取 top_k=20 条结果，得到多个结果列表","调用 reciprocal_rank_fusion 把这些结果列表融合排序，再截取前 top_k 条返回"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g62_q4","qnum":11,"qtext":"Multi-query 检索时，为什么要把原始问题也保留为一路查询，而不是完全用生成的变体替代？","answer":{"oral":"**原因**：生成的变体是\"补充覆盖角度\"，不是\"替代原始意图\"——如果完全丢弃原始问题只用变体检索，一旦变体生成偏离了原始问题的核心意图（模型理解错了子话题划分），检索结果就完全没有机会命中真正相关的文档。保留原始问题这一路，相当于给整个融合结果加了一道\"不偏离原意\"的兜底保障。","keyPoints":["生成变体后，用 all_queries = [question] + variants 把原始问题拼在变体列表最前面","保留这一路原始问题，是为了在融合结果里始终留一份不偏离原始意图的检索来源","一旦生成的变体偏离了原始问题的核心意图，原始问题这一路依然能兜底命中真正相关的文档"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g62_q5","qnum":12,"qtext":"Query Rewriting、Multi-query、HyDE 三者分别改变的是什么？实际使用时应该按什么顺序组合？","answer":{"oral":"三者改变的对象完全不同：HyDE 改变的是检索锚点的文体，把问题转换成假设答案；Query Rewriting 改变的是查询内容本身，把模糊表述改写成清晰表述；Multi-query 改变的是查询数量，把一个查询扩展成多个角度的变体。 **组合顺序**：先做 Query Rewriting 解决\"这句话在问什么\"，再做 Multi-query 解决\"从哪些角度检索这个已经说清楚的问题\"，每个变体还可以再套一层 HyDE 转换文体。顺序不能颠倒——如果先做 Multi-query 再改写，生成的变体会基于模糊指代的原始问题，变体本身也是模糊的，无法真正扩大有效覆盖角度。三者可以叠加，但每叠加一层就多一次 LLM 调用，需要权衡延迟和收益，不是无脑全
