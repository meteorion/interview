部叠满。","keyPoints":["**改变对象不同**：HyDE 改变检索锚点的文体（问题转成假设答案），Query Rewriting 改变查询内容本身（模糊改清晰），Multi-query 改变查询数量（一个扩展成多个变体）","**组合顺序**：先做 Query Rewriting 解决\"这句话在问什么\"，再做 Multi-query 解决\"从哪些角度检索\"，每个变体还可再套一层 HyDE","**顺序不能颠倒**：若先做 Multi-query 再改写，生成的变体基于模糊指代的原始问题，变体本身也模糊，无法真正扩大有效覆盖角度","**权衡**：三者可以叠加，但每叠一层就多一次 LLM 调用，需权衡延迟和收益，不是无脑全部叠满"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g62_q6","qnum":13,"qtext":"查询改写时用 `temperature=0`，而多查询生成变体时用 `temperature=0.5`，这个差异说明了什么设计考量？","answer":{"oral":"两者的目标完全不同：Query Rewriting 追求的是\"消除歧义后的唯一正确表述\"——改写结果应该是确定、可复现的，用 `temperature=0` 避免同一个模糊问题每次改写出不同版本；Multi-query Fusion 追求的是\"从不同角度覆盖问题\"——如果用 `temperature=0`，模型大概率会生成措辞相近甚至重复的变体，起不到扩大检索覆盖面的作用，所以需要 `temperature=0.5` 保留一定随机性，但又不能太高（避免变体偏离原始问题的核心意图）。 **记忆点**：温度参数不是越低越\"稳妥\"——要看这一步任务本身需要的是\"确定性\"还是\"多样性\"。","keyPoints":["rewrite_query 函数调用 call_llm 时传入 temperature=0，追求确定、可复现的改写结果","generate_query_variants 函数调用 call_llm 时传入 temperature=0.5，保留一定随机性","前者的目标是消除歧义后的唯一正确表述，用低温度避免同一问题每次改写出不同版本","后者的目标是从不同角度覆盖问题，如果用 0 温度容易生成措辞相近甚至重复的变体，起不到扩大检索覆盖面的作用"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}}]},{"name":"RAG 优化手段选型","questions":[{"id":"g63_q1","qnum":1,"qtext":"RAG 检索效果不好可以拆解成哪两类问题？怎么判断某个 case 属于哪一类？","answer":{"oral":"可以拆解成\"召回不到\"（Recall 问题）和\"排序不准\"（Precision/Ranking 问题）两类：召回不到指正确文档根本没有出现在候选池里，症状是不管怎么调整排序，正确答案都不可能出现在最终结果里；排序不准指正确文档在候选池里、但排名不够靠前，症状是候选池够大的话能找到，但 Top-K 截断把它挡在外面了。 **判断方法**：先看正确文档是否出现在足够大的候选池里（如 Top-50），如果没有，是召回问题；如果在候选池里但没进最终 Top-K，是排序问题。","keyPoints":["**召回不到（Recall 问题）**：正确文档根本没出现在候选池里，不管怎么调整排序，正确答案都不可能出现在最终结果里","**排序不准（Precision/Ranking 问题）**：正确文档在候选池里但排名不够靠前，候选池够大能找到，但 Top-K 截断把它挡在外面","**判断方法**：先看正确文档是否出现在足够大的候选池（如 Top-50）里，没有是召回问题，在但没进最终 Top-K 是排序问题"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g63_q2","qnum":2,"qtext":"混合检索、HyDE、查询改写/多查询，为什么都归类为解决\"召回不到\"？","answer":{"oral":"如果正确文档从一开始就没被这三种手段的任何一种捞进候选池，那再怎么排序也找不回来——它们解决的是\"能不能被捞出来\"，而不是\"捞出来之后排第几\"。","keyPoints":["混合检索用 BM25 补上向量检索对专有名词、精确术语召回不到的短板","HyDE 通过改变检索锚点的文体，解决 query-document mismatch 导致的召回不准","查询改写和多查询消除指代不明、信息缺失、单一查询覆盖不全导致的召回缺口","三者的共同点是都在扩大或校准候选池，解决的是能不能被捞出来，而不是捞出来之后排第几"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g63_q3","qnum":3,"qtext":"为什么说 Reranker 只解决\"排序不准\"，不解决\"召回不到\"？","answer":{"oral":"Reranker 的前提是**它只对粗召回返回的候选池重新打分排序**，不会去处理候选池之外的文档。如果正确文档在粗召回阶段就没有进入 Top-N 候选，Reranker 根本没有机会看到它，自然无法把它排进最终结果——\"Reranker 提升的是排序准不准，不是能不能找到\"。所以 Reranker 天生就不负责扩大召回，它只在候选池内部重新排序。","keyPoints":["**前提限制**：Reranker 只对粗召回返回的候选池重新打分排序，不处理候选池之外的文档","**原因**：若正确文档在粗召回阶段就没进入 Top-N 候选，Reranker 根本没机会看到它，自然无法排进最终结果","**结论**：Reranker 提升的是排序准不准，不是能不能找到，它天生不负责扩大召回"],"code":[],"followUp":["这些知识点之间是怎么串联起来、构成一条完整链路的？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g63_q4","qnum":4,"qtext":"如果只能给 RAG 系统加一招优化，应该优先加哪个？为什么？","answer":{"oral":"**判断依据**：不是看单一效果好不好，而是综合\"实现成本\"和\"适用场景覆盖面\"——混合检索是四招里唯一\"零额外模型调用成本、收益覆盖面最广\"的选择。","keyPoints":["混合检索的实现成本最低，不需要额外的模型调用，只加一路 BM25 索引，几乎不增加延迟","混合检索的覆盖面也最广，任何知识库都可能出现专有名词或型号类查询","Reranker 紧随其后，只要粗召回质量过得去，几乎总能提升排序质量，且成本可控","HyDE 和查询改写需要额外的 LLM 调用，带来更高延迟和成本，只在特定场景（文体差异大、多轮模糊问题）才划算"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}},{"id":"g63_q5","qnum":5,"qtext":"混合检索、Reranker、HyDE、查询改写这几种优化手段都用上之后，检索质量依然不达标，接下来该往哪个方向排查？","answer":{"oral":"**原因**：混合检索、Reranker、HyDE、查询改写都是在\"检索方式\"和\"查询质量\"层面做优化，如果底层的 Chunk 切分本身就把语义切碎了，或者 Embedding 模型对当前领域的文本理解本身就有偏差，再怎么优化检索策略也无法弥补这些更底层的问题——这是排查优先级从\"检索层\"下沉到\"数据/模型层\"的信号。","keyPoints":["先检查 Chunk 切分策略：切分粒度是否合适，是否在语义边界被截断","再检查 Embedding 模型选型：模型是否适合当前领域的文本类型，比如中文或垂直领域术语"],"code":[],"followUp":["这些知识点之间是怎么串联起来、构成一条完整链路的？"],"pitfalls":["容易只描述做了什么，说不出设计取舍和可以改进的地方。"]}},{"id":"g63_q6","qnum":6,"qtext":"RAG 检索中，“正确文档能在候选池里找到但排在 Top-K 之外”和“用户问题措辞口语化、知识库文档正式文体差异很大”这两种症状，分别对应什么优化手段和优先级？为什么优先级不同？","answer":{"oral":"正确文档能在候选池里找到、但排在 Top-K 之外，对应的手段是 Reranker，优先级高，属于默认标配；用户问题措辞口语化、和知识库文档的正式文体差异很大，对应的手段是 HyDE，优先级中等，属于按信号引入。 **优先级不同的原因**：Reranker 只要粗召回质量过得去，几乎总能带来排序质量提升，且只对候选池（几十条）打分，成本可控，属于\"默认标配\"；HyDE 需要一次额外的 LLM 生成调用，延迟和成本明显更高，只有在\"问题和文档文体差异大\"这个明确信号出现时才划算，属于\"按信号引入\"而非无脑加上。","keyPoints":["**排在 Top-K 之外 → Reranker**：优先级高，属于默认标配","**文体差异大 → HyDE**：优先级中等，属于按信号引入","**Reranker 优先级高的原因**：只要粗召回质量过得去几乎总能提升排序质量，且只对候选池（几十条）打分，成本可控","**HyDE 优先级中等的原因**：需要一次额外 LLM 生成调用，延迟和成本明显更高，只有问题和文档文体差异大这个明确信号出现时才划算"],"code":[],"followUp":["这里面你认为最关键的设计点是什么？能展开讲讲吗？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}},{"id":"g63_q7","qnum":7,"qtext":"判断“该不该优先加某个 RAG 优化手段”时，为什么不能只看效果好不好，还要看哪些维度？混合检索、Reranker、HyDE、查询改写在这些维度上的对比是怎样的？","answer":{"oral":"判断优先级要看两个维度，一个是实现成本，一个是适用场景覆盖面。先说混合检索，也就是 BM25 加 RRF，它是本地库，不需要额外调模型，成本最低，几乎不增加延迟，而且覆盖面很广——几乎所有知识库都会遇到专有名词或者编号类的查询。Reranker 成本中等，得部署或者调用一次 Cross-Encoder，延迟也是中等，因为只处理一小批候选，覆盖面同样广，只要候选池里有正确文档它就能提升排序。HyDE 也是中等成本，但要多打一次 LLM 生成调用，延迟明显更高，覆盖面就窄很多，只有问题和文档文体差异大的场景才划算。查询改写或者多查询也是中等成本，但可能要打两到四次额外的 LLM 调用，延迟同样偏高，覆盖面算中等，主要看模糊问题占的比例有多少。 **原因**：只看\"效果好不好\"会让人误以为\"多加一招总没坏处\"，但每一招都有实实在在的延迟和成本代价，只有把\"成本\"和\"覆盖面\"放在一起权衡，才能得出\"混合检索该默认加，HyDE 该按需加\"这样具体可执行的优先级结论。","keyPoints":["**两个判断维度**：实现成本和适用场景覆盖面，不能只看效果好不好","**混合检索（BM25+RRF）**：本地库不需要调模型，成本最低几乎不增加延迟，覆盖面广（几乎所有知识库都会遇到专有名词/编号类查询）","**Reranker**：成本和延迟中等（只处理一小批候选），覆盖面广，只要候选池里有正确文档就能提升排序","**HyDE / 查询改写多查询**：都要多打一到四次额外 LLM 调用，延迟明显更高，覆盖面较窄或中等，取决于对应场景占比"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}},{"id":"g63_q8","qnum":8,"qtext":"为什么不建议把混合检索、Reranker、HyDE、查询改写这几种优化手段同时加上再看效果，而要先判断问题类型再针对性选择？","answer":{"oral":"选型表的使用方法明确指出：遇到检索质量问题时，应该先用 2.1 节的判断方法确定是\"召回不到\"还是\"排序不准\"，再对照选型表选择对应手段——**而不是把四招同时加上再看效果**，那样即使整体效果变好了，也说不清究竟是哪一招起了作用，无法把这次改动的收益归因到具体手段上，下次遇到类似问题时也无法复用这次的经验判断该加哪一招。这和持续评估强调的\"每次改动都要能精确说明改进了什么\"是同一套工程方法论。","keyPoints":["**正确做法**：先用判断方法确定是\"召回不到\"还是\"排序不准\"，再对照选型表选择对应手段","**同时加的问题**：即使整体效果变好，也说不清究竟是哪一招起了作用，无法把改动收益归因到具体手段","**长期影响**：下次遇到类似问题时也无法复用这次的经验判断该加哪一招","**方法论呼应**：这和持续评估强调的\"每次改动都要能精确说明改进了什么\"是同一套工程方法论"],"code":[],"followUp":["如果让你重新设计这部分，你会做哪些不一样的取舍？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}}]},{"name":"RAG 评估","questions":[{"id":"g64_q1","qnum":1,"qtext":"为什么\"感觉答得不错\"这种主观评估不足以支撑 RAG 系统的持续迭代？","answer":{"oral":"RAGAS 用另一个 LLM 作为\"评判者\"（LLM-as-judge），针对问题、答案、检索上下文的关系自动计算量化分数，把\"感觉\"替换成\"可复现、可对比、可追踪\"的数字指标。","keyPoints":["主观判断不可复现：不同人甚至同一个人心情不同，对同一个回答的判断可能不一致","无法量化对比：调整了 Prompt 或 Chunk 参数后，说不清具体好了多少","无法追踪回归：没有历史指标基线，无法自动判断某次改动是否引入了新问题"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g64_q2","qnum":2,"qtext":"RAGAS 的四个核心指标分别衡量什么？","answer":{"oral":"RAGAS 的四个核心指标分为生成和检索两个环节：生成环节包括 Faithfulness（忠实度），衡量答案里的论断是否都能在检索上下文里找到依据、而非编造；以及 Answer Relevancy（答案相关性），衡量答案是否切题回应了问题。检索环节包括 Context Precision（上下文精度），衡量检索结果里排序靠前的内容是否都相关；以及 Context Recall（上下文召回率），衡量检索结果是否覆盖了回答所需的全部信息。","keyPoints":["**Faithfulness（忠实度）**：衡量答案里的论断是否都能在检索上下文里找到依据，而非编造","**Answer Relevancy（答案相关性）**：衡量答案是否切题回应了问题","**Context Precision（上下文精度）**：衡量检索结果里排序靠前的内容是否都相关","**Context Recall（上下文召回率）**：衡量检索结果是否覆盖了回答所需的全部信息"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g64_q3","qnum":3,"qtext":"忠实度（Faithfulness）和答案相关性（Answer Relevancy）有什么区别？一个答案可能出现\"忠实度高但相关性低\"吗？","answer":{"oral":"区别：Faithfulness 检查答案是否\"编造了上下文之外的内容\"，Answer Relevancy 检查答案是否\"切题回应了问题\"——两者都是评估生成阶段，但关注的角度不同：一个管\"真不真实\"，一个管\"对不对题\"。 这说明\"内容真实\"和\"回答切题\"是两个独立的维度，缺一不可。","keyPoints":["举例：问题是退货运费谁承担","模型给出的答案泛泛而谈公司重视用户体验、参考行业标准","如果这段话每一句都能在检索到的上下文里找到依据，没有编造内容，Faithfulness 会打高分","但这段话根本没有正面回答运费由谁承担，所以 Answer Relevancy 会打低分"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g64_q4","qnum":4,"qtext":"上下文精度（Context Precision）和上下文召回率（Context Recall）分别评估检索的哪个方面？为什么只有 Context Recall 需要标注 ground_truth？","answer":{"oral":"**为什么 Context Recall 需要 ground_truth**：它的计算方式是把标注好的标准答案拆解成多个信息点，逐一检查每个信息点能否在检索到的上下文里找到对应内容——没有标准答案，就无法知道\"应该覆盖哪些信息点\"，自然无法计算覆盖率。而 Faithfulness/Answer Relevancy/Context Precision 都是基于\"问题-答案-上下文\"三者内部的关系计算，不需要额外的标准答案。","keyPoints":["Context Precision 评估检索结果的排序质量：靠前位置命中相关内容的比例，类似精排准不准","Context Recall 评估检索结果的覆盖率：是否覆盖了标准答案所需的全部信息点，类似召回全不全"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g64_q5","qnum":5,"qtext":"跑完 RAGAS 评估后，发现检索环节两个指标明显偏低，接下来应该往哪个方向排查？","answer":{"oral":"应该回到混合检索、重排序、HyDE、查询改写这些检索优化手段里针对性排查，而不是继续调 Prompt（那是生成环节的事）： **核心原则**：RAGAS 报表明确指出问题出在检索还是生成后，直接对照\"RAG 优化手段选型表\"（召回不到 → 混合检索 / 查询改写 / HyDE；排序不准 → Reranker）选择对应手段，不需要凭感觉从头排查——量化指标和优化手段选型表配合使用，形成\"发现问题→定位环节→选择手段\"的完整闭环。","keyPoints":["如果 Context Precision 偏低，说明排序不准，应该检查是否需要引入或优化 Reranker","如果 Context Recall 偏低，说明覆盖不全，应该检查是否需要混合检索来补上精确匹配缺口","或者通过查询改写、多查询来扩大覆盖角度","或者用 HyDE 来缩小语义鸿沟"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g64_q6","qnum":6,"qtext":"Faithfulness 指标的计算思路是什么？为什么要先把答案拆解成多个独立论断（claim）？","answer":{"oral":"**计算思路**：把答案拆解成多个独立的论断（claim），逐一检查每个论断能否被检索上下文支撑，最终分数是\"能被支撑的论断数 / 总论断数\"。拆解成独立论断而不是整体判断\"这段话对不对\"，是因为一段答案里往往真假掺杂（部分论断有依据、部分是编造），只有拆到论断粒度才能精确量化\"编造了多大比例\"，而不是简单给整段话打一个\"对\"或\"错\"的二元判断。","keyPoints":["举例：问题是退货运费谁承担，检索到的上下文写明因质量问题退货运费由卖家承担","模型给出的答案除了说运费由卖家承担外，还多说了一句退货有效期为30天","这句30天在上下文里没有出现，属于模型编造出来的幻觉内容"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g64_q7","qnum":7,"qtext":"Context Precision 和 Context Recall 的计算思路分别是什么？和 Faithfulness 的计算方式有什么共同点？","answer":{"oral":"**共同点**：四个指标本质上都遵循同一套\"LLM-as-judge\"方法论——先把评估对象（答案/检索结果/标准答案）拆解成更细粒度的单元（论断/检索位置/信息点），再逐一用 LLM 判断每个单元是否满足条件，最后汇总成一个 0-1 之间的比例分数，而不是让 LLM 直接对整体打一个笼统的分数——细粒度拆解是 RAGAS 能给出可复现、可解释指标的关键。","keyPoints":["Context Precision 的计算思路类似 Reranker 评估：检查每个检索位置上的内容是否相关，越靠前命中相关内容分数越高","Context Recall 的计算思路：把标注好的标准答案拆解成多个信息点，逐一检查每个信息点能否在检索到的上下文里找到对应内容","最终分数等于能找到对应内容的信息点数，除以标准答案总信息点数"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g65_q1","qnum":8,"qtext":"“跑一次评估”和“持续评估”有什么区别？评估集能带来哪三个价值？","answer":{"oral":"区别体现在三个维度上：测试用例方面，跑一次评估用的是临时凑的几条，持续评估用的是固定沉淀的几十条、覆盖多类场景；运行方式方面，前者是手动跑一次看结果，后者是可重复运行的脚本、每次改动后都能跑；结果记录方面，前者看完就丢，后者有基准报表、每次运行都能和基准对比。","keyPoints":["基准对比：能说清楚这次改动让某项指标从0.65提升到0.78，而不是感觉好像好一点","回归检测：改动后重跑评估，能第一时间发现某类 case 分数突然下降","持续追踪：随着新的低分 case 被采集，评估集本身也持续扩充，越来越贴近真实问题"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g65_q2","qnum":9,"qtext":"评估集的三元组结构里，为什么要加\"标准引用来源\"这个字段，而不是只有问题和标准答案？","answer":{"oral":"**原因**：只有\"问题+标准答案\"只能验证生成结果的语义是否正确，无法验证检索环节是否命中了正确的来源文档。加上 `ground_truth_sources` 后，即使系统给出的答案表述方式不同但内容正确，也能通过检查\"是否命中了正确的来源文档\"来独立验证检索环节的准确性——这让评估能分别定位到检索和生成两个环节，而不是只看最终答案的笼统对错。","keyPoints":["在 EvalCase 数据类里，除了 question 和 ground_truth_answer 外，额外定义了 ground_truth_sources 字段","该字段是一个字符串列表，用来存放标准答案实际引用的来源文档","评估时可以拿系统检索到的来源和这个字段比对，单独验证检索环节是否命中了正确的来源文档","这样就能把检索环节和生成环节的评估分开，而不是只看最终答案的笼统对错"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g65_q3","qnum":10,"qtext":"20 条评估问题为什么要覆盖 answerable/boundary/out_of_scope 三类，只测 answerable 会有什么问题？","answer":{"oral":"**只测 answerable 的问题**：会让评估集看起来分数很高（因为都是知识库覆盖得比较好的简单场景），但掩盖了系统在边界情况和拒答场景下的真实短板——这是\"只跑几个顺利 case 就以为系统很好\"的常见误区，真实用户提问远不止 answerable 这一类。","keyPoints":["answerable（能回答）类问题验证正常场景下的检索和生成质量","boundary（边界情况）类问题验证信息不完整时系统是否稳健，不臆造也不遗漏","out_of_scope（超出范围）类问题验证无资料拒答机制是否生效"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g65_q4","qnum":11,"qtext":"为什么 out_of_scope 类问题不适合用标准的 RAGAS 四指标评估？应该用什么替代？","answer":{"oral":"RAGAS 四指标（尤其 Context Recall）依赖标注好的标准答案和标准来源，但 out_of_scope 类问题**本身就没有\"标准答案\"**——知识库里根本不包含相关信息，评估的核心也不是\"答案内容准不准确\"，而是\"系统有没有老实说不知道\"。 这是对\"无资料拒答\"机制的量化验证，和 RAGAS 四指标共同构成完整的评估报表。","keyPoints":["先定义一份拒答关键词列表 REFUSAL_KEYWORDS，包含不支持、没有相关信息、无法回答等表述","is_refusal_response 函数接收模型给出的答案文本","用 any() 遍历关键词列表，检查其中任意一个关键词是否出现在答案里","只要命中一个关键词就判定这条回答是拒答，返回 True，否则返回 False"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g65_q5","qnum":12,"qtext":"评估集应该是一次性写完就固定不变，还是持续演进的？演进的机制是什么？","answer":{"oral":"应该是**持续演进**的。演进机制是把用户反馈追踪发现的真实失败 case 持续转化成新的评估用例： **原因**：一次性写完的 20 条评估用例永远只能覆盖开发者当初设想的场景，而生产环境里用户的真实提问模式会不断暴露新的失败案例——把这些真实失败 case 持续吸收进评估集，才能让评估集越来越贴近真实使用中的问题分布，而不是停留在\"自己觉得应该测什么\"的主观假设上。","keyPoints":["build_eval_case_from_feedback 函数接收一条反馈追踪里记录的低分 case 字典","用该记录里的 trace_id 拼出一个新的 case_id，前缀标记为 regression","把记录里的 user_input 作为新用例的 question","ground_truth_answer 和 ground_truth_sources 先留空，标记需要人工补充标注","category 默认归为 answerable，最终返回一个新的 EvalCase 对象"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g65_q6","qnum":13,"qtext":"评估脚本里，为什么要把可回答类（answerable + boundary）和超出范围类（out_of_scope）问题分开评估？","answer":{"oral":"**原因**：这是因为 answerable 和 boundary 这两类问题，知识库里本来就有真实答案，可以用标注好的 `ground_truth_answer` 和 `ground_truth_sources`，走 RAGAS 那四个指标。但 out_of_scope 这类问题不一样，它压根没有\"标准答案\"——知识库里根本不包含相关信息，这时候评估的核心是\"系统有没有老实拒答\"，而不是\"答案内容准不准\"。RAGAS 的四个指标，尤其是依赖 ground_truth 的 Context Recall，在这种场景下根本算不出来，所以必须用单独的 `evaluate_refusal()` 来评估。","keyPoints":["run_full_evaluation 接收 RAG 系统和整个评估集","先用 answerable 和 boundary 两类有标准答案的 case 构建 RAGAS 评估用的数据集","调用 evaluate，传入 faithfulness、answer_relevancy、context_precision、context_recall 四个指标算出 RAGAS 分数","再单独用 evaluate_refusal 对 out_of_scope 这类没有标准答案的 case 计算拒答准确率"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g65_q7","qnum":14,"qtext":"基准报表的版本管理原则是什么？为什么要给每个基准文件打版本标签，而不是每次运行都覆盖同一个文件？","answer":{"oral":"**版本管理原则**：每次做了一轮明确的优化（比如接入了混合检索），跑完评估后把这次的报表存成一个新的基准文件，用版本标签命名（如 `baseline_v2_hybrid_retrieval.json`），下次改动后和最近的基准对比。如果每次都覆盖同一个文件，就无法追溯\"某个具体指标是在哪一次改动之后开始下降/提升的\"，一旦出现回归也无法定位是哪次改动引入的问题——版本化保存是让\"回归检测\"和\"追溯改动\"这两个持续评估的核心价值真正落地的前提。","keyPoints":["save_baseline 函数接收本次评估报表 report、版本标签 version_tag，以及基准文件存放目录","用版本标签拼出带版本号的文件名，比如 baseline_v2_hybrid_retrieval.json","把报表写入这个带版本号的独立文件，而不是每次都覆盖同一个文件"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}}]},{"name":"Agentic RAG","questions":[{"id":"g67_q1","qnum":1,"qtext":"传统 RAG 和 Agentic RAG 的核心区别是什么？","answer":{"oral":"核心区别在于**检索是否可以被自主判断和重试**——传统 RAG 把检索当作一个机械的固定步骤，Agentic RAG 把检索变成 Agent 可以自主决策的环节：检索结果不好时，有机会换个角度再查一次，而不是被迫在不相关资料上勉强生成或直接拒答。","keyPoints":["传统 RAG 里检索固定只发生一次，不管结果好坏都直接送去生成","Agentic RAG 先 retrieve 检索，再用 grade_docs 判断检索结果是否相关","如果判断不合格就触发 rewrite_query 重写查询，再重新 retrieve 一次","只有判断合格之后才进入 generate 生成答案"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g67_q2","qnum":2,"qtext":"Agentic RAG 的 LangGraph 图里，grade_docs 节点判断的是什么？为什么不能只看\"有没有检索到文档\"？","answer":{"oral":"`grade_docs` 判断的是\"检索到的文档内容能不能支撑回答这个具体问题\"，而不是简单看\"检索到了几篇文档\"： **原因**：即使检索到了 5 篇文档，如果内容都不相关（比如检索系统\"凑数\"返回了排名靠后的无关结果），这些文档对回答问题毫无帮助，应该判定为不合格触发重试——\"有没有检索到\"和\"检索到的内容有没有用\"是两回事，只看数量会漏掉\"检索到但全不相关\"这种情况。","keyPoints":["grade_docs 函数接收当前的 state","把 state 里 retrieved_docs 列表里每篇文档的文本拼接成一整段，用分隔符隔开","把用户问题和拼接好的文档内容一起填进 GRADE_PROMPT 模板，调用 LLM 打分","把 LLM 返回的 JSON 结果解析出来，取出其中的 is_relevant 字段","把 is_relevant 写回 state 返回，作为后续路由判断的依据"],"code":[],"followUp":["如果要支持多语言或者扫描件文档，这里要怎么调整？"],"pitfalls":["容易忽略检索结果为空或不相关时的兜底话术，直接把空结果丢给模型。"]}},{"id":"g67_q3","qnum":3,"qtext":"Agentic RAG 的循环终止条件应该怎么设计？达到重试上限后应该怎么处理？","answer":{"oral":"**达到重试上限后的处理**：不是抛异常终止，而是照样进入 `generate`——因为生成阶段本身已经有\"资料不足则拒答\"的机制，两层设计互相配合：图层面只负责\"给足够的重试机会\"，生成阶段负责\"资料确实不够时诚实拒答\"，不需要在图层面单独处理\"彻底找不到\"的情况。这和 LangGraph 双层终止保护（业务重试上限 + recursion_limit）是同一个设计思路。","keyPoints":["先设定最大重试次数 MAX_RETRY 为 2","route_after_grading 函数读取 state 里的 is_relevant","如果 is_relevant 为真，直接路由到 generate","如果不相关但重试次数已经达到上限，同样路由到 generate，不再重试","如果不相关且还没到重试上限，路由到 rewrite_query 重新改写查询"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}},{"id":"g67_q4","qnum":4,"qtext":"Agentic RAG 的 retrieve 节点内部应该整合哪些检索能力？为什么说这是“框架负责编排，具体能力模块保持独立复用”？","answer":{"oral":"整合了混合检索（向量+BM25+RRF融合）和 Reranker 精排，两阶段检索流程完全不用重新设计。**框架负责编排的含义**：LangGraph 只是把这个已经写好的函数包装成一个 Node，负责决定\"什么时候调用它、调用之后怎么路由\"；检索的具体实现细节（怎么融合、怎么精排）完全在独立的检索模块里开发和验证——编排层和能力模块层解耦，是模块化设计的体现。","keyPoints":["hybrid_retrieve_with_rerank 函数接收查询 query 和最终想要的结果数 top_k","先分别用向量检索和 BM25 检索各取回50条候选结果","用 reciprocal_rank_fusion 把两路结果做倒数排名融合，取融合后排名前50的结果","再用 reranker 对这50条结果做精排，截取最终需要的 top_k 条","返回精排后的结果列表"],"code":[],"followUp":["这个环节的效果怎么量化评估，你会看哪些指标？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g67_q5","qnum":5,"qtext":"整合前后跑 RAGAS 评估，为什么检索环节指标的提升幅度明显大于生成环节指标？","answer":{"oral":"**原因**：这类整合主要是升级检索方式（混合检索+Reranker+Agentic重试），并没有改动生成阶段的 Prompt，所以检索两个指标（Context Precision/Recall）的提升是**直接效果**；生成两个指标（Faithfulness/Answer Relevancy）也有提升，但这是**间接效果**——喂给模型的资料更准确、更全了，模型自然更容易给出忠实且切题的答案，生成 Prompt 本身没有变化。这个对比清楚地说明了\"检索质量提升会连带改善生成质量\"这个链路依赖关系。","keyPoints":["Context Precision 从0.68提升到0.79，提升了0.11","Context Recall 从0.62提升到0.81，提升幅度最大，达到0.19","Faithfulness 从0.85提升到0.90，提升了0.05","Answer Relevancy 从0.80提升到0.87，提升了0.07"],"code":[],"followUp":["如果知识库涨到百万级文档，这套方案还能撑住吗？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g67_q6","qnum":6,"qtext":"Agentic RAG 的图状态里，为什么要同时保留原始问题（question）和当前检索词（current_query）两个字段，而不是只用一个？","answer":{"oral":"`question` 存的是用户最初问的那个原始问题，在整张图的执行过程中始终**不变**；`current_query` 是当前这一轮实际拿去检索的查询词，会在 `rewrite_query` 节点里被反复改写。把这两个字段分开的意义在于，`retrieve` 节点每次重试用的都是可能已经改写过的 `current_query`，让检索词越改越准；而 `grade_docs`、`generate` 这些需要判断\"是不是真的回答了用户问题\"的环节，始终能拿到没被污染过的原始 `question` 作为判断基准。要是只用一个字段，改写循环转了几轮之后，就没法追溯用户最初到底想问什么了。","keyPoints":["AgenticRAGState 是一个 TypedDict，定义了图在运行过程中携带的所有状态字段","question 字段存放用户最初提出的原始问题，整个图执行过程中保持不变","current_query 字段存放当前这一轮实际用来检索的查询词，会在 rewrite_query 节点里被反复改写","另外还有 retrieved_docs、is_relevant、retry_count、answer 等字段，分别记录检索结果、相关性判断、重试次数和最终答案"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易切分粒度设得不合理：切太碎丢上下文，切太粗又引入噪音。"]}},{"id":"g67_q7","qnum":7,"qtext":"Agentic RAG 图中，文档评分节点（grade_docs）和评分后的路由函数（route_after_grading）分别是什么角色？为什么评分要做成节点而不是路由函数？","answer":{"oral":"`grade_docs` 承担的职责是判断检索到的文档是否足够回答问题，它是一个**真正执行判断逻辑的节点**；`route_after_grading`（条件边路由函数）承担的职责则是根据 `grade_docs` 的判断结果，决定走 `generate` 还是 `rewrite_query`。 `grade_docs` 是图里真正的一个节点，它会调用 LLM 去执行判断逻辑，并把判断结果 `is_relevant` 写进 State，这次调用和它产出的结果都会被记录在图的执行轨迹里，是可观测、可审计的一步。`route_after_grading` 不一样，它只是条件边的路由函数，单纯读取 State 里已经算好的 `is_relevant` 字段来做分支决策，本身不产生新的状态变更，也不调用模型。把\"产出判断结果\"和\"依据判断结果选边\"拆成两个不同的东西，正是 LangGraph 里的标准分工——节点负责有副作用的状态更新，条件边路由函数只做无副作用的纯读取分支。","keyPoints":["grade_docs 是一个真正的节点函数，接收 state，调用 LLM 执行判断逻辑","它把判断结果 is_relevant 包成字典返回，这个返回值会被写入 state，属于有副作用的状态更新","route_after_grading 是条件边的路由函数，同样接收 state，但只读取 state 里已经算好的 is_relevant 字段","它不调用模型，也不产生新的状态变更，只根据读到的值返回下一步节点的名字字符串，用于纯粹的分支决策"],"code":[],"followUp":["检索出来的内容跟用户问题不相关时，你怎么发现、怎么处理？"],"pitfalls":["容易只盯着召回率，忽略了检索结果本身的相关性排序。"]}}]},{"name":"向量数据库与 Embedding 进阶","questions":[{"id":"g75_q4","qnum":1,"qtext":"向量检索的 HNSW、IVF、PQ 索引分别是什么原理？怎么在召回率、速度和内存之间权衡？","answer":{"oral":"向量检索如果用暴力计算，要和库里每一个向量算相似度，数据量大时太慢，所以用近似最近邻 ANN 索引，用一点点召回率换取巨大的速度提升。HNSW 是分层可导航小世界图，它构建一个多层的图结构，底层包含所有向量，越往上层节点越稀疏，像跳表一样。查询时从最上层的入口点开始，贪心地往离查询向量更近的邻居走，到了局部最优就下降一层继续找，直到最底层。它的优点是召回率高、查询速度快，是目前最常用的索引；缺点是内存占用大，因为要存原始向量加上图的连接关系，构建索引也比较慢，删除数据不太友好。主要参数有 M，每个节点的连接数，和 ef_search，查询时的候选集大小，ef 越大召回越高但越慢。IVF 是倒排文件索引，先用 K-means 把所有向量聚成若干个簇，每个簇有一个中心点；查询时先找出离查询向量最近的 nprobe 个簇，只在这几个簇里搜索。nprobe 越大召回越高、速度越慢。它的内存比 HNSW 小，构建快，但召回率通常低一些。PQ 是乘积量化，是一种压缩方法，把高维向量切成若干段，每段用 K-means 训练一个码本，用码本里最近的那个编号来代替原始的值，一个 768 维的浮点向量可以从 3KB 压缩到几十字节，内存能降低几十倍，代价是精度有损失。实际中常组合使用，比如 IVF_PQ 用于超大规模、内存受限的场景。权衡思路：数据量在千万级以内、内存充足、追求高召回，用 HNSW；数据量上亿、内存是瓶颈，用 IVF 加 PQ 压缩，必要时用原始向量对候选结果重排来弥补精度；小数据量，几万条以内，直接暴力检索就够了，结果最准。","keyPoints":["ANN：以少量召回损失换取大幅速度提升","HNSW：多层图，自顶向下贪心搜索；召回高、速度快，内存大；参数 M、ef_search","IVF：K-means 聚簇，只搜最近 nprobe 个簇；内存小、构建快、召回略低","PQ：向量分段 + 码本量化压缩，内存降数十倍，精度有损；常与 IVF 组合","选型：千万级内存足用 HNSW；亿级内存受限用 IVF_PQ + 重排；小数据暴力检索"],"code":[],"followUp":["HNSW 的 ef_search 参数调大，延迟和召回会怎么变化？"],"pitfalls":["数据只有几千条也上复杂的 ANN 索引并调参。"]}},{"id":"g75_q5","qnum":2,"qtext":"Milvus、Qdrant、Chroma、pgvector、Pinecone 这些向量数据库怎么选型？元数据过滤要注意什么？","answer":{"oral":"我会从数据规模、运维能力、功能需求和现有技术栈几个方面来选。Chroma 非常轻量，可以嵌入在 Python 进程里，几行代码就能用，适合原型开发、本地测试和小规模的数据，不太适合高并发的生产环境。pgvector 是 PostgreSQL 的扩展，如果团队已经在用 PG，数据量在百万到千万级，加个扩展就能用，向量和业务数据在同一个库里，可以直接用 SQL 做关联查询和事务，运维成本最低，非常务实。Qdrant 是用 Rust 写的，性能好、资源占用低，元数据过滤能力很强，部署简单，单机或小集群的生产场景很合适。Milvus 是分布式架构，存储计算分离，支持十亿级向量，支持多种索引类型、GPU 加速和混合检索，适合大规模、高并发的企业级场景，但组件多，运维复杂度最高。Pinecone 是全托管的云服务，不需要运维，开箱即用，但成本较高，数据在第三方，有合规要求的场景需要考虑。另外 Elasticsearch 和 OpenSearch 也支持向量检索，已经有 ES 的团队做混合检索很方便。元数据过滤是生产中很重要的能力，比如按租户、权限、文档类型、时间范围过滤。要注意过滤的时机：后过滤是先做向量检索取 Top-K，再按条件过滤，过滤条件很严格时可能把结果都过滤光了，返回结果不足；前过滤是先按条件筛选再在子集里检索，结果准确，但如果过滤后的子集很小，图索引的效率会下降。好的向量库会在检索过程中同时应用过滤，比如 Qdrant 的可过滤 HNSW。还要给经常用于过滤的字段建立 payload 索引；多租户场景优先用分区或者独立 collection 来隔离，而不是只依赖过滤条件。","keyPoints":["Chroma：轻量嵌入式，适合原型与小规模","pgvector：已有 PG 时首选，向量与业务数据同库、可 SQL 关联，运维成本低","Qdrant：Rust 实现、性能好、过滤强；Milvus：分布式十亿级、功能全但运维重；Pinecone：全托管、成本与合规考量","过滤时机：后过滤可能结果不足；前过滤准确但小子集影响索引效率；检索中过滤最佳","过滤字段建 payload 索引；多租户用分区或独立 collection 隔离"],"code":[],"followUp":["向量数据库里的数据如何和源数据保持同步？"],"pitfalls":["只做后过滤，导致带权限条件的查询经常返回不足 Top-K 的结果。"]}},{"id":"g75_q6","qnum":3,"qtext":"中文场景下 Embedding 模型怎么选型和评测？向量维度对效果和存储成本有什么影响？","answer":{"oral":"选型时我会先看公开榜单，比如 MTEB 和它的中文版 C-MTEB，重点看检索 Retrieval 这一项的分数，而不是总分，因为 RAG 主要用的是检索能力。中文场景常用的有：BGE 系列，比如 bge-large-zh 和多语言的 bge-m3，m3 同时支持稠密向量、稀疏向量和多向量，支持 8192 长度的输入，开源可本地部署，用得非常多；还有 GTE、M3E、Jina 等开源模型；API 方面有 OpenAI 的 text-embedding-3、通义、智谱等厂商的 Embedding 服务。除了效果，还要考虑：最大输入长度是否满足你的切块大小；是否需要私有化部署；推理速度和成本；是否支持多语言或中英混合。但榜单只是参考，最终一定要用自己的业务数据评测，因为通用榜单和垂直领域的表现可能差别很大。做法是构建一个评测集，包含几十到几百个真实的用户问题，每个问题标注出应该被检索到的相关文档片段，然后用不同的 Embedding 模型分别建索引检索，计算 Hit Rate@K、MRR、NDCG 这些指标，对比选出最好的。维度方面，维度越高能表达的语义信息越丰富，但收益是递减的；而存储和计算成本是线性增长的，比如 1 亿条 1024 维的 float32 向量就要大约 400GB 内存，检索时的相似度计算量也随维度增加。现在一些模型支持 Matryoshka 表示学习，可以截断使用前面的维度，比如把 3072 维截到 1024 维，效果损失很小但成本大幅下降；也可以对向量做量化，比如用 int8 或二值化来降低存储。要强调的是，一旦选定了模型，建库和查询必须用同一个模型，换模型就要全量重建索引。","keyPoints":["参考 MTEB / C-MTEB 的 Retrieval 分数而非总分","常用：bge-m3（稠密 + 稀疏 + 多向量、8192 长度）、bge-large-zh、GTE、Jina；API 类厂商服务","考量：最大输入长度、私有化、速度成本、多语言","必须用业务评测集验证：Hit Rate@K、MRR、NDCG","维度收益递减、成本线性增长；Matryoshka 截断、int8 / 二值量化；换模型需全量重建索引"],"code":[],"followUp":["Embedding 模型的输入长度不够，长文档怎么处理？"],"pitfalls":["只看榜单总分选模型，不在业务数据上评测。"]}},{"id":"g75_q7","qnum":4,"qtext":"对称检索和非对称检索有什么区别？什么时候需要微调 Embedding 模型？怎么微调？","answer":{"oral":"对称检索是查询和文档的形式、长度差不多，比如找相似问题、问题去重、相似商品标题匹配，两边都是短句。非对称检索是查询和文档差异很大，最典型的就是 RAG：查询是一个很短的问题，文档是一段很长的描述性文字，它们在语义空间里的分布不一样，问题和它的答案在字面上可能也没什么重叠。很多 Embedding 模型针对这两种情况有不同的用法，比如 BGE 早期版本要求在查询前面加一句指令前缀“为这个句子生成表示以用于检索相关文章”，而文档那边不加；E5 模型要求查询加 query: 前缀、文档加 passage: 前缀。用错了，比如非对称检索时两边都不加或都加，效果会明显下降，所以一定要仔细看模型的使用说明。什么时候需要微调：通用模型在你的业务领域上效果明显不够好的时候，比如医疗、法律、金融或者公司内部有大量专有术语、缩写、产品型号，通用模型不理解这些词的含义，或者把业务上不相关的东西判断为相似。在微调之前，应该先尝试成本更低的方法，比如混合检索、加 Reranker、查询改写，这些往往就能解决问题。微调的方法：准备训练数据，形式是查询和正例文档的配对，最好还有难负例，也就是看起来相似但实际不相关的文档，难负例对效果提升很关键；数据可以从用户的点击日志、人工标注获得，也可以用大模型根据文档自动生成问题来构造；然后用对比学习的损失函数，比如 MultipleNegativesRankingLoss 进行训练，sentence-transformers 或 FlagEmbedding 都提供了现成的微调脚本，通常几千对高质量数据就有明显提升。微调后要在评测集上和原模型对比，并检查在通用问题上有没有退化，最后记得用新模型重建索引。","keyPoints":["对称：查询与文档形式相近（相似问题）；非对称：短查询对长文档（RAG）","注意模型要求的指令前缀（BGE 查询指令、E5 的 query: / passage:）","微调时机：领域专有术语多、通用模型效果明显不足；先试混合检索、Rerank、查询改写","数据：查询-正例对 + 难负例；来源为点击日志、人工标注、LLM 生成问题","对比学习损失（MNRL），sentence-transformers / FlagEmbedding；评测对比并检查退化，重建索引"],"code":[],"followUp":["难负例怎么挖掘？"],"pitfalls":["非对称检索时忽略模型要求的查询前缀。"]}}]},{"name":"Tool Calling 与工具设计","questions":[{"id":"g23_q1","qnum":1,"qtext":"\"回答问题\"和\"调用工具做事\"的本质区别是什么？","answer":{"oral":"两者可以从四个维度对比：数据来源上，普通对话靠的是训练时冻结的知识，Tool Calling 则是运行时从外部实时获取；是否有副作用上，普通对话没有副作用，只生成文字，Tool Calling 则可能有副作用，可以写数据库、发邮件、调用 API；回答依据上，普通对话依据的是模型的\"记忆\"，Tool Calling 依据的是外部系统返回的确定性结果；数据新鲜度上，普通对话受知识截止日期的限制，Tool Calling 则每次调用都能拿到最新数据。 **直觉类比**：普通对话的模型像一本百科全书（只能告诉你书里写的内容）；Tool Calling 的模型像一个带手机的顾问（可以实时搜索、打电话，告诉你现在的真实情况）。 问\"今天北京天气\"：普通对话只能给出泛泛的季节性描述；Tool Calling 可以调用天气 API 返回今天的实时温度。","keyPoints":["**数据来源**：普通对话靠训练时冻结的知识，Tool Calling 运行时从外部实时获取","**是否有副作用**：普通对话没有副作用只生成文字，Tool Calling 可能有副作用（写数据库、发邮件、调 API）","**依据与新鲜度**：普通对话依据模型“记忆”、受知识截止日期限制，Tool Calling 依据外部系统确定性结果、每次都能拿到最新数据","**类比**：普通对话像一本百科全书（只能讲书里写的内容），Tool Calling 像带手机的顾问（能实时搜索、打电话告诉你真实情况）"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g23_q2","qnum":2,"qtext":"Tool Calling 的完整交互流程是什么？每一步做了什么？","answer":{"oral":"完整流程分五步，横跨两次 API 调用。第一步由你的代码来做，把工具定义，也就是 tools 参数，加上对话历史一起发给模型。第二步由模型来做，判断这次请求是否需要用到工具，如果需要，就返回 tool_calls，而不是直接给出普通的文字回答。第三步又轮到你的代码，负责解析 tool_calls，执行对应的 Python 函数，拿到执行结果。第四步还是你的代码，把工具返回的结果包装成 role 为 tool 的消息，追加进对话历史，再一次发给模型。第五步由模型完成，基于工具返回的结果，生成最终的自然语言回答。 `tool_call_id` 的作用：当模型一次返回多个 `tool_calls` 时，每个工具结果通过 `id` 对应到具体请求，避免混淆。","keyPoints":["拿到模型第一次返回的 message 后，检查 msg.tool_calls 是否存在","如果存在，就遍历每个 tool_calls，用 dispatch 函数按名称调用对应的 Python 函数并传入解析后的参数，得到执行结果","把每个工具的结果包装成 role 为 tool 的消息，并带上对应的 tool_call_id，追加进 messages 里","带着更新后的 messages 再发起第二次 create 调用，让模型基于工具结果生成最终回答","如果一开始就没有 tool_calls，说明模型判断不需要工具，直接把 msg.content 当作回答"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g23_q3","qnum":3,"qtext":"工具定义（Function Schema）中 name、description、parameters 各有什么作用？如何写好 description？","answer":{"oral":"三个字段各有各自的作用：`name` 是模型在 `tool_calls` 里用来标记要调用哪个函数的名字，命名不清晰的话，调试时会难以识别；`description` 是模型判断\"是否该调用这个工具\"的依据，描述模糊会导致模型调错工具或者不调工具；`parameters` 用 JSON Schema 格式告诉模型该传什么参数，约束写得不清楚，模型就容易传错类型或遗漏必填项。 **参数 description 同样重要**：每个参数的 `description` 字段告诉模型如何填写该参数，如 `\"城市名称，例如'北京'、'上海'\"` 比 `\"城市\"` 对模型更有指导意义。","keyPoints":["**name**：模型在 tool_calls 里用来标记要调用哪个函数，命名不清晰会导致调试难以识别","**description**：模型判断“是否该调用这个工具”的依据，描述模糊会导致调错工具或不调工具","**parameters**：用 JSON Schema 告诉模型该传什么参数，约束不清楚会导致模型传错类型或遗漏必填项","**写好 description**：要说明能做什么、返回什么格式、适用边界、不适用场景；参数 description 同样重要，如“城市名称，例如'北京'”比“城市”更有指导意义"],"code":[{"lang":"python","steps":["示例描述先说明工具能做什么：\"获取指定城市的当前实时天气\"","接着说明返回什么格式：\"返回温度（摄氏度）、天气状况和风速\"","然后限定适用边界：\"仅适用于查询当前天气\"","最后说明不适用的场景：\"不支持历史数据和未来预报\"，防止模型滥用这个工具"],"keepCode":"\"获取指定城市的当前实时天气，返回温度（摄氏度）、天气状况和风速。\"\n\"仅适用于查询当前天气，不支持历史数据和未来预报。\""}],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g23_q4","qnum":4,"qtext":"如何从零实现一个最小的 Tool Calling Demo？描述关键代码的设计思路。","answer":{"oral":"最小实现的三个核心设计：**工具注册分离、统一分发器、两次 API 调用**。","keyPoints":["**工具注册与实现分离**：`TOOLS`（Schema）和 `TOOL_FUNCTIONS`（函数）解耦，新增工具只加一行 Schema + 一个函数，主流程零改动","**统一分发器**：把 `if name == \"get_weather\": ...` 的条件分支改成字典映射，可扩展性强，且工具名错误时能统一报错","**`tool_choice=\"auto\"`**：让模型自己判断是否调用工具；`\"none\"` 禁用工具（测试用），`\"required\"` 强制调用（特殊场景）","定义 TOOLS 这个 JSON Schema 列表，描述 get_weather 工具的名称、描述和参数（city 字符串，必填）","单独实现 get_weather 函数，真实场景里会在这里调用外部天气 API","用 TOOL_FUNCTIONS 字典把工具名映射到具体函数，dispatch_tool 根据名字查字典并调用对应函数","chat_with_tools 函数先把用户输入包装成 messages，调用一次 create 并传入 tools 和 tool_choice=\"auto\"，让模型自己判断要不要调用工具","如果 msg.tool_calls 为空就直接返回模型内容；否则遍历 tool_calls，用 dispatch_tool 执行工具并把结果作为 role 为 tool 的消息追加进 messages","带着更新后的 messages 再发起第二次 create 调用，返回模型基于工具结果生成的最终回答"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g24_q1","qnum":5,"qtext":"工具参数设计有哪些核心原则？必填参数和可选参数如何决策？","answer":{"oral":"工具参数不是给人用的，是给 **LLM 填写**的——设计目标是让模型在不需要额外解释的情况下正确填写每个参数。 **四个核心原则**：核心原则大概有四条。第一，参数名一定要自解释，比如 `city` 就比 `c` 好，`user_id` 就比 `uid` 好，最忌讳的反例是参数名叫 `data`、描述也只写\"数据\"两个字，这种命名等于没给模型任何信息。第二，每个参数只传一类信息，比如城市和国家应该拆成两个参数，而不是像 `location: \"中国北京\"` 这样把好几种信息硬塞进一个\"地址\"参数里。第三，参数数量最好控制在 5 个以内，超过了就该考虑拆成多个工具，反面例子就是一个工具塞了 15 个参数，模型填起来根本记不住。第四，可选参数要给个合理的默认值，比如 `unit=\"celsius\"`，不能让模型每次都得手动填一个本来就可以有默认值的可选项。 **必填 vs 可选决策**：工具在没有这个参数时能正常运行 → 可选；不能 → 必填。如果有默认行为，必须在 description 里说明缺省时的行为。 **enum 的作用**：选项型参数用 enum 锁定所有合法值，比只写 description 的限制效果强得多：","keyPoints":["**参数名自解释**：如 city 优于 c、user_id 优于 uid，最忌 data 这种无信息命名","**每个参数只传一类信息**：如城市和国家应拆成两个参数，而非塞进一个 location 里","**数量适中**：参数最好控制在 5 个以内，超过应考虑拆成多个工具","**默认值与决策标准**：可选参数要给合理默认值（如 unit=\"celsius\"）；工具没这个参数也能正常运行就设为可选，否则必填；enum 能把选项型参数的合法值锁定，比只写 description 效果更强"],"code":[{"lang":"python","steps":["弱约束写法只用 description 说明这是温度单位，模型填写时可能给出 celsius、c、摄氏度等不同表达，结果不统一","强约束写法给 unit 参数加上 enum: [\"celsius\", \"fahrenheit\"]，直接把模型能填的值锁定在这两个选项里"],"keepCode":"\"unit\": {\"type\": \"string\", \"enum\": [\"celsius\", \"fahrenheit\"]}"}],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g24_q2","qnum":6,"qtext":"工具函数的返回值应该如何设计才对 LLM\"友好\"？","answer":{"oral":"LLM 会把工具返回值序列化成字符串传入对话，设计原则是**让模型容易理解和引用**。 **summary 的价值**：为复杂数据提供预先整合好的自然语言描述，模型无需自己拼接多个字段，减少幻觉风险。特别是在数据有多个维度时（天气 = 温度 + 天气状况 + 风速 + 湿度），summary 可以帮助模型生成更准确、更流畅的回答。","keyPoints":["**平铺优于嵌套**：模型处理 `result[\"rate\"]` 比 `result[\"data\"][\"exchange\"][\"rate\"]` 更可靠","**包含语义上下文**：数值旁边附上单位和含义","**提供 summary 字段**：预先整合的自然语言描述，模型可以直接引用","不友好的写法用缩写字段名（t、c）、单位不明确的纯数字，并且把风速嵌套在 data.w.speed 这种多层结构里，模型不容易直接引用","友好的写法用完整语义的字段名（temperature_celsius、wind_level），数值直接标出单位，结构保持平铺不做深层嵌套","额外加一个 summary 字段，把所有信息预先整合成一句自然语言描述，模型可以直接引用而不用自己拼接多个字段"],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g24_q3","qnum":7,"qtext":"工具出错时应该返回错误 dict 还是抛异常？两种方式有什么区别？","answer":{"oral":"这里推荐返回错误 dict，而不是直接抛异常，理由可以从几个方面来看。对话流程上，抛异常会把整个流程打断，还得在 dispatch 层专门去捕获它；返回错误 dict 就不会中断流程，错误信息可以直接当作正常内容传给模型。模型能不能感知到也不一样，抛异常的话模型根本看不到发生了什么错误，而返回错误 dict，模型能读到里面的 message，还能据此生成友好的提示。用户体验上差别更大，抛异常搞不好会导致程序崩溃，或者把一堆技术栈信息甩给用户看，返回错误 dict 的话，模型可以顺势解释\"城市名好像不对，您是不是想查……\"这种更人性化的话。所以适用场景也不一样：抛异常更适合程序级的、没法恢复的错误，比如配置错误；返回错误 dict 更适合业务级的、可以解释清楚的错误，比如输入无效、API 超时这些。 当模型接收到 `{\"error\": True, \"message\": \"未找到城市 'Abc' 的天气数据\"}` 时，它可以生成\"抱歉，我没有找到 Abc 的天气数据，请确认城市名称是否正确，或者尝试英文名称\"，而不是让程序崩溃。","keyPoints":["get_weather 函数先检查 city 是否为空字符串，为空就返回 {\"error\": True, \"message\": \"城市名不能为空\"} 这样的错误字典，而不是抛异常","调用 call_api(city) 获取结果，如果返回 None（没找到），同样返回一个带 error 标记和具体说明的字典","只有正常情况下才返回真实的天气数据结果，模型接到错误字典后能读懂 message 并据此向用户解释，而不会导致程序崩溃"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g24_q4","qnum":8,"qtext":"如何验证工具定义（Function Schema）的质量？有哪些常见的规范问题？","answer":{"oral":"工具 Schema 的质量直接影响模型是否能正确判断\"何时调用\"和\"如何填参数\"，上线前应该做系统性检查。 **常见规范问题**：常见的规范问题大概有五类。第一类是 description 写得太短，表现就是不到 20 个字，也缺关键信息，修复方式是把\"这个工具能做什么、适用边界在哪\"补充完整。第二类是参数缺少 description，表现是模型只能靠猜参数名字来理解含义，修复方式是给每个参数都补上 description 和示例。第三类是选项型参数没用 enum，表现是模型可能填出各种不一致的值，修复方式就是加上 `\"enum\": [...]` 把取值范围锁死。第四类是必填参数设得太多，表现是本来可以给默认值、设成可选的参数，也被设成了必填，修复方式是把能有默认值的参数都改成可选。第五类是工具描述之间互相重叠，表现是两个工具功能看起来差不多，模型不知道该选哪个，修复方式是在 description 里把各自的使用边界说清楚。 **实际验证方法**：schema 静态检查之外，还要**实测模型行为**——用 5–10 个不同措辞的问题测试工具能否被正确触发，以及参数填写是否准确。","keyPoints":["定义 validate_tool_schema 函数，接收一个工具的 Schema 字典，用 issues 列表收集发现的问题","取出 function 字段，检查 description 是否存在且长度不小于 20 字，不满足就记入\"description 过短\"的问题","遍历 parameters.properties 里的每个参数，检查是否有 description 字段，没有的就记入\"参数缺少 description\"的问题","最后返回收集到的所有问题列表"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g24_q5","qnum":9,"qtext":"如何从零设计一个可被 LLM 调用的工具库？描述模块结构和关键设计决策。","answer":{"oral":"核心设计原则：**工具实现与 Schema 定义同文件、统一分发器、工具可独立测试**。","keyPoints":["**Schema 与实现同文件**：`WEATHER_TOOL_SCHEMA` 和 `get_weather` 在同一个文件里，避免修改函数参数时忘记同步 Schema，减少\"Schema 和实现不一致\"的 bug","**统一分发器 + 注册表**：`TOOL_REGISTRY` 字典替代 `if/elif` 条件分支，新增工具只加一行注册，不改主流程；工具名不存在时统一报错","**工具必须能独立运行**：每个工具文件的 `if __name__ == \"__main__\"` 块可以直接运行测试，不依赖 LLM 环境——这是发现参数设计问题的最快方式，在接入模型之前就能排除大部分问题","__init__.py 汇总所有工具的 Schema 和统一分发器","weather.py、exchange_rate.py、knowledge_base.py 各自实现对应的函数和它自己的工具 Schema，Schema 和实现放在同一个文件里","tests/test_tools.py 给每个工具写独立测试，覆盖正常路径和错误路径","从各个工具模块分别导入函数和对应的 Schema","把所有 Schema 收集进 ALL_TOOLS 列表，供 API 调用时传给 tools 参数","用 TOOL_REGISTRY 字典把工具名映射到对应的函数，代替 if/elif 的条件分支","dispatch 函数根据名称查 TOOL_REGISTRY，找不到就返回未知工具的错误字典，找到了就调用对应函数并传入参数"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g26_q1","qnum":10,"qtext":"tool_choice 参数的 auto / none / required 三种模式有什么区别？各适用于什么场景？","answer":{"oral":"`tool_choice` 控制模型在收到工具列表后的决策行为，三种模式对应三种不同的强制程度：`\"auto\"`（默认）让模型自主判断是否调用工具，需要时返回 `tool_calls`，不需要时直接回答，适合通用对话助手这种用户可能问任何问题的场景；`\"none\"` 会禁用所有工具，即使注册了工具也不会调用，只用训练知识回答，适合做基线测试（对比有无工具时的回答质量）；`\"required\"` 则强制模型必须调用至少一个工具，不允许直接文字回答，适合信息抽取流水线这种需要保证每条输入都走工具路径的场景。 适用于批量抽取（强制每条数据都调用 `extract_info`）或测试特定工具的参数填写是否正确。 **生产环境默认用 `\"auto\"`**，它最符合用户期望：该触发时触发，不该触发时直接回答。","keyPoints":["**auto（默认）**：模型自主判断是否调用工具，需要时返回 tool_calls，适合通用对话助手","**none**：禁用所有工具，只用训练知识回答，适合做基线测试（对比有无工具时的回答质量）","**required**：强制模型必须调用至少一个工具，不允许直接文字回答，适合信息抽取流水线（保证每条数据都走工具路径）或测试参数填写","**生产环境默认用 auto**：最符合用户期望，该触发时触发，不该触发时直接回答"],"code":[{"lang":"python","steps":["把 tool_choice 设置为一个 dict，type 字段为 function","dict 里嵌套 function 字段，指定 name 为 get_weather","这样强制模型必须调用 get_weather 这个工具，具体参数仍由模型自动填写"],"keepCode":"tool_choice={\"type\": \"function\", \"function\": {\"name\": \"get_weather\"}}"}],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g26_q2","qnum":11,"qtext":"模型决定是否调用工具的依据是什么？哪些因素会影响触发稳定性？","answer":{"oral":"模型决定要不要触发工具，主要基于三个维度：第一是用户意图和工具能力的匹配度，比如问\"今天北京天气\"配 get_weather 就是高匹配、会触发，问\"Python 是什么\"配 get_weather 就是无匹配、不会触发；第二是工具 description 写得清不清楚，只写\"获取数据\"这种模糊描述，模型不知道什么时候该用、触发边界就不稳定，但写成\"获取指定城市的当前实时天气，仅适用于当前天气查询，不支持历史天气\"这种清晰描述，模型就能准确判断边界；第三是模型对自身知识的自信程度，像\"GIL 是什么\"这种基础知识问题模型会直接回答，但\"今天天气\"这种实时状态问题模型会倾向于调用工具。提高触发稳定性的方法主要有三条：优化 description，明确写清楚\"适用于...\"和\"不适用于...\"的边界；加一条 System Prompt 指导；再就是把 temperature 设成 0，降低随机性，让触发行为更一致。","keyPoints":["**用户意图与工具能力的匹配度**：用户问\"今天北京天气\" + `get_weather` → 高匹配 → 触发；问\"Python 是什么\" + `get_weather` → 无匹配 → 不触发","**工具 description 的清晰程度**：","**模型对自身知识的自信度**：基础知识问题（\"GIL 是什么\"）模型直接回答；实时状态问题（\"今天天气\"）倾向调用工具","优化 description：在 description 中明确\"适用于...\"和\"不适用于...\"的边界","添加 System Prompt 指导：`\"当用户询问任何当前天气时，必须先调用 get_weather 工具\"`","设置 `temperature=0`：降低随机性，让触发行为更一致","用一个模糊的工具描述\"获取数据\"举例，说明模型不知道什么时候该用，触发边界会不稳定","换成清晰的描述\"获取指定城市的当前实时天气，仅适用于当前天气查询，不支持历史天气\"","这样模型就能准确判断触发边界，比如\"北京历史最冷温度\"不会触发，而\"今天北京天气\"会触发"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g26_q3","qnum":12,"qtext":"工具调用的完整 Demo 应该包含哪些要素？如何添加日志和耗时统计？","answer":{"oral":"一个生产级 Demo 需要覆盖完整的\"决策 → 执行 → 回答\"闭环，并且可观测： 日志的核心价值：在调试时能清楚看到\"模型有没有调工具、调了哪个工具、工具返回了什么、最终回答是什么\"，不需要逐行 print。","keyPoints":["工具定义（Schema）和执行函数分离，通过注册表（`TOOL_REGISTRY`）关联","两次 API 调用结构：第一次决策（是否调用工具），第二次生成（基于工具结果回答）","分发器处理工具执行，统一处理未知工具和参数错误","工具错误时返回错误 dict 而不是抛异常，让模型生成友好提示","定义 logger = logging.getLogger(__name__) 用于记录日志","第一次调用 API 前用 time.monotonic() 打点，调用 client.chat.completions.create 让模型决策是否要用工具","如果返回消息没有 tool_calls，直接记录耗时并返回模型回答，流程结束","如果有 tool_calls，先记录调用了几个工具及第一次调用的耗时","遍历 tool_calls，对每个工具单独打点，调用 TOOL_REGISTRY 里对应函数执行，记录工具名、参数、返回结果摘要和耗时","第二次调用 API 生成基于工具结果的最终回答，同样打点并记录耗时日志"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g26_q4","qnum":13,"qtext":"多轮对话中为什么不能把 tool_calls 消息从历史里删掉？","answer":{"oral":"因为 `tool_calls` 消息（`role: assistant`）和 `tool` 消息（`role: tool`）是一对强绑定的记录——`tool` 消息里的 `tool_call_id` 必须和对应 `assistant` 消息里的 `tc.id` 一致，模型用这个 ID 配对\"哪个工具结果对应哪次调用\"。","keyPoints":["如果只保留最终 `assistant` 回答（删掉 `tool_calls` 和 `tool` 消息），下一轮模型不知道第 1 轮是通过工具获取了实时天气，可能会认为\"北京晴，22°C\"是模型自己的判断，而非真实数据，导致第 2 轮误用","API 层面：如果删掉 `tool_calls` 但保留 `tool` 消息（`tool_call_id` 找不到对应的 `assistant` 消息），API 会直接报错","展示一段完整的多轮对话消息历史","其中 assistant 消息里带 tool_calls，包含一个 id（例如 call_abc）","紧跟着的 tool 消息里带 tool_call_id，同样是 call_abc，两者通过这个 id 一一对应","后面才是 assistant 根据工具结果生成的最终自然语言回答","强调这两条消息（带 tool_calls 的 assistant 消息和对应的 tool 结果消息）不能被删除，否则 id 配对关系会断裂"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g26_q5","qnum":14,"qtext":"如何从零实现一个支持多轮对话、带日志记录的单工具调用完整 Demo？描述关键设计决策。","answer":{"oral":"核心设计：**共享消息历史 + 日志记录每步 + 错误返回 dict + 工具注册表解耦**。","keyPoints":["**`history` 跨轮共享**：函数返回更新后的 `history`，由调用方持有并传入下一轮，实现多轮记忆","**`tool_calls` 完整入历史**：直接 `history.append(msg)`，保留 `tool_calls` 原始对象，防止 `tool_call_id` 对不上","**`TOOL_REGISTRY` 字典分发**：比 `if/elif` 可扩展，新增工具只加一行注册","**工具错误返回 dict**：未知工具返回 `{\"error\": True, ...}`，让模型生成用户友好的提示而不是程序崩溃","**`temperature=0`**：两次调用都设 0，保证触发行为和最终回答的一致性，方便测试","定义 SYSTEM_PROMPT 和 TOOL_REGISTRY 字典，把工具名映射到对应的执行函数","chat 函数接收 user_input 和可选的 history，如果 history 为空则初始化一个只含 system 消息的列表","把用户输入追加进 history，调用一次 API（temperature=0）让模型决策要不要用工具","如果没有 tool_calls，直接把回答加入 history 并返回","否则把带 tool_calls 的 assistant 消息原样整体加入 history，遍历每个 tool_calls，用 TOOL_REGISTRY.get 找到对应函数执行（找不到就退回一个返回错误 dict 的默认函数），再把结果包成 role 为 tool 的消息加入 history","再调用一次 API 生成最终回答并加入 history，返回回答和更新后的 history；最后用一个 for 循环演示连续三轮对话怎么复用同一个 history"],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g72_q1","qnum":15,"qtext":"Function Calling 中，模型是怎么决定调用哪个工具、传什么参数的？应用侧完整的调用流程是怎样的？","answer":{"oral":"首先要明确，模型本身不会执行任何函数，它只是根据上下文生成一个结构化的“调用意图”。应用把可用工具的定义，包括名称、描述、参数的 JSON Schema，随请求一起发给模型；模型在训练阶段专门学过工具调用的格式，它会结合用户的问题和每个工具的描述，判断是否需要调用工具、调用哪个，然后按照参数的 Schema 生成参数，返回一个 tool_call，里面有工具名和 JSON 格式的参数。所以工具的名称和描述写得清不清楚，直接决定了模型能不能选对。应用侧的完整流程是：第一步，带着工具定义发起请求；第二步，检查返回结果，如果 finish_reason 是 tool_calls，就解析出工具名和参数；第三步，校验参数，用 Pydantic 或 JSON Schema 校验类型和必填项，做权限检查；第四步，执行对应的函数；第五步，把执行结果作为一条 role 为 tool 的消息，带上对应的 tool_call_id，追加到消息历史里；第六步，再次调用模型，模型根据工具结果生成最终回答，或者决定继续调用别的工具。这个循环一直进行到模型不再请求工具为止。可以通过 tool_choice 参数控制行为：auto 让模型自己决定，required 强制必须调用某个工具，也可以指定调用特定工具，或者 none 禁止调用。还可以开启 strict 模式，让模型生成的参数严格符合 Schema。","keyPoints":["模型不执行函数，只生成结构化调用意图（tool_call）","决策依据：用户问题 + 工具名称、描述、参数 Schema","流程：带工具请求 → 解析 tool_calls → 参数校验与鉴权 → 执行 → tool 消息回填（tool_call_id）→ 再调用","循环直到模型不再请求工具","tool_choice：auto / required / 指定工具 / none；strict 模式约束参数"],"code":[],"followUp":["模型返回的参数 JSON 格式错误怎么处理？"],"pitfalls":["以为模型会自己去执行函数。","不校验参数就直接执行。"]}},{"id":"g72_q2","qnum":16,"qtext":"什么是并行工具调用？结果怎么合并？什么情况下要关闭并行调用？","answer":{"oral":"并行工具调用是指模型在一次回复里同时返回多个 tool_call，比如用户问“北京、上海、广州今天的天气”，模型一次性返回三个查天气的调用，而不是调一个、等结果、再调下一个。这样能减少模型往返的轮次，降低整体延迟和 Token 消耗。应用侧拿到多个调用后，可以用 asyncio.gather 或者线程池并发执行它们，然后把每个结果作为单独的 tool 消息追加回去，每条消息的 tool_call_id 必须和对应的调用一一匹配，顺序最好和调用顺序一致，然后一起发给模型，由模型综合所有结果生成回答。要注意的是，某个调用失败不应该让整批都失败，失败的那个返回一个结构化的错误信息就行，让模型知道哪个成功、哪个失败，自己决定是重试还是告诉用户。需要关闭并行调用，也就是设置 parallel_tool_calls 为 false 的情况：一是工具之间有依赖关系，后一个调用需要前一个的结果，比如先查订单号再查物流，并行执行会导致模型去猜参数；二是工具有副作用并且对顺序敏感，比如先扣库存再创建订单，或者同时并发写同一个资源可能产生冲突；三是一些模型在并行模式下参数生成的质量会下降，或者在 strict 结构化模式下不支持并行；四是下游接口有严格的限流，并发调用容易触发限流。","keyPoints":["一次回复返回多个 tool_call，减少往返轮次，降低延迟","应用侧并发执行（asyncio.gather），结果按 tool_call_id 一一回填","单个失败返回结构化错误，不影响整批","关闭并行：工具间有依赖、有副作用且顺序敏感、质量下降或不兼容 strict、下游限流","通过 parallel_tool_calls=false 控制"],"code":[],"followUp":["多个工具调用中有一个超时了，你会怎么处理？"],"pitfalls":["tool_call_id 对应错误，导致模型把结果张冠李戴。"]}},{"id":"g72_q3","qnum":17,"qtext":"工具数量很多（几十上百个）时，模型容易选错工具，怎么解决？","answer":{"oral":"工具多了会有两个问题：一是所有工具定义都要塞进上下文，Token 成本高；二是工具之间的描述容易相似、重叠，模型很难分辨该用哪个，选错率明显上升。我会从几个方向解决。第一，治理工具本身：合并功能重叠的工具，删掉很少用到的；把工具的名称和描述写得边界清晰，明确说明“什么时候用这个、什么时候不要用这个，应该用另一个”；工具名加上命名空间前缀，比如 order_query、order_cancel、user_query，帮助模型分组理解。第二，动态选择工具：不要每次都把全部工具提供给模型，而是先根据用户的请求筛选出相关的少数几个。可以用工具检索，把每个工具的描述向量化，按用户问题检索出最相关的 Top 5 到 Top 10；也可以先用一个便宜的小模型或者分类器做意图识别，判断属于哪个业务域，再只加载这个域下的工具；还有一种做法是给模型提供一个“搜索工具”的元工具，让它自己按需发现工具。第三，分层架构：用多 Agent，每个子 Agent 只负责一个领域、只持有少量工具，由一个路由或者主 Agent 把任务分发给合适的子 Agent。第四，用评估来驱动，建立一个包含各种用户请求和期望工具的测试集，统计工具选择准确率，针对经常选错的工具对去优化描述。这些手段结合起来，通常能把工具选择的准确率显著提升，同时降低成本。","keyPoints":["问题：Token 成本高 + 工具描述相似导致选错","治理：合并重叠工具、描述写清适用与不适用场景、命名空间前缀","动态选择：工具描述向量检索 Top-K、小模型意图分类、按需发现工具的元工具","分层：多 Agent，每个子 Agent 只持有少量工具","评估驱动：工具选择准确率测试集，针对易混工具优化描述"],"code":[],"followUp":["工具检索召回不到正确工具怎么办？"],"pitfalls":["把上百个工具一次性全部提供给模型。"]}},{"id":"g72_q4","qnum":18,"qtext":"工具调用失败或者模型传错参数时，应该怎么处理？","answer":{"oral":"工具调用出错分几种情况，处理方式不一样。第一种是模型生成的参数不合法，比如缺少必填字段、类型不对、枚举值不在范围内、日期格式错误。处理办法是在执行之前用 Pydantic 或 JSON Schema 校验，不合法就不执行，而是把具体的校验错误作为工具结果返回给模型，比如“参数 date 格式错误，期望 YYYY-MM-DD，收到 2024/1/5”，模型看到明确的错误信息后通常能在下一轮自己修正。开启 strict 模式能从源头上减少这类问题。第二种是工具执行时的可重试错误，比如网络超时、下游返回 429 限流、5xx 服务错误，这类在工具内部做指数退避重试，对模型透明，重试几次还不行再返回错误。第三种是业务错误，比如订单不存在、余额不足、没有权限，这不是靠重试能解决的，要返回清晰、可操作的错误信息，告诉模型发生了什么、有什么可选的下一步，比如“订单 123 不存在，请向用户确认订单号”，让模型去和用户沟通，而不是返回一个干巴巴的“error”或者一长串异常堆栈。总体原则：工具不要直接抛异常导致整个 Agent 流程崩溃，而是捕获后返回结构化的错误结果；错误信息要面向模型可理解、可行动；要设置重试的次数上限，同一个工具连续失败多次就停止，避免陷入“调用失败、修改参数、再失败”的死循环，交给降级逻辑或者人工处理；所有失败都要记录日志和链路追踪，方便后续分析哪些工具描述或参数设计需要改进。","keyPoints":["参数不合法：执行前 Schema / Pydantic 校验，返回具体错误让模型自我修正；strict 模式预防","临时错误（超时、429、5xx）：工具内部指数退避重试","业务错误：返回清晰可操作的信息，引导模型下一步","不抛异常导致流程崩溃，统一返回结构化错误","限制重试上限防死循环；记录日志与链路以改进工具设计"],"code":[],"followUp":["错误信息里应该包含异常堆栈吗？为什么？"],"pitfalls":["把原始异常堆栈直接返回给模型，既浪费 Token 又可能泄露内部信息。"]}},{"id":"g72_q5","qnum":19,"qtext":"怎么设计一个对 LLM 友好的工具？命名、描述、参数和粒度分别有什么讲究？","answer":{"oral":"设计工具时要把模型当成一个聪明但完全不了解你系统的新同事，所有信息只能从工具定义里获取。命名上，用清晰的动词加名词，表达这个工具做什么，比如 search_orders、cancel_order，而不是 process、handle 这种含糊的名字；同一类工具用统一前缀。描述是最重要的部分，要写清楚：这个工具是干什么的、什么时候应该用它、什么时候不该用它而该用别的工具、返回的是什么、有什么限制，比如“只能查询最近 90 天的订单”。参数设计上，尽量扁平，避免多层嵌套的复杂对象；参数名要自解释，比如 user_id 而不是 id；每个参数都写描述，说明格式和示例，比如日期要求 YYYY-MM-DD；能用枚举就用枚举限定取值；必填参数尽量少，非必需的给合理的默认值；不要让模型去填它不可能知道的参数，比如内部的租户 ID、用户 Token，这些应该由应用从会话上下文里注入。粒度方面，原子工具就是做一件事，比如查用户、查订单，组合灵活但模型要调用多次，步骤多了容易出错；复合工具把常见的多步操作封装成一个，比如“查询用户最近一笔订单的物流状态”，调用次数少、更可靠。我的原则是按用户的真实任务来设计，而不是简单地把后端 API 一对一包装成工具，高频的固定流程封装成复合工具，低频的灵活组合用原子工具。返回值也要设计，只返回模型需要的字段，大结果做截断或分页，并给出有意义的标识，而不是一大段原始 JSON。","keyPoints":["命名：动词 + 名词，语义清晰，统一前缀","描述：做什么、何时用、何时不用、返回什么、有何限制","参数：扁平、自解释、带格式说明和示例、枚举、少必填、内部参数由应用注入","粒度：按真实任务设计，高频流程封装复合工具，灵活场景用原子工具","返回值：只返回必要字段，大结果截断分页"],"code":[],"followUp":["怎么验证一个工具的描述写得好不好？"],"pitfalls":["把后端 API 一比一包装成工具，参数里还要求模型填写内部 ID。"]}},{"id":"g72_q6","qnum":20,"qtext":"把一个外部业务 API 封装成 Agent 的工具，要考虑哪些工程问题？鉴权、幂等、限流怎么处理？","answer":{"oral":"我按这几个方面考虑。第一是鉴权和凭证管理：API Key、OAuth Token 这些凭证绝对不能出现在提示词里或者让模型生成，而是由工具的实现代码在调用时从安全的配置或密钥管理服务里读取注入；如果是代表用户操作，要用这个用户自己的授权凭证，比如 OAuth 的用户 Token，而不是一个拥有全部权限的服务账号，这样权限边界天然就是用户本人的权限；Token 过期要能自动刷新。第二是幂等性：Agent 场景下重复调用比普通程序更常见，模型可能因为没看到结果而重复发起调用，网络超时后也会重试。对查询类工具无所谓，但对创建订单、发送消息、转账这类写操作，必须保证幂等，做法是为每次调用生成一个幂等键传给下游，下游据此去重；如果下游不支持，就在工具层自己记录已执行的请求。第三是限流和失败降级：外部 API 一般有调用频率限制，工具层要做客户端限流，遇到 429 按 Retry-After 或指数退避重试，设置超时时间，下游持续不可用时熔断，返回友好的错误信息让模型告诉用户稍后再试。第四是响应结果的裁剪：外部 API 返回的 JSON 往往很大、字段很多，直接塞给模型浪费 Token 还会干扰判断，要在工具层只挑出有用的字段，转换成简洁的结构，必要时把编码值转换成可读的文字。第五是安全：写操作和高风险操作需要人工确认；外部 API 返回的内容属于不可信输入，可能包含间接提示词注入，要做隔离标注。","keyPoints":["鉴权：凭证由代码注入，不进提示词；代表用户时用用户自己的授权 Token","幂等：写操作带幂等键，下游或工具层去重","限流降级：客户端限流、429 退避重试、超时、熔断","结果裁剪：只保留必要字段，转为简洁可读结构","安全：高风险写操作人工确认；返回内容视为不可信输入"],"code":[],"followUp":["如果外部 API 的响应时间很长（比如几分钟），工具应该怎么设计？"],"pitfalls":["把 API Key 写进 System Prompt。"]}},{"id":"g72_q7","qnum":21,"qtext":"让 Agent 执行它自己生成的代码，安全上应该怎么设计？","answer":{"oral":"核心原则是：把模型生成的代码当作完全不可信的代码来对待，因为它可能写错，也可能被提示词注入诱导去做坏事。所以绝对不能在应用服务器本身用 exec、eval 去执行。设计上要做好几层隔离。第一，隔离的执行环境：每次执行或者每个会话使用独立的沙箱，比如 Docker 容器、gVisor、Firecracker 微虚拟机，或者用 E2B 这类专门的代码沙箱服务，执行完就销毁，不同用户之间完全隔离。第二，资源限制：限制 CPU、内存、执行时间、进程数、磁盘写入大小，防止死循环、内存炸弹、fork 炸弹拖垮宿主机。第三，网络隔离：默认禁止访问网络，确有需要的只开放白名单内的域名；特别要禁止访问内网地址和云厂商的元数据服务，防止 SSRF 攻击窃取云凭证。第四，文件系统：只读挂载必要的文件，只给一个临时的工作目录可写，不能访问宿主机的其他目录和任何密钥配置。第五，权限：用非 root 用户运行，去掉不必要的系统能力。第六，审计：记录每一次执行的代码、输入、输出和耗时，便于事后追查。此外，涉及外部影响的操作，比如发邮件、修改数据库，不要让沙箱代码直接去做，而是通过受控的工具接口，并在需要时加入人工确认。最后把执行结果，包括标准输出、错误信息和生成的文件，截断到合理长度后返回给模型，让它能根据报错自我修正代码。","keyPoints":["原则：生成的代码不可信，禁止在宿主机 exec / eval","隔离环境：容器 / gVisor / Firecracker / E2B，用完即毁、会话隔离","资源限制：CPU、内存、时长、进程数、磁盘","网络默认禁止，白名单放行，禁止访问内网和元数据服务（防 SSRF）","只读挂载 + 临时可写目录、非 root、审计日志；外部副作用走受控工具 + 人工确认"],"code":[],"followUp":["沙箱启动太慢影响体验，怎么优化？"],"pitfalls":["在业务服务器上直接用 exec 执行模型生成的 Python 代码。"]}},{"id":"g72_q8","qnum":22,"qtext":"代码解释器适合哪些任务？执行出错后的“生成 - 执行 - 修正”循环怎么设计？","answer":{"oral":"代码解释器最大的价值是让模型借助 Python 生态做那些它自己不擅长的事。适合的任务有：精确计算，大模型直接心算大数乘除、复杂公式很容易出错，写代码算就是精确的；数据分析，用户上传一个 Excel 或 CSV，让它用 pandas 做清洗、统计、分组聚合；数据可视化，用 matplotlib 生成图表；文件格式转换和处理，比如 PDF 拆分、图片处理、批量重命名；还有需要多步试错的探索性任务。不适合的是只需要语言理解和生成的任务，以及对延迟要求极高的场景。执行出错后的修正循环是这么设计的：模型生成代码，在沙箱里执行，把结果返回给模型，结果要包括标准输出、错误输出和完整的异常信息，比如哪一行报了什么错；如果执行出错，模型根据报错信息分析原因并修改代码，再次执行。设计要点有几个：一是错误信息要足够具体，但过长的输出要截断，比如只保留最后几十行，避免撑爆上下文；二是要设置最大重试次数，比如 3 到 5 次，超过了就停止，告诉用户失败的原因，避免无限循环烧 Token；三是会话内保持状态，比如前一步加载的 DataFrame 变量在下一步还能用，不用每次重新读文件，Jupyter 内核式的有状态沙箱就是这个思路；四是对于数据分析类任务，先让模型查看数据的结构，比如前几行和列名，再写处理代码，能大幅减少出错；五是要检测重复的错误，如果连续几次报同样的错，说明模型陷入了死胡同，应该换思路或者终止。","keyPoints":["适合：精确计算、数据分析（pandas）、可视化、文件处理、探索性任务","循环：生成代码 → 沙箱执行 → 回传 stdout / stderr / 异常 → 模型修正 → 再执行","错误信息具体但要截断，避免撑爆上下文","设最大重试次数；检测重复错误及时终止","有状态内核保留变量；先看数据结构再写代码"],"code":[],"followUp":["代码解释器生成的文件怎么安全地返回给用户？"],"pitfalls":["不限制重试次数，模型反复报同一个错一直烧 Token。"]}}]},{"name":"多步工作流","questions":[{"id":"g25_q1","qnum":1,"qtext":"单步工具调用和多步工作流在结构上有什么本质区别？","answer":{"oral":"核心区别是**工具调用次数是否在运行时确定**：具体说来，核心区别在于工具调用的次数是不是在运行时才能确定下来。先看 API 调用次数，单步是固定的 2 次，一次决策一次生成；多步则是 N+1 次，这个 N 完全由模型自己决定要调几次。实现结构上也不一样，单步的写法很简单，就是\"如果有 tool_calls 就执行一次，然后再调一次生成最终回答\"；多步的写法是用一个循环，\"while iteration < max_iter，每轮执行工具调用，如果没有 tool_calls 了就 break 跳出\"。调用链的长度上，单步最多只能调 1 个工具，多步可以从 0 一直调到 max_iter 那么多个。适用的问题类型也不同，单步适合查单一数据源的问题，比如\"北京天气怎么样\"；多步则适合需要综合多个数据源的问题，比如\"我要去上海出差，带 500 美元够不够花，那边天气怎么样\"这种。 单步 = 固定两次 API 调用；多步 = 循环 N+1 次，N 由模型在每一轮的 `tool_calls` 是否为空决定。","keyPoints":["**核心区别**：工具调用次数是否在运行时才能确定","**API 调用次数与结构**：单步固定 2 次（一次决策一次生成）；多步 N+1 次（while 循环，N 由模型每轮 tool_calls 是否为空决定）","**调用链长度与适用场景**：单步最多调 1 个工具，适合查单一数据源（如“北京天气怎么样”）；多步可从 0 调到 max_iter 个，适合综合多个数据源的问题"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g25_q2","qnum":2,"qtext":"多步工作流中的循环应该什么时候退出？有哪些终止条件？","answer":{"oral":"有三种退出条件，**前两种是必须实现的**： **条件 1（正常）：模型不再请求工具** 这是最理想的退出方式，模型自主判断\"我已经有足够信息了\"。 **条件 2（安全）：达到最大迭代次数 `max_iterations`** 防止模型在工具返回错误或 Bug 时无限调用，产生大量 API 费用。 **条件 3（可选）：连续 N 次工具调用均返回错误** 适合对可靠性要求高的生产场景。","keyPoints":["检查模型返回的消息里是否还有 tool_calls","如果没有，说明模型认为已经拿到足够信息，直接把 msg.content 当作最终回答返回，这是循环的正常退出条件","每次工具调用返回错误时就把 consecutive_errors 计数器加 1","如果连续错误次数达到 3 次或以上，就直接返回\"工具暂时不可用，请稍后再试\"，提前终止流程，避免在故障状态下继续无意义地重试"],"code":[{"lang":"python","steps":["用 for 循环执行最多 max_iter 次迭代","如果循环正常执行完所有次数都没有被 break 打断，就会进入 else 分支，说明已经达到最大迭代次数上限","这种情况下调用 force_generate_answer 基于已有信息强制生成一个回答，而不是无限继续下去"],"keepCode":"for iteration in range(max_iter):\n    ...\nelse:\n    # for 循环正常结束（未被 break 打断）= 达到上限\n    return force_generate_answer(messages)"}],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g25_q3","qnum":3,"qtext":"为什么多步工作流必须设置 max_iterations 上限？不设置会有什么风险？","answer":{"oral":"`max_iterations` 是多步工作流的**安全阀**，防止两类问题： **风险 1：模型 Bug 导致无限循环** **风险 2：Token 成本累积超预期** **推荐值**：通用助手 `max_iter=5`；复杂 Agent `max_iter=10`；生产环境根据 `预算 / 单次平均成本` 计算。","keyPoints":["异常场景是工具返回了空结果，模型误以为还需要更多数据从而继续调用，但工具依然返回空，如此循环下去","没有上限时，这种循环会一直持续，直到 API 超时或者账单被耗尽才会停止","设置了上限后，比如到第 6 次迭代就会被强制退出，转而基于已有信息生成一个回答","第 N 次 API 调用时，输入的 Token 数等于前面所有工具调用结果的总和，再加上系统提示和用户输入","随着迭代次数增加，每次调用消耗的 Token 是线性增长的，导致 10 次迭代的总 Token 消耗大约是 1 次的 4 到 5 倍","设置上限之后，就能把最坏情况下的成本控制在一个明确的区间内，避免单次对话成本暴增"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g25_q4","qnum":4,"qtext":"多步工作流的\"可观测性\"指什么？如何实现调用链日志？","answer":{"oral":"可观测性指能从外部看清楚工作流内部每一步发生了什么，包含三个层次： 同时可以把每步记录到 `WorkflowResult.steps`（dataclass），用于：","keyPoints":["**层次 1（基础）**：调用了几次工具、分别是哪些","**层次 2（调试）**：每次调用的入参、出参（能定位\"哪一步出了问题\"）","**层次 3（审计）**：每次调用的耗时、Token 消耗、决策理由","事后分析哪类问题会触发几步工具调用","将调用链展示在 UI 界面上","计算平均工具调用次数，优化 max_iter 设置","用 for 循环遍历 max_iter 次迭代","每次迭代开始时用 logger.info 记录本轮准备调用的工具名列表","内层再对 msg.tool_calls 循环，逐个执行工具","用 time.monotonic() 在调用前后打点，算出每次工具调用的耗时","调用 registry[tc.function.name](**args) 执行工具得到 result","用 logger.info 记录工具名、参数、结果摘要（优先取 result 的 summary 字段，避免日志过长）和耗时"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g25_q5","qnum":5,"qtext":"如何从零实现一个支持多步推理、带调用链记录的工作流 Demo？描述关键设计决策。","answer":{"oral":"核心设计：**while 循环 + max_iter 安全上限 + for-else 强制生成 + WorkflowResult 记录**。","keyPoints":["**for-else 语义**：`for` 循环被 `break` 打断 → 正常退出（不执行 `else`）；循环跑完 → 达上限（执行 `else`），天然区分两种退出路径","**WorkflowResult dataclass**：记录每步 ToolStep，支持事后分析和 UI 展示","**强制生成兜底**：达到上限后不直接报错，而是基于已有历史消息调一次 API 生成尽量有用的回答","**`temperature=0`**：每次决策调用都用 0，保证同一问题的调用顺序可预测、可复现","**工具错误 dict 而非 raise**：工具返回 `{\"error\": True, ...}` 让模型感知并处理，而不是程序崩溃","定义 WorkflowResult dataclass，记录 user_input、final_answer、steps 列表和 terminated_by 状态","run_workflow 函数用 messages 列表维护对话历史，初始包含 system 和 user 消息","用 for 循环最多跑 max_iter 次，每次调用 client.chat.completions.create 让模型决策，temperature 设为 0","如果返回消息没有 tool_calls，说明模型给出了最终答案，记录 terminated_by 为 model_done 并 break 跳出循环","否则把 assistant 消息加入 messages，遍历 tool_calls 逐个执行 TOOL_REGISTRY 里对应的函数，把每步记录进 wf.steps，并把工具结果包成 role 为 tool 的消息加入 messages","如果循环跑满 max_iter 仍未 break（触发 for-else 的 else 分支），标记 terminated_by 为 max_iterations，并基于已有历史再调一次 API 生成兜底回答，最终返回 wf"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}}]},{"name":"Agent 设计模式","questions":[{"id":"g73_q1","qnum":1,"qtext":"Agent 和一次普通的 LLM 调用有什么本质区别？Agent 的循环结构和终止条件是怎样的？","answer":{"oral":"一次普通的 LLM 调用是输入一段文本、输出一段文本，流程是开发者预先写死的，模型只负责其中一步的生成。Agent 的本质区别在于：由模型自己来决定下一步做什么，并且能够通过工具和外部环境交互、观察结果、根据结果调整行动，形成一个闭环，直到完成目标。这个循环通常是：感知，拿到用户目标和当前上下文；推理决策，模型判断是直接回答还是需要调用工具、调用哪个；行动，应用执行模型选择的工具；观察，把工具的执行结果加回上下文；然后回到推理，模型基于新的信息决定下一步。所以控制流是动态的，执行几步、走哪条路径事先都不确定。状态在循环里通过消息历史或者一个显式的状态对象传递，每一轮的工具结果都会累积进去。终止条件非常关键，常见的有：模型认为任务完成，返回了不带工具调用的最终答案，这是正常结束；达到最大迭代次数，比如 10 到 20 轮，这是硬性的安全上限；超过时间或者 Token 成本预算；检测到连续重复相同的动作或者没有进展；遇到需要人工确认的节点而挂起；或者出现不可恢复的错误。没有可靠的终止条件，Agent 就可能陷入死循环、无限消耗成本。正因为 Agent 的不确定性更高、成本和延迟也更大，Anthropic 的建议是：能用固定的工作流解决的问题，就不要用 Agent，只有在步骤无法预先确定的开放性任务上才用 Agent。","keyPoints":["普通调用：流程由开发者写死；Agent：模型自主决定下一步","循环：感知 → 推理决策 → 行动（工具）→ 观察 → 再推理","状态通过消息历史或显式状态对象在循环中累积","终止：给出最终答案、最大迭代次数、时间/成本预算、无进展检测、人工确认挂起、不可恢复错误","能用固定工作流解决就不用 Agent"],"code":[],"followUp":["工作流（Workflow）和 Agent 的边界怎么划分？"],"pitfalls":["只依赖模型自己说“完成了”来终止，没有最大迭代次数兜底。"]}},{"id":"g73_q2","qnum":2,"qtext":"ReAct 模式的原理是什么？和纯 CoT 有什么区别？适合什么场景，有什么缺点？","answer":{"oral":"ReAct 是 Reasoning 加 Acting，把推理和行动交替结合起来。每一轮模型先输出一段 Thought，分析当前的情况、已经知道什么、还缺什么、下一步该做什么；然后输出一个 Action，选择一个工具和参数去执行；应用执行后把结果作为 Observation 返回；模型再基于这个观察进行下一轮的 Thought，如此循环，直到能给出最终答案。和纯 CoT 的关键区别是：CoT 只在模型自己的脑子里推理，所有信息都来自训练数据和给定的上下文，如果它不知道某个事实或者知识过时了，就只能瞎猜，容易产生幻觉，而且一步推错后面全错；ReAct 能在推理过程中主动获取外部信息，用真实的观察结果来校正和推进推理，比如不确定就去搜一下、查一下数据库，所以事实准确性更高，推理过程也更可解释，能看到每一步为什么这么做。现在主流模型都原生支持 Function Calling，所以 ReAct 不再需要用文本格式去解析 Thought 和 Action，而是直接通过工具调用的循环实现，思想是一样的。适合的场景是需要多步信息获取、下一步依赖上一步结果的任务，比如问答检索、排查问题、多跳推理。缺点是：每一步都要调用一次模型，步数多时延迟高、成本高；它是走一步看一步的贪心式决策，缺乏全局规划，复杂任务上容易迷失方向；还容易陷入重复调用同一个工具、来回打转的循环，需要配合最大步数和重复检测。","keyPoints":["Thought → Action → Observation 交替循环，直到给出答案","CoT 仅内部推理，知识缺失易幻觉；ReAct 通过外部观察校正推理","现代实现基于原生 Function Calling 循环","适合多步信息获取、下一步依赖上一步结果的任务","缺点：延迟与成本高、缺乏全局规划、易重复打转"],"code":[],"followUp":["ReAct 和 Plan-and-Execute 怎么选？"],"pitfalls":["说 ReAct 一定比 CoT 好——简单推理任务 CoT 更快更省。"]}},{"id":"g73_q3","qnum":3,"qtext":"Plan-and-Execute 模式是怎样的？任务分解和依赖排序怎么做？和 ReAct 相比各适合什么场景？","answer":{"oral":"Plan-and-Execute 把规划和执行分开。先由一个规划器，通常用能力强的大模型，根据用户目标一次性生成一个完整的计划，也就是一个有序的步骤列表；然后由执行器按计划逐步执行，每一步可以是一次工具调用，也可以是一个小的 ReAct 子 Agent；执行过程中或者执行完后，可以根据结果对计划做调整。任务分解时，我会要求规划器输出结构化的计划，比如 JSON，每个步骤包含编号、描述、要用的工具、期望的产出，以及依赖哪些前置步骤。有了依赖关系就形成一个有向无环图，可以做拓扑排序，没有依赖关系的步骤可以并行执行，大幅缩短总耗时，LLMCompiler 就是这个思路。后面步骤需要用到前面步骤的结果时，可以用占位符引用，执行时再替换成实际的值。和 ReAct 对比：Plan-and-Execute 的优势是有全局视角，对于步骤多、结构清晰的复杂任务更不容易迷失；只有规划阶段需要用大模型，执行可以交给便宜的小模型，成本更低；计划本身可以展示给用户确认，可控性和可解释性更好；还能并行执行。劣势是计划是基于开始时的信息做的，如果环境变化大、或者中间结果出乎预料，原计划可能就不适用了，需要重规划，灵活性不如 ReAct。所以任务目标明确、步骤可以预先拆分的，比如写一份调研报告、批量数据处理，适合 Plan-and-Execute；高度依赖探索、下一步完全取决于上一步观察结果的，比如排查一个未知的线上故障，ReAct 更合适。实践中常常组合使用，外层规划，每一步内部用 ReAct 执行。","keyPoints":["规划器一次生成完整计划，执行器逐步执行（可为子 ReAct）","结构化计划：步骤、工具、期望产出、依赖 → DAG 拓扑排序，无依赖步骤并行","优势：全局视角、规划用大模型执行用小模型、计划可审阅、可并行","劣势：环境变化或结果意外时需重规划，灵活性不如 ReAct","目标明确可拆分用 Plan-and-Execute；探索性任务用 ReAct；常组合使用"],"code":[],"followUp":["规划器生成的计划质量不高怎么办？"],"pitfalls":["计划生成后一成不变，执行失败也不调整。"]}},{"id":"g73_q4","qnum":4,"qtext":"Plan-and-Execute 中，计划执行到一半发现走不通怎么办？什么时候触发重规划（Replan）？","answer":{"oral":"要在执行器和规划器之间加一个重规划的环节。执行每一步，或者每完成一批步骤后，把原始目标、原计划、已经完成的步骤和它们的结果、以及当前遇到的问题，一起交给规划器，让它判断：是继续按原计划执行剩下的步骤，还是修改后续计划，还是任务已经完成可以直接给出答案，还是确实无法完成应该终止。触发重规划的条件主要有：某一步执行失败，并且重试几次后仍然失败，比如工具一直报错、需要的数据不存在；某一步的结果和预期不符，比如计划里假设能查到一个用户，结果查出来是多个，原来的后续步骤就不适用了；获得了新的信息，使得原计划不是最优的，比如发现一个工具能直接完成后面三步；用户中途修改了需求或补充了信息。重规划时要注意几点：已经成功完成的步骤要保留结果，不要重复执行，尤其是有副作用的写操作，必须保证幂等或者跳过；把失败的原因明确告诉规划器，让它避开同样的路径，而不是生成一个换汤不换药的计划；要限制重规划的次数，比如最多 3 次，防止在不可能完成的任务上反复规划浪费成本；如果确实走不通，要能优雅地终止，向用户说明已经完成了什么、卡在了哪里、需要用户提供什么，或者转人工处理，而不是给出一个似是而非的结果。LangGraph 里通常用一个 replan 节点加条件边来实现这个流程。","keyPoints":["加入重规划环节：输入目标、原计划、已完成步骤与结果、当前问题","决策：继续 / 修改后续计划 / 已完成 / 终止","触发：步骤重试后仍失败、结果与预期不符、发现更优路径、用户修改需求","保留已完成结果，副作用操作不重复执行；告知失败原因避免重蹈覆辙","限制重规划次数；走不通时说明进展并转人工；LangGraph 用 replan 节点 + 条件边"],"code":[],"followUp":["重规划时如何避免已执行的写操作被重复执行？"],"pitfalls":["失败后从头重新规划并重新执行所有步骤。"]}},{"id":"g73_q5","qnum":5,"qtext":"Reflection（反思与自我修正）模式怎么实现？什么场景收益最大？成本怎么控制？","answer":{"oral":"Reflection 的基本思想是生成、批评、修正的迭代。先让模型生成一个初版结果；然后让模型以批评者的视角去审查这个结果，找出错误、遗漏和可以改进的地方，输出具体的修改意见；再把原结果和意见一起交给模型生成修订版；重复这个过程，直到批评者认为没有问题了，或者达到最大轮数。实现上，批评环节最好用独立的提示词，甚至用不同的模型，并给出明确的评判标准，比如一份检查清单，否则模型很容易对自己的结果“自我感觉良好”。更有效的做法是引入外部反馈，而不是只靠模型自省，比如生成代码后真的去运行单元测试，把报错信息作为反馈；生成 SQL 后去执行看有没有语法错误；生成 JSON 后用 Schema 校验。有客观信号的反思比纯主观反思可靠得多。还有一种进阶做法是 Reflexion，把每次失败的反思总结存进记忆，下次遇到类似任务时作为经验参考，避免犯同样的错。收益最大的场景是：代码生成，有测试做反馈，效果提升非常显著；有明确评判标准的写作和翻译；复杂的推理和规划任务；结构化输出要满足严格格式的任务。对于简单问答、闲聊这类，收益很小。成本控制方面：每多一轮反思，至少多两次模型调用，延迟和费用成倍增长，所以要设置最大迭代次数，一般两到三轮就够了，收益会快速递减；设置提前退出条件，比如测试全部通过或评分达标就停止；批评环节可以用便宜的小模型；只对重要的、高价值的任务启用反思，或者只在首次结果没通过校验时才触发。","keyPoints":["生成 → 批评（独立提示词 / 模型 + 检查清单）→ 修正，迭代至达标或到上限","外部客观反馈更可靠：运行测试、执行 SQL、Schema 校验","Reflexion：把失败反思存入记忆，跨任务复用经验","收益大：代码生成、有明确标准的写作翻译、复杂推理、严格格式输出","成本控制：最多 2~3 轮、达标提前退出、批评用小模型、按需触发"],"code":[],"followUp":["模型给自己打分总是偏高，怎么解决？"],"pitfalls":["没有外部信号，让同一个模型用同一个提示词自我评价。"]}},{"id":"g73_q6","qnum":6,"qtext":"评估-优化器（Evaluator-Optimizer）模式是什么？和 Reflection 有什么区别？迭代终止条件怎么设计？","answer":{"oral":"评估-优化器是 Anthropic 在构建有效 Agent 一文里总结的工作流模式之一：一个 LLM 作为生成者负责产出结果，另一个 LLM 作为评估者，根据明确的标准对结果打分并给出反馈，生成者根据反馈改进，循环往复。它的关键是两个角色分离，并且评估标准是显式定义的，比如翻译任务的评估维度包括准确性、流畅度、术语一致性，每个维度有评分细则；评估者的输出最好是结构化的，比如每个维度的分数、是否通过、具体的修改建议。和 Reflection 的区别：两者思想很接近，都是生成后评估再改进。Reflection 更多是指模型对自己的输出进行反思，往往是同一个模型、同一个上下文里的自我批评，评价标准可能比较隐式；评估-优化器更强调角色和职责的分离，评估者是独立的组件，有自己的提示词甚至不同的模型，带着明确的评分标准，更像是一个质检员，更客观，也更容易单独调优和复用。可以理解为评估-优化器是 Reflection 的一种更工程化、更结构化的实现。适合的场景是有清晰评估标准、并且迭代反馈能带来明显改进的任务，比如文学翻译、营销文案、代码审查后修改、复杂的搜索需要多轮判断信息是否足够。终止条件要设计好：评分达到阈值，或者所有维度都通过；达到最大迭代次数；连续两轮分数没有提升甚至下降，说明已经收敛或者陷入振荡，应该停止并返回历史最好的那一版，而不是最后一版；还要设置成本预算上限。","keyPoints":["生成者 + 评估者两个角色，评估标准显式定义，反馈结构化","与 Reflection：思想相近；本模式强调角色分离、独立提示词或模型、明确评分标准","适合标准清晰且迭代可带来提升的任务：翻译、文案、代码修改、多轮搜索","终止：评分达标、最大迭代次数、连续无提升（返回历史最佳版本）、成本上限","评估者可单独调优和复用"],"code":[],"followUp":["评估者本身不可靠怎么办？怎么验证评估者？"],"pitfalls":["迭代结束后返回最后一版而不是得分最高的一版。"]}},{"id":"g73_q7","qnum":7,"qtext":"什么时候用路由模式？意图路由怎么实现？路由错了怎么兜底？","answer":{"oral":"路由模式适合输入类型差异很大、不同类型最好用不同方式处理的场景。比如客服系统里，查订单、退款申请、技术问题、闲聊投诉，各自需要不同的提示词、不同的工具、甚至不同的模型，如果全塞到一个大提示词里，不同类型的指令会互相干扰，效果反而都变差。路由就是先对输入做分类，再分发给专门处理这一类的下游流程，让每个分支可以独立优化。另一个典型用法是按难度路由模型，简单问题给便宜快速的小模型，复杂问题给大模型，降低整体成本。实现方式有几种：规则和关键词匹配，最快最便宜，但覆盖不全；用小模型或者 Embedding 加分类器做意图识别，速度快、成本低；用 LLM 做分类，让它输出结构化的类别和置信度，最灵活。生产中常常组合使用，先规则，再小模型，不确定时再用大模型。路由错了的兜底策略：第一，设置置信度阈值，低于阈值的不要硬分，进入一个通用处理分支，或者向用户追问澄清意图；第二，一定要有默认路径，任何没匹配上的请求都有地方去，不能直接报错；第三，下游分支发现自己处理不了时，能把请求退回给路由器重新分发，或者转给通用 Agent；第四，对按难度路由的场景，小模型的回答如果没通过质量校验，就升级到大模型重试；第五，记录每次路由的决策和最终结果，用来持续评估路由准确率，把错分的样本加进训练或者提示词示例里不断优化。","keyPoints":["适用：输入类型差异大、需不同提示词/工具/模型；按难度路由降本","实现：规则关键词 → 小模型 / Embedding 分类 → LLM 结构化分类（可组合）","兜底：置信度阈值 + 澄清追问、默认路径","下游可退回重新路由；小模型回答未通过校验升级大模型","记录路由决策评估准确率，错分样本持续优化"],"code":[],"followUp":["路由器本身的准确率怎么评估？"],"pitfalls":["没有默认分支，未识别的意图直接报错。"]}},{"id":"g73_q8","qnum":8,"qtext":"Agent 陷入死循环有哪些表现？怎么检测和防止？","answer":{"oral":"常见的表现有：反复调用同一个工具、传同样的参数，比如一直搜同一个关键词；在两三个动作之间来回切换，比如打开文件、关闭文件、再打开；工具一直报错，模型不断微调参数重试却始终失败；看起来每一步都在做事，但任务进度没有任何推进；还有多 Agent 之间互相推诿，A 把任务交给 B，B 又交回给 A。防护要多层叠加。第一层是硬限制：设置最大迭代次数或最大工具调用次数，这是最后的保险，超过就强制终止；LangGraph 里有 recursion_limit。第二层是重复动作检测：对每一次工具调用计算一个指纹，比如工具名加上规范化后的参数做哈希，维护一个最近调用的滑动窗口，发现同一个指纹出现超过阈值，比如 3 次，就判定为重复，同时检测 A-B-A-B 这种周期性的模式。第三层是进度停滞检测：判断最近几步有没有产生新的信息，比如工具结果和之前完全一样，或者状态没有任何变化；也可以每隔几步让模型或者一个评估器判断一下任务是否有进展。第四层是资源熔断：设置单次任务的总耗时上限和 Token、费用预算，超出就停止。检测到循环后的处理不应该只是粗暴地报错退出，可以先往上下文里注入一条提示，告诉模型“你已经用相同参数调用了 3 次 search，结果没有变化，请换一种方法或者直接基于现有信息回答”，给它一次自我纠正的机会；仍然不行再终止，把已经收集到的部分结果和失败原因返回给用户，或者转人工。所有触发的情况都要记录下来，用于分析是工具设计问题还是提示词问题。","keyPoints":["表现：同参数重复调用、动作来回切换、报错后反复微调重试、无进展、多 Agent 互踢","硬限制：最大迭代 / 工具调用次数（LangGraph recursion_limit）","指纹检测：工具名 + 规范化参数哈希，滑动窗口计数，识别周期模式","停滞检测 + 时间与 Token / 费用熔断","处理：先注入提示让模型纠正，再终止并返回部分结果或转人工，记录分析"],"code":[],"followUp":["多 Agent 之间的循环和单 Agent 内的循环检测有什么不同？"],"pitfalls":["只设置最大迭代次数，循环一直跑到上限才停，白白浪费成本。"]}},{"id":"g71_q5","qnum":9,"qtext":"GUI Agent（如 Computer Use）是怎么通过截图操作界面的？有哪些难点？","answer":{"oral":"GUI Agent 的基本循环是：截取当前屏幕的截图，连同任务目标一起发给多模态模型，模型理解截图里有哪些界面元素、当前处于什么状态，决定下一步动作，比如点击某个坐标、输入一段文字、滚动、按快捷键，程序执行这个动作，然后再截图，进入下一轮，直到任务完成。元素定位有两种思路：一种是纯视觉，模型直接输出要点击的像素坐标，通用性最好，任何界面都能操作；另一种是结合结构化信息，比如网页的 DOM 树、可访问性树，给每个可交互元素编号，模型只需要说点击几号元素，准确率更高、Token 更省，但依赖于能拿到这些结构信息。难点主要有：一是定位精度，小按钮、密集的列表、相似的图标容易点错位置；二是效率和成本，每一步都要传一张截图，一个任务可能要几十步，延迟和费用都很高；三是状态判断，页面加载慢、弹窗、动画会让截图和真实状态不一致，模型需要判断操作有没有生效，要加等待和重试；四是错误恢复，点错了之后要能识别并回退；五是安全风险最大，它几乎有用户的全部操作权限，网页上的恶意内容可能诱导它执行危险操作，所以必须在沙箱或者虚拟机里运行，敏感操作比如支付、删除、发送消息前要人工确认，并限制可以访问的网站范围。实际落地中，能用 API 解决的优先用 API，GUI 自动化作为没有接口时的兜底方案。","keyPoints":["循环：截图 → 模型理解并决策 → 执行动作（点击/输入/滚动）→ 再截图","定位：纯视觉坐标（通用）vs DOM / 可访问性树编号（准确省 Token）","难点：定位精度、多步成本与延迟、状态判断与等待、错误恢复","安全：沙箱或虚拟机运行、敏感操作人工确认、限制访问范围","能用 API 优先用 API，GUI 作为兜底"],"code":[],"followUp":["怎么评估一个 GUI Agent 的任务成功率？"],"pitfalls":["在用户真实环境中无限制地运行 GUI Agent。"]}}]},{"name":"Human-in-the-loop","questions":[{"id":"g37_q1","qnum":1,"qtext":"Human-in-the-loop 的三条审核路径分别是什么？各自用什么 LangGraph API 实现？","answer":{"oral":"在 `interrupt_before=[\"call_tools\"]` 暂停之后，一共有三条路径可以走。第一条是**批准**，工具照着原来的参数执行就行，直接调用 `graph.invoke(None, config)` 恢复执行即可，什么都不用改。第二条是**修改参数后批准**，工具还是会执行，但用的是改过的新参数，做法是先调 `graph.update_state(config, {\"messages\": [corrected_ai_msg]})` 把消息修正过来，再调 `graph.invoke(None, config)` 恢复执行。第三条是**拒绝**，工具完全不会被执行，做法是调 `graph.update_state(config, {\"messages\": rejection_msgs}, as_node=\"call_tools\")`，注入一条拒绝消息，然后同样用 `graph.invoke(None, config)` 恢复执行。 三条路径最终都调用 `invoke(None)` 恢复执行，区别在于恢复前是否修改了 State：批准不改、修改参数改了模型消息、拒绝注入了假 ToolMessage 并声明 `as_node`。","keyPoints":["**批准**：直接调用 graph.invoke(None, config) 恢复执行，什么都不改，工具按原参数执行","**修改参数后批准**：先 graph.update_state(config, {\"messages\":[corrected_ai_msg]}) 修正消息，再 invoke(None, config) 恢复，工具用新参数执行","**拒绝**：graph.update_state(config, {\"messages\": rejection_msgs}, as_node=\"call_tools\") 注入拒绝消息，再 invoke(None, config) 恢复，工具完全不会被执行"],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g37_q2","qnum":2,"qtext":"`update_state` 的 `as_node` 参数有什么用？拒绝路径为什么必须传 `as_node=\"call_tools\"`？","answer":{"oral":"`as_node` 告诉 LangGraph：这次 State 更新应该被视为**哪个节点执行完毕后的输出**。LangGraph 用它来确定图的下一步走向。如果不传 `as_node`，图会认为自己仍停在暂停的位置（call_tools 之前），下一步就会继续执行 call_tools；如果传了 `as_node=\"call_tools\"`，图会认为 call_tools 已经执行完毕，于是沿着 call_tools 的出边走向下一个节点 call_model。 拒绝路径的目标是**跳过 call_tools，让模型看到拒绝结果后给用户解释**。如果不传 `as_node`，图仍然会去执行 `call_tools`（我们注入的 ToolMessage 会被 `add_messages` 追加，然后 `call_tools` 再追加真实的工具结果），工具还是会被调用。传了 `as_node=\"call_tools\"` 之后，图认为 `call_tools` 已经跑完了，直接去 `call_model`，拒绝消息就是工具的\"执行结果\"。","keyPoints":["**as_node 作用**：告诉 LangGraph 这次 State 更新应被视为哪个节点执行完毕后的输出，用来确定图的下一步走向","**不传 as_node**：图认为仍停在暂停位置（call_tools 之前），下一步会继续执行 call_tools，工具仍会被调用","**传 as_node=\"call_tools\"**：图认为 call_tools 已执行完毕，直接走向 call_model，注入的拒绝消息就成了工具的\"执行结果\"，从而跳过真正的工具调用"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g37_q3","qnum":3,"qtext":"修改工具参数时，为什么要保持 `AIMessage` 的 `id` 不变？","answer":{"oral":"`add_messages` Reducer 合并消息时遵循这个规则：**相同 `id` 的消息，新消息替换旧消息；不同 `id` 的消息，追加到列表末尾**。 如果用新 `id`，State 里会变成两条 `AIMessage`：原始的（带旧参数的 tool_calls）和新的（带新参数的 tool_calls）。`call_tools` 执行时读最后一条消息，得到新参数，结果看似正确；但原始消息留在历史里，会给模型带来困惑——它会看到一条没有对应 ToolMessage 的\"悬空\"工具调用记录。保持相同 `id` 让更新语义变成\"修正\"而非\"追加\"，History 干净可追溯。","keyPoints":["**add_messages 合并规则**：相同 id 的消息用新消息替换旧消息，不同 id 的消息追加到列表末尾","**用新 id 的后果**：State 里会出现两条 AIMessage，原始消息留在历史里，模型会看到一条没有对应 ToolMessage 的\"悬空\"工具调用记录","**保持相同 id**：让更新语义变成\"修正\"而非\"追加\"，History 保持干净可追溯"],"code":[{"lang":"python","steps":["构造一个新的 corrected_msg，类型是 AIMessage，content 沿用原来的，tool_calls 换成修正后的 corrected_tool_call","关键是把 id 显式设置成 last_ai_msg.id，跟原始消息保持一致","调用 graph.update_state(config, {\"messages\": [corrected_msg]})；因为 id 相同，add_messages Reducer 会用这条新消息替换掉原来的旧消息，而不是追加一条新的"],"keepCode":"corrected_msg = AIMessage(\n    content=last_ai_msg.content,\n    tool_calls=[corrected_tool_call],\n    id=last_ai_msg.id,   # 关键：同 id → 替换而非追加\n)\ngraph.update_state(config, {\"messages\": [corrected_msg]})"}],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g37_q4","qnum":4,"qtext":"哪些操作必须加人工确认？给出判断标准和典型例子。","answer":{"oral":"判断标准是：只要满足以下任意一条就应该加人工确认。第一是不可逆，也就是执行后无法撤销，典型例子是发送邮件、删除文件、提交订单；第二是涉及外部副作用，也就是影响系统边界之外的操作，比如调用第三方 API 写入数据、发布内容；第三是涉及资金，比如支付、转账、退款；第四是涉及隐私数据，比如读取或传输用户个人信息、导出数据；第五是高影响范围，比如批量发通知、批量修改权限。 反例（不需要审核）：查询天气/汇率/搜索结果——只读、无副作用、可重复执行，出错重试即可，不需要人工干预。 **记忆口诀：不可逆、有副作用、涉及钱或隐私、影响范围大——这四类必须加确认。**","keyPoints":["**判断标准（满足任一即需确认）**：不可逆（发邮件、删文件、提交订单）、涉及外部副作用（第三方 API 写入、发布内容）、涉及资金（支付、转账、退款）、涉及隐私数据（读取/传输个人信息、导出数据）、高影响范围（批量发通知、批量改权限）","**反例**：查询天气/汇率/搜索结果只读、无副作用、可重复执行，出错重试即可，不需要人工干预","**记忆口诀**：不可逆、有副作用、涉及钱或隐私、影响范围大——这四类必须加确认"],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g37_q5","qnum":5,"qtext":"生产场景里如何只对高风险工具触发审核，而让低风险工具（如查天气）自动执行？","answer":{"oral":"`interrupt_before=[\"call_tools\"]` 会对所有工具调用暂停，不够精细。 另一种更简洁的实现：把高风险工具拆到独立节点 `call_high_risk_tools`，只对该节点加 `interrupt_before`，低风险工具走 `call_safe_tools` 节点（无中断）。这样图结构上就分离了两类工具的处理路径，审核逻辑和执行逻辑都更清晰。","keyPoints":["定义一个 HIGH_RISK_TOOLS 集合，列出需要人工审核的工具名（send_email、delete_record、process_payment）","在 call_tools_with_filter 函数里，从最新一条消息的 tool_calls 中，按名字是否在 HIGH_RISK_TOOLS 里，分成 safe_calls 和 high_risk_calls 两组","遍历 safe_calls，直接用 tool_registry 找到对应工具并 invoke 执行，把结果包装成 ToolMessage 加入 results","high_risk_calls 不执行，而是原样存入返回字典的 pending_approval 字段，交给后续的人工审核节点处理","最终返回 messages（已执行的安全工具结果）和 pending_approval（待审核的高风险调用）"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g37_q6","qnum":6,"qtext":"测试 Human-in-the-loop 的“拒绝”路径时，怎么验证被拒绝的高风险工具（如发送邮件）确实没有被调用？这种验证方式对系统可靠性有什么启发？","answer":{"oral":"验证方法是看工具函数内部的副作用有没有真正发生。 **关键的验证点在于，路径 C 走完之后，`send_email` 内部那行 `print(f\"📧 [模拟发送]...\")` 应该永远不会出现在控制台里**——只要它打印出来了，就说明拒绝逻辑没生效，工具其实还是被真实调用了。除了盯这行日志，还可以用 `graph.get_state_history(config)` 把路径 C 的全部历史快照打出来，找到注入 `ToolMessage` 的那一步，确认传了 `as_node=\"call_tools\"` 之后，图确实认为 `call_tools` 已经\"执行完\"了——也就是快照里根本没有出现真正跑过 `call_tools` 节点的痕迹。 这个验证方式的启发在于：**审核逻辑对不对，不能只看模型给用户的回复措辞是否\"像是拒绝了\"**——模型完全可能一边正常调用了工具、一边在回复里编造\"已取消\"的说法（幻觉）。必须验证工具函数内部真实的副作用（日志、外部系统状态）有没有发生，这是判断 Human-in-the-loop 拒绝路径是否真正生效的唯一可靠依据，光看最终文本回复是不够的。 **记忆点：判断拒绝路径是否生效，要看工具的真实副作用有没有发生，不能只信模型嘴上说的\"已取消\"。**","keyPoints":["用 @tool 装饰器把 send_email 声明成一个可被模型调用的工具","函数文档字符串说明这是不可逆操作，发送前需要人工确认","函数体内先打印一行模拟发送日志，包含收件人和主题，只有工具被真正调用时这行才会出现","再打印一行正文内容","最后返回一个包含 status、to、subject 的结果字典","调用 reject(config_c) 触发路径 C 的拒绝流程，返回结果存入 result_c","打印 result_c[\"messages\"][-1].content，也就是模型对本轮请求的最终回复","输出显示模型说明邮件发送操作已被取消、邮件未发出"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}}]},{"name":"MCP 协议","questions":[{"id":"g39_q1","qnum":1,"qtext":"MCP 是什么？它解决了工具集成的哪个核心问题？\"USB-C 类比\"的准确性体现在哪里？","answer":{"oral":"MCP（Model Context Protocol）是 Anthropic 在 2024 年底发布的开放协议，解决的核心问题是**工具集成的碎片化**：每个 AI 应用各自写一套工具集成代码，工具无法跨应用、跨语言复用。 MCP 的核心主张：把工具（Tools）、数据（Resources）、提示词（Prompts）打包成标准化的 MCP Server，任何遵循 MCP 协议的 AI 应用（MCP Client）都可以发现并使用，不受编程语言限制。 碎片化的典型表现：\"查数据库\"工具被十个团队各自实现十份——MCP 把它做成一个标准化的独立进程服务，十个团队的 AI 应用都\"连接\"它而不是各自\"复制\"它。","keyPoints":["**USB-C 统一了设备 ↔ 充电器接口**：任何 USB-C 设备都能用任何 USB-C 充电器，不需要专属充电器","**MCP 统一了 AI 应用 ↔ 工具服务器接口**：任何 MCP Client 都能连接任何 MCP Server，工具开发者写一次，所有 AI 应用可用"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g39_q2","qnum":2,"qtext":"MCP 的三种核心能力（Tools / Resources / Prompts）各自是什么？三者在\"副作用\"上有何本质区别？","answer":{"oral":"Tools 的方向是 Client 调用、Server 执行，由模型决策触发，典型用途是搜索、查数据库、发邮件、执行操作这类会产生动作的场景；Resources 的方向是 Client 主动拉取，由 Client 主动请求触发，典型用途是读文档、读实时指标、读日历事件；Prompts 的方向是 Client 请求模板，同样由 Client 主动请求触发，典型用途是获取调优好的（可能带参数的）提示词模板。","keyPoints":["**Tools**：可能产生副作用（发邮件会真的发、查数据库会消耗资源、执行代码会改变状态）——模型需要决定\"是否真的要调用\"","**Resources**：通常只读、无副作用（读文件不改变文件，读指标不改变指标）——Client 主动拉取，不需要模型判断","**Prompts**：纯只读、无副作用（请求模板不做任何操作）——适合把调优好的提示词集中管理、跨应用共享"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g39_q3","qnum":3,"qtext":"MCP 和 Function Calling 的定位差异是什么？两者是替代关系还是互补关系？","answer":{"oral":"Function Calling 处在模型 API 层，解决的是模型如何表达\"我要调用哪个工具、传什么参数\"这个问题，由各家 LLM 厂商（OpenAI / Anthropic / DeepSeek）各自定义，不涉及跨语言的问题，工具代码和应用是绑定的，无法复用。MCP 则处在工具服务连接层，解决的是工具服务器如何被标准化发现、跨应用复用的问题，由 Anthropic 定义为开放协议、厂商中立，Server 和 Client 可以用不同语言实现，一个 Server 可以被多个 Client 共享复用。 **互补关系，不是替代关系**。 **MCP 在外层解决\"工具服务怎么被发现和连接\"，Function Calling 在内层解决\"模型怎么表达工具调用意图\"**——两层职责清晰，MCP Server 本质上通过 Function Calling 把工具暴露给模型。","keyPoints":["MCP Client 调用 Server 的 `list_tools()` 拿到工具列表","Client 把工具列表**转成 Function Calling 格式**注册给模型","模型通过 Function Calling 决定调用哪个工具，返回结构化调用请求","Client 把请求转发给 MCP Server 的 `call_tool()` 执行"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g39_q4","qnum":4,"qtext":"MCP Server 做成独立进程而非\"注册函数到应用里\"，带来了哪三个架构收益？","answer":{"oral":"这带来三个架构收益。第一是语言无关，Server 可以用 Python、TypeScript、Go、Rust 任意一种语言来写，Client 完全不关心它的实现语言，所以 Python 写的 AI 应用可以直接连接一个用 Go 写的工具服务器；第二是可复用，一个\"数据库查询 Server\"可以被多个 AI 应用同时连接，不需要每个应用各自再实现一遍；第三是进程隔离，Server 崩溃不会影响到 Client 也就是 AI 应用本身，而且 Server 的系统权限比如文件系统访问权限，和 Client 的权限可以分开控制。 对比应用内手写 `@tool` 函数（工具和应用同进程）： 这个架构决策让 MCP 成为可能：\"写一次工具服务器，全公司 AI 应用共用\"。","keyPoints":["工具绑定在应用里 → 换 AI 应用就要把工具代码复制过去","MCP Server 是独立进程 → AI 应用只需要\"连接\"而不是\"复制\""],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g39_q5","qnum":5,"qtext":"MCP 和 A2A 连接的对象分别是什么？A2A 的 Task 对象、Agent Card、流式状态更新（Push）三个核心概念各自解决什么问题？","answer":{"oral":"MCP 连接的方向是模型（通过 Client）和工具/数据（Server）之间，回答的问题是模型怎么找到并调用外部工具、外部数据怎么被模型读取；A2A 连接的方向是 Agent 和 Agent 之间，回答的问题是一个 Agent 怎么把子任务委派给另一个 Agent、两个 Agent 之间怎么同步任务状态。 类比：MCP 像\"插座标准\"——工具（插头）和 Agent（设备）之间的接口规范；A2A 像\"快递协议\"——Agent 之间怎么\"寄任务\"、\"查进度\"、\"收结果\"。 **记忆点：遇到\"Agent 怎么用工具\"想到 MCP，遇到\"Agent 怎么和另一个 Agent 协作\"想到 A2A。**","keyPoints":["**Task 对象**：任务有明确的生命周期状态（`submitted` → `working` → `completed` / `failed`）","**Agent Card**：每个 Agent 声明自己能做什么（类比 MCP 的 `list_tools`，但声明的是 Agent 的整体能力，不是单个工具）","**流式状态更新（Push）**：委派出去的任务通过 Streaming 推送进度，不需要轮询"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g39_q6","qnum":6,"qtext":"MCP 为什么能在 2024 年底发布后迅速成为 2026 年的事实标准？和早期 ChatGPT Plugin 相比，MCP 成功的关键设计差异是什么？","answer":{"oral":"与 ChatGPT Plugin 的关键差异：ChatGPT Plugin 是闭源的、绑定在 ChatGPT 上，工具定义复杂，也没有解决跨应用复用的问题，是一个失败的先例；MCP 则是开放协议、厂商中立，设计上轻量，从源头上就是开放、轻量、跨语言的，因此解决了跨应用复用的问题。 **记忆点：MCP 成功的关键不是技术多先进，而是\"开放 + 轻量 + 跨语言\"从设计源头解决了 ChatGPT Plugin 没解决的\"跨 AI 应用复用\"问题。**","keyPoints":["**开放协议，厂商中立**：任何 AI 应用都可以实现 MCP Client，任何工具服务都可以实现 MCP Server，不被任何厂商绑定","**生态快速积累**：GitHub、Slack、Google Drive、数据库、浏览器等已经有大量开源 MCP Server 实现，接入后立刻可用","**工具复用解决了真实痛点**：提供了\"写一次工具服务器、全公司 AI 应用共用\"的标准方案","**被主流 AI 应用和框架采纳**：Claude Code、Claude Desktop、Cursor、LangChain、LangGraph 都原生支持"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g39_q7","qnum":7,"qtext":"MCP 架构里的 Host 角色是什么？和 Client、Server 有什么区别？从 Client 启动到执行一次工具调用，完整交互流程有哪几步？","answer":{"oral":"角色划分：MCP Server 的职责是暴露 Tools / Resources / Prompts、响应 Client 的请求，例子是一个运行着\"数据库查询工具\"的独立进程；MCP Client 的职责是发现并调用 Server 的能力、把工具结果传给模型，例子是 Claude Code、自己写的 AI 应用、或者一张 LangGraph 图；Host 是可选角色，职责是管理 Client 的生命周期、处理用户界面，例子是 VS Code 插件、桌面应用。 Host 不直接和 Server 交互，它是 Client 的\"容器\"——比如 VS Code 插件（Host）里跑着一个 MCP Client，真正连接 Server 的是 Client 这一层。 **记忆点：Host 管\"这个 Client 住在哪个应用里\"，Client 管\"怎么和 Server 对话\"，Server 管\"真正干活\"。**","keyPoints":["Client 启动时调用 Server 的 `list_tools()` 拿到工具列表","Client 把工具列表转成 Function Calling 格式注册给模型","模型决定调用某个工具，Client 把请求转发给 Server 的 `call_tool()`","Server 执行工具逻辑，返回结果给 Client，Client 再把结果传给模型"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g40_q1","qnum":8,"qtext":"FastMCP 的 `@mcp.tool()` 装饰器自动做了哪三件事？和手写 JSON Schema 定义工具相比省了哪些工作？","answer":{"oral":"跟手写 JSON Schema 比一比就能看出省了多少事。工具名这块，手写方式得自己写 `\"name\": \"get_weather\"`，FastMCP 直接从函数名读取，不用你操心。参数 Schema 这块，手写方式每个参数的 `type`、`description`、`required` 都得一个个手写，FastMCP 直接从类型提示自动生成。工具描述这块，手写方式要写 `\"description\": \"...\"`，FastMCP 从函数的 docstring 里自动读取。注册这块，手写方式得手动拼一个 `tools=[]` 列表，FastMCP 一个 `@mcp.tool()` 装饰器就自动把注册的事办完了。 省的工作：参数 JSON Schema 全部手写（每个参数 3-5 行）→ 只写类型提示（1 个词）。代码量从每个工具 ~15 行缩减到 ~3 行定义代码。","keyPoints":["**从函数签名（参数名 + 类型提示）生成 JSON Schema**：`city: str` → `{\"type\": \"string\"}`，`amount: int` → `{\"type\": \"integer\"}`，无需手写","**从 docstring 读取工具描述**：docstring 第一行成为工具的 `description`，模型会读这里来判断何时调用——docstring 质量直接决定工具触发准确率","**注册到 Server 实例**：装饰的函数自动加入 `list_tools()` 的响应列表，以及 `call_tool()` 的分发表"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g40_q2","qnum":9,"qtext":"MCP Server 的 stdio transport 是什么？Client 和 Server 的进程关系是怎样的？","answer":{"oral":"stdio transport 是 MCP 默认的通信方式：Client 把 Server 作为**子进程**启动，两者通过操作系统的标准 I/O 管道通信——Client 写入 Server 的 **stdin** 发送请求，读取 Server 的 **stdout** 接收响应，格式是 JSON-RPC 2.0。 **生命周期由 Client 管理**：Client 启动时 spawn Server 子进程，Client 退出时 kill Server 子进程。Server 不需要常驻后台，不需要端口，不需要任何运维操作。 为什么默认用 stdio 而不是 HTTP：本地工具（文件系统、数据库、本地 API）用 stdio 更简单——零配置、无端口、天然进程隔离、无网络攻击面。需要把工具部署为团队共享远程服务时，才切换到 HTTP/SSE transport（`mcp.run(transport=\"sse\")`）。","keyPoints":["MCP Client（比如 Claude Code 进程）通过 fork/spawn 启动 MCP Server 作为子进程","Client 把请求（如 list_tools、call_tool）写入 Server 的 stdin","Server 处理完请求后，把响应（工具列表或调用结果）写到 stdout","Client 从 stdout 读取这些响应，完成一次通信"],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g40_q3","qnum":10,"qtext":"MCP 工具的返回值为什么应该是纯字符串而不是 dict 或 JSON 对象？","answer":{"oral":"MCP Client 收到 `call_tool` 的响应后，把结果包装成 `ToolMessage` 的 `content` 字段传回给模型。模型的输入是自然语言上下文，而不是代码执行环境——它无法\"解构\"一个 dict，只能\"阅读\"文本。 具体原因有三个。第一是模型读自然语言更可靠，比如 `\"上海：多云，26°C，湿度 72%\"` 这样的句子，比 `{\"city\": \"上海\", \"temp\": 26}` 这样的结构更不容易被模型误解；第二是避免序列化歧义，dict 在不同 Client 实现里序列化的方式可能不一样，而纯字符串不存在这个问题；第三是便于最终展示，工具结果通常会直接进入模型的回答，字符串格式能让回答读起来更自然。 例外：如果工具结果需要被**下游代码**处理（而不是仅供模型阅读），可以返回 JSON 字符串（`json.dumps(result)`），但要在 docstring 里说明格式——让模型知道它收到的是 JSON，可以提取字段。","keyPoints":["**模型只读文本**：模型输入是自然语言上下文而非代码执行环境，无法\"解构\"dict，只能\"阅读\"文本","**三个具体原因**：自然语言句子更不容易被模型误解、不同 Client 对 dict 的序列化方式可能不一样会造成歧义、字符串格式便于直接进入最终回答展示","**例外**：若结果需要被下游代码处理而非仅供模型阅读，可返回 JSON 字符串（json.dumps），但要在 docstring 里说明格式让模型知道能提取字段"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g40_q4","qnum":11,"qtext":"`.mcp.json` 的 `command` + `args` 配置具体做了什么？Server 的启动和关闭由谁管理？","answer":{"oral":"这是 Client 启动 Server 子进程的\"配方\"——等价于 Client 在内部执行： 并把这个进程的 stdin/stdout 管道接给自己。 **Server 的启停由 Client（Claude Code）全权管理**，开发者不需要手动启动或关闭 Server——配置好 `.mcp.json` 之后，Client 负责其余一切。","keyPoints":["Claude Code 启动时，读取 `.mcp.json`，对每个 `mcpServers` 条目执行 `command + args` 启动子进程","通过 stdin 发送 `initialize` 握手请求，完成协议协商","发送 `list_tools` 拿到工具列表，注册给 Claude","用户对话触发工具调用时，发送 `call_tool` 请求，等待 stdout 响应","Claude Code 退出时，向子进程发送终止信号，Server 进程随之退出","这一行等价于把 command 和 args 拼接后，在命令行里直接运行的效果","Client 内部就是用这种方式把配置转换成实际要执行的进程命令"],"code":[{"lang":"json","steps":["在 mcpServers 对象里为这个 Server 起一个名字 weather-tools","command 字段指定用什么命令启动这个 Server 进程，这里是 python","args 字段是传给这个命令的参数列表，这里是要运行的脚本路径 tools/weather_mcp_server.py","Client 读取这份配置后，据此拼出完整的启动命令并把它作为子进程启动"],"keepCode":"{\n  \"mcpServers\": {\n    \"weather-tools\": {\n      \"command\": \"python\",\n      \"args\": [\"tools/weather_mcp_server.py\"]\n    }\n  }\n}"}],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g40_q5","qnum":12,"qtext":"从应用内手写 `@tool` 函数，到独立的 MCP Server 工具，架构上的核心变化是什么？什么场景下值得做这个升级？","answer":{"oral":"**架构上最核心的变化，是工具从\"跟应用挤在同一个进程里的函数\"变成了\"独立的进程服务\"。**具体拆开看：运行位置上，手写工具和 AI 应用是同一个 Python 进程，MCP Server 是完全独立的进程，靠 stdio 或者 HTTP 通信。语言上，手写工具必须用和应用相同的语言写，MCP Server 就没这个限制了，只要实现了 MCP 协议，什么语言写都行。复用性上，手写工具的代码是绑死在当前这个应用里的，而随便哪个 MCP Client 都能连上同一个 Server 复用它。进程隔离上，手写工具一崩溃，应用跟着就崩了，MCP Server 进程崩了，Client 进程完全不受影响。权限控制上，手写工具和应用共享同一套进程权限，MCP Server 进程的权限是可以单独设置的。","keyPoints":["同一套工具需要被多个 AI 应用（Claude Code、自写 Agent、团队其他项目）复用","工具用非 Python 语言写更合适（如需要 Go 的高并发、Rust 的安全性）","需要把工具隔离到更严格的权限沙箱（如只允许 Server 进程访问特定目录）","工具需要对外（跨机器）提供服务","工具只被一个 AI 应用用，且是 Python 实现——手写 `@tool` 更简单，无需额外进程","原型阶段、快速验证——MCP Server 多了配置和进程管理的心智负担"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g40_q6","qnum":13,"qtext":"FastMCP 和 MCP 低级 Server API 有什么区别？各自适合什么场景？","answer":{"oral":"FastMCP 是高级 API，入口是 `from mcp.server.fastmcp import FastMCP`，特点是装饰器风格、自动从类型提示生成 JSON Schema、代码极简，适合日常开发和快速验证；低级 Server API 是底层接口，入口是 `from mcp.server import Server`，需要手动实现 `list_tools` / `call_tool` handler，换来完全的控制权，适合需要动态生成工具列表、或者工具元数据要高度定制的场景。 FastMCP 的 `@mcp.tool()` 装饰器做的事情和 LangChain 的 `@tool` 类似：读取函数签名（参数名 + 类型提示）和 docstring，自动生成 MCP 工具描述。天气/汇率工具用 FastMCP 实现，对已经熟悉手写工具调用的人几乎没有上手成本。 选型标准：工具列表固定、追求开发效率 → FastMCP；需要根据运行时状态动态决定暴露哪些工具（如按用户权限过滤工具列表）→ 才需要低级 Server API 手动实现 handler。 **记忆点：FastMCP 是\"够用就好\"的默认选择，低级 API 是\"需要完全控制\"时的退路。**","keyPoints":["**FastMCP**：高级 API，装饰器风格，从函数签名和类型提示自动生成 JSON Schema，代码极简，适合日常开发和快速验证","**低级 Server API**：需手动实现 list_tools / call_tool handler，换来完全控制权，适合动态生成工具列表或工具元数据高度定制的场景","**选型标准**：工具列表固定、追求开发效率选 FastMCP；需按运行时状态动态决定暴露哪些工具（如按权限过滤）才需要低级 API"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g40_q7","qnum":14,"qtext":"不依赖 Claude Code，如何用 MCP Client SDK 直接验证 Server 的 list_tools 和 call_tool 两个接口？完整调用链路是什么？","answer":{"oral":"这段测试代码不依赖任何 AI 应用或模型，直接在协议层验证 Server 行为是否正确——适合 Server 开发阶段快速调试，不用每次改代码都重启 Claude Code 验证。 **记忆点：这就是 MCP 架构里\"Client 调用 Server\"的完整过程在代码里的具体落地：`initialize()` 握手 → `list_tools()` 拿列表 → `call_tool()` 执行。**","keyPoints":["`StdioServerParameters` 指定要启动的 Server 命令和参数","`stdio_client()` 启动 Server 子进程，建立 stdin/stdout 管道，得到 `read`/`write` 流","`ClientSession` 包装这对流，`session.initialize()` 完成协议握手","`session.list_tools()` 拿到工具列表（含 `inputSchema`）","`session.call_tool(工具名, 参数字典)` 执行调用，结果在 `result.content[0].text` 里","导入 asyncio 和 ClientSession、StdioServerParameters、stdio_client 等 MCP 客户端组件","用 StdioServerParameters 指定要启动的 Server 命令和参数","用 stdio_client 启动 Server 子进程并建立 stdin/stdout 管道，得到 read/write 流","用 ClientSession 包装这对流，调用 initialize() 完成协议握手","调用 list_tools() 拿到工具列表并打印每个工具的名字和描述","调用 call_tool() 执行一次真实工具调用，打印返回结果里的文本内容"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g72_q9","qnum":15,"qtext":"MCP 支持哪些传输方式？stdio、SSE 和 Streamable HTTP 分别适合什么场景？","answer":{"oral":"MCP 的消息格式统一是 JSON-RPC 2.0，传输层有几种选择。stdio 是标准输入输出：Host 应用把 MCP Server 作为一个子进程启动，通过子进程的标准输入发请求、从标准输出读响应。它最简单，不需要网络、没有端口，进程随 Host 启动和关闭，适合本地工具，比如访问本地文件系统、本地的 Git、IDE 插件、桌面应用，Claude Desktop 和 Claude Code 里配置的本地 Server 大多是这种。缺点是只能本机使用，一个 Server 进程只服务一个客户端，没法共享和横向扩展。SSE 是早期的远程传输方式，客户端用 HTTP POST 发请求，服务端通过一个长连接的 Server-Sent Events 通道推送响应和通知，需要维护两个端点，长连接对负载均衡和无服务器部署都不太友好，现在已经被标记为废弃。Streamable HTTP 是新的远程传输标准，只用一个 HTTP 端点，客户端用 POST 发请求，服务端可以直接返回普通的 JSON 响应，也可以在需要时把响应升级成 SSE 流来推送进度和多条消息；支持会话 ID 和断线续传，既可以做成无状态的服务方便横向扩展，也能支持流式。适合远程部署、多用户共享的 MCP 服务，比如企业把内部系统的能力做成一个 SaaS 化的 MCP Server 给很多人使用。远程传输要特别注意安全，需要做认证，MCP 规范里推荐用 OAuth 2.1，还要校验 Origin 头防止 DNS 重绑定攻击，本地监听时只绑定 127.0.0.1。","keyPoints":["统一使用 JSON-RPC 2.0 消息","stdio：子进程标准输入输出，本地、简单、无网络，单客户端","SSE：早期远程方案，双端点长连接，已废弃","Streamable HTTP：单端点，POST + 可选 SSE 流，支持会话与续传，可无状态扩展","远程安全：OAuth 2.1 认证、校验 Origin 防 DNS 重绑定、本地只绑 127.0.0.1"],"code":[],"followUp":["一个远程 MCP Server 要服务多个租户，权限怎么隔离？"],"pitfalls":["远程 MCP Server 不做任何认证就暴露到公网。"]}}]},{"name":"长期记忆","questions":[{"id":"g41_q1","qnum":1,"qtext":"LLM 应用的记忆为什么要分\"短期\"和\"长期\"两层？各自存在哪里、生命周期是什么？","answer":{"oral":"**短期记忆（工作记忆）**：当前会话的 `messages` 列表，存在 Python 进程内存里，程序重启即消失。生命周期 = 当前会话。容量受上下文窗口限制。 **长期记忆（持久记忆）**：用户偏好、事实、历史摘要，持久化到文件 / 数据库 / 向量库，程序重启后仍然存在。生命周期 = 持久（按需清理）。 **必须分层的原因**有四点：存储位置不同——短期记忆放在进程内存里，快但易失，长期记忆放在磁盘/数据库里，慢但持久；生命周期不同——短期记忆随会话结束就消失，长期记忆跨会话保留；注入方式不同——短期记忆直接追加到 messages 传给模型，长期记忆需要精选后注入 System Prompt；此外还有上下文窗口的限制——不能把所有历史消息全塞进去，长期记忆必须经过压缩和筛选才能注入。 不分层的后果：要么每次会话让用户重复告知偏好（差体验），要么把所有历史塞进上下文（Token 爆炸、成本失控）。","keyPoints":["**短期记忆**：存当前会话的 messages 列表，在 Python 进程内存里，生命周期=当前会话，容量受上下文窗口限制","**长期记忆**：用户偏好、事实、历史摘要，持久化到文件/数据库/向量库，生命周期=持久（按需清理）","**必须分层的原因**：存储位置、生命周期、注入方式都不同，且长期记忆受上下文窗口限制，须压缩筛选后才能注入 System Prompt","**不分层的后果**：要么每次会话让用户重复告知偏好，要么把所有历史塞进上下文导致 Token 爆炸、成本失控"],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g41_q2","qnum":2,"qtext":"让模型主动写入记忆有哪两种方式？各自的可靠性差异是什么？","answer":{"oral":"第一种方式是记忆工具加 Prompt 引导，原理是让模型自己判断什么时候该调用 `remember_preference(key, value)` 这个工具，代码写出来就是 `@tool def remember_preference(key, value)` 这样一个函数。这种方式可靠性只能算中等，因为它完全依赖模型判断得准不准，模型偶尔意识不到\"这个信息该记下来\"，就会漏记。第二种方式是用 mem0 自动提取，原理不一样，是每轮对话结束后调 `m.add(对话文本)`，让另一个 LLM 从对话里提取关键信息，自动向量化写进去，代码就是 `memory.add(conversation, user_id=uid)` 这一行。这种方式可靠性明显更高，因为它是每轮强制提取，不用等模型自己主动判断该不该记。 **mem0 方式的代价**：每轮对话多一次 LLM 调用（提取记忆），增加延迟和 Token 消耗。","keyPoints":["System Prompt 必须明确告诉模型\"何时该记\"（如\"当用户提到偏好时立即调用\"）","不能依赖用户主动要求模型记住——模型要主动判断","工具描述（docstring）要写清楚触发时机，这直接影响触发准确率"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g41_q3","qnum":3,"qtext":"把记忆注入 System Prompt 时，如何避免记忆条目过多导致上下文超限？","answer":{"oral":"三个控制手段： **1. KV 存储的天然去重**：dict 赋值覆盖，同一个 key 只保留最新值。\"常用城市\"从\"北京\"改成\"上海\"时，只有一条记忆条目，不会累积。 **2. 摘要压缩**：对历史对话摘要（情节记忆），定期用 LLM 把多条旧摘要合并成一条。 **3. 语义检索（按需注入）**：对于向量化记忆，不全量注入，而是根据当前用户问题检索 top-k 条最相关的记忆注入 System Prompt。\"用户问天气\"→ 只注入\"常用城市：北京\"，不注入\"喜欢拿铁\"。 对于\"用户偏好\"这个典型场景：KV 存储的天然去重已足够，通常不需要摘要压缩或语义检索（偏好条数少，全量注入也在几十个 Token 内）。","keyPoints":["判断 summaries 列表长度是否超过 MAX_ENTRIES 上限","超过时，取出最老的 N 条摘要，拼接成一段文本","调用一次 llm.summarize() 把这 N 条旧摘要压缩合并成一条新摘要","用这条压缩后的摘要替换掉原来的 N 条，拼在剩余摘要前面，得到裁剪后的 summaries"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g41_q4","qnum":4,"qtext":"KV 文件存储和向量存储记忆各自适合什么场景？判断标准是什么？","answer":{"oral":"KV 文件（JSON）适合存结构化偏好，比如城市、货币、姓名，检索方式是按 key 精确查找，实现成本极低，用标准库 json + pathlib 就够，注入方式是条数少时全量注入，适用条数是几条到几十条。向量存储适合存自由文本，也就是用户任意说过的话，检索方式是语义相似度 top-k，实现成本较高，需要 Embedding 模型加向量库（Chroma/FAISS），注入方式是按相关性 top-k 注入，适用条数是几十条到几千条。 实际项目里两种方式常常并存：结构化偏好用 KV，历史摘要用向量存储。","keyPoints":["记忆条目有明确的 key（\"常用城市\"、\"用户名\"）→ KV 存储","记忆条目是自由文本、需要\"找相关\"而不是\"按名查找\"→ 向量存储","记忆条数 < 20 条 → KV 存储，全量注入成本可控","记忆条数 > 50 条 → 向量存储 + 语义检索"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g41_q5","qnum":5,"qtext":"mem0 的 `add` 和让模型调用自定义的“记住偏好”工具，有什么本质区别？各自有什么优缺点？","answer":{"oral":"这两者本质区别可以从好几个点来看。触发机制不一样：手写工具是靠模型自己判断该记了才主动调用，mem0 是每轮对话结束后强制执行，不用模型做判断。信息提取方式也不一样：手写工具是模型在调用参数里自己填好 key 和 value，mem0 是另外起一个 LLM 从整段对话里自动提取关键信息。存储结构上，手写工具用的是开发者自己定义的 KV dict，很简单直接，mem0 用的是它自己管理的一套向量数据库。检索方式上，手写工具是按 key 精确查找，mem0 做的是语义检索、返回 top-k 条最相关的。额外的 LLM 调用上，手写工具没有多余开销，记忆写入就是工具逻辑本身的一部分，mem0 每次 `add` 都要多调一次 LLM 去做提取，这是要花钱花时间的。依赖上也不一样，手写工具零外部依赖，mem0 得 `pip install mem0ai`，还得配一个向量库。 **手写工具的优点**：实现简单，无额外依赖，延迟低（记忆写入无需 LLM 调用），开发者完全掌控存储结构。 **手写工具的缺点**：依赖模型主动判断\"该不该记\"，偶发遗漏；只能记结构化 key/value，不适合自由文本。 **mem0 的优点**：自动提取，可靠性高；支持自由文本、多用户隔离；内置语义检索。 **mem0 的缺点**：每次 `add` 多一次 LLM 调用（延迟 + Token 成本）；引入外部依赖；黑盒提取有时不准确。 判断：原型或结构化偏好 → 手写工具；生产环境、自由文本记忆、多用户 → mem0 或类似方案。","keyPoints":["**触发与提取方式**：手写工具靠模型自己判断该记才调用、自己填 key/value，mem0 每轮对话结束后强制执行、另起一个 LLM 自动提取","**存储与检索方式**：手写工具用开发者自定义的 KV dict、按 key 精确查找，mem0 用向量数据库、做语义检索返回 top-k","**额外开销与依赖**：手写工具零外部依赖、无额外 LLM 调用，mem0 每次 add 都要多调一次 LLM（延迟+Token成本）且需要 pip install mem0ai 和向量库","**判断标准**：原型或结构化偏好用手写工具；生产环境、自由文本记忆、多用户用 mem0 或类似方案"],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易忽略工具调用的幂等性，一重试就造成重复的副作用。"]}},{"id":"g41_q6","qnum":6,"qtext":"Agent 的记忆常分为工作记忆、情节记忆、语义记忆三层，它们各自的存储位置、生命周期、容量约束是什么？用户偏好属于哪一层？","answer":{"oral":"这三层记忆可以逐层来说。第一层是工作记忆，存的是当前会话的 messages 列表，就放在 Python 进程的内存里，生命周期很短，会话一结束就没了，容量受上下文窗口限制，一般是 8k 到 128k tokens 这个量级。第二层是情节记忆，存的是历史会话的摘要或者关键事件，这一层是要持久化的，放在文件或者数据库里，生命周期比较长，可以长期保留、按需定期清理，容量上通常会先压缩再注
