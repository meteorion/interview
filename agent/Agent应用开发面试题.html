入 System Prompt，控制在一两千 tokens 以内。第三层是语义记忆，存的是用户偏好、常用事实这些相对稳定的信息，同样要持久化，放在 KV 文件或者向量数据库里，生命周期是永久保留、可以按用户随时更新，容量上不会全量注入，而是按需检索出相关的那部分。 用户偏好属于 **Layer 3（语义记忆）**：用户偏好的持久化，是三层里最容易实现、收益最直观的部分。 **记忆点：三层的核心区别是\"活多久、放哪儿、能装多少\"——工作记忆易失、情节记忆要压缩、语义记忆按需检索。**","keyPoints":["**工作记忆**：存当前会话 messages，放在进程内存里，会话结束即消失，容量受上下文窗口限制（约 8k-128k tokens）","**情节记忆**：存历史会话摘要或关键事件，持久化到文件/数据库，长期保留可按需清理，注入前先压缩到一两千 tokens 以内","**语义记忆**：存用户偏好、常用事实，持久化到 KV 文件或向量数据库，永久保留可按用户更新，按需检索注入而非全量注入","**今日实践聚焦 Layer 3（语义记忆）**：用户偏好的持久化，是三层里最容易实现、收益最直观的部分"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g41_q7","qnum":7,"qtext":"LRU 淘汰策略具体怎么实现？它和 KV 去重、摘要压缩相比解决的是哪个问题？为什么\"用户偏好\"这个场景通常不需要 LRU？","answer":{"oral":"三种增长控制策略解决的问题并不相同。第一种是 KV 去重，也就是靠 dict 赋值覆盖，解决的是同一个 key 被多次写入时不产生重复条目的问题；第二种是摘要压缩，解决的是内容持续累积——比如历史对话摘要——时，把旧内容合并变薄的问题；第三种是 LRU 淘汰，解决的是条目总数超过硬性上限时，按\"最久未访问\"原则强制腾出空间的问题。 \"用户偏好\"场景通常不需要 LRU：偏好条目数量天然有限（常用城市、货币对、用户名等，通常几条到几十条），远达不到需要淘汰的规模；LRU 主要用于条目数可能无限增长的场景（如每条对话都可能产生一条独立记忆的向量存储）。 **记忆点：去重防重复、压缩防膨胀、LRU 防超限——三个策略针对的是记忆增长的三个不同阶段。**","keyPoints":["调用 load_memory() 读取当前所有记忆，格式是 key 到 {value, last_used} 的字典","把当前要写入的 key 更新为新的 value，并把 last_used 记录成当前时间戳 time.time()","判断记忆条目总数是否超过 max_entries 上限","超过时，用 min() 按 last_used 找出最久未被访问的那个 key","用 del 删除这个最旧的条目，腾出空间","调用 save_memory() 把更新后的记忆写回存储"],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g75_q1","qnum":8,"qtext":"Agent 的长期记忆应该写什么、什么时候写、怎么避免越存越乱？","answer":{"oral":"长期记忆是跨会话保存的信息，主要有几类：用户画像和偏好，比如用户的职业、常用的语言、喜欢简洁的回答；重要的事实，比如用户的项目背景、家庭成员；历史任务的经验，比如上次处理某类问题用了什么方法、踩过什么坑；还有用户明确要求记住的内容。不应该存的是临时性的对话细节、一次性的问题，以及敏感信息除非用户明确同意。写入时机有两种：一种是在对话进行中实时写，当模型识别到值得记住的信息时调用一个“保存记忆”的工具；另一种是在会话结束后异步处理，由一个后台任务回顾整段对话，抽取出值得长期保存的要点，这种方式不影响对话的响应速度，提取质量也更好。避免越存越乱是关键：第一，写入前去重和合并，先检索已有的相似记忆，如果是同一件事就更新而不是新增，比如用户之前说住北京，现在说搬到了上海，就要更新这条记忆而不是两条并存，冲突时以新的为准；第二，结构化存储，给每条记忆加上类型、时间戳、来源、重要性、置信度这些元数据；第三，检索时设置相关性阈值，只注入真正相关的少量记忆，而不是把所有记忆都塞进上下文；第四，要有遗忘机制，长期没被用到、重要性低的记忆随时间衰减或清理；第五，给用户查看、修改和删除自己记忆的能力，这既是体验也是合规要求。","keyPoints":["存什么：用户偏好画像、重要事实、任务经验、用户要求记住的内容；不存临时细节和未授权敏感信息","何时写：对话中通过记忆工具实时写，或会话结束后异步抽取（推荐）","去重合并：写前检索相似记忆，同一事项更新而非新增，冲突以新为准","结构化元数据 + 检索阈值，只注入相关的少量记忆","遗忘衰减；用户可查看、修改、删除"],"code":[],"followUp":["记忆存在向量库和存在结构化数据库里，各有什么优缺点？"],"pitfalls":["把每轮对话原文都存进向量库当记忆。"]}},{"id":"g75_q2","qnum":9,"qtext":"长期记忆的遗忘机制怎么设计？涉及隐私合规要注意什么？","answer":{"oral":"遗忘机制有几个层面。一是基于时间的衰减，参考人类记忆的遗忘曲线，给每条记忆一个随时间下降的权重，检索排序时综合考虑相关性、重要性和新近度，比如斯坦福 Generative Agents 论文里就是这三者加权；长期没被检索命中的记忆权重越来越低。二是基于使用的强化，经常被检索和使用的记忆说明有价值，提升它的权重，反之降低。三是主动清理，定期运行后台任务，删除过期的、低价值的记忆，或者把大量零散的旧记忆压缩合并成一条摘要，控制记忆库的规模。四是过时信息的覆盖，新信息和旧信息冲突时，旧的标记为失效。五是设置 TTL，一些天然有时效性的信息，比如“用户这周在出差”，写入时就带上过期时间。隐私合规方面要注意：第一，告知和同意，要让用户知道系统会记住哪些信息、用来做什么，敏感信息比如健康、财务、身份证号原则上不存，确需存储要单独征得同意；第二，用户的控制权，提供查看、修改、删除记忆的界面，并且支持一键清除全部记忆，删除要真正删除，包括向量库里的向量和备份；第三，数据隔离，不同用户的记忆严格隔离，检索时必须带上用户 ID 过滤，绝不能把一个用户的记忆泄露给另一个用户；多租户场景还要按租户隔离；第四，存储安全，敏感字段加密存储，访问记录审计；第五，遵守数据保留期限的规定，满足个人信息保护法或 GDPR 中被遗忘权的要求。","keyPoints":["时间衰减：相关性 + 重要性 + 新近度加权排序","使用强化：常被命中的记忆提升权重","主动清理与压缩合并；冲突时旧记忆失效；时效信息设 TTL","合规：告知同意、敏感信息不存或单独授权","用户控制权（查看/修改/删除/一键清除）、用户与租户严格隔离、加密审计、满足被遗忘权"],"code":[],"followUp":["用户要求删除记忆，向量库里的数据怎么保证真正删干净？"],"pitfalls":["检索记忆时没有按用户 ID 过滤，导致跨用户泄露。"]}}]},{"name":"多 Agent 协作","questions":[{"id":"g42_q1","qnum":1,"qtext":"Planner / Executor / Critic 三角色的职责边界各是什么？为什么不让一个 Agent 完成所有步骤？","answer":{"oral":"三个角色的输入输出和职责边界分别是：Planner 接收用户的复合问题，输出 SubTask[]，职责是理解意图、拆分子任务，但它不调用任何工具，也不验证结果对不对；Executor 接收 SubTask，输出 TaskResult，职责是按指定的工具和参数去执行，但它不判断执行结果是否完整回答了用户的问题；Critic 接收原始问题和全部 TaskResult[]，输出 CriticVerdict，职责是判断结果是否完整，但它不会自己执行工具，也不会修改任何结果。 **为什么不让一个 Agent 完成所有步骤**：不让一个 Agent 完成所有步骤，是因为单 Agent 在三个方面表现不好。第一是认知负担，单个 Agent 要同时理解意图、决定工具顺序、处理错误、验证结果完整性，复杂任务很容易漏步；第二是容错能力，执行出错时没有独立的检查环节，错误会直接传到用户那里；第三是可替换性，拆任务和执行耦合在一起，想换一个更强的执行模型就得整体替换，没法单独升级。 分角色的核心价值：每个角色可以独立调优（换 Prompt、换模型），职责清晰后 Bug 更容易定位（是 Planner 拆错了还是 Executor 执行错了）。","keyPoints":["**Planner**：接收复合问题输出 SubTask[]，只负责理解意图、拆分子任务，不调用工具也不验证结果","**Executor**：接收 SubTask 输出 TaskResult，按指定工具和参数执行，不判断结果是否完整回答了问题","**Critic**：接收原始问题和全部 TaskResult[] 输出 CriticVerdict，判断结果是否完整，不执行工具也不修改结果","**为什么不用单 Agent**：单 Agent 认知负担重容易漏步、缺乏独立检查环节容错差、拆任务与执行耦合导致难以单独替换升级"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g42_q2","qnum":2,"qtext":"Agent 间的消息传递协议需要包含哪些字段？如何判断\"这一步完成了\"？","answer":{"oral":"**SubTask（Planner → Executor）**：先看 SubTask，这是 Planner 传给 Executor 的消息，包含五个字段。第一个是 `task_id`，类型是 str，作用是唯一标识，方便 TaskResult 回传时做关联；第二个是 `description`，类型是 str，是任务描述，供 Executor 理解上下文；第三个是 `tool_name`，类型是 str，是要调用的工具名；第四个是 `tool_args`，类型是 dict，是工具参数；第五个是 `depends_on`，类型是 list[str]，存的是前置任务 ID，执行前要检查这些前置任务是否都已完成。 **TaskResult（Executor → Critic）**：再看 TaskResult，这是 Executor 传给 Critic 的消息，包含四个字段。第一个是 `task_id`，类型是 str，对应的是 SubTask 的 ID；第二个是 `status`，取值是 \"completed\" 或者 \"failed\"，是判断\"这一步完成了没有\"的核心字段；第三个是 `result`，类型是 str，是成功时的结果文本；第四个是 `error`，类型是 str，是失败时的错误原因。 **判断\"这一步完成了\"**：`result.status == \"completed\"`。依赖关系用 `depends_on` 实现——Executor 执行每个子任务前检查 `depends_on` 里的所有 ID 是否都已 completed，未满足则标记 failed。","keyPoints":["**SubTask（Planner→Executor）**：含 task_id、description、tool_name、tool_args、depends_on 五个字段，depends_on 存前置任务 ID","**TaskResult（Executor→Critic）**：含 task_id、status（completed/failed）、result、error 四个字段","**判断\"完成\"**：result.status == \"completed\"；执行前检查 depends_on 里的前置任务是否都已 completed，未满足则标记 failed"],"code":[],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g42_q3","qnum":3,"qtext":"Critic Agent 的判断标准是什么？它的输出结构应该包含哪些字段？","answer":{"oral":"Critic Agent 的判断标准是对照用户的原始问题意图，去检查每个子任务的结果，具体看三点：是不是所有子任务都 completed、没有 failed 的关键步骤；结果内容是不是实质上回答了用户的需求，而不只是\"工具没报错\"这么简单；结果之间有没有矛盾或者明显异常。输出结构上，CriticVerdict 里有四个字段：passed 表示整体是否通过，missing 是没被回答的需求点、passed 为 false 时才填，reason 是简洁的整体判断理由，retry_hint 是给 Planner 的重试建议、同样是 passed 为 false 时才填。Critic 有三件事不应该做：不能重新执行工具，只能判断不能操作；不能自己填补缺失信息，而是要明确告诉 Planner 缺什么；不能只检查 status 字段，status 是 completed 但 result 是空字符串同样算失败，要连内容一起检查。","keyPoints":["是否所有子任务都 completed（没有 failed 的关键步骤）","结果内容是否实质上回答了用户的需求（不只是\"工具没报错\"，而是\"用户要知道的信息都有了\"）","结果之间是否存在矛盾或明显异常","不重新执行工具（只判断，不操作）","不自行填补缺失信息（明确告诉 Planner 缺什么）","不只检查 status，要检查 result 内容（status=completed 但 result 是空字符串也是失败）"],"code":[{"lang":"python","steps":["passed 字段是一个布尔值，表示整体判断是否通过","missing 字段是一个字符串列表，列出未被满足的需求点，只在 passed 为 false 时填写","reason 字段是一段简洁的文字，说明整体判断的理由","retry_hint 字段是给 Planner 的重试建议，同样只在 passed 为 false 时填写"],"keepCode":"{\n  \"passed\": bool,\n  \"missing\": list[str],\n  \"reason\": str,\n  \"retry_hint\": str\n}"}],"followUp":["如果要在这个流程里加一步人工审核，你会加在哪？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g42_q4","qnum":4,"qtext":"A2A 协议的 Task 状态机、流式 Push、Agent Card 分别解决了同进程 Demo 的哪个工程短板？","answer":{"oral":"同进程 Demo 其实有三个工程短板，A2A 协议正好一一对应解决。先说第一个，任务状态没有持久化——之前状态就放在内存的 results 列表里，进程一崩溃就全没了；A2A 用 Task 状态机来解决这个问题，从 submitted 到 working 再到 completed 或 failed，Task 对象存在 Executor 服务的存储里，就算进程崩了也能查得到，Planner 随时调 GET /tasks/{id} 就知道进度。第二个短板是同步阻塞，原来 Executor 得把所有子任务都跑完，Planner 才能往下走；A2A 引入了 Streaming Push，也就是用 SSE 或 WebSocket，让 Executor 每完成一个阶段就主动推状态给 Planner，这样 Planner 可以边等边干别的，比如先去 Critic 已经跑完的那部分。第三个短板是工具表写死了，原来的 TOOL_REGISTRY 是硬编码的，新增一个 Executor 就得改代码；这个问题靠 Agent Card 解决，就是那个 `/.well-known/agent.json`，每个 Executor 服务自己声明能处理什么类型的任务，Planner 就能动态发现有哪些 Agent 可用，不用再硬编码了。","keyPoints":["**任务状态未持久化**：原来状态存内存 results 列表崩溃即丢，A2A 用 Task 状态机（submitted→working→completed/failed）存于 Executor 服务存储，可 GET /tasks/{id} 查询","**同步阻塞**：原来 Planner 要等 Executor 跑完所有子任务才能继续，A2A 用 SSE/WebSocket 的 Streaming Push 让 Executor 每完成一阶段就主动推状态","**工具表写死**：原来 TOOL_REGISTRY 硬编码，新增 Executor 就要改代码，A2A 用 Agent Card（/.well-known/agent.json）让每个 Executor 自己声明能力，Planner 动态发现"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g42_q5","qnum":5,"qtext":"MCP / A2A / Function Calling 三层协议各解决什么问题？在一个完整多 Agent 系统里三者如何配合？","answer":{"oral":"三层协议解决的是三个不同层次的问题：Function Calling 解决的是模型如何表达\"我要调用哪个工具、传什么参数\"，跨越的是模型内部——模型和工具调用意图之间的边界；MCP 解决的是工具服务如何标准化暴露、被多个 AI 应用发现和复用，跨越的是 AI 应用（Client）和工具服务器（Server）之间的边界；A2A 解决的是 Agent 如何向另一个 Agent 委派任务、推送状态、声明能力，跨越的是 Agent 与 Agent 之间的边界。","keyPoints":["没有 Function Calling，模型无法表达工具调用意图","没有 MCP，工具和 Agent 代码耦合，无法复用","没有 A2A，多个 Agent 只能同进程调函数，无法独立部署和扩容","Planner Agent 通过 A2A 协议把子任务（SubTask）委派给 Executor Agent","Planner 和 Executor 各自通过 MCP 连接自己需要的工具服务，比如记忆工具 Server、天气/汇率 Server","模型层面用 Function Calling 决定什么时候该调用哪个工具","MCP 层负责工具服务的标准化连接，解决“用什么工具”的问题","A2A 层负责 Agent 之间的任务委派和状态同步，解决“谁做这件事”的问题"],"code":[],"followUp":["这套设计能不能在不大改架构的前提下，扩展到更多工具？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g42_q6","qnum":6,"qtext":"Executor 执行子任务时如何处理任务间的依赖关系？遇到某个子任务执行失败，是终止整个流程还是继续执行后续任务？为什么这样设计？","answer":{"oral":"**依赖处理**：每个子任务执行前先检查 `depends_on` 里的所有前置 `task_id` 是否都在 `completed_ids` 集合里；有未满足的依赖直接标记 failed 并 `continue`，不阻塞整个流程。 **失败处理**：无论是依赖未满足还是工具调用抛异常，都只把当前子任务标记 failed，然后 `continue` 执行下一个子任务——不会因为一个子任务失败就终止整个 Executor 流程。 这样设计的原因：子任务之间大多相互独立（查天气和查汇率互不影响），一个子任务失败不该连累其他能正常执行的子任务；把\"是否整体失败\"的判断权交给下游的 Critic，而不是 Executor 自己中途掐断——Executor 只负责\"尽量执行完能执行的\"，完整性判断是 Critic 的职责。 **记忆点：Executor 是\"能做多少做多少\"的执行者，不是\"一错就停\"的守门员——守门员的角色留给 Critic。**","keyPoints":["遍历 tasks 列表，取出每个任务的 task_id","检查这个任务的 depends_on 里，有没有前置 task_id 还不在 completed_ids 集合里，得到 unmet 未满足依赖列表","如果 unmet 非空，直接把该任务标记为 failed，记录错误信息，然后 continue 跳到下一个任务，不执行","依赖都满足时，用 try 调用 tool_fn 执行任务，成功则标记 completed 并把 task_id 加入 completed_ids","如果调用过程中抛出异常，用 except 捕获，把该任务标记为 failed 并记录异常信息，同样不终止循环"],"code":[],"followUp":["多个工具之间有依赖关系的时候，你怎么控制调用顺序？"],"pitfalls":["容易把工具返回的原始结果直接喂给模型，不做格式清洗和长度控制。"]}},{"id":"g42_q7","qnum":7,"qtext":"Planner 的实现里为什么用 `response_format={\"type\": \"json_object\"}` 而不是普通文本输出？为什么代码里要同时兼容\"直接返回列表\"和\"返回 `{\"tasks\": [...]}`\"两种情况？","answer":{"oral":"用 `response_format={\"type\": \"json_object\"}` 的原因：强制模型输出合法 JSON，避免模型在 JSON 前后加解释性文字（如\"好的，以下是拆解结果：\"）导致 `json.loads` 直接报错——这是结构化输出场景的标准做法。 兼容两种返回形状的原因：`response_format={\"type\": \"json_object\"}` 只保证输出是一个合法 JSON**对象**，不保证顶层一定是数组——模型可能按语义习惯包一层 `{\"tasks\": [...]}`，也可能直接返回数组式的 JSON。代码用 `isinstance(data, list)` 判断，是 list 就直接用，是 dict 就取 `tasks` 字段（或退化到取第一个 value），做防御性兼容，避免因模型输出形状的细微差异导致整个 Planner 崩溃。 **记忆点：结构化输出只保证\"合法 JSON\"，不保证\"你想要的那个顶层结构\"——解析代码要为模型的\"善意但不精确\"留出兼容空间。**","keyPoints":["调用 client.chat.completions.create() 发起请求，并传入 response_format={\"type\": \"json_object\"} 强制模型输出合法 JSON","从返回结果里取出 message.content 作为原始字符串 raw","用 json.loads(raw) 把这段字符串解析成 Python 对象 data","用 isinstance(data, list) 判断：如果 data 本身就是列表，直接返回","如果 data 是字典，则尝试取出 tasks 字段；取不到时退化为取字典第一个 value 作为兜底"],"code":[],"followUp":["如果工具调用失败或者返回了异常，Agent 该怎么处理？"],"pitfalls":["容易放任模型自由决定调用顺序，没做好死循环或越权调用的防护。"]}},{"id":"g76_q1","qnum":8,"qtext":"单 Agent 和多 Agent 怎么取舍？什么时候才真正需要多 Agent？","answer":{"oral":"我的原则是能用单 Agent 解决就不要用多 Agent，因为多 Agent 带来的协调成本是实实在在的：Agent 之间要传递信息，每次传递都可能丢失上下文、产生误解；总的 Token 消耗通常是单 Agent 的好几倍，Anthropic 披露过他们的多 Agent 研究系统 Token 消耗大约是普通对话的十几倍；延迟更高；出了问题很难定位是哪个 Agent 的哪一步出错；系统的不确定性叠加，整体更难测试和评估。真正需要多 Agent 的情况有几种：第一，任务可以被拆成多个相互独立的子任务并行处理，比如做一个调研，要同时搜索十个不同的方向，多个子 Agent 并行搜索，每个都有独立的上下文窗口，主 Agent 只汇总结果，这样既快又能突破单个上下文窗口的限制，这是多 Agent 收益最明显的场景；第二，单个 Agent 需要的工具太多、提示词太复杂，已经导致它频繁出错，按领域拆成几个专业的 Agent，每个只负责一块、持有少量工具，效果反而更好；第三，需要不同视角互相制衡，比如一个生成、一个审查，或者多个角色辩论来提高决策质量；第四，组织上不同团队维护不同的 Agent，需要通过协议协作。反过来，任务步骤之间紧密耦合、每一步都强依赖前一步的完整上下文的，比如大多数的编码任务，拆成多 Agent 反而会因为上下文割裂而效果变差。判断时可以先做单 Agent 的基线，评估它在哪里失败，再有针对性地拆分。","keyPoints":["多 Agent 成本：信息传递损耗、Token 成倍增长、延迟高、难定位、难评估","适合：可并行的独立子任务（各自独立上下文，突破窗口限制）","适合：单 Agent 工具过多、提示词过复杂导致出错 → 按领域拆分","适合：需要不同视角制衡（生成 + 审查、辩论）；跨团队协作","不适合：步骤强耦合、强依赖完整上下文的任务；先做单 Agent 基线再拆"],"code":[],"followUp":["子 Agent 的结果怎么高效地汇总给主 Agent，避免上下文爆炸？"],"pitfalls":["为了显得架构先进，把简单任务拆成多个 Agent。"]}},{"id":"g76_q2","qnum":9,"qtext":"多 Agent 系统中的角色怎么设计？怎么避免职责重叠和互相推诿？","answer":{"oral":"角色设计的核心是职责清晰。每个角色要明确定义几件事：它是谁，也就是角色定位；它的目标是什么，产出什么，最好有明确的产出格式；它的能力边界，能用哪些工具、能访问哪些数据；以及它不负责什么。CrewAI 里用 role、goal、backstory 三要素来描述，背景故事能帮助模型进入角色，比如“你是一名有十年经验的安全审计专家，对 SQL 注入特别敏感”，但关键还是目标和边界要写清楚。设计原则有几条：一是按能力互补来划分，而不是按人类组织架构生搬硬套，比如研究员负责搜集信息、分析师负责数据处理、写作者负责成文、审查者负责质检，每个角色有自己独特的价值；二是角色数量要克制，从最少的角色开始，一般三到五个就够了，角色越多，协调开销和出错概率越高；三是工具按角色分配，每个角色只拿完成自己任务所需的工具，既减少选错工具的概率，也符合最小权限原则。避免职责重叠和推诿：第一，在每个角色的提示词里明确写出边界和交接规则，比如“当发现需要修改代码时，不要自己改，把问题描述清楚交给开发者角色”；第二，用结构化的任务交接，明确交接的输入输出格式和完成标准，接收方能判断自己拿到的东西是否完整；第三，设置一个协调者或者 Manager 角色，负责最终的任务分配和冲突裁决，模糊地带由它决定归属；第四，在编排层限制同一个任务在两个 Agent 之间来回转交的次数，超过就上报协调者或人工处理。","keyPoints":["角色定义：定位、目标与产出格式、能力边界（工具/数据）、不负责什么","CrewAI 三要素：role、goal、backstory；关键仍是目标与边界","按能力互补划分；角色数量克制（3~5 个）；工具按角色最小授权","防推诿：提示词写明边界与交接规则、结构化交接与完成标准","协调者裁决归属；编排层限制来回转交次数"],"code":[],"followUp":["角色的提示词应该由谁来维护和评估？"],"pitfalls":["角色描述只有一句话的身份设定，没有边界和交接规则。"]}},{"id":"g76_q3","qnum":10,"qtext":"多 Agent 的协作编排模式有哪些？顺序流水线、层级管理、对等协商、黑板模式各适合什么任务？","answer":{"oral":"常见的有四种。顺序流水线是 Agent 按固定顺序依次处理，前一个的输出作为后一个的输入，比如研究员搜集资料、写作者撰写、编辑审校。它简单、可预测、容易调试，适合阶段划分明确、流程固定的任务，如内容生产、数据处理管道。缺点是不灵活，任何一环出错都会传递下去，也没法并行。层级模式，或者叫 Supervisor 或 Orchestrator-Worker 模式，有一个管理者 Agent 负责理解任务、拆解、把子任务分派给合适的工作者 Agent，收集它们的结果，判断是否需要继续分派，最后汇总。它灵活，能动态决定调用谁、调用几次，支持子任务并行，适合任务复杂、子任务无法预先确定的场景，比如深度研究、复杂问题排查，是目前生产中最常用的。缺点是管理者是瓶颈，它的判断失误会影响全局，而且所有结果都汇到它那里，上下文容易膨胀。对等协商是多个 Agent 地位平等，通过对话、辩论来共同决策，比如多个专家从不同角度讨论一个方案，或者正反方辩论后由裁判总结，AutoGen 的 GroupChat 就是这种。适合需要多视角、开放性讨论、提高决策质量的场景，缺点是轮次不可控、成本高，容易陷入无休止的讨论，需要严格的终止条件。黑板模式是有一个共享的状态空间，也就是黑板，所有 Agent 都能读取和写入，每个 Agent 观察黑板上的内容，发现自己能贡献的就去处理并把结果写回，彼此不直接通信，异步协作。适合问题求解路径不确定、需要多种专业知识逐步拼凑答案的任务。LangGraph 里的共享 State 其实就有黑板的影子。实际选择时，看任务结构：流程固定用流水线，动态拆解用层级，需要辩论用对等，异步拼凑用黑板。","keyPoints":["顺序流水线：固定顺序传递，简单可预测，适合流程固定的内容生产","层级 / Supervisor：管理者拆解分派汇总，灵活可并行，生产最常用，管理者是瓶颈","对等协商：平等对话辩论，多视角提升决策，轮次与成本难控","黑板：共享状态异步读写，不直接通信，适合逐步拼凑答案","按任务结构选：固定→流水线、动态→层级、辩论→对等、异步拼凑→黑板"],"code":[],"followUp":["层级模式里，管理者的上下文膨胀怎么解决？"],"pitfalls":["对等协商不设终止条件，导致无休止讨论。"]}},{"id":"g76_q4","qnum":11,"qtext":"多个 Agent 之间怎么通信？消息格式怎么约定？怎么防止互相踢皮球的死循环？","answer":{"oral":"通信方式主要有几种。直接消息传递，一个 Agent 调用另一个 Agent，把任务描述和上下文作为消息传过去，拿到结果后继续，最简单直接，常见的实现是把子 Agent 包装成一个工具，或者用交接 Handoff。共享状态，所有 Agent 读写同一个状态对象，比如 LangGraph 的 State，或者黑板，通过状态变化间接通信，适合需要多方协作逐步完善的场景。事件总线或发布订阅，Agent 发布事件到消息队列，关心的 Agent 订阅并响应，解耦程度最高，适合分布式部署、异步的长任务。跨系统、跨厂商的话就用 A2A 这样的标准协议。消息格式要约定好，我一般用结构化的格式，至少包括：发送方和接收方；任务 ID 和关联的父任务 ID，用于追踪；消息类型，比如任务请求、结果、追问、错误；任务的具体描述和必要的上下文，要注意自包含，接收方不能假设它知道发送方之前的对话；期望的输出格式和完成标准；以及结果状态，成功、失败、需要更多信息，附带置信度或者失败原因。防止踢皮球的死循环：第一，给每个任务维护一个流转历史，记录它经过了哪些 Agent，如果同一个任务在两个 Agent 之间来回转了超过阈值，比如两次，就停止转交，上报给协调者或者人工；第二，设置全局的最大通信轮次和任务超时时间；第三，在提示词里明确每个 Agent 的职责边界，并要求它在转交时必须说明理由，而且不能把任务原样退回，要么处理、要么说明为什么不能处理并给出建议；第四，有一个兜底的通用处理者，当没人能处理时由它给出最终回复。","keyPoints":["方式：直接消息（子 Agent 作工具 / Handoff）、共享状态（State / 黑板）、事件总线、A2A","消息字段：发送/接收方、任务 ID 与父任务 ID、类型、自包含的描述与上下文、输出格式、结果状态","防死循环：记录流转历史，来回超阈值即上报","全局最大轮次与超时；转交必须给出理由、不得原样退回","兜底通用处理者"],"code":[],"followUp":["子 Agent 返回的结果太长，怎么压缩后再给主 Agent？"],"pitfalls":["消息只传一句任务描述，接收方缺少必要上下文。"]}},{"id":"g72_q10","qnum":12,"qtext":"A2A 协议是什么？它怎么让不同厂商的 Agent 协作？和 MCP 的职责边界在哪里？","answer":{"oral":"A2A，Agent-to-Agent，是 Google 发起、后来交给 Linux 基金会管理的开放协议，目标是让不同厂商、不同框架开发的 Agent 能够互相发现、互相委托任务和协作。它有几个核心概念：Agent Card 是一个 JSON 格式的能力名片，通常发布在一个约定的路径下，描述这个 Agent 叫什么、能做什么、有哪些技能、服务地址、支持的输入输出格式、需要什么认证方式，别的 Agent 读取它就能知道能不能把任务交给它；Task 是协作的基本单位，有完整的生命周期状态，比如已提交、处理中、需要输入、已完成、失败、已取消；通信内容用 Message 和 Part 表达，Part 可以是文本、文件或者结构化数据；任务的产出物叫 Artifact。对于耗时很长的任务，支持通过 SSE 流式推送进度，也支持 Webhook 推送通知，客户端不用一直轮询。整个协议基于 HTTP 和 JSON-RPC 这些成熟的标准，复用已有的认证体系。和 MCP 的关系是互补的：MCP 解决的是 Agent 和工具、数据源之间的连接，工具是被动的、确定性的，你调用它，它执行一个函数返回结果；A2A 解决的是 Agent 和 Agent 之间的协作，对方是一个有自主决策能力的智能体，你委托给它的是一个任务，它可能需要多轮交互、可能反过来向你要更多信息、可能执行很长时间。一个形象的说法是：MCP 让 Agent 会用工具，A2A 让 Agent 之间能分工合作。一个完整的系统里，主 Agent 通过 A2A 把子任务交给别的专业 Agent，而每个 Agent 内部再通过 MCP 使用自己的工具。","keyPoints":["A2A：跨厂商、跨框架 Agent 互相发现与协作的开放协议","Agent Card：能力名片（技能、地址、输入输出、认证）","Task 生命周期状态；Message / Part；产出 Artifact","长任务：SSE 流式进度、Webhook 推送；基于 HTTP + JSON-RPC","MCP：Agent ↔ 工具（被动、确定）；A2A：Agent ↔ Agent（自主、多轮）；两者互补"],"code":[],"followUp":["跨组织调用外部 Agent 时，信任和安全怎么保证？"],"pitfalls":["认为 A2A 是用来替代 MCP 的。"]}}]},{"name":"Agent 行为评估","questions":[{"id":"g43_q1","qnum":1,"qtext":"Agent 行为评估 case 的三元组（用户输入 / 预期工具调用序列 / 预期回答要点）分别验证什么？","answer":{"oral":"这个三元组里三个字段各自验证不同的东西。第一个是用户输入，它本身不验证什么，只是固定输入，用来触发 Agent 执行；第二个是预期工具调用序列，验证的是工具触发准确率，也就是 Agent 有没有调用正确的工具、顺序对不对，评分方式是精确匹配工具名列表，顺序也要对；第三个是预期回答要点，验证的是内容正确性，也就是最终回答是否包含关键信息，评分方式是关键词模糊匹配，也就是 `all(kw in answer for kw in points)`。 **两者都通过才算整条 case 通过**。","keyPoints":["工具调用 ✓ + 回答要点 ✗ → 工具执行对了但模型没有正确使用结果（格式问题或上下文传递问题）","工具调用 ✗ + 回答要点 ✓ → 模型\"猜\"出了正确答案但走了错误路径（不可靠）","两者都 ✗ → 通常是工具调用错导致了回答也错，优先修工具调用"],"code":[],"followUp":["如果让你重新设计这部分，你会做哪些不一样的取舍？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}},{"id":"g43_q2","qnum":2,"qtext":"三类测试任务（single_tool / multi_step / boundary）各自评估 Agent 的哪个能力维度？通常哪类通过率最低？","answer":{"oral":"三类测试任务分别评估不同的能力维度：single_tool 评估工具触发精准率（不多不少，描述够就触发），典型 case 是\"北京今天天气？\"，期望只调一次 `get_weather`；multi_step 评估规划能力、子步骤拆解和工具调用顺序，典型 case 是\"帮我规划行程，需要天气和汇率\"，期望按顺序调用两个工具；boundary 评估鲁棒性，也就是遇到不支持的场景能不能礼貌拒绝、不强行调工具，典型 case 是\"查火星天气\"，期望不调工具、直接回复不支持。 **通常 multi_step 通过率最低**：根因主要是两个——①Planner 对\"同一工具用不同参数\"理解不足，把\"查北京和上海天气\"只拆成一个子任务；②步骤依赖处理不当，顺序可以乱。**boundary 通过率次低**：模型倾向于\"尽力帮忙\"，遇到不支持的场景容易强行调工具后回复错误，而不是直接拒绝。","keyPoints":["**single_tool**：评估工具触发精准率，如\"北京今天天气\"期望只调一次 get_weather","**multi_step**：评估规划能力、子步骤拆解和调用顺序，如\"规划行程需要天气和汇率\"期望按顺序调两个工具","**boundary**：评估鲁棒性，遇到不支持场景能否礼貌拒绝不强行调工具，如\"查火星天气\"期望直接回复不支持","**通过率**：multi_step 通常最低（同工具不同参数理解不足、步骤依赖处理不当），boundary 次低（模型倾向尽力帮忙强行调工具后回复错误）"],"code":[],"followUp":["如果让你重新设计这部分，你会做哪些不一样的取舍？"],"pitfalls":["容易只描述做了什么，说不出设计取舍和可以改进的地方。"]}},{"id":"g43_q3","qnum":3,"qtext":"工具调用 ✗ 和回答要点 ✗ 分别指向什么根因？根因定位的优先顺序是什么？","answer":{"oral":"**工具调用 ✗ 的根因定位**：工具调用 ✗ 具体可以拆成四种子症状分别定位。第一种是该调没调，也就是漏触发，这种情况通常是工具的 description 写得不够清楚，或者 System Prompt 没交代清楚什么时候该用这个工具，修复思路就是把 description 和 Prompt 引导都优化一下。第二种反过来，是不该调却调了，误触发，根因往往是 description 写得太宽泛了，修复就是把 description 收窄，加一句\"仅在 X 情况下调用\"。第三种是调了错误的工具，这种一般是几个工具的描述太相似，模型分不清，修复方向是给相似的工具加上明确的区分说明。第四种是顺序错了，根因通常在 Planner 的 Prompt 没讲清楚任务之间的依赖关系，修复就是在 Planner 的 System Prompt 里说明\"有依赖关系的任务要用 depends_on 标出来\"。 **优先顺序**：先修工具调用（根源），再修回答要点（下游）。工具调用对了，回答通常也会自然改善。","keyPoints":["工具返回了正确结果，但模型没有组织进回答 → 检查 System Prompt 是否要求\"必须在回答里包含工具结果\"","工具返回格式模型难以解读 → 优化工具返回值为更自然的文本"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易只描述做了什么，说不出设计取舍和可以改进的地方。"]}},{"id":"g43_q4","qnum":4,"qtext":"长期记忆（System Prompt 注入）和工具调用之间如何划分职责？用户明确说出城市时应该用哪个？","answer":{"oral":"两者解决不同类型的信息需求：长期记忆（System Prompt 注入）负责的是固定偏好，比如常用城市、用户名，这类信息时效性低（偏好变化慢），使用时机是用户未明确说明时作为默认值；工具调用负责的是动态数据，比如当前天气、实时汇率，这类信息时效性高（每次调用都要拿最新值），使用时机是用户明确请求实时数据时触发。 **用户明确说出城市时**：以**用户当前输入为准**，调用工具查询该城市——记忆偏好只是\"默认值\"，不覆盖用户的明确指令。 不写清楚这一点，模型可能用记忆里的\"北京\"去查用户明确说的\"上海天气\"。","keyPoints":["**长期记忆**：负责固定偏好（常用城市、用户名），时效性低，用户未明确说明时作为默认值","**工具调用**：负责动态数据（当前天气、实时汇率），时效性高，用户明确请求实时数据时触发","**用户明确说出城市时**：以用户当前输入为准调用工具查询，记忆偏好只是默认值，不覆盖用户的明确指令"],"code":[{"lang":null,"steps":["在 System Prompt 里加入一段关于已知用户偏好的说明文字","明确写清楚：已知偏好仅在用户当前消息未指定时，才作为默认值使用","再加一句规则：如果用户在当前消息里明确说出了具体城市或货币，就要以用户输入为准，忽略已知偏好","这样可以避免模型误用记忆里的旧偏好，覆盖掉用户刚刚给出的明确指令"],"keepCode":"【已知用户偏好】仅在用户未指定时作为默认值使用。\n当用户在当前消息里明确说出具体城市/货币时，以用户输入为准，忽略已知偏好。"}],"followUp":["这些知识点之间是怎么串联起来、构成一条完整链路的？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g43_q5","qnum":5,"qtext":"给一个基础 Agent 项目同时引入 LangGraph、MCP、长期记忆、多 Agent 四项能力，各自会带来什么额外代价？怎么判断是否值得？","answer":{"oral":"这四项能力引入的代价都不一样，判断值不值得引入的标准也各不相同。先说 LangGraph，代价是要多依赖一个包，还得学 StateGraph 这套 API，调试的时候也得理解图结构；但只要流程里有分支、需要中断、或者需要持久化，这三条占一条就值得引入。再看 MCP，代价是要多起一个独立进程，还要维护 .mcp.json 配置和进程管理；值得引入的条件是工具需要被两个以上的应用复用，或者要跨语言调用。长期记忆的代价相对小一些，主要是要管理记忆文件，System Prompt 也会因此变长、Token 跟着增加；只要用户有明显的重复偏好，而且重启后还要接着用，这个代价就值得付。最后是多 Agent，代价是最大的，因为 LLM 调用次数直接变成三倍——Planner、Executor、Critic 各调一次，延迟也会跟着上去；只有任务本身有明确的多步骤、而且对容错要求高的时候才值得上，简单任务完全不需要这套架构。","keyPoints":["**长期记忆**：代价最小，收益立竿见影（用户体验直接改善）","**LangGraph**：中等代价，流程可观测性和可扩展性大幅提升","**MCP**：代价与工具数量正相关，工具少时优先级不高","**多 Agent**：代价最大，仅对真正复杂的复合任务引入，不要默认开启"],"code":[],"followUp":["这里面你认为最关键的设计点是什么？能展开讲讲吗？"],"pitfalls":["容易只描述做了什么，说不出设计取舍和可以改进的地方。"]}}]},{"name":"LangChain 核心抽象与 LCEL","questions":[{"id":"g32_q1","qnum":1,"qtext":"为什么要在原生 API 之上使用 LangChain 框架？它解决了哪些核心问题？","answer":{"oral":"原生 API 有三个痛点：**Provider 绑定**（切换模型需改客户端、参数名、响应字段）、**链路代码重复**（每个 Demo 都要手写\"拼 messages → 调 API → 取 content\"这条链）、**输出解析散落**（JSON 解析、Pydantic 校验、重试逻辑各自散落在业务代码里）。 LangChain 对应的解决方式是这样的：针对 Provider 绑定问题，解法是提供统一的 `ChatModel` 接口，切换 Provider 时只需要改初始化部分；针对链路代码重复问题，解法是用 LCEL 管道，也就是 `prompt | model | parser` 这种写法，把链路标准化；针对输出解析散落问题，解法是用 `OutputParser` 系列统一做解析，并且内置了重试机制。 **注意**：LangChain 是在理解原生 API 之后才引入的工具——不理解底层就直接用框架，出问题时分不清是哪一层的锅。","keyPoints":["**原生 API 三痛点**：Provider 绑定（换模型需改客户端、参数名、响应字段）、链路代码重复（每次都手写拼 messages→调 API→取 content）、输出解析散落（JSON 解析、Pydantic 校验、重试逻辑各自散落）","**对应解法**：统一 ChatModel 接口解决 Provider 绑定；LCEL 管道（prompt | model | parser）标准化链路；OutputParser 系列统一解析并内置重试","**引入时机**：LangChain 应在理解原生 API 之后再用，不理解底层就直接用框架，出问题分不清是哪一层的锅"],"code":[],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g32_q2","qnum":2,"qtext":"什么是 LangChain 的 Runnable 接口？它统一了哪三个核心方法？","answer":{"oral":"`Runnable` 是 LangChain 所有组件（`PromptTemplate`、`ChatModel`、`OutputParser`）共同实现的接口，使得它们可以用 `|` 串联成管道。 三个核心方法分别是这些。第一个是 `.invoke(input)`，作用是同步单次调用，返回单个结果。第二个是 `.stream(input)`，作用是流式调用、逐 token 输出，返回类型是 `Iterator[chunk]`。第三个是 `.batch([i1, i2])`，作用是并行批量调用，返回类型是 `list`。 **为什么重要**：`RunnableSequence`（即 `a | b | c`）把这三个方法自动传播到整条链——调用 `chain.stream(...)` 时，每一个 `Runnable` 组件都以流式模式运行，不需要额外代码。","keyPoints":["**Runnable**：LangChain 所有组件（PromptTemplate、ChatModel、OutputParser）共同实现的接口，可用 `|` 串联成管道","**三个核心方法**：`.invoke()` 同步单次调用返回单个结果、`.stream()` 流式逐 token 输出返回 Iterator、`.batch()` 并行批量调用返回 list","**为什么重要**：`RunnableSequence`（a|b|c）把这三个方法自动传播到整条链，调用 chain.stream() 时每个组件都自动以流式模式运行，不需额外代码"],"code":[],"followUp":["这里为什么选这个框架，而不是自己拼一套流程？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g32_q3","qnum":3,"qtext":"LCEL 管道语法 `prompt | model | parser` 的执行过程是什么？每一步的输入输出类型分别是什么？","answer":{"oral":"具体到每一步，`prompt` 这一步输入类型是 `dict`，输出类型是 `ChatPromptValue`；`llm` 这一步输入类型是 `ChatPromptValue`，输出类型是 `AIMessage`；`parser`（也就是 `StrOutputParser`）这一步输入类型是 `AIMessage`，输出类型是 `str`。 类型转换是隐式的，调试时用 `prompt.invoke(input)` 单独查看中间状态。","keyPoints":["最初的输入是一个 dict，比如 {\"question\": \"...\"}","prompt.invoke 处理这个 dict，输出一个 ChatPromptValue，里面包含 system 和 human 两条消息","llm.invoke 接收 ChatPromptValue，输出一个 AIMessage，包含 content 和 response_metadata 等字段","parser.invoke 接收 AIMessage，最终输出一个纯文本 str，也就是 AIMessage.content 的内容"],"code":[{"lang":"python","steps":["用竖线操作符把 prompt、llm、parser 三个 Runnable 依次串联成一条 chain","调用 chain.invoke 传入一个 dict（比如 {\"question\": \"...\"}），触发整条链依次执行"],"keepCode":"chain = prompt | llm | parser\nchain.invoke({\"question\": \"...\"})"}],"followUp":["状态在多个节点之间传递时，你怎么保证关键信息不丢？"],"pitfalls":["容易过度依赖框架的黑盒封装，出了问题不知道底层到底在做什么。"]}},{"id":"g32_q4","qnum":4,"qtext":"`ChatPromptTemplate` 相比手拼字符串 messages 多做了哪些事？又隐藏了什么？","answer":{"oral":"**多做的事**：在变量占位符校验上，手写用 f-string 时忘了加变量并不会报错，而框架里 `{var}` 缺失时会直接抛出 `KeyError`；在消息角色验证上，手写时把 `\"system\"` 拼错成 `\"sistem\"` 也不会报错，而框架在用 `(\"system\", ...)` 创建模板时就会校验角色名；在多轮历史插入上，手写要手动 `messages.extend(history)`，框架则提供 `MessagesPlaceholder` 做声明式插入。 token 计数藏在 `AIMessage.response_metadata[\"token_usage\"]` 里，不在链的直接输出中。","keyPoints":["这段代码代表框架内部实际发出的 API 请求，已经被 ChatPromptTemplate 封装起来，正常使用时看不到","调试时可以单独调用 prompt.invoke 并打印结果，查看框架实际拼出来的消息结构"],"code":[],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易过度依赖框架的黑盒封装，出了问题不知道底层到底在做什么。"]}},{"id":"g32_q5","qnum":5,"qtext":"什么场景下应该用 LangChain，什么场景下手写原生 API 更合适？","answer":{"oral":"简单的单步调用（一问一答）场景，更适合手写，因为依赖少、调试直接、没有框架版本风险；多步链路（RAG、Agent）场景，更适合用 LangChain，因为统一接口天然支持流式和批量；需要精确控制 API 参数时，更适合手写，因为框架封装会屏蔽部分参数；需要跨 Provider 可移植性时，更适合用 LangChain，因为切换 Provider 只改初始化，链路代码不用动；生产系统且依赖稳定性优先时，更适合手写或锁定版本，因为 LangChain 的破坏性变更比较频繁。 **LangChain 的价值随链路复杂度增长**：在单轮聊天这类简单 Demo 上，框架带来的收益不显著；到 LangGraph 多步 Agent 编排，统一接口的价值才真正体现。","keyPoints":["**更适合手写**：简单单步调用（依赖少、调试直接、无框架版本风险）、需精确控制 API 参数（框架封装会屏蔽部分参数）、生产系统依赖稳定性优先（LangChain 破坏性变更频繁）","**更适合用 LangChain**：多步链路如 RAG/Agent（统一接口天然支持流式和批量）、需要跨 Provider 可移植性（只改初始化，链路代码不用动）","**价值随复杂度增长**：单轮聊天 Demo 上框架收益不显著，到多步 Agent 编排时统一接口的价值才真正体现"],"code":[],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g32_q6","qnum":6,"qtext":"`PromptTemplate` 和 `ChatPromptTemplate` 有什么区别？为什么现在几乎只用后者？","answer":{"oral":"两者是 LangChain 里两种不同的模板类型，适用于不同代际的模型接口：`PromptTemplate` 面向单次文本补全（legacy completion API），常见于旧版模型、非对话任务；`ChatPromptTemplate` 面向当前主流的聊天模型，比如 GPT-4、DeepSeek Chat、Qwen 这些。 `PromptTemplate` 面向的是\"输入一段文本、补全一段文本\"的老式 completion 接口，不区分角色（system/user/assistant）；`ChatPromptTemplate` 面向的是现在主流的聊天模型接口，用 `(\"system\", ...)` / `(\"human\", ...)` 这样的角色化消息列表组织 Prompt，天然对应 `messages` 参数的结构。 现在几乎只用 `ChatPromptTemplate` 的原因很直接：聊天模型已经是绝对主流，`PromptTemplate` 对应的 completion API 属于历史遗留，结构化输出、RAG、LangGraph Node 这些场景用的都是 `ChatPromptTemplate`。 **记忆点：`PromptTemplate` 对应老式补全接口，`ChatPromptTemplate` 对应角色化的聊天接口——选型只看你调用的是不是 Chat 模型。**","keyPoints":["**PromptTemplate**：面向单次文本补全（legacy completion API），不区分角色，属于历史遗留","**ChatPromptTemplate**：面向当前主流聊天模型（GPT-4、DeepSeek Chat、Qwen 等），用 (\"system\",...)/(\"human\",...) 角色化消息列表，天然对应 messages 参数结构","**选型依据**：聊天模型已是绝对主流，所以现在几乎只用 ChatPromptTemplate——只看调用的是不是 Chat 模型"],"code":[],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易过度依赖框架的黑盒封装，出了问题不知道底层到底在做什么。"]}},{"id":"g32_q7","qnum":7,"qtext":"用 LangChain 重写一个原生 API 实现的聊天程序后，历史记录的存储类型发生了什么变化？这个变化说明了什么？","answer":{"oral":"历史记录的类型从 `list[dict]` 变成了 `list[HumanMessage | AIMessage]`： 这个变化说明 LangChain 用**类型化的消息对象**取代了裸 `dict`——`HumanMessage`、`AIMessage`（以及后续会用到的 `SystemMessage`、`ToolMessage`）是 LangChain 统一消息类型系统的组成部分，比 `{\"role\": \"...\", \"content\": \"...\"}` 多了类型安全（IDE 能识别字段、写错角色名会在构造时报错而不是等到发请求）。 更重要的是，这套消息对象类型不只是用在聊天链里——LangGraph 的 `AgentState` 里 `messages: Annotated[list, add_messages]` 存的正是这一套消息对象，`add_messages` Reducer 就是靠识别 `AIMessage`/`HumanMessage`/`ToolMessage` 的类型和 `id` 来做追加和去重的。换成消息对象类型，也是为后续的图状态设计打下基础。 **记忆点：dict 换成消息对象不是换皮，是为后面 LangGraph 的 Reducer 机制做类型铺垫。**","keyPoints":["手写版本里 history 是一个 dict 列表，每条消息用 role 和 content 两个字段表示，用 append 依次加入 system、user、assistant 消息","LangChain 版本改成从 langchain_core.messages 导入 HumanMessage 和 AIMessage 类","history 变成消息对象列表，用 HumanMessage(content=user_input) 和 AIMessage(content=reply) 分别封装用户输入和模型回复，再 append 进列表"],"code":[],"followUp":["这里为什么选这个框架，而不是自己拼一套流程？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g33_q1","qnum":8,"qtext":"`PydanticOutputParser` 和手写 JSON 解析的核心区别是什么？框架帮你标准化了哪三个步骤？","answer":{"oral":"手写版每次需要自己完成三步：① 取 `response.choices[0].message.content`；② `json.loads()` 解析（需处理 markdown 代码块）；③ `Pydantic(**data)` 校验（需捕获异常）。 `PydanticOutputParser` 其实就是把手写的这三步都标准化了。取文本这一步，手写得自己写 `response.choices[0].message.content` 去掏出内容，框架里用 `StrOutputParser` 就能自动提取，不用惦记这行代码。JSON 解析这一步，手写要自己调 `json.loads()`，还得处理模型可能返回的 markdown 代码块这种脏数据，框架内置了清理逻辑，解析失败还会直接抛出 `OutputParserException`，方便你捕获。Pydantic 校验这一步，手写得自己写 `Model(**data)` 再套一层 try/except 兜底，框架内部就直接帮你把校验做完了，甚至还能再套一层 `OutputFixingParser`，校验不过还能自动修复。 额外收益：`parser.get_format_instructions()` 自动生成符合 JSON Schema 的约束文本，替代手写的格式说明——字段描述、类型约束直接从 Pydantic model 的 `Field(description=...)` 生成，不需要手动维护两份信息。","keyPoints":["**手写三步**：取 response.choices[0].message.content、json.loads() 解析（需处理 markdown 代码块）、Pydantic(**data) 校验（需捕获异常）","**框架标准化**：StrOutputParser 自动提取文本；内置清理逻辑解析 JSON，失败抛 OutputParserException；内部完成 Pydantic 校验，还可再套 OutputFixingParser 自动修复","**额外收益**：get_format_instructions() 自动生成 JSON Schema 约束文本，字段描述和类型约束直接从 Pydantic Field(description=...) 生成，不用手动维护两份信息"],"code":[],"followUp":["状态在多个节点之间传递时，你怎么保证关键信息不丢？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g33_q2","qnum":9,"qtext":"`with_structured_output()` 和 `PydanticOutputParser` 有什么区别？各自适用什么场景？","answer":{"oral":"这两者的区别可以从四个方面来看。约束方式不一样：`PydanticOutputParser` 是往 Prompt 里塞一段 JSON Schema 文本去约束模型，而 `with_structured_output()` 是在 API 层，靠 tool_calling 或者 json_mode 硬性约束。Prompt 的可控程度也不一样：前者很透明，约束文本放在 Prompt 哪个位置完全由你自己决定；后者是框架帮你处理的，你看不太到底层怎么拼的，透明度低一些。可靠性上差别更明显：前者说到底还是依赖模型愿不愿意遵守 Prompt 里的约束，后者是 API 层强制保证格式，明显更可靠。所以适用场景也就分开了：需要精确控制 Prompt、链路又比较复杂的时候用前者；想快速搭个原型、不太纠结约束细节的时候，用后者更省心。 **生产建议**：支持 `tool_calling` 的模型（GPT-4o、DeepSeek、Qwen 等）优先用 `with_structured_output()`；需要自定义格式约束文本位置时用 `PydanticOutputParser`。","keyPoints":["PydanticOutputParser 方式先创建 parser，再用 prompt.partial 把 parser.get_format_instructions() 生成的约束文本插入到 Prompt 里，最后把 prompt、llm、parser 串成一条链","with_structured_output 方式直接在 llm 上调用 with_structured_output(Resume) 得到一个新的 structured_llm","之后直接对 structured_llm 调用 invoke 传入自然语言指令，由 API 层（tool_calling 或 json_mode）强制保证返回结构化的 Resume 对象"],"code":[],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g33_q3","qnum":10,"qtext":"LangChain `Retriever` 接口封装了什么？和手写检索函数的返回值有什么本质不同？","answer":{"oral":"`Retriever` 封装了三步：① 把查询字符串向量化（调 embedding 模型）；② 在向量库里相似度检索，取 Top-K；③ 把结果包装成 `List[Document]`。 `Document.metadata` 是关键：它把\"这段文字来自哪个文件\"随检索结果一路传下去，不需要额外传参就能支持引用溯源。另一个关键区别：`Retriever` 是 `Runnable`，可以直接用 `|` 参与 LCEL 链；手写函数不行。","keyPoints":["手写的 retrieve 函数先调用 embed 把查询字符串向量化，再用 chroma.query 做相似度检索取 Top-3，最后只返回文本组成的 list[str]","LangChain 的 Retriever 调用 retriever.invoke(\"query\")，内部同样做向量化和检索，但返回的是 List[Document]","每个 Document 除了 page_content 文本，还带 metadata 字段（比如来源文件路径），检索结果和来源信息一起被保留下来"],"code":[],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g33_q4","qnum":11,"qtext":"LCEL RAG 链里 `RunnablePassthrough` 和 `RunnableParallel` 分别解决什么问题？","answer":{"oral":"RAG 链的 Prompt 需要两个输入（`context` 和 `question`），但链的原始输入只有一个字符串（用户问题）。这是\"一个输入要喂给多个分支\"的问题，`RunnableParallel` 解决了它： 两者配合就是\"一个输入 → 两路并行处理 → 合并 → 继续\"的经典 LCEL 模式。","keyPoints":["**`RunnableParallel`**（dict 字面量是语法糖）：并行执行多个分支，把各分支结果合并为一个 dict，输出 `{\"context\": \"...\", \"question\": \"...\"}`，让 Prompt 的两个变量都能被填充","**`RunnablePassthrough()`**：把输入原样透传，不做任何处理——这里用来把用户问题传给 Prompt 的 `{question}` 变量，否则问题字符串会被 `retriever` 那条分支\"消耗掉\"","用一个 dict 字面量作为链的第一环，这个 dict 本身就是 RunnableParallel 的语法糖，会并行执行里面的每个分支","context 分支是 retriever 接 format_docs，负责检索文档并格式化成字符串","question 分支用 RunnablePassthrough() 把原始输入原样透传，避免用户问题被 retriever 那条分支消耗掉","两个分支的结果被合并成一个 dict，形如 {\"context\": ..., \"question\": ...}，正好填充 Prompt 需要的两个变量","后面再依次接 prompt、llm 和 StrOutputParser() 完成整条 RAG 链"],"code":[],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g33_q5","qnum":12,"qtext":"什么时候用 LangChain 现成组件更好，什么时候手写更可控？给出判断标准。","answer":{"oral":"判断标准其实可以按场景一条条过。需要流式、批量或者异步处理的时候，框架组件天生就支持，基本零代码改动，手写的话这些都得自己一点点实现。需要换 Provider 或者换向量库的时候，用框架只改初始化那部分代码就行，链路代码完全不用动；手写的话，改动往往会扩散到整个业务代码里，牵一发动全身。如果需要精确控制 Prompt 里到底写了什么，`PydanticOutputParser` 能做到这点，但 `with_structured_output()` 这种黑盒式的封装就做不到，透明度不够。调试排错的时候反而是手写更占优势，框架组件想看中间状态得单独 invoke 某个节点才行，手写代码每一步直接 print 一下就够了，很直观。如果只是写个一次性脚本或者场景特别简单，硬套框架组件反而是过度设计，手写明显更快更省事。但一旦是 RAG、Agent 这种多步链路的场景，框架用 LCEL 组合的优势就体现出来了，手写的 while 循环只会越写越长、越来越难维护。 **核心判断标准**：链路复杂度越高、需要跨 Provider 可移植性、需要流式/批量支持时，框架收益越大；简单单步、精确控制细节、排错优先时，手写更好。简单 Demo 的规模不大，引入框架的价值有限；到 LangGraph 多步 Agent 编排，框架优势才真正显现。","keyPoints":["**框架组件更优**：需要流式/批量/异步处理（天生支持、零代码改动）、需要换 Provider 或向量库（只改初始化，链路代码不用动）","**手写更优**：需精确控制 Prompt 内容（with_structured_output 是黑盒，透明度不够）、调试排错（框架需单独 invoke 节点看状态，手写直接 print 更直观）、一次性脚本或场景简单（硬套框架是过度设计）","**核心判断标准**：链路复杂度越高、越需要跨 Provider 移植性、越需要流式/批量支持，框架收益越大；简单单步、精确控制细节、排错优先则手写更好"],"code":[],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g33_q6","qnum":13,"qtext":"LangChain 内置的三种 OutputParser 分别是什么？各自的输出类型和适用场景是什么？`OutputFixingParser` 在它们基础上解决了什么问题？","answer":{"oral":"三种 OutputParser 按解析强度递增排列：`StrOutputParser` 输出纯文本 `str`，适合普通对话、摘要这类不需要解析结构的场景，覆盖了 90% 的使用场景；`JsonOutputParser` 输出 `dict`，适合输出是 JSON 但不需要严格类型校验的场景；`PydanticOutputParser` 输出 Pydantic 对象，适合需要类型安全、字段校验、IDE 自动补全的场景。 三者都是 `Runnable`，可以直接用 `|` 接在 `llm` 之后，选型只看你需要多强的结构化保证。 `OutputFixingParser` 是在这三者之上再包一层的进阶方案，解决\"解析失败怎么办\"的问题： 它相当于自动化了手写的\"解析失败 → 重试\"逻辑：原来出错要自己捕获异常、拼修复 Prompt、再调一次模型，现在包一层 `OutputFixingParser` 就搞定，代价是失败时会多花一次模型调用。 **记忆点：Str/Json/Pydantic 三种 Parser 是\"要多强的结构化\"的选型问题，OutputFixingParser 是\"解析失败怎么兜底\"的问题，两者维度不同、可以叠加使用。**","keyPoints":["从 langchain.output_parsers 导入 OutputFixingParser","用 OutputFixingParser.from_llm 把原来的 parser 和一个 llm 包装成更健壮的 robust_parser","当原始解析失败时，robust_parser 会自动再调一次模型，让模型修复不合规的输出，而不是直接报错","把 prompt、llm、robust_parser 串成新的 chain，替换原来直接用 parser 的写法"],"code":[],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g33_q7","qnum":14,"qtext":"`vectorstore.as_retriever()` 通过哪些参数控制检索行为？创建向量库的两种方式（从文档列表 vs 加载持久化目录）有什么区别？","answer":{"oral":"`search_type` 决定检索策略（默认是余弦相似度检索），`search_kwargs` 是传给具体策略的参数字典，最常用的是 `k`（Top-K 返回条数）。 `from_documents()` 这种方式适合快速验证、临时数据、一次性 Demo，数据来源是内存中的 `Document` 列表，每次都要重新构建；`persist_directory=...` 这种方式适合生产场景、需要复用已构建好的向量库，数据来源是磁盘上已经存过的向量库文件，可以直接加载。 方式二对应的正是手写 RAG 时把 embedding 结果持久化到 Chroma 的那一套流程——LangChain 版本只是把\"连接到已有向量库\"这件事包装成了统一的 `Chroma(...)` 初始化调用。 **记忆点：`search_kwargs={\"k\": N}` 控制\"取几条\"，`from_documents` 和 `persist_directory` 分别对应\"临时构建\"和\"加载已有\"两种向量库使用方式。**","keyPoints":["**search_type / search_kwargs**：search_type 决定检索策略（默认余弦相似度），search_kwargs 是策略参数字典，最常用 k 控制 Top-K 返回条数","**from_documents()**：适合快速验证、临时数据、一次性 Demo，从内存中的 Document 列表构建，每次都要重新构建","**persist_directory=...**：适合生产场景、需要复用已构建好的向量库，直接加载磁盘上已持久化的向量库文件"],"code":[{"lang":"python","steps":["调用 vectorstore.as_retriever() 创建检索器","用 search_type 参数指定检索策略，默认是相似度检索","用 search_kwargs 传入策略需要的参数字典，最常用的是 k，用来控制返回最相似的几条结果"],"keepCode":"retriever = vectorstore.as_retriever(\n    search_type=\"similarity\",\n    search_kwargs={\"k\": 3},\n)"},{"lang":"python","steps":["方式一用 Chroma.from_documents(docs, embedding=embeddings) 从内存里的 Document 列表直接构建向量库，适合小批量、临时构建的场景","方式二用 Chroma(persist_directory=..., embedding_function=embeddings) 加载磁盘上已经持久化好的向量库，对应此前手写 RAG 时把 embedding 结果存到 Chroma 的那套流程"],"keepCode":"Chroma.from_documents(docs, embedding=embeddings)\nChroma(persist_directory=\"./chroma_db\", embedding_function=embeddings)"}],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}}]},{"name":"LangGraph 状态图与路由","questions":[{"id":"g34_q1","qnum":1,"qtext":"LangGraph 的 `StateGraph` 和手写 `while` 循环相比，核心区别是什么？","answer":{"oral":"手写 `while` 循环把 Agent 状态隐式地藏在 `messages` 列表里，流程用 `if/return` 控制；`StateGraph` 把状态显式定义为 `TypedDict`，流程表达为 Node + Edge 的有向图。 适用判断：如果不需要中断、持久化、复杂分支，手写 `while` 更简洁；一旦出现这三类需求中的任何一个，就该切换到 LangGraph。","keyPoints":["**状态可见**：`AgentState` 的每个字段都有名字和类型，任何 Node 都能读/写，不需要解析消息内容才能知道\"当前处于哪一步\"","**可中断**：图可以在任意 Node 后加 `interrupt_before`，执行到那里自动挂起，等待外部信号继续；`while` 循环不行，函数栈不能挂起","**可持久化**：接入 `MemorySaver` 或任意 Checkpointer，状态快照自动持久化，进程重启后可恢复；`while` 循环里的状态随进程死亡"],"code":[],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g34_q2","qnum":2,"qtext":"LangGraph `Node` 函数的签名是什么？返回值有什么规范？","answer":{"oral":"Node 函数接收完整的 `State`，返回一个字典——**只包含需要更新的字段，不返回完整 State**： 返回值里没有出现的字段，LangGraph 保持原值不动（不是置空，是不动）。这是 Node 和普通函数不同的地方：不需要把整个 State 复制一遍再传出去，只说\"我改了什么\"就够了。 LangGraph 用 Reducer 决定如何把返回的局部更新合并进当前 State：没有 Reducer 标注的字段直接覆盖，用 `Annotated[list, add_messages]` 标注的字段则把新内容追加进去。","keyPoints":["**Node 签名**：接收完整 State，返回字典只包含需要更新的字段，不返回完整 State","**未出现字段**：返回值里没出现的字段，LangGraph 保持原值不动（不是置空）","**Reducer 决定合并方式**：没有 Reducer 标注的字段直接覆盖，用 Annotated[list, add_messages] 标注的字段则把新内容追加进去"],"code":[{"lang":"python","steps":["call_model 函数接收完整的 state","调用 llm_with_tools.invoke(state[\"messages\"]) 得到模型响应","返回值是一个字典，只包含发生变化的字段：messages 只放新产生的这条 response，iteration 是原值加一","没有出现在返回字典里的字段，LangGraph 会保持原样不动"],"keepCode":"def call_model(state: AgentState) -> dict:\n    response = llm_with_tools.invoke(state[\"messages\"])\n    return {\"messages\": [response], \"iteration\": state[\"iteration\"] + 1}"}],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g34_q3","qnum":3,"qtext":"`Annotated[list, add_messages]` 是什么，为什么消息历史字段要用它？","answer":{"oral":"`Annotated[list, add_messages]` 是 LangGraph 的 Reducer 语法：`add_messages` 告诉 LangGraph 不要用新值直接覆盖 `messages` 字段，而是把 Node 返回的新消息**追加**到原列表末尾，并对 `tool_call_id` 相同的消息做去重更新。 如果不加 `add_messages`，每次 Node 返回 `{\"messages\": [new_msg]}` 都会把整个 `messages` 字段替换成只含一条消息的列表，之前的对话历史全丢了。 `add_messages` 还处理了 `AIMessage` / `HumanMessage` / `ToolMessage` 的混合场景，以及工具重试时 `tool_call_id` 重复的边界情况——手写追加逻辑很容易踩这些坑。","keyPoints":["**add_messages 作用**：告诉 LangGraph 不要用新值覆盖 messages 字段，而是把 Node 返回的新消息追加到原列表末尾，并对 tool_call_id 相同的消息做去重更新","**不加的后果**：每次 Node 返回 messages 都会把整个字段替换成只含新消息的列表，之前的对话历史全丢","**边界处理**：还处理了 AIMessage/HumanMessage/ToolMessage 的混合场景，以及工具重试时 tool_call_id 重复的边界情况"],"code":[{"lang":"python","steps":["定义 AgentState 这个 TypedDict","messages 字段用 Annotated[list, add_messages] 标注，告诉 LangGraph 这个字段要用 add_messages 这个 Reducer 做合并，而不是直接覆盖","iteration 字段没有特殊标注，按默认规则直接被新值覆盖"],"keepCode":"class AgentState(TypedDict):\n    messages: Annotated[list, add_messages]\n    iteration: int"}],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易过度依赖框架的黑盒封装，出了问题不知道底层到底在做什么。"]}},{"id":"g34_q4","qnum":4,"qtext":"LangGraph 的条件边（`add_conditional_edges`）怎么用？和固定边有什么区别？","answer":{"oral":"固定边用 `add_edge(\"a\", \"b\")`，Node `a` 执行完**始终**跳到 Node `b`，不看 State 内容。 条件边用 `add_conditional_edges(\"a\", routing_fn, mapping)`：`routing_fn` 接收当前 State，返回一个字符串 key；`mapping` 把 key 映射到目标 Node 名称： `routing_fn` 只做决策，不修改 State，返回字符串——它不是 Node，不会出现在图的节点列表里，但会出现在 `draw_mermaid()` 的边标注上。 ReAct 循环里的\"继续 vs 结束\"就是最典型的二路条件边；进一步还可以扩展成工具失败走重试、成功走汇总的三路路由。","keyPoints":["**固定边**：add_edge(\"a\",\"b\")，Node a 执行完始终跳到 b，不看 State 内容","**条件边**：add_conditional_edges(\"a\", routing_fn, mapping)，routing_fn 接收 State 返回字符串 key，mapping 把 key 映射到目标 Node","**routing_fn 的定位**：只做决策不修改 State，不是 Node、不出现在节点列表里，但会出现在 draw_mermaid() 的边标注上"],"code":[{"lang":"python","steps":["定义 should_continue 函数，接收 state，取出最后一条消息","如果 iteration 已经达到 MAX_ITERATIONS，返回字符串 \"end\"","如果最后一条消息没有 tool_calls，也返回 \"end\"","否则返回 \"continue\"","用 graph.add_conditional_edges 把源节点 call_model、路由函数 should_continue，以及映射表 {\"continue\": \"call_tools\", \"end\": END} 绑在一起"],"keepCode":"graph.add_conditional_edges(\n    \"call_model\", should_continue,\n    {\"continue\": \"call_tools\", \"end\": END},\n)"}],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易过度依赖框架的黑盒封装，出了问题不知道底层到底在做什么。"]}},{"id":"g34_q5","qnum":5,"qtext":"在 LangGraph 中，`MAX_ITERATIONS` 这类静态配置应该放进 `State` 里还是写成常量？为什么？","answer":{"oral":"应该写成**常量**（或传入 `graph.compile(configurable={...})`），**不应该放进 `State`**。 原因：`State` 的设计原则是\"运行时会变化的数据\"——消息历史会随每轮对话增长，迭代计数会随每个 Node 递增，这些属于 State。`MAX_ITERATIONS` 是图的静态配置，从第一步到最后一步始终是同一个值，放进 State 会带来两个问题： 正确做法：在 `routing_fn` 或 Node 内部直接引用模块级常量 `MAX_ITERATIONS = 8`，或通过 `config` 参数传入（LangGraph 支持 `graph.invoke(state, config={\"configurable\": {\"max_iter\": 8}})`）。","keyPoints":["每个 Node 的返回字典都要带上它（即使没有改动），或者忘记带就被 Reducer 置空","让 `AgentState` 的语义变模糊——读到它的人不清楚\"这是个会变化的运行时值，还是个不变的配置\""],"code":[],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易过度依赖框架的黑盒封装，出了问题不知道底层到底在做什么。"]}},{"id":"g34_q6","qnum":6,"qtext":"LangGraph 里 Edge 有哪几种类型？分别用什么 API 创建，各自的用途是什么？","answer":{"oral":"LangGraph 的 Edge 一共有四种类型。第一种是固定边，写法是 `graph.add_edge(\"node_a\", \"node_b\")`，用途是始终跳到下一个固定节点，不看 State。第二种是条件边，写法是 `graph.add_conditional_edges(\"node_a\", routing_fn)`，用途是根据 State 内容动态决定下一步，这是实现分支路由的关键。第三种是入口边，写法是 `graph.set_entry_point(\"node_a\")`，用途是决定图从哪个 Node 开始执行。第四种是结束边，写法是 `graph.add_edge(\"node_a\", END)`，用途是决定图在哪个 Node 后结束。 一个典型的 ReAct 图会用到其中三种：`set_entry_point(\"call_model\")` 作为入口边；`call_model` 到 `call_tools` / `END` 之间用条件边（`should_continue` 决定去向）；`call_tools` 回 `call_model` 用固定边（工具执行完必然回模型，不需要判断）。`END` 本质上是 LangGraph 内置的一个特殊终止节点，`add_edge(\"node\", END)` 就是结束边的写法。 这四种类型合起来就能表达任意复杂度的流程图：入口边定起点，固定边表达确定的流转，条件边表达分叉，结束边（连到 `END`）表达终点。 **记忆点：入口边定起点、结束边定终点、固定边表达\"必然去向\"、条件边表达\"看情况去向\"——四种边组合起来就是完整的图结构。**","keyPoints":["**四种 Edge**：固定边 add_edge（始终跳到固定节点，不看 State）、条件边 add_conditional_edges（根据 State 动态决定）、入口边 set_entry_point（决定从哪个 Node 开始）、结束边 add_edge(...,END)（决定在哪个 Node 后结束）","**END 本质**：是 LangGraph 内置的特殊终止节点，add_edge(\"node\", END) 就是结束边写法","**记忆点**：入口边定起点、结束边定终点、固定边表达\"必然去向\"、条件边表达\"看情况去向\"——四种组合起来能表达任意复杂度的流程图"],"code":[],"followUp":["状态在多个节点之间传递时，你怎么保证关键信息不丢？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g35_q1","qnum":7,"qtext":"`add_conditional_edges` 的三个参数分别是什么？条件边和固定边的本质区别是什么？","answer":{"oral":"执行时机是源节点执行完、State 更新完之后：LangGraph 调用路由函数拿到 key，再去映射表查目标节点跳转。 本质区别在于：下一步去向上，固定边 `add_edge(\"a\", \"b\")` 恒定不变，`a` 执行完之后必然去 `b`；条件边 `add_conditional_edges` 则看 State 内容动态决定去哪。是否看运行时状态上，固定边不看，条件边要看。适用场景上，固定边适合无分叉的流转，条件边适合有真正分叉的流转。 **记忆点：一句话判断——下一步去哪，是不是由 State 的运行时内容决定的？是就用条件边，不是就用固定边。**","keyPoints":["**执行时机**：源节点执行完、State 更新完之后，LangGraph 调用路由函数拿到 key，再去映射表查目标节点跳转","**本质区别**：固定边下一步去向恒定不变、不看运行时状态；条件边看 State 内容动态决定，适合有真正分叉的场景","**记忆点**：一句话判断——下一步去哪是不是由 State 的运行时内容决定的，是就用条件边，不是就用固定边"],"code":[{"lang":"python","steps":["add_conditional_edges 的第一个参数是源节点名 call_tools，表示从这个节点执行完后开始判断","第二个参数是路由函数 route_after_tools，接收 state 返回一个字符串 key","第三个参数是映射表，把 retry 和 done 这两个 key 分别映射到 retry_node 和 summarize 两个目标节点"],"keepCode":"graph.add_conditional_edges(\n    \"call_tools\", route_after_tools,\n    {\"retry\": \"retry_node\", \"done\": \"summarize\"},\n)"}],"followUp":["状态在多个节点之间传递时，你怎么保证关键信息不丢？"],"pitfalls":["容易过度依赖框架的黑盒封装，出了问题不知道底层到底在做什么。"]}},{"id":"g35_q2","qnum":8,"qtext":"LangGraph 里的\"路由函数\"和\"Node\"有什么区别？路由函数有哪三条约束？","answer":{"oral":"Node 和路由函数都接收 `State`，但职责完全相反：**Node 负责\"改状态\"，路由函数负责\"看状态决定去哪\"**。 路由函数的三条约束分别是这些。第一条是只读 State，也就是只做判断、不能返回状态更新，违反了这条，返回的 dict 会被当成 key 去查找，结果找不到就报错。第二条是必须返回字符串 key，而且这个返回值必须是映射表里存在的 key，违反了这条，返回一个没有登记的 key 会直接抛出 `ValueError`。第三条是路由函数本身不是 Node，它不会出现在节点列表里，但会出现在 `draw_mermaid()` 的边标注上，这一条描述的是它的本质定位，没有单独的违反后果。 **改状态的活永远交给 Node，路由函数只读不写。**","keyPoints":["**职责相反**：Node 负责\"改状态\"，路由函数负责\"看状态决定去哪\"","**约束一**：路由函数只读 State，不能返回状态更新，否则返回的 dict 会被当成 key 查找导致报错","**约束二**：必须返回映射表里存在的字符串 key，违反会直接抛 ValueError","**约束三**：路由函数本身不是 Node，不出现在节点列表里，但会出现在 draw_mermaid() 的边标注上"],"code":[{"lang":"python","steps":["route_after_tools 函数读取 state[\"tool_ok\"]，如果为真就返回 \"done\"","如果不为真，再根据 retry_count 是否小于 MAX_RETRIES，返回 \"retry\" 或 \"done\"","注释强调不能把改状态的字典 return 出去，因为改状态是 Node 的职责，路由函数只能返回字符串 key"],"keepCode":"def route_after_tools(state) -> str:\n    if state[\"tool_ok\"]:\n        return \"done\"\n    return \"retry\" if state[\"retry_count\"] < MAX_RETRIES else \"done\""}],"followUp":["状态在多个节点之间传递时，你怎么保证关键信息不丢？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g35_q3","qnum":9,"qtext":"判断一条边该用条件边还是固定边，判断标准是什么？把该固定的边写成条件边有什么坏处？","answer":{"oral":"判断标准：**下一步去向是否由 State 的运行时内容决定**。是（有真正分叉）→ 条件边；否（恒定去向）→ 固定边。 坏处：路由函数所有分支只返回一个值时，条件边没有任何分叉价值，反而让 `draw_mermaid()` 画出一条带标注的\"假分支\"，误导读图的人以为这里有条件判断，增加理解成本。 **判据：如果路由函数所有分支最终只可能返回一个值，那它就不该是条件边。**","keyPoints":["**判断标准**：下一步去向是否由 State 的运行时内容决定，是（有真正分叉）用条件边，否（恒定去向）用固定边","**坏处**：路由函数所有分支只返回一个值时，条件边没有分叉价值，反而让 draw_mermaid() 画出带标注的\"假分支\"，误导读图的人","**判据**：如果路由函数所有分支最终只可能返回一个值，那它就不该是条件边"],"code":[{"lang":"python","steps":["反例：route_after_retry 函数不管什么情况都只返回字符串 \"back\"，然后用 add_conditional_edges 接一个只有一个 key 的映射表","这样写没有任何分叉价值，却会让 draw_mermaid() 画出一条带条件标注的假分支，误导阅读者","正例：既然只有一个确定去向，直接用 graph.add_edge(\"retry_node\", \"call_model\") 写成固定边就够了"],"keepCode":"# ❌\ndef route_after_retry(state): return \"back\"\ngraph.add_conditional_edges(\"retry_node\", route_after_retry, {\"back\": \"call_model\"})\n# ✅\ngraph.add_edge(\"retry_node\", \"call_model\")"}],"followUp":["状态在多个节点之间传递时，你怎么保证关键信息不丢？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g35_q4","qnum":10,"qtext":"给 ReAct 图加\"失败走重试、成功走汇总\"分支时，State 要新增哪些字段？为什么 retry_count 不复用 iteration？","answer":{"oral":"`tool_ok` 由 `call_tools` 节点在执行时写入（任一工具返回含 `error` 键就置 `False`），路由函数 `route_after_tools` 据此决定走 `retry` 还是 `done`。 `retry_count` 不复用 `iteration` 的原因：两者语义不同。 如果混用，一次正常的多轮对话会被误判成\"重试太多次\"而提前触发降级。State 字段要各司其职，一个字段只表达一个语义。","keyPoints":["`iteration` 统计\"模型被调用了几轮\"——正常的多步 ReAct 也会增长","`retry_count` 统计\"因工具失败而重试了几次\"——只在错误路径上增长"],"code":[{"lang":"python","steps":["在原有 AgentState 基础上新增两个字段","tool_ok 是布尔值，记录上一次工具执行是否全部成功，供路由函数判断走哪条分支","retry_count 是整数，专门统计因为工具失败而重试了多少次，和统计模型调用轮次的 iteration 字段区分开，避免语义混用"],"keepCode":"class AgentState(TypedDict):\n    messages: Annotated[list, add_messages]\n    iteration: int\n    tool_ok: bool\n    retry_count: int"}],"followUp":["这里为什么选这个框架，而不是自己拼一套流程？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g35_q5","qnum":11,"qtext":"怎么验证图在工具失败时确实走了重试分支而不是崩溃？","answer":{"oral":"核心目标是\"制造失败 → 观察到走了 `retry` 分支 → 程序没崩溃\"。 构造失败的方法：让工具对非法输入返回 `{\"error\": ...}`（如查询不支持的城市），`call_tools` 检测到 error 键把 `tool_ok` 置 `False`，路由函数返回 `\"retry\"`。关键验证点是**程序没有抛异常崩溃，而是沿着 `retry` 边流转，最终给出降级回答**——这正是条件边相比手写 `try/except + continue` 的价值：错误处理成了图里一条可命名、可观察的边。","keyPoints":["方式一：在 retry_node 函数内部直接 print 一句\"第几次重试\"的日志，最直观","方式二：用 for 循环遍历 graph.stream(initial_state) 逐个节点观察执行路径，失败场景应该能看到 call_model、call_tools、retry_node 交替出现","方式三：调用 graph.get_graph().draw_mermaid() 打印图结构，确认确实存在一条 retry 边"],"code":[],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g35_q6","qnum":12,"qtext":"`add_conditional_edges` 支持\"路由函数返回抽象 key 再查映射表\"和\"路由函数直接返回节点名\"两种写法，二者有什么区别？为什么更推荐前者？","answer":{"oral":"两种写法在三个维度上有差异：路由逻辑与节点名的关系上，写法 A 是解耦的——改节点名只需要改映射表，路由函数完全不用动；写法 B 是耦合的——改节点名要同步改路由函数里的字符串。可读性上，写法 A 的 key（`retry`/`done`）是语义化的，一眼就能看出业务含义；写法 B 直接用节点名，读代码时要绕一层才能理解语义。`draw_mermaid()` 的边标注上，写法 A 用 key 标注（`-. retry .->`），语义清晰；写法 B 用节点名标注，稍显隐晦。 推荐写法 A 的核心原因：写法 A 的 key（`retry`/`done`）表达的是\"业务语义\"，节点名（`retry_node`/`summarize`）表达的是\"实现细节\"——两者解耦之后，重命名节点（比如把 `summarize` 改成 `finalize`）只需要改映射表这一行，路由函数完全不用动；写法 B 把两者耦合在一起，任何节点改名都要跟着改路由函数内部的字符串，容易漏改导致运行时找不到节点。 **记忆点：映射表写法把\"路由决策\"和\"节点命名\"解耦，改节点名不改路由逻辑——这是写法 A 优于写法 B 的核心原因。**","keyPoints":["**写法 A（返回抽象 key 再查映射表）**：路由逻辑与节点名解耦，改节点名只需改映射表，key 语义化易读，draw_mermaid() 标注清晰","**写法 B（直接返回节点名）**：路由逻辑与节点名耦合，改节点名要同步改路由函数里的字符串，可读性和标注都较隐晦","**推荐 A 的原因**：key 表达业务语义、节点名表达实现细节，两者解耦后重命名节点只需改映射表这一行，不用动路由函数"],"code":[{"lang":"python","steps":["写法 A：路由函数 route_after_tools 返回抽象的 key（比如 retry 或 done），再通过映射表把 key 映射到具体节点名 retry_node、summarize","写法 B：路由函数直接返回目标节点名（比如 retry_node 或 summarize），add_conditional_edges 省掉映射表参数","推荐写法 A，因为改节点名只需要改映射表这一行，不用动路由函数内部的字符串，路由决策和节点命名互相解耦"],"keepCode":"# A：返回抽象 key + 映射表\ngraph.add_conditional_edges(\"call_tools\", route_after_tools,\n    {\"retry\": \"retry_node\", \"done\": \"summarize\"})\n# B：直接返回节点名\ndef route_after_tools(state): return \"retry_node\" if not state[\"tool_ok\"] else \"summarize\""}],"followUp":["状态在多个节点之间传递时，你怎么保证关键信息不丢？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}}]},{"name":"LangGraph 持久化与循环终止","questions":[{"id":"g36_q1","qnum":1,"qtext":"LangGraph 里有哪两层循环终止保护？它们分别对应什么粒度，触发行为有什么不同？","answer":{"oral":"两层终止保护：业务层的实现方式是在路由函数里比较 `state[\"iteration\"] >= MAX_ITERATIONS`，计数粒度是模型被调用的轮次（语义粒度），触发行为是走\"结束\"分支、让模型给出降级回答、优雅终止；框架层的实现方式是通过 `config = {\"recursion_limit\": N}`，计数粒度是所有 Node 执行次数之和（物理粒度），触发行为是抛出 `GraphRecursionError`，需要调用层用 try/except 捕获。 两层分工：业务层保证**语义正确**（给用户有意义的\"抱歉没查到\"），框架层保证**系统安全**（防止业务层逻辑 bug 导致真正的死循环拖垮进程）。 **记忆点：业务层管\"语义终止\"，框架层管\"系统兜底\"，两层互补不替代。**","keyPoints":["**业务层**：路由函数里比较 state[\"iteration\"]>=MAX_ITERATIONS，计数粒度是模型被调用轮次（语义粒度），触发后走\"结束\"分支优雅终止","**框架层**：通过 config={\"recursion_limit\": N}，计数粒度是所有 Node 执行次数之和（物理粒度），触发后抛 GraphRecursionError，需 try/except 捕获","**记忆点**：业务层管语义终止（给用户有意义的降级回答），框架层管系统兜底（防止逻辑 bug 导致真正死循环拖垮进程）"],"code":[{"lang":"python","steps":["导入 langgraph.errors 里的 GraphRecursionError","调用 graph.invoke 时在 config 里传入 recursion_limit 参数，限制所有节点执行次数总和的上限","用 try/except 包住这次调用，一旦触发 GraphRecursionError（说明达到框架层的物理上限），就捕获异常并返回一句\"执行超限，请简化问题后重试\"的兜底提示"],"keepCode":"try:\n    result = graph.invoke(state, config={\"recursion_limit\": 50, ...})\nexcept GraphRecursionError:\n    result = \"执行超限，请简化问题后重试\""}],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g36_q2","qnum":2,"qtext":"Checkpoint 和 State 有什么区别？`thread_id` 的作用是什么？","answer":{"oral":"`State` 是图在某一时刻的完整状态（`TypedDict` 实例），运行中只有一份\"当前状态\"；`Checkpoint` 是每个 Node 执行完后对 State 打的快照，附带 `next`（下一节点）、`created_at` 等元数据，一次图执行会产生多个历史快照。 `thread_id` 是 Checkpointer 用来隔离不同会话的键。同一图实例里，不同 `thread_id` 的快照完全独立，互不干扰。相同 `thread_id` 的多次 `invoke` 共享快照序列，后一次自动延续前一次的状态——这是多轮对话记忆和跨进程恢复的基础。","keyPoints":["**State**：图在某一时刻的完整状态（TypedDict 实例），运行中只有一份\"当前状态\"","**Checkpoint**：每个 Node 执行完后对 State 打的快照，附带 next、created_at 等元数据，一次图执行会产生多个历史快照","**thread_id**：Checkpointer 隔离不同会话的键，不同 thread_id 快照完全独立，相同 thread_id 的多次 invoke 共享快照序列并自动延续状态"],"code":[{"lang":"python","steps":["给用户 A 构造一个 config，里面 configurable.thread_id 设为 \"user-alice\"","给用户 B 构造另一个 config，thread_id 设为 \"user-bob\"","两个 thread_id 各自对应独立的快照序列，互不干扰"],"keepCode":"config_a = {\"configurable\": {\"thread_id\": \"user-alice\"}}\nconfig_b = {\"configurable\": {\"thread_id\": \"user-bob\"}}"}],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g36_q3","qnum":3,"qtext":"`MemorySaver` 怎么接入？接入后 `invoke` 时需要传哪个参数？为什么？","answer":{"oral":"必须传 `config` 的原因：Checkpointer 靠 `thread_id` 来区分不同会话的快照序列。不传 `config` 时 LangGraph 不知道这次执行属于哪个会话，无法读写正确的快照，会直接报错。 **Checkpoint 是横切关注点**：接入后节点和边的代码完全不用改，只改初始化和 `invoke` 调用处。","keyPoints":["**接入方式**：导入 MemorySaver 创建实例，compile 时作为 checkpointer 参数传入","**必须传 config 的原因**：Checkpointer 靠 thread_id 区分不同会话的快照序列，不传 config 就不知道这次执行属于哪个会话，无法读写正确快照，会直接报错","**Checkpoint 是横切关注点**：接入后节点和边的代码完全不用改，只改初始化和 invoke 调用处"],"code":[{"lang":"python","steps":["从 langgraph.checkpoint.memory 导入 MemorySaver","创建一个 MemorySaver 实例","调用 builder.compile 时把这个 memory 实例作为 checkpointer 参数传进去"],"keepCode":"memory = MemorySaver()\ngraph = builder.compile(checkpointer=memory)"},{"lang":"python","steps":["构造一个 config，里面 configurable.thread_id 指定这次调用属于哪个会话","调用 graph.invoke 时把 config 一起传进去，这样 Checkpointer 才能读写正确的快照序列"],"keepCode":"config = {\"configurable\": {\"thread_id\": \"session-1\"}}\ngraph.invoke(initial_state, config=config)"}],"followUp":["状态在多个节点之间传递时，你怎么保证关键信息不丢？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g36_q4","qnum":4,"qtext":"`interrupt_before` 是什么？`invoke(None)` 为什么能从暂停点继续执行？","answer":{"oral":"`interrupt_before` 是 `compile` 时传入的节点名列表，指定哪些节点在执行**前**自动暂停： 图执行到 `call_tools` 前，自动将当前 State 存入 Checkpoint，然后 `invoke` 返回——此时 `graph.get_state(config).next == ('call_tools',)`，说明图还未结束，在等待继续信号。 `interrupt_before` + `invoke(None)` + `update_state` 三者组合，就是 Human-in-the-loop 的完整实现基础。","keyPoints":["`None` 告诉 LangGraph \"不注入新的初始状态\"","LangGraph 从 Checkpointer 读取 `thread_id` 对应的最新快照","快照里的 `next` 字段指向 `call_tools`，图从这里继续执行"],"code":[{"lang":"python","steps":["调用 builder.compile 时传入 interrupt_before 参数，给一个节点名列表（这里是 call_tools）","表示图执行到这个节点之前会自动暂停"],"keepCode":"graph = builder.compile(checkpointer=memory, interrupt_before=[\"call_tools\"])"},{"lang":"python","steps":["暂停之后，人工确认完毕，调用 graph.invoke(None, config=config)","传 None 代表不注入新的初始状态，LangGraph 会从 Checkpointer 里读取这个 thread_id 对应的最新快照，并从快照记录的下一节点继续执行"],"keepCode":"final = graph.invoke(None, config=config)"}],"followUp":["如果不用这个框架，你会怎么手写实现一套等价的效果？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g36_q5","qnum":5,"qtext":"`MemorySaver` 和 `SqliteSaver` 各适用什么场景？切换 Checkpointer 需要改哪些代码？","answer":{"oral":"存储位置上，`MemorySaver` 存在进程内存里，`SqliteSaver` 存在磁盘 SQLite 文件里；进程重启后，`MemorySaver` 的快照会丢失，`SqliteSaver` 的快照会保留；适用场景上，`MemorySaver` 适合开发调试、单次会话验证，`SqliteSaver` 适合长任务、跨会话/跨进程恢复、生产环境。 切换只需改初始化一行，其余代码（节点、边、`invoke`、`get_state`）**零改动**： 这是\"Checkpoint 是横切关注点\"的直接体现：持久化策略和业务逻辑解耦，换存储方案不需要动图的任何业务代码。","keyPoints":["**MemorySaver**：存进程内存，进程重启快照丢失，适合开发调试、单次会话验证","**SqliteSaver**：存磁盘 SQLite 文件，进程重启快照保留，适合长任务、跨会话/跨进程恢复、生产环境","**切换成本**：只需改初始化一行（换成 SqliteSaver.from_conn_string(...)），其余 compile、invoke、get_state 等代码零改动，体现持久化策略与业务逻辑解耦"],"code":[{"lang":"python","steps":["开发阶段用 memory = MemorySaver()","切到生产阶段时，只需要改成从 langgraph.checkpoint.sqlite 导入 SqliteSaver，用 SqliteSaver.from_conn_string(\"checkpoints.db\") 创建实例","后面 compile、invoke、get_state 等所有调用代码都完全不用改，直接复用同一个 memory 变量"],"keepCode":"memory = MemorySaver()\n# 切换为：\nfrom langgraph.checkpoint.sqlite import SqliteSaver\nmemory = SqliteSaver.from_conn_string(\"checkpoints.db\")"}],"followUp":["这里为什么选这个框架，而不是自己拼一套流程？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}},{"id":"g36_q6","qnum":6,"qtext":"`graph.get_state()` 返回的 `StateSnapshot` 有哪些关键字段？如何用它判断图是处于暂停状态还是已经执行完毕？","answer":{"oral":"判断图是否暂停的关键是 `snapshot.next`：**如果 `next` 非空（如 `('call_tools',)`），说明图还没执行完，正在某个节点前等待**；如果 `next` 为空元组 `()`，说明图已经跑完到 `END`。 除了查看当前快照，`graph.get_state_history(config)` 还能拿到该 `thread_id` 下的**全部历史快照**（从新到旧的迭代器），对应一次图执行在每个 Node 执行完后打的快照序列： `get_state` 只看\"现在\"，`get_state_history` 能回溯\"图是怎么一步步走到现在的\"，两者配合是调试 Checkpoint 逻辑（比如确认某一步的 State 是否符合预期）最直接的手段。 **记忆点：`snapshot.next` 非空 = 暂停中，为空元组 = 已结束；`get_state` 看当前，`get_state_history` 看全部历史轨迹。**","keyPoints":["取到 snapshot 后判断 snapshot.next 是否非空","非空就打印\"图暂停在某节点之前，等待恢复\"","为空就打印\"图已执行完毕\""],"code":[{"lang":"python","steps":["调用 graph.get_state(config) 拿到一个 snapshot 对象","snapshot.values 是一个 dict，装着当前 State 各字段的值","snapshot.next 是一个 tuple，表示下一步要执行的节点，空元组代表已经跑完","snapshot.config 是这份快照对应的 config，snapshot.created_at 是 ISO 格式的时间戳"],"keepCode":"snapshot.values\nsnapshot.next\nsnapshot.config\nsnapshot.created_at"},{"lang":"python","steps":["用 for 循环遍历 graph.get_state_history(config)，拿到该 thread_id 下从新到旧的全部历史快照","每次循环打印 snapshot.created_at 和 snapshot.next，用来回溯图是怎么一步步走到当前状态的"],"keepCode":"for snapshot in graph.get_state_history(config):\n    print(snapshot.created_at, snapshot.next)"}],"followUp":["这个抽象在框架版本升级时，容易踩哪些兼容性的坑？"],"pitfalls":["容易把框架当成万能银弹，简单场景也套上一套复杂的图结构。"]}},{"id":"g36_q7","qnum":7,"qtext":"`SqliteSaver` 相比 `MemorySaver` 是如何实现\"跨进程恢复\"的？结合\"进程 1 暂停 → 进程 2 恢复\"的场景说明关键机制。","answer":{"oral":"`MemorySaver` 把 Checkpoint 存在进程内存里，进程一退出快照就没了；`SqliteSaver` 把 Checkpoint 写进磁盘上的 SQLite 文件，只要文件还在，任何进程都能读到同一份快照数据： 关键机制是两点：① Checkpoint 数据落盘而不是留在进程堆内存里，进程生命周期和 Checkpoint 生命周期彻底解耦；② `thread_id` 是查找快照的唯一键，只要新进程用相同的 `thread_id` 连上同一个数据库文件，就能查到上次暂停时的完整 State，`invoke(None)` 触发的仍然是\"读快照 → 从 `next` 指向的节点继续\"这套逻辑，和同进程内恢复完全一样。 **记忆点：`SqliteSaver` 把快照从进程内存搬到磁盘文件，`thread_id` 是跨进程也能找到同一份快照的钥匙——恢复逻辑本身（`invoke(None)`）不因跨进程而改变。**","keyPoints":["进程 1 用 thread_id 为 task-001 的 config 调用 graph.invoke 开始执行，在某个节点前暂停，此时快照已经写入 checkpoints.db 文件","进程 1 退出后，进程 2（可以是完全不同的新进程，甚至挂载同一份数据库文件的不同机器）用同样的 thread_id 调用 graph.invoke(None, config=...)","LangGraph 从 checkpoints.db 里按 thread_id 查到最新快照，从暂停点继续往下执行，恢复逻辑和同进程内恢复完全一样"],"code":[{"lang":"python","steps":["方式 A 用 with SqliteSaver.from_conn_string(\"checkpoints.db\") as memory 上下文管理器创建连接，在 with 块里完成 compile 和 invoke，这是推荐写法","方式 B 手动创建 memory = SqliteSaver.from_conn_string(\"checkpoints.db\")，自己管理连接生命周期，不用 with"],"keepCode":"with SqliteSaver.from_conn_string(\"checkpoints.db\") as memory:\n    graph = builder.compile(checkpointer=memory)\n    result = graph.invoke(initial_state, config=config)"}],"followUp":["这里为什么选这个框架，而不是自己拼一套流程？"],"pitfalls":["容易忽略框架版本迭代很快，网上找到的示例代码和最新 API 对不上。"]}}]},{"name":"框架选型与适用边界","questions":[{"id":"g38_q1","qnum":1,"qtext":"LangChain LCEL 和 LangGraph 各自解决了什么问题？两者是替代关系还是互补关系？","answer":{"oral":"这两者其实解决的是完全不同层面的问题。LangChain 的 LCEL 解决的是单步链路怎么标准化，说白了就是组装 Prompt、调用模型、解析输出这一整套流程里反复出现的重复劳动，核心抽象是 `Runnable` 接口配合 `|` 这个管道语法，适用的场景就是一次\"输入进去、输出出来\"的链路。LangGraph 解决的是另一个层面的问题，也就是多步流程怎么编排，专门针对状态藏得看不见、分支走向不透明、没法中断也没法持久化这些痛点，核心抽象是 `StateGraph` 加上 `Node`、`Edge`、`Checkpointer` 这一套，适用的场景是把好几个步骤组织成一张有状态的流程图。 **互补关系，不是替代关系**。LangGraph 的 Node 本质上是 LCEL `Runnable`，可以把 `prompt | model | parser` 的 LCEL 链直接挂进 LangGraph Node。实际项目里：LCEL 负责单个 Node 内部的链路组合，LangGraph 负责 Node 之间的编排和状态管理，两者配合使用。","keyPoints":["**LCEL 解决的问题**：单步链路标准化（组装 Prompt、调用模型、解析输出的重复劳动），核心抽象是 Runnable 接口配合 `|` 管道，适用一次\"输入进去、输出出来\"的链路","**LangGraph 解决的问题**：多步流程编排（状态看不见、分支不透明、无法中断也无法持久化），核心抽象是 StateGraph 加 Node、Edge、Checkpointer，适用把多步骤组织成有状态流程图","**互补而非替代**：LangGraph 的 Node 本质上是 LCEL Runnable，可把 prompt|model|parser 的 LCEL 链直接挂进 LangGraph Node——LCEL 管 Node 内部链路组合，LangGraph 管 Node 之间的编排和状态管理"],"code":[],"followUp":["如果让你重新设计这部分，你会做哪些不一样的取舍？"],"pitfalls":["容易把它当成孤立的知识点，讲不出和上下游环节的联系。"]}},{"id":"g38_q2","qnum":2,"qtext":"LangGraph 相比手写 `while` 循环具体解决了哪四个问题？","answer":{"oral":"第一个问题是状态不显式：手写 while 循环里，状态基本都窝在 `messages` 这一个列表里，你根本看不清当前跑到哪一步了，LangGraph 用 `TypedDict` 定义的 State，给每个字段都起了名字、定了类型，这个问题就解决了。第二个问题是流程没法可视化：手写代码里 `if/elif/else` 散落得到处都是，既没名字也画不出结构，LangGraph 用命名的 Node 加 Edge 组织流程，配合 `draw_mermaid()` 一行代码就能把整张图打印出来。第三个问题是没法持久化：手写 while 只要进程一崩溃，状态就全没了，长任务必须一口气跑完不能断，LangGraph 用 `MemorySaver` 或者 `SqliteSaver`，每一步执行完都自动生成快照。第四个问题是没法中断和恢复：手写函数的调用栈没法挂起，做不了 Human-in-the-loop，LangGraph 用 `interrupt_before` 配合 `invoke(None)`，就能从暂停的地方接着往下执行。 四项能力的底层逻辑都是同一件事：**State 显式化之后，持久化就是序列化 State，中断就是在某个 Node 前存快照，恢复就是反序列化快照继续执行**——这些都是自然的副产品。","keyPoints":["**状态不显式**：手写 while 状态窝在 messages 列表里看不清进度，LangGraph 用 TypedDict 定义 State，字段有名字有类型","**流程不可视化**：手写 if/elif/else 散落无结构，LangGraph 用命名 Node + Edge 组织流程，draw_mermaid() 一行画出整张图","**无法持久化**：手写 while 进程崩溃状态全丢，LangGraph 用 MemorySaver / SqliteSaver 每步自动生成快照","**无法中断恢复**：手写函数调用栈无法挂起做不了 Human-in-the-loop，LangGraph 用 interrupt_before 配合 invoke(None) 从暂停处继续执行"],"code":[],"followUp":["如果让你重新设计这部分，你会做哪些不一样的取舍？"],"pitfalls":["容易只描述做了什么，说不出设计取舍和可以改进的地方。"]}},{"id":"g38_q3","qnum":3,"qtext":"什么信号说明该引入 LangGraph？什么信号说明手写 while 够用？","answer":{"oral":"**判断口诀：不需要分支 + 不需要中断 + 不需要持久化 → 手写 while 够用；任何一个\"需要\"出现 → 考虑 LangGraph。**","keyPoints":["需要在执行中等待人工输入/确认（Human-in-the-loop）","流程有多条分支路径，分支条件依赖运行时状态","进程崩溃后需要从中断点继续，而非从头开始","需要向团队演示/调试 Agent 的执行路径","流程是线性的：用户输入 → 模型推理 → 工具执行（最多两步）","状态简单：只有 `messages` 列表，无跨步骤自定义字段","无需持久化：重启从头开始完全可以接受","无需人工介入：工具全部自动执行"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易只描述做了什么，说不出设计取舍和可以改进的地方。"]}},{"id":"g38_q4","qnum":4,"qtext":"为什么说\"LangGraph Node 本质上是 LCEL Runnable\"？实际项目里两者怎么配合使用？","answer":{"oral":"LangGraph 的 Node 函数签名（接收 `State`，返回 `dict`）本质上符合 LCEL `Runnable` 接口的语义——两者都是\"接收输入，产生输出\"的可组合单元。 **分工**：LCEL 管\"这个 Node 内部怎么处理\"（链路组合），LangGraph 管\"这些 Node 怎么串联、状态怎么传递、何时暂停\"（编排）。两层职责清晰，互不越界。","keyPoints":["用 LCEL 语法构建一个总结链：ChatPromptTemplate 生成提示词，接上 llm 调用模型，再接 StrOutputParser 解析成字符串","定义 summarize_node 函数，接收 State，从最后一条消息里取出文本内容","在节点内部调用 summarize_chain.invoke() 运行这条 LCEL 链，得到摘要","把摘要包装成 AIMessage 返回，作为这个 Node 对 State 的更新","最后用 builder.add_node() 把这个函数注册成 LangGraph 图里的一个 Node"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g38_q5","qnum":5,"qtext":"引入 LangChain 的代价是什么？哪些场景下引入它反而增加了负担？","answer":{"oral":"**代价**：引入 LangChain 的代价主要有四类。第一是依赖重，比如 `langchain-openai` 就有几十个传递依赖，安装时间长，版本冲突风险也高；第二是调试透明度降低，手写代码每一步都可以直接 `print` 查看，但 LCEL 需要把链路拆开单独 `invoke` 才能看到中间状态；第三是版本迭代快，LangChain 的破坏性变更比较频繁，升级时可能导致原来的代码失效；第四是隐藏了 API 细节，实际发出的 HTTP 请求结构、Token 计数发生在哪个环节，都被框架封装起来看不见了。 **判断标准**：链路复杂度越高（RAG、Agent、多步链路），框架收益越大；越简单越一次性，手写越合适。在简单 Demo 的规模上，LangChain 的收益不显著；到 LangGraph 多步 Agent 编排，框架统一接口的价值才真正体现。","keyPoints":["一次性脚本、简单单步调用——代码量反而比手写更多","调试优先——框架的中间状态需要额外步骤才能看到","团队不熟悉 LangChain——学习和维护成本超过收益","需要精确控制每一个 API 参数——框架封装屏蔽了部分参数"],"code":[],"followUp":["这里面你认为最关键的设计点是什么？能展开讲讲吗？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g38_q6","qnum":6,"qtext":"原生 API 手写代码里有哪三类\"重复劳动\"会在每个项目里反复出现？LCEL 的管道语法分别标准化了其中的哪一部分？","answer":{"oral":"这三类重复劳动分别是：第一是 Provider 绑定，手写方式是 `client = OpenAI(base_url=..., api_key=...)`，每次都要改的地方是换一个模型就得改调用方式；第二是链路组装，手写方式是 `messages = [{...}]; response = client.chat...; content = response.choices[0]...` 这几行，每次都要改的地方是每个项目都要重新写这三行；第三是输出解析，手写方式是 `json.loads(content)` 加 `try/except` 再加 `Pydantic(**data)`，每次都要改的地方是解析逻辑到处复制粘贴。 LCEL 用 `chain = ChatPromptTemplate.from_template(\"...\") | ChatOpenAI(...) | StrOutputParser()` 一条管道对应标准化这三类： **记忆点：LCEL 不是发明了新能力，而是把三段散装的重复代码收进一个 `Runnable` 协议里。**","keyPoints":["**Provider 绑定** → 换成 `ChatOpenAI(...)` 等 `Runnable` 实例，切换 Provider 只改初始化参数，调用方式不变","**链路组装** → `|` 操作符自动串联，不用手写 `messages` 构造和 `response.choices[0]` 解析","**输出解析** → `StrOutputParser` / `PydanticOutputParser` 把\"解析 + 校验 + 失败重试\"封装成可复用组件"],"code":[],"followUp":["这些知识点之间是怎么串联起来、构成一条完整链路的？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}},{"id":"g38_q7","qnum":7,"qtext":"手写 while 循环的三个结构性缺陷，在真实项目场景里具体会造成什么后果？","answer":{"oral":"手写 while 循环有三个结构性缺陷，每一个在真实项目里都会造成具体的后果。第一是状态隐式，也就是状态都藏在 messages 里，想知道\"这一轮调用了几个工具\"只能遍历整个 messages 数组去数 ToolMessage 的数量，要加一个新字段比如 retry_count，还得在调用方和工具执行处分别手动维护；第二是不可中断，要实现 Human-in-the-loop，只能在工具执行前用 `input()` 阻塞整个进程，没法在 web 服务里使用，因为函数栈没法挂起，也就没法\"稍后继续\"；第三是不可持久化，进程一旦崩溃，前面 20 步的工具调用全部白费，只能从头再来，长任务必须一口气跑完，不能分步保存进度。 这三类后果分别对应 LangGraph 的三项能力：`TypedDict` State 解决状态隐式、`interrupt_before` + `invoke(None)` 解决不可中断、`MemorySaver` / `SqliteSaver` 解决不可持久化。 **记忆点：手写 while 的缺陷不是\"理论上不优雅\"，而是会在具体运维场景里变成\"无法上线\"的硬伤。**","keyPoints":["**状态隐式**：想知道调用了几次工具只能遍历 messages 数 ToolMessage，加新字段要在调用方和工具处分别手动维护","**不可中断**：Human-in-the-loop 只能用 input() 阻塞整个进程，没法用于 web 服务，因为函数调用栈不能挂起","**不可持久化**：进程一旦崩溃，前面几十步工具调用全部作废，长任务必须一口气跑完不能分步保存进度"],"code":[],"followUp":["这个环节和上下游的其他组件是怎么衔接的？"],"pitfalls":["容易只会罗列单个知识点，说不清楚它们是怎么组合起来解决实际问题的。"]}}]},{"name":"Agent 框架与低代码平台","questions":[{"id":"g74_q1","qnum":1,"qtext":"LlamaIndex 和 LangChain 有什么区别？什么时候选 LlamaIndex？","answer":{"oral":"两者都是构建 LLM 应用的框架，但定位和侧重点不同。LangChain 是通用的编排框架，强调的是把模型、提示词、工具、记忆这些组件用链和 LCEL 串起来，覆盖面很广，Agent 方面又发展出了 LangGraph 做有状态的图编排。LlamaIndex 一开始就是专注于数据和 RAG 的，核心问题是怎么把私有数据接入大模型、并且检索得又准又好。它在 RAG 方面做得更深入：数据连接器非常丰富，LlamaHub 上有几百种数据源的加载器；文档解析能力强，有 LlamaParse 专门处理复杂 PDF、表格；提供了多种索引结构，向量索引、摘要索引、树形索引、知识图谱索引，适用于不同的查询类型；检索方面内置了很多高级策略，比如父子文档、句子窗口检索、自动合并检索、子问题分解、路由查询引擎；Query Engine 和 Chat Engine 的抽象让构建问答系统很快。它也有 Agent 和 Workflow 的能力，Workflow 是基于事件驱动的编排方式。选择上，如果项目的核心是知识库问答、文档检索，对检索质量要求很高，数据源多样、文档结构复杂，选 LlamaIndex 能更快做出效果好的 RAG；如果是通用的 Agent 应用，工具调用和流程编排是重点，需要复杂的状态管理和人工介入，选 LangChain 加 LangGraph 生态更成熟。两者也可以组合使用，比如用 LlamaIndex 做检索部分，封装成工具给 LangGraph 的 Agent 调用。","keyPoints":["LangChain：通用编排（LCEL、工具、记忆），Agent 方向用 LangGraph","LlamaIndex：专注数据接入与 RAG","优势：LlamaHub 数据连接器、LlamaParse 文档解析、多种索引结构","高级检索：父子文档、句子窗口、自动合并、子问题分解、路由查询引擎","知识库 / 检索质量为核心选 LlamaIndex；通用 Agent 编排选 LangGraph；可组合"],"code":[],"followUp":["你在 RAG 项目中用过哪些高级检索策略？"],"pitfalls":["认为 LlamaIndex 只能做向量检索。"]}},{"id":"g74_q2","qnum":2,"qtext":"CrewAI 和 AutoGen 分别是什么？各自适合什么场景？","answer":{"oral":"两者都是多 Agent 框架，但设计理念不同。CrewAI 是以角色扮演和团队协作为核心的：你定义一组 Agent，每个 Agent 有角色 role、目标 goal 和背景故事 backstory，再定义一组任务 Task，每个任务指定负责的 Agent 和期望输出，最后把它们组成一个 Crew 团队，选择执行流程。流程有顺序执行，任务按顺序传递，前一个的输出作为后一个的输入；还有层级执行，由一个 Manager Agent 负责分配任务和汇总结果。它的抽象很直观，像组建一个虚拟团队，上手快，适合流程比较清晰的内容生产类任务，比如市场调研、写报告、营销文案，研究员、分析师、写手分工协作。它后来也加入了 Flows 来做更精细的流程控制。AutoGen 是微软开源的，核心是对话驱动：多个 ConversableAgent 通过互相发送消息来协作，可以是两个 Agent 对话，也可以是 GroupChat 群聊，由一个管理者决定下一个发言的是谁。它的一大特色是代码执行，内置了代码执行器，可以在 Docker 沙箱里运行 Agent 写的代码，非常适合自动化编程、数据分析这类需要写代码、执行、调试的任务；另外人类可以作为一个 UserProxyAgent 参与到对话中，人机混合协作很自然。0.4 版本以后重构成了异步、事件驱动的架构。简单总结：流程化、角色分工明确的业务任务用 CrewAI；需要灵活对话、代码执行、研究型探索的场景用 AutoGen。生产环境如果需要精确控制流程、状态持久化和人工审批，很多团队会选 LangGraph。","keyPoints":["CrewAI：Agent（role、goal、backstory）+ Task + Crew，顺序 / 层级流程，上手快","适合内容生产类：调研、报告、文案的分工协作","AutoGen：对话驱动，ConversableAgent、GroupChat 动态选择发言者","AutoGen 特色：内置代码执行器（Docker 沙箱）、人类作为 UserProxyAgent 参与","需要精确控制流程与持久化的生产场景常选 LangGraph"],"code":[],"followUp":["多 Agent 框架在生产落地时最大的挑战是什么？"],"pitfalls":["不考虑任务特点，盲目用多 Agent 框架处理单 Agent 就能完成的任务。"]}},{"id":"g74_q3","qnum":3,"qtext":"OpenAI Agents SDK 的核心原语是什么？使用它有什么优势和锁定风险？","answer":{"oral":"OpenAI Agents SDK 是 OpenAI 推出的轻量级 Agent 框架，前身是实验性的 Swarm，核心原语很少：Agent，就是配置了指令、工具和模型的 LLM；Handoff，交接，一个 Agent 可以把对话控制权转交给另一个更专业的 Agent，比如分诊 Agent 识别出是退款问题，就交接给退款 Agent，交接本身也是以工具调用的形式实现的；Guardrail，护栏，对输入和输出做并行的校验，比如检测用户输入是否和业务相关、是否有恶意内容，不通过就触发异常中断执行；还有 Session 管理会话历史。另外它内置了 Tracing，Agent 的每次模型调用、工具调用、交接、护栏检查都会自动记录，可以在 OpenAI 的后台直接看执行链路，调试非常方便。Runner 负责运行 Agent 循环。优势是：概念少、代码简洁，用纯 Python 函数就能定义工具，上手很快；和 OpenAI 的模型能力深度集成，比如结构化输出、内置的网页搜索、文件搜索、Computer Use 工具都能直接用；自带可观测性。风险主要是厂商锁定：虽然它声称支持其他模型提供商，但很多高级能力，比如托管工具、追踪后台、Responses API 的特性，都和 OpenAI 的平台深度绑定，换模型时这些功能可能用不了；业务逻辑围绕它的抽象来写，迁移到别的框架要重写编排层。所以如果团队主要用 OpenAI 模型、追求快速开发，它很合适；如果需要多模型切换或者私有化部署，最好在它外面再包一层自己的抽象，或者选择模型无关的框架。","keyPoints":["原语：Agent、Handoff（交接，以工具调用实现）、Guardrail（输入输出并行校验）、Session","内置 Tracing：模型调用、工具、交接、护栏自动记录","Runner 运行 Agent 循环；纯 Python 函数定义工具","优势：概念少、上手快、深度集成 OpenAI 托管工具与结构化输出","风险：托管工具、追踪后台、Responses API 绑定 OpenAI，迁移需重写编排层"],"code":[],"followUp":["Handoff 和把子 Agent 作为工具调用（agent as tool）有什么区别？"],"pitfalls":["在需要多模型切换的项目中深度依赖厂商专有能力而不做抽象。"]}},{"id":"g74_q4","qnum":4,"qtext":"Dify、Coze、FastGPT 这类低代码 Agent 平台各有什么特点？和自研怎么选？","answer":{"oral":"这三个都是可视化搭建 LLM 应用的平台。Dify 是开源的，功能最全面，支持聊天助手、Agent、可视化工作流编排，内置知识库和 RAG 管道，可以接入几乎所有主流模型，还有应用的日志、标注和监控，支持私有化部署，在企业内部落地用得很多。Coze 是字节跳动的，扣子，拖拽式搭建 Bot，插件生态和工具市场非常丰富，最大的特点是能一键发布到飞书、微信、抖音等多个平台，非常适合快速验证想法和做 C 端的轻量应用，国内版和海外版有区别，也推出了开源版本。FastGPT 也是开源的，专注于知识库问答，在文档导入、自动切分、问答对生成、检索测试这些方面做得很细，部署资源占用相对较少，适合以文档问答为主的场景。和自研怎么选，我会看几个方面：如果是验证阶段、业务人员也要参与搭建、流程比较标准、需要快速上线，用平台效率很高，几天就能出原型；如果是核心业务、需要深度定制的交互和复杂的业务逻辑、对性能和稳定性要求高、需要和内部系统深度集成、或者要精细地做评估和持续优化，平台的限制会越来越明显，比如工作流表达能力有限、调试困难、版本管理和测试不够工程化、多租户和权限不满足需求，这时候就应该自研，或者用 LangGraph 这类代码框架。很多团队的路径是先用平台快速验证，跑通了价值再把核心链路迁移到自研。还有一种折中是用 Dify 做外围的简单应用，核心能力自研后以 API 或 MCP 的形式接入平台。","keyPoints":["Dify：开源、功能全（Agent、工作流、知识库、监控）、多模型、可私有化","Coze：拖拽搭建、插件生态丰富、一键多平台发布，适合快速验证","FastGPT：开源、专注知识库问答，文档处理细致、资源占用少","平台适合：验证阶段、业务人员参与、标准流程、快速上线","自研适合：核心业务、深度定制与集成、高性能、精细评估；常见路径是先平台验证再迁移核心链路"],"code":[],"followUp":["用 Dify 做企业知识库会遇到哪些问题？"],"pitfalls":["把复杂的核心业务全部押在低代码平台上，后期无法定制和调试。"]}},{"id":"g74_q5","qnum":5,"qtext":"用 Dify 搭建企业知识库问答时，通常会遇到哪些问题？怎么解决？","answer":{"oral":"我总结常见的有这几类问题。第一是文档解析质量：企业文档里有大量扫描件 PDF、复杂表格、图片、页眉页脚，默认的解析器处理效果一般，表格被拆散、扫描件识别不出来，直接导致后面检索不准。解决办法是在导入前做预处理，用专门的文档解析工具，比如 MinerU、LlamaParse，把文档转成结构清晰的 Markdown 再导入，或者在 Dify 里接入外部的解析服务。第二是切分策略不合适：默认按固定长度切，可能把一个完整的条款或者表格切断，上下文丢失。要根据文档类型调整，用父子分段模式，小块用来检索、大块用来提供上下文；或者按标题层级切分。第三是检索效果：纯向量检索对专有名词、产品型号、编号这类精确匹配效果差，要开启混合检索加上关键词检索，再加 Rerank 重排序模型，并调整 Top-K 和相似度阈值。第四是权限控制：不同部门、不同职级能看的文档不同，Dify 的知识库权限粒度比较粗，难以做到文档级、按用户的权限过滤，往往需要拆分多个知识库，或者通过外部知识库 API 接入自己带权限过滤的检索服务。第五是知识更新：文档频繁更新时，同步和增量更新比较麻烦，需要写脚本通过 API 定期同步。第六是效果评估：平台自带的评估能力有限，需要自己建立评估集，导出日志用 RAGAS 等工具做持续评估。第七是规模和性能：文档量很大时，默认的向量数据库配置可能需要换成 Milvus、Qdrant 这类更专业的。","keyPoints":["文档解析：扫描件、表格处理差 → 预处理用 MinerU / LlamaParse 转 Markdown","切分：固定长度切断语义 → 父子分段、按标题切分","检索：专有名词匹配差 → 混合检索 + Rerank，调整 Top-K 与阈值","权限：粒度粗 → 拆分知识库或外部知识库 API 接入带权限检索","更新与评估：API 定期增量同步；导出日志用 RAGAS 持续评估；大规模换专业向量库"],"code":[],"followUp":["文档级权限过滤，在检索前做还是检索后做？"],"pitfalls":["直接上传原始扫描件 PDF，然后怀疑是模型能力不行。"]}}]},{"name":"可观测性与成本监控","questions":[{"id":"g44_q1","qnum":1,"qtext":"\"能跑\"和\"能被观测\"有什么本质区别？Python logging 无法回答哪类问题？","answer":{"oral":"\"能跑\"指功能逻辑正确，请求进来、答案出去；\"能被观测\"指能按任意维度查询、聚合系统的运行状态——不只知道\"发生了什么\"，还能知道\"哪里慢 / 哪里贵 / 哪里频繁出错\"。 Python `logging` 输出的是非结构化文本流，有四类问题它回答不了。第一个是\"这次请求哪一步最慢\"，logging 的局限是需要手工去算时间戳差值，而且日志顺序还可能被多线程打乱；第二个是\"某次请求总共花了多少 Token\"，局限是需要扫描多行日志才能把信息关联起来，没法直接聚合；第三个是\"上周 multi_step 任务的失败率是多少\"，局限是日志没有索引，只能靠 grep 之后手动计数；第四个是\"某次失败请求的完整 Prompt 是什么\"，局限是日志通常只打印摘要，完整上下文一般不会写进日志里。 可观测性系统（LangFuse / LangSmith）把每次请求的每个步骤存成**结构化数据**，可在 Dashboard 里搜索、过滤、聚合，这是 logging 的本质差距。","keyPoints":["**本质区别**：\"能跑\"指功能逻辑正确请求进答案出，\"能被观测\"指能按任意维度查询聚合运行状态，知道哪里慢/贵/频繁出错","**logging 回答不了的问题**：这次请求哪一步最慢（需手工算时间戳且多线程顺序易乱）、单次请求总共花多少 Token（需扫描多行日志关联）","**logging 回答不了的问题（续）**：上周某类任务失败率多少（日志无索引只能 grep 手动计数）、某次失败请求的完整 Prompt 是什么（日志通常只打摘要）","**根本差距**：可观测性系统把每次请求的每个步骤存成结构化数据，可在 Dashboard 里搜索、过滤、聚合"],"code":[],"followUp":["这块的成本和延迟，你会用什么手段去监控和调优？"],"pitfalls":["容易只在开发环境验证过，没考虑生产环境下的并发和稳定性。"]}},{"id":"g44_q2","qnum":2,"qtext":"Trace 和 Span 各自是什么？在 LLM Agent 里分别对应哪些操作？","answer":{"oral":"先说 Trace，它是一次请求从进入系统到返回结果的完整记录，有一个唯一的 trace_id，放到 LLM Agent 里，对应的就是一次用户对话轮次，从收到用户消息一直到返回最终答案。Span 是 Trace 里的一个步骤，记录某个操作的开始时间、结束时间、输入和输出，对应到 LangGraph 里可以是一个 Node 的执行，也可以是一次工具调用，或者一次 LLM API 调用。Generation 则是一种特殊的 Span，专门用来记录 LLM API 调用，比普通 Span 多了 Token 用量这个字段，对应的就是每一次 `client.chat.completions.create(...)` 的调用。 Span 可以嵌套——`planner_node` 内部的 LLM 调用是 `planner_node` Span 下的一个 Generation 子 Span。","keyPoints":["最外层是一次 Trace，代表一次用户请求，总耗时 7.3 秒","Trace 下第一个 Span 是 planner_node 节点的执行，耗时 1.5 秒","第二个 Span 是一次工具调用 get_weather，耗时 0.04 秒","最后一个是一次 Generation，代表 call_model 这次 LLM API 调用，耗时 5.5 秒，并记录了 535 个输出 Token"],"code":[],"followUp":["这块的成本和延迟，你会用什么手段去监控和调优？"],"pitfalls":["容易把限流、降级这些兜底机制当成\"锦上添花\"，上线后才发现漏了。"]}},{"id":"g44_q3","qnum":3,"qtext":"LangFuse 的三种接入方式（OpenAI 拦截 / @observe 装饰器 / 手动 SDK）各自适合什么场景？","answer":{"oral":"LangFuse 其实有四种接入方式，代码改动量和适合的场景都不太一样。最简单的是拦截 client，就是把 import 换成 `from langfuse.openai import openai`，代码只改一行，这种方式适合最快接入，能自动记录所有 LLM 调用，业务逻辑一点都不用动。第二种是用 `@observe()` 装饰器，配合 `langfuse_context.update_current_trace(...)`，代码改动就是给函数加个装饰器，适合想在 Trace 上加业务语义的场景，比如加个名称、`user_id`、标签，方便之后在 Dashboard 里过滤。第三种是手动埋点，用 `lf.trace()`、`trace.generation()`、`span.end()` 这些方法自己写，代码改动量最大，但适合需要精确控制 Span 边界，或者要记录 LangFuse 自动抓不到的信息的场景，比如工具的返回值。第四种是走 LangChain 的回调 `CallbackHandler`，只需要传一个 `config={\"callbacks\": [...]}`，适合已经有 LangChain LCEL 链、想零改动就把每个 Runnable 步骤都变成 Span 的场景。 **推荐策略**：先用\"拦截 client\"快速接入，跑通后加 `@observe` 补充业务语义，最后按需在关键节点加手动 Span。","keyPoints":["**拦截 client**：把 import 换成 from langfuse.openai import openai，代码只改一行，自动记录所有 LLM 调用，适合最快接入","**@observe() 装饰器**：配合 langfuse_context.update_current_trace，给函数加装饰器，适合想在 Trace 上加名称、user_id、标签等业务语义","**手动埋点**：用 lf.trace()、trace.generation()、span.end() 自己写，改动量最大，适合需要精确控制 Span 边界或记录自动抓不到的信息","**LangChain 回调 CallbackHandler**：只需传 config={\"callbacks\":[...]}，适合已有 LCEL 链、想零改动把每个 Runnable 步骤变成 Span 的场景"],"code":[],"followUp":["如果这个组件挂了，会对整个系统造成什么影响，怎么兜底？"],"pitfalls":["容易缺少可观测性，出了问题只能靠猜，而不是看日志/指标排查。"]}},{"id":"g44_q4","qnum":4,"qtext":"在 LangFuse Dashboard 的单条 Trace 瀑布图里能读到哪些信息？对比日志文件有什么优势？","answer":{"oral":"**对比日志文件的优势**：跟日志文件比起来，LangFuse Dashboard 的优势主要体现在四个方面。比如要找某次失败的请求，日志文件只能靠 grep 加肉眼一行行扫，Dashboard 直接按 tag、状态、时间过滤，一键就能定位到。要查哪一步最慢，日志文件得自己手算时间戳的差值，Dashboard 的瀑布图直接把每个 Span 的耗时占比画出来，一眼就能看出来。想看完整的 Prompt，日志文件通常只打印摘要，根本没记全，但 Dashboard 的 Generation Span 里存的就是完整的 messages。要统计某一天花了多少钱，日志文件没法直接统计，Dashboard 按时间聚合，自动就算出来了。","keyPoints":["每个 Span 的名称、开始时间、持续时间（条形图直观显示占比）","点进 Generation Span：完整的 messages 数组（System Prompt + 历史消息 + 当前消息）、输出 content、input / output Token 数量","点进工具 Span：入参（如 `city=\"上海\"`）和返回值","Trace 层面：总耗时、总 Token、总成本（按模型定价自动计算）"],"code":[],"followUp":["如果这个组件挂了，会对整个系统造成什么影响，怎么兜底？"],"pitfalls":["容易把限流、降级这些兜底机制当成\"锦上添花\"，上线后才发现漏了。"]}},{"id":"g44_q5","qnum":5,"qtext":"LangFuse 和 LangSmith 的核心区别是什么？选型的判断标准是什么？","answer":{"oral":"LangFuse 和 LangSmith 的核心区别可以从几个方面看。开不开源上，LangFuse 是开源的，还能自部署，LangSmith 是闭源的。SDK 覆盖上，LangFuse 原生就支持 OpenAI、LangChain、LangGraph 还有手动 SDK，LangSmith 主要还是围着 LangChain/LangGraph 这个生态转。免费额度上，LangFuse 给得比较慷慨，个人和小团队够用，LangSmith 限制多一些，超了就得按量付费。国内访问的话，LangFuse 官方云版基本能访问，LangSmith 有时候不太稳定。特色功能上，LangFuse 强在 Token 成本追踪和 Prompt 版本管理，LangSmith 则强在 Prompt Hub 和内置的评估框架。","keyPoints":["项目**不依赖 LangChain** 或需要自部署 → **LangFuse**","项目**深度依赖 LangChain** 且已购买 LangSmith 订阅 → **LangSmith**","个人或小团队项目 → **LangFuse**（免费额度充足，原生 OpenAI 支持好）"],"code":[],"followUp":["如果要给多个团队共用这套基础设施，你会怎么做隔离？"],"pitfalls":["容易把限流、降级这些兜底机制当成\"锦上添花\"，上线后才发现漏了。"]}},{"id":"g44_q6","qnum":6,"qtext":"LangGraph 的 Agent 图没有原生的 LangFuse 集成，应该怎么给它加可观测性？加完之后 Trace/Span 的嵌套关系是什么样的？","answer":{"oral":"LangGraph 没有开箱即用的 LangFuse 集成，需要在每个 Node 函数上手动加 `@observe` 装饰器，并用 `langfuse_context.update_current_observation()` 记录该 Node 的输入输出： 整个 LangGraph 图的一次执行自动成为一个 Trace，每个被 `@observe` 装饰的 Node 是这个 Trace 下的一个 Span，嵌套关系自动保留： **记忆点**：LangGraph 没有框架层面的自动埋点，可观测性是\"手动加在每个 Node 上\"的，但一旦加好，Node 之间的父子调用关系会被 LangFuse 自动组织成 Trace 下的树状 Span 结构，不需要手动维护层级。","keyPoints":["给 planner_node 函数加上 @observe(name=\"planner_node\") 装饰器，让这个函数的执行自动被记录成一个 Span","函数开始时调用 langfuse_context.update_current_observation()，把当前 Span 的输入记录成 state 里的 user_request","函数内部正常调用 plan() 得到拆解出的任务列表 tasks","再次调用 update_current_observation()，把这次 Span 的输出记录成 tasks","最后返回 {\"tasks\": tasks} 作为这个 Node 对 State 的更新","整个 LangGraph 图的一次执行自动被记录成一个 Trace，总耗时 8.1 秒","planner_node 作为一个 Span，耗时 1.5 秒","executor_node 作为另一个 Span，耗时 4.2 秒，内部又嵌套了两个 Event，分别对应 get_weather 和 exchange_rate 两次工具调用","critic_node 作为最后一个 Span，耗时 2.4 秒","这个嵌套关系是 LangFuse 根据 Node 之间的调用关系自动组织出来的，不需要手动维护层级"],"code":[],"followUp":["如果要给多个团队共用这套基础设施，你会怎么做隔离？"],"pitfalls":["容易缺少可观测性，出了问题只能靠猜，而不是看日志/指标排查。"]}},{"id":"g45_q1","qnum":7,"qtext":"为什么 LLM 应用的日志必须结构化？纯文本日志有哪些致命缺陷？","answer":{"oral":"纯文本日志，比如 `logging.info(f\"完成，耗时 {t}s，tokens: {usage}\")` 这种写法，核心问题有四个。第一是字段没有统一名称，有时候写 `tokens:`，有时候写 `token_count:`，提取的时候必须针对每一种格式单独写正则；第二是数值和文本混在一起写，没法用标准库直接解析，只能手写正则，而且正则对格式变化非常脆弱；第三是没有关联 ID，多线程环境下没法把\"请求开始\"和\"请求完成\"这两行日志对应到同一次调用上；第四是没法直接聚合，想统计\"上周总成本\"就得先把数字一条条提取出来再累加，每次都是重新做一次性的工程。 结构化日志把每条记录存为独立的 JSON 对象（JSONL 格式），任何字段都可以用 `json.loads()` 直接解析，用 `jq` 或 Python `filter` 做任意维度的查询和聚合，不需要正则。","keyPoints":["**字段无统一命名**：有时写 tokens:，有时写 token_count:，提取时要为每种格式单独写正则","**数值文本混杂难解析**：没法用标准库直接解析，只能手写正则，且对格式变化非常脆弱","**没有关联 ID**：多线程环境下没法把\"请求开始\"和\"请求完成\"两行日志对应到同一次调用","**没法直接聚合**：统计总成本要先把数字一条条提取出来再累加，每次都要重新做一次性工程"],"code":[],"followUp":["如果要给多个团队共用这套基础设施，你会怎么做隔离？"],"pitfalls":["容易只在开发环境验证过，没考虑生产环境下的并发和稳定性。"]}},{"id":"g45_q2","qnum":8,"qtext":"结构化日志里 trace_id / tokens / cost / latency 四个字段各自的作用是什么？","answer":{"oral":"trace_id、tokens、cost、latency 这四个字段各自的作用不一样。第一个是 trace_id，作用是把同一次请求产生的多条日志行（request_start / tool_call / request_complete）关联在一起，多线程下也不用依赖时间戳去对齐。第二个是 tokens_input 和 tokens_output，这是原子级的成本记录，之所以要把 input 和 output 分开记，是因为两者定价不同（output 通常贵 3-4 倍），另外也方便排查\"哪次请求 Prompt 过长\"。第三个是 cost_usd，存的是已经换算好的美元成本，直接 sum 就能拿到总花费，不用在分析的时候再去查一遍定价表。第四组是 latency_total_ms、latency_llm_ms、latency_tool_ms 这三层耗时，total 是用户体验指标，llm 用来判断模型本身的延迟，tool 用来定位哪个工具慢，三者之和大致等于 total。","keyPoints":["**trace_id**：把同一次请求的多条日志行（request_start/tool_call/request_complete）关联在一起，多线程下不用靠时间戳对齐","**tokens_input/tokens_output**：分开记录是因为两者定价不同（output 通常贵 3-4 倍），也便于排查哪次请求 Prompt 过长","**cost_usd**：存已换算好的美元成本，直接 sum 就能拿到总花费，不用再查定价表","**latency 三层**：total 是用户体验指标，llm 判断模型本身延迟，tool 定位哪个工具慢，三者之和大致等于 total"],"code":[],"followUp":["如果要给多个团队共用这套基础设施，你会怎么做隔离？"],"pitfalls":["容易只在开发环境验证过，没考虑生产环境下的并发和稳定性。"]}},{"id":"g45_q3","qnum":9,"qtext":"tokens_input 和 tokens_output 为什么要分开记录？cost 字段的计算公式是什么？","answer":{"oral":"例如 DeepSeek-chat（input $0.14/1M，output $0.28/1M），一次请求 312 input + 535 output：","keyPoints":["**定价不同**：几乎所有模型都对 output token 收取更高费用（通常是 input 的 2-4 倍），合并记录会丢失成本结构信息","**排查方向不同**：`tokens_input` 偏大 → Prompt 过长（优化 System Prompt 或压缩上下文）；`tokens_output` 偏大 → 模型回答冗长（在 Prompt 里加\"请简洁回答\"约束）"],"code":[{"lang":"python","steps":["用 tokens_input 乘以每百万输入 Token 的单价，得到输入部分的花费","用 tokens_output 乘以每百万输出 Token 的单价，得到输出部分的花费","两部分相加，再除以 1,000,000，把单价换算成实际 Token 数对应的费用，得到 cost_usd"],"keepCode":"cost_usd = (tokens_input × price_input_per_1M + tokens_output × price_output_per_1M) / 1_000_000"},{"lang":null,"steps":["代入具体数字：312 个输入 Token，单价 0.14 美元/百万；535 个输出 Token，单价 0.28 美元/百万","分别算出输入费用约 43.68、输出费用约 149.8，单位是百万分之一美元","两者相加约 193.48，再除以 1,000,000，得到这次请求的总成本约 0.000193 美元"],"keepCode":"cost = (312 × 0.14 + 535 × 0.28) / 1_000_000 ≈ $0.000193"}],"followUp":["流量突然涨上来的时候，这套机制扛得住吗？"],"pitfalls":["容易只在开发环境验证过，没考虑生产环境下的并发和稳定性。"]}},{"id":"g45_q4","qnum":10,"qtext":"latency_total / latency_llm / latency_tool 三个耗时字段各自能排查什么性能问题？","answer":{"oral":"这三个耗时字段各自能排查的问题也不一样。latency_total_ms 反映的是用户侧感知到的总延迟，用来判断是否超过 SLA 阈值，典型能发现的问题是某类请求总耗时突然增加了 3 倍。latency_llm_ms 反映的是模型 API 的延迟，用来判断瓶颈是不是出在 LLM 调用上，比如算出 llm/total 超过 80%，就该考虑换更快的模型或者开启流式输出。latency_tool_ms 反映的是工具调用的延迟，用来定位哪个工具最慢，典型发现是某天 tool_ms 突然暴增，说明外部 API 出问题了。 **排查流程**：先看 `latency_total` 找到慢请求 → 比较 `latency_llm` 和 `latency_tool` 确定瓶颈在哪一层 → 针对性优化（缓存 / 换模型 / 修工具实现）。","keyPoints":["latency_total 约等于 latency_llm 加上 latency_tool 再加上业务逻辑本身的耗时","也就是说总延迟可以拆解成模型调用时间、工具调用时间和业务代码处理时间三部分之和"],"code":[],"followUp":["流量突然涨上来的时候，这套机制扛得住吗？"],"pitfalls":["容易只在开发环境验证过，没考虑生产环境下的并发和稳定性。"]}},{"id":"g45_q5","qnum":11,"qtext":"LangFuse Dashboard 和本地结构化 JSONL 日志如何分工协作？","answer":{"oral":"这两者其实是处理不同粒度、不同访问方式需求的，正好互补。想知道\"这次请求为什么这么慢\"，就用 LangFuse Dashboard，因为瀑布图直接把每个 Span 的耗时展示出来，点进去还能看到完整的 Prompt。想知道\"上周总共花了多少钱\"，反而用本地 JSONL 脚本更方便，一条 jq 或者 Python 的 sum 命令就出结果了，都不用调 API。想知道\"哪个功能最贵\"，也是用本地 JSONL 脚本，因为可以按 function_name 分组聚合，分析逻辑自己随便定制。想看\"某次报错的完整上下文\"，还是回到 LangFuse Dashboard，因为它存的是完整的 messages 数组，本地日志通常只留了摘要。想看\"最近 30 天的成本趋势图\"，又是本地 JSONL 脚本更合适，因为数据全量都在本地，不会受账号套餐的数据保留期限制。 **最佳实践**：同时运行两者。LangFuse 用于实时调试（细粒度、有 UI），本地 JSONL 用于批量分析（灵活、无依赖、可永久保留）。","keyPoints":["**LangFuse Dashboard**：适合查\"这次请求为什么慢\"（瀑布图展示每个 Span 耗时）和\"某次报错的完整上下文\"（存完整 messages 数组）","**本地 JSONL 脚本**：适合查\"上周总共花多少钱\"（一条 sum 命令出结果不用调 API）、\"哪个功能最贵\"（按 function_name 分组自定义聚合）、\"近30天成本趋势\"（数据全量本地不受套餐保留期限制）","**最佳实践**：同时运行两者，LangFuse 用于实时细粒度调试，本地 JSONL 用于批量分析、灵活且可永久保留"],"code":[],"followUp":["这块的成本和延迟，你会用什么手段去监控和调优？"],"pitfalls":["容易把限流、降级这些兜底机制当成\"锦上添花\"，上线后才发现漏了。"]}},{"id":"g45_q6","qnum":12,"qtext":"LLM 调用日志里为什么要记录调用来源功能（function_name）字段？它在成本归因里起什么作用？","answer":{"oral":"同一个 Agent 往往有多个功能入口（天气查询/行程规划/汇率换算），只有按 `function_name` 分组聚合，才能知道\"哪个功能最贵\"，而不是只看到一个模糊的总成本数字： 如果没有 `function_name` 这个维度，266 条日志汇总出的\"合计 0.0426 USD\"只是一个数字，无法回答\"接下来该优化哪个功能\"——这正是\"知道花了多少\"和\"知道哪里花多了\"之间的关键差距。","keyPoints":["把最近 7 天的日志按 function_name 分组聚合，分别统计每个功能的总成本、调用次数和平均单次成本","travel_planner 总成本 0.82 美元，调用 47 次，平均每次 0.017 美元","weather_query 总成本 0.23 美元，调用 158 次，平均每次 0.0015 美元","exchange_rate 总成本 0.04 美元，调用 61 次，平均每次 0.00066 美元","对比后发现 travel_planner 只调用了 47 次，却占了总成本的 75%，说明这是最该优化的功能"],"code":[],"followUp":["如果要给多个团队共用这套基础设施，你会怎么做隔离？"],"pitfalls":["容易只在开发环境验证过，没考虑生产环境下的并发和稳定性。"]}},{"id":"g45_q7","qnum":13,"qtext":"LLM 成本报表里，“按天”和“按功能”两种聚合视角各自回答的是什么问题？","answer":{"oral":"按天（`report_by_day`）视角回答的是\"成本是不是在趋势性变化\"——把请求数、总成本、Token、均耗时按日期排列，典型能发现某天成本突然翻倍，可能是流量激增或某次改动导致 Prompt 变长；按功能（`report_by_func`）视角回答的是\"钱花在了哪个功能上\"——按 `function_name` 分组，同时统计每个功能的错误数，典型能发现 `travel_planner` 请求数少但成本占比高，优化优先级一下就明确了。 `report_by_func` 还额外统计了每个功能的 `errors` 数（从 `event=\"error\"` 的日志行里聚合），这是按天视角没有的维度——按功能视角同时回答\"哪个功能贵\"和\"哪个功能不稳定\"两个问题。 **记忆点**：两种聚合视角不是互相替代，而是分别回答\"什么时候变贵了\"和\"哪里变贵了\"两个不同的问题，实际排查时往往先看按天发现异常，再切到按功能定位原因。","keyPoints":["**按天（report_by_day）**：回答\"成本是不是在趋势性变化\"，按日期排列请求数/总成本/Token/均耗时，能发现某天成本突然翻倍","**按功能（report_by_func）**：回答\"钱花在了哪个功能上\"，按 function_name 分组并额外统计每个功能的 errors 数","**两者关系**：不是互相替代，分别回答\"什么时候变贵了\"和\"哪里变贵了\"，排查时先看按天发现异常，再切到按功能定位原因"],"code":[],"followUp":["流量突然涨上来的时候，这套机制扛得住吗？"],"pitfalls":["容易只在开发环境验证过，没考虑生产环境下的并发和稳定性。"]}}]},{"name":"缓存与批处理","questions":[{"id":"g46_q1","qnum":1,"qtext":"精确匹配缓存和语义缓存的核心区别是什么？各自适合哪类场景？","answer":{"oral":"精确匹配缓存和语义缓存的核心区别可以从几个角度看。命中条件上，精确匹配要求请求内容的哈希值完全一样才算命中，语义缓存则是看查询向量和已缓存向量的余弦相似度有没有超过阈值。命中率上差别就很明显了，精确匹配比较低，字符串稍微差一点就 miss 了，语义缓存高很多，哪怕换种说法，只要语义相近都能命中。但语义缓存也有代价，一个是误命中风险，精确匹配基本不会误命中，语义缓存的阈值要是设低了，语义不一样的问题也可能返回错误答案；另一个是额外成本，精确匹配没有额外开销，语义缓存得付 Embedding API 的调用费用。实现复杂度上也是精确匹配简单得多，只要 hash 加一个 KV 存储就够了，语义缓存则需要引入 Embedding 和向量数据库，复杂不少。 **推荐路径**：先上精确匹配，命中率 < 30% 再升级语义缓存。","keyPoints":["**精确匹配**：完全固定的查询（批量处理同一批数据、FAQ 精确问题、SDK 文档的代码生成）","**语义缓存**：自然语言输入（用户可能用不同表述问同一个问题，适合对话式产品）"],"code":[],"followUp":["如果这个组件挂了，会对整个系统造成什么影响，怎么兜底？"],"pitfalls":["容易只在开发环境验证过，没考虑生产环境下的并发和稳定性。"]}},{"id":"g46_q2","qnum":2,"qtext":"缓存键必须包含哪些字段？漏掉某个字段会导致什么问题？","answer":{"oral":"漏掉不同的字段会导致不同的问题。漏掉 model，会出现换了模型之后还命中旧模型缓存的情况，返回的答案质量完全不对；漏掉 temperature，会导致 temperature=0（确定性输出）和 temperature=0.9（随机输出）共用同一份缓存，而这两种结果的性质完全不同；漏掉 system_prompt，给不同角色（比如客服和技术助手）设置了不同的 System Prompt 时，会错误地命中彼此的缓存；漏掉 messages 也就是历史消息，多轮对话中如果只用最后一条消息做 key，就会忽略掉上下文，导致同样一句话在不同的对话上下文下返回了同一份缓存结果。","keyPoints":["**漏掉 model**：会命中旧模型的缓存，返回的答案质量完全不对","**漏掉 temperature**：会导致 temperature=0（确定性输出）和 temperature=0.9（随机输出）共用同一份缓存","**漏掉 system_prompt**：不同角色（客服、技术助手）设置不同 System Prompt 时会错误命中彼此的缓存","**漏掉 messages**：多轮对话只用最后一条消息做 key 会忽略上下文，同一句话在不同对话上下文下返回同一份缓存结果"],"code":[{"lang":"python","steps":["缓存键由 model、temperature、system_prompt、messages 四个字段拼接后做哈希得到","只要这四个字段中任意一个不同，算出来的缓存键就不同，不会互相命中"],"keepCode":"缓存键 = hash(model + temperature + system_prompt + messages)"}],"followUp":["如果这个组件挂了，会对整个系统造成什么影响，怎么兜底？"],"pitfalls":["容易把限流、降级这些兜底机制当成\"锦上添花\"，上线后才发现漏了。"]}},{"id":"g46_q3","qnum":3,"qtext":"语义缓存的相似度阈值如何选取？阈值过高 / 过低各有什么风险？","answer":{"oral":"相似度阈值的选取要权衡命中率和准确性：阈值过高（0.99+）时，命中率极低，接近精确匹配，风险是语义缓存几乎没有收益；阈值取推荐区间（0.90–0.95）时，命中率和准确性比较平衡，但仍需要针对具体业务做验证；阈值过低（< 0.85）时，命中率会变高，但会出现误命中，比如\"北京天气\"和\"上海天气\"可能互相命中，返回错误城市的答案。","keyPoints":["收集 50–100 对\"应该命中\"和\"不应该命中\"的样本对","计算每对的余弦相似度，找到能正确区分两类的分界点","取分界点往高处偏移一点（宁可少命中，不能误命中）"],"code":[],"followUp":["这块的成本和延迟，你会用什么手段去监控和调优？"],"pitfalls":["容易缺少可观测性，出了问题只能靠猜，而不是看日志/指标排查。"]}},{"id":"g46_q4","qnum":4,"qtext":"缓存失效策略有哪几种？含\"今天\"/\"实时\"这类词语的查询应该如何处理？","answer":{"oral":"**三种失效策略**：缓存失效有三种策略：TTL（被动过期），机制是读取时检查时间戳，超时就视为失效，适用于大多数场景，实现简单；基于内容特征，机制是检测到时效性关键词就跳过缓存或用超短 TTL，适用于含\"今天/实时/当前\"这类词语的查询；主动失效，机制是数据源更新时主动调用 `cache_delete(key)`，适用于有明确更新事件的场景（比如产品信息变更）。","keyPoints":["命中关键词 → 跳过缓存（直接调 LLM）或使用极短 TTL（如 5 分钟）","未命中关键词 → 正常缓存流程","定义 NO_CACHE_KEYWORDS 列表，包含“现在”“今天”“最新”“实时”“当前”“刚刚”等时效性关键词","should_skip_cache 函数检查用户输入里是否包含列表中任意一个关键词","用 any() 遍历关键词列表做包含判断，只要命中一个就返回 True，表示应该跳过缓存"],"code":[],"followUp":["流量突然涨上来的时候，这套机制扛得住吗？"],"pitfalls":["容易只在开发环境验证过，没考虑生产环境下的并发和稳定性。"]}},{"id":"g46_q5","qnum":5,"qtext":"语义缓存自身也要调用 Embedding API，这个成本如何考量？什么情况下语义缓存不划算？","answer":{"oral":"Embedding 成本通常是 LLM 成本的 1/10 到 1/100，所以只要命中率足够高，净收益为正。 **语义缓存不划算的情况**：语义缓存不划算的情况大概有四种
