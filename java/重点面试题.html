<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Java 后端高频面试题（重点版）｜重点刷题工具</title>
<style>
:root{
  --bg:#f4f5f8;
  --bg-elevated:#ffffff;
  --bg-card:#ffffff;
  --text:#1a1d29;
  --text-secondary:#5b6072;
  --text-muted:#8a8fa3;
  --border:#e6e8f0;
  --border-strong:#d7dae6;
  --primary:#4f46e5;
  --primary-dark:#4338ca;
  --primary-soft:#eef0ff;
  --accent-high:#e0403a;
  --accent-high-soft:#fdeceb;
  --accent-mid:#e08a1c;
  --accent-mid-soft:#fdf3e4;
  --accent-low:#7a8094;
  --accent-low-soft:#eef0f4;
  --success:#12a150;
  --success-soft:#e6f7ee;
  --danger:#e0403a;
  --shadow:0 2px 12px rgba(20,22,40,.06);
  --shadow-lg:0 12px 32px rgba(20,22,40,.16);
  --radius:14px;
  --radius-sm:9px;
  --sidebar-w:300px;
  --topbar-h:56px;
  --bottombar-h:50px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="dark"]{
  --bg:#14151d;
  --bg-elevated:#1b1d28;
  --bg-card:#20222f;
  --text:#eceef5;
  --text-secondary:#a8acc0;
  --text-muted:#767b90;
  --border:#2c2f3f;
  --border-strong:#3a3d50;
  --primary:#818cf8;
  --primary-dark:#6366f1;
  --primary-soft:#26263d;
  --accent-high:#f26a63;
  --accent-high-soft:#3a2229;
  --accent-mid:#f0a94e;
  --accent-mid-soft:#3a2f1c;
  --accent-low:#9298ad;
  --accent-low-soft:#282a37;
  --success:#3ecb7e;
  --success-soft:#183726;
  --danger:#f26a63;
  --shadow:0 2px 12px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#14151d;
    --bg-elevated:#1b1d28;
    --bg-card:#20222f;
    --text:#eceef5;
    --text-secondary:#a8acc0;
    --text-muted:#767b90;
    --border:#2c2f3f;
    --border-strong:#3a3d50;
    --primary:#818cf8;
    --primary-dark:#6366f1;
    --primary-soft:#26263d;
    --accent-high:#f26a63;
    --accent-high-soft:#3a2229;
    --accent-mid:#f0a94e;
    --accent-mid-soft:#3a2f1c;
    --accent-low:#9298ad;
    --accent-low-soft:#282a37;
    --success:#3ecb7e;
    --success-soft:#183726;
    --danger:#f26a63;
    --shadow:0 2px 12px rgba(0,0,0,.35);
    --shadow-lg:0 12px 32px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI","Microsoft YaHei",sans-serif;
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
ul{margin:0;padding:0;list-style:none;}
input,select,button{font-size:16px;}

#app{
  display:flex;
  height:100dvh;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);
  max-width:86vw;
  background:var(--bg-elevated);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  height:100%;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:60;
  transform:translateX(-100%);
  transition:transform .25s ease;
  padding-top:var(--safe-t);
}
.sidebar.open{transform:translateX(0);}
body.desktop .sidebar{
  position:relative;
  transform:none;
  transition:width .2s ease;
  flex-shrink:0;
}
body.desktop .sidebar.collapsed{width:0;border-right:none;overflow:hidden;}

.overlay{
  position:fixed;inset:0;background:rgba(10,10,20,.45);
  z-index:55;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}
body.desktop .overlay{display:none;}

.sidebar-header{
  display:flex;align-items:center;gap:8px;
  padding:14px 14px 10px;
  border-bottom:1px solid var(--border);
}
.sidebar-title-text{
  flex:1;min-width:0;font-weight:700;font-size:15.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-width:44px;min-height:44px;
  border:none;background:transparent;color:var(--text);
  border-radius:10px;cursor:pointer;
  font-size:15px;
}
.icon-btn:active{background:var(--primary-soft);}

.sidebar-search{padding:10px 14px 0;}
.sidebar-search input{
  width:100%;height:44px;
  border:1px solid var(--border-strong);
  background:var(--bg);color:var(--text);
  border-radius:var(--radius-sm);
  padding:0 14px;
}
.sidebar-search input:focus{outline:2px solid var(--primary);outline-offset:1px;}

.sidebar-filters{padding:10px 14px 0;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin:0;padding:2px;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-row .chip{flex:none;}
.chip{
  min-height:36px;padding:0 12px;
  border-radius:999px;border:1px solid var(--border-strong);
  background:var(--bg);color:var(--text-secondary);
  font-size:13px;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

.sidebar-stats{
  padding:10px 14px;font-size:12.5px;color:var(--text-muted);
  border-bottom:1px solid var(--border);
}

.sidebar-list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px;}
.cat-group{border-bottom:1px solid var(--border);}
.cat-group-title{
  display:flex;align-items:center;gap:6px;
  padding:12px 14px;
  font-weight:700;font-size:14px;color:var(--text-secondary);
  cursor:pointer;user-select:none;
  min-height:44px;
}
.cat-group-title:active{background:var(--primary-soft);}
.cat-group-title .chevron{transition:transform .15s ease;display:inline-block;flex-shrink:0;}
.cat-group-title.collapsed .chevron{transform:rotate(-90deg);}
.cat-group-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-group-count{font-size:12px;color:var(--text-muted);font-weight:600;}

.question-list{padding:0 8px 8px;}
.question-list.collapsed{display:none;}
.q-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:10px 8px;border-radius:10px;cursor:pointer;
  min-height:44px;
}
.q-item:active{background:var(--primary-soft);}
.q-item.current{background:var(--primary-soft);}
.q-item.current .q-item-text{color:var(--primary-dark);font-weight:600;}
.q-item-num{
  flex-shrink:0;width:26px;height:26px;border-radius:8px;
  background:var(--bg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--text-muted);margin-top:1px;
}
.q-item.current .q-item-num{background:var(--primary);border-color:var(--primary);color:#fff;}
.q-item-body{flex:1;min-width:0;}
.q-item-text{
  font-size:13.5px;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.q-item-tags{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;}
.mini-badge{
  font-size:10.5px;padding:1px 6px;border-radius:6px;font-weight:600;
}
.mini-badge.freq-高频{background:var(--accent-high-soft);color:var(--accent-high);}
.mini-badge.freq-中频{background:var(--accent-mid-soft);color:var(--accent-mid);}
.mini-badge.freq-低频{background:var(--accent-low-soft);color:var(--accent-low);}
.mini-badge.star{background:var(--success-soft);color:var(--success);}
.empty-hint{padding:24px 14px;color:var(--text-muted);font-size:13.5px;text-align:center;}

/* ---------- Main ---------- */
.main{
  flex:1;min-width:0;height:100%;
  display:flex;flex-direction:column;
  overflow:hidden;
}
.topbar{
  height:var(--topbar-h);
  padding-top:var(--safe-t);
  display:flex;align-items:center;gap:8px;
  padding-left:10px;padding-right:10px;
  border-bottom:1px solid var(--border);
  background:var(--bg-elevated);
  flex-shrink:0;
}
.topbar-title{flex:1;min-width:0;}
.tool-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tool-progress{font-size:12px;color:var(--text-muted);}
.topbar-actions{display:flex;gap:2px;}

.content{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(var(--bottombar-h) + var(--safe-b) + 24px);
}
body.desktop .content{padding-bottom:24px;}

.question-card{
  max-width:760px;margin:0 auto;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 18px 20px;
  box-shadow:var(--shadow);
}
.q-meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;
  border:none;cursor:pointer;min-height:30px;
}
.badge.freq-高频{background:var(--accent-high-soft);color:var(--accent-high);}
.badge.freq-中频{background:var(--accent-mid-soft);color:var(--accent-mid);}
.badge.freq-低频{background:var(--accent-low-soft);color:var(--accent-low);}
.meta-actions{margin-left:auto;display:flex;align-items:center;gap:2px;}
.icon-toggle-btn{
  min-width:44px;min-height:36px;border:none;background:transparent;
  font-size:20px;cursor:pointer;color:var(--text-muted);
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-toggle-btn.star.active{color:#f5b400;}
.icon-toggle-btn.mastered.active{color:var(--success);}

.q-title{font-size:19px;line-height:1.5;margin:6px 0 14px;font-weight:700;}

.answer-panel{margin-top:16px;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.answer-section{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 14px 12px;margin-bottom:12px;
}
.answer-section h3{margin:0 0 8px;font-size:14.5px;font-weight:700;color:var(--text);}
.oral-text{white-space:pre-wrap;font-size:15px;color:var(--text-secondary);line-height:1.85;}
.keypoints-list li{
  position:relative;padding-left:18px;margin-bottom:8px;font-size:14.5px;color:var(--text);line-height:1.6;
}
.keypoints-list li:before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--primary);}
.answer-section.optional ul li{
  padding-left:16px;position:relative;margin-bottom:7px;font-size:13.5px;color:var(--text-secondary);line-height:1.6;
}
.answer-section.optional ul li:before{
  content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;
  border-radius:50%;background:var(--text-muted);
}
code{
  background:var(--primary-soft);color:var(--primary-dark);
  padding:1px 5px;border-radius:5px;font-size:.92em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
strong{color:var(--text);}

.back-top-btn{
  position:fixed;right:16px;
  bottom:calc(var(--bottombar-h) + var(--safe-b) + 16px);
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--bg-card);color:var(--text);box-shadow:var(--shadow-lg);
  font-size:18px;cursor:pointer;z-index:40;
}
body.desktop .back-top-btn{bottom:24px;}

/* ---------- Bottom bar ---------- */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;width:100%;box-sizing:border-box;
  height:calc(var(--bottombar-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:var(--bg-elevated);border-top:1px solid var(--border);
  display:flex;gap:6px;padding-left:8px;padding-right:8px;align-items:center;
  z-index:50;
}
body.desktop .bottom-bar{
  position:sticky;
}
.bottom-btn{
  flex:1;min-height:36px;border-radius:9px;border:none;white-space:nowrap;
  background:var(--bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
}
.bottom-btn.primary{background:var(--primary);color:#fff;flex:1.3;margin:0 8px;}
.bottom-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Bottom sheet ---------- */
.sheet-overlay{
  position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:80;
}
.bottom-sheet{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--bg-elevated);
  border-radius:18px 18px 0 0;
  padding:10px 18px calc(20px + var(--safe-b));
  z-index:81;max-height:70vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
  animation:slideUp .2s ease;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:40px;height:4px;background:var(--border-strong);border-radius:99px;margin:2px auto 14px;}
.sheet-title{font-weight:700;font-size:15.5px;margin-bottom:8px;}
.sheet-text{font-size:14px;color:var(--text-secondary);line-height:1.7;}
.sheet-close-btn{
  margin-top:16px;width:100%;min-height:46px;border-radius:12px;border:none;
  background:var(--primary);color:#fff;font-weight:700;
}
.sheet-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px;min-height:44px;border-bottom:1px solid var(--border);cursor:pointer;font-size:15px;
}
.sheet-option:last-of-type{border-bottom:none;}
.sheet-option.active{color:var(--primary);font-weight:700;}

/* jump modal (also uses sheet look on mobile, centered card on desktop) */
.jump-modal{
  position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--bg-elevated);border-radius:16px;padding:20px;
  width:min(320px,86vw);box-shadow:var(--shadow-lg);
}
.jump-modal input{
  width:100%;height:46px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--bg);color:var(--text);padding:0 12px;margin-bottom:12px;text-align:center;font-size:18px;
}
.jump-modal button{
  width:100%;min-height:46px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-weight:700;
}
.toast{
  position:fixed;left:50%;bottom:calc(var(--bottombar-h) + var(--safe-b) + 24px);
  transform:translateX(-50%);
  background:rgba(20,20,30,.9);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13.5px;z-index:95;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.toast.show{opacity:1;}

/* Desktop layout tweaks */
@media (min-width:900px){
  .content{padding:22px 24px 24px;}
  .bottom-bar{
    width:100%;max-width:760px;margin:0 auto 16px;position:sticky;
    border-radius:12px;border:none;box-shadow:var(--shadow-lg);
    height:var(--bottombar-h);padding-bottom:0;
  }
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}

@media (max-width: 380px){
  .q-title{font-size:17.5px;}
  .badge{font-size:12px;padding:4px 9px;}
}
</style>
</head>
<body>

<div id="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar" aria-label="题目目录">
    <div class="sidebar-header">
      <div class="sidebar-title-text" id="sidebarTitleText"></div>
      <button class="icon-btn" id="closeSidebarBtn" aria-label="关闭目录">✕</button>
    </div>
    <div class="sidebar-search">
      <input id="searchInput" type="search" placeholder="搜索题干、答案、要点或标签…" aria-label="搜索题目">
    </div>
    <div class="sidebar-filters">
      <div class="filter-row" id="freqFilterRow">
        <button class="chip active" data-freq="all">全部</button>
        <button class="chip" data-freq="高频">🔥 高频</button>
        <button class="chip" data-freq="中频">⚡ 中频</button>
        <button class="chip" data-freq="低频">📌 低频</button>
        <button class="chip" data-freq="star">★ 收藏</button>
        <button class="chip" data-freq="mastered">✅ 已掌握</button>
        <button class="chip" data-freq="unmastered">📝 未掌握</button>
      </div>
    </div>
    <div class="sidebar-stats" id="sidebarStats"></div>
    <div class="kg-filter-banner" id="kgFilterBanner" style="display:none;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;margin:0 12px 8px;border-radius:10px;background:var(--primary-soft);color:var(--primary-dark);font-size:12.5px;cursor:pointer;">
      <span class="kg-banner-text">🕸 来自知识图谱的关联题目</span>
      <span style="opacity:.7;">✕ 清除</span>
    </div>
    <div class="sidebar-list-wrap" id="sidebarListWrap"></div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" id="openSidebarBtn" aria-label="打开目录">☰ 目录</button>
      <div class="topbar-title">
        <div class="tool-title" id="toolTitle"></div>
        <div class="tool-progress" id="toolProgress"></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="randomBtn" title="随机一题" aria-label="随机一题">🎲</button>
        <button class="icon-btn" id="jumpBtnTop" title="跳转题号" aria-label="跳转题号">#</button>
        <button class="icon-btn" id="darkModeBtn" title="切换深色模式" aria-label="切换深色模式">🌙</button>
      </div>
    </header>

    <div class="content" id="content">
      <div class="question-card" id="questionCard">
        <div class="q-meta-row">
          <button class="badge" id="freqBadge"></button>
          <div class="meta-actions">
            <button class="icon-toggle-btn star" id="favBtn" aria-label="收藏此题">☆</button>
            <button class="icon-toggle-btn mastered" id="masteryBtn" aria-label="切换掌握状态">✋</button>
          </div>
        </div>
        <h2 class="q-title" id="qTitle"></h2>

        <div class="answer-panel" id="answerPanel" hidden>
          <section class="answer-section">
            <h3>🗣️ 面试口语化答案</h3>
            <div class="oral-text" id="oralText"></div>
          </section>
          <section class="answer-section">
            <h3>📌 核心要点（速记）</h3>
            <ul class="keypoints-list" id="keypointsList"></ul>
          </section>
          <section class="answer-section optional" id="followupSection">
            <h3>🔁 可能的追问</h3>
            <ul id="followupList"></ul>
          </section>
          <section class="answer-section optional pitfall" id="pitfallSection">
            <h3>⚠️ 常见陷阱</h3>
            <ul id="pitfallList"></ul>
          </section>
        </div>
      </div>
    </div>

    <button class="back-top-btn" id="backTopBtn" hidden aria-label="回到顶部">↑</button>

    <nav class="bottom-bar" id="bottomBar">
      <button class="bottom-btn" id="prevBtn">‹ 上一题</button>
      <button class="bottom-btn primary" id="toggleAnswerBtnBottom">查看答案</button>
      <button class="bottom-btn" id="nextBtn">下一题 ›</button>
    </nav>
  </main>
</div>

<div class="sheet-overlay" id="sheetOverlay" hidden></div>
<div class="bottom-sheet" id="bottomSheet" hidden></div>

<div class="sheet-overlay" id="jumpOverlay" hidden></div>
<div class="jump-modal" id="jumpModal" hidden>
  <div class="sheet-title">跳转到第几题</div>
  <input id="jumpInput" type="number" min="1" placeholder="输入题号">
  <button id="jumpConfirm">跳转</button>

<script type="application/json" id="__data_json">{"meta":{"title":"Java 后端高频面试题（重点·口语答案版）","catalogTitle":"重点面试题","sourceType":"markdown","sourceFile":"面试重点.md","sourceTitle":"Java 后端高频面试题库","generatedAt":"2026-10-31T12:58:35.108Z","total":296,"categoryOrder":["Java 基础","Java 集合","JVM","并发编程","MySQL","Redis","Spring & MyBatis","消息队列","分布式","RAG","Agent 开发"],"priorityNote":"按“必背 / 进阶 / 了解”分层：必背题优先脱稿复述，进阶题掌握原理与边界，了解题用于查漏补缺。频率与难度为编辑评估，不是实时面试统计数据。","sourceNote":"共 296 道重点题，按 11 个模块整理，并按“必背 / 进阶 / 了解”分层。必背题提供口语化答案、核心要点、可能的追问和常见陷阱；进阶题提供答案与要点；了解题用于查漏补缺。"},"questions":[{"id":"f1","question":"String 为什么设计成 final 不可变的？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：String 为什么设计成 final 不可变的。","category":"Java 基础","difficulty":"中等","tags":["String","final","byte","hash"],"answer":{"oral":"String 被设计成 final 且不可变，核心是安全和可复用。类被 final 修饰不能被继承，内部存储从 JDK 8 的 private final char[] 变成 JDK 9+ 的 private final byte[] 加 coder，字段私有又没有修改方法，所以内容创建后不会变。好处有四块：字面量能进字符串常量池复用；equals/hashCode 可以缓存，hash 是懒加载的；多线程共享不用加锁；作为参数、类加载、SQL、文件路径时不会被调用方篡改。注意不可变是整体语义，反射仍可能破坏封装；JDK 9 之后底层是 byte[] 不再是 char[]；循环拼接会产生大量新对象，应该用 StringBuilder。","keyPoints":["类被 final 修饰不可继承，内部 byte[] 私有且不提供修改入口","创建后内容不可变，可安全共享，多线程使用无需加锁","字符串字面量能进常量池复用，减少重复对象","hashCode 可缓存，作为 HashMap 的 key 定位更稳定","作为参数或返回值传递时不会被调用方篡改"],"followUp":["final 修饰类和“不可变对象”是一回事吗？","String 内部是 byte[]，反射能改吗？实际使用中要注意什么？"],"pitfalls":["把 final 类、final 字段和不可变对象混为一谈。","忽略 JDK 9 前后 char[]/byte[] 的差异。"]}},{"id":"f2","question":"String、StringBuilder 和 StringBuffer 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：String、StringBuilder 和 Strin。","category":"Java 基础","difficulty":"中等","tags":["String","StringBuilder","StringBuffer","synchronized","byte"],"answer":{"oral":"三者本质都是字符串或可变字符序列，差别在可变性和线程安全。String 不可变，每次拼接、截取都返回新对象，适合做常量、Map 的 key 和方法参数；StringBuilder 可变、非线程安全，单线程拼接首选；StringBuffer 可变，方法上加了 synchronized，只有多个线程共享同一个缓冲区时才需要，性能比 StringBuilder 差。JDK 9 之后两者底层都改成 byte[] 加 coder，按 Latin-1 或 UTF-16 压缩存储，JDK 8 及以前是 char[]。实际写代码时，方法内局部拼接用 StringBuilder，循环里预估好容量，避免反复扩容。","keyPoints":["String 不可变，每次修改都会生成新对象","StringBuilder 可变、非线程安全，单线程拼接性能最好","StringBuffer 方法加了 synchronized，线程安全但有锁开销","循环内拼接用 StringBuilder，避免产生大量临时 String"],"followUp":["JDK 9 的压缩字符串解决了什么问题？","为什么循环拼接推荐 StringBuilder，而不是直接用 +？"],"pitfalls":["只背“StringBuilder 快”，说不清锁开销和适用场景。","忽略编译器对字符串常量拼接的优化。"]}},{"id":"f3","question":"String str = new String(\"abc\") 创建了几个对象？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：String str = new String(\"abc。","category":"Java 基础","difficulty":"中等","tags":["String","ldc","invokespecial","intern"],"answer":{"oral":"要分两种情况。如果常量池里还没有 \"abc\"，类加载时 ldc 会先在常量池创建字面量，执行 new 时再在堆里创建一个 String 对象，一共两个；如果池里已经有 \"abc\"，比如前面用过字面量或 intern 过，就只创建堆里那一个对象。new String(\"abc\") 复制的是常量池内容，新对象不会自动进池，要调用 intern 才会尝试放入并返回池中引用。所以标准答案是可能一个、也可能两个，JDK 9 之后内部改成 byte[]，但对象个数的结论不变。","keyPoints":["字面量先查字符串常量池，已存在则直接复用","new 一定在堆上开辟新对象，与常量池无关","常量池没有 abc 时创建 2 个对象，已有时只创建 1 个","intern 会把堆对象的引用指向常量池中的同值字符串"],"followUp":[],"pitfalls":[]}},{"id":"f4","question":"接口和抽象类的区别是什么？怎么选择？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：接口和抽象类的区别是什么怎么选择。","category":"Java 基础","difficulty":"简单","tags":["is-a","can-do","default"],"answer":{"oral":"接口更像 can-do，定义一组能力契约，不能有实例字段，JDK 8 起可以有 default 和 static 方法，JDK 9 还支持 private 方法；抽象类更像 is-a，可以有成员变量、构造器、普通方法和抽象方法，子类通过继承复用状态和逻辑。类只能继承一个抽象类，但可以实现多个接口。选择上，如果多个实现要共享状态和模板逻辑，用抽象类；如果只是定义契约、希望被多种类实现，用接口，现代设计更倾向接口加组合。接口 default 方法冲突时，子类必须覆盖，或者按类优先、子类优先的规则解决。","keyPoints":["抽象类表达 is-a，可以有状态、构造器和已实现方法","接口表达 can-do，侧重能力契约，支持多实现","单继承限制下，需要共享实现时选抽象类","只定义规范、允许组合扩展时优先接口"],"followUp":["接口 default 方法和抽象类方法冲突时怎么处理？","JDK 8 为什么引入 default 方法？"],"pitfalls":["说接口不能有方法实现，忽略 default/static 方法。","把“优先用接口”绝对化，忽略共享状态和构造逻辑。"]}},{"id":"f5","question":"while(true) 和 for(;;) 哪个性能更好？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":65,"frequencyReason":"「Java 基础」了解题，偏细节或低频，时间有限时可后置。考点：while(true) 和 for(;;) 哪个性能更好。","category":"Java 基础","difficulty":"简单","tags":[],"answer":{"oral":"性能上没有任何区别。while(true) 和 for(;;) 编译出来的字节码是一模一样的，都是无条件跳转，JIT 也不会因为写法不同做特殊优化，所谓 for(;;) 少一次判断只是源码层面的感觉。选哪个看可读性和团队规范，while(true) 更直白，for(;;) 在 JDK 和一些底层代码里更常见。真正影响性能的是循环体里有没有阻塞、内存分配和同步，而不是这两种写法。","keyPoints":["两者编译后的字节码完全相同","JIT 优化后不存在性能差异","for(;;) 在源码中更常见，while(true) 语义更直观","按团队规范选择即可，不必以性能为由"],"followUp":[],"pitfalls":[]}},{"id":"f6","question":"什么是反射机制？为什么反射慢？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是反射机制为什么反射慢。","category":"Java 基础","difficulty":"中等","tags":["Class","Method","Field"],"answer":{"oral":"反射是程序运行期通过 Class 对象动态获取类的构造器、方法、字段，并能创建对象、调用方法、访问字段，Spring、MyBatis、序列化框架都大量用它。它慢的原因有几块：方法调用要走动态解析，不像普通调用那样容易内联；每次访问可能做权限检查；参数需要装箱和数组包装；JIT 对反射调用的优化有限。优化手段是缓存 Method、Field、Constructor，减少查找；必要时 setAccessible 跳过检查；更高性能可以用 MethodHandle、LambdaMetafactory 或直接生成字节码。业务代码不要在高频路径上反复反射。","keyPoints":["反射在运行时通过 Class 对象获取 Method、Field 并调用","调用时要动态解析方法、做访问检查，JIT 难以内联","反射调用比直接调用多一层开销","缓存 Method 或改用 MethodHandle 能显著提速"],"followUp":[],"pitfalls":[]}},{"id":"f7","question":"什么是泛型？为什么要使用它？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是泛型为什么要使用它。","category":"Java 基础","difficulty":"简单","tags":["PECS"],"answer":{"oral":"泛型是把类型参数化，让编译器在编译期做类型检查，避免到处强转，也能提前暴露类型错误。它的实现是类型擦除，编译后泛型参数变成上界或 Object，运行期拿不到真实类型，所以不能 new T()、new T[]、不能 instanceof List<String>，也不能用 List<String> 和 List<Integer> 做重载。为了多态正确，编译器会生成桥方法。使用通配符记住 PECS：生产者用 ? extends T，消费者用 ? super T。需要泛型数组时用 Array.newInstance 或强转，并注意堆污染。","keyPoints":["泛型把类型检查提前到编译期，避免运行时强转","通过类型擦除实现，运行时都变成 Object 或上界类型","擦除导致不能 new 泛型数组，编译器会生成桥方法","通配符遵循 PECS：消费者用 super，生产者用 extends"],"followUp":["什么是类型擦除？它带来哪些限制？","PECS 原则怎么用？"],"pitfalls":["认为运行期还能拿到泛型参数类型。","忽略基本类型不能作为泛型参数。"]}},{"id":"f8","question":"如何理解 Java 中的多态？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：如何理解 Java 中的多态。","category":"Java 基础","difficulty":"简单","tags":[],"answer":{"oral":"多态就是同一个方法调用在不同对象上表现出不同行为，前提是继承或实现接口、子类重写方法、父类引用指向子类对象。编译期只按引用类型确定方法签名，运行期靠动态绑定，JVM 通过虚方法表或接口方法表找到实际类型的方法版本。它的价值是扩展性好，新增实现不用改调用方，Spring 的接口注入、策略模式都是典型应用。注意字段和 static 方法不参与动态绑定，重写只针对实例方法，private 方法也绑定在编译期。","keyPoints":["多态成立要同时满足继承或实现、方法重写、向上转型","调用哪个方法由运行时实际类型决定，即动态绑定","JVM 通过虚方法表和 invokevirtual 完成分派","多态让新增实现时不必修改调用方代码"],"followUp":[],"pitfalls":[]}},{"id":"f9","question":"为什么 Java 不支持多继承？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":65,"frequencyReason":"「Java 基础」了解题，偏细节或低频，时间有限时可后置。考点：为什么 Java 不支持多继承。","category":"Java 基础","difficulty":"简单","tags":[],"answer":{"oral":"主要是为了避免菱形继承。A 同时继承 B、C，如果 B、C 有同名字段或方法，到底用哪个说不清，状态也会重复，C++ 要用虚继承来绕，复杂度很高。Java 选择单继承类、多实现接口，接口没有实例状态，方法冲突也有明确规则：类的方法优先，子类覆盖优先，否则编译报错，必须显式覆盖解决。实际设计更推荐组合优先，需要复用时抽接口或委托，而不是堆继承层次。","keyPoints":["多继承会遇到菱形继承，同一方法可能有两个实现","父类同名字段会让状态归属无法确定","Java 用单继承加接口多实现规避冲突","需要复用多个能力时优先组合，而不是继承"],"followUp":[],"pitfalls":[]}},{"id":"f10","question":"final、finally、finalize 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：final、finally、finalize 的区别。","category":"Java 基础","difficulty":"简单","tags":["final","finally","finalize"],"answer":{"oral":"final 是修饰符：类不能被继承，方法不能被重写，变量只能赋值一次，引用不可变但对象内容仍可变。finally 是异常处理块，通常用来释放资源，正常、异常、return 都会走。finalize 是 Object 的方法，GC 回收前可能调用一次，时机不确定、可能根本不调用、还会拖慢回收，JDK 9 标记废弃，JDK 18 起可以通过参数禁用终结器，不应该再依赖。资源释放用 try-with-resources 或 Cleaner。","keyPoints":["final 修饰类、方法、变量，表示不可继承、不可重写、不可重新赋值","finally 是异常处理块，通常用来释放资源","finalize 是对象回收前的回调，执行时机不确定","finalize 已废弃，应改用 try-with-resources 或 Cleaner"],"followUp":["finalize 为什么被废弃？有没有替代方案？","finally 里写 return 会发生什么？"],"pitfalls":["把 finalize 当成可靠的资源释放手段。","混淆 final 变量和不可变对象。"]}},{"id":"f11","question":"finally 中代码一定会被执行吗？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：finally 中代码一定会被执行吗。","category":"Java 基础","difficulty":"中等","tags":["finally","return","System.exit"],"answer":{"oral":"不是绝对的。大多数情况 finally 会执行，包括 try 里 return 或抛异常；但 System.exit、Runtime.halt、kill -9、JVM 崩溃、守护线程随主线程结束、finally 之前死循环或线程被强制终止，都不会执行。还要避免在 finally 里 return，它会覆盖 try 的返回值并吞掉异常；try-with-resources 关闭资源时抛出的异常会作为 suppressed 挂在主异常上，排查时要看 getSuppressed。","keyPoints":["正常执行、抛出异常、return 都会经过 finally","System.exit 直接终止 JVM，finally 不会执行","守护线程随主线程结束，可能来不及执行 finally","finally 里 return 会覆盖 try 的返回值，属于反模式"],"followUp":[],"pitfalls":[]}},{"id":"f12","question":"BigDecimal 和 Long 哪个表示金额更合适？为什么不能用浮点数？为什么 BigDecimal 的 equals 不能做等值比较？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：BigDecimal 和 Long 哪个表示金额更合适为。","category":"Java 基础","difficulty":"简单","tags":["BigDecimal","Long","equals","value+scale","compareTo","decimal"],"answer":{"oral":"金额要看精度要求：只到分可以用 long 存分，运算快、没有精度问题；需要小数位、汇率、利息计算用 BigDecimal，数据库对应 decimal。float 和 double 是二进制浮点，0.1 无法精确表示，累加会出现 0.30000000000000004 这类误差，不能用于金额。BigDecimal 的 equals 会比较 value 和 scale，1.0 和 1.00 返回 false，等值比较要用 compareTo；除法必须指定 scale 和 RoundingMode，否则可能抛 ArithmeticException。","keyPoints":["float、double 用二进制表示，无法精确表示 0.1 这类小数","金额以分为单位用 long，够用且运算最快","BigDecimal 用 value 加 scale 表示，适合必须保留小数的场景","equals 会比较 scale，1.0 和 1.00 不相等，等值比较要用 compareTo"],"followUp":["BigDecimal 的 scale 和精度怎么设置？","数据库金额字段为什么常用 decimal？"],"pitfalls":["用 double/float 做金额计算。","用 equals 比较 BigDecimal 的数值。"]}},{"id":"f13","question":"BIO、NIO 和 AIO 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：BIO、NIO 和 AIO 的区别。","category":"Java 基础","difficulty":"中等","tags":["BIO","NIO","AIO","Channel","Selector","epoll"],"answer":{"oral":"BIO 是同步阻塞，一个连接一个线程，读不到就阻塞，编程简单但连接多了线程和切换开销大，适合连接数少、短连接场景。NIO 是同步非阻塞，基于 Channel、Buffer、Selector，一个线程可以管理很多连接，靠 epoll、kqueue 通知就绪事件，Netty 就是基于 NIO，适合高并发长连接。AIO 是异步非阻塞，发起读写后由操作系统完成后回调，编程模型更复杂，Linux 上支持有限，实际用得少。选型主要看连接数和 IO 模型，不能只看名字。","keyPoints":["BIO 同步阻塞，一个连接占一个线程","NIO 同步非阻塞，用 Channel、Buffer、Selector 做多路复用","AIO 异步非阻塞，由操作系统完成后回调","高并发连接选 NIO，Netty 就是基于 NIO 的封装"],"followUp":["NIO 的 Selector 和 epoll 是什么关系？","Netty 为什么基于 NIO，而不是 AIO？"],"pitfalls":["把 NIO 等同于“非阻塞”，忽略同步/异步维度。","认为 AIO 在所有场景都比 NIO 好。"]}},{"id":"f14","question":"什么是 SPI，和 API 有啥区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是 SPI，和 API 有啥区别。","category":"Java 基础","difficulty":"中等","tags":["SPI","API","META-INF","services","ServiceLoader","JDBC"],"answer":{"oral":"API 是给调用方用的接口约定，SPI 是给实现方用的扩展点。SPI 把接口和实现分离，实现类配置在 META-INF/services 下以接口全限定名命名的文件里，ServiceLoader 按接口加载，调用方不用改代码就能换实现，JDBC 驱动、Dubbo 扩展都是典型。ServiceLoader 通常用线程上下文类加载器加载实现，因为接口由父加载器加载、实现由应用类加载器加载，所以会打破双亲委派；它还会一次加载所有实现，不能按名取单个，这是 Java SPI 的局限。","keyPoints":["API 是调用方直接依赖实现，SPI 是接口方定义、实现方提供","SPI 通过 META-INF/services 文件声明实现类全限定名","ServiceLoader 加载实现，具体实现由业务方引入","JDBC 驱动、Dubbo 扩展点都用 SPI 解耦"],"followUp":[],"pitfalls":[]}},{"id":"f15","question":"深拷贝和浅拷贝的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：深拷贝和浅拷贝的区别。","category":"Java 基础","difficulty":"中等","tags":["Cloneable"],"answer":{"oral":"浅拷贝只复制对象本身和基本类型字段，引用类型字段仍指向同一块内存，改一个会影响另一个；深拷贝会把嵌套对象也复制一份。实现方式有实现 Cloneable 重写 clone 做递归拷贝，或者用序列化、JSON 反序列化、拷贝构造器。深拷贝要特别注意循环引用，别无限递归；不可变对象可以直接共享，不需要拷贝。实际项目更推荐显式拷贝构造器或工具类，少用 clone。","keyPoints":["浅拷贝只复制引用，两个对象共享同一份内部数据","深拷贝递归复制内部对象，彼此完全独立","Object.clone 默认是浅拷贝，引用字段要自己处理","深拷贝可用序列化或手动递归，注意循环引用"],"followUp":[],"pitfalls":[]}},{"id":"f16","question":"什么是序列化与反序列化？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是序列化与反序列化。","category":"Java 基础","difficulty":"中等","tags":["Serializable","serialVersionUID","transient","JSON","Protobuf"],"answer":{"oral":"序列化是把对象转成字节流，方便存盘或网络传输；反序列化反过来恢复对象。Java 原生用 Serializable，serialVersionUID 用于版本兼容，不一致会抛 InvalidClassException；transient 字段不参与序列化，static 字段也不参与。反序列化有安全风险，恶意字节流可能触发任意代码，不要反序列化不可信数据，必要时用白名单过滤。跨语言、跨版本更常用 JSON 或 Protobuf，性能和体积也更好。","keyPoints":["序列化把对象状态转成字节流，反序列化再还原","Serializable 靠 serialVersionUID 判断版本兼容","transient 字段不参与序列化","Java 原生序列化有反序列化漏洞，跨语言场景多用 JSON 或 Protobuf"],"followUp":[],"pitfalls":[]}},{"id":"f17","question":"为什么重写 equals 时一定要重写 hashCode？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：为什么重写 equals 时一定要重写 hashCode。","category":"Java 基础","difficulty":"简单","tags":["equals","hashCode","HashMap","hash","Objects.equals"],"answer":{"oral":"因为 equals 和 hashCode 有契约：两个对象 equals 为 true，hashCode 必须相等；hashCode 相等不代表 equals 相等。HashMap 先用 hashCode 定位桶，再用 equals 比较，只重写 equals 的话，逻辑相等的对象可能落到不同桶，导致查不到、去重失败。实现时用 Objects.equals 和 Objects.hash 处理 null，并保证参与计算的字段不可变，否则对象放进集合后修改字段会丢失。","keyPoints":["equals 判断逻辑相等，hashCode 决定落在哪个桶","只重写 equals 会让相等对象散落到不同桶，HashMap 查不到","参与 hash 计算的字段不要随意修改，否则会丢对象","用 Objects.equals 和 Objects.hash 简化实现"],"followUp":["equals 和 hashCode 的契约是什么？","可变对象作为 HashMap key 会怎样？"],"pitfalls":["只重写 equals，不重写 hashCode。","用可变字段参与 hashCode 计算。"]}},{"id":"f18","question":"什么是 UUID，能保证唯一性吗？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":66,"frequencyReason":"「Java 基础」了解题，偏细节或低频，时间有限时可后置。考点：什么是 UUID，能保证唯一性吗。","category":"Java 基础","difficulty":"中等","tags":["UUID"],"answer":{"oral":"UUID 是 128 位标识，常见 v1 是时间加 MAC、v4 是随机、v7 是时间有序。它只能做到概率上唯一，v4 碰撞概率极低但不是绝对保证，机器 ID 或随机源重复也有风险。UUID 无序，作为 MySQL 聚簇索引主键会导致随机插入、页分裂和索引膨胀，高并发写入更明显。互联网业务更常用雪花算法或号段模式，趋势递增、长度更短；如果必须用 UUID，可以考虑 v7 或二进制存储。","keyPoints":["UUID 由时间、机器、序列等信息拼成，重复概率极低","只能做到概率唯一，不是绝对唯一","无序字符串做主键会导致 B+ 树频繁分裂、索引膨胀","数据库主键更常用雪花或号段这类趋势递增 ID"],"followUp":[],"pitfalls":[]}},{"id":"f19","question":"Java 中异常分哪两类，有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Java 中异常分哪两类，有什么区别。","category":"Java 基础","difficulty":"简单","tags":["Throwable","Checked","Unchecked","try-with-resources","suppressed"],"answer":{"oral":"异常都继承自 Throwable，下面分 Error 和 Exception。Exception 又分受检异常和 RuntimeException：受检异常编译器强制 catch 或声明，比如 IOException；非受检异常是编程错误，比如 NPE、数组越界，编译期不强制。Error 如 OOM、StackOverflowError 一般不捕获。try-with-resources 会自动按声明逆序关闭资源，关闭异常作为 suppressed 挂在主异常上，用 getSuppressed 查看。","keyPoints":["Throwable 分 Error 和 Exception，Error 通常不该捕获","Checked 异常必须处理或声明，编译期就检查","Unchecked 即 RuntimeException，多是编程错误","try-with-resources 会自动关闭资源，并保留被抑制的异常"],"followUp":[],"pitfalls":[]}},{"id":"f20","question":"== 和 equals 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：== 和 equals 有什么区别。","category":"Java 基础","difficulty":"简单","tags":["equals"],"answer":{"oral":"== 对基本类型比值，对引用类型比地址；equals 是 Object 的方法，默认也比地址，但可以被重写为比较内容。包装类要注意缓存：Integer 在 -128 到 127 之间 valueOf 会复用对象，超出范围用 == 可能为 false；两个 Integer 用 == 比较的是引用，应该用 equals。字符串字面量在常量池复用，new 出来的在堆里，地址不同。包装类和基本类型比较会自动拆箱，null 拆箱会 NPE。","keyPoints":["基本类型 == 比较值，引用类型 == 比较地址","equals 默认也是比地址，重写后才能比内容","字符串字面量走常量池，== 可能为 true","Integer 缓存 -128~127，超出范围 == 为 false"],"followUp":["Integer 缓存的默认范围是多少？","字符串常量池和 new String 的地址关系？"],"pitfalls":["用 == 比较包装类内容。","忽略 null 调用 equals 的空指针。"]}},{"id":"f21","question":"重载和重写有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：重载和重写有什么区别。","category":"Java 基础","difficulty":"简单","tags":["private","static","final"],"answer":{"oral":"重载在同一个类里，方法名相同、参数列表不同，编译期按静态类型确定版本，属于静态绑定；重写在子类覆盖父类方法，签名相同，运行期按实际对象类型动态绑定。重写时返回类型可以协变，访问权限不能变小，异常不能更宽；private、static、final 方法不能重写，构造器也不能重写。重载还要注意自动装箱、可变参数和 null 带来的歧义。","keyPoints":["重载在编译期按参数列表静态绑定","重写发生在运行期，按实际类型动态绑定","重写要求方法签名一致，返回类型可协变","private、static、final 方法不能被重写"],"followUp":[],"pitfalls":[]}},{"id":"f22","question":"Java 是值传递还是引用传递？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Java 是值传递还是引用传递。","category":"Java 基础","difficulty":"简单","tags":["swap"],"answer":{"oral":"Java 只有值传递。基本类型传的是值的副本；对象传的是引用的副本，两个引用指向同一个对象，所以方法里修改对象内容会影响外部，但把形参重新指向另一个对象不会影响外面的引用。因此 swap 两个对象引用的方法在 Java 里无效，只能交换对象内容、返回新引用或放进 Holder。数组也一样，传的是数组引用的副本。","keyPoints":["Java 只有值传递，引用类型传的是引用的副本","方法内重新赋值只改副本，不影响调用方变量","通过引用副本能修改对象内部状态，容易误认为引用传递","swap 方法无法交换外部变量"],"followUp":["为什么 Java 不提供引用传递？","方法内修改对象属性和重新赋值形参有什么区别？"],"pitfalls":["把“对象引用按值传递”说成引用传递。","认为 swap 方法能交换外部引用。"]}},{"id":"f23","question":"自动装箱与拆箱是怎么回事？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：自动装箱与拆箱是怎么回事。","category":"Java 基础","difficulty":"简单","tags":["valueOf","intValue","Integer","null","NPE"],"answer":{"oral":"自动装箱是基本类型转包装类，底层调 valueOf；拆箱是包装类转基本类型，底层调 intValue 这类方法。Integer 的 valueOf 对 -128 到 127 做了缓存，这个范围内 == 可能为 true，超出范围就是不同对象；Boolean、Byte、Short、Long 也有固定缓存，Character 是 0 到 127。包装类为 null 时拆箱会 NPE，三目运算符混用包装类型也可能触发拆箱。频繁装箱有对象分配开销，循环里尽量用基本类型。","keyPoints":["装箱调用 valueOf，拆箱调用 intValue 等方法","Integer 默认缓存 -128~127，缓存范围内 == 为 true","new Integer 每次创建新对象，== 为 false","包装类型为 null 时参与运算会拆箱抛 NPE"],"followUp":[],"pitfalls":[]}},{"id":"f24","question":"Java 8 有哪些常用新特性？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Java 8 有哪些常用新特性。","category":"Java 基础","difficulty":"简单","tags":["Lambda","Stream","Optional","default","static","API"],"answer":{"oral":"Java 8 常用新特性有 Lambda、Stream、Optional、接口 default/static 方法、新日期时间 API、CompletableFuture，以及 JVM 的 Metaspace 替换永久代。Stream 是惰性求值，中间操作只记录，遇到终端操作才执行，短路操作可以提前结束；并行流默认用 ForkJoinPool.commonPool，IO 密集或线程阻塞时不要用。Optional 用来显式表达可能为空，但不要滥用成字段和参数。新日期 API 是不可变的，解决了 SimpleDateFormat 的线程安全问题。","keyPoints":["Lambda 把函数作为参数，简化匿名内部类","Stream 惰性求值，遇到终止操作才执行，支持短路","接口新增 default 和 static 方法，兼顾兼容与扩展","Optional 显式表达可能为空，新日期 API 线程安全"],"followUp":["Stream 的中间操作和终端操作有什么区别？","Optional 为什么不推荐作为字段或参数？"],"pitfalls":["把 Metaspace 当成 Java 8 的语言特性。","认为 Stream 一定比 for 循环快。"]}},{"id":"f25","question":"JDK 动态代理和 CGLIB 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「Java 基础」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：JDK 动态代理和 CGLIB 有什么区别。","category":"Java 基础","difficulty":"中等","tags":["CGLIB","InvocationHandler","Proxy","final","Spring","AOP"],"answer":{"oral":"JDK 动态代理只能代理实现了接口的类，基于 Proxy 和 InvocationHandler，运行时生成代理类；CGLIB 通过字节码生成子类，不需要接口，但不能代理 final 类和 final 方法。Spring AOP 在目标有接口时可选择 JDK 代理，没有接口用 CGLIB；Spring Boot 2.x 起默认 proxyTargetClass=true，也就是默认 CGLIB。JDK 代理是 JDK 自带、更稳定，CGLIB 调用性能通常略好但要多引依赖，final 类只能用 JDK 代理或改设计。","keyPoints":["JDK 代理基于接口，运行时生成实现 InvocationHandler 的类","CGLIB 用字节码生成子类，可以代理普通类","CGLIB 不能代理 final 类和 final 方法","Spring AOP 有接口可用 JDK 代理，无接口用 CGLIB"],"followUp":["Spring AOP 默认用哪种代理？","CGLIB 为什么不能代理 final 类？"],"pitfalls":["认为 JDK 代理可以代理没有接口的类。","忽略 CGLIB 需要额外依赖，以及 final 限制。"]}},{"id":"f26","question":"注解是如何工作的？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Java 基础」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：注解是如何工作的。","category":"Java 基础","difficulty":"简单","tags":["Retention","Target","APT","Spring"],"answer":{"oral":"注解本身只是元数据，靠 @Retention 决定保留到源码、字节码还是运行时，靠 @Target 限定能用在哪，@Inherited、@Repeatable 控制继承和重复。运行时注解通过反射读取，比如 Spring 的 @Autowired、@Transactional；编译期注解靠 APT 处理，比如 Lombok、MapStruct 在编译时生成代码。Spring 的组合注解就是把多个元注解封装成一个，简化使用，同时通过 @AliasFor 做属性别名。","keyPoints":["注解本身只是元数据，@Retention 决定保留到源码、字节码还是运行时","@Target 限定注解可以标注的位置","运行时注解通过反射读取，再由框架处理器生效","编译期注解由 APT 处理，Spring 用组合注解做条件装配"],"followUp":[],"pitfalls":[]}},{"id":"f27","question":"ArrayList、LinkedList 与 Vector 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：ArrayList、LinkedList 与 Vecto。","category":"Java 集合","difficulty":"简单","tags":["ArrayList","LinkedList","Vector"],"answer":{"oral":"ArrayList 底层是动态数组，随机访问 O(1)，尾部追加均摊 O(1)，中间插入删除要搬元素；LinkedList 是双向链表，插入删除改指针，但随机访问要遍历，每个节点还有前后指针，缓存局部性差；Vector 也是动态数组，方法基本都加了 synchronized，属于遗留类，性能差，一般不用。大多数读多写少、随机访问多的场景优先 ArrayList；频繁在头尾增删可以用 LinkedList 或 ArrayDeque；需要线程安全用 CopyOnWriteArrayList 或外部加锁，不要用 Vector。","keyPoints":["ArrayList 基于动态数组，随机访问 O(1)，中间增删要搬元素","LinkedList 基于双向链表，增删快但随机访问要遍历","Vector 方法加了 synchronized，线程安全但性能差，已不推荐","多数场景选 ArrayList，内存连续、缓存友好"],"followUp":[],"pitfalls":[]}},{"id":"f28","question":"HashMap、Hashtable 和 ConcurrentHashMap 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Java 集合」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：HashMap、Hashtable 和 Concurre。","category":"Java 集合","difficulty":"中等","tags":["HashMap","Hashtable","ConcurrentHashMap","CAS","null"],"answer":{"oral":"Hashtable 是老类，整表加 synchronized，不允许 null 键和 null 值，并发性能差；HashMap 非线程安全，允许一个 null 键和多个 null 值；ConcurrentHashMap 线程安全，JDK 7 用 Segment 分段锁，JDK 8 改成 Node 数组加 CAS 和 synchronized 锁单个桶，并发性能高，同样不允许 null 键值。并发场景选 ConcurrentHashMap；单线程或读多写少用 HashMap。Hashtable 现在基本只出现在老代码里。","keyPoints":["Hashtable 全表加锁，读写都串行，性能最差","ConcurrentHashMap 在 JDK 8 用 CAS 加桶级 synchronized","Hashtable 不允许 null 键值，HashMap 允许一个 null 键","并发场景直接选 ConcurrentHashMap"],"followUp":["Hashtable 为什么逐渐被淘汰？","ConcurrentHashMap 的 key/value 能不能为 null？"],"pitfalls":["把 JDK 7 的分段锁直接套到 JDK 8。","忽略 Hashtable 是整表锁，性能差。"]}},{"id":"f29","question":"Java 中的集合类有哪些？如何分类？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Java 中的集合类有哪些如何分类。","category":"Java 集合","difficulty":"简单","tags":["Collection","Map","List","Set","Queue"],"answer":{"oral":"集合分两大体系：Collection 和 Map。Collection 下分 List、Set、Queue：List 有序可重复，常用 ArrayList、LinkedList；Set 不重复，常用 HashSet、LinkedHashSet、TreeSet；Queue 用于排队，常用 ArrayDeque、PriorityQueue 和阻塞队列。Map 存键值对，常用 HashMap、LinkedHashMap、TreeMap、ConcurrentHashMap。选型先看是否需要去重、排序、线程安全和阻塞语义，再看读写比例和内存。","keyPoints":["Collection 分 List、Set、Queue，Map 单独一支","List 有序可重复，Set 去重，Queue 按入队出队规则","Map 存键值对，键唯一","选型看是否需要顺序、去重、排序和并发"],"followUp":[],"pitfalls":[]}},{"id":"f30","question":"说说 HashMap 的扩容机制？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Java 集合」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：说说 HashMap 的扩容机制。","category":"Java 集合","difficulty":"中等","tags":["HashMap"],"answer":{"oral":"HashMap 默认容量 16、负载因子 0.75，元素数超过阈值也就是容量乘负载因子时就扩容。扩容是容量翻倍，然后把旧数组元素重新分布：JDK 8 利用容量是 2 的幂，把 hash 和旧容量做与运算，结果为 0 留在原位，为 1 移到原位置加旧容量，也就是高低位拆分，不用重新算 hash。JDK 7 是头插法，JDK 8 改成尾插法，避免并发扩容形成环，但 JDK 8 的 HashMap 仍然不是线程安全的，并发写仍可能丢数据。","keyPoints":["默认负载因子 0.75，元素数超过阈值就扩容","容量翻倍后重新计算桶位","JDK 8 用高低位拆分，元素要么留原位，要么移到原索引加旧容量","JDK 7 头插法在并发扩容时可能形成环形链表"],"followUp":["JDK 8 扩容时如何拆分链表？","为什么扩容通常按 2 倍进行？"],"pitfalls":["把 JDK 8 的插入方式说成头插法（实际是尾插）。","认为扩容后所有元素的位置都会改变。"]}},{"id":"f31","question":"为什么 HashMap 的默认负载因子是 0.75？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：为什么 HashMap 的默认负载因子是 0.75。","category":"Java 集合","difficulty":"中等","tags":["HashMap"],"answer":{"oral":"0.75 是空间和时间的折中。负载因子太低，扩容频繁、空间浪费；太高，哈希冲突变多，链表变长，查询变慢。0.75 下桶内元素数近似泊松分布，冲突概率比较低，同时数组利用率也还能接受，这是 JDK 根据统计和性能测试定下来的经验值，通常不建议改。真要调整，要结合内存和查询性能做压测，因为树化、扩容都会影响表现。","keyPoints":["0.75 是空间占用和查询效率的折中","负载因子过高冲突变多，链表变长","负载因子过低会频繁扩容，浪费内存","源码用泊松分布说明 0.75 时冲突概率较低"],"followUp":[],"pitfalls":[]}},{"id":"f32","question":"为什么 JDK 8 的 HashMap 要转成红黑树？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：为什么 JDK 8 的 HashMap 要转成红黑树。","category":"Java 集合","difficulty":"困难","tags":["HashMap","log"],"answer":{"oral":"链表查询是 O(n)，元素多了性能下降；转成红黑树后查询是 O(log n)。另外，攻击者可以构造大量 hash 冲突的 key，把 HashMap 打成链表，造成拒绝服务，树化能缓解这种哈希碰撞攻击。触发条件是单个桶链表长度达到 8 且数组容量至少 64，容量不够时优先扩容而不是树化；退化阈值是 6，留出缓冲避免频繁转换。树化本身也有开销，所以不是一有冲突就转。","keyPoints":["链表查询是 O(n)，冲突严重时退化成线性","转红黑树后查询稳定在 O(log n)","树化阈值 8、退化阈值 6，且容量至少 64","同时能抵御构造哈希碰撞的攻击"],"followUp":[],"pitfalls":[]}},{"id":"f33","question":"HashMap 在并发场景下会出现什么问题？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：HashMap 在并发场景下会出现什么问题。","category":"Java 集合","difficulty":"中等","tags":["HashMap","size"],"answer":{"oral":"HashMap 不是线程安全的。并发 put 可能相互覆盖，两个线程同时写同一个桶，后写的把先写的覆盖掉；多线程扩容时可能丢数据；size 统计也不准；JDK 7 扩容用头插法，并发下可能形成环形链表，get 时死循环，这是最经典的并发问题。JDK 8 改成尾插后环的问题基本没了，但仍会丢更新、读到中间状态。并发场景应该用 ConcurrentHashMap，或者外部统一加锁。","keyPoints":["并发 put 可能互相覆盖，造成更新丢失","并发写入会让 size 统计不准","JDK 7 并发扩容可能形成环，get 时死循环","JDK 8 并发扩容可能丢数据，并发场景必须换 ConcurrentHashMap"],"followUp":[],"pitfalls":[]}},{"id":"f34","question":"HashMap 的 remove 方法是如何实现的？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：HashMap 的 remove 方法是如何实现的。","category":"Java 集合","difficulty":"中等","tags":["HashMap","remove","modCount","fail-fast"],"answer":{"oral":"remove 先根据 key 的 hash 定位到桶，再在链表或红黑树里按 key 找节点，找到后把前驱和后继接上；如果是树节点，删除后可能做平衡，节点少到阈值会退化成链表。删除成功后 modCount 加一，迭代器发现 modCount 和 expectedModCount 不一致就抛 ConcurrentModificationException。注意 remove(key) 只比较 key，remove(key, value) 才要求两者都匹配；删除不会缩容，只是把节点摘掉。","keyPoints":["先算 hash 定位桶，再比较 key 找到节点","链表删除改前驱 next 指针，红黑树删除后可能退化为链表","删除会修改 modCount，触发迭代器 fail-fast","删除只改结构，不会立即缩容"],"followUp":[],"pitfalls":[]}},{"id":"f35","question":"HashMap 的 get 和 put 流程是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Java 集合」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：HashMap 的 get 和 put 流程是怎样的。","category":"Java 集合","difficulty":"中等","tags":["HashMap","get","put","hash"],"answer":{"oral":"put 时先算 hash，再用 (n-1)&hash 定位桶；桶为空就直接放；不为空就比较 key，相等就覆盖值，不等就挂到链表尾部，链表长度到 8 且容量够就树化；最后 size 加一，超过阈值就扩容。get 就是同样的定位过程，桶里是链表就逐个 equals，是红黑树就按树查找，找不到返回 null。JDK 8 的 put 还会判断是否正在扩容，必要时协助迁移。","keyPoints":["put 先扰动 hash 定位桶，桶为空直接放入","冲突时挂链表，链表长度到 8 且容量足够就树化","key 已存在则覆盖 value","超过阈值先扩容再插入，get 按同样路径查找"],"followUp":["put 时 key 已存在会怎样？","get 为什么先用 hash，再用 equals？"],"pitfalls":["忽略 hash 扰动和桶下标计算。","把 put 流程说成先遍历整张表。"]}},{"id":"f36","question":"HashMap 的 hash 方法是如何实现的？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：HashMap 的 hash 方法是如何实现的。","category":"Java 集合","difficulty":"困难","tags":["HashMap","hash"],"answer":{"oral":"HashMap 的 hash 是先用 key 的 hashCode，再执行 h ^ (h >>> 16)，把高 16 位异或到低 16 位。因为数组下标用 (n-1)&hash，n 通常不大，只有低位参与运算，高位信息被浪费；扰动之后高位也参与进来，能降低碰撞概率。这是 JDK 8 的实现，JDK 7 做了更复杂的多次扰动。注意 key 为 null 时 hash 固定为 0，放在下标 0 的桶。","keyPoints":["取 key 的 hashCode，再异或自身右移 16 位","让高 16 位参与运算，避免高位信息丢失","数组长度是 2 的幂，低位分散更均匀","扰动减少碰撞，是 HashMap 查询快的关键之一"],"followUp":[],"pitfalls":[]}},{"id":"f37","question":"Set 如何保证元素不重复？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Set 如何保证元素不重复。","category":"Java 集合","difficulty":"简单","tags":["Set","HashMap","hashCode","equals","TreeSet","compareTo"],"answer":{"oral":"HashSet 底层就是 HashMap，元素作为 key，value 放一个固定的 Object；添加时先算 hashCode 定位，再用 equals 判断是否已存在，所以必须正确重写 hashCode 和 equals。TreeSet 底层是 TreeMap，靠 Comparable 或 Comparator 的 compareTo 判断重复，compareTo 返回 0 就认为重复，和 equals 不一定一致。LinkedHashSet 则是在 HashSet 基础上维护插入顺序。","keyPoints":["HashSet 底层是 HashMap，元素当 key，value 是占位对象","去重靠 hashCode 定位桶，再用 equals 比较","TreeSet 靠红黑树，用 compareTo 判断重复","equals 与 hashCode 不一致会破坏去重"],"followUp":[],"pitfalls":[]}},{"id":"f38","question":"什么是 fail-fast 和 fail-safe？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是 fail-fast 和 fail-safe。","category":"Java 集合","difficulty":"中等","tags":["fail-fast","fail-safe","modCount","expectedModCount","ConcurrentModificationException","CopyOnWrite"],"answer":{"oral":"fail-fast 是快速失败，集合内部维护 modCount，迭代时用 expectedModCount 比较，发现被修改就抛 ConcurrentModificationException，ArrayList、HashMap 都是这种。fail-safe 是弱一致，迭代时操作快照或副本，不会抛异常，但可能读不到最新数据，CopyOnWriteArrayList 的迭代器就是快照，ConcurrentHashMap 的迭代器是弱一致的。注意 fail-fast 只是检测，不保证一定能发现并发修改。","keyPoints":["fail-fast 迭代时比对 modCount 与 expectedModCount","发现并发修改立即抛 ConcurrentModificationException","fail-safe 先复制一份数据再遍历，如 CopyOnWriteArrayList","fail-safe 不抛异常，但可能读到旧数据"],"followUp":[],"pitfalls":[]}},{"id":"f39","question":"ConcurrentHashMap 如何保证线程安全？JDK 7 与 8 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Java 集合」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：ConcurrentHashMap 如何保证线程安全JD。","category":"Java 集合","difficulty":"困难","tags":["ConcurrentHashMap","Segment","Node+CAS+synchronized","volatile","size","CounterCell"],"answer":{"oral":"JDK 7 用 Segment 分段锁，每个 Segment 继承 ReentrantLock，锁住一段桶，不同段可以并发写。JDK 8 去掉了 Segment，直接用 Node 数组，空桶用 CAS 放头节点，非空桶用 synchronized 锁住头节点，同时用 volatile 保证可见性；扩容时多线程可以协助迁移，size 用 baseCount 加 CounterCell 数组分段统计，减少竞争。读操作基本无锁，通过 volatile 读保证看到最新值。","keyPoints":["JDK 7 用 Segment 分段锁，锁粒度是段","JDK 8 取消 Segment，改成 Node 数组加 CAS 和桶级 synchronized","get 不加锁，靠 volatile 保证可见性","多线程协助扩容，size 用 CounterCell 分散计数"],"followUp":["JDK 8 的 size 统计是怎么做的？","ConcurrentHashMap 为什么不允许 null？"],"pitfalls":["把 JDK 7 Segment 分段锁直接说成 JDK 8 的实现。","忽略 JDK 8 扩容时的协助迁移。"]}},{"id":"f40","question":"ArrayList 的扩容机制是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Java 集合」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：ArrayList 的扩容机制是怎样的。","category":"Java 集合","difficulty":"简单","tags":["ArrayList","grow","Arrays.copyOf","ensureCapacity","modCount"],"answer":{"oral":"ArrayList 默认构造时是空数组，第一次 add 才初始化为容量 10；满了之后按 1.5 倍扩容，新容量等于旧容量加旧容量右移一位，然后 Arrays.copyOf 复制到新数组。频繁添加可以提前 ensureCapacity 减少扩容。扩容和结构修改都会让 modCount 加一。注意 1.5 倍是近似说法，容量很小时增长较慢，接近上限时会走 hugeCapacity。","keyPoints":["默认容量 10，首次添加时才分配数组","扩容为原容量的 1.5 倍，用 Arrays.copyOf 复制","扩容有拷贝成本，可预估大小时用 ensureCapacity","结构性修改会改 modCount，触发 fail-fast"],"followUp":["ArrayList 无参构造第一次 add 扩容到多少？","ensureCapacity 有什么用？"],"pitfalls":["认为无参构造会立即分配容量 10（JDK 8 是懒初始化）。","把 1.5 倍扩容说成 2 倍。"]}},{"id":"f41","question":"为什么 HashMap 的容量必须是 2 的幂？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：为什么 HashMap 的容量必须是 2 的幂。","category":"Java 集合","difficulty":"困难","tags":["HashMap","n-1","hash"],"answer":{"oral":"因为容量是 2 的幂时，n-1 的二进制低位全是 1，(n-1)&hash 等价于对 n 取模，但位运算更快；扩容时容量翻倍，hash 只需要看新增的那一位，就能决定元素留在原位还是移到高位，分布更均匀。如果容量不是 2 的幂，低位会有空洞，某些桶永远用不到，碰撞会变多。所以 HashMap 构造时会用 tableSizeFor 把容量向上取到 2 的幂。","keyPoints":["容量为 2 的幂时，(n-1)&hash 等价于取模且更快","低位全为 1，哈希分布更均匀","扩容时元素只需判断高位，拆分简单","初始化传入非 2 的幂会被调整为最近的 2 的幂"],"followUp":[],"pitfalls":[]}},{"id":"f42","question":"LinkedHashMap 如何实现 LRU？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：LinkedHashMap 如何实现 LRU。","category":"Java 集合","difficulty":"中等","tags":["LinkedHashMap","LRU","accessOrder","afterNodeAccess","removeEldestEntry"],"answer":{"oral":"LinkedHashMap 继承 HashMap，额外维护一条双向链表记录插入顺序或访问顺序。构造时把 accessOrder 设为 true，每次 get 或 put 访问到元素，afterNodeAccess 会把它移到链表尾部，这样链表头就是最久未使用的元素。再重写 removeEldestEntry，在元素数超过容量时返回 true，就会自动删除链表头，实现 LRU。注意它不是线程安全的，并发场景要加锁或用 Caffeine。","keyPoints":["继承 HashMap，额外维护一条双向链表","accessOrder 为 true 时，每次访问把节点移到队尾","重写 removeEldestEntry 在超过容量时删除队头","这就是最简的 LRU 实现"],"followUp":[],"pitfalls":[]}},{"id":"f43","question":"CopyOnWriteArrayList 的原理和适用场景？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Java 集合」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：CopyOnWriteArrayList 的原理和适用场。","category":"Java 集合","difficulty":"中等","tags":["CopyOnWriteArrayList","volatile"],"answer":{"oral":"CopyOnWriteArrayList 写时复制：读操作直接读 volatile 数组，不加锁；写操作先加锁，复制出一份新数组，在新数组上修改，再把 volatile 引用指向新数组。读多写少、数据量不大的场景很合适，比如配置、监听器列表。缺点是写开销大、内存占用翻倍，而且只能保证弱一致，迭代时看不到最新写入。写特别频繁或数据量大时不适合。","keyPoints":["写操作加锁，复制一份新数组，改完替换引用","读操作直接读 volatile 数组，完全无锁","读多写少才适合，写多会频繁复制、内存开销大","只能保证最终一致，遍历时看不到最新写入"],"followUp":["写时复制有什么缺点？","COW 适合读多写少还是写多读少？"],"pitfalls":["认为 COW 适合高频写场景。","忽略内存占用和迭代器的弱一致性。"]}},{"id":"f44","question":"常见的阻塞队列有哪些？如何选择？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：常见的阻塞队列有哪些如何选择。","category":"Java 集合","difficulty":"简单","tags":["ArrayBlockingQueue","LinkedBlockingQueue","SynchronousQueue","PriorityBlockingQueue","DelayQueue"],"answer":{"oral":"常见的有 ArrayBlockingQueue，数组实现、有界；LinkedBlockingQueue，链表实现，默认容量是 Integer.MAX_VALUE，近似无界，可以指定容量；SynchronousQueue，不存元素，生产者必须直接交给消费者，适合传递任务；PriorityBlockingQueue，按优先级出队，无界；DelayQueue，延迟到期才能取。选择时看是否有界、吞吐、是否需要优先级或延迟，线程池里更推荐有界队列。","keyPoints":["ArrayBlockingQueue 有界数组，适合固定容量控制","LinkedBlockingQueue 链表，默认近似无界，要注意内存","SynchronousQueue 不存储元素，直接交给消费者","DelayQueue 按延迟出队，PriorityBlockingQueue 按优先级"],"followUp":[],"pitfalls":[]}},{"id":"f45","question":"TreeMap 和 TreeSet 如何排序？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：TreeMap 和 TreeSet 如何排序。","category":"Java 集合","difficulty":"中等","tags":["TreeMap","TreeSet","Comparable","Comparator"],"answer":{"oral":"TreeMap 底层是红黑树，按 key 排序。排序规则可以由 key 实现 Comparable 的自然排序，也可以在构造时传 Comparator 自定义排序。TreeSet 底层就是 TreeMap，元素作为 key。要注意比较规则要和 equals 保持一致，否则会出现看似重复却放不进去，或者放进去却查不到的情况。它还支持 firstKey、lastKey、subMap 这类范围查询，这是 HashMap 做不到的。","keyPoints":["底层红黑树，按 key 排序","实现 Comparable 用自然排序，传 Comparator 用定制排序","比较结果决定顺序和去重","比较器要与 equals 语义一致，否则行为混乱"],"followUp":[],"pitfalls":[]}},{"id":"f46","question":"HashSet、LinkedHashSet、TreeSet 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Java 集合」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：HashSet、LinkedHashSet、TreeSe。","category":"Java 集合","difficulty":"简单","tags":["HashSet","LinkedHashSet","TreeSet","HashMap"],"answer":{"oral":"HashSet 底层是 HashMap，无序，增删查平均 O(1)；LinkedHashSet 底层是 LinkedHashMap，额外维护链表，能保持插入顺序，性能略低于 HashSet；TreeSet 底层是 TreeMap，红黑树，元素有序，增删查 O(log n)，还支持范围查询。需要顺序用 LinkedHashSet，需要排序或范围查询用 TreeSet，否则用 HashSet。三个都不是线程安全的。","keyPoints":["HashSet 无序，增删查平均 O(1)","LinkedHashSet 额外维护链表，保留插入顺序","TreeSet 红黑树，按大小排序，操作 O(log n)","要插入顺序用 LinkedHashSet，要排序用 TreeSet"],"followUp":[],"pitfalls":[]}},{"id":"f47","question":"有哪些常用的 JVM 启动参数？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「JVM」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：有哪些常用的 JVM 启动参数。","category":"JVM","difficulty":"中等","tags":["Xms","Xmx","Xmn","Xss","Metaspace","GC"],"answer":{"oral":"最常用的是堆相关的 -Xms 初始堆、-Xmx 最大堆，-Xmn 新生代大小，-Xss 线程栈大小；方法区用 -XX:MetaspaceSize 和 -XX:MaxMetaspaceSize；直接内存用 -XX:MaxDirectMemorySize。排查问题会开 GC 日志，JDK 9 之后用 -Xlog:gc*:file=gc.log:time，JDK 8 用 -XX:+PrintGCDetails；再配 -XX:+HeapDumpOnOutOfMemoryError 和 -XX:HeapDumpPath，OOM 时自动 dump 堆。生产上一般把 -Xms 和 -Xmx 设成一样，避免堆反复伸缩；G1 下不建议再写死 -Xmn。","keyPoints":["-Xms 和 -Xmx 设堆初始与最大值，线上建议设成一致","-Xmn 设新生代大小，-Xss 设单线程栈大小","-XX:MetaspaceSize 控制元空间，溢出会 OOM","开 GC 日志和 HeapDumpOnOutOfMemoryError，便于事后排查"],"followUp":[],"pitfalls":[]}},{"id":"f48","question":"Java 是编译型还是解释型语言？JIT 与 AOT 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「JVM」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Java 是编译型还是解释型语言JIT 与 AOT 有什。","category":"JVM","difficulty":"困难","tags":["JIT","AOT","javac","C1","C2","GraalVM"],"answer":{"oral":"Java 既是编译型也是解释型。javac 先把源码编译成字节码，JVM 启动时解释执行；运行过程中 JIT 会识别热点代码，把它编译成本地机器码，C1 编译快、优化浅，C2 编译慢、优化深，分层编译会组合使用。AOT 是在运行前就编译成机器码，启动快、不用预热，但峰值性能和动态优化不如 JIT，GraalVM Native Image 就是典型。选型上短生命周期任务更看重启动，长服务更看重 JIT 的峰值性能。","keyPoints":["javac 先把源码编译成字节码，运行时由 JVM 执行","解释器逐条执行，启动快但峰值性能低","JIT 把热点代码编译成本地机器码，C1 快、C2 优化深","AOT 在运行前编译，启动快但缺少运行时性能数据"],"followUp":[],"pitfalls":[]}},{"id":"f49","question":"Java 类加载的过程是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「JVM」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Java 类加载的过程是怎样的。","category":"JVM","difficulty":"简单","tags":["clinit"],"answer":{"oral":"类加载分加载、验证、准备、解析、初始化五步。加载是把字节流读进来生成 Class 对象；验证检查格式、语义、字节码安全；准备给静态变量分配内存并赋零值，static final 的编译期常量会直接赋初值；解析把符号引用转成直接引用，可以延迟到首次使用；初始化执行 clinit，真正给静态变量赋值、执行静态代码块。只有主动引用才触发初始化，比如 new、访问静态字段、反射、初始化子类；通过子类引用父类静态字段属于被动引用，不会初始化子类。","keyPoints":["加载：读取字节码并生成 Class 对象","验证：检查格式、元数据和字节码安全","准备：静态变量分配内存并赋零值","解析：符号引用转直接引用；初始化：执行 clinit"],"followUp":["类加载各阶段分别做什么？","什么时候会触发类初始化？"],"pitfalls":["把加载和初始化混为一谈。","忽略准备阶段赋零值，静态变量赋值在 clinit 中完成。"]}},{"id":"f50","question":"JVM 如何判断对象是否存活？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「JVM」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：JVM 如何判断对象是否存活。","category":"JVM","difficulty":"中等","tags":["GC","Roots","finalize"],"answer":{"oral":"JVM 用可达性分析判断对象是否存活，从 GC Roots 出发遍历引用链，能到达的就是存活对象。GC Roots 包括虚拟机栈局部变量引用的对象、方法区静态变量和常量引用的对象、本地方法栈引用的对象、活跃线程、同步锁持有的对象等。引用计数有循环引用问题，JVM 不用它。对象被判定不可达后还要看有没有重写 finalize，但 finalize 已废弃，实际不应依赖。","keyPoints":["引用计数无法处理循环引用","JVM 用可达性分析，从 GC Roots 出发标记","GC Roots 包括栈中引用、静态变量、常量和 JNI 引用","不可达对象还要看是否被 finalize 救回"],"followUp":["JVM 为什么不用引用计数？","可达性分析的 GC Roots 有哪些？"],"pitfalls":["把 finalize 当作对象复活的可靠保证。","忽略循环引用问题。"]}},{"id":"f51","question":"JVM 垃圾回收算法有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「JVM」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：JVM 垃圾回收算法有哪些。","category":"JVM","difficulty":"中等","tags":[],"answer":{"oral":"常见的有标记-清除、复制、标记-整理和分代收集。标记-清除会产生碎片；复制算法把存活对象复制到另一半，没有碎片但浪费空间，适合存活率低的新生代；标记-整理先标记再压缩，适合老年代；分代收集就是新生代用复制、老年代用标记-整理或标记-清除。跨代引用用卡表记录，避免扫描整个老年代；大对象可能直接进老年代，减少复制开销。","keyPoints":["标记-清除不移动对象，但会产生内存碎片","复制算法把存活对象搬到另一半，无碎片但浪费空间","标记-整理在标记后压缩对象，适合老年代","分代收集按对象年龄选择算法，新生代多用复制"],"followUp":["标记-清除、复制、标记-整理各有什么缺点？","分代收集为什么新生代常用复制算法？"],"pitfalls":["认为复制算法没有空间浪费。","把标记-整理说成适合新生代。"]}},{"id":"f52","question":"内存泄漏和内存溢出的区别是什么？OOM 如何排查？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「JVM」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：内存泄漏和内存溢出的区别是什么OOM 如何排查。","category":"JVM","difficulty":"简单","tags":["OOM","jmap","MAT","Arthas","HeapDump"],"answer":{"oral":"内存泄漏是对象已经不用了却还被引用着，回收不掉，越积越多，最终可能撑爆内存；内存溢出是内存确实不够用，直接抛 OutOfMemoryError。OOM 分几种：堆溢出最常见；元空间溢出多是动态生成类或 ClassLoader 泄漏；直接内存溢出要看 MaxDirectMemorySize；线程创建过多会报 unable to create native thread。虚拟机栈递归太深是 StackOverflowError，不是 OOM。排查先看日志和 GC 情况，用 jstat 看趋势，用 jmap 或 HeapDumpOnOutOfMemoryError 导堆，再用 MAT、VisualVM 或 Arthas 分析支配对象和引用链。","keyPoints":["内存泄漏是对象该回收却一直被引用","内存溢出是内存确实不够用","堆、元空间、直接内存和线程栈都可能耗尽；递归过深抛 StackOverflowError，不是 OOM","用 jmap 导堆、MAT 找支配对象、Arthas 在线排查"],"followUp":["内存泄漏和内存溢出怎么区分？","OOM 常用哪些工具和参数排查？"],"pitfalls":["把所有 OOM 都归因于堆内存不够。","忽略 Metaspace、直接内存等非堆 OOM。"]}},{"id":"f53","question":"什么是强引用、软引用、弱引用和虚引用？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「JVM」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是强引用、软引用、弱引用和虚引用。","category":"JVM","difficulty":"中等","tags":["WeakHashMap","ThreadLocal","Cleaner"],"answer":{"oral":"强引用就是普通的 new 和赋值，只要引用还在，GC 绝不回收。软引用在内存不足时才回收，适合做缓存。弱引用只要发生 GC 就回收，不管内存够不够，WeakHashMap 和 ThreadLocal 的 key 用的就是弱引用。虚引用不能通过它访问对象，主要配合 ReferenceQueue 在对象被回收时收到通知，DirectByteBuffer 的 Cleaner 就是这种机制。实际做缓存更推荐 Caffeine，不要自己拿软引用拼。","keyPoints":["强引用只要可达就不会回收","软引用在内存不足时才回收，适合做缓存","弱引用下次 GC 必回收，ThreadLocal key 和 WeakHashMap 用它","虚引用只用于回收通知，配合 Cleaner 管理直接内存"],"followUp":[],"pitfalls":[]}},{"id":"f54","question":"什么是双亲委派？怎么破坏？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「JVM」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是双亲委派怎么破坏。","category":"JVM","difficulty":"中等","tags":["Bootstrap","Ext","App","loadClass","SPI","Tomcat"],"answer":{"oral":"双亲委派是类加载器收到加载请求先交给父加载器，父加载器加载不了才自己加载。顺序是 Bootstrap、Platform（JDK 8 叫 Extension）、Application、自定义。好处是核心类库只由 Bootstrap 加载，避免被自定义类覆盖，保证安全。破坏方式有重写 loadClass 不向上委派，比如 Tomcat 的 WebAppClassLoader 优先加载应用类；SPI 用线程上下文类加载器加载实现；OSGi 则是网状委派。JDK 9 之后扩展类加载器改名为平台类加载器。","keyPoints":["类加载请求先交给父加载器，父加载不了才自己加载","保证核心类库不被自定义类覆盖，也避免重复加载","重写 loadClass 或使用线程上下文类加载器可破坏","SPI、Tomcat 隔离、OSGi 都用破坏委派实现"],"followUp":["双亲委派在哪些场景会被打破？","Tomcat 为什么要破坏双亲委派？"],"pitfalls":["认为双亲委派是强制规范。","忽略线程上下文类加载器。"]}},{"id":"f55","question":"JVM 运行时内存区域如何划分？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「JVM」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：JVM 运行时内存区域如何划分。","category":"JVM","difficulty":"中等","tags":[],"answer":{"oral":"运行时数据区分线程私有和线程共享。线程私有的是程序计数器、虚拟机栈、本地方法栈；线程共享的是堆和方法区，JDK 8 之后方法区由元空间实现，放在本地内存。另外还有不属于运行时数据区的直接内存，NIO 的 DirectByteBuffer 就用它。堆是 GC 的主要区域，分新生代和老年代；栈里每个方法对应一个栈帧，存局部变量、操作数栈和返回地址，递归太深会 StackOverflowError。","keyPoints":["线程私有：程序计数器、虚拟机栈、本地方法栈","线程共享：堆和方法区（元空间）","直接内存不属于运行时数据区，但受 MaxDirectMemorySize 限制","栈存栈帧和局部变量，堆存对象实例"],"followUp":["堆和栈分别放什么？","元空间和永久代有什么区别？"],"pitfalls":["把字符串常量池说成一直在方法区。","忽略 JDK 8 元空间在本地内存。"]}},{"id":"f56","question":"满足什么条件时，一个 Java 类会被卸载？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":68,"frequencyReason":"「JVM」了解题，偏细节或低频，时间有限时可后置。考点：满足什么条件时，一个 Java 类会被卸载。","category":"JVM","difficulty":"中等","tags":["ClassLoader","Class"],"answer":{"oral":"类卸载条件比较苛刻：该类的所有实例都已经被回收；加载它的 ClassLoader 已经被回收；对应的 Class 对象没有任何引用，也不能再通过反射创建实例。普通 Application ClassLoader 加载的类基本不会被卸载，因为加载器一直活着。只有自定义 ClassLoader、OSGi、热部署这类场景才比较容易满足卸载条件。类卸载发生在 Full GC 时，元空间里对应的类元数据才会被释放。","keyPoints":["该类的所有实例都已被回收","加载它的 ClassLoader 已被回收","Class 对象没有任何引用","通常只有自定义类加载器加载的类才会被卸载"],"followUp":[],"pitfalls":[]}},{"id":"f57","question":"什么是 Class 常量池、运行时常量池和字符串常量池？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":65,"frequencyReason":"「JVM」了解题，偏细节或低频，时间有限时可后置。考点：什么是 Class 常量池、运行时常量池和字符串常量池。","category":"JVM","difficulty":"困难","tags":["Class","intern"],"answer":{"oral":"Class 常量池是 Class 文件里的表，存放字面量和符号引用，比如类名、方法名、字段名。类加载后这些内容进入运行时常量池，JDK 7 以前在方法区，JDK 8 之后随元空间放在本地内存。字符串常量池比较特殊，JDK 7 起移到了堆里，专门存放字符串字面量和 intern 后的引用，这样能被 GC 回收，也方便复用。intern 在池里存在时返回池中引用，不存在时把当前字符串放进去再返回。","keyPoints":["Class 常量池是 class 文件中的一张表，存字面量和符号引用","运行时常量池是类加载后方法区里的版本","字符串常量池在堆中，存字符串字面量","intern 把堆中字符串的引用放入字符串池复用"],"followUp":[],"pitfalls":[]}},{"id":"f58","question":"JVM 中一次完整的 GC 流程是怎样的？YGC/FGC 何时触发？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「JVM」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：JVM 中一次完整的 GC 流程是怎样的YGC/FGC 。","category":"JVM","difficulty":"困难","tags":["GC","YGC","FGC","Eden","Survivor","Metaspace"],"answer":{"oral":"一次完整的 GC 通常先发生 Young GC：Eden 满了触发，把 Eden 和 From Survivor 的存活对象复制到 To Survivor，年龄加一，清空 Eden 和 From，然后交换 Survivor。对象年龄达到阈值、Survivor 放不下、或者大对象，会晋升老年代，还有动态年龄判断和分配担保。老年代满了、元空间不足、或者调用 System.gc，会触发 Full GC，通常伴随 STW；G1 下还可能发生 Mixed GC。","keyPoints":["Eden 满触发 Young GC，存活对象复制到 Survivor","对象年龄达到阈值或 Survivor 放不下就晋升老年代","老年代不足、元空间满、System.gc 会触发 Full GC","Full GC 一般回收整个堆和元空间"],"followUp":["YGC 的触发条件是什么？","Full GC 一定会回收元空间吗？"],"pitfalls":["认为 System.gc 一定触发 Full GC。","忽略不同收集器的 GC 流程差异。"]}},{"id":"f59","question":"Full GC 多久一次正常？线上频繁 Full GC 如何排查？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「JVM」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Full GC 多久一次正常线上频繁 Full GC 如。","category":"JVM","difficulty":"中等","tags":["Full","GC","jstat","Dump"],"answer":{"oral":"Full GC 多久一次没有绝对标准，要看堆大小、对象分配速率和收集器，一般健康系统可能几小时甚至几天一次，频繁到几分钟一次就不正常。排查先看 GC 日志，确认是老年代涨满、元空间泄漏、还是显式 System.gc；再用 jstat 观察各代变化，jmap 导出堆找大对象或泄漏；最后检查堆参数、缓存、大对象和收集器选型。G1 还要看 Humongous 对象和 Mixed GC 的回收效果，别只盯着 Full GC 次数。","keyPoints":["没有统一的正常频率，要看堆大小和业务量","频繁 Full GC 先看 GC 日志和 jstat 的回收前后变化","导堆看大对象、缓存、集合是否泄漏","结合收集器和堆参数调整，必要时扩容"],"followUp":[],"pitfalls":[]}},{"id":"f60","question":"常见垃圾收集器有哪些？如何选型？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「JVM」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：常见垃圾收集器有哪些如何选型。","category":"JVM","difficulty":"中等","tags":["Serial","ParNew","Parallel","CMS","G1","ZGC"],"answer":{"oral":"常见收集器：Serial 单线程、适合小堆和客户端；ParNew 是新生代并行版，常和 CMS 搭配；Parallel 关注吞吐量，适合批处理；CMS 关注低延迟，但用标记-清除会有碎片，JDK 9 标记废弃、JDK 14 移除；G1 把堆分成 Region，可预测停顿，JDK 9 起成为默认，适合大堆和低延迟；ZGC 用染色指针和读屏障，停顿在毫秒级，适合超大堆；Shenandoah 思路类似。选型看堆大小、延迟和吞吐要求，也要看 JDK 版本支持。","keyPoints":["Serial 单线程，适合小堆和客户端","Parallel 多线程吞吐高，适合批处理","CMS 追求低停顿，但有碎片和并发失败风险","G1 分 Region 可预测停顿，ZGC 染色指针、停顿极低"],"followUp":["G1 和 CMS 的区别是什么？","ZGC 适合什么场景？"],"pitfalls":["说 CMS 在 JDK 9 被移除（实际 JDK 9 废弃、JDK 14 移除）。","忽略收集器与堆大小、停顿目标的关系。"]}},{"id":"f61","question":"Spring 第一次启动执行慢，从 JVM 角度怎么解释？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":65,"frequencyReason":"「JVM」了解题，偏细节或低频，时间有限时可后置。考点：Spring 第一次启动执行慢，从 JVM 角度怎么解释。","category":"JVM","difficulty":"困难","tags":["Spring","Bean","JIT"],"answer":{"oral":"Spring 第一次启动慢，从 JVM 角度看有几块：一是大量类加载和字节码验证，Spring 本身类就多，还有各种自动配置；二是反射、动态代理、CGLIB 生成代理类，这些都绕不开动态解析；三是 Bean 实例化和依赖注入要做大量对象创建；四是 JIT 还没预热，方法先解释执行，跑一段时间才编译成本地代码；另外元空间要分配和扩容。所以第一次慢、后面快是正常的，可以靠 AOT、CDS 或预热来缓解。","keyPoints":["首次启动要加载大量类并做验证","反射、代理、Bean 实例化都发生在启动阶段","JIT 还没预热，代码以解释执行为主","元空间和堆的初始分配也会拉长启动时间"],"followUp":[],"pitfalls":[]}},{"id":"f62","question":"JVM 类加载器如何保证核心类库不被覆盖？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":66,"frequencyReason":"「JVM」了解题，偏细节或低频，时间有限时可后置。考点：JVM 类加载器如何保证核心类库不被覆盖。","category":"JVM","difficulty":"困难","tags":["Bootstrap","java."],"answer":{"oral":"靠双亲委派加 Bootstrap 优先。应用类加载器收到加载 java.lang.String 这类核心类的请求，会先交给父加载器，最终由 Bootstrap 从 JDK 自带的核心库加载，应用自己的 classpath 里即使放一个同名的 String 也不会被加载。再加上加载时的包权限检查和沙箱，核心类库不会被随意覆盖。自定义类加载器如果重写 loadClass 强行加载 java.* 包，也会被 SecurityManager 或模块系统拦下来。","keyPoints":["双亲委派让 Bootstrap 先加载，核心类优先","java.* 等包由启动类加载器负责","自定义类加载器无法覆盖已加载的核心类","这是 JVM 安全模型的一部分"],"followUp":[],"pitfalls":[]}},{"id":"f63","question":"对象创建过程与内存布局是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「JVM」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：对象创建过程与内存布局是怎样的。","category":"JVM","difficulty":"中等","tags":["TLAB","Mark","Word"],"answer":{"oral":"对象创建先做类加载检查，确认类已加载、初始化；然后分配内存，堆规整时用指针碰撞，不规整时用空闲列表，多线程下用 TLAB 本地分配缓冲减少竞争；接着把内存清零，设置对象头，包括 Mark Word 和类型指针；最后执行构造器。对象在内存里分对象头、实例数据和对齐填充，Mark Word 存 hash、GC 年龄、锁状态，类型指针指向 Class，开启指针压缩后占 4 字节。","keyPoints":["先检查类是否已加载，未加载先触发类加载","堆中分配内存，指针碰撞或空闲列表，TLAB 减少竞争","内存清零，设置对象头 Mark Word 和类型指针","最后执行构造方法，对象才真正可用"],"followUp":[],"pitfalls":[]}},{"id":"f64","question":"什么是三色标记？并发标记为什么会漏标？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「JVM」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是三色标记并发标记为什么会漏标。","category":"JVM","difficulty":"困难","tags":["CMS","SATB","G1"],"answer":{"oral":"三色标记把对象分成黑、灰、白：黑色是已扫描且引用都处理完的，灰色是自身标记了但引用还没扫完的，白色是还没访问到的。并发标记时用户线程还在改引用，可能漏标：一个白对象被黑对象引用，同时它原来的灰色引用被删除，导致它被当成垃圾。CMS 用增量更新，记录黑对象新增的引用，重新扫描；G1 用 SATB，记录删除前的引用快照，按快照完成标记。","keyPoints":["白未访问、灰已访问但子节点未扫完、黑已完成","并发标记时用户线程修改引用，可能导致对象漏标","CMS 用增量更新，G1 用 SATB 记录旧引用","漏标会误回收存活对象，必须靠写屏障修正"],"followUp":[],"pitfalls":[]}},{"id":"f65","question":"什么是安全点（SafePoint）和安全区域？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":65,"frequencyReason":"「JVM」了解题，偏细节或低频，时间有限时可后置。考点：什么是安全点（SafePoint）和安全区域。","category":"JVM","difficulty":"困难","tags":["SafePoint","STW"],"answer":{"oral":"安全点是 JVM 能安全执行 GC 的特定位置，比如方法调用、循环回边、异常跳转，线程运行到这些点才会主动检查是否需要停顿。GC 需要 STW，但不能随便停，所以要等所有线程走到安全点。安全区域是线程处于 sleep 或阻塞状态时的一段代码区域，在这段时间内引用关系不变，GC 不用等它，等它离开安全区域时再检查。减少停顿可以优化安全点位置，避免大循环里没有轮询点。","keyPoints":["GC 需要 STW，线程必须跑到安全点才能停","安全点通常设在方法调用、循环回边等位置","Safe Region 让休眠线程也能安全停顿","减少安全点轮询和停顿时间是低延迟优化方向"],"followUp":[],"pitfalls":[]}},{"id":"f66","question":"JIT 有哪些优化手段？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「JVM」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：JIT 有哪些优化手段。","category":"JVM","difficulty":"困难","tags":["JIT"],"answer":{"oral":"JIT 常见优化有方法内联，把小方法直接展开减少调用开销；逃逸分析，判断对象是否逃出方法，没逃出就可以栈上分配、标量替换，甚至消除对象；锁消除，确认锁对象不会逃逸就去掉同步；锁粗化，把连续的加锁合并；还有公共子表达式消除、循环展开、常量折叠、死代码消除。热点探测一般基于方法调用计数和回边计数，达到阈值才触发编译。","keyPoints":["方法内联消除调用开销，是很多优化的前提","逃逸分析后做标量替换、栈上分配、锁消除","还有公共子表达式消除、循环展开、常量折叠","热点探测基于调用计数器和回边计数器"],"followUp":[],"pitfalls":[]}},{"id":"f67","question":"线上 CPU 100% 如何排查？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「JVM」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：线上 CPU 100% 如何排查。","category":"JVM","difficulty":"中等","tags":["CPU","top","printf","jstack","Arthas","GC"],"answer":{"oral":"先 top 找到 CPU 高的进程，再 top -H 找到高 CPU 的线程，把线程 id 转成十六进制，用 jstack 或 Arthas 的 thread 命令查这个线程在干什么。常见原因是死循环、频繁 GC、锁自旋、正则回溯、大量计算。如果是 GC 线程高，就看堆和 GC 日志；如果是业务线程，就看栈里的热点方法，必要时用 async-profiler 做火焰图。","keyPoints":["top -H 找到占 CPU 的线程，printf 转十六进制","jstack 按 nid 找到对应线程栈","Arthas thread 可直接看最忙线程","常见原因是死循环、频繁 GC、锁自旋"],"followUp":[],"pitfalls":[]}},{"id":"f68","question":"什么情况会导致 JVM 退出？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":68,"frequencyReason":"「JVM」了解题，偏细节或低频，时间有限时可后置。考点：什么情况会导致 JVM 退出。","category":"JVM","difficulty":"中等","tags":["main","System.exit","kill","OOM"],"answer":{"oral":"常见情况有：main 方法结束且所有非守护线程都结束；调用了 System.exit；收到 kill 信号；最后一个非守护线程抛出未捕获异常。OOM 不一定直接退出：如果发生在某个普通线程，线程结束但 JVM 可能继续跑；只有主线程或最后一个非守护线程因 OOM 终止，进程才退出。守护线程不阻止 JVM 退出，主线程结束后守护线程会被直接终止，finally 也不一定执行。","keyPoints":["所有非守护线程结束，main 返回后正常退出","调用 System.exit 触发关闭钩子后退出","未捕获异常导致主线程终止","kill 信号、OOM 也可能让 JVM 退出"],"followUp":[],"pitfalls":[]}},{"id":"f69","question":"堆外内存（直接内存）如何回收？会 OOM 吗？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「JVM」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：堆外内存（直接内存）如何回收会 OOM 吗。","category":"JVM","difficulty":"困难","tags":["OOM","DirectByteBuffer","Cleaner","XX","MaxDirectMemorySize","Netty"],"answer":{"oral":"堆外内存主要靠 Cleaner 和虚引用回收。DirectByteBuffer 被回收时，Cleaner 会把对应的直接内存释放掉；但它依赖 GC 发现对象不可达，所以可能延迟，极端情况要等 Full GC。可以设置 -XX:MaxDirectMemorySize 限制大小，避免无限增长，超出会抛 OutOfMemoryError。Netty 自己维护池化内存，用引用计数和池化分配减少 DirectByteBuffer 的创建和回收压力，用完必须 release。","keyPoints":["DirectByteBuffer 由 Cleaner 关联虚引用，GC 时触发释放","不显式释放只能等 GC，容易堆积","受 -XX:MaxDirectMemorySize 限制，超了会 OOM","Netty 用池化直接内存减少分配释放开销"],"followUp":[],"pitfalls":[]}},{"id":"f70","question":"创建线程有几种方式？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：创建线程有几种方式。","category":"并发编程","difficulty":"中等","tags":["Thread","Runnable","Callable+FutureTask"],"answer":{"oral":"常见有四种：继承 Thread 并重写 run；实现 Runnable 交给 Thread；实现 Callable 配合 FutureTask，可以拿返回值、抛异常；或者直接提交到线程池。前两种本质都是实现 run 方法，Callable 更适合有结果的异步任务。实际项目基本都用线程池或 CompletableFuture，因为线程创建销毁成本高，池化后能复用、能控制并发数、能做监控和优雅关闭。Java 21 之后，IO 密集任务还可以用虚拟线程。","keyPoints":["继承 Thread 重写 run，但不利于任务复用","实现 Runnable 把任务和线程解耦","Callable 配合 FutureTask 能拿到返回值和异常","生产环境统一用线程池，避免频繁创建销毁"],"followUp":["Runnable 和 Callable 有什么区别？","什么时候用线程池，什么时候直接 new Thread？"],"pitfalls":["认为实现 Runnable 没有返回值就不能异步执行。","忽略 start 和 run 的区别。"]}},{"id":"f71","question":"线程有几种状态，状态之间怎么流转？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：线程有几种状态，状态之间怎么流转。","category":"并发编程","difficulty":"中等","tags":["RUNNABLE","BLOCKED","WAITING","TIMED","TERMINATED"],"answer":{"oral":"Java 线程有六种状态：NEW 新建、RUNNABLE 可运行、BLOCKED 阻塞、WAITING 无限等待、TIMED_WAITING 超时等待、TERMINATED 终止。调用 start 进入 RUNNABLE；竞争 synchronized 锁失败进入 BLOCKED；调用 wait、join、park 进入 WAITING；带超时的 wait、sleep、join 进入 TIMED_WAITING；被 notify 或锁释放后回到 RUNNABLE；run 结束进入 TERMINATED。注意 BLOCKED 是等锁，WAITING 是主动等待通知，IO 阻塞在 JVM 看来仍是 RUNNABLE。","keyPoints":["NEW 已创建未启动，RUNNABLE 可运行或正在运行","BLOCKED 等待 synchronized 锁","WAITING 无限等待 notify 或 join，TIMED_WAITING 带超时","TERMINATED 已结束，状态不可逆"],"followUp":["BLOCKED 和 WAITING 有什么区别？","notify 之后线程会立刻运行吗？"],"pitfalls":["把 TIMED_WAITING 和 WAITING 混淆。","认为 wait 会释放所有锁。"]}},{"id":"f72","question":"Java 线程池有几种创建方式？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Java 线程池有几种创建方式。","category":"并发编程","difficulty":"中等","tags":["Executors","ThreadPoolExecutor","OOM"],"answer":{"oral":"可以用 Executors 的 newFixedThreadPool、newCachedThreadPool、newSingleThreadExecutor、newScheduledThreadPool，也可以直接 new ThreadPoolExecutor。Executors 的问题是很多队列无界或线程数无上限，任务堆积可能 OOM，所以阿里规约禁止直接用。生产上推荐原生构造，明确核心数、最大数、有界队列和拒绝策略，再配合监控和动态调整。","keyPoints":["Executors 提供固定、缓存、单线程、定时四类工厂方法","底层都是 ThreadPoolExecutor，只是参数不同","固定和单线程池用无界队列，任务堆积可能 OOM","阿里规约要求直接用 ThreadPoolExecutor 明确参数"],"followUp":[],"pitfalls":[]}},{"id":"f73","question":"ThreadPoolExecutor 的七个核心参数与执行流程？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：ThreadPoolExecutor 的七个核心参数与执。","category":"并发编程","difficulty":"中等","tags":["ThreadPoolExecutor","core","max","ctl"],"answer":{"oral":"七个参数是核心线程数、最大线程数、空闲线程存活时间、时间单位、任务队列、线程工厂、拒绝策略。提交任务时，核心线程没满就新建核心线程；核心满了就进队列；队列满了且没到最大线程数就新建非核心线程；最大也满了就执行拒绝策略。空闲的非核心线程超过存活时间会被回收，核心线程默认不回收，除非 allowCoreThreadTimeOut。底层用 ctl 一个原子变量同时记录线程数和运行状态。","keyPoints":["核心参数：核心线程数、最大线程数、空闲存活时间和单位","还有工作队列、线程工厂、拒绝策略","执行顺序：先核心线程，再入队，队列满才扩到最大线程","超过最大线程执行拒绝策略，ctl 用一个整数存状态和线程数"],"followUp":["核心线程数、最大线程数和队列的关系是什么？","线程池什么时候创建非核心线程？"],"pitfalls":["认为线程池会先扩容到最大线程数再入队。","忽略空闲回收和 allowCoreThreadTimeOut。"]}},{"id":"f74","question":"线程数设置多少合适？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：线程数设置多少合适。","category":"并发编程","difficulty":"困难","tags":["CPU","N+1","IO"],"answer":{"oral":"没有固定公式。CPU 密集型一般设成 CPU 核数加一，减少上下文切换；IO 密集型可以按 核数乘上一加平均等待时间除以平均计算时间 估算，常见经验是 2N 到 3N。但真实业务有数据库、下游 RPC、锁竞争，线程太多反而增加切换和内存开销。更稳的做法是先按公式估初值，再用压测看 QPS、RT、CPU、队列长度和拒绝次数逐步调整，也可以结合 Little 定律用 QPS 乘以平均 RT 估算所需并发。","keyPoints":["CPU 密集约为核数加 1","IO 密集可用核数乘以（1 加等待时间除以计算时间）","公式只是起点，还要考虑下游容量","最终要结合压测找到最优线程数"],"followUp":[],"pitfalls":[]}},{"id":"f75","question":"线程池的拒绝策略有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：线程池的拒绝策略有哪些。","category":"并发编程","difficulty":"中等","tags":["Abort","CallerRuns","Discard","DiscardOldest"],"answer":{"oral":"ThreadPoolExecutor 内置四种：AbortPolicy 直接抛 RejectedExecutionException；CallerRunsPolicy 让提交任务的线程自己执行，起到反压作用；DiscardPolicy 静默丢弃；DiscardOldestPolicy 丢掉队列里最老的任务再提交。生产上常用 CallerRuns 或自定义策略，把任务落库、发 MQ 或降级，保证不丢关键任务。Discard 系列要慎用，至少得打日志和计数，否则问题很难发现。","keyPoints":["AbortPolicy 抛异常，是默认策略","CallerRunsPolicy 让提交线程自己执行，形成反压","DiscardPolicy 静默丢弃，DiscardOldestPolicy 丢最老的","核心业务自定义策略，落库或转 MQ 兜底"],"followUp":[],"pitfalls":[]}},{"id":"f76","question":"任务特别多、队列满了又不能拒绝怎么办？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：任务特别多、队列满了又不能拒绝怎么办。","category":"并发编程","difficulty":"中等","tags":["MQ"],"answer":{"oral":"先别急着拒绝，可以从几个方向处理：临时扩容线程和队列，但要评估下游承受能力；用 MQ 削峰，把任务异步化；对非核心任务降级或直接返回兜底；把任务持久化，之后补偿；或者用独立线程池隔离不同业务。实在要阻塞提交，可以用有界队列加 CallerRuns 或信号量控制入口流量，避免把线程池打爆。核心原则是入口限流、异步削峰、失败可补偿。","keyPoints":["先评估能否临时扩容线程或队列","用 MQ 削峰，把任务异步化","非核心任务降级或落库延后处理","阻塞提交会拖慢上游，要配合超时和独立线程池"],"followUp":[],"pitfalls":[]}},{"id":"f77","question":"动态线程池如何实现？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：动态线程池如何实现。","category":"并发编程","difficulty":"困难","tags":["setCorePoolSize","setMaximumPoolSize","Hippo4j","Dynamic-TP"],"answer":{"oral":"动态线程池核心是把核心数、最大数、队列容量、拒绝策略做成配置，放到配置中心，应用监听变更后调用 setCorePoolSize、setMaximumPoolSize。队列容量不能直接改，需要自定义可调整容量的队列，JDK 自带队列的 capacity 是 final 的。再配合监控，采集活跃线程数、队列长度、拒绝次数、任务耗时，超过阈值告警。开源方案有 Hippo4j、Dynamic-TP，思路都是配置动态化加监控。","keyPoints":["核心线程数和最大线程数支持运行时修改","接配置中心监听变更，调用 setCorePoolSize 等方法","队列容量不能动态改，通常自定义队列","配合监控告警，Hippo4j、Dynamic-TP 已封装"],"followUp":[],"pitfalls":[]}},{"id":"f78","question":"如何优雅关闭线程池？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：如何优雅关闭线程池。","category":"并发编程","difficulty":"中等","tags":["shutdown","shutdownNow","awaitTermination"],"answer":{"oral":"先调用 shutdown，停止接收新任务，但已提交的任务继续执行；如果要不等待，调用 shutdownNow，尝试中断线程并返回未执行的任务；然后 awaitTermination 在超时时间内等待线程池结束。生产上要配合优雅停机，比如 Spring 的 graceful shutdown 或 K8s 的 preStop，等在途任务处理完再退出，避免请求丢一半。shutdownNow 不保证任务真的停下，要看任务是否响应中断。","keyPoints":["shutdown 不再接新任务，等待已提交任务执行完","shutdownNow 中断工作线程并返回未执行任务","awaitTermination 设超时，超时后再强制处理","配合应用优雅停机，先摘流量再关池"],"followUp":[],"pitfalls":[]}},{"id":"f79","question":"什么是守护线程，和普通线程有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是守护线程，和普通线程有什么区别。","category":"并发编程","difficulty":"中等","tags":["Daemon","GC","finally"],"answer":{"oral":"守护线程是为其他线程服务的后台线程，比如 GC 线程。区别是它不阻止 JVM 退出：当所有非守护线程结束，JVM 会直接退出，守护线程会被强制终止，finally 不保证执行。用 setDaemon(true) 设置，必须在该线程 start 之前设置。业务线程不要设成守护线程，否则主线程一结束任务可能被中断；线程池里的工作线程也不应该设置成守护线程。","keyPoints":["setDaemon(true) 的线程不阻止 JVM 退出","所有非守护线程结束，守护线程会被直接终止","GC 线程就是守护线程","守护线程被终止时 finally 不保证执行"],"followUp":[],"pitfalls":[]}},{"id":"f80","question":"多线程上下文切换是什么意思？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：多线程上下文切换是什么意思。","category":"并发编程","difficulty":"困难","tags":["IO"],"answer":{"oral":"上下文切换是 CPU 从一个线程切换到另一个线程时，保存当前线程的寄存器、程序计数器、栈等信息，再恢复另一个线程的状态。时间片轮转、锁竞争、IO 阻塞、调用 park 都会触发。切换本身不干活但耗 CPU，线程数过多、锁竞争激烈时切换频繁，性能反而下降，所以线程不是越多越好。可以用 vmstat、pidstat 看上下文切换次数，再结合业务压测判断。","keyPoints":["时间片用完切换线程，要保存和恢复寄存器和程序计数器","锁竞争、IO 阻塞也会触发切换","切换本身不干活，线程过多反而降低吞吐","减少锁粒度、用无锁结构、控制线程数"],"followUp":[],"pitfalls":[]}},{"id":"f81","question":"并发和并行的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":65,"frequencyReason":"「并发编程」了解题，偏细节或低频，时间有限时可后置。考点：并发和并行的区别。","category":"并发编程","difficulty":"中等","tags":[],"answer":{"oral":"并发是宏观上多个任务交替推进，单核也能做到，靠时间片切换；并行是同一时刻真正有多个任务在跑，需要多核。并发关注结构和正确性，并行关注同时执行和吞吐。我们常说的并发编程其实包含并行，目标都是提高 CPU 利用率和吞吐量。单核上并发主要是在 IO 等待时让别的任务上 CPU，纯计算的总吞吐不会提升，所以虚拟线程能把阻塞等待的并发度做高，但算力还是受核数限制。并发编写的难点在于共享状态，可见性、原子性和有序性都要自己保证。","keyPoints":["并发是宏观上交替推进，单核也能并发","并行是同一时刻真正同时执行，需要多核","并发关注结构和吞吐，并行关注算力","两者目标都是提高资源利用率"],"followUp":[],"pitfalls":[]}},{"id":"f82","question":"线程、进程、协程的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「并发编程」
