进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：线程、进程、协程的区别。","category":"并发编程","difficulty":"中等","tags":[],"answer":{"oral":"进程是资源分配的基本单位，有独立内存空间；线程是 CPU 调度的基本单位，共享进程内存，切换开销小；协程是用户态的轻量级线程，由程序自己调度，切换不经过内核，开销更小。Java 21 的虚拟线程就是一种协程式实现，由 JVM 调度到少量载体线程上，适合大量 IO 阻塞任务。线程适合 CPU 密集或需要真正并行的场景，协程适合高并发 IO。","keyPoints":["进程是资源分配单位，线程是调度单位","线程共享进程内存，切换开销比进程小","协程是用户态调度，切换不陷内核，更轻量","Java 21 虚拟线程就是 M:N 协程模型"],"followUp":[],"pitfalls":[]}},{"id":"f83","question":"Java 中常见的锁有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Java 中常见的锁有哪些。","category":"并发编程","difficulty":"中等","tags":[],"answer":{"oral":"按不同维度分：乐观锁和悲观锁；公平锁和非公平锁；独占锁和共享锁；读写锁；可重入锁；自旋锁；分段锁。Java 里具体有 synchronized、ReentrantLock、ReentrantReadWriteLock、StampedLock、Semaphore、CountDownLatch 等。回答时先说分类维度，再举具体实现和适用场景，比如读多写少用读写锁，高并发计数用 LongAdder，需要超时和可中断用 ReentrantLock。","keyPoints":["乐观锁假设冲突少，用 CAS 重试","悲观锁先加锁再操作，适合写多冲突多","还有公平/非公平、独占/共享、读写锁、自旋锁","按竞争程度和读写比例选择"],"followUp":[],"pitfalls":[]}},{"id":"f84","question":"什么是线程死锁，如何排查与解决？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是线程死锁，如何排查与解决。","category":"并发编程","difficulty":"中等","tags":["jstack","Arthas"],"answer":{"oral":"死锁需要四个条件同时满足：互斥、持有并等待、不可剥夺、循环等待。排查用 jstack 或 Arthas 的 thread -b，能看到互相等待的线程和锁；也可以看线程 dump 里的 Found one Java-level deadlock。解决思路是破坏条件：按固定顺序加锁、用 tryLock 带超时、缩小锁范围、减少嵌套锁、把锁粒度拆细。线上还要加监控和告警，避免死锁拖垮整个线程池。","keyPoints":["互斥、占有且等待、不可抢占、循环等待四个条件","jstack 或 Arthas 能直接打印死锁线程","按固定顺序加锁，破坏循环等待","用 tryLock 超时、缩小锁范围、减少嵌套锁"],"followUp":["死锁的四个必要条件是什么？","jstack 怎么定位死锁？"],"pitfalls":["只说“互相等待”，不解释四个条件。","认为设置超时就一定能解决所有死锁。"]}},{"id":"f85","question":"ThreadLocal 的实现原理？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：ThreadLocal 的实现原理。","category":"并发编程","difficulty":"中等","tags":["ThreadLocal","ThreadLocalMap","Entry","set","get","remove"],"answer":{"oral":"每个 Thread 内部有一个 ThreadLocalMap，key 是 ThreadLocal 对象本身，value 是业务值。调用 set 时以当前线程为键找到自己的 map，再以 ThreadLocal 为 key 存值；get 同理。Entry 的 key 是弱引用，value 是强引用。因为数据跟着线程走，所以天然线程隔离，但线程池复用线程时要记得 remove。Map 用线性探测解决冲突，不是链表。","keyPoints":["每个 Thread 持有一个 ThreadLocalMap","key 是 ThreadLocal 弱引用，value 是强引用","哈希冲突用线性探测解决","set、get、remove 都操作当前线程的 map"],"followUp":["ThreadLocalMap 的 key 为什么用弱引用？","父子线程如何传递 ThreadLocal？"],"pitfalls":["认为 ThreadLocal 是共享变量。","忽略线程池复用导致的数据残留。"]}},{"id":"f86","question":"ThreadLocal 为什么会导致内存泄漏？怎么解决？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：ThreadLocal 为什么会导致内存泄漏怎么解决。","category":"并发编程","difficulty":"中等","tags":["ThreadLocal","value","remove"],"answer":{"oral":"Entry 的 key 是弱引用，ThreadLocal 对象本身被回收后 key 会变成 null，但 value 还是强引用，Map 又挂在 Thread 上，线程池里的线程长期存活，value 就一直回收不掉，造成泄漏。解决办法是用完必须 remove，尤其是线程池场景；也可以把 ThreadLocal 声明成 static final 延长 key 生命周期，但这只是减少 key 被回收，value 仍要 remove。ThreadLocalMap 在 get、set 时会顺手清理 key 为 null 的 Entry，但不是及时兜底。","keyPoints":["key 是弱引用会被回收，value 是强引用留在 map 里","线程池线程长期存活，value 一直不释放","用完必须调用 remove","声明为 static 只能延长 key 生命周期，不能根治"],"followUp":[],"pitfalls":[]}},{"id":"f87","question":"ThreadLocal 的使用场景有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：ThreadLocal 的使用场景有哪些。","category":"并发编程","difficulty":"中等","tags":["ThreadLocal","MDC"],"answer":{"oral":"典型场景是线程上下文传递：数据库连接和事务绑定，保证同一线程用同一个连接；多数据源动态切换；用户登录信息、租户信息透传；日志 MDC 放 traceId，做链路追踪；还有 SimpleDateFormat 这种非线程安全对象的线程私有副本。核心都是把数据绑定到当前线程，避免加锁和参数层层传递。注意线程池复用时要清理，否则会串数据。","keyPoints":["事务中绑定同一个数据库连接","动态数据源切换时保存当前数据源","保存用户上下文和租户信息","MDC 存 TraceId 做日志链路追踪"],"followUp":[],"pitfalls":[]}},{"id":"f88","question":"父子线程之间如何传递数据？线程池复用下怎么办？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：父子线程之间如何传递数据线程池复用下怎么办。","category":"并发编程","difficulty":"中等","tags":["InheritableThreadLocal","TTL"],"answer":{"oral":"父子线程传值可以用 InheritableThreadLocal，它在创建子线程时会复制父线程的值，但线程池复用线程时不会重新创建线程，所以复制不到，值会串。解决办法是用阿里开源的 TransmittableThreadLocal，配合 TTL 装饰线程池，在任务提交时捕获上下文，执行时回填，执行完恢复。也可以自己装饰 Executor，提交任务时做上下文快照和恢复。","keyPoints":["InheritableThreadLocal 在创建子线程时复制，线程池复用会失效","TransmittableThreadLocal 装饰任务，提交时捕获、执行时回放","也可把上下文作为任务参数手动传递","阿里 TTL 是最常用方案"],"followUp":[],"pitfalls":[]}},{"id":"f89","question":"volatile 的作用与原理？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：volatile 的作用与原理。","category":"并发编程","difficulty":"中等","tags":["volatile","MESI"],"answer":{"oral":"volatile 保证可见性和有序性，不保证原子性。写 volatile 变量会立即刷回主内存并让其他 CPU 缓存失效，读会从主内存读；同时插入内存屏障，禁止指令重排，所以双重检查锁的单例必须给实例加 volatile，否则可能拿到构造未完成的对象。但 i++ 这种复合操作还是会丢更新，需要 AtomicInteger 或加锁。volatile 适合状态标志、一次性安全发布，不适合计数。","keyPoints":["保证可见性，写立即刷主存，读直接读主存","通过内存屏障禁止指令重排","不保证复合操作原子性，i++ 仍不安全","双重检查单例必须给实例字段加 volatile"],"followUp":["volatile 能保证原子性吗？","volatile 和 synchronized 怎么选？"],"pitfalls":["说 volatile 能保证 i++ 的原子性。","忽略禁止指令重排的语义。"]}},{"id":"f90","question":"synchronized 的实现原理与锁升级？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：synchronized 的实现原理与锁升级。","category":"并发编程","difficulty":"困难","tags":["synchronized","monitorenter","exit","ObjectMonitor","Mark","Word"],"answer":{"oral":"synchronized 修饰代码块编译成 monitorenter 和 monitorexit，修饰方法加 ACC_SYNCHRONIZED 标志，底层关联 ObjectMonitor。锁状态存在对象头 Mark Word 里，早期有锁升级：无锁、偏向锁、轻量级锁、重量级锁。偏向锁记录线程 id，轻量级锁用 CAS 自旋，竞争激烈才升级成重量级锁并挂起线程。注意 JDK 15 起偏向锁默认禁用，JDK 18 已移除实现，新版本可以按无锁、轻量级、重量级来讲。JIT 还会做锁消除和锁粗化。","keyPoints":["同步代码块编译为 monitorenter 和 monitorexit","锁信息记在对象头 Mark Word，关联 ObjectMonitor","旧版本无竞争走偏向锁，轻度竞争用轻量级锁 CAS，激烈竞争升级重量级","JDK 15 起偏向锁默认关闭，JIT 还会做锁消除和锁粗化"],"followUp":["锁升级的过程是怎样的？","偏向锁在现代 JDK 还默认开启吗？"],"pitfalls":["把锁升级说成任何场景都必然发生。","忽略 JDK 15+ 偏向锁默认禁用。"]}},{"id":"f91","question":"synchronized 和 ReentrantLock 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：synchronized 和 ReentrantLock。","category":"并发编程","difficulty":"中等","tags":["synchronized","ReentrantLock","AQS","Condition"],"answer":{"oral":"synchronized 是 JVM 关键字，自动释放锁，非公平，功能简单；ReentrantLock 是 JDK 类，基于 AQS，需要手动 unlock，最好放在 finally，但支持可中断、tryLock 超时、公平锁、多个 Condition 精确唤醒，还能查询锁状态。一般优先用 synchronized，代码简单不易漏解锁；需要超时、可中断、公平或多条件队列时才用 ReentrantLock。","keyPoints":["synchronized 是 JVM 内置锁，自动释放","ReentrantLock 基于 AQS，需要手动 unlock","ReentrantLock 支持可中断、超时、公平锁和多个 Condition","简单同步优先 synchronized，需要高级功能才用 Lock"],"followUp":["ReentrantLock 的公平和非公平怎么实现？","Condition 和 wait/notify 有什么区别？"],"pitfalls":["认为 synchronized 是可中断的。","忽略 ReentrantLock 必须手动 unlock。"]}},{"id":"f92","question":"什么是可重入锁，如何实现？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是可重入锁，如何实现。","category":"并发编程","difficulty":"中等","tags":["AQS","state"],"answer":{"oral":"可重入锁就是同一个线程已经拿到锁后，再次获取同一把锁不会被自己阻塞。实现关键是记录持有者线程和重入次数：synchronized 靠 ObjectMonitor 的 owner 和递归计数；ReentrantLock 靠 AQS 的 state，每次 lock 加一，unlock 减一，减到零才真正释放并唤醒等待线程。没有可重入机制，递归调用或嵌套同步就会自死锁。","keyPoints":["同一线程再次获取同一把锁直接成功","锁记录持有线程和重入次数","AQS 用 state 累加重入次数","重入计数让同一线程不会自己锁死"],"followUp":[],"pitfalls":[]}},{"id":"f93","question":"公平锁和非公平锁的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：公平锁和非公平锁的区别。","category":"并发编程","difficulty":"中等","tags":["FIFO","ReentrantLock"],"answer":{"oral":"公平锁按 FIFO 顺序排队，先来先得，不会插队，吞吐低但不会饿死；非公平锁允许新来的线程直接 CAS 抢锁，抢不到再排队，吞吐高但极端情况下可能饥饿。ReentrantLock 默认非公平，因为省去排队唤醒开销；需要严格顺序时才用公平模式。synchronized 只有非公平。大多数业务用非公平就够了，公平锁适合对顺序敏感的任务。","keyPoints":["公平锁按 FIFO 排队，不允许插队","非公平锁允许新线程直接 CAS 抢锁","非公平吞吐更高，但可能让排队线程饥饿","ReentrantLock 默认非公平"],"followUp":[],"pitfalls":[]}},{"id":"f94","question":"什么是 CAS？存在哪些问题？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是 CAS存在哪些问题。","category":"并发编程","difficulty":"中等","tags":["CAS","Unsafe","CPU","ABA","AtomicStampedReference"],"answer":{"oral":"CAS 是比较并交换，包含内存位置、预期值、新值三个参数，只有当前值等于预期值才更新，底层靠 CPU 的 cmpxchg 指令保证原子性。问题有三个：ABA，值改了又改回来，可以用 AtomicStampedReference 加版本号；自旋失败会一直占 CPU，高并发下开销大；只能保证一个变量的原子性，多个变量要用锁或 AtomicReference。JDK 9 之后还有 VarHandle 提供更灵活的内存语义。","keyPoints":["比较内存值与期望值，相等才更新","底层是 CPU 的 cmpxchg 指令","ABA 问题用版本号 AtomicStampedReference 解决","自旋消耗 CPU，且只能保证单个变量原子性"],"followUp":[],"pitfalls":[]}},{"id":"f95","question":"AQS 是什么？它是如何工作的？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：AQS 是什么它是如何工作的。","category":"并发编程","difficulty":"困难","tags":["AQS","volatile","state","CLH","Condition"],"answer":{"oral":"AQS 是 AbstractQueuedSynchronizer，JUC 里锁和同步器的基础框架。核心是一个 volatile 的 state 表示同步状态，一个 CLH 变体的双向等待队列，竞争失败的线程包装成 Node 入队并 park。子类通过实现 tryAcquire、tryRelease 等模板方法决定 state 的含义，独占和共享两种模式，Condition 对应单独的条件队列。ReentrantLock、Semaphore、CountDownLatch 都是基于它实现的。","keyPoints":["用 volatile int state 表示同步状态","CLH 变体的双向队列存放等待线程","独占和共享两种模式，子类实现 tryAcquire 等模板方法","Condition 用条件队列实现等待通知"],"followUp":["AQS 的同步队列和条件队列有什么区别？","独占模式和共享模式怎么用？"],"pitfalls":["把 AQS 说成一把具体的锁。","忽略 state 的语义由子类定义。"]}},{"id":"f96","question":"LongAdder 和 AtomicLong 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：LongAdder 和 AtomicLong 的区别。","category":"并发编程","difficulty":"困难","tags":["LongAdder","AtomicLong","CAS","Cell","sum"],"answer":{"oral":"AtomicLong 所有线程 CAS 同一个 value，高并发下自旋失败多，性能下降；LongAdder 把热点拆成 base 加多个 Cell，不同线程更新不同 Cell，最后 sum 汇总，冲突少、吞吐高。代价是 sum 不是强一致快照，只适合统计计数，不适合需要精确读取或强顺序的场景。低并发两者差不多，高并发写多读少时 LongAdder 优势明显。","keyPoints":["AtomicLong 所有线程 CAS 同一个值，竞争激烈","LongAdder 把值分散到多个 Cell，各自累加","高并发写入时吞吐明显更高","sum 需要汇总 Cell，是弱一致结果"],"followUp":[],"pitfalls":[]}},{"id":"f97","question":"CountDownLatch、CyclicBarrier、Semaphore 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：CountDownLatch、CyclicBarrier。","category":"并发编程","difficulty":"中等","tags":["CountDownLatch","CyclicBarrier","Semaphore"],"answer":{"oral":"CountDownLatch 是一次性倒计时，主线程 await 等一组任务完成，计数到零就释放，不能重置；CyclicBarrier 是可循环的屏障，一组线程互相等到齐再一起继续，可以重复使用；Semaphore 是许可证，控制同时访问的线程数，常用于限流。记法：Latch 一等多，Barrier 多等多，Semaphore 控数量。CyclicBarrier 还能在所有线程到达后执行一个 barrierAction。","keyPoints":["CountDownLatch 一次性，主线程等 N 个任务完成","CyclicBarrier 可循环，一组线程互相等待到齐","Semaphore 控制许可数量，用来限流","按一次性、阶段同步还是资源计数选择"],"followUp":[],"pitfalls":[]}},{"id":"f98","question":"ReentrantReadWriteLock 和 StampedLock 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":66,"frequencyReason":"「并发编程」了解题，偏细节或低频，时间有限时可后置。考点：ReentrantReadWriteLock 和 Sta。","category":"并发编程","difficulty":"中等","tags":["ReentrantReadWriteLock","StampedLock"],"answer":{"oral":"ReentrantReadWriteLock 读写分离，读读共享、读写互斥，支持锁降级，但写锁可能饥饿；StampedLock 提供乐观读，读的时候先拿一个 stamp，读完再 validate，没被写过就不用加锁，性能更好，但它不可重入，也不支持 Condition，使用不当容易死锁。读多写少且能接受不可重入时考虑 StampedLock；需要重入或条件队列还是用 ReentrantReadWriteLock。","keyPoints":["读写锁读共享写独占，适合读多写少","ReentrantReadWriteLock 支持锁降级，写锁可重入","StampedLock 提供乐观读，读不加锁只校验版本","StampedLock 不可重入，写饥饿要自己权衡"],"followUp":[],"pitfalls":[]}},{"id":"f99","question":"CompletableFuture 常用编排方式？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：CompletableFuture 常用编排方式。","category":"并发编程","difficulty":"中等","tags":["CompletableFuture","supplyAsync","thenApply","thenCompose","allOf","anyOf"],"answer":{"oral":"常用 supplyAsync 起异步任务，thenApply 做结果转换，thenCompose 做扁平化的串行依赖，thenCombine 合并两个结果，allOf 等全部完成，anyOf 等任意一个完成。默认用 ForkJoinPool.commonPool，IO 密集型建议传自定义线程池。异常用 exceptionally、handle、whenComplete 处理，超时可以用 orTimeout 或 completeOnTimeout。注意 thenApply 和 thenCompose 的区别是后者能扁平化嵌套的 Future。","keyPoints":["supplyAsync 有返回值，runAsync 无返回值","thenApply 转换结果，thenCompose 扁平化嵌套","allOf 等全部完成，anyOf 任一完成","默认用公共 ForkJoinPool，IO 任务应传自定义线程池"],"followUp":[],"pitfalls":[]}},{"id":"f100","question":"wait/notify 与 sleep/yield/join 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：wait/notify 与 sleep/yield/jo。","category":"并发编程","difficulty":"中等","tags":["wait","notify","sleep","yield","join","Object"],"answer":{"oral":"wait 是 Object 的方法，必须在 synchronized 块里调用，会释放锁并进入等待，靠 notify 或 notifyAll 唤醒；sleep 是 Thread 的静态方法，不释放锁，时间到自动醒；yield 是让出 CPU 回到就绪队列，不释放锁也不一定马上让别人跑；join 是等待另一个线程结束，底层用 wait 实现。wait 和 sleep 都会响应中断。wait 要用 while 循环判断条件，防止虚假唤醒。","keyPoints":["wait 释放锁并进入等待队列，sleep 不释放锁","wait/notify 是 Object 方法，sleep 是 Thread 静态方法","yield 让出 CPU 但仍处于 RUNNABLE","join 等待目标线程结束"],"followUp":[],"pitfalls":[]}},{"id":"f101","question":"如何正确中断一个线程？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：如何正确中断一个线程。","category":"并发编程","difficulty":"中等","tags":["interrupt","InterruptedException","volatile"],"answer":{"oral":"正确方式是调用 interrupt 设置中断标志，线程在阻塞方法里会抛 InterruptedException，捕获后要么恢复中断标志 Thread.currentThread().interrupt()，要么退出；循环任务要检查 isInterrupted。不要用 stop，它会直接杀线程、释放锁，导致数据不一致。对于不响应中断的代码，可以配合 volatile 停止标志，或者用可中断的 IO 和锁。","keyPoints":["interrupt 只是设置中断标志，不是强制杀线程","阻塞方法会抛 InterruptedException 并清除标志","捕获后要么继续抛出，要么恢复中断标志","非阻塞循环用 isInterrupted 判断退出"],"followUp":[],"pitfalls":[]}},{"id":"f102","question":"虚拟线程是什么？适合什么场景？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：虚拟线程是什么适合什么场景。","category":"并发编程","difficulty":"困难","tags":["pin"],"answer":{"oral":"虚拟线程是 Java 21 正式推出的轻量级线程，由 JVM 调度到少量载体线程上，是 M:N 模型。创建成本很低，可以开几十万甚至上百万个，适合 IO 密集、大量阻塞等待的场景。JDK 21 到 23 中，遇到 synchronized 阻塞或本地方法可能 pin 住载体线程；JDK 24 的 JEP 491 解决了 synchronized 导致的 pin，主要剩下本地方法和外部调用。CPU 密集不适合虚拟线程，也不要池化虚拟线程。","keyPoints":["JDK 21 正式支持，由 JVM 调度到载体线程","M:N 调度，阻塞时自动卸载，不占 OS 线程","适合 IO 密集和高并发连接","JDK 24 前 synchronized 内阻塞会 pin 住载体线程，之后主要剩本地方法"],"followUp":[],"pitfalls":[]}},{"id":"f103","question":"什么是 Java 内存模型（JMM）？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「并发编程」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是 Java 内存模型（JMM）。","category":"并发编程","difficulty":"中等","tags":["JMM","happens-before"],"answer":{"oral":"JMM 是 Java 内存模型，规定多线程下共享变量的可见性、有序性和原子性。每个线程有自己的工作内存，变量在主内存，线程之间通过主内存交互。JMM 用 happens-before 定义可见性，用内存屏障禁止重排。原子性靠 synchronized、Lock、原子类；可见性靠 volatile、锁；有序性靠 volatile 和 happens-before。它和 JVM 运行时内存区域不是一回事，前者是规范，后者是物理划分。","keyPoints":["定义主内存和线程工作内存的抽象模型","三大特性：原子性、可见性、有序性","happens-before 规定跨线程可见性","volatile 和锁通过内存屏障落实规则"],"followUp":["JMM 的原子性、可见性、有序性分别靠什么保证？","volatile 在 JMM 中解决什么问题？"],"pitfalls":["把 JMM 和 JVM 内存区域混为一谈。","忽略内存屏障和 happens-before。"]}},{"id":"f104","question":"happens-before 有哪些规则？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「并发编程」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：happens-before 有哪些规则。","category":"并发编程","difficulty":"困难","tags":["happens-before","volatile","join"],"answer":{"oral":"happens-before 常见规则有：程序次序，同一线程前面的操作先于后面的；监视器锁，unlock 先于后续 lock；volatile，写先于后续读；线程启动，start 先于线程内操作；线程终止，线程内操作先于 join 返回；中断，interrupt 先于被中断线程检测到；对象终结，构造完成先于 finalize；还有传递性，A 先于 B、B 先于 C，则 A 先于 C。它描述的是可见性和顺序保证，不代表时间上一定先发生。","keyPoints":["程序次序：同一线程前面的写对后面可见","监视器锁：unlock 先于后续 lock","volatile 写先于后续读","线程 start 先于 run，run 结束先于 join 返回；规则可传递"],"followUp":[],"pitfalls":[]}},{"id":"f105","question":"CHAR 和 VARCHAR 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：CHAR 和 VARCHAR 的区别。","category":"MySQL","difficulty":"简单","tags":["CHAR","VARCHAR"],"answer":{"oral":"CHAR 是定长，定义长度后不管实际存多少都按固定空间占用，适合长度固定或几乎固定的字段，比如性别、状态码、MD5；VARCHAR 是变长，按实际长度加长度前缀存储，适合长度不定的字符串。CHAR 读取不用算长度，略快，但空间浪费；VARCHAR 更省空间。尾部空格处理也不同：CHAR 在比较时按 PAD SPACE 语义可能忽略尾部空格，VARCHAR 会保留，业务上不要依赖尾部空格。字符集建议用 utf8mb4 才能存 emoji，还要结合行格式和索引长度一起看。","keyPoints":["CHAR 定长，不足补空格，读取时可能带尾部空格语义差异","VARCHAR 变长，存长度前缀加实际内容","定长短字符串用 CHAR，长度不定的内容用 VARCHAR","VARCHAR 过长会溢出到行外，影响读取性能"],"followUp":[],"pitfalls":[]}},{"id":"f106","question":"InnoDB 和 MyISAM 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「MySQL」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：InnoDB 和 MyISAM 有什么区别。","category":"MySQL","difficulty":"简单","tags":["InnoDB","MyISAM"],"answer":{"oral":"InnoDB 支持事务、行锁、外键、MVCC，索引是聚簇索引，崩溃恢复能力好，是 MySQL 默认引擎；MyISAM 不支持事务和外键，只有表锁，索引是非聚簇的，count 全表快、全文索引早，但并发写差，崩溃后恢复困难。现在基本都用 InnoDB，除非只读、历史归档这类特殊场景。MySQL 8 的系统表也已经全部换成 InnoDB，MyISAM 更多是兼容历史。","keyPoints":["InnoDB 支持事务、行锁、外键和崩溃恢复","MyISAM 只有表锁，不支持事务","InnoDB 是聚簇索引，MyISAM 索引和数据分离","现在默认且推荐 InnoDB"],"followUp":["InnoDB 为什么支持事务？","MyISAM 适合什么场景？"],"pitfalls":["说 MyISAM 支持行锁。","忽略 InnoDB 的聚簇索引结构。"]}},{"id":"f107","question":"MySQL 深度分页如何优化？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MySQL 深度分页如何优化。","category":"MySQL","difficulty":"中等","tags":["limit","offset"],"answer":{"oral":"深度分页慢是因为 limit offset 会先扫描并丢弃前 offset 条，offset 越大越慢。优化方式有：用延迟关联，先在索引上查出主键，再回表取数据，减少回表量；用游标分页，记住上一页最后一条的 id 或时间，按 where id > lastId limit n 查；或者从业务上限制最大页数、只允许翻前 N 页。ES 或搜索引擎做列表页也是常见方案。游标分页不能随机跳页，要和产品交互一起改。","keyPoints":["limit offset 会扫描并丢弃前 offset 行","延迟关联先用覆盖索引查主键，再回表","游标分页用上一页最后一条作为查询条件","业务上限制最大页数，或改用搜索"],"followUp":[],"pitfalls":[]}},{"id":"f108","question":"什么是回表？如何避免？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「MySQL」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是回表如何避免。","category":"MySQL","difficulty":"中等","tags":["SELECT"],"answer":{"oral":"回表是二级索引查到主键后，再回到聚簇索引取整行数据，多一次随机 IO。避免方式是使用覆盖索引，让查询需要的字段都在索引里，比如把 select 的列加入联合索引，或者只 select 索引里已有的列；另外减少 select 的字段、避免 select *，也能减少回表开销。explain 的 Extra 出现 Using index 就说明用了覆盖索引；如果出现 Using index condition，说明用了索引下推，但仍可能回表。","keyPoints":["二级索引只存索引列和主键","需要其他列时按主键回聚簇索引再查一次","覆盖索引让查询字段都在索引里，避免回表","减少 SELECT 字段、合理建联合索引"],"followUp":["什么是覆盖索引？","回表一定很慢吗？"],"pitfalls":["认为所有查询都会回表。","忽略 select * 会让覆盖索引失效。"]}},{"id":"f109","question":"自增主键用完了怎么办？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：自增主键用完了怎么办。","category":"MySQL","difficulty":"中等","tags":["BIGINT"],"answer":{"oral":"自增主键是 BIGINT UNSIGNED 时几乎用不完，上限约一千八百亿亿；如果真到上限，可以改成更大范围，比如从 INT 升到 BIGINT，或者用分段、雪花算法。直接重置自增会有主键冲突风险，必须确认旧数据已迁移，而且重置后可能和旧数据重复。高并发分布式场景更推荐雪花算法或号段模式，不依赖单库自增。改字段类型在大表上要走 Online DDL 或工具，避免长时间锁表。","keyPoints":["自增即使是 BIGINT 也有上限，接近上限要提前规划","可扩容字段类型，或改用雪花、号段","不要随意重置自增，可能造成主键冲突","分库分表后各表独立自增，需要全局方案"],"followUp":[],"pitfalls":[]}},{"id":"f110","question":"为什么不推荐使用外键？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：为什么不推荐使用外键。","category":"MySQL","difficulty":"简单","tags":[],"answer":{"oral":"外键会在每次写入时做一致性检查，增加开销；高并发下容易产生额外锁和死锁；分库分表后跨库外键根本没法维护；级联删除也容易误伤。所以互联网业务通常把外键约束上移到应用层，用事务和业务校验保证一致性，数据库只负责存储。外键也不是一无是处，单库、数据一致性要求高、并发不高的后台系统用它更省心，关键看架构和团队约定。","keyPoints":["每次写入都要检查引用，增加锁和开销","外键容易引发死锁和级联锁","分库分表后跨库外键无法维护","约束上移到应用层，用事务和校验保证"],"followUp":[],"pitfalls":[]}},{"id":"f111","question":"唯一索引和主键索引的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：唯一索引和主键索引的区别。","category":"MySQL","difficulty":"简单","tags":["NULL"],"answer":{"oral":"主键索引是聚簇索引，一个表只能有一个，值唯一且不允许 NULL，叶子节点存整行数据；唯一索引是二级索引，可以有多个，值唯一但允许一个或多个 NULL，叶子节点存主键值，查询后可能还要回表。主键更适合做聚簇索引，唯一索引用于业务唯一约束。InnoDB 要求表必须有主键，没有显式主键时会用唯一非空索引，再没有就生成隐藏的 row_id。","keyPoints":["主键唯一且非空，唯一索引允许一个 NULL","主键是聚簇索引，唯一索引通常是二级索引","一张表只有一个主键，唯一索引可以有多个","主键决定行的物理存储顺序"],"followUp":[],"pitfalls":[]}},{"id":"f112","question":"count(1)、count(*) 与 count(列名) 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：count(1)、count(*) 与 count(列名。","category":"MySQL","difficulty":"中等","tags":["count","NULL","InnoDB"],"answer":{"oral":"count(*) 和 count(1) 统计行数，不判断具体列，语义等价，InnoDB 做了优化，效率基本一样；count(列名) 只统计该列非 NULL 的行，如果列有 NULL 会少算。没有特殊需求用 count(*) 或 count(1)，不要用 count(列名) 来表达总行数。InnoDB 不保存精确行数，count 要扫描索引，大表会慢，可以维护计数表、走缓存或异步统计。","keyPoints":["count(*) 统计行数，包含 NULL 行","count(1) 语义相同，优化器处理一致","count(列) 不统计该列为 NULL 的行","InnoDB 要遍历索引计数，count(*) 会选最小的二级索引"],"followUp":[],"pitfalls":[]}},{"id":"f113","question":"InnoDB 中索引类型有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：InnoDB 中索引类型有哪些。","category":"MySQL","difficulty":"中等","tags":["InnoDB","B+","Hash"],"answer":{"oral":"InnoDB 有 B+ 树索引，包括聚簇索引和二级索引；还有自适应 Hash 索引，由 InnoDB 自动为热点页建立；支持全文索引，用于文本检索；空间索引用于地理数据；联合索引是把多个列放在一棵 B+ 树里；还有前缀索引，对长字符串只索引前几个字符。日常主要用 B+ 树和联合索引。Hash 索引在 InnoDB 里不是直接创建的，只有 Memory 引擎支持显式 Hash 索引。","keyPoints":["InnoDB 默认 B+ 树索引，分聚簇和二级","自适应 Hash 由存储引擎自动建立","全文索引用于大段文本的关键词检索","联合索引按最左前缀匹配才生效"],"followUp":[],"pitfalls":[]}},{"id":"f114","question":"truncate、delete、drop 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：truncate、delete、drop 的区别。","category":"MySQL","difficulty":"简单","tags":["truncate","delete","drop","DML","DDL"],"answer":{"oral":"delete 是 DML，按条件删数据，可以回滚，会触发触发器，自增不重置，执行慢；truncate 是 DDL，清空整表，不能回滚，不触发触发器，自增重置，执行快，需要 DROP 权限；drop 是 DDL，直接删表结构和数据，也不能回滚。三者都会隐式提交当前事务。生产上 drop 和 truncate 都要非常谨慎，先确认备份和依赖。","keyPoints":["delete 是 DML，可回滚，按条件删行","truncate 是 DDL，清空表且自增重置，不可回滚","drop 删除表结构和数据","truncate 和 drop 都快，但风险更高"],"followUp":[],"pitfalls":[]}},{"id":"f115","question":"慢查询如何排查与调优？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「MySQL」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：慢查询如何排查与调优。","category":"MySQL","difficulty":"中等","tags":["explain","type","rows","Extra","SQL"],"answer":{"oral":"先开慢查询日志，设置 long_query_time 和 log_queries_not_using_indexes，找出耗时 SQL；再用 explain 看 type、key、rows、Extra，判断有没有走索引、有没有回表、有没有 filesort 或 temporary；必要时用 optimizer trace 看优化器为什么选错索引。然后针对性优化，比如补索引、改 SQL、减少 select 字段、拆分大查询。如果单表太大或并发太高，再考虑分库分表、读写分离、加缓存。","keyPoints":["先开慢查询日志，找出耗时 SQL","explain 看 type、key、rows、Extra","针对性加索引、改写 SQL、减少回表","数据量太大再考虑分区、分库分表"],"followUp":["慢查询日志怎么开启和采集？","EXPLAIN 重点看哪些字段？"],"pitfalls":["只看 SQL 文本，不看执行计划和数据量。","忽略隐式类型转换导致索引失效。"]}},{"id":"f116","question":"脏读、不可重复读、幻读是什么？隔离级别如何对应？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「MySQL」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：脏读、不可重复读、幻读是什么隔离级别如何对应。","category":"MySQL","difficulty":"中等","tags":["RU","RC","RR","Serializable","MVCC"],"answer":{"oral":"脏读是读到了别的事务还没提交的数据；不可重复读是同一事务内两次读同一行结果不一样，因为别的事务提交了修改；幻读是同一查询条件两次查到的行数不一样，因为别的事务插入或删除了行。隔离级别 RU 允许脏读，RC 禁止脏读但允许不可重复读和幻读，RR 用 MVCC 和间隙锁基本解决，Serializable 全串行。MySQL 默认 RR，很多互联网业务会主动降到 RC 以减少间隙锁。","keyPoints":["脏读读到未提交数据，RC 可避免","不可重复读同一事务两次读到不同值，RR 用 MVCC 避免","幻读是第二次查询多出行，RR 用间隙锁或 Next-Key 解决","Serializable 全串行，一致性最强性能最差"],"followUp":["RC 和 RR 的区别是什么？","RR 下幻读怎么解决？"],"pitfalls":["认为 RR 完全不会出现幻读。","把隔离级别和 MVCC 混为一谈。"]}},{"id":"f117","question":"数据库死锁如何排查与解决？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：数据库死锁如何排查与解决。","category":"MySQL","difficulty":"中等","tags":["show","engine","innodb","status"],"answer":{"oral":"先看 show engine innodb status 里的 LATEST DETECTED DEADLOCK，确认是哪两个事务、持有什么锁、等待什么锁；线上可以开 innodb_print_all_deadlocks 把死锁打到错误日志。再看业务代码的加锁顺序。解决思路是统一加锁顺序、缩短事务、减少锁范围、避免在事务里做远程调用、给热点行加超时或重试。MySQL 本身也会自动检测死锁并回滚其中一个事务，业务要能捕获重试。","keyPoints":["show engine innodb status 看最近死锁现场","分析等待环，找出两条 SQL 的加锁顺序","统一加锁顺序、缩小事务、减少范围更新","设置 innodb_lock_wait_timeout 做兜底"],"followUp":[],"pitfalls":[]}},{"id":"f118","question":"用了索引还是很慢，可能是什么原因？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：用了索引还是很慢，可能是什么原因。","category":"MySQL","difficulty":"中等","tags":[],"answer":{"oral":"有索引还慢，常见原因有：条件列做了隐式类型转换，比如字符串没加引号；在索引列上用了函数或表达式；用了前导模糊 like %xx；联合索引不满足最左前缀；范围查询后的列失效；回表太多；统计信息过期导致走错索引；索引区分度太低；锁等待或热点行竞争；数据量太大、Buffer Pool 命中率低。要结合 explain、慢日志和实际执行情况看，不能只看有没有索引。","keyPoints":["隐式类型转换或函数运算让索引失效","前导模糊 like %x 用不上索引","回表太多或 SELECT 字段过大","统计信息过期、锁等待、数据量过大也会慢"],"followUp":[],"pitfalls":[]}},{"id":"f119","question":"redo log、undo log、binlog 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「MySQL」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：redo log、undo log、binlog 的区别。","category":"MySQL","difficulty":"困难","tags":["redo","log","undo","binlog","MVCC"],"answer":{"oral":"redo log 是物理日志，记录页的修改，保证崩溃恢复和持久性，InnoDB 写前会先写 redo，属于 WAL；undo log 是逻辑日志，记录反向操作，用于回滚和 MVCC 版本链；binlog 是 MySQL Server 层的逻辑日志，记录所有变更，用于归档和主从复制。redo 在存储引擎层循环写，binlog 追加写，写入时机和用途都不同。三者配合两阶段提交保证崩溃后数据一致。","keyPoints":["redo log 是物理日志，保证崩溃恢复和持久性","undo log 是逻辑日志，支持回滚和 MVCC","binlog 是 Server 层逻辑日志，用于归档和主从","三者写入时机和生命周期不同"],"followUp":["undo log 的作用是什么？","binlog 有哪几种格式？"],"pitfalls":["把 redo log 说成逻辑日志。","忽略 redo log 和 binlog 的两阶段提交。"]}},{"id":"f120","question":"设计索引应遵循哪些原则？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：设计索引应遵循哪些原则。","category":"MySQL","difficulty":"困难","tags":[],"answer":{"oral":"索引设计要看区分度，优先给高频查询、过滤性强的列建索引；联合索引把最常用的列放左边，遵循最左前缀；尽量用覆盖索引减少回表；控制索引数量，太多会影响写入和优化器选择；避免在索引列上做函数运算；长字符串可以用前缀索引；定期清理无用索引。还要考虑更新频率，写多读少的表不宜建太多索引，唯一索引和普通索引也要按业务约束来选。","keyPoints":["给高区分度、频繁出现在 where 和 order by 的列建索引","联合索引按最左前缀设计，等值条件放前面","尽量覆盖查询，减少回表","控制索引数量，避免影响写入"],"followUp":[],"pitfalls":[]}},{"id":"f121","question":"为什么不建议使用存储过程？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":65,"frequencyReason":"「MySQL」了解题，偏细节或低频，时间有限时可后置。考点：为什么不建议使用存储过程。","category":"MySQL","difficulty":"简单","tags":["DB"],"answer":{"oral":"存储过程调试困难，出错排查不方便；版本管理和代码 review 麻烦，逻辑散在数据库里；可移植性差，换数据库要重写；业务逻辑和存储耦合，扩容和分库分表困难；数据库 CPU 本来就紧张，复杂计算放 DB 会放大压力。所以互联网业务更倾向把逻辑放在应用层。存储过程也不是不能用，批量数据处理、强事务的后台任务、减少网络往返时它仍然有价值。","keyPoints":["存储过程调试和排错都很困难","版本管理和发布流程不灵活","可移植性差，绑定特定数据库","业务逻辑耦合在 DB，扩容和压力都受限"],"followUp":[],"pitfalls":[]}},{"id":"f122","question":"为什么不推荐多表 JOIN？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":66,"frequencyReason":"「MySQL」了解题，偏细节或低频，时间有限时可后置。考点：为什么不推荐多表 JOIN。","category":"MySQL","difficulty":"简单","tags":["JOIN"],"answer":{"oral":"多表 JOIN 在大表场景下可能产生大量中间结果，内存和网络开销大；分库分表后跨库 JOIN 很难做；JOIN 的执行计划受统计信息影响，容易抖动；锁的范围也可能变大。所以互联网架构常把 JOIN 拆成单表查询，在应用层用 Map 组装，或者冗余字段、宽表、ES 来支持复杂查询。小表关联、固定维度表 JOIN 其实没问题，不要一刀切。","keyPoints":["大表 JOIN 的内存和临时表开销大","分库分表后跨库 JOIN 做不了","网络传输和结果集容易膨胀","改为单表查询后在应用层组装"],"followUp":[],"pitfalls":[]}},{"id":"f123","question":"什么是数据库范式？为什么要反范式化？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":67,"frequencyReason":"「MySQL」了解题，偏细节或低频，时间有限时可后置。考点：什么是数据库范式为什么要反范式化。","category":"MySQL","difficulty":"中等","tags":["NF"],"answer":{"oral":"范式是减少数据冗余、保证一致性的规范，1NF 要求字段原子，2NF 消除部分依赖，3NF 消除传递依赖，BCNF 进一步约束决定因素。反范式化是适当冗余，用空间换时间，减少 JOIN 和查询复杂度。互联网读多写少、查询性能要求高，通常会做适度反范式，但冗余字段要明确更新责任，避免数据不一致。核心不是范式好不好，而是读写比例和一致性要求。","keyPoints":["1NF 字段原子，2NF 消除部分依赖，3NF 消除传递依赖","范式减少冗余，保证一致性","反范式适当冗余，用空间换查询性能","读多写少、报表场景常反范式"],"followUp":[],"pitfalls":[]}},{"id":"f124","question":"什么是最左前缀原则？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「MySQL」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是最左前缀原则。","category":"MySQL","difficulty":"中等","tags":["B+"],"answer":{"oral":"联合索引在 B+ 树里按第一列、第二列、第三列的顺序排序，查询必须从最左列开始用，才能连续匹配。比如索引 (a,b,c)，where a=1、a=1 and b=2 都能用；只写 b=2 用不了；a=1 and c=3 只能用到 a。范围查询后的列通常不能再用于精确匹配，但可以利用索引下推减少回表。设计联合索引时要把等值条件放前面、范围条件放后面。","keyPoints":["联合索引按最左列开始排序","查询缺少最左列时索引失效","范围查询会让其后的列无法用于精确匹配","设计时把等值过滤列放左边"],"followUp":["联合索引 (a,b,c) 哪些查询能命中？","索引下推解决什么问题？"],"pitfalls":["认为最左前缀只影响第一列。","忽略范围查询后面的列会失效。"]}},{"id":"f125","question":"乐观锁与悲观锁怎么实现？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：乐观锁与悲观锁怎么实现。","category":"MySQL","difficulty":"中等","tags":["CAS","select","update"],"answer":{"oral":"悲观锁是假设一定会冲突，先 select for update 锁住行，再修改，适合写多读少、冲突多的场景；乐观锁是假设冲突少，读的时候带版本号，更新时 where version = oldVersion，版本不匹配就失败重试，适合读多写少。乐观锁也可以用 CAS 或时间戳实现。注意乐观锁要控制重试次数，冲突高时重试会放大压力；悲观锁要防止死锁和长事务。","keyPoints":["乐观锁用版本号或 CAS，更新时校验","悲观锁用 select for update 或表锁","读多写少用乐观锁，冲突多用悲观锁","乐观锁失败要重试，注意控制重试次数"],"followUp":[],"pitfalls":[]}},{"id":"f126","question":"谈谈 InnoDB 的表级锁、行级锁、间隙锁与临键锁？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：谈谈 InnoDB 的表级锁、行级锁、间隙锁与临键锁。","category":"MySQL","difficulty":"困难","tags":["InnoDB","Next-Key","Lock"],"answer":{"oral":"InnoDB 有表锁、行锁、间隙锁和临键锁。表锁包括表级共享锁、排他锁和 MDL；行锁是锁索引记录，只有走索引才生效，否则可能退化成表锁；间隙锁锁住两个记录之间的空隙，防止插入；临键锁是行锁加间隙锁，锁住左开右闭区间，RR 级别下默认用它防幻读；插入意向锁用于标记要插入。RC 级别下间隙锁基本不用，除非外键和唯一性检查。","keyPoints":["表锁粒度粗，行锁依赖索引","更新条件没有索引会退化成表锁","间隙锁锁住索引区间之间的空隙","Next-Key 是记录锁加间隙锁，插入意向锁与间隙锁冲突"],"followUp":[],"pitfalls":[]}},{"id":"f127","question":"InnoDB 加索引会锁表吗？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：InnoDB 加索引会锁表吗。","category":"MySQL","difficulty":"困难","tags":["InnoDB","MDL","Online","DDL","DML"],"answer":{"oral":"MySQL 5.6 之后加普通索引支持 Online DDL，大多数情况不会长时间锁表，但会有短暂的元数据锁，开始和结束阶段可能阻塞 DML。加索引期间会占用 IO 和 CPU，大表建议在低峰期做，控制并发，必要时用 gh-ost 或 pt-online-schema-change 这类工具。MySQL 8.0.12 之后还支持 instant add column，但索引和主键变更仍要重建。","keyPoints":["加索引要拿 MDL 锁，长事务会阻塞或等待","MySQL 5.6 起支持 Online DDL，多数情况不锁表","仍可能短暂阻塞 DML 或产生元数据锁等待","大表建议用 gh-ost 或 pt-osc 降低风险"],"followUp":[],"pitfalls":[]}},{"id":"f128","question":"为什么 MySQL 用 B+ 树索引？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「MySQL」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：为什么 MySQL 用 B+ 树索引。","category":"MySQL","difficulty":"中等","tags":["B+","Hash"],"answer":{"oral":"B+ 树是为磁盘设计的。每个节点对应一个页，默认 16KB，非叶子节点只存键，不存数据，所以一个节点能放很多键，树更矮胖，三到四层就能存千万级数据，磁盘 IO 次数少；叶子节点用链表连接，范围查询和排序很方便；所有数据都在叶子节点，查询稳定。B 树节点也存数据，扇出小、树更高；Hash 不支持范围查询；二叉树更不用说了。","keyPoints":["页大小 16KB，B+ 树矮胖，磁盘 IO 次数少","非叶子节点只存键，能放更多索引项","叶子节点链表相连，范围查询高效","相比 B 树更适合磁盘，相比 Hash 支持范围和排序"],"followUp":["B+ 树和 B 树有什么区别？","为什么 MySQL 不用 Hash 索引？"],"pitfalls":["只说“数据都在叶子节点”，不说非叶子只存索引。","忽略 B+ 树对范围查询的优势。"]}},{"id":"f129","question":"什么是索引下推（ICP）？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是索引下推（ICP）。","category":"MySQL","difficulty":"困难","tags":["ICP","Using","index","condition"],"answer":{"oral":"索引下推是 MySQL 5.6 引入的优化，把 where 中能在索引上判断的条件下推到存储引擎层，在遍历索引时就过滤，而不是回表后再过滤。比如联合索引 (name, age)，where name like 张% and age=20，age 的判断可以在索引里完成，减少回表次数。explain 的 Extra 会显示 Using index condition。注意它只对二级索引有效，也不是所有条件都能下推。","keyPoints":["把 where 中的条件下推到存储引擎","在索引上先过滤，减少回表次数","explain 的 Extra 显示 Using index condition","对联合索引的范围条件后续列有效"],"followUp":[],"pitfalls":[]}},{"id":"f130","question":"MVCC 的实现原理？ReadView 如何判断可见性？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「MySQL」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：MVCC 的实现原理ReadView 如何判断可见性。","category":"MySQL","difficulty":"困难","tags":["MVCC","ReadView","undo","trx","id","RC"],"answer":{"oral":"MVCC 靠 undo 版本链和 ReadView 实现。每行有隐藏的 trx_id 和回滚指针，修改时旧版本挂到 undo 链上；ReadView 记录当前活跃事务 id 列表、最小活跃 id、下一个事务 id 和创建者事务 id。判断可见性时，从版本链最新版本往前找，遇到自己事务的版本可见，遇到未提交或活跃事务的版本跳过，直到找到可见版本。RC 每次快照读都新建 ReadView，RR 只在第一次快照读时创建，所以 RR 能保证可重复读。","keyPoints":["每行有隐藏 trx_id，undo log 串成版本链","ReadView 记录活跃事务 id 列表和上限","RC 每次查询生成新 ReadView，RR 在事务开始时生成","快照读走 MVCC，当前读加锁读最新"],"followUp":["ReadView 的四个字段分别是什么？","RC 和 RR 下 ReadView 的生成时机有什么不同？"],"pitfalls":["把 max_trx_id 当成活跃事务的最大 ID。","认为 RR 在 begin 时就生成 ReadView。"]}},{"id":"f131","question":"redo log 两阶段提交是什么？崩溃后如何恢复？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：redo log 两阶段提交是什么崩溃后如何恢复。","category":"MySQL","difficulty":"困难","tags":["redo","log","prepare","commit","binlog"],"answer":{"oral":"redo log 两阶段提交是为了让 redo 和 binlog 一致。更新时先写 redo 并标记 prepare，再写 binlog，最后把 redo 标记 commit。崩溃恢复时，如果 redo 是 prepare 且 binlog 完整，就提交；如果 binlog 不完整，就回滚。这样保证主库和从库、存储引擎和 Server 层的数据一致。组提交还能把多个事务的刷盘合并，提高性能；sync_binlog 和 innodb_flush_log_at_trx_commit 决定刷盘时机。","keyPoints":["redo 先 prepare，写 binlog，再 commit","崩溃恢复时对比 redo 和 binlog，决定提交或回滚","保证主库数据和 binlog 一致","组提交把多个事务合并刷盘"],"followUp":[],"pitfalls":[]}},{"id":"f132","question":"Buffer Pool 是什么？LRU 如何改进？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Buffer Pool 是什么LRU 如何改进。","category":"MySQL","difficulty":"困难","tags":["Buffer","Pool","LRU","young","old","Change"],"answer":{"oral":"Buffer Pool 是 InnoDB 在内存里缓存数据页的区域，读写都先经过它，减少磁盘 IO。它用改进的 LRU 管理，把链表分成 young 和 old 区，新读入的页先放 old 区，避免一次性全表扫描把热点页挤掉；还有预读、Change Buffer 缓存非唯一二级索引的修改、双写缓冲防止页损坏。脏页会由后台线程刷回磁盘，刷脏太慢会触发用户线程同步刷脏，造成抖动。","keyPoints":["内存中缓存数据页，减少磁盘 IO","LRU 分 young 和 old 区，防止全表扫描冲掉热数据","脏页后台刷盘，Change Buffer 缓存非唯一索引写","双写缓冲防止页断裂导致数据损坏"],"followUp":[],"pitfalls":[]}},{"id":"f133","question":"一条 SQL 的执行流程是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：一条 SQL 的执行流程是怎样的。","category":"MySQL","difficulty":"困难","tags":["SQL","update","redo","undo","binlog"],"answer":{"oral":"一条 SQL 先经过连接器做认证和权限，再到解析器做词法语法分析，生成语法树；优化器选索引、生成执行计划；执行器按计划调用存储引擎接口，存储引擎从 Buffer Pool 或磁盘取数据返回。update 还会写 undo、redo，并在合适时机写 binlog，最后两阶段提交。执行器是逐行调用引擎的，所以 explain 的 rows 只是估算，真实扫描行数可能差很多。","keyPoints":["连接器负责认证、权限和连接管理","解析器生成语法树，优化器选索引和执行计划","执行器调用存储引擎接口取数据","update 还要写 undo、redo 和 binlog"],"followUp":[],"pitfalls":[]}},{"id":"f134","question":"事务的 ACID 是如何实现的？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「MySQL」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：事务的 ACID 是如何实现的。","category":"MySQL","difficulty":"中等","tags":["ACID","redo","undo","MVCC"],"answer":{"oral":"ACID 靠不同机制保证：原子性靠 undo log，失败时回滚；持久性靠 redo log，事务提交后即使宕机也能恢复；隔离性靠 MVCC 和锁，控制并发读写；一致性是目标，靠约束、事务和业务逻辑共同保证。四个特性不是孤立的，最终都是为了数据一致。注意数据库只能保证单库事务的一致性，跨库、跨服务要靠分布式事务或最终一致方案。","keyPoints":["原子性靠 undo log 回滚","持久性靠 redo log 刷盘","隔离性靠 MVCC 和锁","一致性由约束和事务逻辑保证"],"followUp":["原子性主要靠什么实现？","隔离性主要靠什么实现？"],"pitfalls":["把 ACID 四项都归因于 MVCC。","忽略持久性主要靠 redo log。"]}},{"id":"f135","question":"MySQL 主从复制原理是什么？延迟怎么办？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「MySQL」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MySQL 主从复制原理是什么延迟怎么办。","category":"MySQL","difficulty":"中等","tags":["binlog","relay","log"],"answer":{"oral":"主从复制是主库把 binlog 发给从库，从库写入 relay log，再由 SQL 线程重放。主库有一个 dump 线程，从库有 IO 线程和 SQL 线程，靠 binlog 位点和 GTID 对齐。延迟常见原因是从库 SQL 线程单线程重放、大事务、从库压力大、网络延迟。优化可以用并行复制、拆分大事务、加从库、读写分离；半同步复制提升的是可靠性，可能增加主库写入延迟，不是降低从库延迟的手段。对一致性要求高的读走主库。","keyPoints":["主库写 binlog，从库 IO 线程拉取写 relay log","SQL 线程重放 relay log","延迟常见于大事务、从库压力、单线程重放","并行复制、拆分大事务、读写分离缓解；半同步提升可靠性但不降延迟"],"followUp":[],"pitfalls":[]}},{"id":"f136","question":"Redis 有哪些数据类型？分别适合什么场景？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Redis 有哪些数据类型分别适合什么场景。","category":"Redis","difficulty":"简单","tags":["String","List","Hash","Set","ZSet"],"answer":{"oral":"String 适合缓存对象 JSON、计数器、分布式锁；List 适合简单队列、最新动态，但可靠消息更推荐 Stream；Hash 适合存对象字段，比如用户属性，能单独改某个字段；Set 适合去重、交集并集、点赞用户；ZSet 适合排行榜、延迟队列，按分数排序。扩展类型里 Bitmap 适合签到、布隆过滤器，HyperLogLog 适合 UV 估算，GEO 适合附近的人，Stream 适合消息队列。选型先看数据结构和访问模式，不要拿 List 当可靠队列。","keyPoints":["String 做缓存、计数、分布式锁","Hash 存对象字段，List 做队列","Set 做去重和交并集，ZSet 做排行榜","Bitmap、HyperLogLog、GEO、Stream 做位图、基数、地理位置和消息流"],"followUp":["String 类型通常用来做什么？","ZSet 的典型使用场景是什么？"],"pitfalls":["只背五种类型，不说具体场景。","忽略 Bitmap、HyperLogLog 等扩展类型。"]}},{"id":"f137","question":"Redis 五种基本类型的底层编码？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Redis 五种基本类型的底层编码。","category":"Redis","difficulty":"困难","tags":["SDS","listpack","quicklist","intset","hashtable"],"answer":{"oral":"String 用 SDS，简单动态字符串，有长度、预分配和二进制安全；List 在 Redis 7 之前是 quicklist 套 ziplist，7.0 之后 quicklist 的节点改成 listpack；Hash 元素少时用 listpack，多了转 hashtable；Set 元素都是整数且少时用 intset，小集合在 7.2 也可以用 listpack，否则用 hashtable；ZSet 少时用 listpack，多了转 skiplist 加 dict。转换阈值由 list-max-listpack-size、hash-max-listpack-entries、zset-max-listpack-entries 等配置控制。","keyPoints":["String 用 SDS，List 用 quicklist，Hash 和 Set 小数据用 listpack 或 intset","ZSet 小数据用 listpack，大数据用 skiplist 加 dict","编码随元素数量和大小自动转换","转换阈值可在配置中调整"],"followUp":[],"pitfalls":[]}},{"id":"f138","question":"Redis 和 Memcached 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Redis 和 Memcached 有什么区别。","category":"Redis","difficulty":"简单","tags":["Memcached"],"answer":{"oral":"Redis 数据结构丰富，支持持久化、主从、哨兵、Cluster、Lua、事务、Stream，功能更像数据库加缓存；Memcached 只支持简单的 key-value，纯内存、多线程，单实例吞吐高但不持久化、没有集群分片和复杂结构。需要丰富结构、持久化、高可用选 Redis；只做简单大缓存、想利用多核可以考虑 Memcached，但现在 Redis 更主流。Memcached 的价值主要在极简和纯内存场景。","keyPoints":["Redis 数据结构丰富，Memcached 只有 KV","Redis 支持持久化和主从集群","Redis 命令执行单线程，Memcached 多线程","缓存简单 KV 可用 Memcached，复杂场景用 Redis"],"followUp":[],"pitfalls":[]}},{"id":"f139","question":"Redis 和 Caffeine 有什么区别？多级缓存怎么做？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Redis 和 Caffeine 有什么区别多级缓存怎么。","category":"Redis","difficulty":"中等","tags":["Caffeine","Caffeine+Redis"],"answer":{"oral":"Redis 是分布式缓存，多个应用实例共享，容量大但有网络开销；Caffeine 是本地缓存，在 JVM 堆内，纳秒级访问，但各节点数据不一致、容量受堆限制。多级缓存一般是本地 Caffeine 加 Redis 加数据库：热点数据放本地，减少 Redis 访问；本地缓存设置较短过期时间，配合 Redis 的发布订阅或 MQ 通知做失效，接受短暂不一致。热点 key 可以再加本地缓存和限流，避免打穿 Redis。","keyPoints":["Redis 是分布式缓存，Caffeine 是本地缓存","Caffeine 在进程内，速度更快，适合热点数据","多级缓存先查本地再查 Redis，注意一致性","本地缓存要处理失效通知和容量控制"],"followUp":[],"pitfalls":[]}},{"id":"f140","question":"Redis 是单线程还是多线程？为什么快？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Redis 是单线程还是多线程为什么快。","category":"Redis","difficulty":"中等","tags":["IO","epoll"],"answer":{"oral":"Redis 命令执行是单线程的，所以不用考虑锁竞争，单条命令天然原子；但 6.0 之后网络 IO 是多线程的，读请求解析和写响应可以并行，命令执行仍然单线程。快的原因主要是纯内存操作、epoll 多路复用、高效的数据结构、单线程避免上下文切换和锁开销。后台还有 BIO 线程处理 AOF 刷盘、异步删除和关闭文件。所谓单线程是指命令执行模型，不是整个进程只有一个线程。","keyPoints":["命令执行是单线程，避免锁和上下文切换","Redis 6.0 用多线程处理网络 IO","持久化、删除大 key 等由后台线程做","纯内存加 epoll 是快的主要原因"],"followUp":["Redis 6.0 的多线程主要用在哪？","单线程模型为什么还能这么快？"],"pitfalls":["认为 Redis 所有操作都是单线程。","忽略 IO 多线程和后台线程。"]}},{"id":"f141","question":"Redis Key 和 Value 的设计原则？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Redis Key 和 Value 的设计原则。","category":"Redis","difficulty":"中等","tags":["Value","Big"],"answer":{"oral":"Key 要有业务前缀和命名规范，比如 业务:对象:id，长度要控制，别太长；Value 要控制大小，避免 Big Key，大对象要拆分；根据访问模式选合适的数据结构，比如用 Hash 存对象字段；所有缓存都要设过期时间，避免永久堆积；热点 key 要打散，冷热分离。集群模式下还要考虑 hash tag，让需要一起操作的 key 落在同一个槽。命名和 TTL 最好统一收口，避免各业务乱写。","keyPoints":["key 用业务前缀加冒号分层，控制长度","避免 Big Key，按字段或分片拆分","按访问模式选数据结构，别用 String 存整个对象","合理设置过期时间，避免内存无限增长"],"followUp":[],"pitfalls":[]}},{"id":"f142","question":"Redis 的持久化机制有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Redis 的持久化机制有哪些。","category":"Redis","difficulty":"中等","tags":["RDB","AOF","fsync"],"answer":{"oral":"有两种：RDB 是快照，把某一时刻的数据压缩写盘，恢复快但可能丢最后一次快照后的数据；AOF 是追加写命令，实时性好，可以配置 always、everysec、no 三种刷盘策略，但文件大、恢复慢。生产常用混合持久化，AOF 重写时把当前数据写成 RDB 格式再追加增量，兼顾恢复速度和数据安全。恢复时优先用 AOF；AOF 重写由子进程做，fork 时要注意内存和延迟。","keyPoints":["RDB 是快照，恢复快但可能丢最后一次快照后的数据","AOF 记录写命令，可配置 always、everysec、no","混合持久化先用 RDB 再追加 AOF","AOF 重写压缩文件体积"],"followUp":["RDB 和 AOF 怎么选？","什么是混合持久化？"],"pitfalls":["认为 AOF 一定不丢数据。","忽略 appendfsync 策略的差异。"]}},{"id":"f143","question":"Redis 分布式锁如何实现？有哪些坑？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Redis 分布式锁如何实现有哪些坑。","category":"Redis","difficulty":"困难","tags":["SET","value","NX","EX","Lua"],"answer":{"oral":"基本写法是 SET key value NX EX，value 要放唯一标识，避免误删别人的锁；解锁要用 Lua 脚本先比较 value 再删除，保证原子；锁要设超时，防止宕机死锁，业务没执行完可以用 Redisson 的看门狗续期；主从架构下主库宕机可能丢锁，可以用 RedLock 或多副本方案，但 RedLock 也有争议，强一致场景更适合 ZooKeeper 或数据库。实际业务优先用 Redisson，并给锁设置合理的过期和重试。","keyPoints":["SET key value NX EX 原子加锁","value 用唯一标识，Lua 校验后删除","超时要小于业务耗时，或用看门狗续期","主从切换可能丢锁，强一致场景用 RedLock 或 ZK"],"followUp":["RedLock 有什么争议？","锁续期怎么做？"],"pitfalls":["认为 SETNX 就足够安全。","忽略锁误删和过期时间设置。"]}},{"id":"f144","question":"如何保证缓存与数据库的一致性？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：如何保证缓存与数据库的一致性。","category":"Redis","difficulty":"困难","tags":["Cache","Aside","Canal"],"answer":{"oral":"常用 Cache Aside：读先读缓存，没有就读库再回填；写先更新数据库，再删除缓存。为什么是删而不是更新，因为并发下更新缓存容易覆盖；删除后可以延迟双删，减少旧数据回填窗口；更强一致可以用 Canal 订阅 binlog 异步删缓存，或者用分布式锁串行化。多数场景接受最终一致。要注意缓存删除失败、并发读写和主从延迟，必要时加消息补偿和对账。","keyPoints":["Cache Aside：读走缓存，写先更新库再删缓存","删缓存比更新缓存更不容易产生脏数据","延迟双删降低并发读写的不一致窗口","用 Canal 订阅 binlog 异步删缓存，接受最终一致"],"followUp":["先删缓存还是先更新数据库？","延迟双删解决什么问题？"],"pitfalls":["认为缓存和数据库能做到强一致。","忽略并发读写时序。"]}},{"id":"f145","question":"Redis 的 Pub/Sub 和 Stream 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Redis 的 Pub/Sub 和 Stream 有什么。","category":"Redis","difficulty":"中等","tags":["Pub","Sub","Stream","ACK"],"answer":{"oral":"Pub/Sub 是发布订阅，消息不持久化，没有 ACK，消费者不在线就丢了，适合实时通知；Stream 是 Redis 5.0 的消息队列，支持持久化、消费者组、ACK、待处理列表和消息回溯，适合可靠消息场景。需要可靠投递用 Stream，简单广播用 Pub/Sub。Stream 也不是无限可靠，要配合 MAXLEN 或 XTRIM 控制长度，并处理 pending 消息认领。","keyPoints":["Pub/Sub 不持久化，消息发完即丢","Pub/Sub 无 ACK、无消费者组，不能可靠消费","Stream 持久化，支持消费者组和 ACK","需要可靠消息用 Stream，实时广播用 Pub/Sub"],"followUp":[],"pitfalls":[]}},{"id":"f146","question":"Redis 如何实现延迟消息？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Redis 如何实现延迟消息。","category":"Redis","difficulty":"中等","tags":["ZSet","Stream","Redisson"],"answer":{"oral":"常用 ZSet 做延迟队列：把消息 id 和到期时间戳作为 score，后台线程轮询 zrangebyscore 取到期的任务。也可以用 Stream 加消费者组，或者 Redisson 的 RDelayedQueue。Key 过期事件也能触发延迟逻辑，但它不可靠，Redis 重启、过期删除延迟或配置不对都会丢事件，不建议作为唯一方案。生产上更稳的是 ZSet 加定时扫描，失败重试和补偿都要做。","keyPoints":["ZSet 存消息和时间戳，定时轮询到期任务","Stream 配合消费组做延迟队列","Redisson 的延迟队列封装了 ZSet 方案","Key 过期事件不可靠，只适合非核心场景"],"followUp":[],"pitfalls":[]}},{"id":"f147","question":"Redis 的过期删除策略？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Redis 的过期删除策略。","category":"Redis","difficulty":"中等","tags":["CPU"],"answer":{"oral":"Redis 用惰性删除加定期删除。惰性删除是访问 key 时才检查是否过期，过期就删；定期删除是每隔一段时间随机抽查一部分过期 key 删除，防止长期占内存。这样兼顾 CPU 和内存，但可能残留大量过期 key，需要配合内存淘汰策略。从库不会主动删过期 key，等主库删除后同步；读从库时如果 key 已过期但还没同步删除，可能读到旧值，业务要能接受。","keyPoints":["惰性删除：访问时发现过期才删","定期删除：周期性随机抽查并删除","两者结合在 CPU 和内存之间折中","从库不会主动删除，靠主库同步"],"followUp":["惰性删除和定期删除怎么配合？","主从架构下过期 key 怎么处理？"],"pitfalls":["认为从库会主动删除过期 key。","把过期删除和内存淘汰混为一谈。"]}},{"id":"f148","question":"Redis 的内存淘汰策略有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Redis 的内存淘汰策略有哪些。","category":"Redis","difficulty":"中等","tags":["LRU","LFU","noeviction"],"answer":{"oral":"有八种：noeviction 不淘汰，直接报错；volatile-lru、volatile-lfu、volatile-random、volatile-ttl 只淘汰设置了过期时间的 key；allkeys-lru、allkeys-lfu、allkeys-random 淘汰所有 key。缓存场景常用 allkeys-lru 或 allkeys-lfu；如果部分 key 必须保留，用 volatile 系列并给它们设过期时间。选错策略会导致该留的被淘汰或该淘汰的留不下来，上线前最好压测验证。","keyPoints":["8 种策略，分 LRU、LFU、随机和 TTL 维度","noeviction 内存满时写操作直接报错","allkeys 和 volatile 决定淘汰范围","缓存场景常用 allkeys-lru 或 allkeys-lfu"],"followUp":["LRU 和 LFU 有什么区别？","淘汰策略怎么选？"],"pitfalls":["认为 Redis 只支持 LRU。","忽略 maxmemory 配置。"]}},{"id":"f149","question":"Redis 事务、Lua 脚本与为什么不支持回滚？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Redis 事务、Lua 脚本与为什么不支持回滚。","category":"Redis","difficulty":"困难","tags":["Lua","MULTI","EXEC","WATCH"],"answer":{"oral":"Redis 事务用 MULTI 开启、命令入队、EXEC 执行，WATCH 可以做乐观锁。它不保证回滚，因为 Redis 设计上追求简单和高性能：运行时错误比如对字符串执行列表命令，只会让那条命令失败，其他命令继续执行；语法错误会在入队时报错，整个事务不执行。需要原子性和复杂逻辑用 Lua 脚本，Lua 在执行期间不会被其他命令打断，但脚本要短，避免阻塞。","keyPoints":["MULTI 把命令入队，EXEC 一次性执行","运行时错误不会回滚已执行的命令","WATCH 做乐观锁，值变了就放弃事务","需要原子性用 Lua，脚本整体执行不被打断"],"followUp":[],"pitfalls":[]}},{"id":"f150","question":"Redis 为什么要自定义 SDS？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":66,"frequencyReason":"「Redis」了解题，偏细节或低频，时间有限时可后置。考点：Redis 为什么要自定义 SDS。","category":"Redis","difficulty":"困难","tags":["SDS"],"answer":{"oral":"Redis 自己实现 SDS，而不是直接用 C 字符串。C 字符串取长度要遍历，O(n)；SDS 直接存长度，O(1)；SDS 有预分配和惰性释放，减少频繁扩容；SDS 用长度判断结尾，支持二进制安全，能存包含 \\0 的数据；还兼容 C 字符串，可以直接传给 C 函数。SDS 有多个头部类型，按字符串长度选择，节省内存，这也是 Redis 内存优化的一部分。","keyPoints":["SDS 记录 len 和 alloc，取长度 O(1)","预分配和惰性释放减少扩容次数","二进制安全，可存任意字节","保留 C 字符串兼容能力"],"followUp":[],"pitfalls":[]}},{"id":"f151","question":"如何安全遍历所有 Key？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：如何安全遍历所有 Key。","category":"Redis","difficulty":"困难","tags":["KEYS","SCAN"],"answer":{"oral":"不要用 KEYS *，它会阻塞 Redis 主线程，key 多时直接卡死。用 SCAN 游标渐进式遍历，每次返回一批和下一个游标，直到游标为 0。SCAN 不保证完整快照，遍历期间可能重复或漏掉少量 key，业务要能接受；可以配合 MATCH 和 COUNT 控制批量大小。集群模式要用 SCAN 的集群版或逐节点扫描，别指望一次扫完整个集群。","keyPoints":["KEYS 会遍历全库并阻塞主线程","SCAN 用游标分批返回，不阻塞","遍历期间可能重复或遗漏 key","集群要对每个节点分别 SCAN"],"followUp":[],"pitfalls":[]}},{"id":"f152","question":"缓存穿透、击穿、雪崩如何解决？布隆过滤器原理？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：缓存穿透、击穿、雪崩如何解决布隆过滤器原理。","category":"Redis","difficulty":"中等","tags":[],"answer":{"oral":"缓存穿透是查不存在的数据，缓存和数据库都没有，请求全打到库，解决办法是缓存空值加短过期，或者用布隆过滤器提前拦截；布隆过滤器用多个 hash 把 key 映射到 bitmap，判断不存在一定不存在，判断存在有误判。缓存击穿是热点 key 失效瞬间大量请求打库，用互斥锁重建或逻辑过期。缓存雪崩是大量 key 同时失效或 Redis 宕机，给过期时间加随机值、做高可用、限流降级。","keyPoints":["穿透：查不存在的数据，用空值缓存或布隆过滤器","击穿：热点 key 失效，用互斥锁或逻辑过期","雪崩：大量 key 同时失效，给过期时间加随机值","布隆过滤器有误判，只能判断一定不存在"],"followUp":["布隆过滤器的原理是什么？","缓存击穿和缓存雪崩有什么区别？"],"pitfalls":["把穿透、击穿、雪崩混为一谈。","认为布隆过滤器支持删除元素。"]}},{"id":"f153","question":"大 Key 问题如何发现与解决？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：大 Key 问题如何发现与解决。","category":"Redis","difficulty":"中等","tags":["bigkeys","UNLINK"],"answer":{"oral":"大 Key 是一个 key 的 value 太大，比如几 MB 的 String、几十万元素的 List 或 Hash。发现可以用 redis-cli --bigkeys、MEMORY USAGE 或离线分析 RDB。解决是拆分，比如大 Hash 按字段拆成多个 key，大 List 分片；删除用 UNLINK 异步删，避免阻塞；集群场景还可以把大 key 打散到不同槽。设计阶段就要限制 value 大小，别把大对象整个塞进一个 key。","keyPoints":["redis-cli --bigkeys 或分析 RDB 找大 key","按字段拆成多个 key 或分片","用 UNLINK 异步删除，避免阻塞","从设计上控制 value 大小"],"followUp":[],"pitfalls":[]}},{"id":"f154","question":"热 Key 问题如何发现与解决？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：热 Key 问题如何发现与解决。","category":"Redis","difficulty":"中等","tags":["hotkeys"],"answer":{"oral":"热 Key 是某个 key 访问量特别高，可能打满单核或单节点。发现可以用 redis-cli --hotkeys、监控、或者客户端采样统计。解决是本地缓存、key 打散加随机后缀、读写分离、多副本、限流降级。热点数据提前预热，避免失效瞬间击穿。打散会增加一致性难度，要权衡；强一致的热点更适合读写分离加多级缓存。","keyPoints":["redis-cli --hotkeys 或监控命令找热点","本地缓存能挡住大部分热点读","给 key 加随机后缀打散到多个分片","读写分离、限流降级保护后端"],"followUp":[],"pitfalls":[]}},{"id":"f155","question":"ZSet 的底层实现？为什么用跳表？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：ZSet 的底层实现为什么用跳表。","category":"Redis","difficulty":"困难","tags":["ZSet","listpack","ziplist","skiplist+dict"],"answer":{"oral":"ZSet 元素少时用 listpack，元素多或成员大时用 skiplist 加 dict。dict 负责 O(1) 按成员查分数，skiplist 负责按分数范围查询和排序，插入删除平均 O(log n)。用跳表而不是红黑树，是因为跳表实现简单、范围查询方便、并发环境下更容易做无锁或局部锁，Redis 单线程下也够快。跳表通过多层索引实现近似二分，层数是随机的。","keyPoints":["元素少时用 listpack，按 score 有序","元素多时用 skiplist 加 dict，dict 保证 O(1) 查 score","跳表范围查询高效，实现比红黑树简单","插入删除平均 O(log n)"],"followUp":[],"pitfalls":[]}},{"id":"f156","question":"Redis 集群模式有哪些？如何选主？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Redis 集群模式有哪些如何选主。","category":"Redis","difficulty":"中等","tags":["Cluster","Gossip"],"answer":{"oral":"有三种：主从复制做数据冗余和读写分离；哨兵在主从基础上做监控、自动故障转移和选主，客户端通过哨兵拿主库地址；Cluster 是分片集群，把 key 按 16384 个槽分到多个主节点，每个主节点带从节点，支持水平扩展。哨兵选主是多个 Sentinel 基于客观下线、优先级和 offset 等做多数派投票，不是 Raft；Cluster 靠 Gossip 和集群总线协调。选型看数据量、写入量和可用性要求。","keyPoints":["主从复制解决读扩展和备份","哨兵监控、主观/客观下线、选举新主","Cluster 按槽分片，支持水平扩容","Gossip 传播节点状态"],"followUp":["哨兵模式和 Cluster 模式有什么区别？","Cluster 为什么是 16384 个槽？"],"pitfalls":["说哨兵选主用 Raft。","忽略 Cluster 至少需要 3 主 3 从。"]}},{"id":"f157","question":"什么是 Redis 脑裂？如何避免？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是 Redis 脑裂如何避免。","category":"Redis","difficulty":"困难","tags":["min-replicas-to-write","min-replicas-max-lag"],"answer":{"oral":"脑裂是网络分区导致出现两个主节点，客户端可能同时往两边写，恢复后数据冲突或丢失。Redis 可以用 min-replicas-to-write 和 min-replicas-max-lag 限制：主库必须至少有 N 个从库连接且延迟不超过阈值才允许写，否则拒绝写请求。这样能降低脑裂丢数据风险，但会牺牲一部分可用性。集群和哨兵还要配合合理的超时和选举参数，避免误判。","keyPoints":["网络分区导致多个主节点同时接收写","分区恢复后旧主数据可能被覆盖","设置 min-replicas-to-write 和 max-lag 限制写入","熔断参数要配合超时和监控告警"],"followUp":[],"pitfalls":[]}},{"id":"f158","question":"Redis Cluster 的数据分片机制？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Redis Cluster 的数据分片机制。","category":"Redis","difficulty":"困难","tags":["Cluster","CRC16","MOVED","ASK"],"answer":{"oral":"Redis Cluster 把整个 key 空间分成 16384 个槽，每个主节点负责一部分槽。key 用 CRC16 算 hash，再对 16384 取模定位槽。客户端请求如果不在当前节点，节点返回 MOVED 告诉真实节点；正在迁移时返回 ASK，客户端先发 ASKING 再访问目标节点。扩容时迁移槽和 key，支持在线扩缩容。多 key 操作要用 hash tag 保证落在同一个槽，否则会报 CROSSSLOT。","keyPoints":["16384 个槽，CRC16 取模分配","客户端按槽路由到对应节点","MOVED 表示槽已迁移，ASK 表示迁移中临时访问","扩缩容以槽为单位迁移数据"],"followUp":[],"pitfalls":[]}},{"id":"f159","question":"Redis 主从复制的原理？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Redis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Redis 主从复制的原理。","category":"Redis","difficulty":"中等","tags":["RDB","psync","repl","backlog","offset"],"answer":{"oral":"主从复制分全量和增量。第一次同步或断线太久，主库生成 RDB 发给从库，从库加载后再重放期间的命令；之后主库把写命令追加到 repl_backlog，从库用 psync 带 offset 做增量同步。offset 对不上就重新全量。无盘复制是主库不落 RDB 文件，直接通过网络把数据发给从库，适合磁盘慢但网络好的场景。复制积压缓冲区大小决定断线后能否增量同步。","keyPoints":["首次同步全量传 RDB","之后增量同步按 offset 拉取 backlog","run_id 和 offset 决定是否可增量","无盘复制直接用 socket 传 RDB"],"followUp":["主从复制的全量同步和增量同步分别是什么？","主从延迟怎么优化？"],"pitfalls":["认为主从复制是强一致。","忽略 repl-backlog 和 offset 的作用。"]}},{"id":"f160","question":"Pipeline 有什么用？和事务有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Pipeline 有什么用和事务有什么区别。","category":"Redis","difficulty":"中等","tags":["Pipeline","RTT"],"answer":{"oral":"Pipeline 是把多条命令一次性发给 Redis，减少网络往返 RTT，提升吞吐；它不保证原子性，命令之间可能穿插其他客户端请求，某条失败也不影响其他条。事务用 MULTI/EXEC，命令按顺序执行且不被其他客户端打断，但也不支持回滚。需要原子性用 Lua，批量提速用 Pipeline。三者解决的是不同问题，别把 Pipeline 当事务用。","keyPoints":["Pipeline 把多条命令一次发送，减少 RTT","Pipeline 不保证原子性，中间可能插别的命令","事务保证连续执行，但不支持回滚","批量导入用 Pipeline，原子操作用 Lua"],"followUp":[],"pitfalls":[]}},{"id":"f161","question":"Redis 的典型应用场景？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Redis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Redis 的典型应用场景。","category":"Redis","difficulty":"中等","tags":["ZSet","INCR","ID","Lua","Session"],"answer":{"oral":"典型场景有缓存、排行榜用 ZSet、计数器用 INCR、分布式锁用 SET NX、分布式 ID 用 INCR、限流用 Lua 加令牌桶、Session 共享、消息队列用 Stream、签到用 Bitmap、UV 估算用 HyperLogLog、附近的人用 GEO、购物车用 Hash。回答时按数据结构对应场景说，再补一句选型依据，比如为什么用 ZSet 而不是 List，为什么用 HLL 而不是 Set。","keyPoints":["排行榜用 ZSet，计数用 INCR","分布式 ID 用 INCR，限流用 Lua","Session 集中存储，消息用 Stream","按数据结构和原子性需求选"],"followUp":[],"pitfalls":[]}},{"id":"f162","question":"Redis 内存碎片如何优化？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":66,"frequencyReason":"「Redis」了解题，偏细节或低频，时间有限时可后置。考点：Redis 内存碎片如何优化。","category":"Redis","difficulty":"困难","tags":["jemalloc","activedefrag"],"answer":{"oral":"内存碎片是分配器按固定大小分配，实际使用和分配块之间有浪费，或者频繁增删导致空洞。用 INFO memory 看 mem_fragmentation_ratio，超过 1.5 可以考虑处理。开启 activedefrag 让 Redis 自动整理碎片，或者重启、主从切换、迁移数据来重建内存。jemalloc 本身也会影响碎片率。碎片率高不等于内存泄漏，要结合 used_memory 和 RSS 一起看。","keyPoints":["jemalloc 按大小分桶，产生内部和外部碎片","碎片率超过阈值可开启 activedefrag","重启或主从切换能彻底整理","控制不同大小 key 的数量"],"followUp":[],"pitfalls":[]}},{"id":"f163","question":"Spring Boot 和 Spring 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Spring Boot 和 Spring 有什么区别。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","Boot","Starter","XML"],"answer":{"oral":"Spring 是一个基础框架，提供 IOC、AOP、事务、MVC 等能力，但需要自己配置依赖、容器和大量 XML；Spring Boot 是在 Spring 之上做自动配置和 Starter 封装，内嵌 Tomcat，可以打成可执行 jar 独立运行，基本去掉了 XML。简单说 Spring Boot 不是替代 Spring，而是让 Spring 更快用起来。自动配置并不是魔法，底层还是 Spring 的容器和条件装配。","keyPoints":["自动配置按依赖和条件装配 Bean","Starter 聚合依赖，减少版本冲突","内嵌 Tomcat 等容器，打成 jar 直接运行","基本去掉 XML，改用注解和属性文件"],"followUp":["Spring Boot 的 starter 机制是什么？","自动配置和 Spring 原生注解是什么关系？"],"pitfalls":["认为 Spring Boot 替代了 Spring。","忽略自动配置的条件判断。"]}},{"id":"f164","question":"Spring 中创建 Bean 有几种方式？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Spring 中创建 Bean 有几种方式。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","Bean","Component","Import","FactoryBean","XML"],"answer":{"oral":"常见方式有：组件扫描加 @Component、@Service、@Repository、@Controller；用 @Bean 在配置类里声明；用 @Configuration 加 @Import 导入配置类；用 FactoryBean 创建复杂对象；还可以用 XML 配置。日常业务 Bean 用注解扫描，第三方组件或需要复杂初始化的用 @Bean。@Bean 方法默认是单例，方法名就是 Bean 名，也可以指定 name 和 initMethod。","keyPoints":["组件扫描 @Component、@Service 等","@Bean 在配置类中显式声明","@Import 导入配置类或普通类","FactoryBean 创建复杂对象，老项目也用 XML"],"followUp":["Bean 的实例化和初始化有什么区别？","构造器注入和字段注入怎么选？"],"pitfalls":["认为 Bean 创建就是简单 new。","忽略 BeanPostProcessor 的执行时机。"]}},{"id":"f165","question":"Spring 单例 Bean 是线程安全的吗？Controller 如何保证并发安全？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Spring 单例 Bean 是线程安全的吗Contro。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","Bean","Controller","ThreadLocal","prototype"],"answer":{"oral":"Spring 的单例 Bean 本身不保证线程安全，它只是只创建一个实例。如果 Bean 有可变的成员变量，多线程访问就会有问题；如果无状态，只有方法局部变量，就是线程安全的。Controller 默认也是单例，所以不要把请求参数存到成员变量里，可以用方法参数、ThreadLocal 或 prototype 作用域，必要时加锁。Service 里注入的 Mapper、RedisTemplate 本身通常是线程安全的，但自己维护的缓存要注意并发。","keyPoints":["单例 Bean 本身不保证线程安全","无状态 Bean 天然安全","有成员变量要用 ThreadLocal、锁或改成 prototype","Controller 不要把请求级数据存进成员变量"],"followUp":[],"pitfalls":[]}},{"id":"f166","question":"Spring Bean 有哪些作用域？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Spring Bean 有哪些作用域。","category":"Spring & MyBatis","difficulty":"简单","tags":["Spring","Bean","singleton","prototype","request","session"],"answer":{"oral":"Spring Bean 有 singleton 单例、prototype 多例、request 请求级、session 会话级、application 应用级、websocket 会话级。singleton 是默认，容器里只创建一个；prototype 每次获取都新建；request、session 这些主要在 Web 环境用。业务默认单例，有状态且需要隔离时才用 prototype。prototype 注入到单例 Bean 里只会创建一次，想每次都新实例要用 ObjectProvider 或 ApplicationContext 获取。","keyPoints":["singleton 容器内唯一，是默认作用域","prototype 每次获取都新建","request、session、application 依赖 Web 环境","websocket 有独立生命周期"],"followUp":[],"pitfalls":[]}},{"id":"f167","question":"@Autowired 和 @Resource 有什么区别？为什么推荐构造器注入？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：@Autowired 和 @Resource 有什么区别。","category":"Spring & MyBatis","difficulty":"中等","tags":["Autowired","Resource"],"answer":{"oral":"@Autowired 是 Spring 的注解，默认按类型注入，可以配合 @Qualifier 按名称；@Resource 是 JSR-250 标准注解，默认按字段名匹配，找不到再按类型。推荐构造器注入，因为依赖不可变、启动时就暴露缺失依赖、方便单元测试，也不容易掩盖循环依赖。Spring 4.3 之后，类只有一个构造器时可以省略 @Autowired。字段注入虽然简洁，但不推荐在核心业务里大量使用。","keyPoints":["@Autowired 是 Spring 注解，默认按类型注入","@Resource 是 JSR-250，默认按名称再按类型","构造器注入保证依赖不可变、便于测试","构造器注入还能尽早暴露循环依赖"],"followUp":[],"pitfalls":[]}},{"id":"f168","question":"Spring Bean 的生命周期是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Spring Bean 的生命周期是怎样的。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","Bean","Aware","BeanPostProcessor","PostConstruct","InitializingBean"],"answer":{"oral":"Bean 生命周期大致是：实例化、属性赋值、Aware 回调、BeanPostProcessor 前置处理、@PostConstruct、InitializingBean 的 afterPropertiesSet、init-method、BeanPostProcessor 后置处理，使用完在容器关闭时执行 @PreDestroy、DisposableBean 的 destroy、destroy-method。AOP 代理通常在后置处理阶段生成。注意 BeanPostProcessor 对所有 Bean 生效，顺序可以通过 Ordered 或 @Order 控制。","keyPoints":["实例化后做属性赋值和依赖注入","Aware 回调，BeanPostProcessor 前置处理","@PostConstruct、InitializingBean、init-method 依次执行","销毁前走 @PreDestroy、DisposableBean、destroy-method"],"followUp":["Bean 生命周期有哪些阶段？","AOP 代理在哪个阶段生成？"],"pitfalls":["把初始化方法和 BeanPostProcessor 的顺序说反。","忽略 Aware 回调。"]}},{"id":"f169","question":"Spring AOP 的原理？JDK 代理与 CGLIB 如何选择？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Spring AOP 的原理JDK 代理与 CGLIB 。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","AOP","CGLIB","final","Bean"],"answer":{"oral":"Spring AOP 基于动态代理，在目标方法前后织入通知。切面定义切点和通知，容器启动时为符合切点的 Bean 创建代理。目标类有接口且 proxyTargetClass=false 时用 JDK 动态代理，基于 Proxy 和 InvocationHandler；没有接口或强制 proxyTargetClass=true 时用 CGLIB 生成子类。Spring Boot 2.x 起默认 proxyTargetClass=true，也就是默认 CGLIB。CGLIB 不能代理 final 类和 final 方法，JDK 代理只能代理接口方法。","keyPoints":["切面定义通知，切点匹配方法","有接口可用 JDK 动态代理，无接口用 CGLIB","CGLIB 生成子类，final 类无法代理","Spring Boot 2.x 起默认 CGLIB，可用 proxyTargetClass 切回 JDK 代理"],"followUp":["JDK 代理和 CGLIB 怎么选？","AOP 为什么同类调用会失效？"],"pitfalls":["认为 Spring AOP 一定用 CGLIB。","忽略代理对象内部自调用。"]}},{"id":"f170","question":"谈谈 Spring 的 IOC？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：谈谈 Spring 的 IOC。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","IOC","DI","BeanFactory","ApplicationContext"],"answer":{"oral":"IOC 是控制反转，把对象的创建和依赖管理交给容器，而不是在代码里 new。DI 是依赖注入，容器在创建 Bean 时把依赖传进去，方式有构造器、setter、字段注入。底层靠反射创建对象、解析依赖、完成装配。好处是解耦、可测试、可替换实现。BeanFactory 是基础容器，ApplicationContext 在其上增加了事件、国际化、资源加载、环境等能力，日常用的都是 ApplicationContext。","keyPoints":["对象创建和依赖装配交给容器","DI 通过构造器、setter 或字段注入","BeanFactory 懒加载，ApplicationContext 功能更全","底层靠反射和 BeanDefinition 装配"],"followUp":["IOC 容器如何管理 Bean？","IOC 和 DI 有什么区别？"],"pitfalls":["把 IOC 等同于依赖注入。","忽略 BeanFactory 和 ApplicationContext 的区别。"]}},{"id":"f171","question":"Spring AOP 在什么场景下会失效？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Spring AOP 在什么场景下会失效。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","AOP","public","final"],"answer":{"oral":"AOP 失效常见于：同类内部方法自调用，绕过了代理对象；方法不是 public；目标对象不是 Spring 容器管理的 Bean；异常被自己 catch 掉，外层通知捕获不到；final 类或 final 方法无法被 CGLIB 代理；切点表达式写错；异步线程里调用丢失上下文。排查时先确认调用是否经过代理，再看方法修饰符和切点。自调用可以拆到另一个 Bean，或者用 AopContext.currentProxy 取代理。","keyPoints":["同类内部自调用不经过代理","非 public 方法默认不被代理","对象不是容器管理的 Bean","异常被吞或 final 类也会导致切面不生效"],"followUp":["AOP 失效的常见原因有哪些？","怎么判断代理是否生效？"],"pitfalls":["只列原因，不说自调用、private、final 等关键点。","忽略事务代理和 AOP 代理叠加。"]}},{"id":"f172","question":"Spring 中用到了哪些设计模式？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Spring 中用到了哪些设计模式。","category":"Spring & MyBatis","difficulty":"简单","tags":["Spring"],"answer":{"oral":"Spring 里常见的设计模式有：单例，Bean 默认单例；工厂，BeanFactory、FactoryBean；代理，AOP；模板方法，JdbcTemplate、RestTemplate；观察者，ApplicationEvent；策略，Resource、HandlerMapping 的不同实现；适配器，HandlerAdapter；还有责任链，拦截器和过滤器。回答时结合具体类说明，别只背模式名字，要讲清楚 Spring 在哪个扩展点用了它。","keyPoints":["单例：Bean 默认单例","工厂：BeanFactory、FactoryBean","代理：AOP 给目标对象织入增强逻辑","模板方法：JdbcTemplate；观察者：事件机制；策略：资源加载"],"followUp":[],"pitfalls":[]}},{"id":"f173","question":"BeanFactory 和 FactoryBean 的关系？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：BeanFactory 和 FactoryBean 的关。","category":"Spring & MyBatis","difficulty":"困难","tags":["BeanFactory","FactoryBean","Bean"],"answer":{"oral":"BeanFactory 是 Spring 容器的顶层接口，负责创建和管理 Bean；FactoryBean 是一种特殊的 Bean，它本身由容器管理，但 getObject 返回的对象才是业务要用的对象。获取 FactoryBean 本身要加 & 前缀。MyBatis 的 SqlSessionFactoryBean、Spring 的 ProxyFactoryBean 都是典型 FactoryBean。它适合创建那些初始化过程复杂、需要手工装配的对象。","keyPoints":["BeanFactory 是 IoC 容器顶层接口，负责获取 Bean","FactoryBean 是一种特殊 Bean，用来创建复杂对象","getBean(\"&name\") 取 FactoryBean 本身","getBean(\"name\") 取它生产的对象"],"followUp":[],"pitfalls":[]}},{"id":"f174","question":"Spring 三级缓存如何解决循环依赖？哪些情况解决不了？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Spring 三级缓存如何解决循环依赖哪些情况解决不了。","category":"Spring & MyBatis","difficulty":"困难","tags":["Spring","singletonObjects","earlySingletonObjects","singletonFactories","AOP","prototype"],"answer":{"oral":"三级缓存是 singletonObjects 一级缓存、earlySingletonObjects 二级缓存、singletonFactories 三级缓存。创建 A 时发现依赖 B，先创建 B，B 又依赖 A，此时 A 的早期引用已经放进三级缓存，B 可以拿到 A 的代理或原始引用完成注入，之后 A 继续初始化。第三级缓存主要是为了 AOP 代理，保证注入的是代理对象。构造器循环依赖、prototype 循环依赖解决不了；Spring Boot 2.6 之后默认禁止循环依赖，需要显式开启。","keyPoints":["一级缓存 singletonObjects 存成品 Bean","二级 earlySingletonObjects 存提前暴露的引用","三级 singletonFactories 存对象工厂，可在此织入 AOP","构造器注入和 prototype 无法解决循环依赖"],"followUp":["三级缓存分别存什么？","构造器循环依赖为什么解决不了？"],"pitfalls":["认为三级缓存能解决所有循环依赖。","忽略 prototype 场景。"]}},{"id":"f175","question":"Spring 事务传播机制有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Spring 事务传播机制有哪些。","category":"Spring & MyBatis","difficulty":"困难","tags":["Spring","REQUIRED","REQUIRES","NESTED","SUPPORTS","NOT"],"answer":{"oral":"七种传播行为：REQUIRED 默认，有事务就加入，没有就新建；REQUIRES_NEW 新建独立事务，挂起原事务；NESTED 嵌套事务，靠 savepoint，外层回滚会带上内层；SUPPORTS 有事务就加入，没有就非事务执行；NOT_SUPPORTED 非事务执行并挂起原事务；MANDATORY 必须在事务中，否则报错；NEVER 必须不在事务中，否则报错。NESTED 只对 DataSourceTransactionManager 这类支持保存点的有效。","keyPoints":["REQUIRED 默认，有事务就加入，没有就新建","REQUIRES_NEW 挂起当前事务，独立新建","NESTED 用保存点实现嵌套","SUPPORTS、NOT_SUPPORTED、MANDATORY、NEVER 按是否强制事务区分"],"followUp":["七种传播行为分别是什么？","REQUIRES_NEW 和 NESTED 有什么区别？"],"pitfalls":["把 NESTED 当成完全独立的事务。","忽略外层回滚会影响内层。"]}},{"id":"f176","question":"Spring 事务失效可能是哪些原因？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Spring 事务失效可能是哪些原因。","category":"Spring & MyBatis","difficulty":"困难","tags":["Spring","public","catch","RuntimeException"],"answer":{"oral":"事务失效常见原因：方法不是 public；同类自调用绕过代理；异常被 catch 没抛出；抛的是 Checked 异常而默认只回滚 RuntimeException 和 Error；数据库引擎不支持事务，比如 MyISAM；类没有被 Spring 管理；切点或事务管理器配置不对；多线程里事务上下文不传递；传播行为设置不当。可以配 rollbackFor 指定异常，自调用拆到另一个 Bean，异步任务单独开事务。","keyPoints":["方法非 public，代理拦截不到","同类自调用不经过代理，事务会失效","异常被 catch，或抛的是检查异常","引擎不支持事务、Bean 未被容器管理也会失效"],"followUp":["事务失效的常见原因有哪些？","抛出 Checked 异常怎么回滚？"],"pitfalls":["认为所有异常都会回滚。","忽略 self-invocation 和代理问题。"]}},{"id":"f177","question":"Spring 事务的实现原理？隔离级别怎么配？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Spring 事务的实现原理隔离级别怎么配。","category":"Spring & MyBatis","difficulty":"困难","tags":["Spring","AOP","TransactionInterceptor","PlatformTransactionManager","ThreadLocal","Transactional"],"answer":{"oral":"Spring 事务基于 AOP，TransactionInterceptor 拦截 @Transactional 方法，通过 PlatformTransactionManager 开启、提交或回滚事务。事务资源和线程绑定，通常用 ThreadLocal 持有 Connection。隔离级别在 @Transactional 的 isolation 属性配置，默认跟随数据库；只读事务可以设 readOnly 优化；还能配 timeout、rollbackFor、propagation。注意事务方法里不要做远程调用和长耗时操作，避免占着连接。","keyPoints":["AOP 环绕，TransactionInterceptor 拦截","事务管理器负责开启、提交、回滚","连接通过 ThreadLocal 绑定当前线程","隔离级别、超时、只读等属性在注解上配置"],"followUp":[],"pitfalls":[]}},{"id":"f178","question":"如何在 Spring 启动过程中做缓存预热？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":66,"frequencyReason":"「Spring & MyBatis」了解题，偏细节或低频，时间有限时可后置。考点：如何在 Spring 启动过程中做缓存预热。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","ApplicationRunner","CommandLineRunner","PostConstruct","InitializingBean","ContextRefreshedEvent"],"answer":{"oral":"可以在启动完成后做缓存预热：实现 ApplicationRunner 或 CommandLineRunner，在容器启动后执行；用 @PostConstruct 或 InitializingBean，在 Bean 初始化阶段执行；监听 ContextRefreshedEvent；或者用 SmartLifecycle。注意预热不要阻塞主流程，数据量大时异步分批加载，并做好失败兜底。多实例部署时还要防止重复预热，可以加分布式锁或只让一个实例执行。","keyPoints":["ApplicationRunner、CommandLineRunner 在启动后执行","@PostConstruct 在 Bean 初始化后执行","ContextRefreshedEvent 监听容器刷新完成","按依赖顺序选择，避免拿不到完整环境"],"followUp":[],"pitfalls":[]}},{"id":"f179","question":"什么是 Spring MVC 三层架构？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":67,"frequencyReason":"「Spring & MyBatis」了解题，偏细节或低频，时间有限时可后置。考点：什么是 Spring MVC 三层架构。","category":"Spring & MyBatis","difficulty":"简单","tags":["Spring","MVC","Controller","Service","Dao"],"answer":{"oral":"三层架构是 Controller、Service、Dao。Controller 负责接收请求、参数校验、返回结果；Service 负责业务逻辑、事务和编排；Dao 或 Mapper 负责数据访问。分层是为了职责单一、解耦和可测试，不要把业务逻辑写进 Controller，也不要把 SQL 散在 Service 里。复杂业务可以再加 Manager 或 Domain 层，但不要为了分层而分层。","keyPoints":["Controller 接参、校验、组装响应","Service 承载业务逻辑和事务","Dao 负责数据访问和 SQL 封装","分层让职责清晰、便于测试和替换"],"followUp":[],"pitfalls":[]}},{"id":"f180","question":"Spring MVC 处理请求的流程是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Spring MVC 处理请求的流程是怎样的。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","MVC","DispatcherServlet","HandlerMapping","HandlerAdapter","ViewResolver"],"answer":{"oral":"请求先到 DispatcherServlet，它查 HandlerMapping 找到对应的 Handler 和拦截器，再通过 HandlerAdapter 调用 Controller；期间由 HandlerMethodArgumentResolver 做参数绑定、数据转换、校验；Controller 返回 ModelAndView 或响应体；如果有视图，ViewResolver 解析视图并渲染，前后端分离则由 HttpMessageConverter 写 JSON；最后拦截器执行 afterCompletion。异常会走 HandlerExceptionResolver。","keyPoints":["请求先到 DispatcherServlet","HandlerMapping 找处理器，HandlerAdapter 调用","参数解析器绑定入参，返回值处理器写响应","视图名交给 ViewResolver，前后端分离直接写响应"],"followUp":[],"pitfalls":[]}},{"id":"f181","question":"拦截器和 Filter 有什么区别？执行顺序如何？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：拦截器和 Filter 有什么区别执行顺序如何。","category":"Spring & MyBatis","difficulty":"中等","tags":["Filter","Servlet","Spring","preHandle","postHandle","afterCompletion"],"answer":{"oral":"Filter 是 Servlet 规范，属于容器层面，能拿到原始请求和响应，执行顺序在拦截器之前；Interceptor 是 Spring MVC 的，能拿到 Handler，分 preHandle、postHandle、afterCompletion，可以访问 Spring 上下文。Filter 适合编码、跨域、日志等通用处理；Interceptor 适合登录校验、权限、业务日志。多个 Filter 按注册顺序执行，多个 Interceptor 按配置顺序执行。","keyPoints":["Filter 属于 Servlet 规范，拦截所有请求","Interceptor 属于 Spring MVC，只拦进入 DispatcherServlet 的请求","执行顺序：Filter 前置、preHandle、业务、postHandle、afterCompletion、Filter 后置","Interceptor 能拿到 Handler 和 ModelAndView"],"followUp":[],"pitfalls":[]}},{"id":"f182","question":"Spring Boot 如何做全局异常处理和参数校验？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Spring Boot 如何做全局异常处理和参数校验。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","Boot","ControllerAdvice","ExceptionHandler","Validation","ProblemDetail"],"answer":{"oral":"全局异常处理用 @RestControllerAdvice 加 @ExceptionHandler，按异常类型返回统一结构；参数校验用 @Valid 或 @Validated 配合 JSR-303 注解，比如 @NotNull、@Size，校验失败会抛 MethodArgumentNotValidException，可以在全局异常处理器里统一转成业务错误。Spring 6 之后也可以返回 ProblemDetail。注意区分参数错误、业务异常和系统异常，日志级别和错误码要统一。","keyPoints":["@ControllerAdvice 加 @ExceptionHandler 统一处理异常","@Valid、@Validated 做参数校验","统一返回结构，屏蔽堆栈细节","Spring 6 可用 ProblemDetail 返回标准错误"],"followUp":[],"pitfalls":[]}},{"id":"f183","question":"Spring Boot 的启动流程是怎样的？内嵌容器如何启动？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Spring Boot 的启动流程是怎样的内嵌容器如何启。","category":"Spring & MyBatis","difficulty":"困难","tags":["Spring","Boot","SpringApplication","Environment","refresh","onRefresh"],"answer":{"oral":"Spring Boot 启动从 SpringApplication.run 开始：准备 Environment，加载配置和监听器；创建 ApplicationContext；执行 refresh，包括 BeanFactory 后置处理、注册 BeanPostProcessor、初始化消息源、创建 WebServer；onRefresh 阶段由 ServletWebServerFactory 创建内嵌 Tomcat，finishRefresh 阶段再由 WebServerStartStopLifecycle 启动；最后调用 Runner。内嵌容器就是把 Tomcat 作为普通 Bean 管理。","keyPoints":["SpringApplication 准备 Environment","创建 ApplicationContext 并 refresh","onRefresh 创建内嵌 Web 容器，finishRefresh 阶段启动","完成 Bean 实例化后执行 Runner"],"followUp":[],"pitfalls":[]}},{"id":"f184","question":"Spring Boot 自动配置是如何实现的？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Spring Boot 自动配置是如何实现的。","category":"Spring & MyBatis","difficulty":"困难","tags":["Spring","Boot","SpringBootApplication","EnableAutoConfiguration","AutoConfigurationImportSelector","imports"],"answer":{"oral":"启动类上的 @SpringBootApplication 包含 @SpringBootConfiguration、@ComponentScan、@EnableAutoConfiguration。@EnableAutoConfiguration 通过 AutoConfigurationImportSelector 读取 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 文件，拿到候选自动配置类，再根据 @Conditional 系列注解按条件过滤，最后注册成 Bean。旧版本用 spring.factories，新版本推荐 imports 文件。","keyPoints":["@SpringBootApplication 组合了 @EnableAutoConfiguration","AutoConfigurationImportSelector 读取 imports 文件","按 @Conditional 条件过滤生效的配置类","条件包括类存在、Bean 缺失、配置开关等"],"followUp":["自动配置类的加载流程是什么？","怎么排除某个自动配置？"],"pitfalls":["把 spring.factories 的写法套到 Spring Boot 3。","忽略 @ConditionalOnMissingBean 的覆盖逻辑。"]}},{"id":"f185","question":"如何自定义一个 Starter？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：如何自定义一个 Starter。","category":"Spring & MyBatis","difficulty":"中等","tags":["Starter","imports","spring.factories"],"answer":{"oral":"自定义 Starter 一般分两个模块：autoconfigure 放自动配置类和条件注解，starter 只负责依赖聚合。自动配置类用 @AutoConfiguration 和 @ConditionalOnClass、@ConditionalOnMissingBean 等控制生效；把类名写到 imports 文件或旧版的 spring.factories；再通过 @ConfigurationProperties 暴露配置。使用方引入 starter 就能自动装配。条件注解要设计好，避免和用户自定义 Bean 冲突。","keyPoints":["提供自动配置类和默认配置","用条件注解按环境决定是否生效","注册到 AutoConfiguration.imports","依赖管理交给 starter 统一引入"],"followUp":[],"pitfalls":[]}},{"id":"f186","question":"Spring Boot 配置文件加载优先级？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Spring Boot 配置文件加载优先级。","category":"Spring & MyBatis","difficulty":"困难","tags":["Spring","Boot","application.properties","yml","profile","PropertySource"],"answer":{"oral":"优先级大致是：命令行参数最高，其次是 Java 系统属性、操作系统环境变量、外部配置文件、jar 包外的 application.properties 或 yml、jar 包内的配置，最后是 @PropertySource 和默认属性。profile 配置通过 spring.profiles.active 激活，后加载的会覆盖先加载的同名配置。Spring Boot 2.4 之后配置加载机制改了，用 ConfigData 导入，但外部优先、profile 覆盖的大原则不变。","keyPoints":["命令行参数优先级最高，可覆盖配置文件","其次外部配置文件、profile 配置","再是 jar 内 application.yml","@PropertySource 补充，后加载覆盖先加载"],"followUp":[],"pitfalls":[]}},{"id":"f187","question":"@Async 的原理与失效场景？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：@Async 的原理与失效场景。","category":"Spring & MyBatis","difficulty":"困难","tags":["Async"],"answer":{"oral":"@Async 基于 Spring AOP，调用代理对象时把方法提交到 TaskExecutor 线程池异步执行。失效场景有：同类自调用绕过代理；方法不是 public；没有开启 @EnableAsync；容器里没有配置线程池；返回值不是 void、Future 或 CompletableFuture。Spring Boot 2.1 之后会自动配置 ThreadPoolTaskExecutor，但默认队列较大，生产上要自定义核心数、队列和拒绝策略，并配置 AsyncUncaughtExceptionHandler。","keyPoints":["基于 AOP 代理，把方法提交到线程池","@Async 同类自调用不生效","方法必须是 public，且由容器管理","返回 void 或 Future，异常要自定义处理"],"followUp":[],"pitfalls":[]}},{"id":"f188","question":"Spring 事件机制是什么？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Spring 事件机制是什么。","category":"Spring & MyBatis","difficulty":"中等","tags":["Spring","ApplicationEventPublisher","EventListener"],"answer":{"oral":"Spring 事件机制基于观察者模式，用 ApplicationEventPublisher 发布事件，@EventListener 或 ApplicationListener 监听。默认是同步调用，加 @Async 可以异步；事件可以解耦业务，比如下单后发优惠券、发短信。注意异步事件要处理异常和事务一致性，避免事件丢了；可以用 @TransactionalEventListener 在事务提交后触发，失败时配合重试或本地消息表。","keyPoints":["ApplicationEventPublisher 发布事件","@EventListener 监听，可配 @Async 异步","事件解耦业务，适合通知和审计","默认同步执行，注意异常影响主流程"],"followUp":[],"pitfalls":[]}},{"id":"f189","question":"MyBatis 和 Hibernate 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MyBatis 和 Hibernate 有什么区别。","category":"Spring & MyBatis","difficulty":"简单","tags":["MyBatis","Hibernate","SQL"],"answer":{"oral":"MyBatis 是半自动 ORM，SQL 由开发者写，灵活、可控、方便优化，但数据库移植性差；Hibernate 是全自动 ORM，自动生成 SQL，移植性好、开发快，但复杂查询和性能调优麻烦。互联网业务 SQL 复杂、性能要求高，通常选 MyBatis；业务简单、追求跨库可以选 Hibernate 或 JPA。MyBatis-Plus 在 MyBatis 上补了 CRUD 和分页，国内用得很广。","keyPoints":["MyBatis 半自动，SQL 自己写，可控性强","Hibernate 全自动，用对象映射和 HQL","MyBatis 更适合复杂 SQL 和性能优化","Hibernate 开发快，但 SQL 不好控"],"followUp":[],"pitfalls":[]}},{"id":"f190","question":"#{} 和 ${} 的区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：#{} 和 ${} 的区别。","category":"Spring & MyBatis","difficulty":"简单","tags":["SQL"],"answer":{"oral":"#{} 是预编译占位符，MyBatis 会把它替换成 ?，用 PreparedStatement 设置参数，能防止 SQL 注入，也能复用执行计划；${} 是字符串拼接，直接把值拼进 SQL，有注入风险。动态表名、列名、排序字段这类不能用 #{} 的地方才用 ${}，而且必须自己做白名单校验。即使是 ${}，也不要直接拼用户输入。","keyPoints":["#{} 是预编译占位符，参数绑定，能防注入","${} 直接字符串拼接，有注入风险","动态表名、列名才用 ${}，且要白名单校验","能用 #{} 就不要用 ${}"],"followUp":["#{} 和 ${} 的 SQL 注入风险有什么区别？","什么场景必须用 ${}？"],"pitfalls":["在用户输入里使用 ${}。","认为 #{} 可以拼接表名。"]}},{"id":"f191","question":"MyBatis 的一级、二级缓存？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Spring & MyBatis」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：MyBatis 的一级、二级缓存。","category":"Spring & MyBatis","difficulty":"中等","tags":["MyBatis","SqlSession","namespace","Session"],"answer":{"oral":"一级缓存是 SqlSession 级别，默认开启，同一个 SqlSession 内相同查询会命中缓存；二级缓存是 namespace 级别，跨 SqlSession，需要手动开启，要求实体可序列化。执行增删改、事务提交或回滚时会清空一级缓存；二级缓存在分布式环境下容易读到旧数据，生产上一般不轻易开。一级缓存作用域可以配成 STATEMENT，避免大事务里读到旧数据。","keyPoints":["一级缓存是 SqlSession 级，默认开启","二级缓存是 namespace 级，跨 Session","增删改会清空缓存，事务提交后才写入","分布式下本地缓存易脏，生产常关闭二级缓存"],"followUp":["一级缓存什么时候失效？","二级缓存有哪些坑？"],"pitfalls":["认为一级缓存可以跨 SqlSession。","忽略二级缓存的跨节点一致性。"]}},{"id":"f192","question":"MyBatis 如何实现字段映射？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MyBatis 如何实现字段映射。","category":"Spring & MyBatis","difficulty":"简单","tags":["MyBatis","resultMap","Results"],"answer":{"oral":"MyBatis 字段映射可以靠自动映射，但 mapUnderscoreToCamelCase 默认是 false，开启后才会把下划线转驼峰，比如 user_name 映射 userName；复杂映射用 resultMap 显式配置列和属性；也可以用 @Results、@Result 注解；还可以自定义 TypeHandler 处理特殊类型。字段名和属性名不一致、关联对象、集合嵌套时，必须用 resultMap 或注解。","keyPoints":["默认把同名列自动映射到属性","开启驼峰映射处理下划线字段","复杂映射用 resultMap 或 @Results","映射底层通过反射给属性赋值"],"followUp":[],"pitfalls":[]}},{"id":"f193","question":"MyBatis 插件的运行原理？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MyBatis 插件的运行原理。","category":"Spring & MyBatis","difficulty":"困难","tags":["MyBatis","Interceptor","Plugin.wrap"],"answer":{"oral":"MyBatis 插件基于责任链和动态代理。四大核心对象 Executor、StatementHandler、ParameterHandler、ResultSetHandler 创建时会被 InterceptorChain 包装成代理，插件实现 Interceptor 并指定 @Intercepts 签名，调用目标方法时先经过插件的 intercept，再由 Plugin 的 invoke 决定是否放行。分页、SQL 监控、脱敏都靠这个机制。多个插件会按顺序层层包装，注意执行顺序。","keyPoints":["拦截 Executor、StatementHandler、ParameterHandler、ResultSetHandler","多个插件按顺序形成责任链","Plugin.wrap 用 JDK 动态代理包装","签名用 @Intercepts 和 @Signature 声明"],"followUp":[],"pitfalls":[]}},{"id":"f194","question":"MyBatis 支持动态 SQL 吗？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MyBatis 支持动态 SQL 吗。","category":"Spring & MyBatis","difficulty":"简单","tags":["MyBatis","SQL","if","choose","where","set"],"answer":{"oral":"支持。常用标签有 if、choose when otherwise、where、set、trim、foreach、bind。where 会自动处理多余的 and 或 or，set 会处理多余逗号，foreach 用来遍历集合拼 in 或批量插入。底层是 SqlNode 组合和 OGNL 表达式，解析后生成动态 SQL。复杂动态 SQL 要控制可读性，必要时拆成多个 MappedStatement，避免一条 SQL 里堆太多条件。","keyPoints":["支持 if、choose、where、set、foreach、trim","where 会自动去掉多余的 and","SqlNode 组合成树，用 OGNL 求值","避免在 SQL 里写复杂业务判断"],"followUp":[],"pitfalls":[]}},{"id":"f195","question":"谈谈 MyBatis 的工作原理？","source":"focus","sourceDetail":"面试重
