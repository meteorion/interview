  applyFilters(true);
  // a filter choice is a discrete action; close the mobile drawer so the
  // backdrop doesn't keep blocking the bottom prev/next bar afterwards.
  if(!isDesktop()) closeSidebar();
});

function matchesFilters(q){
  if(state.customIds){ return !!state.customIds[q.id]; }
  if(state.freqFilter==="高频"||state.freqFilter==="中频"||state.freqFilter==="低频"){
    if(q.frequency!==state.freqFilter) return false;
  } else if(state.freqFilter==="star"){
    if(!favorites[q.id]) return false;
  } else if(state.freqFilter==="mastered"){
    if(status[q.id]!=="mastered") return false;
  } else if(state.freqFilter==="unmastered"){
    if(status[q.id]==="mastered") return false;
  }
  if(state.search){
    var hay = (q.question+" "+q.category+" "+(q.tags||[]).join(" ")+" "+q.difficulty+" "+q.answer.oral+" "+(q.answer.keyPoints||[]).join(" ")).toLowerCase();
    if(hay.indexOf(state.search)===-1) return false;
  }
  return true;
}

function applyFilters(resetSelection){
  var grouped = groupByCategory(QUESTIONS.filter(matchesFilters));
  state.filtered = grouped.ordered;
  state.filteredByCat = grouped.byCat;
  if(state.filtered.length===0){
    renderList();
    renderStats();
    renderEmptyMain();
    return;
  }
  hideEmptyMain();
  if(resetSelection){
    var stillIn = state.filtered.some(function(q){ return q.id===state.currentId; });
    if(!stillIn){
      goToQuestion(state.filtered[0].id, {skipHistory:true});
      return;
    }
  }
  renderList();
  renderStats();
}

function renderEmptyMain(){
  /* NOTE: previously this replaced questionCard's innerHTML, which permanently
     destroyed #qTitle/#favBtn/etc. (they're all children of
     questionCard) -- once any filter (search, 收藏, 已掌握 with nothing marked
     yet, etc.) produced zero results, those elements were gone from the DOM
     for good and el.* kept stale references, so question selection silently
     stopped updating anything even after the filter was cleared. Hiding the
     card instead of gutting it keeps every element alive. */
  el.questionCard.style.display = "none";
  if(!el.emptyHintAuto){
    el.emptyHintAuto = document.createElement("div");
    el.emptyHintAuto.className = "empty-hint";
    el.emptyHintAuto.style.padding = "60px 10px";
    el.emptyHintAuto.textContent = "没有找到匹配的题目，换个关键词或筛选条件试试～";
    el.content.appendChild(el.emptyHintAuto);
  }
  el.emptyHintAuto.style.display = "";
  el.toolProgress.textContent = "共 0 题";
}
function hideEmptyMain(){
  el.questionCard.style.display = "";
  if(el.emptyHintAuto) el.emptyHintAuto.style.display = "none";
}

/* ---------------- Sidebar list render (multiple content-based first-level
   directories, one per category, each with its own flat question list) ---------------- */
function renderQItemsHtml(list){
  var htmlParts = [];
  for(var i=0;i<list.length;i++){
    var q = list[i];
    var cur = q.id===state.currentId ? " current" : "";
    var star = favorites[q.id] ? '<span class="mini-badge star">★</span>' : "";
    htmlParts.push(
      '<li class="q-item'+cur+'" data-id="'+q.id+'">'+
        '<span class="q-item-num">'+(i+1)+'</span>'+
        '<span class="q-item-body">'+
          '<div class="q-item-text">'+escapeHtml(q.question)+'</div>'+
          '<div class="q-item-tags">'+
            '<span class="mini-badge freq-'+q.frequency+'">'+q.frequency+'</span>'+'<span class="mini-badge">'+q.difficulty+'</span>'+
            star+
          '</div>'+
        '</span>'+
      '</li>'
    );
  }
  return htmlParts.join("");
}

function renderList(){
  var byCat = state.filteredByCat || {};
  if(state.filtered.length===0){
    el.sidebarListWrap.innerHTML = '<div class="empty-hint">没有匹配的题目</div>';
    return;
  }
  var groupParts = [];
  categories.forEach(function(cat){
    var list = byCat[cat];
    if(!list || !list.length) return;
    var collapsed = isCatCollapsed(cat);
    groupParts.push(
      '<div class="cat-group" data-cat="'+escapeHtml(cat)+'">'+
        '<div class="cat-group-title'+(collapsed?" collapsed":"")+'" data-cat="'+escapeHtml(cat)+'">'+
          '<span class="chevron">▾</span>'+
          '<span class="cat-group-name">'+escapeHtml(cat)+'</span>'+
          '<span class="cat-group-count">'+list.length+'</span>'+
        '</div>'+
        '<ul class="question-list'+(collapsed?" collapsed":"")+'">'+(collapsed ? "" : renderQItemsHtml(list))+'</ul>'+
      '</div>'
    );
  });
  el.sidebarListWrap.innerHTML = groupParts.join("");
}
el.sidebarListWrap.addEventListener("click", function(e){
  var groupTitle = e.target.closest(".cat-group-title");
  if(groupTitle){
    toggleCatCollapsed(groupTitle.getAttribute("data-cat"));
    return;
  }
  var li = e.target.closest(".q-item");
  if(!li) return;
  goToQuestion(li.getAttribute("data-id"));
  if(!isDesktop()) closeSidebar();
});

function scrollCurrentIntoView(){
  /* 手机端侧边栏关闭时不滚动：避免对不可见的长列表强制排版（打开侧边栏时再滚动） */
  if(!isDesktop() && !state.sidebarOpen) return;
  var li = el.sidebarListWrap.querySelector('.q-item[data-id="'+state.currentId+'"]');
  if(li) li.scrollIntoView({block:"center"});
}

function renderStats(){
  var total = state.filtered.length;
  var idx = state.filtered.findIndex(function(q){ return q.id===state.currentId; });
  el.sidebarStats.textContent = "共 "+total+" 题，当前第 "+(idx>=0?idx+1:0)+" 题";
  el.toolProgress.textContent = "第 "+(idx>=0?idx+1:0)+" / "+total+" 题";
}

/* ---------------- Frequency reason popover / sheet ---------------- */
function showFreqReason(q){
  var body =
    '<div class="sheet-title">'+q.frequency+'　·　判断依据</div>'+
    '<div class="sheet-text">'+escapeHtml(q.frequencyReason)+'</div>'+
    '<div class="sheet-text" style="margin-top:8px;color:var(--text-muted);font-size:12.5px;">综合评分 '+q.frequencyScore+' / 100（分类热度 + 题干特征，自动评估仅供参考）</div>'+
    '<button class="sheet-close-btn" id="sheetCloseBtn">知道了</button>';
  openSheet(body);
}
function openSheet(html){
  el.bottomSheet.innerHTML = '<div class="sheet-handle"></div>'+html;
  el.bottomSheet.hidden = false;
  el.sheetOverlay.hidden = false;
  var closeBtn = $("sheetCloseBtn");
  if(closeBtn) closeBtn.addEventListener("click", closeSheet);
}
function closeSheet(){
  el.bottomSheet.hidden = true;
  el.sheetOverlay.hidden = true;
}
el.sheetOverlay.addEventListener("click", closeSheet);

/* ---------------- Main question render ---------------- */
function renderQuestion(q){
  el.freqBadge.textContent = (q.frequency==="高频"?"🔥 ":q.frequency==="中频"?"⚡ ":"📌 ")+q.frequency+" · "+q.difficulty;
  el.freqBadge.className = "badge freq-"+q.frequency;
  el.qTitle.textContent = q.question;

  el.favBtn.textContent = favorites[q.id] ? "★" : "☆";
  el.favBtn.classList.toggle("active", !!favorites[q.id]);

  var mastered = status[q.id]==="mastered";
  el.masteryBtn.classList.toggle("active", mastered);
  el.masteryBtn.setAttribute("aria-label", mastered ? "取消已掌握" : "标记为已掌握");

  el.oralText.innerHTML = mdLite(q.answer.oral);
  el.keypointsList.innerHTML = (q.answer.keyPoints||[]).map(function(k){
    return "<li>"+mdLite(k)+"</li>";
  }).join("");

  if(q.answer.followUp && q.answer.followUp.length){
    el.followupSection.hidden = false;
    el.followupList.innerHTML = q.answer.followUp.map(function(f){ return "<li>"+mdLite(f)+"</li>"; }).join("");
  } else { el.followupSection.hidden = true; }

  if(q.answer.pitfalls && q.answer.pitfalls.length){
    el.pitfallSection.hidden = false;
    el.pitfallList.innerHTML = q.answer.pitfalls.map(function(p){ return "<li>"+mdLite(p)+"</li>"; }).join("");
  } else { el.pitfallSection.hidden = true; }

  setAnswerOpen(false);

  var idx = state.filtered.findIndex(function(x){ return x.id===q.id; });
  el.prevBtn.disabled = idx<=0;
  el.nextBtn.disabled = idx>=state.filtered.length-1 || idx===-1;
}

function setAnswerOpen(open){
  state.answerOpen = open;
  el.answerPanel.hidden = !open;
  el.toggleAnswerBtnBottom.textContent = open ? "收起答案" : "查看答案";
}
function toggleAnswer(){ setAnswerOpen(!state.answerOpen); }
el.toggleAnswerBtnBottom.addEventListener("click", toggleAnswer);

el.freqBadge.addEventListener("click", function(){
  var q = byId[state.currentId];
  if(q) showFreqReason(q);
});

el.favBtn.addEventListener("click", function(){
  var id = state.currentId;
  if(favorites[id]) delete favorites[id]; else favorites[id]=true;
  lsSet("favorites", favorites);
  el.favBtn.textContent = favorites[id] ? "★" : "☆";
  el.favBtn.classList.toggle("active", !!favorites[id]);
  renderList();
  showToast(favorites[id] ? "已收藏" : "已取消收藏");
});

el.masteryBtn.addEventListener("click", function(){
  var id = state.currentId;
  if(status[id]==="mastered"){ delete status[id]; } else { status[id]="mastered"; }
  lsSet("status", status);
  var mastered = status[id]==="mastered";
  el.masteryBtn.classList.toggle("active", mastered);
  el.masteryBtn.setAttribute("aria-label", mastered ? "取消已掌握" : "标记为已掌握");
  showToast(mastered ? "已标记为已掌握" : "已标记为未掌握");
  if(state.freqFilter==="mastered" || state.freqFilter==="unmastered") applyFilters(true);
});

/* ---------------- Navigation ---------------- */
function goToQuestion(id, opts){
  opts = opts || {};
  if(!byId[id]) return;
  state.currentId = id;
  lsSet("lastId", id);
  if(!state.filtered.some(function(q){return q.id===id;})){
    var grouped = groupByCategory(QUESTIONS.filter(matchesFilters));
    state.filtered = grouped.ordered;
    state.filteredByCat = grouped.byCat;
    if(!state.filtered.some(function(q){return q.id===id;})){
      var all = groupByCategory(QUESTIONS.slice());
      state.filtered = all.ordered;
      state.filteredByCat = all.byCat;
    }
  }
  renderQuestion(byId[id]);
  renderList();
  renderStats();
  scrollCurrentIntoView();
  el.content.scrollTop = 0;
}
function stepQuestion(delta){
  var idx = state.filtered.findIndex(function(q){ return q.id===state.currentId; });
  if(idx===-1) return;
  var next = idx+delta;
  if(next<0 || next>=state.filtered.length) return;
  goToQuestion(state.filtered[next].id);
}
el.prevBtn.addEventListener("click", function(){ stepQuestion(-1); });
el.nextBtn.addEventListener("click", function(){ stepQuestion(1); });

el.randomBtn.addEventListener("click", function(){
  if(state.filtered.length===0) return;
  var r = Math.floor(Math.random()*state.filtered.length);
  goToQuestion(state.filtered[r].id);
  showToast("已随机跳转");
});

function openJumpModal(){
  el.jumpOverlay.hidden = false;
  el.jumpModal.hidden = false;
  el.jumpInput.value = "";
  el.jumpInput.focus();
}
function closeJumpModal(){ el.jumpOverlay.hidden = true; el.jumpModal.hidden = true; }
el.jumpBtnTop.addEventListener("click", openJumpModal);
el.jumpOverlay.addEventListener("click", closeJumpModal);
el.jumpConfirm.addEventListener("click", function(){
  var n = parseInt(el.jumpInput.value,10);
  if(!n || n<1 || n>state.filtered.length){
    showToast("请输入 1 - "+state.filtered.length+" 之间的题号");
    return;
  }
  goToQuestion(state.filtered[n-1].id);
  closeJumpModal();
});

/* ---------------- Keyboard shortcuts ---------------- */
document.addEventListener("keydown", function(e){
  var tag = (document.activeElement && document.activeElement.tagName) || "";
  var typing = tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT";
  if(typing){
    if(e.key==="Enter" && document.activeElement===el.jumpInput){ el.jumpConfirm.click(); }
    return;
  }
  if(e.key==="ArrowLeft"){ e.preventDefault(); stepQuestion(-1); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); stepQuestion(1); }
  else if(e.key===" "){ e.preventDefault(); toggleAnswer(); }
  else if(e.key==="Escape"){ closeSheet(); closeJumpModal(); closeSidebar(); }
});

/* ---------------- Swipe on content ---------------- */
(function(){
  var sx=0, sy=0, tracking=false;
  el.content.addEventListener("touchstart", function(e){
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
  },{passive:true});
  el.content.addEventListener("touchend", function(e){
    if(!tracking) return; tracking=false;
    var t=e.changedTouches[0];
    var dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6){
      if(dx<0) stepQuestion(1); else stepQuestion(-1);
    }
  },{passive:true});
})();

/* ---------------- Back to top ---------------- */
el.content.addEventListener("scroll", function(){
  el.backTopBtn.hidden = el.content.scrollTop < 300;
});
el.backTopBtn.addEventListener("click", function(){
  el.content.scrollTo({top:0, behavior:"smooth"});
});

/* ---------------- Init ---------------- */
function init(){
  updateLayoutMode();
  applyTheme();
  initSidebarTitle();
  el.toolTitle.textContent = (META && META.title) || "面试刷题工具";

  var grouped = groupByCategory(QUESTIONS.slice());
  state.filtered = grouped.ordered;
  state.filteredByCat = grouped.byCat;

  var lastId = lsGet("lastId", null);
  var startId = (lastId && byId[lastId]) ? lastId : (QUESTIONS[0] && QUESTIONS[0].id);
  if(startId){
    state.currentId = startId;
    renderQuestion(byId[startId]);
  }
  renderList();
  renderStats();
  scrollCurrentIntoView();
}

init();

/* ================= 知识图谱联动（自动注入，单向：图谱 -> 题库） ================= */
function updateKgBanner(){
  if(!el.kgFilterBanner) return;
  if(state.customIds){
    var n = 0; for(var k in state.customIds) n++;
    el.kgFilterBanner.style.display = "flex";
    var t = el.kgFilterBanner.querySelector(".kg-banner-text");
    if(t) t.textContent = "🕸 来自知识图谱的关联题目 · 共 " + n + " 道";
  } else {
    el.kgFilterBanner.style.display = "none";
  }
}
function applyKgFilter(ids, focusId){
  var map = {};
  (ids||[]).forEach(function(id){ map[id]=true; });
  state.customIds = map;
  state.search = "";
  if(el.searchInput) el.searchInput.value = "";
  updateKgBanner();
  applyFilters(true);
  if(focusId && byId[focusId]) goToQuestion(focusId);
  openSidebar();
}
function clearKgFilter(){
  state.customIds = null;
  updateKgBanner();
  applyFilters(true);
}
el.kgFilterBanner = document.getElementById("kgFilterBanner");
if(el.kgFilterBanner){
  el.kgFilterBanner.addEventListener("click", function(){ clearKgFilter(); });
}
el.searchInput.addEventListener("input", function(){
  if(state.customIds){ state.customIds = null; updateKgBanner(); applyFilters(true); }
});
var __kgFreqRow = document.getElementById("freqFilterRow");
if(__kgFreqRow){
  __kgFreqRow.addEventListener("click", function(){
    if(state.customIds){ state.customIds = null; updateKgBanner(); applyFilters(true); }
  });
}
window.addEventListener("message", function(e){
  var d = e.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "kg-filter"){
    applyKgFilter(d.ids, d.focusId);
  } else if(d.type === "kg-clear"){
    clearKgFilter();
  }
});

})();
</script>
</body>
