点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：谈谈 MyBatis 的工作原理。","category":"Spring & MyBatis","difficulty":"困难","tags":["MyBatis","SqlSessionFactory","SqlSession","Executor","StatementHandler","ResultSetHandler"],"answer":{"oral":"MyBatis 启动时解析配置和 Mapper，生成 SqlSessionFactory；每次操作从工厂拿 SqlSession；SqlSession 通过 Executor 执行，Executor 负责缓存和事务；再交给 StatementHandler 创建 Statement、设置参数；ParameterHandler 处理参数，ResultSetHandler 把结果映射成对象。Mapper 接口由动态代理调用对应的 MappedStatement。SqlSession 不是线程安全的，用完要关闭。","keyPoints":["SqlSessionFactoryBuilder 解析配置生成工厂","SqlSession 提供 API，Executor 负责执行","StatementHandler 负责 JDBC 交互","ResultSetHandler 把结果映射成对象"],"followUp":[],"pitfalls":[]}},{"id":"f196","question":"MyBatis 的延迟加载如何实现？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MyBatis 的延迟加载如何实现。","category":"Spring & MyBatis","difficulty":"中等","tags":["MyBatis","CGLIB","Javassist","lazyLoadingEnabled"],"answer":{"oral":"延迟加载是关联对象在真正使用时才查询。MyBatis 用 CGLIB 或 Javassist 给关联对象生成代理，触发 getter 时再发 SQL。需要开启 lazyLoadingEnabled，并配置 aggressiveLazyLoading；嵌套查询配合 fetchType=lazy 使用。延迟加载会增加数据库交互次数，容易产生 N+1，事务外使用还可能因为 SqlSession 关闭而拿不到数据，要谨慎。","keyPoints":["嵌套查询时返回代理对象","用 CGLIB 或 Javassist 生成代理","访问属性时才真正触发查询","lazyLoadingEnabled 控制，注意 N+1 问题"],"followUp":[],"pitfalls":[]}},{"id":"f197","question":"MyBatis 如何执行批量操作？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MyBatis 如何执行批量操作。","category":"Spring & MyBatis","difficulty":"中等","tags":["MyBatis","foreach","ExecutorType.BATCH","rewriteBatchedStatements"],"answer":{"oral":"批量操作有三种方式：用 foreach 拼成一条多值 insert 或 in 查询；用 ExecutorType.BATCH 的 SqlSession，把多条语句攒批发送；JDBC 层加 rewriteBatchedStatements=true，让 MySQL 驱动把批量语句改写成多值语句。大批量要分批提交，控制每批数量，避免事务太大和内存溢出。还要注意 BATCH 模式下返回值是影响的记录数，不是自增主键。","keyPoints":["foreach 拼接多条 SQL，一次发送","ExecutorType.BATCH 复用 Statement 批量提交","JDBC 加 rewriteBatchedStatements 提升效率","大批量要分批，避免超大 SQL 和内存"],"followUp":[],"pitfalls":[]}},{"id":"f198","question":"MyBatis 分页怎么做？分页插件原理？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MyBatis 分页怎么做分页插件原理。","category":"Spring & MyBatis","difficulty":"困难","tags":["MyBatis","RowBounds","Executor","LIMIT"],"answer":{"oral":"分页可以用 RowBounds，但它是逻辑分页，会把所有结果查出来再截取，大表不可用；生产用物理分页，比如 PageHelper 插件，它拦截 Executor 的 query 方法，根据数据库方言改写 SQL 加 LIMIT；也可以自己写 limit 参数。分页插件原理就是 MyBatis 拦截器加 SQL 改写。PageHelper 的 count 查询也会被拦截，复杂 SQL 要确认 count 是否正确。","keyPoints":["RowBounds 是逻辑分页，会把结果全查回来","物理分页在 SQL 里拼 LIMIT","PageHelper 拦截 Executor，改写 SQL","大表深分页要配合游标或延迟关联"],"followUp":[],"pitfalls":[]}},{"id":"f199","question":"为什么 Mapper 接口不需要写实现类？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：为什么 Mapper 接口不需要写实现类。","category":"Spring & MyBatis","difficulty":"中等","tags":["Mapper","MapperProxy","MappedStatement"],"answer":{"oral":"因为 MyBatis 用 JDK 动态代理为 Mapper 接口生成代理对象。启动时扫描 Mapper 接口，注册 MapperProxyFactory；调用接口方法时，MapperProxy 根据方法全限定名找到对应的 MappedStatement，再交给 SqlSession 执行。所以接口不需要实现类，XML 或注解里的 SQL 才是真正的实现。方法重载、参数名和命名空间要能唯一映射到 MappedStatement。","keyPoints":["启动时扫描 Mapper 接口","用 JDK 动态代理生成 MapperProxy","方法名和 XML 的 id 对应到 MappedStatement","调用时找到 SQL 并执行"],"followUp":[],"pitfalls":[]}},{"id":"f200","question":"MyBatis 有哪些 Executor 执行器？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MyBatis 有哪些 Executor 执行器。","category":"Spring & MyBatis","difficulty":"困难","tags":["MyBatis","Executor","Simple","Reuse","Batch","CachingExecutor"],"answer":{"oral":"有三种基础 Executor：SimpleExecutor 每次执行都新建 Statement；ReuseExecutor 复用 Statement；BatchExecutor 攒批执行。CachingExecutor 在它们外面加二级缓存。可以在 SqlSessionFactory 里配置 defaultExecutorType，也可以在每次 SqlSession 时指定。简单查询用 Simple，循环执行同构 SQL 用 Reuse 或 Batch，批量写入优先 Batch。","keyPoints":["SimpleExecutor 每次新建 Statement","ReuseExecutor 复用 Statement","BatchExecutor 批量执行","CachingExecutor 包一层二级缓存"],"followUp":[],"pitfalls":[]}},{"id":"f201","question":"JDBC 的执行步骤？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：JDBC 的执行步骤。","category":"Spring & MyBatis","difficulty":"中等","tags":["JDBC","PreparedStatement","ResultSet"],"answer":{"oral":"JDBC 步骤是：加载驱动，获取 Connection，创建 PreparedStatement 并设置参数，执行 SQL 拿到 ResultSet，遍历结果集映射对象，最后按顺序关闭 ResultSet、Statement、Connection。用 try-with-resources 或连接池管理资源。MyBatis 底层也是这套流程，只是封装了参数映射和结果映射；连接池换成了 HikariCP 或 Druid。","keyPoints":["加载驱动并获取 Connection","创建 PreparedStatement 并设置参数","执行 SQL 得到 ResultSet 并映射","按 ResultSet、Statement、Connection 顺序关闭"],"followUp":[],"pitfalls":[]}},{"id":"f202","question":"MyBatis 与 Spring 如何整合？SqlSession 线程安全吗？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Spring & MyBatis」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：MyBatis 与 Spring 如何整合SqlSess。","category":"Spring & MyBatis","difficulty":"困难","tags":["MyBatis","Spring","SqlSession","MapperScannerConfigurer","SqlSessionTemplate","ThreadLocal"],"answer":{"oral":"MyBatis 与 Spring 整合靠 mybatis-spring：MapperScannerConfigurer 扫描 Mapper 接口并注册成 Bean；SqlSessionFactoryBean 创建 SqlSessionFactory；SqlSessionTemplate 是线程安全的代理，内部通过 SqlSessionInterceptor 获取和关闭 SqlSession。SqlSession 本身不是线程安全的，但 SqlSessionTemplate 通过动态代理和事务同步保证了线程安全。和 Spring 事务整合后，同一个事务里会复用同一个 SqlSession。","keyPoints":["MapperScannerConfigurer 扫描接口并注册 Bean","SqlSessionTemplate 是线程安全的","底层通过 ThreadLocal 绑定 SqlSession","与 Spring 事务共用同一个连接"],"followUp":[],"pitfalls":[]}},{"id":"f203","question":"为什么要用消息队列？有哪些代价？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：为什么要用消息队列有哪些代价。","category":"消息队列","difficulty":"简单","tags":[],"answer":{"oral":"消息队列主要解决三件事：解耦，上游不用直接调下游；异步，把非核心流程从主链路拆出去，降低 RT；削峰，把瞬时流量缓冲起来慢慢消费。代价是系统复杂度上升，要处理消息丢失、重复、顺序、积压，还要运维 Broker 和监控，数据一致性也从强一致变成最终一致。引入 MQ 之前要先想清楚是否真的需要异步和解耦，别为了用而用。","keyPoints":["解耦上下游，异步提升响应速度","削峰填谷，保护后端不被瞬时流量打垮","通过重试和补偿实现最终一致","代价是延迟、重复、顺序和运维复杂度"],"followUp":["引入 MQ 会带来哪些问题？","什么场景不适合用 MQ？"],"pitfalls":["只说解耦和异步，不说系统复杂度。","忽略消息丢失、重复和顺序问题。"]}},{"id":"f204","question":"Kafka 的架构是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Kafka 的架构是怎样的。","category":"消息队列","difficulty":"中等","tags":["Kafka","Producer","Broker","Consumer","Topic","Partition"],"answer":{"oral":"Kafka 由 Producer、Broker、Consumer 组成。Topic 是逻辑分类，Partition 是物理分片，每个 Partition 有多个 Replica，Leader 负责读写，Follower 同步；Controller 负责集群管理，老版本依赖 ZooKeeper，新版本用 KRaft 去掉了 ZooKeeper。Consumer Group 里的消费者按 Partition 分配消费。Partition 数决定最大消费并行度，副本数决定可靠性。","keyPoints":["Producer 写 Topic，Topic 分成多个 Partition","Broker 存分区副本，Leader 读写、Follower 同步","Controller 管理集群元数据","KRaft 模式去掉 ZooKeeper 依赖"],"followUp":["Kafka 的副本机制是怎样的？","Controller 在集群中起什么作用？"],"pitfalls":["把 Partition 当成 Topic 的物理分片，却忽略副本。","忽略 Broker 和 Controller 的角色。"]}},{"id":"f205","question":"Kafka 为什么这么快？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Kafka 为什么这么快。","category":"消息队列","difficulty":"中等","tags":["Kafka","PageCache"],"answer":{"oral":"Kafka 快主要有几点：顺序写磁盘，避免随机 IO；大量利用 PageCache，读写都在内存页缓存；零拷贝，用 sendfile 让数据从页缓存直接到网卡，减少用户态和内核态的复制；批量发送和压缩，减少网络请求；分区并行读写，水平扩展；还有高效的日志索引。零拷贝和 PageCache 的前提是顺序读写，随机读写会把这些优势抵消掉。","keyPoints":["分区顺序追加写磁盘，充分利用 PageCache","零拷贝让数据不经过用户态复制","批量发送和压缩降低网络开销","多分区并行读写提升吞吐"],"followUp":["Kafka 的零拷贝怎么实现？","PageCache 起到什么作用？"],"pitfalls":["只说顺序写，不说零拷贝和批处理。","忽略分区并行带来的吞吐提升。"]}},{"id":"f206","question":"Kafka 的消息发送流程是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Kafka 的消息发送流程是怎样的。","category":"消息队列","difficulty":"困难","tags":["Kafka","RecordAccumulator","Sender","Broker"],"answer":{"oral":"Producer 发送消息先经过拦截器、序列化器，再由分区器决定发到哪个 Partition；然后放进 RecordAccumulator 内存缓冲，按批次攒够或超时后，由 Sender 线程取出来发到 Broker；Broker 写入日志并返回响应。acks 配置决定等待哪些副本确认，acks=0 不等、acks=1 等 Leader、acks=all 等 ISR 全部确认。重试和幂等性也在这一层处理。","keyPoints":["拦截器处理消息，序列化器转字节","分区器决定写入哪个分区","RecordAccumulator 把消息缓冲成批","Sender 线程批量发送到 Broker"],"followUp":[],"pitfalls":[]}},{"id":"f207","question":"Kafka 为什么有 Topic 还要 Partition？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Kafka 为什么有 Topic 还要 Partitio。","category":"消息队列","difficulty":"简单","tags":["Kafka","Topic","Partition"],"answer":{"oral":"Topic 是逻辑概念，Partition 才是物理分片。加 Partition 可以提高并行度、突破单机磁盘和网络瓶颈，也能让消费者并行消费；但 Partition 内只能保证局部顺序，跨 Partition 无法保证全局顺序。Partition 太多也有代价：文件句柄、元数据、重平衡时间都会增加。所以顺序和吞吐要权衡，按业务并发度和顺序要求来定。","keyPoints":["分区是并行和水平扩展的单位","同一分区内消息严格有序","分区分布到不同 Broker 实现负载均衡","分区数决定最大消费并发"],"followUp":[],"pitfalls":[]}},{"id":"f208","question":"Kafka 有几种选举过程？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Kafka 有几种选举过程。","category":"消息队列","difficulty":"困难","tags":["Kafka","Controller","Partition","Leader","Consumer","Group"],"answer":{"oral":"常见有三种：Controller 选举，集群里选一个 Broker 负责管理；Partition Leader 选举，Leader 挂了从 ISR 里选新的 Leader；Consumer Group Leader 选举，消费者组里选一个负责分区分配。KRaft 模式下 Controller 选举用 Raft，ZooKeeper 模式下靠 ZK 的临时节点和投票。Partition 选举优先选 ISR 里的副本，尽量不丢数据。","keyPoints":["Controller 选举负责集群管理","Partition Leader 选举由 Controller 触发","Consumer Group Leader 负责分区分配","KRaft 用元数据仲裁选举"],"followUp":[],"pitfalls":[]}},{"id":"f209","question":"Kafka 如何实现顺序消费？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Kafka 如何实现顺序消费。","category":"消息队列","difficulty":"中等","tags":["Kafka","Partition"],"answer":{"oral":"Kafka 只能保证 Partition 内有序。生产时把需要顺序的消息用同一个 key，分区器按 key hash 路由到同一个 Partition；消费端一个 Partition 只由一个消费者线程处理，或者按 key 加锁、用单线程消费。跨 Partition 的全局顺序需要把并发度降到 1，吞吐会受影响。顺序和幂等要一起考虑，重复消费也可能破坏业务顺序。","keyPoints":["Kafka 只保证分区内有序","相同 key 会路由到同一分区","消费端单线程或按 key 加锁","跨分区无法保证全局顺序"],"followUp":["同一 Partition 内如何保证顺序？","多 Partition 如何保证全局顺序？"],"pitfalls":["认为 Kafka 天生全局有序。","忽略消费者并发对顺序的影响。"]}},{"id":"f210","question":"Kafka 如何保证消息不丢失？为什么无法 100% 保证？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Kafka 如何保证消息不丢失为什么无法 100% 保证。","category":"消息队列","difficulty":"困难","tags":["Kafka","acks","all","min.insync.replicas","offset","CAP"],"answer":{"oral":"要保证不丢，生产端要 acks=all，并设置 min.insync.replicas 至少 2；Broker 要保证副本同步和刷盘策略；消费端要关闭自动提交，处理成功后再手动提交 offset。但无法 100% 保证，因为磁盘损坏、机房故障、网络分区、人为误操作都可能丢数据，只能通过多副本、跨机房、备份和监控把概率降到很低。还要注意消费端在提交 offset 前崩溃会重复消费。","keyPoints":["生产端 acks=all 并开启重试","副本数大于 1，min.insync.replicas 至少 2","消费端手动提交 offset，处理完再提交","硬件故障和极端异常无法百分百保证"],"followUp":["消息可能在哪些环节丢失？","怎么实现端到端的 Exactly-Once？"],"pitfalls":["只说 Broker 持久化，忽略生产端确认。","忽略消费端位移提交和业务处理。"]}},{"id":"f211","question":"Kafka 如何保证 Exactly-Once？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Kafka 如何保证 Exactly-Once。","category":"消息队列","difficulty":"困难","tags":["Kafka","Exactly-Once","read","committed"],"answer":{"oral":"Exactly-Once 分生产端和消费端。生产端开启幂等性，给每条消息带序列号，Broker 去重；跨多个 Partition 或跨会话要用事务，把生产消息和提交 offset 放在同一个事务里，消费端设置 read_committed 只读已提交数据。消费端还要保证处理逻辑幂等，因为事务和位移提交仍可能失败重试。Kafka 的 EOS 主要覆盖 Kafka 内部链路，外部系统要靠业务幂等。","keyPoints":["生产端开幂等，避免重试重复写","事务保证多分区写入的原子性","消费端 read_committed 只读已提交消息","端到端还需业务幂等兜底"],"followUp":[],"pitfalls":[]}},{"id":"f212","question":"什么是 Kafka 的重平衡机制？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是 Kafka 的重平衡机制。","category":"消息队列","difficulty":"困难","tags":["Kafka","Range","RoundRobin","Sticky","STW"],"answer":{"oral":"重平衡是消费者组内分区重新分配。触发条件有消费者加入或退出、订阅的 Topic 变化、分区数变化、心跳超时。Eager 模式下重平衡期间整个组会停顿；Cooperative Sticky 模式会尽量保留原分配、减少停顿时长。分配策略有 Range、RoundRobin、Sticky，Sticky 尽量保留原分配减少迁移。优化可以调大会话超时、减少 Rebalance 次数、用静态成员。","keyPoints":["消费者增减、订阅变化、心跳超时触发","Range、RoundRobin、Sticky 等分配策略","Eager 重平衡会全组停顿；Cooperative Sticky 减少停顿","用静态成员和增量重平衡减少停顿"],"followUp":[],"pitfalls":[]}},{"id":"f213","question":"Kafka 的 ISR、HW、LEO 和 LeaderEpoch 分别是什么？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Kafka 的 ISR、HW、LEO 和 LeaderE。","category":"消息队列","difficulty":"困难","tags":["Kafka","ISR","HW","LEO","LeaderEpoch","Leader"],"answer":{"oral":"ISR 是和 Leader 保持同步的副本集合；HW 是高水位，表示所有消费者能看到的已提交消息位置；LEO 是日志末端位移，每个副本都有自己的 LEO；LeaderEpoch 用来标识 Leader 任期，防止旧 Leader 恢复后按过期 HW 截断日志导致数据错乱。消费者只能读到 HW 之前的消息，HW 之后的消息对消费者不可见。","keyPoints":["ISR 是与 Leader 保持同步的副本集合","HW 是 ISR 中最小的 LEO，消费者只能读到 HW 之前","LEO 是日志末端位移","LeaderEpoch 防止旧 Leader 数据覆盖新数据"],"followUp":["ISR 如何收缩和扩张？","HW 和 LEO 有什么区别？"],"pitfalls":["把 HW 当成最新消息的 offset。","忽略 LeaderEpoch 解决的问题。"]}},{"id":"f214","question":"Kafka 的日志存储结构是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Kafka 的日志存储结构是怎样的。","category":"消息队列","difficulty":"困难","tags":["Kafka","segment","log","index","timeindex"],"answer":{"oral":"Kafka 一个 Partition 对应一个目录，里面按大小或时间切成多个 segment。每个 segment 有 .log 数据文件、.index 偏移索引、.timeindex 时间索引。索引是稀疏的，不是每条消息都记，查询时先二分索引找到大致位置，再顺序扫描。日志清理有 delete 和 compact 两种策略，compact 适合保留每个 key 的最新值，比如变更日志。","keyPoints":["Topic 按分区切成多个 segment",".log 存消息，.index 和 .timeindex 是稀疏索引","按 offset 或时间二分查找定位","按大小或时间滚动，过期清理或压缩"],"followUp":[],"pitfalls":[]}},{"id":"f215","question":"消息积压了怎么处理？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：消息积压了怎么处理。","category":"消息队列","difficulty":"中等","tags":[],"answer":{"oral":"先定位为什么积压：是生产突增、消费者太少、消费逻辑慢、下游阻塞，还是某个 Partition 热点。处理可以扩容消费者，但消费者数不能超过 Partition 数；提高消费并发、批量拉取、优化慢逻辑、异步化下游；临时可以把消息转移到新 Topic 或落库打捞，先恢复主链路。积压期间要监控 lag，避免盲目扩容把下游打挂。","keyPoints":["先定位是生产突增还是消费变慢","增加分区数并扩容消费者实例","优化消费逻辑，提高批量和异步处理","临时转移消息或另起队列打捞"],"followUp":["消息积压时怎么快速扩容消费？","扩容消费会带来顺序问题吗？"],"pitfalls":["只扩容消费者，忽略分区数上限。","忽略下游处理能力才是真正瓶颈。"]}},{"id":"f216","question":"Kafka、RocketMQ、RabbitMQ 如何选型？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Kafka、RocketMQ、RabbitMQ 如何选型。","category":"消息队列","difficulty":"简单","tags":["Kafka","RocketMQ","RabbitMQ"],"answer":{"oral":"Kafka 吞吐最高，适合日志、流处理、大数据场景，延迟消息和事务相对弱；RocketMQ 是阿里开源，支持事务消息、顺序消息、延迟消息，适合电商交易链路，运维和 Java 生态友好；RabbitMQ 轻量、延迟低、路由灵活，适合中小规模业务和复杂路由。选型看吞吐、延迟、顺序、事务、延迟消息和团队运维能力，别只看 benchmark。","keyPoints":["Kafka 吞吐最高，适合日志和流处理","RocketMQ 顺序、事务、延迟消息齐全，适合业务","RabbitMQ 路由灵活、延迟低，适合中小规模","按吞吐、顺序、事务和运维成本选"],"followUp":[],"pitfalls":[]}},{"id":"f217","question":"RabbitMQ 的架构与交换机类型？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：RabbitMQ 的架构与交换机类型。","category":"消息队列","difficulty":"简单","tags":["RabbitMQ","direct","topic","fanout","headers","vhost"],"answer":{"oral":"RabbitMQ 的核心是 Producer、Exchange、Queue、Binding、Consumer，还有 vhost 做逻辑隔离。交换机类型有 direct 按 routing key 精确匹配、topic 按通配符匹配、fanout 广播、headers 按消息头匹配。生产者发到 Exchange，Exchange 根据绑定规则路由到 Queue。路由不到的消息可以配 mandatory 或备用交换机，避免静默丢失。","keyPoints":["Producer 发到 Exchange，按路由键绑定队列","direct 精确匹配，topic 通配，fanout 广播","headers 按消息头匹配","vhost 在 RabbitMQ 里做逻辑隔离"],"followUp":[],"pitfalls":[]}},{"id":"f218","question":"RabbitMQ 如何保证消息不丢失？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：RabbitMQ 如何保证消息不丢失。","category":"消息队列","difficulty":"中等","tags":["RabbitMQ","confirm","ACK","mandatory"],"answer":{"oral":"生产端开启 confirm 模式，确认消息到达 Broker；Exchange 和 Queue 都要持久化，消息设 deliveryMode=2；消费端手动 ACK，处理成功再确认；队列用仲裁队列或镜像队列保证高可用；还要设置 mandatory 或备用交换机处理无法路由的消息，配合死信队列兜底。注意持久化和 confirm 只能保证到 Broker，消费端失败重试和幂等仍要自己做。","keyPoints":["生产端 confirm 确认消息到达","交换机和队列持久化，消息也持久化","消费端处理完手动 ACK","用仲裁队列保证队列高可用"],"followUp":["RabbitMQ 的消息确认机制是什么？","消息持久化需要配置哪些环节？"],"pitfalls":["只设置交换机持久化。","忽略 publisher confirm 和 consumer ack。"]}},{"id":"f219","question":"RabbitMQ 的死信队列和延迟队列如何实现？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：RabbitMQ 的死信队列和延迟队列如何实现。","category":"消息队列","difficulty":"困难","tags":["RabbitMQ","DLX","TTL"],"answer":{"oral":"死信队列是消息被拒绝、过期或队列满时，转到配置的 DLX 交换机，再进死信队列，用于失败重试和排查。延迟队列可以用 TTL 加 DLX：消息设过期时间，到期后变成死信转到目标队列；也可以用 rabbitmq-delayed-message-exchange 插件，直接按延迟时间投递。注意队列级 TTL 下消息是先进先出，前面的没到期会挡住后面的，延迟时间不同的消息要分队列。","keyPoints":["死信来源：被拒绝、过期、队列满","绑定 DLX 后转入死信队列","延迟队列用 TTL 加 DLX 或延迟插件","失败消息进死信后人工或定时重试"],"followUp":[],"pitfalls":[]}},{"id":"f220","question":"RocketMQ 的架构是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：RocketMQ 的架构是怎样的。","category":"消息队列","difficulty":"中等","tags":["RocketMQ","NameServer","Broker","Producer","Consumer","Topic"],"answer":{"oral":"RocketMQ 由 NameServer、Broker、Producer、Consumer 组成。NameServer 负责路由注册和发现，Broker 负责存储和收发消息，Topic 逻辑上分成多个 MessageQueue，消息存在 CommitLog，消费队列 ConsumeQueue 存索引。Producer 从 NameServer 拿路由后发到 Broker。NameServer 之间不通信，靠 Broker 定期注册心跳，所以客户端要处理路由变化。","keyPoints":["NameServer 负责路由注册和发现","Broker 存消息，分 Master 和 Slave","Producer 发到指定 Topic 的 MessageQueue","Consumer 从 Broker 拉取并消费"],"followUp":[],"pitfalls":[]}},{"id":"f221","question":"RocketMQ 有几种集群部署方式？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":65,"frequencyReason":"「消息队列」了解题，偏细节或低频，时间有限时可后置。考点：RocketMQ 有几种集群部署方式。","category":"消息队列","difficulty":"简单","tags":["RocketMQ","Master","Slave"],"answer":{"oral":"常见部署有单 Master，简单但不可靠；多 Master，多个主节点分担写，但单个 Master 挂了其消息不可用；多 Master 多 Slave，每个 Master 带 Slave，Slave 同步或异步复制，主挂后可以切换。同步双写可靠性高但性能低，异步双写性能好但可能丢少量消息。生产一般至少两主两从，配合 DLedger 或 Controller 做自动切换。","keyPoints":["单 Master 最简单但有单点","多 Master 无 Slave，性能高但不可靠","多 Master 多 Slave 异步复制，性能好但有少量丢失风险","同步双写可靠性高但延迟大"],"followUp":[],"pitfalls":[]}},{"id":"f222","question":"RocketMQ 是推模式还是拉模式？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":66,"frequencyReason":"「消息队列」了解题，偏细节或低频，时间有限时可后置。考点：RocketMQ 是推模式还是拉模式。","category":"消息队列","difficulty":"简单","tags":["RocketMQ","Pull","Push"],"answer":{"oral":"RocketMQ 底层是拉模式，消费者主动去 Broker 拉消息，但客户端用长轮询把它封装成类似推模式：没有消息时 Broker 挂起请求一段时间，默认十几秒，有消息再立刻返回。这样既有拉模式的消费端可控、按自身能力消费，又避免了频繁空轮询带来的压力。Push 只是 API 层的封装，底层仍是 Pull，消费位点由客户端管理并定期上报 Broker。拉取批量大小、长轮询超时和消费线程数要一起调，不然容易出现拉空或者积压。","keyPoints":["客户端本质是拉模式 Pull","没有消息时长轮询挂起请求","有新消息立即返回，兼顾实时和压力","客户端封装成 Push 回调"],"followUp":[],"pitfalls":[]}},{"id":"f223","question":"RocketMQ 的事务消息如何实现？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：RocketMQ 的事务消息如何实现。","category":"消息队列","difficulty":"困难","tags":["RocketMQ","Broker"],"answer":{"oral":"事务消息分三步：生产者先发半消息到 Broker，Broker 存起来但不投递；生产者执行本地事务，根据结果提交或回滚半消息；如果本地事务结果未知或者提交失败，Broker 会定时回查生产者。提交后消息才对消费者可见，从而实现本地事务和发消息的最终一致。回查次数和间隔可以配置，生产者要实现回查接口并保证幂等，回查时以数据库事务状态为准。要注意消费端仍然可能重复消费，所以下游也必须幂等。","keyPoints":["先发半消息，Broker 暂存不投递","执行本地事务后提交或回滚","Broker 定时回查未确认的消息","保证本地事务和消息最终一致"],"followUp":["RocketMQ 事务消息的半消息机制是什么？","事务回查怎么处理？"],"pitfalls":["认为事务消息能保证消费端幂等。","忽略本地事务和消息发送的一致性。"]}},{"id":"f224","question":"RocketMQ 如何保证消息顺序？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：RocketMQ 如何保证消息顺序。","category":"消息队列","difficulty":"中等","tags":["RocketMQ","MessageQueueSelector"],"answer":{"oral":"RocketMQ 支持分区有序和全局有序。分区有序是把同一业务 key 用 MessageQueueSelector 路由到同一个 MessageQueue，消费端用顺序消费加锁保证单队列单线程；全局有序要所有消息进同一个队列，吞吐很低。一般业务用分区有序就够了。顺序消费下消费者扩容受队列数限制，重平衡时也要注意锁的释放。","keyPoints":["全局有序只用一个队列，吞吐低","分区有序按业务 key 选同一个 MessageQueue","消费端单线程或按 key 加锁","顺序性和吞吐量需要权衡"],"followUp":[],"pitfalls":[]}},{"id":"f225","question":"RocketMQ 如何保证消息不丢失？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：RocketMQ 如何保证消息不丢失。","category":"消息队列","difficulty":"中等","tags":["RocketMQ","ACK"],"answer":{"oral":"生产端用同步发送并开启重试，保证消息到达 Broker；Broker 用同步刷盘或异步刷盘加主从同步，防止宕机丢数据；消费端处理成功后再 ACK，失败重试；还要处理消息积压和死信。和 Kafka 一样，无法做到绝对 100%，只能多层兜底，比如发送端记录发送日志、消费端记录消费位点。关键业务建议本地消息表加对账，别只依赖 MQ 的可靠性承诺。另外要区分消息丢失和消息重复，前者靠刷盘、副本和重试，后者靠幂等。","keyPoints":["生产端同步发送并开启重试","同步刷盘保证消息真正落盘","主从同步复制避免切换丢消息","消费端处理成功后再 ACK"],"followUp":[],"pitfalls":[]}},{"id":"f226","question":"RocketMQ 的延迟消息如何实现？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「消息队列」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：RocketMQ 的延迟消息如何实现。","category":"消息队列","difficulty":"中等","tags":["RocketMQ"],"answer":{"oral":"RocketMQ 4.x 默认支持 18 个延迟级别，从 1 秒到 2 小时，消息先写到延迟 Topic，到时后由定时任务转到真实 Topic；5.0 支持任意时间延迟，底层用时间轮或定时消息机制。业务上可以用延迟消息做订单超时取消、定时提醒。注意延迟级别是固定的，不能精确到任意秒，5.0 之前要按业务选择最接近的级别。","keyPoints":["4.x 固定 18 个延迟级别","定时任务扫描到期消息再投递","5.0 支持任意时间延迟","底层基于时间轮或定时任务投递"],"followUp":[],"pitfalls":[]}},{"id":"f227","question":"RocketMQ 的存储结构是怎样的？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":67,"frequencyReason":"「消息队列」了解题，偏细节或低频，时间有限时可后置。考点：RocketMQ 的存储结构是怎样的。","category":"消息队列","difficulty":"困难","tags":["RocketMQ","CommitLog","ConsumeQueue","IndexFile","PageCache"],"answer":{"oral":"RocketMQ 的 CommitLog 是所有消息统一顺序追加的文件，ConsumeQueue 是按 Topic 和 Queue 维护的索引，里面存消息在 CommitLog 的偏移、大小和 tag hash；IndexFile 支持按 key 或 tag 查询。读取时先查 ConsumeQueue 再回 CommitLog，PageCache 加速，刷盘分同步和异步。ConsumeQueue 很小，可以全量加载到内存，这也是它读快的原因。","keyPoints":["CommitLog 顺序存所有消息","ConsumeQueue 按 Topic 和队列存索引","IndexFile 支持按 key 查询","PageCache 加速读写，刷盘策略决定可靠性"],"followUp":[],"pitfalls":[]}},{"id":"f228","question":"如何避免消息重复消费？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「消息队列」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：如何避免消息重复消费。","category":"消息队列","difficulty":"中等","tags":[],"answer":{"oral":"消息队列通常保证至少一次投递，所以消费端必须幂等。常用方案有：用业务唯一键加唯一索引，重复插入失败；用去重表记录消息 id 和处理状态；用状态机，只有特定状态才能流转；用分布式锁串行化同一业务 key；或者用 Redis 的 setnx 做短期去重。核心是让重复消费不产生副作用，而不是简单地把消息丢掉。去重表的清理周期、锁的超时和并发顺序都要考虑，Redis 去重还要防止重启丢 key，重要业务最终仍要靠数据库的唯一约束兜底。","keyPoints":["至少一次投递决定了可能重复","用业务唯一键或幂等表去重","状态机保证业务只流转一次","消费前查重，处理与去重要在一个事务里"],"followUp":["幂等键怎么设计？","去重表和 Redis 去重怎么选？"],"pitfalls":["认为 MQ 不会重复投递。","把业务幂等和消息幂等混为一谈。"]}},{"id":"f229","question":"CAP 和 BASE 是什么？为什么 P 通常必选？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：CAP 和 BASE 是什么为什么 P 通常必选。","category":"分布式","difficulty":"简单","tags":["CAP","BASE","ACID"],"answer":{"oral":"CAP 是一致性、可用性、分区容错性三者最多同时满足两个。分布式系统网络分区不可避免，所以 P 通常必选，剩下就在 C 和 A 之间取舍。强一致场景选 CP，比如 ZooKeeper、etcd；高可用场景选 AP，比如 Eureka、Nacos 的临时实例。BASE 是对 AP 的补充，基本可用、软状态、最终一致，用异步和补偿换取可用性。实际系统往往不是纯 CP 或纯 AP，而是按业务分级取舍。","keyPoints":["C、A、P 三者最多同时满足两个","网络分区不可避免，P 通常必选","CP 强一致但可能短时不可用，AP 高可用但最终一致","BASE 用软状态和最终一致换取可用性"],"followUp":["CAP 和 BASE 是什么关系？","为什么分布式系统不能同时满足 CAP？"],"pitfalls":["把 CA 当成可以同时满足的常态。","忽略分区容忍是分布式系统的前提。"]}},{"id":"f230","question":"常见的一致性模型有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：常见的一致性模型有哪些。","category":"分布式","difficulty":"中等","tags":[],"answer":{"oral":"常见一致性模型从强到弱有：线性一致，所有操作看起来像单机按真实时间顺序执行；顺序一致，所有线程看到相同的操作顺序，但不要求和真实时间一致；因果一致，只保证有因果关系的操作有序；读己之写，自己写完能读到自己的写；最终一致，经过一段时间后所有副本收敛。互联网系统常用最终一致加业务补偿，强一致只放在资金、库存这类核心链路。","keyPoints":["线性一致最强，像单机按真实时间执行","顺序一致要求所有线程看到相同顺序","因果一致只保证有因果关系的操作有序","读己之写和最终一致更弱，互联网系统常用"],"followUp":["强一致和最终一致怎么选？","线性一致和顺序一致有什么区别？"],"pitfalls":["把所有一致性都叫强一致。","忽略业务对延迟的容忍度。"]}},{"id":"f231","question":"Paxos、Raft、ZAB 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Paxos、Raft、ZAB 有什么区别。","category":"分布式","difficulty":"困难","tags":["Paxos","Raft","ZAB","Leader","ZooKeeper"],"answer":{"oral":"Paxos 是分布式共识的基础算法，解决多个节点如何就某个值达成一致，但工程实现复杂；Raft 简化了 Paxos，用 Leader 选举、日志复制和任期号保证一致性，Leader 挂了重新选举，日志按任期和索引复制，etcd 就是典型；ZAB 是 ZooKeeper 的协议，也是 Leader 加日志复制，但更强调顺序一致性，用 ZXID 和 epoch 做崩溃恢复。三者都靠多数派机制避免双主提交，Raft 和 ZAB 更工程化。","keyPoints":["Paxos 是共识理论基础，工程实现复杂","Raft 用 Leader、日志复制和任期号简化","ZAB 是 ZooKeeper 协议，强调顺序一致","三者都靠多数派机制避免双主提交"],"followUp":[],"pitfalls":[]}},{"id":"f232","question":"什么是一致性哈希？为什么需要虚拟节点？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是一致性哈希为什么需要虚拟节点。","category":"分布式","difficulty":"中等","tags":[],"answer":{"oral":"一致性哈希是把节点和 key 都映射到一个哈希环上，key 顺时针找到第一个节点。扩缩容时只影响相邻节点的一部分数据，不用全量重分布，平均迁移量大约是总量的 1/N。但节点少时容易数据倾斜，所以引入虚拟节点，每个物理节点对应很多虚拟节点，让数据分布更均匀，也方便按权重调整负载。虚拟节点还能减少节点增减时的数据迁移量。实际实现要注意哈希函数均匀性、节点摘除后的数据迁移，以及热点 key 单独处理。","keyPoints":["节点和 key 映射到同一个哈希环","扩缩容只影响相邻节点的数据","节点少会倾斜，用虚拟节点均衡","虚拟节点还能按权重分配负载"],"followUp":["一致性哈希如何解决扩缩容问题？","虚拟节点解决什么问题？"],"pitfalls":["认为普通哈希也能平滑扩缩容。","忽略数据倾斜。"]}},{"id":"f233","question":"微服务如何拆分？边界怎么定？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：微服务如何拆分边界怎么定。","category":"分布式","difficulty":"困难","tags":["DDD"],"answer":{"oral":"微服务拆分可以按业务能力或领域驱动设计，用限界上下文划分边界，保证高内聚低耦合；还要考虑团队边界和数据边界，一个服务尽量独占自己的数据，避免多个服务直接写同一张表；拆分粒度不要过细，避免分布式事务和调用链过长，一次请求跨七八个服务就很难排查；可以渐进式演进，先拆核心链路和变更频繁的模块，再逐步治理。拆分前先想清楚拆分收益，是为了独立部署、独立扩缩容还是团队解耦，别把单体拆成一堆分布式单体，调用链更长、故障点更多。","keyPoints":["按业务能力和限界上下文拆分","保证高内聚低耦合，服务尽量独占数据","考虑团队边界，避免拆得过细","渐进式演进，先拆核心链路"],"followUp":[],"pitfalls":[]}},{"id":"f234","question":"注册中心如何选型？Nacos、Eureka、ZooKeeper 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：注册中心如何选型Nacos、Eureka、ZooKeep。","category":"分布式","difficulty":"中等","tags":["Nacos","Eureka","ZooKeeper","AP","CP"],"answer":{"oral":"注册中心选型看 CAP 和功能。Eureka 是 AP，简单、健康检查靠客户端心跳，适合 Spring Cloud 早期，但 2.x 之后基本停止维护；ZooKeeper 是 CP，临时节点和 watch 机制强，但选举和写性能有限；Nacos 同时支持 AP 和 CP，带配置中心、权重、命名空间，国内用得多。强一致选 ZK 或 Nacos CP，高可用选 Eureka 或 Nacos AP。","keyPoints":["Eureka 是 AP，客户端心跳，简单","ZooKeeper 是 CP，临时节点和 watch","Nacos 支持 AP/CP，还带配置中心","按一致性和功能需求选型"],"followUp":["Nacos 的 AP/CP 怎么选？","Eureka 和 ZooKeeper 有什么区别？"],"pitfalls":["把 Eureka 说成 CP。","忽略注册中心的健康检查机制。"]}},{"id":"f235","question":"配置中心的动态刷新原理？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：配置中心的动态刷新原理。","category":"分布式","difficulty":"困难","tags":["Nacos","Apollo"],"answer":{"oral":"配置中心一般分推和拉。客户端启动时拉全量配置并本地缓存，之后用长轮询监听变更，客户端发起请求后服务端 hold 住一段时间，有配置变更就立刻返回，客户端再拉增量并刷新；也有服务端主动推送的。要支持灰度、版本回滚、本地快照和容灾，Nacos、Apollo 都是这个思路。客户端必须保留本地快照，配置中心挂了也能用最后的配置启动，不能把配置中心变成单点。配置变更要审计、要能一键回滚，敏感配置还要加密和权限控制。","keyPoints":["启动时拉全量并本地缓存","长轮询监听变更，服务端 hold 住请求","变更后拉取增量并刷新本地配置","本地快照保证服务端不可用时可启动"],"followUp":[],"pitfalls":[]}},{"id":"f236","question":"API 网关的作用？Gateway 的工作流程？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：API 网关的作用Gateway 的工作流程。","category":"分布式","difficulty":"中等","tags":["API","Gateway"],"answer":{"oral":"API 网关是统一入口，负责路由转发、鉴权、限流、熔断、灰度、日志和协议转换，屏蔽内部服务。Spring Cloud Gateway 基于 WebFlux 和 Reactor，请求先经过 Gateway HandlerMapping 匹配路由，再走过滤器链，包括全局过滤器和路由过滤器，最后转发到下游服务。它适合做异步非阻塞网关，但过滤器里不要写阻塞逻辑。","keyPoints":["统一入口做路由、鉴权、限流、灰度","Gateway 用 HandlerMapping 匹配路由","过滤器链分全局和路由级","过滤器链执行完后转发到下游"],"followUp":["Gateway 的三大核心概念是什么？","网关和 Nginx 有什么区别？"],"pitfalls":["把网关只当成反向代理。","忽略限流、鉴权和动态路由。"]}},{"id":"f237","question":"OpenFeign、Dubbo、gRPC 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：OpenFeign、Dubbo、gRPC 有什么区别。","category":"分布式","difficulty":"困难","tags":["OpenFeign","Dubbo","gRPC","HTTP","JSON","RPC"],"answer":{"oral":"OpenFeign 是基于 HTTP 和 JSON 的声明式客户端，接口和 Spring MVC 风格一致，生态好但性能和序列化开销一般；Dubbo 是 Java RPC，默认 Dubbo 协议，支持多种序列化、服务治理、负载均衡和集群容错，性能高；gRPC 基于 HTTP/2 和 Protobuf，跨语言、流式支持好，适合多语言和云原生。选型看语言栈、性能和生态，内部 Java 服务常用 Dubbo，对外或多语言用 gRPC。","keyPoints":["Feign 是 HTTP JSON 声明式客户端，生态好","Dubbo 是 Java RPC，性能和服务治理强","gRPC 基于 HTTP/2 和 Protobuf，跨语言且支持流式","按语言栈、性能和生态选型"],"followUp":[],"pitfalls":[]}},{"id":"f238","question":"Dubbo 的 SPI 与 Java SPI 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Dubbo 的 SPI 与 Java SPI 有什么区别。","category":"分布式","difficulty":"困难","tags":["Dubbo","SPI","Wrapper","AOP"],"answer":{"oral":"Java SPI 是 JDK 标准，实现类配置在 META-INF/services，ServiceLoader 一次性加载所有实现，不能按需取，也没有优先级和包装。Dubbo SPI 做了增强：用键值对配置按名称加载单个扩展，支持 @Adaptive 自适应扩展、Wrapper 包装、AOP、依赖注入和优先级排序，扩展性更强。Dubbo 的扩展点几乎都基于这套机制，比如协议、序列化、负载均衡。","keyPoints":["Java SPI 一次加载所有实现，不能按名取","Dubbo SPI 用键值配置按名加载","支持 @Adaptive、Wrapper、AOP 和依赖注入","按名加载让扩展性和可控性更强"],"followUp":[],"pitfalls":[]}},{"id":"f239","question":"Dubbo 的调用流程与集群容错？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Dubbo 的调用流程与集群容错。","category":"分布式","difficulty":"困难","tags":["Dubbo","Proxy","Invoker","Protocol","Exchange","Failover"],"answer":{"oral":"Dubbo 调用从客户端 Proxy 开始，经过 Invoker、Cluster、Directory 和 Router，再做负载均衡，最后通过 Protocol 和 Exchange 发起远程调用；服务端收到后由 Exporter 交给 Invoker 执行。集群容错有 Failover 失败重试其他节点、Failfast 快速失败、Failsafe 失败后忽略、Failback 失败后定时重发等。重试次数和是否幂等要一起考虑，写操作不能随便 Failover。","keyPoints":["客户端 Proxy 经 Invoker、Protocol、Exchange 发起调用","服务端 Exporter 交给 Invoker 执行","集群容错有 Failover、Failfast、Failsafe 等","负载均衡决定选哪个 Invoker"],"followUp":[],"pitfalls":[]}},{"id":"f240","question":"常见的负载均衡算法有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：常见的负载均衡算法有哪些。","category":"分布式","difficulty":"简单","tags":[],"answer":{"oral":"常见算法有轮询、随机、加权轮询、加权随机、最少连接、最短响应时间、一致性哈希、平滑加权轮询。轮询适合机器性能一致；加权适合性能不同；最少连接适合长连接和请求耗时差异大的场景；最短响应时间能自动避开慢节点；一致性哈希适合缓存分片，减少扩缩容数据迁移；平滑加权轮询能让权重大的节点被选中更均匀，不会连续打满。还要考虑健康检查、慢节点摘除、重试和本地优先，四层看连接和 IP，七层才能按 URL、Header 做更细的灰度。","keyPoints":["轮询适合性能一致的机器","加权适合机器性能不一致","最少连接适合长连接和慢请求","一致性哈希适合缓存分片，减少迁移"],"followUp":[],"pitfalls":[]}},{"id":"f241","question":"常见的限流算法有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：常见的限流算法有哪些。","category":"分布式","difficulty":"中等","tags":[],"answer":{"oral":"常见限流算法有固定窗口、滑动窗口、漏桶、令牌桶。固定窗口简单但有临界问题，两个窗口交界可能放过两倍流量；滑动窗口把时间切细，平滑一些；漏桶按固定速率流出，适合保护下游；令牌桶按速率放令牌，允许一定突发，最常用。单机可以用 Guava RateLimiter 或 Sentinel，分布式用 Redis 加 Lua 做集群限流，注意 Redis 本身的高可用。","keyPoints":["固定窗口简单，但有临界突刺","滑动窗口把时间切细，更平滑","漏桶恒定速率流出，保护下游","令牌桶允许突发，最常用"],"followUp":["固定窗口、滑动窗口、漏桶、令牌桶有什么区别？","分布式限流怎么做？"],"pitfalls":["把漏桶和令牌桶说成同一种算法。","忽略限流粒度（接口、用户、IP）。"]}},{"id":"f242","question":"熔断、降级、隔离有什么区别？如何防止服务雪崩？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：熔断、降级、隔离有什么区别如何防止服务雪崩。","category":"分布式","difficulty":"中等","tags":[],"answer":{"oral":"熔断是下游连续失败时直接切断调用，保护系统不被拖垮，常见状态机是关闭、打开、半开；降级是失败时返回兜底数据或默认逻辑；隔离是把不同依赖放到独立线程池或资源池，避免一个慢依赖拖垮所有请求，类似舱壁模式。三者配合超时和重试防止服务雪崩，核心是快速失败、限制资源、保住核心链路。熔断阈值要按错误率和慢调用比例设，不能只看异常数。","keyPoints":["熔断在下游连续失败时快速切断","熔断状态机在关闭、打开、半开之间流转","降级返回兜底数据或默认逻辑","隔离用独立线程池，防止一个依赖拖垮全部"],"followUp":["熔断和降级有什么区别？","熔断器的状态机是怎样的？"],"pitfalls":["把熔断当成限流。","忽略半开状态。"]}},{"id":"f243","question":"超时与重试如何设计？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：超时与重试如何设计。","category":"分布式","difficulty":"困难","tags":[],"answer":{"oral":"重试要先保证接口幂等，否则会重复下单、重复扣款；重试次数要有限，避免放大流量；用指数退避加随机抖动，避免所有请求同时重试造成二次峰值；区分可重试错误和不可重试错误，比如超时、连接失败、5xx 可以重试，参数错误、业务校验失败不重试；还要设置总超时和重试预算，避免调用链越积越长，一次用户请求在链路上被放大成几十次调用。上游超时要比下游总耗时略长，给下游留出重试空间，同时给重试加熔断，失败率高时直接停掉。","keyPoints":["只对幂等接口做重试，避免重复下单扣款","限制次数，指数退避加随机抖动","区分可重试和不可重试错误","设总超时，避免调用链越积越长"],"followUp":["超时和重试怎么配合？","重试风暴怎么防？"],"pitfalls":["无上限重试。","忽略幂等和退避策略。"]}},{"id":"f244","question":"链路追踪如何实现？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：链路追踪如何实现。","category":"分布式","difficulty":"困难","tags":["TraceId","Span","SkyWalking","Micrometer","MDC"],"answer":{"oral":"链路追踪给每个请求生成 TraceId，跨服务传递，每个服务内的操作是一个 Span，记录开始时间、耗时、标签和父子关系；通过 HTTP Header 或 RPC 上下文透传，线程池场景用 TTL 或 MDC 传递；数据上报到 SkyWalking、Zipkin、Jaeger 或 Micrometer Tracing，最后在 UI 里看整条调用链和耗时瓶颈。采样率要可调，避免追踪本身成为负担。","keyPoints":["每个请求生成 TraceId 并跨服务透传","服务内操作记为 Span，记录耗时和父子关系","线程池用 TTL 或 MDC 传递上下文","上报 SkyWalking、Zipkin、Jaeger 展示整条链路"],"followUp":[],"pitfalls":[]}},{"id":"f245","question":"灰度、蓝绿、滚动发布有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：灰度、蓝绿、滚动发布有什么区别。","category":"分布式","difficulty":"简单","tags":["Kubernetes"],"answer":{"oral":"滚动发布是分批替换实例，平滑但新旧版本会短暂共存，要保证接口和数据库变更兼容；蓝绿发布是准备两套环境，流量整体切到新版本，回滚快但资源翻倍；灰度发布是按用户、流量比例逐步放量，风险最小，适合大版本。K8s 里滚动更新是默认，通过 maxSurge 和 maxUnavailable 控制节奏，灰度常用 Ingress、服务网格或网关做流量切分，按 header、用户 id 或比例路由。发布前要准备好回滚、监控和开关，数据库变更要先做兼容的双写或加字段，别只依赖发布策略。","keyPoints":["滚动发布分批替换，新旧版本短暂共存","蓝绿两套环境整体切换，回滚快但资源翻倍","灰度按用户或比例放量，风险最小","K8s 默认滚动，灰度靠网关或服务网格"],"followUp":[],"pitfalls":[]}},{"id":"f246","question":"分布式事务有哪些方案？如何选型？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：分布式事务有哪些方案如何选型。","category":"分布式","difficulty":"困难","tags":["PC","TCC","Saga"],"answer":{"oral":"分布式事务方案有 2PC/3PC、TCC、Saga、本地消息表、事务消息、最大努力通知。强一致、短事务可以用 2PC 或 Seata AT；跨服务、长流程用 TCC 或 Saga；已有 MQ 的场景用事务消息或本地消息表做最终一致；对一致性要求低的通知用最大努力通知加对账。选型看一致性要求、业务时长、侵入性和运维成本。多数互联网业务用最终一致加对账，而不是强一致 2PC。","keyPoints":["强一致短事务用 2PC 或 Seata AT","长流程用 TCC 或 Saga","已有 MQ 用事务消息或本地消息表","弱一致通知用最大努力通知加对账"],"followUp":["分布式事务方案怎么选？","本地消息表和 MQ 事务消息有什么区别？"],"pitfalls":["认为 2PC 性能很好。","忽略最终一致和补偿逻辑。"]}},{"id":"f247","question":"2PC 和 3PC 的流程与问题？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：2PC 和 3PC 的流程与问题。","category":"分布式","difficulty":"困难","tags":["PC"],"answer":{"oral":"2PC 分准备和提交两阶段：协调者先问所有参与者能否提交，参与者执行本地事务但不提交，都同意后协调者再统一发提交指令。问题是同步阻塞，参与者要一直占着资源等；协调者单点，挂了参与者不知道怎么办；提交阶段部分失败会数据不一致。3PC 在准备后加了一个预提交阶段，并引入超时，让参与者能在协调者失联时自行判断，降低了阻塞和单点影响，但实现复杂，也不能完全保证强一致。网络分区下 3PC 仍可能让部分节点提交、部分回滚。","keyPoints":["2PC 分准备和提交，协调者统一裁决","同步阻塞，协调者单点，提交阶段可能不一致","3PC 增加预提交和超时，降低阻塞","3PC 仍不能完全保证强一致"],"followUp":[],"pitfalls":[]}},{"id":"f248","question":"TCC 如何设计？空回滚、幂等、悬挂怎么处理？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：TCC 如何设计空回滚、幂等、悬挂怎么处理。","category":"分布式","difficulty":"困难","tags":["TCC","Try","Confirm","Cancel"],"answer":{"oral":"TCC 是 Try 预留资源、Confirm 确认、Cancel 补偿。Try 要做资源检查和冻结，Confirm 真正扣减，Cancel 释放。要处理空回滚，也就是 Try 没执行却收到 Cancel；幂等，Confirm 和 Cancel 可能重复调用；悬挂，Cancel 先到、Try 后到。通常需要事务日志记录每个阶段的状态，用唯一事务 id 做幂等和防悬挂。","keyPoints":["Try 阶段检查业务并预留资源","Confirm 真正扣减，Cancel 释放","空回滚：Try 没执行却收到 Cancel，要记录判断","还要处理重复调用和悬挂"],"followUp":[],"pitfalls":[]}},{"id":"f249","question":"Saga、本地消息表、最大努力通知分别适合什么场景？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Saga、本地消息表、最大努力通知分别适合什么场景。","category":"分布式","difficulty":"简单","tags":["Saga"],"answer":{"oral":"Saga 是把长事务拆成一串本地事务，每个都有正向操作和补偿操作，失败时反向补偿，适合长流程、最终一致；本地消息表是业务和消息在同一个本地事务里写库，再由定时任务投递消息，适合已有数据库、没有事务消息的场景；最大努力通知是尽量通知对方，失败就重试加对账，适合对一致性要求较低的通知类业务。Saga 要注意补偿的幂等和不可逆操作。","keyPoints":["Saga 把长事务拆成多个本地事务，失败反向补偿","本地消息表让业务和消息同库同事务","最大努力通知靠重试加对账","都走最终一致，适合跨服务长流程"],"followUp":[],"pitfalls":[]}},{"id":"f250","question":"Seata AT 模式的原理是什么？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Seata AT 模式的原理是什么。","category":"分布式","difficulty":"困难","tags":["Seata","AT","undo","log"],"answer":{"oral":"Seata AT 模式是自动事务，分两个阶段。一阶段执行业务 SQL，同时记录 undo_log 和全局锁；二阶段如果成功就提交，删除 undo_log，如果失败就用 undo_log 回滚。全局锁保证不同事务不会脏写同一行，undo_log 保证回滚。它对业务侵入小，但依赖数据源代理和全局锁，性能有开销。读隔离默认是读未提交，需要配合 @GlobalTransactional 和锁配置。","keyPoints":["一阶段执行 SQL 并记录 undo_log 和全局锁","二阶段成功删日志，失败用 undo_log 回滚","全局锁防止不同事务脏写同一行","对业务侵入小，但有全局锁开销"],"followUp":[],"pitfalls":[]}},{"id":"f251","question":"分布式锁有哪些实现？如何选型？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：分布式锁有哪些实现如何选型。","category":"分布式","difficulty":"中等","tags":["Redis","Redisson","ZooKeeper"],"answer":{"oral":"常见实现有 Redis 的 SET NX EX 加 Lua 解锁，性能高，但主从切换可能丢锁；ZooKeeper 用临时顺序节点，强一致、能监听，但性能低；数据库用唯一索引或 select for update，简单但并发差。选型看一致性、性能、是否需要可重入和自动续期。强一致选 ZK，高性能选 Redisson，简单场景用数据库。RedLock 争议主要在时钟和网络分区下的安全性。","keyPoints":["Redis SET NX EX 性能高，主从切换可能丢锁","ZooKeeper 临时顺序节点强一致","数据库唯一索引简单但并发差","按一致性、性能和可重入需求选"],"followUp":["Redis、ZooKeeper、数据库分布式锁怎么选？","锁超时和续期怎么处理？"],"pitfalls":["认为 SETNX 一定安全。","忽略锁误删。"]}},{"id":"f252","question":"接口幂等如何设计？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：接口幂等如何设计。","category":"分布式","difficulty":"中等","tags":["Token"],"answer":{"oral":"幂等设计常见有：用 Token，先申请一次性令牌，提交时校验并删除，适合表单防重复提交；用业务唯一索引，重复插入失败，这是最可靠的兜底；用状态机，只有合法状态才能流转，比如订单只能从待支付到已支付；用分布式锁串行化同一业务 key；用去重表记录请求 id 和处理结果。还要考虑失败重试、并发重复请求和消息重复消费，保证重复执行结果一致。幂等键要覆盖业务唯一性，不能只用请求 id，同一个用户同一笔业务不管重试几次都应该命中同一条记录。","keyPoints":["Token 一次性校验后立即作废","业务唯一索引防重复插入","状态机限制非法状态流转","分布式锁加去重表做兜底"],"followUp":[],"pitfalls":[]}},{"id":"f253","question":"分布式 ID 有哪些方案？雪花时钟回拨怎么办？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：分布式 ID 有哪些方案雪花时钟回拨怎么办。","category":"分布式","difficulty":"中等","tags":["ID","UUID","Leaf"],"answer":{"oral":"分布式 ID 方案有 UUID、数据库自增、号段模式、Redis INCR、雪花算法、Leaf。UUID 简单但无序；自增和号段依赖数据库；雪花是时间戳加机器 id 加序列号，趋势递增、性能高，但依赖时钟。时钟回拨可以检测后等待、用备用机器 id、或者用 Leaf 的号段模式兜底。雪花要解决机器 id 分配和时钟同步，容器化环境尤其要注意。","keyPoints":["UUID 生成简单但完全无序","数据库自增和号段依赖 DB","雪花是时间戳加机器号加序列，趋势递增","时钟回拨要检测等待或换机器号"],"followUp":["雪花算法的结构是怎样的？","时钟回拨怎么解决？"],"pitfalls":["认为 UUID 是有序的。","忽略 workerId 分配和回收。"]}},{"id":"f254","question":"分布式 Session 怎么做？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：分布式 Session 怎么做。","category":"分布式","difficulty":"简单","tags":["Session","JWT","Spring"],"answer":{"oral":"分布式 Session 有几种做法：粘性会话，把同一用户固定到同一台机器，简单但扩容和故障转移差；集中存储，把 Session 放 Redis 或数据库，应用无状态；JWT 把用户信息放令牌里，服务端不存，但注销和续期麻烦；Spring Session 就是集中存储的封装。现在更常用 Redis 加 Token，JWT 适合无状态网关，但要处理好注销和密钥轮换。","keyPoints":["粘性会话简单但故障转移差","Redis 集中存储让应用无状态","JWT 服务端不存，但注销和续期麻烦","Spring Session 封装了集中存储"],"followUp":[],"pitfalls":[]}},{"id":"f255","question":"分库分表怎么做？会带来哪些问题？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：分库分表怎么做会带来哪些问题。","category":"分布式","difficulty":"困难","tags":["JOIN"],"answer":{"oral":"分库分表分垂直和水平。垂直是按业务或字段拆，把大表拆小、冷热字段分离；水平是按数据行拆，按分片键路由到不同库表。会带来跨库 JOIN、分布式事务、全局 ID、深分页、扩容迁移等问题。解决靠冗余字段、宽表、ES、应用层组装、分布式事务框架、基因法或一致性哈希扩容，尽量让分片键覆盖高频查询，让 90% 的查询能落到单分片。分片键选错会导致热点和跨分片查询，返工成本很高，所以要先看清业务查询模式，必要时用双写或数据同步做过渡。","keyPoints":["垂直按业务或字段拆，水平按行拆","分片键决定路由，要覆盖高频查询","会带来跨库 JOIN、事务、全局 ID、深分页","扩容可用一致性哈希或基因法"],"followUp":[],"pitfalls":[]}},{"id":"f256","question":"高并发系统如何设计？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：高并发系统如何设计。","category":"分布式","difficulty":"困难","tags":[],"answer":{"oral":"高并发设计先做容量评估，算清单机 QPS 和 RT，再从接入层到数据层逐层优化：接入层做负载均衡和限流；应用层无状态、水平扩容、异步化；缓存层用多级缓存、热点隔离；数据层读写分离、分库分表、索引优化；再加消息队列削峰、降级熔断、监控告警和压测。核心是识别瓶颈，先找到最先打满的资源，不要盲目堆机器。缓存和异步会带来一致性复杂度，要提前设计失效、补偿和对账，限流阈值也要按压测结果动态调。","keyPoints":["先做容量评估，识别瓶颈","接入层做负载均衡和限流","应用层无状态、异步化、多级缓存","数据层读写分离、分库分表，配合降级熔断"],"followUp":[],"pitfalls":[]}},{"id":"f257","question":"秒杀系统如何设计？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「分布式」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：秒杀系统如何设计。","category":"分布式","difficulty":"困难","tags":[],"answer":{"oral":"秒杀系统核心是限流、削峰、异步和防超卖。活动前预热库存到 Redis，入口做验证码、限流、黑名单防刷；库存扣减用 Redis Lua 原子操作或分段库存，扣减成功后发消息异步创建订单；数据库用唯一索引和乐观锁防重复；前端按钮置灰、令牌防重；最后做好降级、兜底和对账。库存扣减和订单创建之间要有补偿，避免扣了库存没下单。","keyPoints":["活动前把库存预热到 Redis","入口做限流、防刷、验证码","Redis Lua 原子扣减，异步创建订单","数据库唯一索引和乐观锁防超卖，并做好对账"],"followUp":["秒杀如何防超卖？","库存扣减怎么保证原子性？"],"pitfalls":["只用数据库行锁扛全部流量。","忽略缓存预热和限流削峰。"]}},{"id":"f258","question":"如何做容量评估与压测？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":66,"frequencyReason":"「分布式」了解题，偏细节或低频，时间有限时可后置。考点：如何做容量评估与压测。","category":"分布式","difficulty":"困难","tags":["QPS","RT"],"answer":{"oral":"容量评估先根据业务目标估算 QPS、峰值倍数、RT 和数据量，再折算成机器数、连接数、线程数和缓存容量。压测要构造真实模型，包括读写比例、热点分布、下游依赖，逐步加压找到拐点；全链路压测要隔离数据、打标流量；压测后看 CPU、内存、GC、RT、错误率和瓶颈点，再扩容或优化。压测环境要尽量接近生产，否则数字没有参考价值。","keyPoints":["按 QPS、峰值倍数、RT 估算资源","压测模型要贴近真实读写比例和热点","逐步加压找到吞吐和延迟拐点","全链路压测要隔离数据并打标流量"],"followUp":[],"pitfalls":[]}},{"id":"f259","question":"分布式任务调度如何实现？XXL-JOB 的原理？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「分布式」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：分布式任务调度如何实现XXL-JOB 的原理。","category":"分布式","difficulty":"简单","tags":["XXL-JOB"],"answer":{"oral":"分布式任务调度可以用 XXL-JOB：调度中心负责 cron 和任务管理，执行器注册到调度中心，调度中心按策略下发任务，执行器执行并回调结果；支持分片广播、失败重试、告警和日志。也可以基于 Quartz 加数据库锁，或 K8s CronJob，但大规模任务治理 XXL-JOB 更完整。要注意调度中心高可用、任务幂等和重复触发。","keyPoints":["调度中心管理 cron 和任务","执行器注册到调度中心并接收任务","分片广播把任务分到多台执行器","失败重试、告警和日志由调度中心统一治理"],"followUp":[],"pitfalls":[]}},{"id":"f260","question":"Service Mesh 是什么？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":68,"frequencyReason":"「分布式」了解题，偏细节或低频，时间有限时可后置。考点：Service Mesh 是什么。","category":"分布式","difficulty":"困难","tags":["Service","Mesh","Istio","Sidecar","Kubernetes"],"answer":{"oral":"Service Mesh 是服务网格，把服务治理能力从业务代码里下沉到基础设施。每个服务旁边跑一个 Sidecar 代理，比如 Istio 的 Envoy，流量经过 Sidecar 做路由、负载均衡、熔断、限流、遥测和安全策略；控制面负责配置下发。它和 K8s 配合，适合多语言、大规模微服务的统一治理。代价是运维复杂、延迟增加，小规模系统不一定需要。","keyPoints":["治理能力下沉到 Sidecar 代理","Sidecar 负责路由、限流、熔断、遥测","控制面统一下发治理配置","适合多语言大规模微服务，与 K8s 配合"],"followUp":[],"pitfalls":[]}},{"id":"f261","question":"什么是 RAG？为什么需要 RAG？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「RAG」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是 RAG为什么需要 RAG。","category":"RAG","difficulty":"简单","tags":["LLM"],"answer":{"oral":"RAG 就是检索增强生成：用户提问后先去知识库里检索相关片段，把片段拼进 Prompt，让大模型基于这些资料回答。之所以需要，是因为模型参数里的知识在训练时就冻结了，既有盲区，又会一本正经地胡说；企业私有数据它没见过，新知识也没法及时更新，而重新训练或微调的周期和成本都很高。RAG 相当于给模型外挂一个随时可更新的知识库，改知识只要改文档和索引，还能给出引用来源、方便审计。它解决的是“知不知道”，不改变模型的表达风格和能力边界，所以该微调的地方还是得微调。","keyPoints":["先检索相关片段，再拼进 Prompt 让模型基于资料回答","解决模型知识冻结、私有数据缺失和时效性差","外挂知识库，更新成本远低于重新训练","能输出引用来源，降低幻觉"],"followUp":["RAG 和微调怎么选？","RAG 的常见失败点有哪些？"],"pitfalls":["认为 RAG 能解决所有知识问题。","忽略检索质量决定生成上限。"]}},{"id":"f262","question":"RAG 的完整流程是什么？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「RAG」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：RAG 的完整流程是什么。","category":"RAG","difficulty":"简单","tags":["Chunking","Embedding","Query","Prompt","LLM"],"answer":{"oral":"分离开线和在线两条链路。离线阶段把 PDF、Word、网页、数据库导出内容解析成纯文本，做清洗去噪，再切成 chunk，用 Embedding 模型转成向量，连同原文、来源、页码、权限等元数据写进向量库，同时建好 ANN 索引。在线阶段 query 进来先做改写或扩展，然后向量化，走向量检索加关键字检索召回 Top-K，用 Rerank 精排，取最相关的几段按 token 预算拼成 Prompt，最后交给 LLM 生成答案，并带上引用来源。两条链路都要能增量更新，文档变了只重建对应 chunk，删文档时同步删向量，否则会出现引用了已下线内容的尴尬情况。","keyPoints":["离线：解析、清洗、分块、向量化、入库","在线：Query 改写、向量检索、Rerank","组装 Prompt 时控制上下文长度和顺序","生成答案并附引用，形成完整闭环"],"followUp":["离线索引和在线检索分别做什么？","Rerank 放在流程的哪一步？"],"pitfalls":["把 chunk 和 embedding 的顺序说反。","忽略元数据和引用来源。"]}},{"id":"f263","question":"为什么 RAG 要用向量数据库？其他数据库不行吗？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：为什么 RAG 要用向量数据库其他数据库不行吗。","category":"RAG","difficulty":"简单","tags":[],"answer":{"oral":"关系型数据库擅长精确匹配，比如按 id 查、按条件过滤，走 B-tree 索引很快，但它没有语义概念，理解不了“怎么退款”和“退款流程是什么”是同一个意思，like 模糊匹配也只是字符层面。向量库存的是高维向量，用余弦相似度或内积做近似最近邻检索，能把语义相近的内容召回出来，这是语义级匹配。而且它专门为海量向量建了 HNSW、IVF 这类索引，上千万条也能毫秒级返回，关系库做全表扫描根本不现实。另外向量库一般还带元数据过滤、多租户、增量写入和混合检索。数据量不大时用 PostgreSQL 的 pgvector 挂在业务库上也够，真到亿级再上专用向量库。","keyPoints":["关系库只能精确匹配，理解不了同义表达","向量库用余弦或内积做语义相似检索","ANN 索引让海量向量毫秒级返回","还支持元数据过滤和增量更新"],"followUp":[],"pitfalls":[]}},{"id":"f264","question":"Embedding 是什么？1536 维是什么意思？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Embedding 是什么1536 维是什么意思。","category":"RAG","difficulty":"简单","tags":["Embedding","text-embedding-ada-002"],"answer":{"oral":"Embedding 就是把文本、图片这类非结构化数据映射成一串数字，也就是高维稠密向量，语义相近的内容在向量空间里距离也近，所以可以用余弦相似度衡量。1536 维指的是向量长度，OpenAI 的 text-embedding-ada-002 就是 1536 维，新的 text-embedding-3 系列还支持按需缩短维度。维度越高表达的信息越丰富、区分度越细，但存储和计算成本也越高，一亿条 1536 维 float 就要几百 G；维度太低又会丢语义，所以是个取舍。实践里要注意同一知识库必须用同一个模型、同一套归一化方式，不同模型产出的向量不能混用，换模型必须全量重建索引，否则相似度分数完全不可比。","keyPoints":["把文本映射成高维稠密向量","语义相近的向量在空间里距离更近","1536 维是向量长度，维度影响表达力和成本","不同模型的向量空间不兼容，换模型要重建索引"],"followUp":[],"pitfalls":[]}},{"id":"f265","question":"你是怎么分块的？块大小怎么选？固定大小分块有什么问题？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「RAG」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：你是怎么分块的块大小怎么选固定大小分块有什么问题。","category":"RAG","difficulty":"中等","tags":[],"answer":{"oral":"我一般按文档结构来分，优先按段落、标题、标点切，块与块之间留百分之十到二十的重叠，避免一句话或一个结论被切断。块大小要权衡：太大语义完整但噪音多，检索精度下降、还费 token，也容易挤占模型上下文；太小召回准但上下文不够，模型容易断章取义。中文一般三百到八百字，再按文档类型调，FAQ 按问答对切，代码按函数切，表格单独处理并保留表头。固定大小分块的问题就是机械按字符数切，会把句子、表格、代码拦腰截断，语义不完整，检索出来也没法用；滑动窗口能缓解边界问题，但重叠太多会引入重复内容，反而降低信噪比。","keyPoints":["优先按段落、标题、标点切，保留语义边界","块之间加重叠，避免切断上下文","块太大噪音多，太小上下文不足","固定大小分块会切断句子、表格和代码"],"followUp":["chunk 大小怎么定？","块之间为什么要留重叠？"],"pitfalls":["认为块越大越好。","忽略表格、代码等特殊内容的切分。"]}},{"id":"f266","question":"RAG、微调、提示工程有什么区别？什么时候用哪个？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：RAG、微调、提示工程有什么区别什么时候用哪个。","category":"RAG","difficulty":"简单","tags":["Prompt"],"answer":{"oral":"提示工程最轻，改改 Prompt 就能快速验证、约束输出格式，适合冷启动和调格式，成本几乎为零。RAG 解决的是“知不知道”，把动态的、私有的、有时效性的知识外挂进来，改知识不用重训模型，还能给引用、可追溯。微调解决的是“像不像、会不会”，比如固定说话风格、特定输出格式、领域里的深层逻辑和术语习惯，它把知识写进权重，更新慢、成本高，也容易过拟合。实践中通常 Prompt 打底、RAG 补事实、微调调风格，三者叠加而不是二选一。判断标准很简单：知识经常变就用 RAG，行为模式要固定才考虑微调。","keyPoints":["Prompt 最轻，适合快速验证和约束格式","RAG 补动态私有事实，改知识不用重训","微调改风格、格式和领域深层逻辑","通常 Prompt 打底、RAG 补事实、微调调风格"],"followUp":[],"pitfalls":[]}},{"id":"f267","question":"混合检索是什么？为什么要用混合检索而不是纯向量检索？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「RAG」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：混合检索是什么为什么要用混合检索而不是纯向量检索。","category":"RAG","difficulty":"困难","tags":["BM25","SKU"],"answer":{"oral":"混合检索就是向量检索加关键字检索一起用。向量擅长语义泛化，用户换个说法也能召回，但遇到 SKU 编码、产品型号、人名、错误码这种专有名词，容易把长得很像但不是一个东西的召回上来；BM25 这种倒排索引对精确词命中很准，但不懂同义改写，换个说法就召不回。所以两路各取 Top-K，用 RRF 做排名融合，公式是每个文档累加 1/(k+排名)，k 一般取 60，只看名次不看分数量纲；也可以用加权分数融合，但得先把两路分数归一化到同一区间。融合后再统一 Rerank，既保住语义召回，又保住精确匹配，工程上比纯向量稳很多。","keyPoints":["向量召回语义相近的内容","BM25 保证专有名词和编号精确命中","两路结果用 RRF 或加权融合","再统一 Rerank，兼顾语义和精确"],"followUp":["混合检索怎么融合分数？","BM25 适合什么场景？"],"pitfalls":["只做向量检索，忽略精确词匹配。","忽略专有名词和错误码场景。"]}},{"id":"f268","question":"什么是重排序（Rerank）？为什么检索后还要重排序？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「RAG」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是重排序（Rerank）为什么检索后还要重排序。","category":"RAG","difficulty":"困难","tags":["Rerank","Top-K","Cross-Encoder"],"answer":{"oral":"向量检索是双塔结构，query 和文档分别编码再算相似度，文档向量可以离线算好，所以快，但 query 和文档之间没有交互，精度有限，Top-K 里经常混进不相关的结果。Rerank 就是把召回的 Top 20、50 拿出来，用 Cross-Encoder 把 query 和文档拼成一条输入过一遍模型，让模型逐字做交互，输出精细的相关性分数，再取前几条。代价是慢，每个候选都要一次前向，不能对全库做，所以是粗排召回加精排重排的两阶段，还要控制候选数和超时，超时就退回原排序。实际对 Top-3 准确率提升很明显，是性价比很高的一步。","keyPoints":["向量双塔召回快但精度有限","Cross-Encoder 把 query 和文档一起编码打分","只对 Top-K 精排，控制延迟","能显著提升 Top-3 准确率"],"followUp":["Rerank 为什么不能对全库做？","Cross-Encoder 和双塔模型有什么区别？"],"pitfalls":["把 Rerank 当成召回阶段。","忽略延迟和成本。"]}},{"id":"f269","question":"递归分块和语义分块有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：递归分块和语义分块有什么区别。","category":"RAG","difficulty":"困难","tags":[],"answer":{"oral":"递归分块是先按段落切，段落还超长就按句号、换行、空格一层层往下切，直到满足块大小，它靠的是文档的天然结构，简单、快、结果稳定。语义分块是先把文本拆成句子，算相邻句子的向量相似度，在相似度骤降的地方断开，也就是语义突变处切分，这样每块主题更聚焦，跨段落的同一主题不会被硬切。代价是要额外调 Embedding、计算量大，阈值也不好定，常见做法是取相似度分布的分位数做动态阈值。我一般先用递归分块打底，重点文档再上语义分块，不会一上来就全量语义分块。","keyPoints":["递归分块按分隔符层层切，依赖文档结构","语义分块按相邻句子相似度在突变处断开","递归快、成本低，语义分块主题更聚焦","语义分块要额外向量计算，阈值不好定"],"followUp":[],"pitfalls":[]}},{"id":"f270","question":"RAG 系统常见的失败模式有哪些？检索质量差怎么排查优化？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「RAG」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：RAG 系统常见的失败模式有哪些检索质量差怎么排查优化。","category":"RAG","difficulty":"困难","tags":["Query","Chunk","Rerank","Embedding"],"answer":{"oral":"常见失败模式有几类：该召回的没召回，多半是 Embedding 或分块的问题，比如术语被切碎、同义表达没覆盖；召回了但排在很后面，是排序不行，需要 Rerank；Top-K 里塞了太多冗余甚至互相冲突的内容，模型反而被带偏，也容易丢掉中间位置的信息；还有文档本身解析错了、表格串行、OCR 乱码。排查我会先把 query 和命中的 chunk 连分数一起打出来人工看，先判断是召回问题还是排序问题。优化手段就是 Query 改写、调整分块策略、加混合检索和 Rerank、换更强的 Embedding、补元数据过滤，最后再检查 Prompt 有没有把上下文用好，比如要求先引用再回答。","keyPoints":["没召回：Embedding 或分块与 query 不匹配","排序靠后：需要加 Rerank","上下文冗余冲突：控制 Top-K 并去重","解析错误：先修文档解析和清洗"],"followUp":["召回失败怎么排查？","Prompt 怎么约束模型只用上下文？"],"pitfalls":["只调 Prompt，不检查检索结果。","忽略文档解析错误。"]}},{"id":"f271","question":"什么是查询改写（Query Rewriting）？它如何提升检索效果？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是查询改写（Query Rewriting）它如何提。","category":"RAG","difficulty":"困难","tags":["Query","Rewriting","Multi-Query"],"answer":{"oral":"用户的问题往往很口语、很模糊，甚至带指代，比如“这个怎么弄”，直接拿去检索基本废。Query 改写就是让 LLM 把它重写成适合检索的专业描述，补齐上下文指代，把口语词换成领域术语，也可以扩展成多个不同角度的子查询做 Multi-Query，每一路召回再合并去重，能明显提升召回率，尤其是多轮对话和短 query 的场景。还有 Step-back 这种先问更抽象的上层问题再检索的思路。不过改写本身多一次模型调用，要控制延迟，简单场景可以用规则、同义词表或小模型，并且改写结果最好保留原始 query 一起检索，防止改写跑偏。","keyPoints":["把口语化、带指代的问题改写成检索友好描述","Multi-Query 从多个角度扩展召回","多轮对话要补全上下文指代","多一次模型调用，要控制延迟"],"followUp":[],"pitfalls":[]}},{"id":"f272","question":"RAG 中的幻觉问题怎么处理？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「RAG」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：RAG 中的幻觉问题怎么处理。","category":"RAG","difficulty":"困难","tags":["Prompt","Citation"],"answer":{"oral":"RAG 里的幻觉大多不是模型瞎编，而是检索没给对资料，或者资料里有冲突。所以第一是保证检索质量，chunk 要准、要相关，宁缺毋滥；第二是在 Prompt 里强约束，明确只能依据给定文档回答，文档里没有就说不知道，不许自己发挥，并给出“不知道”的示例；第三是要求输出引用，标清楚每句话来自哪个片段，方便核对；第四是设阈值，相关性分数太低就拒答或转人工。再加一层输出校验，检查答案里的关键实体、数字在不在上下文里。上线后把拒答率和引用命中率做成指标持续看，别只看用户满意度。","keyPoints":["先保证检索准确，别给错资料","Prompt 限定只能依据文档回答","要求引用来源，便于人工核对","相关性过低时拒答或转人工"],"followUp":["怎么让模型在资料不足时拒答？","引用和答案校验怎么做？"],"pitfalls":["只靠“不要幻觉”的提示词。","忽略检索质量。"]}},{"id":"f273","question":"常用向量数据库怎么选型？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：常用向量数据库怎么选型。","category":"RAG","difficulty":"困难","tags":["Milvus","Pinecone","Qdrant","Chroma"],"answer":{"oral":"选型主要看数据规模、部署方式、功能和团队运维能力。Milvus 是开源，功能全、支持分布式和海量数据，适合自建大规模场景，但依赖组件多、部署运维偏重；Pinecone 是托管服务，开箱即用、免运维，适合快速上线，但按量付费、数据在云上；Qdrant 轻量、Rust 实现、过滤和混合检索做得好，中小规模很合适；Chroma 更适合本地开发和原型；Weaviate 内置向量化和混合检索模块；数据量不大又不想多维护一套系统，PostgreSQL 的 pgvector 最省事。还要看元数据过滤、混合检索、多租户、增量更新和权限控制的支持程度。","keyPoints":["Milvus 适合自建大规模，运维偏重","Pinecone 托管免运维，按量付费","Qdrant 轻量，过滤和混合检索强","Chroma 适合本地原型和开发"],"followUp":[],"pitfalls":[]}},{"id":"f274","question":"什么是假设性文档嵌入（HyDE）？它的工作原理是什么？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是假设性文档嵌入（HyDE）它的工作原理是什么。","category":"RAG","difficulty":"困难","tags":["HyDE","LLM","Query"],"answer":{"oral":"HyDE 是假设性文档嵌入，出自 2022 年那篇 Precise Zero-Shot Dense Retrieval 的论文。用户的 query 通常很短，知识库里的文档很长，两者在向量空间里的分布本来就不匹配，直接检索效果一般。HyDE 的做法是先让 LLM 根据 query 生成一段假设性的答案，这段答案的写法、长度更接近真实文档，再用它去向量化检索。虽然假设答案内容可能是错的，但语义方向和用词更贴近文档，召回通常更准，而且不需要标注数据。代价是多一次生成调用，延迟和成本会上升，对精确事实查找类问题也可能引入偏差，所以一般只在召回差时作为可选项，并保留原 query 的检索结果做融合。","keyPoints":["先让模型生成一段假设答案","用假设答案的向量去检索真实文档","解决短 query 和长文档分布不匹配","多一次生成，延迟和成本上升"],"followUp":[],"pitfalls":[]}},{"id":"f275","question":"如何评估 RAG 系统的效果？常用评估指标有哪些？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「RAG」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：如何评估 RAG 系统的效果常用评估指标有哪些。","category":"RAG","difficulty":"困难","tags":["Recall","MRR","Faithfulness","Answer","Relevance"],"answer":{"oral":"要分检索和生成两段评估。检索侧看 Recall@K，该命中的文档有没有进 Top-K；看 MRR，第一个正确结果排在第几位；看 Context Precision 和 Context Recall，召回的内容里有多少真正有用、该有的有没有都召回来。生成侧看 Faithfulness，答案是不是都能从上下文找到依据，这是防幻觉的核心；看 Answer Relevance，有没有正面回应问题；有条件再看 Answer Correctness，和标准答案比。工程上常用 RAGAS 这类框架用 LLM 做裁判自动打分，但 LLM 裁判本身有偏差，所以要同时保留人工标注的测试集做回归，按业务场景挑两三个核心指标，别只追一个总分。","keyPoints":["检索看 Recall@K 和 MRR","生成看 Faithfulness 和 Answer Relevance","RAGAS 用 LLM 裁判自动打分","保留人工标注集做版本回归"],"followUp":["Recall@K 和 MRR 怎么计算？","Faithfulness 怎么评估？"],"pitfalls":["只看最终答案，不看检索指标。","忽略人工标注测试集。"]}},{"id":"f276","question":"什么是 Self-RAG？它如何通过自我反思提升回答质量？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是 Self-RAG它如何通过自我反思提升回答质量。","category":"RAG","difficulty":"困难","tags":["Self-RAG","Reflection","Tokens"],"answer":{"oral":"Self-RAG 的核心是让模型自己判断什么时候需要检索、检索回来的东西有没有用、自己的回答有没有依据。训练时它学会生成反思标记，主要四类：要不要检索、这段证据相关不相关、证据能不能支撑答案、答案整体有没有用；推理时先输出判断，需要检索才去查，拿到文档后再判断内容能不能支撑答案，最后逐句校验生成内容是否有文档支持。好处是按需检索、减少无关上下文、回答更可信，而且可以按需调节保守程度。代价是要有标注数据训练一个会输出反思标记的模型，工程复杂度比普通 RAG 高，也可以用一个独立的 critic 模型近似实现。","keyPoints":["模型生成反思标记，判断要不要检索","检索后评估证据是否相关、能否支撑","生成后校验每句话是否有文档依据","按需检索，减少无关上下文"],"followUp":[],"pitfalls":[]}},{"id":"f277","question":"RAG 的文档解析与数据清洗怎么做？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：RAG 的文档解析与数据清洗怎么做。","category":"RAG","difficulty":"困难","tags":["PDF","Word","HTML","OCR"],"answer":{"oral":"解析是 RAG 的地基，这步做不好后面全白搭。PDF 要处理多栏、页眉页脚、表格和扫描件，扫描件得上 OCR，表格最好还原成结构化文本或 markdown，别让单元格串行；HTML 要去掉导航、广告这些噪音；Word、PPT 要保留标题层级。清洗阶段做去重、去乱码、统一编码，处理掉模板化的重复段落。还要给每块打元数据，比如来源、页码、更新时间、权限标签，方便过滤和引用，权限标签尤其重要，检索时必须按用户身份过滤，不能让没权限的人搜到。最后是增量更新，用文档 hash 或版本号识别变化，只重建对应 chunk，删除的文档要同步删向量。","keyPoints":["PDF 处理多栏、页眉页脚、表格和扫描件","扫描件用 OCR，表格还原成结构化文本","清洗去噪、去重、统一编码","打元数据和权限标签，支持增量更新"],"followUp":[],"pitfalls":[]}},{"id":"f278","question":"向量索引有哪些？HNSW、IVF、PQ 如何选择？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：向量索引有哪些HNSW、IVF、PQ 如何选择。","category":"RAG","difficulty":"困难","tags":["HNSW","IVF","PQ","Flat"],"answer":{"oral":"Flat 是暴力精确检索，召回百分百但慢，只适合小数据量或做基准。IVF 是先用 k-means 聚类分桶，查询时只搜最近的几个簇，nlist 是簇数、nprobe 是查几个簇，速度快但可能漏，nprobe 越大召回越高也越慢。PQ 是乘积量化，把向量切段、每段用码本压缩成短码，大幅省内存，但有精度损失，常和 IVF 组合成 IVF-PQ，适合亿级数据。HNSW 是分层可导航小世界图，查询快、召回高、增量插入友好，目前最常用，参数上 M 控制每个节点的连边数、ef_construction 控制建图质量、ef_search 控制查询时的候选队列，调大提召回也提延迟，缺点是吃内存、构建慢。通常中小规模用 HNSW，超大规模内存扛不住再考虑 IVF-PQ，距离度量要和 Embedding 模型匹配，归一化后内积等价于余弦。","keyPoints":["Flat 精确但慢，适合小数据做基准","IVF 聚类后只搜部分簇，nprobe 调召回","PQ 压缩向量省内存，但有精度损失","HNSW 召回高、查询快，最常用但吃内存"],"followUp":[],"pitfalls":[]}},{"id":"f279","question":"什么是 GraphRAG？和普通 RAG 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"了解","frequency":"低频","frequencyScore":67,"frequencyReason":"「RAG」了解题，偏细节或低频，时间有限时可后置。考点：什么是 GraphRAG和普通 RAG 有什么区别。","category":"RAG","difficulty":"困难","tags":["GraphRAG"],"answer":{"oral":"GraphRAG 是微软提出的一种方案，先让 LLM 从文档里抽实体和关系，建一张知识图谱，再对图做社区划分，常用 Leiden 算法，给每个社区生成摘要。检索时有两种模式：局部搜索顺着实体关系做多跳扩展，找具体事实；全局搜索用社区摘要回答“这批文档整体讲了什么”这种全局性问题。普通 RAG 是按 chunk 做相似度召回，擅长局部事实，但回答不了跨文档的多跳和归纳问题。代价是构建成本高，抽取阶段要大量 LLM 调用，更新也麻烦，实体抽取还会出错，适合文档量相对稳定、关系密集的场景，比如企业知识库、法律和医疗，不是所有 RAG 都该上 GraphRAG。","keyPoints":["抽取实体关系建知识图谱","社区摘要支持全局性归纳问题","在图上多跳游走支持多跳推理","构建和更新成本高，适合关系密集文档"],"followUp":[],"pitfalls":[]}},{"id":"f280","question":"什么是 Agentic RAG？和传统 RAG 有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「RAG」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是 Agentic RAG和传统 RAG 有什么区别。","category":"RAG","difficulty":"困难","tags":["Agentic","Agent","Query"],"answer":{"oral":"传统 RAG 是固定流程，一次检索一次生成，不管查没查到都往下走。Agentic RAG 把检索交给 Agent 决策：先判断这个问题要不要查、查什么，可以拆成多个子问题分别检索，查完发现信息不够就换个 query 再查，还能调其他工具，比如数据库、搜索引擎、计算器，甚至把结果交叉验证。最后校验答案站不站得住，不行就重来。本质是把 RAG 从一条直线变成带循环和反思的智能流程，效果更好但延迟和成本更高，所以一定要设最大轮数、总超时和 token 预算，并保留一条不循环的快速路径做兜底。","keyPoints":["Agent 自主判断是否检索、检索什么","可拆成子问题做多轮检索","信息不足时改写 query 再查","结合工具调用和反思校验答案"],"followUp":[],"pitfalls":[]}},{"id":"f281","question":"什么是 Agent？与大模型有什么本质不同？核心架构由哪些组件构成？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「Agent 开发」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：什么是 Agent与大模型有什么本质不同核心架构由哪些组。","category":"Agent 开发","difficulty":"简单","tags":["Agent","LLM","Memory","Planning","Tools","Profile"],"answer":{"oral":"Agent 可以理解成能自己感知、决策、行动的智能体，跟单纯大模型最大的区别是它有目标、能调工具、能根据执行结果调整下一步，而不是被动地一问一答。核心架构一般是四块：LLM 当大脑负责理解和推理；Memory 存短期对话和长期知识；Planning 负责任务拆解和步骤规划；Tools 是对外的手脚，比如搜索、数据库、API。也有按 Profile 角色设定、Memory、Planning、Action 划分的，本质一样。要强调的是 Agent 一定要有终止条件，不然很容易在工具调用里绕圈，实际落地还得配可观测和人工兜底，不能让它无人值守地跑高风险操作。","keyPoints":["LLM 负责理解推理，是大脑","Memory 存短期对话和长期知识","Planning 拆解任务，Tools 执行动作","与模型的区别是能自主决策并闭环执行"],"followUp":["Agent 和 Workflow 有什么区别？","Agent 的四大核心组件是什么？"],"pitfalls":["把 Agent 当成更长的 Prompt。","忽略工具调用和记忆。"]}},{"id":"f282","question":"Workflow、Agent、Tools 的概念和区别是什么？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Agent 开发」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Workflow、Agent、Tools 的概念和区别是。","category":"Agent 开发","difficulty":"简单","tags":["Workflow","Agent","Tools","API","LLM"],"answer":{"oral":"Tools 是最底层的能力，就是一个具体的函数或 API，比如查天气、查订单。Workflow 是人提前把执行路径编排好，A 完了走 B，条件分支也写死，LLM 只在某些节点做判断，可控、稳定、便宜、好测试。Agent 则是把控制流交给 LLM，它自己决定下一步调什么工具、按什么顺序、要不要循环，灵活但不可预测、成本也高，出错难复现。工程上我的原则是能用 Workflow 就别上 Agent，只有路径确实无法预先确定、需要动态探索时才用 Agent；也可以混用，外层用 Workflow 固定主流程，某个不确定节点交给 Agent。","keyPoints":["Tools 是具体函数或 API","Workflow 路径由人预设，稳定可控","Agent 由 LLM 动态决定控制流","能预设路径就用 Workflow，否则才上 Agent"],"followUp":["什么时候必须用 Agent？","Workflow 怎么保证可控性？"],"pitfalls":["所有任务都上 Agent。","忽略成本和不可预测性。"]}},{"id":"f283","question":"ReAct、Plan-and-Execute、Reflection 三种范式有什么区别？项目怎么选型？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Agent 开发」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：ReAct、Plan-and-Execute、Refle。","category":"Agent 开发","difficulty":"中等","tags":["ReAct","Plan-and-Execute","Reflection"],"answer":{"oral":"ReAct 是边想边做，每轮输出 Thought、Action、Observation，根据工具返回的结果决定下一步，适合需要动态交互、信息逐步明朗的任务。Plan-and-Execute 是先让模型把完整计划列出来再逐步执行，执行中也能重规划，适合步骤多、目标明确的长任务，减少来回试探，还能并行执行无依赖的步骤。Reflection 是生成之后自我批判、发现问题再重试，适合对质量要求高的写作和代码场景。选型上简单任务直接单次调用，中等用 ReAct，长流程用 Plan-and-Execute，高质量要求再叠加 Reflection，因为每加一层延迟和成本都会上升，还要设最大轮数。","keyPoints":["ReAct 边想边做，适合动态交互","Plan-and-Execute 先规划再执行，适合长任务","Reflection 生成后自检重试，适合高质量场景","按任务复杂度和延迟预算叠加使用"],"followUp":["ReAct 的循环怎么实现？","Plan-and-Execute 适合什么任务？"],"pitfalls":["把 CoT 当成 ReAct。","忽略最大步数和工具错误处理。"]}},{"id":"f284","question":"Agent 的记忆机制是什么？长短期记忆怎么设计、怎么存、粒度多少、怎么用？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":95,"frequencyReason":"「Agent 开发」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Agent 的记忆机制是什么长短期记忆怎么设计、怎么存、。","category":"Agent 开发","difficulty":"困难","tags":["Agent","Prompt"],"answer":{"oral":"记忆分短期和长期。短期就是当前上下文窗口里的对话，通常用滑动窗口保留最近 N 轮，更早的做摘要压缩，防止超 token。长期记忆落外部存储：语义记忆放向量库按相似度召回，事实和结构化信息放关系库或 KV，原始对话可以放文档库，事件型经历按时间线存成情节记忆。粒度上分会话级、事件级和实体级，实体级就是记住用户偏好、项目背景这种稳定信息，还可以加权重衰减，旧的、不常访问的降权或归档。用的时候在组装 Prompt 时按当前 query 动态检索注入，而不是把所有记忆一股脑塞进去，否则既费 token 又干扰判断。","keyPoints":["短期用上下文窗口和滑动窗口","长期落向量库、关系库或文档库","粒度分会话级、事件级和实体级","组装 Prompt 时按 query 动态检索注入"],"followUp":["短期记忆和长期记忆怎么存？","记忆如何按需检索注入？"],"pitfalls":["把所有历史都塞进上下文。","忽略记忆冲突和过期。"]}},{"id":"f285","question":"Agent 的推理模式有哪些？ReAct 具体怎么实现？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Agent 开发」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Agent 的推理模式有哪些ReAct 具体怎么实现。","category":"Agent 开发","difficulty":"困难","tags":["Agent","ReAct","CoT","ToT","Prompt","Thought"],"answer":{"oral":"常见的推理模式有 CoT，让模型一步步写出推理过程；ToT，把思路展开成多分支做搜索和回溯，适合需要探索的问题；ReAct，推理和行动交替，把工具结果作为新证据。ReAct 的实现主要靠 Prompt 模板，明确规定输出格式：先写 Thought 说明现在要干什么，再输出 Action 指定工具和参数，然后暂停等外部执行，把 Observation 结果拼回上下文，进入下一轮。代码上就是一个循环：调模型、解析输出、如果是 Action 就执行工具并追加结果、如果是 Final Answer 就结束；同时要处理解析失败、工具报错和最大步数。现在很多模型原生支持 function calling，Action 可以直接用结构化 tool_calls，比文本解析更稳。","keyPoints":["CoT 让模型逐步写出推理过程","ToT 展开多分支并搜索回溯","ReAct 用 Thought、Action、Observation 循环","靠 Prompt 模板约束格式，代码解析并执行工具"],"followUp":[],"pitfalls":[]}},{"id":"f286","question":"Agent 记忆压缩通常有哪些方法？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Agent 开发」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Agent 记忆压缩通常有哪些方法。","category":"Agent 开发","difficulty":"困难","tags":["Agent","LLM"],"answer":{"oral":"记忆压缩常用几种：一是 LLM 摘要，把多轮对话或长文档压成要点，保留关键事实、结论和待办，最好结构化输出；二是滑动窗口，只留最近若干轮，旧的直接丢或者归档到长期存储；三是检索式压缩，不提前压，等需要时按相似度只取相关片段；四是结构化，把流水账转成知识图谱或键值对，比如用户画像、任务状态，比自然语言更省 token 也更好查。实际会组合使用，近期保留原文保证细节，远期用摘要，重要实体单独沉淀。压缩要有损控，金额、时间、编号这类关键信息必须原样保留，还要防止摘要过程本身引入错误。","keyPoints":["LLM 摘要保留关键事实和结论","滑动窗口只保留最近若干轮对话","按相似度检索只取相关片段","结构化沉淀用户画像和任务状态"],"followUp":[],"pitfalls":[]}},{"id":"f287","question":"什么是 Multi-Agent？多 Agent 如何分工协作与动态切换？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":81,"frequencyReason":"「Agent 开发」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是 Multi-Agent多 Agent 如何分工协。","category":"Agent 开发","difficulty":"困难","tags":["Multi-Agent","Agent","Router","Manager","Worker"],"answer":{"oral":"Multi-Agent 是把复杂任务拆给多个角色，比如一个规划、一个写代码、一个审查、一个测试，每个 Agent 有自己的 Prompt、工具和职责。协作方式上可以是 Manager/Worker 的层级结构，Manager 拆任务分给 Worker 并汇总；也可以去中心化，Agent 之间通过消息总线或共享黑板通信。动态切换一般靠 Router Agent 按任务类型选合适的 Agent，或者用状态机按阶段切换。好处是职责清晰、可以并行、单个上下文压力小；难点在通信成本、结果一致性和调试，token 消耗往往是单 Agent 的好几倍。所以先用单 Agent 加工具，确实需要角色隔离和并行时再拆多 Agent。","keyPoints":["按角色拆分职责、Prompt 和工具","Manager/Worker 层级或去中心化协作","用消息总线或共享黑板通信","Router 按任务类型动态选 Agent"],"followUp":[],"pitfalls":[]}},{"id":"f288","question":"Agent 的反思机制是什么？为什么要用？怎么实现？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Agent 开发」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Agent 的反思机制是什么为什么要用怎么实现。","category":"Agent 开发","difficulty":"困难","tags":["Agent","Self-Critique"],"answer":{"oral":"反思就是让 Agent 在生成或执行之后，再站到审查者的角度检查一遍：目标达没达到、结果对不对、有没有遗漏，发现问题就带着具体的批评意见重试。之所以要，是因为大模型单次生成不可靠，尤其多步任务，前面一步错了后面全错。实现上一般加一个 Critic 角色或者一次自检调用，能用规则、单测、schema 校验、工具校验做客观验证就别只靠模型主观判断，把错误信息作为 Observation 反馈给模型让它修正，成功的经验也可以写进记忆下次复用。要设最大反思轮数，避免陷入无限自我怀疑，也要防止模型为了讨好审查者改坏本来正确的结果。","keyPoints":["生成后以审查者视角检查目标和结果","解决单次生成不可靠、多步容易跑偏","用规则、单测或工具做客观验证","把错误反馈给模型重试，限制反思轮数"],"followUp":[],"pitfalls":[]}},{"id":"f289","question":"复杂任务如何做任务拆分？为什么要拆分？效果如何提升？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":79,"frequencyReason":"「Agent 开发」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：复杂任务如何做任务拆分为什么要拆分效果如何提升。","category":"Agent 开发","difficulty":"困难","tags":["LLM","Planning"],"answer":{"oral":"复杂任务直接丢给模型，它容易漏步骤或者中途跑偏，所以要拆分。做法是让 LLM 先 Planning，把大目标递归拆成可执行的子任务，形成一棵任务树或者一个 DAG，标好依赖关系再逐个执行，每个子任务的结果作为下一个的输入，无依赖的可以并行。好处是每一步上下文更聚焦，突破单次上下文限制；子任务简单，准确率更高；某一步失败可以只重跑那一步，容错好；也方便人工介入和进度展示。拆完还要做结果汇总和一致性校验，避免各子任务结论冲突。拆分粒度不是越细越好，太细会放大调用次数和错误累积。","keyPoints":["LLM Planning 递归拆成子任务和依赖","每步上下文更聚焦，突破窗口限制","子任务简单，准确率和容错更高","失败可只重跑单步，也方便并行"],"followUp":[],"pitfalls":[]}},{"id":"f290","question":"Function Calling 与 Tool Calling 的实现原理是什么？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":93,"frequencyReason":"「Agent 开发」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Function Calling 与 Tool Call。","category":"Agent 开发","difficulty":"困难","tags":["Function","Calling","Tool","JSON","Schema","calls"],"answer":{"oral":"原理是先把每个工具的名称、用途、参数用 JSON Schema 描述清楚，一起放进请求里。模型推理时如果觉得需要调工具，不会直接输出自然语言，而是返回结构化的 tool_calls，包含调用 id、工具名和参数。客户端解析后真正执行这个函数，把结果作为 tool 角色的消息回填给模型，模型再基于结果继续推理或者给出最终答案。工程上要做好参数校验和权限控制，参数不符合 schema 直接拒绝而不是硬试；支持并行调用，一次返回多个 tool_calls；失败要有重试和错误信息回传，让模型自己纠错；还要防模型编造不存在的工具或参数，工具列表要按用户权限动态过滤。","keyPoints":["用 JSON Schema 描述工具名、用途和参数","模型返回结构化 tool_calls","客户端执行后把结果回填给模型","要校验参数、控制权限并处理失败重试"],"followUp":["tool_calls 怎么解析和执行？","工具参数怎么做校验？"],"pitfalls":["让模型直接执行自然语言指令。","忽略权限控制和错误回传。"]}},{"id":"f291","question":"MCP（Model Context Protocol）是什么？解决什么问题？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Agent 开发」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：MCP（Model Context Protocol）是。","category":"Agent 开发","difficulty":"困难","tags":["MCP","Model","Context","Protocol","Client","Server"],"answer":{"oral":"MCP 是模型上下文协议，由 Anthropic 提出，本质是把“模型怎么访问外部工具和数据”标准化，底层用 JSON-RPC 2.0。它定义 Client 和 Server 两方，Server 把能力暴露成三类：Tools 是可调用的函数，Resources 是可读的数据，Prompts 是预置的提示模板。传输上本地用 stdio，远程用 Streamable HTTP，早期的 HTTP 加 SSE 方案已经被替代。这样工具作者只要实现一次 MCP Server，Claude、Cursor 或者各种 Agent 框架都能接，不用为每个模型写一套适配。它还管了权限和本地接入，远程 Server 涉及 OAuth 授权，解决了工具生态碎片化的问题，但也带来了工具投毒这类新风险，接入前要审来源。","keyPoints":["标准化模型访问外部工具和数据的协议","Server 暴露 Tools、Resources、Prompts","一次实现可被多模型和框架复用","统一权限控制和本地工具接入"],"followUp":["MCP 的 Tools、Resources、Prompts 有什么区别？","MCP 和普通 API 调用有什么区别？"],"pitfalls":["把 MCP 当成模型协议。","忽略 Server 的权限边界。"]}},{"id":"f292","question":"Agent 如何控制成本、延迟和死循环？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Agent 开发」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：Agent 如何控制成本、延迟和死循环。","category":"Agent 开发","difficulty":"困难","tags":["Agent","Token"],"answer":{"oral":"成本、延迟和死循环要一起控。硬约束上设最大步数、总超时和 Token 预算，超了直接终止并返回已有结果。策略上做结果缓存，相同 query 或相同工具调用不重复跑；用模型路由，简单判断用小模型、复杂推理才上大模型；能并行的工具调用并行发，减少串行等待；上下文做压缩，只带必要信息；长任务拆成异步阶段，别让用户一直等。防死循环还要检测重复动作，同一个工具同样参数连续调用就直接打断，失败多次就熔断转人工兜底或返回降级答案。监控上按请求维度记 token、工具次数和耗时，找到最贵的那一步再优化。","keyPoints":["设最大步数、总超时和 Token 预算","缓存结果，按难度路由大小模型","并行工具调用，压缩上下文","检测重复动作，失败熔断转人工"],"followUp":[],"pitfalls":[]}},{"id":"f293","question":"Agent 如何评测与可观测？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":92,"frequencyReason":"「Agent 开发」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Agent 如何评测与可观测。","category":"Agent 开发","difficulty":"困难","tags":["Agent","Trace","LangSmith","LangFuse"],"answer":{"oral":"评测分结果和过程。结果上看任务成功率、答案正确率，要有离线数据集做回归，新版本上线前跑一遍，数据集要覆盖常见、边界和对抗样例。过程上看轨迹，工具选得对不对、参数对不对、步数合不合理、有没有多余调用，这些靠人工抽检加 LLM 裁判。可观测上要接 Trace，像 LangSmith、LangFuse，把每次请求的 Prompt、模型输出、工具调用、耗时和 token 都记下来，用 trace id 串起来，能回放整条链路，也可以接入 OpenTelemetry 做统一采集。再配成本、延迟、错误率的监控告警，线上出问题能快速定位是哪一步。","keyPoints":["结果看任务成功率和答案正确率","过程看工具选择、参数和步数","离线数据集做回归，人工加 LLM 裁判","Trace 记录 Prompt、调用、耗时和成本"],"followUp":["Agent 评测看哪些指标？","Trace 怎么落地？"],"pitfalls":["只看最终答案。","忽略工具调用轨迹和成本。"]}},{"id":"f294","question":"LangChain、LangGraph、LlamaIndex、AutoGen 如何选型？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":80,"frequencyReason":"「Agent 开发」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：LangChain、LangGraph、LlamaInd。","category":"Agent 开发","difficulty":"困难","tags":["LangChain","LangGraph","LlamaIndex","AutoGen","RAG","Agent"],"answer":{"oral":"看场景。LangChain 生态最全，链式编排、各种模型和工具适配都方便，适合快速搭原型，但抽象层多、出问题不好定位，复杂流程官方也引导到 LangGraph。LangGraph 把流程建模成图状态机，支持循环、分支、检查点和持久化、人工介入，适合要做复杂 Agent 和可控流程的场景，生产上更推荐。LlamaIndex 强在 RAG，文档解析、索引、检索策略做得很细，知识库类项目首选。AutoGen 偏多 Agent 对话协作，版本迭代快，选型要看维护状态。我的原则是原型用 LangChain，生产复杂流程用 LangGraph，纯 RAG 用 LlamaIndex，能自己写几十行搞定就不引框架。","keyPoints":["LangChain 生态全，适合快速原型","LangGraph 图状态机，适合复杂可控流程","LlamaIndex 强在 RAG 索引和检索","AutoGen 偏多 Agent 协作，按场景选"],"followUp":[],"pitfalls":[]}},{"id":"f295","question":"Agent 有哪些安全风险？如何防护？","source":"focus","sourceDetail":"面试重点.md","priority":"必背","frequency":"高频","frequencyScore":94,"frequencyReason":"「Agent 开发」必背题，面试出现频率高，建议能脱稿讲清机制、边界和一个项目例子。考点：Agent 有哪些安全风险如何防护。","category":"Agent 开发","difficulty":"困难","tags":["Agent","Prompt"],"answer":{"oral":"Agent 的安全风险比普通问答大，因为它真能动手。最典型的是 Prompt 注入，用户在输入里塞指令让它忽略规则；还有间接注入，比如检索到的网页、文档、邮件甚至工具返回里藏了恶意指令，Agent 读到就执行。然后是越权，模型被诱导调用不该调的工具或者查到别人的数据；还有数据泄露，把敏感信息写进回答或带到外部 API；MCP 场景还有工具投毒，恶意 Server 在工具描述里植入指令。防护上做最小权限，每个工具单独授权、按用户身份校验；高危操作比如转账、删除必须人工审批；工具参数白名单校验；输入输出过滤审核；执行环境放沙箱，限制网络和文件访问；工具描述也要校验来源。","keyPoints":["Prompt 注入包括间接注入，来源是文档和网页","最小权限，工具按用户身份鉴权","高危操作人工审批，参数白名单","沙箱隔离，输入输出都要审核"],"followUp":["Prompt 注入怎么防？","工具权限怎么最小化？"],"pitfalls":["只做输入过滤。","忽略间接注入和高危操作审批。"]}},{"id":"f296","question":"什么是上下文工程（Context Engineering）？和 Prompt 工程有什么区别？","source":"focus","sourceDetail":"面试重点.md","priority":"进阶","frequency":"中频","frequencyScore":82,"frequencyReason":"「Agent 开发」进阶题，通常作为基础题后的追问，重点掌握原理和适用场景。考点：什么是上下文工程（Context Engineering。","category":"Agent 开发","difficulty":"困难","tags":["Context","Engineering","Prompt","Token"],"answer":{"oral":"Prompt 工程关注的是“怎么说”，怎么组织指令、给例子、约束输出格式，对象是那一段提示词。上下文工程关注的是“喂什么”，是更大的一层：在有限的上下文窗口里，动态决定这一轮要带哪些检索结果、哪些记忆、哪些工具输出、哪些历史对话，怎么排序、怎么压缩、怎么裁剪，Token 预算怎么分配，以及什么时候该清空重来。因为模型能力越来越强，瓶颈往往不在指令写得好不好，而在有没有把正确、干净、必要的信息放到它面前，还要防止无关内容干扰和长上下文中间位置的信息丢失。","keyPoints":["Prompt 工程关注这一轮话怎么表达","上下文工程关注这一轮喂什么信息","在窗口内动态选择、排序、压缩和裁剪上下文","分配 Token 预算，保证信息正确且必要"],"followUp":[],"pitfalls":[]}}]}</script>
<script>
window.__DATA__ = JSON.parse(document.getElementById("__data_json").textContent);
</script>
<script>
(function(){
"use strict";

var DATA = window.__DATA__;
var META = DATA.meta;
var QUESTIONS = DATA.questions;

var STORE_PREFIX = "ivtool_focus_v1_";
function lsGet(key, fallback){
  try{
    var v = localStorage.getItem(STORE_PREFIX+key);
    if(v===null || v===undefined) return fallback;
    return JSON.parse(v);
  }catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(STORE_PREFIX+key, JSON.stringify(value)); }catch(e){}
}

/* ---------------- State ---------------- */
var state = {
  search: "",
  freqFilter: "all",
  filtered: [],
  currentId: null,
  sidebarOpen: false,
  desktopSidebarCollapsed: false,
  answerOpen: false
};

var favorites = lsGet("favorites", {});
var status = lsGet("status", {});
var catCollapsed = lsGet("catCollapsed", {});
var theme = lsGet("theme", null);

var byId = {};
QUESTIONS.forEach(function(q){ byId[q.id] = q; });

var catCounts = {};
QUESTIONS.forEach(function(q){ catCounts[q.category] = (catCounts[q.category]||0)+1; });

var categories = (META && META.categoryOrder && META.categoryOrder.length) ? META.categoryOrder.slice() : [];
(function(){
  var known = {};
  categories.forEach(function(c){ known[c]=true; });
  var rest = Object.keys(catCounts).filter(function(c){ return !known[c]; });
  rest.sort(function(a,b){ return catCounts[b]-catCounts[a]; });
  categories = categories.concat(rest);
})();

/* group a list of questions by category, then flatten back in the fixed
   category order above -- this is both the sidebar's rendering order and
   the actual prev/next navigation order, so the two always agree. */
function groupByCategory(list){
  var byCat = {};
  list.forEach(function(q){ (byCat[q.category] = byCat[q.category] || []).push(q); });
  var ordered = [];
  categories.forEach(function(cat){
    if(byCat[cat]) ordered = ordered.concat(byCat[cat]);
  });
  return { byCat: byCat, ordered: ordered };
}

/* ---------------- DOM refs ---------------- */
var $ = function(id){ return document.getElementById(id); };
var el = {
  app: $("app"),
  overlay: $("overlay"),
  sidebar: $("sidebar"),
  sidebarTitleText: $("sidebarTitleText"),
  closeSidebarBtn: $("closeSidebarBtn"),
  searchInput: $("searchInput"),
  freqFilterRow: $("freqFilterRow"),
  sidebarStats: $("sidebarStats"),
  sidebarListWrap: $("sidebarListWrap"),
  openSidebarBtn: $("openSidebarBtn"),
  toolTitle: $("toolTitle"),
  toolProgress: $("toolProgress"),
  randomBtn: $("randomBtn"),
  jumpBtnTop: $("jumpBtnTop"),
  darkModeBtn: $("darkModeBtn"),
  content: $("content"),
  questionCard: $("questionCard"),
  freqBadge: $("freqBadge"),
  favBtn: $("favBtn"),
  qTitle: $("qTitle"),
  masteryBtn: $("masteryBtn"),
  toggleAnswerBtnBottom: $("toggleAnswerBtnBottom"),
  answerPanel: $("answerPanel"),
  oralText: $("oralText"),
  keypointsList: $("keypointsList"),
  followupSection: $("followupSection"),
  followupList: $("followupList"),
  pitfallSection: $("pitfallSection"),
  pitfallList: $("pitfallList"),
  backTopBtn: $("backTopBtn"),
  bottomBar: $("bottomBar"),
  prevBtn: $("prevBtn"),
  nextBtn: $("nextBtn"),
  sheetOverlay: $("sheetOverlay"),
  bottomSheet: $("bottomSheet"),
  jumpOverlay: $("jumpOverlay"),
  jumpModal: $("jumpModal"),
  jumpInput: $("jumpInput"),
  jumpConfirm: $("jumpConfirm"),
  toast: $("toast")
};

/* ---------------- Utilities ---------------- */
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function mdLite(s){
  var t = escapeHtml(s);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return t;
}
function isDesktop(){ return window.innerWidth >= 900; }
function showToast(msg){
  el.toast.textContent = msg;
  el.toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ el.toast.classList.remove("show"); }, 2200);
}

/* ---------------- Theme ---------------- */
function applyTheme(){
  if(theme==="dark"){ document.documentElement.setAttribute("data-theme","dark"); el.darkModeBtn.textContent="☀️"; }
  else if(theme==="light"){ document.documentElement.setAttribute("data-theme","light"); el.darkModeBtn.textContent="🌙"; }
  else { document.documentElement.removeAttribute("data-theme"); el.darkModeBtn.textContent="🌗"; }
}
el.darkModeBtn.addEventListener("click", function(){
  if(theme==="dark") theme="light";
  else if(theme==="light") theme=null;
  else theme="dark";
  lsSet("theme", theme);
  applyTheme();
});

/* ---------------- Layout mode ---------------- */
function updateLayoutMode(){
  document.body.classList.toggle("desktop", isDesktop());
  if(isDesktop()){
    el.sidebar.classList.remove("open");
    el.overlay.classList.remove("show");
  }
}
window.addEventListener("resize", updateLayoutMode);

/* ---------------- Sidebar open/close ---------------- */
function openSidebar(){
  if(isDesktop()){
    state.desktopSidebarCollapsed = false;
    el.sidebar.classList.remove("collapsed");
    return;
  }
  state.sidebarOpen = true;
  el.sidebar.classList.add("open");
  el.overlay.classList.add("show");
  scrollCurrentIntoView();
}
function closeSidebar(){
  if(isDesktop()){
    return;
  }
  state.sidebarOpen = false;
  el.sidebar.classList.remove("open");
  el.overlay.classList.remove("show");
}
el.openSidebarBtn.addEventListener("click", function(){
  if(isDesktop()){
    el.sidebar.classList.toggle("collapsed");
  } else {
    openSidebar();
  }
});
el.closeSidebarBtn.addEventListener("click", closeSidebar);
el.overlay.addEventListener("click", closeSidebar);

/* swipe-to-close sidebar on mobile */
(function(){
  var sx=0, sy=0, tracking=false;
  el.sidebar.addEventListener("touchstart", function(e){
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
  }, {passive:true});
  el.sidebar.addEventListener("touchmove", function(e){
    if(!tracking) return;
    var t=e.touches[0];
    var dx=t.clientX-sx, dy=t.clientY-sy;
    if(dx<-40 && Math.abs(dx)>Math.abs(dy)){ closeSidebar(); tracking=false; }
  }, {passive:true});
  el.sidebar.addEventListener("touchend", function(){ tracking=false; });
})();

/* ---------------- Sidebar title (static, content-derived) ---------------- */
function initSidebarTitle(){
  el.sidebarTitleText.textContent = (META && (META.catalogTitle || META.title)) || "面试题库";
}

/* ---------------- Category group collapse state ----------------
   catCollapsed[cat] is only ever written by an explicit user click on a
   group header (see toggleCatCollapsed) and, once set, always wins -- that
   is what lets a group that was auto-opened (because it holds the current
   question, or because a filter is active) still be collapsed by tapping
   it, and what lets a group the user explicitly collapsed stay collapsed
   even after filtering by 高频/中频/低频/收藏/已掌握 etc. Only while nothing
   has been explicitly chosen for this category do we fall back to
   "auto-open while a filter is active, otherwise auto-open the current
   question's group, otherwise start collapsed". */
function isCatCollapsed(cat){
  if(catCollapsed[cat] === true) return true;
  if(catCollapsed[cat] === false) return false;
  if(activeFilterOn()) return false; // default (until overridden): auto-expand every matching group while searching/filtering
  var cur = byId[state.currentId];
  if(cur && cur.category===cat) return false; // first-time default: keep current question's group open
  return true; // first-time default: everything else starts collapsed
}
function toggleCatCollapsed(cat){
  var collapsedNow = isCatCollapsed(cat);
  catCollapsed[cat] = collapsedNow ? false : true;
  lsSet("catCollapsed", catCollapsed);
  renderList();
}
function activeFilterOn(){
  return !!state.search || state.freqFilter!=="all";
}

/* ---------------- Search & freq filter ---------------- */
var searchDebounce;
el.searchInput.addEventListener("input", function(){
  clearTimeout(searchDebounce);
  var v = el.searchInput.value;
  searchDebounce = setTimeout(function(){
    state.search = v.trim().toLowerCase();
    applyFilters(true);
  }, 150);
});
el.searchInput.addEventListener("keydown", function(e){
  if(e.key==="Enter"){
    el.searchInput.blur();
    if(!isDesktop()) closeSidebar();
  }
});

el.freqFilterRow.addEventListener("click", function(e){
  var btn = e.target.closest(".chip");
  if(!btn) return;
  state.freqFilter = btn.getAttribute("data-freq");
  Array.prototype.forEach.call(el.freqFilterRow.querySelectorAll(".chip"), function(c){
    c.classList.toggle("active", c===btn);
  });
